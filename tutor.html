    q: 'What causes the intrapleural pressure to be subatmospheric during rest?<br>i = lung and chest wall pull outward<br>ii = lung and chest wall pull inward<br>iii = lung elastic recoil tends to pull the lung inward and away from the chest wall<br>iv = thoracic wall elastic recoil tends to pull the chest wall outward and away from the lung',
    o: ['i', 'ii', 'iii', 'iv', 'iii and iv'], a: 4,
    ex: 'At FRC the lung recoils inward and the chest wall springs outward. Pulling the two pleural layers apart in opposite directions makes the pressure between them negative (about −5 cmH₂O).' },
  { t: 'q', id: 'M5', src: 'AC79', keep: true,
    q: 'Consider the graph shown below regarding the changes of intrapleural pressure in each breathing cycle. The inspiratory airflow is the maximum at which point of the graph?',
    fig: CVS.fig('ac79-pleuralgraph', 'AC79: intrapleural pressure through one breath, points A–E.', 'ac79', 7),
    o: ['A', 'B', 'C', 'D', 'E'], a: 1,
    ex: 'Inspiration runs from A down to C. Flow is fastest in mid-inspiration, where intrapleural (and alveolar) pressure is falling most steeply: B. At C inspiration ends and flow is zero.',
    flag: 'PS81 edit keys B; an older AC79 key gave C. C is end-inspiration, where flow stops.' },
  { t: 'q', id: 'M6', src: 'AC80', core: true, keep: true,
    q: 'จากภาพ transpulmonary pressure ขณะหายใจเข้าจนสุดเป็นเท่าไร (mm H₂O) <span class="muted">From the figure, what is the transpulmonary pressure at the end of a full inspiration? (the graph is in cmH₂O)</span>',
    fig: CVS.fig('ac80-ppl', 'AC80: intrapleural pressure during one breath (−5 to −8 cmH₂O).', 'ac80', 4),
    o: ['5', '6', '7', '8', '9'], a: 3,
    ex: 'Transpulmonary pressure = alveolar − intrapleural. At end-inspiration alveolar pressure is back to 0 and intrapleural pressure is at its lowest, −8: 0 − (−8) = 8.',
    flag: 'The recall wrote mm H₂O; the graph is in cmH₂O.' },
  { t: 'q', id: 'M7', src: 'AC79 · AC81', keep: true,
    q: 'A girl is blowing a balloon as much as she can that it makes the balloon volume close to the total lung capacity. Which of the following muscles can create the most expiratory effort?',
    o: ['Diaphragm + rectus abdominis', 'Diaphragm + sternocleidomastoid', 'Internal intercostal + rectus abdominis', 'Internal abdominal oblique + rectus abdominis', 'Diaphragm + external intercostal'], a: 3,
    ex: 'Maximal expiration comes from the abdominal muscles (rectus, obliques, transversus), which push the diaphragm up. The internal intercostals help, but the abdominal wall is far stronger. The diaphragm, SCM and external intercostals are inspiratory.',
    flag: 'AC81 asked the same (“rectus abdominis + internal oblique muscle”).' },
  { t: 'c', id: 'M-C2', title: 'Elastic recoil, surface tension, surfactant and the relaxation curve', src: 'Mechanics p.13–19',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Lung elastic recoil</b> comes from tissue elastin/collagen fibers and alveolar liquid {{surface tension}}.</li>' +
      '<li><b>Surfactant</b> — mainly {{dipalmitoyl phosphatidylcholine}} ({{DPPC}}) from Type II cells — inserts hydrophobic tails at the air-water interface to lower interfacial tension and reduce lung elastic recoil.</li>' +
      '<li><b>Small vs large alveoli</b> (p.16): smaller alveoli have {{more surfactant per unit area}} than larger alveoli, giving smaller alveoli a {{lower elastic recoil force}} so they expand {{more easily}} during inspiration.</li>' +
      '<li><b>Thoracic elastic recoil</b>: at rest, the chest wall pulls {{outward}}, opposing the {{inward}} pull of the lungs.</li>' +
      '<li><b>Lung-thorax relaxation curve</b>: at {{FRC}} (~40% VC), lung pull equals chest wall pull in magnitude (net relaxation pressure = 0); the chest wall alone reaches its neutral position at ~60–70% VC, while an unsealed lung collapses to {{minimal air}}.</li></ul></div>' +
      CVS.fig('mech-relax', 'Lung-thorax relaxation pressure curve showing the balance of lung and chest wall recoil at FRC.', 'mech', 18) + '</div>' },
  { t: 'q', id: 'M8', src: 'AC81', keep: true,
    q: 'What is the role of surfactant?',
    o: ['Decrease alveolar recoil', 'Increase alveolar elastic work force'], a: 0,
    ex: 'Surfactant lowers surface tension, which reduces the recoil of the alveoli, raises compliance and cuts the elastic work of breathing.',
    flag: 'Only two options were recalled.' },
  { t: 'c', id: 'M-C3', title: 'Lung and chest wall compliance (static vs dynamic)', src: 'Mechanics p.20–25',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Definition</b>: compliance {{C = &Delta;V / &Delta;P}} (in {{L/cmH2O}}), measuring distensibility ({{inversely proportional}} to elastic recoil). On the normal curve (p.20), &Delta;V = 0.5 L for &Delta;P<sub>TP</sub> = 2.5 cmH<sub>2</sub>O gives C<sub>L</sub> = {{0.2 L/cmH2O}}.</li>' +
      '<li><b>Combined lung-thorax compliance</b>: {{1/C(lung-thorax) = 1/C(lung) + 1/C(thorax)}}, so total system compliance (~0.1 L/cmH<sub>2</sub>O) is always less than either alone.</li>' +
      '<li><b>Static compliance</b>: measured during {{no airflow}} (breath-hold), reflecting pure elastic properties.</li>' +
      '<li><b>Dynamic compliance</b>: measured during {{active breathing}} at points of zero flow; influenced by both elastic recoil and airway resistance.</li>' +
      '<li><b>Disease shifts</b>: {{emphysema}} destroys alveolar walls &rarr; &darr; elastic recoil &rarr; {{increased compliance}} (curve shifts up/left); {{pulmonary fibrosis}} stiffens the lung &rarr; &uarr; elastic recoil &rarr; {{decreased compliance}} (curve shifts down/right).</li></ul></div>' +
      CVS.fig('mech-compliance', 'Static lung compliance curves in alveolar septal destruction, normal lung, and interstitial stiffening.', 'mech', 24) + '</div>' + '<p class="note"><b>From the past papers</b> · Compliance is the slope of the pressure–volume curve: the steeper the curve, the more compliant the lung (AC81).</p>' },
  { t: 'q', id: 'M9', src: 'AC81', core: true, keep: true,
    q: 'Compare the lung compliance.',
    fig: CVS.fig('ac81-compliance', 'AC81: pressure–volume curves of three lungs, S, T and U.', 'ac81', 8),
    o: ['S>T>U', 'S<T<U', 'S=T=U', 'S<T>U', 'S>T<U'], a: 0,
    ex: 'Compliance = ΔV/ΔP, the slope of the curve. S rises most steeply, then T, then U.' },
  { t: 'q', id: 'M10', src: 'AC79 (made up partly by the recall team)', core: true, keep: true,
    q: 'A 49-year-old man comes to the doctor from worsening dyspnea upon exertion for the past 2 months. Chest examination reveals decreased chest wall movement and wheezing noise when breathing. The pulmonary function test and arterial blood gas results are as follows:<div class="tblwrap"><table class="tbl compact"><thead><tr><th>Parameter</th><th>Predicted</th><th>Measured</th><th>% Predicted</th><th>Post-BD</th></tr></thead><tbody><tr><td>FVC</td><td>4.99 L</td><td>4.12 L</td><td>83%</td><td>3.95 L</td></tr><tr><td>FEV₁</td><td>3.97 L</td><td>2.12 L</td><td>53%</td><td>2.75 L</td></tr><tr><td>FEV₁/FVC</td><td></td><td>51%</td><td></td><td>70%</td></tr></tbody></table></div>ABG: pH 7.37, pCO₂ 50 mmHg, [HCO₃⁻] 28 mEq/L. Which of the following is <b>incorrect</b> regarding the pathophysiology underlying this patient’s symptoms and test results?',
    o: ['Increased alveolar dead space', 'Dynamic compression of airways', 'Decreased Hb-O₂ affinity', 'Decreased compliance of lungs', 'Increased FRC'], a: 3,
    ex: 'This is obstructive disease with CO₂ retention (COPD pattern). Emphysema destroys elastic tissue, so lung compliance goes up, not down. Dead space, dynamic compression, a right-shifted curve from high CO₂, and air trapping (raised FRC) all fit.' },
  { t: 'c', id: 'M-C4', title: 'Airway resistance, radial traction and dynamic compression in COPD', src: 'Mechanics p.26–37',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Poiseuille law</b>: Flow = &Delta;P / R and {{R = 8&eta;l / (&pi;r4)}} — airway radius {{r to the fourth power}} is the dominant determinant of resistance.</li>' +
      '<li><b>Sites of airway resistance</b> (p.29): nose-mouth {{50%}}, glottis {{25%}}, trachea &amp; bronchi &gt;2 mm {{15%}}, small airways &lt;2 mm only {{10%}} because vast parallel branching gives huge {{total cross-sectional area}} (e.g. 180 cm<sup>2</sup> at generation 16 vs 2.54 cm<sup>2</sup> in trachea).</li>' +
      '<li><b>Inspiration vs forced expiration</b>: during inspiration, negative P<sub>pl</sub> and alveolar {{radial traction}} (mechanical tethering) pull airways open; during forced expiration, positive P<sub>pl</sub> (+25 cmH<sub>2</sub>O) causes {{dynamic compression}} when P<sub>pl</sub> exceeds intraluminal airway pressure.</li>' +
      '<li><b>COPD &amp; autonomic tone</b>: loss of elastic recoil in COPD/emphysema causes early airway closure and {{air trapping}} (dynamic hyperinflation); {{parasympathetic}} stimulation causes bronchoconstriction (&uarr; R) while {{sympathetic}} stimulation causes bronchodilation (&darr; R).</li></ul></div>' +
      '<div class="stack">' + CVS.fig('mech-resistance', 'Airway resistance vs airway generation and velocity vs aggregate cross-sectional area.', 'mech', 28) +
      CVS.fig('mech-compress', 'Passive vs forced expiration showing positive pleural pressure and dynamic airway compression.', 'mech', 31) + '</div></div>' },
  { t: 'q', id: 'M11', src: 'AC80 · AC81', core: true, keep: true,
    q: 'What is the most important factor limiting forced expiration from total lung capacity to residual volume?',
    o: ['Action of diaphragm', 'Dynamic compression of the airway', 'Elasticity of the airway', 'Rate of contraction of expiratory muscles', 'Increases sympathetic stimulation of smooth muscles of the airway'], a: 1,
    ex: 'In forced expiration intrapleural pressure turns positive and squeezes the airways at the equal-pressure point. Beyond that point more effort only compresses the airway further, so flow is effort-independent.' },
  { t: 'c', id: 'M-C5', title: 'Airflow patterns, normal breath sounds and work of breathing', src: 'Mechanics p.38–44',
    html: '<div class="two"><div class="stack"><div class="tblwrap"><table class="tbl"><thead><tr><th>Breath sound</th><th>Insp : Exp &amp; pitch</th><th>Normal location</th></tr></thead><tbody>' +
      '<tr><td><b>Vesicular</b></td><td>{{Insp &gt; Exp}}, soft, low (&le;200 Hz)</td><td>{{Over most of both lungs}}</td></tr>' +
      '<tr><td><b>Bronchovesicular</b></td><td>Insp = Exp, medium pitch</td><td>{{1st–2nd ICS anteriorly}} &amp; between scapulae</td></tr>' +
      '<tr><td><b>Bronchial</b></td><td>{{Exp &gt; Insp}} (with gap), loud, high (&ge;400 Hz)</td><td>Over {{manubrium}}</td></tr>' +
      '<tr><td><b>Tracheal</b></td><td>Insp = Exp, very loud, high pitch</td><td>Over {{extrathoracic trachea}} in neck</td></tr></tbody></table></div>' +
      '<ul class="pts">' +
      '<li><b>Airflow regimes</b> (p.38): {{laminar flow}} in small peripheral airways (&Delta;P &propto; viscosity), {{turbulent flow}} in trachea/large airways at high flow (&Delta;P &propto; gas density), and {{transitional flow}} at branch points.</li>' +
      '<li><b>Work of breathing at rest</b> (Work = P &times; V, p.40): {{65%}} overcomes elastic resistance, {{25%}} overcomes airway resistance, and {{10%}} overcomes tissue viscous resistance.</li>' +
      '<li><b>Disease loops</b> (p.43): restrictive disease (pulmonary fibrosis) increases {{elastic work}}; obstructive disease (COPD) increases {{airway resistance work}} and active expiratory work.</li></ul></div>' +
      CVS.fig('mech-work', 'Pressure-volume work-of-breathing loops in restrictive lung disease (a) and obstructive lung disease (b).', 'mech', 43) + '</div>' },
  { t: 'q', id: 'M12', src: 'AC80', keep: true,
    q: 'Which of the following will increase as a result from contraction of bronchial smooth muscle?',
    o: ['Lung compliance', 'Airway diameter', 'Elastic work of breathing', 'Resistive work of breathing', 'Anatomic dead space'], a: 3,
    ex: 'Bronchoconstriction narrows the airways, and resistance rises steeply (R ∝ 1/r⁴), so the resistive (non-elastic) work of breathing goes up. Compliance and elastic work are properties of the stretchy tissue; the anatomic dead space falls slightly.' },
  { t: 'q', id: 'M13', src: 'AC81', keep: true,
    q: 'What is the characteristic of vesicular breath sounds?',
    o: ['Soft, low pitch', 'High pitch', 'Expiratory time longer than inspiratory time'], a: 0,
    ex: 'Vesicular sounds, heard over most of the lung, are soft and low-pitched, with inspiration longer than expiration. Bronchial sounds are loud and high-pitched with a long expiratory phase.' }
]});

/* Section E: Alveolar Ventilation, Diffusion, Perfusion Limitation & V/Q Matching (681114-1 Gas exchange.pdf, 72 pages). */
CVS.add({ id: 'E', short: 'Gas exchange', title: 'Alveolar Ventilation, Diffusion, Perfusion Limitation & V/Q Matching', kind: 'Lecture',
  blurb: 'Dalton and Henry laws, the partial pressure cascade and alveolar gas equation, Fick diffusion and DLCO, O2 content, perfusion vs diffusion limitation, regional V/Q differences, dead space, shunt, A-a gradient, and exercise ventilation.',
  items: [
  { t: 'c', id: 'E-C1', title: 'Partial pressure cascade, alveolar gas equation & alveolar ventilation', src: 'Gas exchange p.7–12, 15',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Dalton’s law</b> (P<sub>gas</sub> = P<sub>total</sub> &times; F<sub>gas</sub>): dry inspired air at sea level has P<sub>O2</sub> = 760 &times; 0.21 = {{160 mmHg}}.</li>' +
      '<li><b>Humidified tracheal air</b>: water vapor dilutes inspired air (P<sub>H2O</sub> = {{47 mmHg}} at 37&deg;C), so P<sub>IO2</sub> = (760 &minus; 47) &times; 0.21 = {{150 mmHg}}.</li>' +
      '<li><b>Alveolar gas equation</b>: P<sub>AO2</sub> = P<sub>IO2</sub> &minus; ({{PACO2 / R}}) + F. With normal respiratory quotient R = 0.8 and P<sub>ACO2</sub> = 40 mmHg, P<sub>AO2</sub> = 150 &minus; (40 / 0.8) = <b>100 mmHg</b> (103 mmHg on the shunt diagram). Macronutrient RQ: carbohydrates {{1.0}}, proteins ~0.8, fats {{0.7}}.</li>' +
      '<li><b>Physiologic shunt</b>: normal arterial P<sub>aO2</sub> is <b>97 mmHg</b> (slightly below P<sub>AO2</sub>) because <b>2%</b> of cardiac output bypasses alveolar capillaries via the {{bronchial}} artery and coronary {{thebesian}} veins.</li>' +
      '<li><b>Henry’s law</b>: dissolved [O<sub>2</sub>] = P<sub>O2</sub> &times; {{0.003}} mL O<sub>2</sub>/100 mL blood/mmHg (= 0.3 mL/dL at P<sub>aO2</sub> 100 mmHg; only free dissolved molecules generate partial pressure).</li>' +
      '<li><b>Alveolar ventilation</b>: V&#775;<sub>A</sub> = {{(TV &minus; DS) &times; RR}} (whereas minute ventilation = TV &times; RR).</li></ul></div>' +
      CVS.fig('exch-shunt-phys', 'Oxygen cascade from dry air to arterial blood, showing the 2% anatomic/physiologic shunt.', 'exch', 8) + '</div>' },
  { t: 'q', id: 'E1', src: 'AC81', core: true, keep: true,
    q: 'A 75-kg man has a dead space of 150 mL. What tidal volume (TV) and respiratory rate (RR) are required to maintain normal alveolar ventilation if his cardiac output is 5 L/min?',
    o: ['TV 250, RR 10', 'TV 450, RR 10', 'TV 350, RR 10', 'TV 550, RR 10', 'TV 750, RR 10'], a: 3,
    ex: 'Normal V/Q is about 0.8, so with a cardiac output of 5 L/min alveolar ventilation should be about 4 L/min. V̇A = (TV − dead space) × RR = (550 − 150) × 10 = 4,000 mL/min.' },
  { t: 'q', id: 'E2', src: 'AC79', core: true, keep: true,
    q: 'A medical student waiting to do the first patient interview becomes anxious and his respiratory rate is increased. If the rate of carbon dioxide production is constant, which of the following parameters is decreased?',
    o: ['P<sub>alveolar</sub>O₂', 'Work of breathing', 'Pulmonary blood flow', 'The level of carbon dioxide at the end of an exhaled breath (ETCO₂)', 'V/Q ratio'], a: 3,
    ex: 'More alveolar ventilation with the same CO₂ production washes CO₂ out, so PACO₂ and end-tidal CO₂ fall, while PAO₂, work of breathing and V/Q go up.',
    flag: 'PS81 edit keys ETCO₂; an older AC79 key gave PAO₂, which actually rises when you hyperventilate.' },
  { t: 'c', id: 'E-C2', title: 'Fick’s law of diffusion, Graham’s law & DLCO', src: 'Gas exchange p.18–24, 41',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Blood–gas barrier</b> (alveolar epithelium, fused basement membrane, capillary endothelium): thickness T is as thin as {{0.3 &mu;m}} across a surface area A of {{50–100 m&sup2;}}.</li>' +
      '<li><b>Fick’s &amp; Graham’s laws</b>: V&#775;<sub>gas</sub> = [D &times; A &times; (P<sub>1</sub> &minus; P<sub>2</sub>)] / T = D<sub>L</sub> &times; (P<sub>1</sub> &minus; P<sub>2</sub>), where D<sub>L</sub> = (D &times; A) / T and diffusion coefficient D &prop; {{Solubility / &radic;MW}}.</li>' +
      '<li><b>CO<sub>2</sub> vs O<sub>2</sub></b>: CO<sub>2</sub> solubility in water is {{24.2 times}} higher than O<sub>2</sub> (0.592 vs 0.0244) while &radic;(44/32) is only 1.17&times; heavier, so CO<sub>2</sub> diffuses {{20 times}} faster than O<sub>2</sub> (relative D: O<sub>2</sub> = 1, CO<sub>2</sub> = 20, CO = 0.81, N<sub>2</sub> = 0.53, He = 0.25).</li>' +
      '<li><b>D<sub>LCO</sub> (T<sub>LCO</sub>)</b>: normal value is about {{25 mL/min/mmHg}} (normal range 80–120% predicted in men, 76–120% in women).</li>' +
      '<li><b>Low D<sub>LCO</sub> (&lt;80%)</b>: &downarrow; area ({{emphysema}}, lung resection), &uparrow; thickness (fibrosis), or false-low from &downarrow; gradient (smoking), &downarrow; perfusion ({{Valsalva maneuver}}, pulmonary embolism, pulmonary hypertension, extrapulmonary R-to-L shunt), or &downarrow; Hb (anemia).</li>' +
      '<li><b>High D<sub>LCO</sub> (&gt;120%)</b>: &uparrow; perfusion ({{M&uuml;ller’s maneuver}} [inhaling against a closed glottis], pulmonary hemorrhage, early congestion, L-to-R shunt, exercise, fever) or &uparrow; Hb ({{polycythemia}}).</li></ul></div>' +
      CVS.fig('exch-fick', 'Fick’s law of diffusion, diffusion coefficient (D), and lung diffusing capacity (DL).', 'exch', 24) + '</div>' },
  { t: 'q', id: 'E3', src: 'AC80', core: true, keep: true,
    q: 'Which of the following will <i>decrease</i> the diffusion of gases from the alveoli to the pulmonary capillaries?',
    o: ['Increased alveolar–capillary partial pressure gradient of O₂', 'Increased alveolar surface area', 'Increased thickness of the respiratory membrane', 'Increased pulmonary capillary blood flow', 'Increased solubility of the gas'], a: 2,
    ex: 'Fick’s law: diffusion ∝ area × gradient × solubility / (thickness × √MW). A thicker membrane (fibrosis, edema) slows diffusion.',
    flag: 'AC80 asked it twice (the second version had three options).' },
  { t: 'q', id: 'E4', src: 'AC80', core: true, keep: true,
    q: 'In the human respiratory system, both oxygen (O₂) and carbon dioxide (CO₂) gases can diffuse across the alveolar–capillary membrane. According to Graham’s law of diffusion, and considering the higher solubility of carbon dioxide, approximately how many times faster does carbon dioxide diffuse through the alveolar membrane compared to oxygen?',
    o: ['0.85', '2', '20', '24', '200'], a: 2,
    ex: 'Graham: rate ∝ 1/√MW, so CO₂ (44) is about 0.85 × as fast as O₂ (32). But CO₂ is about 24 × more soluble. 0.85 × 24 ≈ 20 times faster.',
    flag: 'AC80 asked it twice.' },
  { t: 'q', id: 'E5', src: 'AC81', keep: true,
    q: 'Which of the following can cause a significant increase in DLCO?',
    o: ['Fever', 'Pulmonary embolism', 'Emphysema', 'Pulmonary fibrosis', 'Severe anemia'], a: 0,
    ex: 'The lecture lists fever with exercise, polycythemia, pulmonary hemorrhage and left-to-right shunt as causes of a high DLCO (more capillary blood). Embolism, emphysema, fibrosis and anemia lower it.' },
  { t: 'c', id: 'E-C3', title: 'O2 content, capillary transit time & perfusion vs diffusion limitation', src: 'Gas exchange p.26–32, 36–40',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Total O<sub>2</sub> content</b> = (Hb &times; {{1.34}} &times; S<sub>O2</sub>) + (P<sub>O2</sub> &times; 0.003). At normal [Hb] = 15 g/dL:</li>' +
      '<li><b>Arterial blood</b> (S<sub>aO2</sub> 100%, P<sub>aO2</sub> 100 mmHg): 20.1 + 0.3 = {{20.4 mL/dL}} (~20 mL/dL). <b>Venous blood</b> (S<sub>vO2</sub> 75%, P<sub>vO2</sub> 40 mmHg): 15.07 + 0.12 = {{15.19 mL/dL}} (~15 mL/dL). Thus 100 mL blood gains 5 mL O<sub>2</sub> (5 L/min CO &rarr; <b>250 mL O<sub>2</sub>/min</b>).</li>' +
      '<li><b>Capillary transit time</b>: RBCs spend {{0.75 s}} in the pulmonary capillary at rest (HR 80 bpm). Normal O<sub>2</sub> equilibrates in {{0.25 s}} (<b>1/3</b> of transit time), leaving a 0.50 s safety margin.</li>' +
      '<li><b>{{Perfusion-limited}} exchange</b> (<b>N<sub>2</sub>O, CO<sub>2</sub>, and O<sub>2</sub> at rest</b>): gas equilibrates early along the capillary (N<sub>2</sub>O in {{0.075 s}} = 1/10 of transit time because it does not bind Hb); total transfer can only be increased by increasing pulmonary blood flow.</li>' +
      '<li><b>{{Diffusion-limited}} exchange</b> ({{Carbon monoxide (CO)}} always; <b>O<sub>2</sub> in emphysema, fibrosis, or strenuous exercise</b>): gas fails to equilibrate by the end of the capillary because CO binds tightly to Hb without raising dissolved plasma P<sub>CO</sub>, maintaining the partial pressure gradient throughout the capillary.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('exch-perf-lim', 'Early capillary equilibration of O2 and N2O (flow-dependent uptake).', 'exch', 37) + CVS.fig('exch-diff-lim', 'Uptake of CO and of O2 in lung disease across the capillary length.', 'exch', 38) + '</div></div>' },
  { t: 'q', id: 'E6', src: 'AC80', keep: true,
    q: 'ออกกำลังกายที่สูง 5000 เมตร ให้ตาราง PaO₂ ก่อนออกกำลังกายเทียบหลังออก<div class="tblwrap"><table class="tbl compact"><thead><tr><th></th><th>PaO₂ ก่อน (rest)</th><th>PaO₂ หลัง (exercise)</th></tr></thead><tbody><tr><td>ระดับน้ำทะเล (sea level)</td><td class="num">92</td><td class="num">92</td></tr><tr><td>ที่สูง 5000 m</td><td class="num">50</td><td class="num">40</td></tr></tbody></table></div>ถามว่าอะไรคือกลไกที่ทำให้ PO₂ ลดลงเมื่อออกกำลังกายในที่สูงเมื่อเทียบกับภาวะพักในที่สูง <span class="muted">Exercise at 5,000 m: what lowers PaO₂ during exercise at altitude compared with rest at altitude?</span>',
    o: ['Increase shunt fraction', 'Increase dead space fraction', 'Decrease blood transit time', 'Hyperventilation'], a: 2,
    ex: 'Exercise speeds blood through the capillary (transit time can fall below 0.25 s). At sea level that is still enough time, but at altitude the small alveolar–capillary gradient makes O₂ uptake slow, so it becomes diffusion-limited and PaO₂ falls.' },
  { t: 'c', id: 'E-C4', title: 'Regional ventilation, perfusion & V/Q ratio from apex to base', src: 'Gas exchange p.43–51',
    html: '<div class="two"><div class="stack"><div class="tblwrap"><table class="tbl"><thead><tr><th>Feature (upright lung)</th><th>Apex</th><th>Base</th></tr></thead><tbody>' +
      '<tr><td><b>Intrapleural pressure (P<sub>pl</sub>)</b></td><td>More negative ({{&minus;10 cmH2O}})</td><td>Less negative ({{&minus;2 cmH2O}})</td></tr>' +
      '<tr><td><b>Transpulmonary pressure</b></td><td>Greater (+10 cmH<sub>2</sub>O)</td><td>Lower (+2 cmH<sub>2</sub>O)</td></tr>' +
      '<tr><td><b>Resting alveolar size (at FRC)</b></td><td>{{Largest resting size}}</td><td>{{Smallest resting size}}</td></tr>' +
      '<tr><td><b>Alveolar compliance &amp; V&#775;<sub>A</sub></b></td><td>{{Less compliant}} &rarr; <b>less ventilation</b></td><td>{{More compliant}} &rarr; <b>more ventilation</b></td></tr>' +
      '<tr><td><b>Arterial pressure, PVR &amp; Q&#775;</b></td><td>Lower P<sub>a</sub>, higher PVR &rarr; <b>much less perfusion</b></td><td>Higher P<sub>a</sub>, lower PVR &rarr; <b>much more perfusion</b></td></tr>' +
      '<tr><td><b>V/Q ratio</b></td><td>{{Highest V/Q}} (&gt;1; wasted ventilation)</td><td>{{Lowest V/Q}} (&lt;0.8; relative underventilation)</td></tr></tbody></table></div>' +
      '<p class="note"><b>Overall normal V/Q</b>: with TV = 500 mL, DS = 150 mL, RR = 12/min, V&#775;<sub>A</sub> = (500 &minus; 150) &times; 12 = <b>4200 mL/min</b> and cardiac output Q&#775; = <b>5000 mL/min</b>, giving overall V/Q = 4200 / 5000 = {{0.84}} (normal range 0.8–1.0). In the supine position, blood flow becomes nearly uniform from apex to base (ventral vs dorsal).</p></div>' +
      CVS.fig('exch-vq-zones', 'Regional differences in ventilation, perfusion, and V/Q ratio from apex to base in the upright lung.', 'exch', 50) + '</div>' },
  { t: 'q', id: 'E7', src: 'AC79', core: true, keep: true,
    q: 'Which of the following parameters is greater in the apex of the lung than the base of the lung in upright position?',
    o: ['Perfusion', 'Ventilation', 'V/Q ratio', 'Intrapleural pressure', 'Compliance'], a: 2,
    ex: 'Both ventilation and perfusion are lower at the apex, but perfusion falls much more, so V/Q is highest at the apex (about 3). Apical alveoli are already stretched, so their compliance is lower; intrapleural pressure is more negative there.' },
  { t: 'q', id: 'E8', src: 'AC81', keep: true,
    q: 'What is true regarding the lung apex compared to the lung base in an upright position?',
    o: ['Higher ventilation', 'The upper alveoli are larger than the lower ones', 'Higher blood flow'], a: 1,
    ex: 'Intrapleural pressure is more negative at the apex, so apical alveoli are more distended (largest alveoli at the apex, Gas exchange p.43). Ventilation and blood flow are both higher at the base.',
    flag: 'The recall wrote “the upper alveoli are <i>smaller</i> than the lower ones” and keyed it. The lecture says the largest alveoli are at the apex (Gas exchange p.43), so the option must have read “larger”; it is shown corrected here.' },
  { t: 'c', id: 'E-C5', title: 'V/Q mismatch, dead space, shunt, A-a gradient & exercise ventilation', src: 'Gas exchange p.33, 56–68',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Dead space (V/Q = &infin;)</b>: ventilation without perfusion (Q = 0), so alveolar gas equilibrates with humidified inspired air (P<sub>AO2</sub> = {{150 mmHg}}, P<sub>ACO2</sub> = {{0 mmHg}}).</li>' +
      '<li><b>Anatomical dead space</b> (~150 mL, or 2 mL/kg) is measured by {{Fowler’s method}} (single-breath N<sub>2</sub> washout). <b>Physiological dead space</b> (anatomical + alveolar DS) is measured by <b>Bohr’s equation</b>: DS / TV = {{(PACO2 &minus; PECO2) / PACO2}}. Increased in PE, shock, emphysema, or positive-pressure ventilation.</li>' +
      '<li><b>Right-to-left shunt (V/Q = 0)</b>: perfusion without ventilation (V = 0), so end-capillary blood remains identical to mixed venous blood (P<sub>aO2</sub> = {{40 mmHg}}, P<sub>aCO2</sub> = {{46 mmHg}}). Caused by airway obstruction, fluid/pus/blood-filled alveoli, atelectasis, pulmonary AVM, hepatopulmonary syndrome, or intracardiac R-to-L shunt (Eisenmenger).</li>' +
      '<li><b>A–a gradient</b> (P<sub>AO2</sub> &minus; P<sub>aO2</sub>): normally 0–10 mmHg (~6 mmHg) or estimated by {{(Age / 4) + 4}}; increased in <b>R-to-L shunt, V/Q mismatch, and diffusion defect</b>.</li>' +
      '<li><b>Exercise ventilation</b>: abrupt onset increase driven by psychic stimuli and muscle/joint {{proprioceptors}}, brief pause, then gradual rise. In graded moderate exercise ({{isocapnic buffering}}), ventilation rises proportionally with CO<sub>2</sub> production so P<sub>aO2</sub>, P<sub>aCO2</sub>, and pH remain normal; in strenuous exercise, buffering of {{lactic acid}}, &uparrow; plasma K<sup>+</sup>, and &uparrow; temperature further stimulate ventilation.</li></ul></div>' +
      CVS.fig('exch-vq-mismatch', 'Gas tensions from pure shunt (V/Q = 0) through normal to pure dead space (V/Q = infinity).', 'exch', 61) + '</div>' + '<p class="note"><b>From the past papers</b> · An anatomical dead space of about 150 mL is about 30% of a 500 mL breath (VD/VT ≈ 0.3) (AC80).</p>' },
  { t: 'q', id: 'E9', src: 'AC80', core: true, keep: true,
    q: 'Concerning alveolar ventilation, what is the Bohr’s equation used to calculate?',
    o: ['Alveolar ventilation rate (V̇A)', 'Oxygen diffusion capacity', 'Dead space fraction (VD/VT)', 'Ventilation-perfusion (V/Q) ratio', 'Respiratory exchange ratio (RER)'], a: 2,
    ex: 'Bohr’s method measures the physiological dead space fraction: VD/VT = (PaCO₂ − PECO₂)/PaCO₂. Fowler’s single-breath nitrogen washout measures the anatomical dead space.' },
  { t: 'q', id: 'E10', src: 'AC80', keep: true,
    q: 'Which of the following is the approximate percentage of the tidal volume remaining in the airway?',
    o: ['5%', '10%', '15%', '30%', '45%'], a: 3,
    ex: 'About 150 of a 500 mL breath stays in the conducting airways (anatomic dead space), so VD/VT is about 0.3 (30%).',
    flag: 'Recalled in the AC80 mechanics chapter; it is a dead space question.' },
  { t: 'q', id: 'E11', src: 'AC81', core: true, keep: true,
    q: 'The V/Q in alveolar A = 1, B = 0.5, C = 2. Which of the following statements is true?',
    o: ['A wasted ventilation', 'B wasted ventilation', 'PO₂ in C is higher than normal', 'PO₂ in C is lower than normal'], a: 2,
    ex: 'Normal V/Q is about 0.8. A high V/Q (C = 2) behaves like dead space: high PO₂, low PCO₂. A low V/Q (B = 0.5) behaves like shunt: low PO₂, high PCO₂.' },
  { t: 'q', id: 'E12', src: 'AC80', keep: true,
    q: 'V/Q: alveolar A = 1, alveolar B = 0.5, alveolar C = 2. Which statement is true?',
    o: ['PO₂ in B is higher than normal', 'PO₂ in C is lower than normal', 'PCO₂ in A is higher than normal', 'B wasted ventilation', 'C wasted ventilation'], a: 4,
    ex: 'C has ventilation far in excess of blood flow: much of its ventilation is wasted (dead-space-like). B is perfusion in excess of ventilation (wasted perfusion, shunt-like).' },
  { t: 'q', id: 'E13', src: 'AC81', keep: true,
    q: 'Which of the following choices is caused by pulmonary edema not considering the constriction effect?',
    o: ['Physiological shunt', 'Physiological dead space', 'Anatomical shunt', 'Anatomical dead space'], a: 0,
    ex: 'Fluid-filled alveoli are perfused but not ventilated (V/Q → 0): blood passes without picking up O₂. That is a physiological (intrapulmonary) shunt. Hypoxic vasoconstriction would reduce it, which the question tells you to ignore.' },
  { t: 'q', id: 'E14', src: 'AC81 (clinical correlation)', core: true, keep: true,
    q: 'The patient has been diagnosed with an infection in the lower lobe of the left lung. The imaging result shows pus filling the lung tissue, obstructing gas exchange. There is no sign of hypoxic vasoconstriction in the area. Which statement is correct?',
    o: ['An increase in physiological shunt', 'An increase in anatomical shunt', 'An increase in anatomical dead space', 'An increase in physiological dead space', 'An increase in anatomical and physiological dead space'], a: 0,
    ex: 'Consolidated alveoli still receive blood but no air, and without hypoxic vasoconstriction that blood keeps flowing: a physiological shunt. An anatomical shunt bypasses the alveoli entirely (bronchial and Thebesian veins).' },
  { t: 'q', id: 'E15', src: 'AC81 (clinical correlation)', keep: true,
    q: 'A patient falls off a motorcycle and hits a tree, resulting in a chest injury. A chest X-ray reveals a left-sided pneumothorax. What is the physiological mechanism responsible for the resulting decrease in arterial PO₂?',
    o: ['Restrict lung expansion and V/Q mismatch', 'Rapid interstitial edema', 'Increase venous return'], a: 0,
    ex: 'The collapsed lung cannot expand, so its alveoli get little air while blood still flows through them: low V/Q units and shunt lower the PaO₂.',
    flag: 'AC81 also showed a CXR asking the same (keyed “restrict lung and V/Q mismatch”).' }
]});

/* Section T: Hemoglobin, Oxygen Dissociation Curve & CO2 Transport (681114-2 Gas Transport.pdf, 43 pages). */
CVS.add({ id: 'T', short: 'Gas transport', title: 'Hemoglobin, Oxygen Dissociation Curve & CO2 Transport', kind: 'Lecture',
  blurb: 'Partial pressure vs tension, the 9-step diffusion pathway, hemoglobin structure and T-to-R oxygenation mechanics, P50 and allosteric effectors (2,3-BPG, pH, CO2, temperature), hemoglobin variants, CO poisoning, myoglobin, and CO2 transport with the Bohr and Haldane effects.',
  items: [
  { t: 'c', id: 'T-C1', title: 'Physical gas transport, 9-step diffusion path & RBC carrying capacity', src: 'Gas transport p.2–11, 14',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Gas–liquid interface</b>: {{partial pressure}} is the force driving gas molecules to dissolve into a liquid phase, whereas {{tension}} is the force causing dissolved gas molecules to escape from the liquid; at equilibrium the two forces are equal.</li>' +
      '<li><b>9-step diffusion path</b> from alveolus to Hb: (1) alveolar air &rarr; (2) {{surfactant layer}} &rarr; (3) alveolar membrane &rarr; (4) interstitial fluid &rarr; (5) capillary membrane &rarr; (6) plasma &rarr; (7) RBC membrane &rarr; (8) intracellular fluid &rarr; (9) hemoglobin.</li>' +
      '<li><b>O<sub>2</sub> diffusing capacity</b> in a young adult rises from {{20 mL/min/mmHg}} at rest to {{65 mL/min/mmHg}} during exercise because expanded capillary networks increase surface area and stretched alveoli thin the membrane.</li>' +
      '<li><b>Decreased diffusion rate</b>: diminished alveolar surface area (pneumonia, atelectasis, lung tumor, tuberculosis) vs {{alveolar-capillary block}} (pulmonary edema, interstitial pulmonary fibrosis, {{silicosis}}).</li>' +
      '<li><b>Role of RBCs</b>: RBCs bind dissolved O<sub>2</sub> temporarily and reversibly, shifting the plasma equilibrium so more gas dissolves and increasing blood O<sub>2</sub> transport capacity {{65-fold}}.</li></ul></div>' +
      CVS.fig('trans-rbc', 'RBCs bind dissolved gas reversibly, shifting the equilibrium so much more gas can dissolve and be transported.', 'trans', 11) + '</div>' + '<p class="note"><b>From the past papers</b> · Anemia lowers hemoglobin, so O₂ content and O₂ delivery fall, but PaO₂, which is set by the lungs, is unchanged (AC81).</p>' },
  { t: 'q', id: 'T1', src: 'AC81', core: true, keep: true,
    q: 'A woman comes with anemia. Blood test reveals she has iron deficiency. Which one is not affected?',
    o: ['Total content of oxygen in blood', 'Oxygen saturation', 'Hemoglobin production', 'Oxygen delivering to tissue', 'Arterial pO₂'], a: 4,
    ex: 'PaO₂ depends on the lungs (alveolar PO₂ and diffusion), not on how much hemoglobin there is. Anemia lowers hemoglobin, O₂ content and O₂ delivery; the key keeps saturation among the affected ones.',
    flag: 'Raw student key: E. In uncomplicated anemia SaO₂ is usually normal too; arterial PO₂ is the safest “not affected” answer.' },
  { t: 'c', id: 'T-C2', title: 'Hemoglobin A structure & molecular mechanism of oxygenation', src: 'Gas transport p.12–21',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Hemoglobin A (HbA)</b>: quaternary tetramer (&alpha;<sub>2</sub>&beta;<sub>2</sub>; &alpha; = 141 AA, &beta; = 146 AA), MW {{64,500 Da}} (5.5 nm), with 4 heme groups each containing ferrous iron (<b>Fe<sup>2+</sup></b>) coordinated to proximal histidine.</li>' +
      '<li><b>Reversible O<sub>2</sub> binding</b>: O<sub>2</sub> attachment to Fe<sup>2+</sup> is {{oxygenation}} (not oxidation &mdash; Fe<sup>2+</sup> valence does not change) and occurs in {{0.01 s}}.</li>' +
      '<li><b>Step 1 (first subunit)</b>: driven by the P<sub>O2</sub> gradient, the first O<sub>2</sub> binds the {{alpha chain}} first because its heme pocket is wider than that of the &beta;-subunit.</li>' +
      '<li><b>Step 2 (Fe<sup>2+</sup> movement)</b>: in deoxyHb, steric repulsion keeps Fe<sup>2+</sup> {{0.6 &Aring;}} above the porphyrin ring in a {{high-spin}} state; O<sub>2</sub> binding converts Fe<sup>2+</sup> to a {{low-spin}} state and pulls it into the flat porphyrin plane.</li>' +
      '<li><b>Step 3 (T &rarr; R transition)</b>: breaking of &alpha;&ndash;&alpha; and &alpha;&ndash;&beta; {{salt bridges}}, {{15&deg;}} rotation of &alpha;&beta; dimers, expulsion of 2,3-BPG from between the &beta;-chains, narrowing of the &beta;&ndash;&beta; gap (0.07 nm), and widening of the &beta;-subunit heme pocket.</li>' +
      '<li>This positive {{cooperativity}} (like tearing a block of 4 stamps) converts low-affinity deoxyHb (T-state) into high-affinity oxyHb (R-state) and yields a <b>sigmoidal</b> dissociation curve.</li></ul></div>' +
      CVS.fig('trans-heme', 'Iron atom movement into the flat porphyrin plane upon oxygen binding.', 'trans', 18) + '</div>' },
  { t: 'q', id: 'T2', src: 'Gas transport p.16–19', core: true,
    q: 'During the oxygenation of deoxyhemoglobin A (&alpha;<sub>2</sub>&beta;<sub>2</sub>), which sequence of molecular events occurs first and triggers the cooperative transition to oxyhemoglobin?',
    o: ['O2 binds the α-subunit first (wider heme pocket) → Fe2+ shifts from high-spin (0.6 Å above the ring) into the porphyrin plane (low-spin) → α–α and α–β salt bridges break, αβ rotates 15°, 2,3-BPG is expelled, and the β heme pocket opens',
        'O2 binds the β-subunit first (after 2,3-BPG covalently phosphorylates His146) → Fe2+ is oxidized to Fe3+ and moves 1.5 nm out of the porphyrin plane',
        '2,3-BPG binds between the α-subunits → αβ dimers rotate 45° → Fe2+ transitions from low-spin to high-spin',
        'CO2 binds to Fe2+ of the α-subunit → β–β subunits move 0.6 Å farther apart → salt bridges form to stabilize the R-state',
        'All four subunits bind O2 simultaneously without conformational change, producing a hyperbolic curve'], a: 0,
    ex: 'Because the α-subunit has a wider heme pocket than the β-subunit, O2 binds the α-subunit first. Fe2+ transitions from high-spin (0.6 Å out of plane due to steric repulsion) to low-spin in the flat porphyrin plane, pulling the histidine helix, breaking α–α and α–β salt bridges, rotating αβ dimers by 15°, expelling 2,3-BPG, bringing the β-chains 0.07 nm closer, and opening the β heme pocket.' },
  { t: 'q', id: 'T3', src: 'Gas transport p.13',
    q: 'Which pairing of ligand and its specific binding site on hemoglobin is <b>correct</b>?',
    o: ['CO2 → N-terminal −NH2 group of globin chains (forming carbaminohemoglobin) · 2,3-BPG → β-globin chains of deoxyhemoglobin',
        'CO2 → Fe2+ atom of heme · CO → N-terminal −NH2 group of globin chains',
        'H+ → Fe2+ atom of heme · O2 → C-terminal −COOH group of α-globin',
        '2,3-BPG → heme porphyrin ring of oxyhemoglobin · CO → β-globin His146',
        'O2 → N-terminal −NH2 group of globin · H+ → 2,3-BPG central cavity'], a: 0,
    ex: 'O2 and CO bind to the Fe2+ atom of heme (forming oxyhemoglobin and carboxyhemoglobin); CO2 binds to the N-terminal −NH2 group of globin chains (forming carbaminohemoglobin); H+ binds to proton-acceptor amino acids of globin (stabilizing deoxyhemoglobin); and 2,3-BPG binds non-covalently to the β-globin chains of deoxyhemoglobin.' },
  { t: 'c', id: 'T-C3', title: 'P50, oxygen dissociation shifts & 2,3-BPG regulation', src: 'Gas transport p.22–33',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>P<sub>50</sub></b> is the P<sub>O2</sub> at which Hb is 50% saturated; normal P<sub>50</sub> = {{27 mmHg}}.</li>' +
      '<li><b>Right shift (P<sub>50</sub> &gt; 27, e.g. 48 mmHg)</b> = <b>decreased O<sub>2</sub> affinity</b> (enhances O<sub>2</sub> unloading to active tissues): caused by <b>&uparrow; [H<sup>+</sup>] (low pH), &uparrow; P<sub>CO2</sub>, &uparrow; temperature, and &uparrow; 2,3-BPG</b>. <b>Left shift (P<sub>50</sub> &lt; 27, e.g. 16 mmHg)</b> = increased affinity from the opposite changes.</li>' +
      '<li><b>Molecular mechanisms</b>: when protonated at low pH, {{His146}} (His HC3) on the &beta;-subunit forms a stabilizing ion pair with {{Asp94}} (Asp FG1) that locks deoxyHb in the {{T-state}}; CO<sub>2</sub> binds the {{N-terminal amino group}} of globin to form carbaminohemoglobin.</li>' +
      '<li><b>2,3-BPG</b> (from RBC {{anaerobic glycolysis}}) is a highly charged anion that binds {{non-covalently}} in a {{1:1}} ratio to the &beta;-chains of deoxyHb.</li>' +
      '<li><b>2,3-BPG regulation</b>: <b>increased</b> by hormones ({{thyroid hormone, growth hormone, and androgens}}), exercise, anemia, hypoxia, and high altitude; <b>decreased</b> by {{acidosis}}.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('trans-odc', 'Oxygen dissociation curves showing normal affinity and left vs right shifts.', 'trans', 22) + CVS.fig('trans-bpg', 'Conversion of 1,3-BPG to 2,3-BPG in red blood cells and its right-shifting effect.', 'trans', 23) + '</div></div>' },
  { t: 'q', id: 'T4', src: 'AC81', core: true, keep: true,
    q: 'The oxygen dissociation curve shifts significantly to the left. Which of the following changes is most associated with the changes?',
    o: ['P50 increased, affinity of Hb-O₂ decreased', 'P50 decreased, affinity of Hb-O₂ increased', 'P50 increased, affinity of Hb-O₂ increased', 'P50 decreased, affinity of Hb-O₂ decreased', 'P50 unchange, affinity of Hb-O₂ unchange'], a: 1,
    ex: 'A left shift means Hb is 50% saturated at a lower PO₂ (lower P50): higher affinity, holding O₂ more tightly.' },
  { t: 'q', id: 'T5', src: 'AC80', core: true, keep: true,
    q: 'What is the primary effect of 2,3-BPG on binding oxygen to hemoglobin?',
    o: ['Increase oxygen unloading to tissue', 'Decrease oxygen unloading to tissue', 'Increase oxygen affinity'], a: 0,
    ex: '2,3-BPG binds deoxyhemoglobin, stabilizing the T state: affinity falls, the curve shifts right, and more O₂ is released to tissues.' },
  { t: 'c', id: 'T-C4', title: 'Hemoglobin variants, CO poisoning, abnormal hemoglobins & myoglobin', src: 'Gas transport p.34–39',
    html: '<div class="two"><div class="stack"><div class="tblwrap"><table class="tbl"><thead><tr><th>Protein / Variant</th><th>Subunits / Structure</th><th>Key physiological or clinical feature</th></tr></thead><tbody>' +
      '<tr><td><b>Embryonic Hb</b></td><td>{{Gower 1 (&zeta;2&epsilon;2), Gower 2 (&alpha;2&epsilon;2), Portland (&zeta;2&gamma;2)}}</td><td>Produced in the embryonic yolk sac</td></tr>' +
      '<tr><td><b>Fetal Hb (HbF)</b></td><td>{{&alpha;2&gamma;2}} (&lt;1% in adults)</td><td>Does <b>not bind (or loosely binds) 2,3-BPG</b> &rarr; <b>left shift</b> &amp; higher O<sub>2</sub> affinity than maternal HbA</td></tr>' +
      '<tr><td><b>Adult HbA / HbA<sub>2</sub> / HbA<sub>1c</sub></b></td><td>HbA &alpha;<sub>2</sub>&beta;<sub>2</sub> (~{{97%}}), HbA<sub>2</sub> {{&alpha;2&delta;2}} (2–2.5%)</td><td>HbA<sub>1c</sub> (&alpha;<sub>2</sub>&beta;<sub>2</sub> + glucose) rises up to 12% in diabetes mellitus</td></tr>' +
      '<tr><td><b>Carboxyhemoglobin</b></td><td>Hb bound to CO at Fe<sup>2+</sup></td><td>CO binds Hb with {{210 times}} higher affinity than O<sub>2</sub> &rarr; left shift &amp; severe tissue hypoxia</td></tr>' +
      '<tr><td><b>MetHb &amp; SulfHb</b></td><td>MetHb: {{Fe3+}} replaces Fe<sup>2+</sup></td><td>SulfHb: sulfur replaces ferrous atom after exposure to {{hydroxylamine sulfate}} ((NH<sub>2</sub>OH)<sub>2</sub>H<sub>2</sub>SO<sub>4</sub>)</td></tr>' +
      '<tr><td><b>Myoglobin</b> (heart &amp; skeletal muscle)</td><td>Monomer: {{153 amino acids}}, MW {{16,700 Da}}, 1 heme</td><td><b>Rectangular {{hyperbolic}}</b> curve (higher affinity than HbA, tight binding at low &amp; high P<sub>O2</sub>), <b>no cooperativity</b>, does <b>not</b> bind H<sup>+</sup> or CO<sub>2</sub></td></tr></tbody></table></div></div>' +
      CVS.fig('trans-myoglobin', 'Myoglobin monomer structure and its oxygen dissociation curve compared with HbA.', 'trans', 38) + '</div>' },
  { t: 'q', id: 'T6', src: 'AC80', core: true, keep: true,
    q: 'Which of the following is true regarding fetal hemoglobin (HbF) compared to adult hemoglobin (HbA)?',
    o: ['HbF has a lower affinity for oxygen', 'HbF is unable to bind carbon dioxide', 'HbF is more efficient at unloading oxygen in tissues', 'HbF binds 2,3-bisphosphoglycerate more effectively', 'HbF causes a leftward shift in the oxygen-hemoglobin curve'], a: 4,
    ex: 'HbF (α₂γ₂) binds 2,3-BPG poorly, so its O₂ affinity is higher and its curve lies to the left of HbA, which lets the fetus take O₂ from maternal blood.' },
  { t: 'q', id: 'T7', src: 'AC79', keep: true,
    q: 'What does the oxygen dissociation curve graph of hemoglobin F look like compared to the graph for hemoglobin A?',
    o: ['Sigmoidal shape with a left shift', 'Sigmoidal shape with a right shift', 'Rectangular hyperbola', 'Sigmoidal shape with no shift', 'Linear'], a: 0,
    ex: 'HbF is still a cooperative tetramer, so its curve stays sigmoid, but it lies to the left. A rectangular hyperbola is myoglobin.' },
  { t: 'q', id: 'T8', src: 'AC81', core: true, keep: true,
    q: 'How does higher arterial CO affect hemoglobin dissociation curve?',
    o: ['Right shift of O₂ dissociation curve + higher O₂ affinity', 'Left shift of O₂ dissociation curve + higher O₂ affinity', 'Left shift of O₂ dissociation curve + lower O₂ affinity', 'Right shift of O₂ dissociation curve + lower O₂ affinity'], a: 1,
    ex: 'CO occupies heme sites (about 200–250 × the affinity of O₂) and makes the remaining sites hold O₂ more tightly: the curve shifts left and O₂ unloading falls.' },
  { t: 'q', id: 'T9', src: 'AC80 (clinical correlation)', keep: true,
    q: 'A 30 year old man uses kerosene as a fuel in his house. After a while, he walks out of his house without wearing a shirt on his upper body. There is black smoke floating out of his house. What happened?',
    o: ['CO have more affinity with Hb than O₂, so there is a defect in O₂ transportation', 'Hb-O₂ graph shift to the right'], a: 0,
    ex: 'Burning kerosene indoors produces carbon monoxide. CO binds Hb 200–250 times more tightly than O₂, lowering O₂-carrying capacity, and it shifts the curve left, not right.',
    flag: 'Only two options were recalled.' },
  { t: 'c', id: 'T-C5', title: 'CO2 transport in blood, Bohr effect & Haldane effect', src: 'Gas transport p.40–43',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Three forms of CO<sub>2</sub> in blood</b> (Gas transport p.41): (1) {{7%}} physically dissolved in plasma; (2) {{23%}} bound to globin N-terminal &minus;NH<sub>2</sub> as <b>carbaminohemoglobin</b>; (3) {{70%}} converted to <b>bicarbonate (HCO<sub>3</sub><sup>&minus;</sup>)</b> in RBCs (<i>note: Gas exchange p.33 lists 5% dissolved, 3% carbaminoHb, and &gt;90% HCO<sub>3</sub><sup>&minus;</sup>; in both lectures HCO<sub>3</sub><sup>&minus;</sup> is the major form</i>).</li>' +
      '<li><b>RBC bicarbonate pathway &amp; chloride shift</b>: RBC {{carbonic anhydrase}} catalyzes CO<sub>2</sub> + H<sub>2</sub>O &rightleftharpoons; H<sub>2</sub>CO<sub>3</sub> &rightleftharpoons; H<sup>+</sup> + HCO<sub>3</sub><sup>&minus;</sup>; H<sup>+</sup> is buffered by deoxyHb (HHb) while HCO<sub>3</sub><sup>&minus;</sup> exits the RBC in exchange for {{Cl&minus;}} entering.</li>' +
      '<li><b>{{Bohr effect}}</b> (occurs in {{systemic capillaries}}): adding metabolically produced <b>H<sup>+</sup> and CO<sub>2</sub> decreases O<sub>2</sub>–Hb affinity</b> (right shift), promoting O<sub>2</sub> release to tissues.</li>' +
      '<li><b>{{Haldane effect}}</b> (occurs in <b>alveolar capillaries</b>): <b>oxygenation of Hb decreases its affinity for CO<sub>2</sub> and H<sup>+</sup></b>, releasing H<sup>+</sup> to combine with HCO<sub>3</sub><sup>&minus;</sup> &rarr; H<sub>2</sub>CO<sub>3</sub> &rarr; CO<sub>2</sub> + H<sub>2</sub>O for exhalation.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('trans-co2', 'Three mechanisms of carbon dioxide transport in red blood cells and plasma.', 'trans', 41) + CVS.fig('trans-bohr-haldane', 'Coupling of oxygen and carbon dioxide transport between lungs and tissues.', 'trans', 43) + '</div></div>' },
  { t: 'q', id: 'T10', src: 'AC80', core: true, keep: true,
    q: 'CO₂ ลำเลียงมากที่สุดในรูปไหน <span class="muted">In which form is most CO₂ transported?</span>',
    o: ['HCO₃⁻', 'H₂CO₃', 'ละลายกับ plasma <span class="muted">(dissolved in plasma)</span>', 'จับกับ Hb <span class="muted">(bound to Hb)</span>'], a: 0,
    ex: 'About 70% of CO₂ travels as bicarbonate (made by carbonic anhydrase in red cells and moved out by the chloride shift), about 23% as carbamino-Hb and about 7% dissolved.' },
  { t: 'q', id: 'T11', src: 'AC81', core: true, keep: true,
    q: 'Which of the following choices best describe the Haldane effect?',
    o: ['Oxygenation of hemoglobin promote CO₂ loading in tissue', 'Oxygenation of hemoglobin promote CO₂ unloading in lung', 'Decreased partial pressure of CO₂ promotes oxygenation of hemoglobin', 'Increased partial pressure of CO₂ promotes deoxygenation of hemoglobin'], a: 1,
    ex: 'Haldane: oxygenated Hb holds less CO₂ (and H⁺), so O₂ loading in the lung pushes CO₂ off. C and D describe the Bohr effect (CO₂ changing O₂ binding).' },
  { t: 'q', id: 'T12', src: 'AC79', keep: true,
    q: 'Which of the following statements is correct regarding the Bohr shift?',
    o: ['High oxygenation of Hb causes lowering of CO₂ affinity', 'High oxygenation of Hb causes a rise in CO₂ affinity', 'Low pH causes lowering of CO₂ affinity', 'Low pH causes lowering of O₂ affinity', 'Low pH causes a rise in O₂ affinity'], a: 3,
    ex: 'Bohr effect: H⁺ and CO₂ lower Hb’s O₂ affinity (right shift), helping unload O₂ in active tissue. A is the Haldane effect.' }
]});

/* Section C: Pulmonary Circulation, Vascular Resistance & Pulmonary Edema (681117-3 Pulmonary circulation.pdf, 27 pages). */
CVS.add({ id: 'C', short: 'Pulm circulation', title: 'Pulmonary Circulation, Vascular Resistance & Pulmonary Edema', kind: 'Lecture',
  blurb: 'Pulmonary vs bronchial and systemic circulation, recruitment and distension, alveolar vs extra-alveolar vessels and lung volume (FRC), vasoactive mediators and hypoxic pulmonary vasoconstriction, West zones, Starling law, and interstitial vs alveolar pulmonary edema.',
  items: [
  { t: 'c', id: 'C-C1', title: 'Pulmonary vs systemic & bronchial circulation', src: 'Pulm circulation p.4–7',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Pulmonary circulation</b>: walls of the pulmonary artery and its branches are remarkably thin and contain {{little smooth muscle}}, operating at <b>{{low pressure}}</b> (PA ~25/8 mmHg, mean {{15 mmHg}} vs systemic 120/80, mean 100 mmHg) and <b>{{low resistance}}</b> while carrying the <b>{{same flow}}</b> (equal cardiac output from RV and LV, since Flow = Pressure / Resistance).</li>' +
      '<li><b>Function</b>: systemic circulation regulates blood supply to organs far above the heart (brain), whereas the pulmonary circulation only needs to lift blood to the top of the lung.</li>' +
      '<li><b>Bronchial circulation</b>: branches from the {{aorta and intercostal arteries}} at <b>high systemic pressure</b> to supply the conducting airways down to about the {{terminal bronchioles}}.</li>' +
      '<li><b>Bronchial venous drainage</b>: carried away from the lung partly via the {{pulmonary veins}} (entering the left atrium as part of the 2% physiologic R-to-L shunt) and partly via the systemic venous circulation.</li></ul></div>' +
      CVS.fig('circ-pressures', 'Comparison of pressures in the pulmonary vs systemic circulation.', 'circ', 5) + '</div>' },
  { t: 'q', id: 'C1', src: 'AC81', core: true, keep: true,
    q: 'What is true about pulmonary circulation and systemic circulation?',
    o: ['High pressure, high resistance, and high flow', 'High pressure, high resistance, and low flow', 'Low pressure, low resistance, and low flow', 'Low pressure, low resistance, and same flow'], a: 3,
    ex: 'The right heart pumps the same cardiac output as the left, but the pulmonary circuit runs at about one-sixth of the pressure because its resistance is about one-tenth.' },
  { t: 'c', id: 'C-C2', title: 'Pulmonary vascular resistance (PVR): recruitment, distension & lung volume', src: 'Pulm circulation p.10–13, 16',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Rising pulmonary pressure or blood flow lowers PVR</b> via two passive mechanisms that occur together (e.g., during {{exercise}}):</li>' +
      '<li><b>1. {{Recruitment}} (main mechanism)</b>: at rest, some capillaries are closed or open with no flow; as pressure rises, these closed vessels begin conducting blood, lowering overall PVR.</li>' +
      '<li><b>2. {{Distension}}</b>: high-compliance capillaries change shape from near-flattened to more circular (widening caliber).</li>' +
      '<li><b>{{Alveolar vessels}}</b> (capillaries and corner vessels exposed to alveolar pressure): at <b>high lung volume</b> they are <b>more squashed (&uparrow; PVR)</b>; at low lung volume they are less squashed (&downarrow; PVR).</li>' +
      '<li><b>{{Extra-alveolar vessels}}</b> (arteries and veins running through lung parenchyma): at <b>high lung volume</b> they have <b>lower PVR</b> due to {{radial traction}} of elastic parenchyma and more negative intrapleural pressure; at <b>low lung volume</b> their smooth muscle and elastic tissue resist expansion and narrow caliber (<b>&uparrow; PVR</b>).</li>' +
      '<li><b>Combined U-shaped curve</b>: total PVR is <b>lowest at {{FRC}}</b> and increases when lung volume moves away toward {{TLC or RV}}.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('circ-recruit', 'Opening of closed capillaries and widening of open capillaries as pulmonary pressure rises.', 'circ', 10) + CVS.fig('circ-pvr-vol', 'Opposing effects of lung volume on the two vessel types, producing a U-shaped total resistance curve.', 'circ', 13) + '</div></div>' },
  { t: 'q', id: 'C2', src: 'AC81', core: true, keep: true,
    q: 'What causes an increase in pulmonary artery resistance?',
    o: ['Increase alveolar pressure', 'Increase arterial pressure', 'Increase venous pressure', 'Distention of the pulmonary artery'], a: 0,
    ex: 'Raised alveolar pressure (e.g. positive-pressure ventilation, very high lung volume) squashes the alveolar capillaries and raises PVR. Higher arterial or venous pressure recruits and distends vessels, which lowers resistance.' },
  { t: 'q', id: 'C3', src: 'AC80', core: true, keep: true,
    q: 'Which diagram best illustrates the pulmonary vasculature when the cardiac output has increased to a maximum extent?',
    fig: CVS.fig('ac80-vessels', 'AC80: five drawings of the pulmonary capillary bed, A–E.', 'ac80', 9),
    o: ['A', 'B', 'C', 'D', 'E'], a: 0,
    ex: 'When cardiac output rises, closed capillaries open (recruitment) and open ones widen (distension), so PVR falls. A shows all channels open and wide.' },
  { t: 'c', id: 'C-C3', title: 'Vasoactive mediators, hypoxic pulmonary vasoconstriction (HPV) & gravity zones', src: 'Pulm circulation p.14–19',
    html: '<div class="two"><div class="stack"><div class="tblwrap"><table class="tbl"><thead><tr><th>Effect on PVR</th><th>Mediators &amp; Conditions</th></tr></thead><tbody>' +
      '<tr><td><b>Pulmonary vasoconstrictors (&uparrow; PVR)</b></td><td>{{Endothelin}}, serotonin, histamine, norepinephrine, {{thromboxane A2}}, and <b>alveolar hypoxia</b></td></tr>' +
      '<tr><td><b>Pulmonary vasodilators (&downarrow; PVR)</b></td><td>{{Nitric oxide}}, {{phosphodiesterase inhibitors}}, {{prostacyclin (PGI2)}}, calcium channel blockers, and acetylcholine</td></tr></tbody></table></div>' +
      '<ul class="pts">' +
      '<li><b>Hypoxic pulmonary vasoconstriction (HPV)</b>: opposite to systemic organs! When alveolar P<sub>AO2</sub> falls below {{70 mmHg}}, vascular smooth muscle contracts locally to redirect blood <b>away from poorly ventilated (hypoxic) regions</b> toward well-ventilated alveoli, {{reducing shunt}}.</li>' +
      '<li><b>Fetal &rarr; neonatal transition</b>: generalized HPV keeps fetal PVR very high; with the {{first breath}}, alveolar oxygenation markedly decreases PVR and increases pulmonary blood flow.</li>' +
      '<li><b>Gravity &amp; West zones (upright)</b>: the <b>apex</b> has lower intravascular pressure, less recruitment/distension, higher resistance, and less perfusion; the <b>base ({{Zone 3}})</b> has higher intravascular pressure, more recruitment/distension, lower resistance, and the most perfusion (normal V/Q = 0.8–1).</li></ul></div>' +
      '<div class="stack">' + CVS.fig('circ-vaso', 'Signaling pathways of pulmonary vasoconstrictors and vasodilators in vascular smooth muscle.', 'circ', 14) + CVS.fig('circ-zones', 'Effect of gravity on pulmonary perfusion and West zones in the upright lung.', 'circ', 19) + '</div></div>' },
  { t: 'q', id: 'C4', src: 'AC79', core: true, keep: true,
    q: 'Arrange the pressure in the correct order from the greatest to the least in the zone 3 of the lung. (Pa = pulmonary arterial pressure, P<sub>A</sub> = pulmonary alveolar pressure, Pv = pulmonary venous pressure)',
    o: ['Pa > Pv > P<sub>A</sub>', 'P<sub>A</sub> > Pa > Pv', 'Pv > P<sub>A</sub> > Pa', 'Pa > P<sub>A</sub> > Pv', 'P<sub>A</sub> > Pv > Pa'], a: 0,
    ex: 'Zone 1: P<sub>A</sub> > Pa > Pv (no flow). Zone 2: Pa > P<sub>A</sub> > Pv (flow set by Pa − P<sub>A</sub>). Zone 3, the base: Pa > Pv > P<sub>A</sub>, so flow is set by Pa − Pv.',
    flag: 'AC81 asked a zone-order question too, but the recall did not define i, ii and iii, so only this version is used.' },
  { t: 'c', id: 'C-C4', title: 'Starling’s equation, lung water balance & pulmonary edema', src: 'Pulm circulation p.21–24',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Starling’s equation</b> across the 0.3 &mu;m capillary barrier (as printed on slides 21 &amp; 24): Net fluid out = K[(P<sub>c</sub> &minus; P<sub>i</sub>) &minus; &sigma;(&pi;<sub>i</sub> &minus; &pi;<sub>c</sub>)] (<i>note: standard physiology writes &sigma;(&pi;<sub>c</sub> &minus; &pi;<sub>i</sub>) since capillary oncotic pressure &pi;<sub>c</sub> opposes outward filtration</i>), where &sigma; is the {{reflection coefficient}} (protein impermeability).</li>' +
      '<li><b>Normal baseline</b>: net Starling pressure is slightly outward, balanced by a continuous perivascular lymph flow of ~{{20 mL/h}}.</li>' +
      '<li><b>Stage 1 — {{Interstitial edema}} (early)</b>: fluid engorges perivascular and peribronchial spaces (seen on CXR as {{peribronchial cuffing}}); compensated by perivascular lymphatics draining fluid to the {{hilar lymph nodes}}.</li>' +
      '<li><b>Stage 2 — {{Alveolar edema}} (late, severe)</b>: when maximal interstitial drainage is exceeded, fluid crosses the alveolar wall and floods alveoli one by one (&rarr; unventilated alveoli, V/Q mismatch, and severe <b>shunt</b>); compensated by active fluid pumping via epithelial {{Na+/K+-ATPase}}.</li>' +
      '<li><b>Causes</b>: <b>Cardiac (&uparrow; P<sub>c</sub>)</b> from &uparrow; afterload (LV failure, {{mitral stenosis}}) or &uparrow; preload (fluid overload) vs <b>Non-cardiac</b> from &downarrow; &pi;<sub>c</sub> (protein starvation, renal/GI loss, hemodilution), &uparrow; {{Filtration coefficient (K)}} / permeability (acute lung injury, sepsis, O<sub>2</sub> toxicity), or &downarrow; lymphatic drainage.</li></ul></div>' +
      CVS.fig('circ-starling', 'Starling forces across the pulmonary capillary endothelium and lymphatic drainage.', 'circ', 21) + '</div>' },
  { t: 'q', id: 'C5', src: 'Pulm circulation p.22–23', core: true,
    q: 'What distinguishes <b>early (interstitial)</b> pulmonary edema from <b>late (alveolar)</b> pulmonary edema in terms of fluid location, radiographic sign, gas-exchange impact, and compensatory clearance mechanism?',
    o: ['Early: fluid in perivascular/peribronchial interstitium (peribronchial cuffing), drained by perivascular lymphatics to hilar lymph nodes · Late: fluid floods alveoli one by one causing severe shunt, actively pumped out by epithelial Na+/K+-ATPase',
        'Early: fluid floods alveolar spaces first and is cleared by surfactant · Late: fluid enters hilar lymph nodes and improves V/Q matching',
        'Early: caused only by sepsis · Late: caused only by mitral stenosis and cleared by endothelial Ca2+-ATPase',
        'Early: causes pure anatomic dead space (V/Q = ∞) · Late: causes increased DLCO (>120%)',
        'Early: actively pumped out by alveolar macrophages · Late: passively drained by bronchial veins'], a: 0,
    ex: 'Initially, capillary filtrate enters the perivascular and peribronchial interstitial spaces (interstitial edema, producing peribronchial cuffing) and is compensated by perivascular lymphatics transporting fluid to hilar lymph nodes. Once maximal interstitial drainage is exceeded, fluid crosses into alveolar spaces (alveolar edema), filling alveoli one by one, creating unventilated units (V/Q mismatch and severe shunt), and is compensated by epithelial Na+/K+-ATPase pumps.' },
  { t: 'tf', id: 'C6', src: 'Pulm circulation p.21',
    q: 'Under normal physiological conditions in humans, the net Starling force across pulmonary capillaries is outward, producing a baseline lymph flow of approximately 20 mL/h.', a: true,
    ex: 'True. Slide 21 states that the net pressure of the Starling equation is outward under normal conditions, resulting in a small continuous pulmonary lymph flow of about 20 mL/h.' }
]});

/* Section P: Pulmonary Function Tests & Spirometry Interpretation (681117-1 PFT handout, 15 pp.). */
CVS.add({ id: 'P', short: 'PFTs', title: 'Pulmonary Function Tests & Spirometry Interpretation', kind: 'Lecture',
  blurb: 'What spirometry measures, how a good test is done, how to read a report in five steps (with the lecture’s six worked cases), and flow-volume loops.',
  items: [
  { t: 'c', id: 'P-C1', title: 'Standard lung volumes, capacities, and what spirometry measures', src: 'PFT p.2–4',
    html: '<div class="two"><div class="stack"><div class="tblwrap"><table class="tbl"><thead><tr><th>Parameter</th><th>Definition &amp; formula</th><th>Typical range</th></tr></thead><tbody>' +
      '<tr><td><b>Tidal volume (TV)</b></td><td>Air entering and leaving the lungs with each normal breath</td><td class="num">0.4–0.5 L</td></tr>' +
      '<tr><td><b>Inspiratory reserve volume (IRV)</b></td><td>Extra air inspired above TV during maximal inspiration</td><td class="num">1.9–2.5 L</td></tr>' +
      '<tr><td><b>Expiratory reserve volume (ERV)</b></td><td>Extra air expired below TV during maximal expiration</td><td class="num">1.1–1.5 L</td></tr>' +
      '<tr><td><b>Residual volume (RV)</b></td><td>Gas remaining in the lungs after a maximal expiration ({{cannot be measured by spirometry}})</td><td class="num">1.5–1.9 L</td></tr>' +
      '<tr><td><b>Inspiratory capacity (IC)</b></td><td>Maximal volume inspired from resting end-expiration = {{TV + IRV}}</td><td class="num">2.3–3.0 L</td></tr>' +
      '<tr><td><b>Functional residual capacity (FRC)</b></td><td>Gas remaining after a normal tidal expiration = {{ERV + RV}} (requires plethysmography)</td><td class="num">2.6–3.4 L</td></tr>' +
      '<tr><td><b>Vital capacity (VC / FVC)</b></td><td>Maximal volume expired after maximal inspiration = {{IRV + TV + ERV}} (or IC + ERV)</td><td class="num">3.4–4.5 L</td></tr>' +
      '<tr><td><b>Total lung capacity (TLC)</b></td><td>Volume in the lungs after maximal inspiration = {{VC + RV}} (or IC + FRC)</td><td class="num">4.9–6.4 L</td></tr></tbody></table></div>' +
      '<ul class="pts"><li>A <b>lung capacity</b> is always the sum of {{two or more physiologic volumes}}.</li>' +
      '<li>Because a spirometer only measures air moving past the lips, it cannot determine <b>RV, FRC, or TLC</b>; measuring those requires {{body plethysmography}}, helium dilution, or nitrogen washout.</li>' +
      '<li>Dynamic forced parameters: <b>FEV<sub>1</sub></b> (volume expelled in the first second), <b>FEV<sub>1</sub>/FVC</b>, <b>PEF</b> (peak expiratory flow), and <b>{{FEF25–75%}}</b> (mean flow over the middle half of FVC, sensitive to {{small airways &lt; 2 mm}}).</li></ul></div>' +
      CVS.fig('pft-volumes', 'Workings of a simple water-bell spirometer and standard lung volumes and capacities on a spirogram.', 'pft', 4) + '</div>' },
  { t: 'q', id: 'P1', src: 'PFT p.4', core: true,
    q: 'Which set of lung volumes and capacities CANNOT be measured by simple spirometry?',
    o: ['Residual volume (RV), functional residual capacity (FRC), and total lung capacity (TLC)', 'Inspiratory reserve volume (IRV), inspiratory capacity (IC), and vital capacity (VC)', 'Expiratory reserve volume (ERV), tidal volume (TV), and forced vital capacity (FVC)', 'Inspiratory capacity (IC), functional residual capacity (FRC), and vital capacity (VC)', 'Tidal volume (TV), residual volume (RV), and expiratory reserve volume (ERV)'], a: 0,
    ex: 'Simple spirometry only tracks air entering and leaving the mouth. Because the lungs cannot be completely emptied below RV, neither RV nor any capacity containing RV (FRC = ERV + RV and TLC = VC + RV) can be measured by simple spirometry; they require body plethysmography or gas dilution.' },
  { t: 'q', id: 'P2', src: 'PFT p.3–4',
    q: 'A healthy adult has TV = 0.5 L, IRV = 2.5 L, ERV = 1.2 L, and RV = 1.6 L. What are the inspiratory capacity (IC), functional residual capacity (FRC), and vital capacity (VC)?',
    o: ['IC = 3.0 L, FRC = 2.8 L, VC = 4.2 L', 'IC = 2.5 L, FRC = 2.8 L, VC = 5.8 L', 'IC = 3.0 L, FRC = 1.7 L, VC = 4.2 L', 'IC = 3.7 L, FRC = 2.8 L, VC = 5.8 L', 'IC = 3.0 L, FRC = 4.1 L, VC = 3.7 L'], a: 0,
    ex: 'IC = TV + IRV = 0.5 + 2.5 = 3.0 L; FRC = ERV + RV = 1.2 + 1.6 = 2.8 L; VC = IRV + TV + ERV = 2.5 + 0.5 + 1.2 = 4.2 L (and TLC = VC + RV = 5.8 L).' },
  { t: 'c', id: 'P-C2', title: 'Before the test: who should not blow, what to stop, what to avoid', src: 'PFT p.5–6',
    html: '<div class="two"><div class="stack">' +
      '<div class="mini"><h4>Why some patients should not blow yet</h4><p>A maximal forced blow sharply raises the pressure inside the chest, the skull and the eyes. So spirometry waits after an {{acute myocardial infarction within 1 month}}, with an untreated {{pneumothorax}} or pulmonary embolism, with a {{cerebral aneurysm}}, within {{4 weeks}} of brain or chest surgery, within 4–8 weeks of eye surgery, in pregnancy beyond {{28 weeks}}, and while an infection such as untreated TB may be active.</p></div>' +
      '<div class="mini"><h4>The hour before</h4><ul><li>No smoking or vaping and no hard exercise for {{1 hour}}; no intoxicants for 8 hours; no clothes that squeeze the chest.</li>' +
      '<li>For a <b>diagnostic</b> test, stop the bronchodilators first (table): short-acting β₂-agonist {{4–6 h}}, short-acting antimuscarinic 12 h, long-acting β₂-agonist 24 h, long-acting antimuscarinic {{36–48 h}}, theophylline 12 h (slow-release 24 h).</li>' +
      '<li>{{Inhaled steroids}} and anti-leukotrienes do not need to be stopped.</li></ul></div>' +
      '<p class="note">Every number on the report is compared with a <b>predicted</b> value for someone of the same {{age, sex, height and ethnicity}} (GLI 2012). Weight is written on the report but does not set the predicted value.</p></div>' +
      CVS.fig('pft-withhold', 'Bronchodilator withholding times before diagnostic spirometry.', 'pft', 6) + '</div>' },
  { t: 'q', id: 'P3', src: 'PFT p.6',
    q: 'Which patient characteristic does NOT determine the predicted spirometry reference values (GLI2012)?',
    o: ['Body weight', 'Standing height', 'Biological sex', 'Age', 'Ethnicity'], a: 0,
    ex: 'Predicted reference values in GLI2012 are determined by age, sex, standing height, and ethnicity. Body weight is measured during preparation but is not part of the reference equations for normal lung volumes.' },
  { t: 'tf', id: 'P4', src: 'PFT p.6',
    q: 'Acute myocardial infarction 2 weeks ago, thoracic surgery 3 weeks ago, or cataract surgery 3 weeks ago are relative contraindications to performing spirometry.', a: true,
    ex: 'True. Acute MI within 1 month, cerebral or thoracic surgery within 4 weeks, and eye surgery within 4–8 weeks are all listed as relative contraindications because forced expiration abruptly increases intrathoracic, intracranial, and intraocular pressures.' },
  { t: 'c', id: 'P-C3', title: 'One good blow, three times over: acceptability, repeatability and the best values', src: 'PFT p.7–9, 14',
    html: '<div class="two"><div class="stack"><ol class="steps"><li><b>Fill up</b>: breathe in fast to {{total lung capacity}}, within 2 s. A slow 4–6 s pause at the top lowers PEF and FEV₁.</li>' +
      '<li><b>Blast</b>: blow out as hard and as fast as possible, sitting upright (no leaning forward).</li>' +
      '<li><b>Keep going</b>: keep blowing until nothing more comes out, then breathe in fully again.</li></ol>' +
      '<div class="tblwrap"><table class="tbl compact"><thead><tr><th>Is this blow acceptable?</th><th>Rule</th></tr></thead><tbody>' +
      '<tr><td>Good start</td><td>No hesitation: back-extrapolated volume ≤ {{5% of FVC or 0.100 L}}</td></tr>' +
      '<tr><td>Good end</td><td>One of: a plateau (≤ 0.025 L in the last second), expiratory time ≥ {{15 s}}, or an FVC as big as the best earlier blow</td></tr>' +
      '<tr><td>No artifacts</td><td>No {{cough in the first second}}, glottic closure, leak or blocked mouthpiece</td></tr>' +
      '<tr><td>Full first breath</td><td>The breath in after the blow (FIVC) may exceed FVC by no more than 0.100 L or 5%</td></tr></tbody></table></div></div>' +
      '<div class="stack"><div class="mini art"><h4>How many blows</h4><p>At least {{3}} acceptable blows, at most {{8}}. The set is <b>repeatable</b> when the two biggest FVC values agree within {{0.150 L}}, and so do the two biggest FEV₁ values.</p></div>' +
      '<div class="mini ven"><h4>Which numbers go on the report</h4><p>The {{largest FEV₁}} and the {{largest FVC}} of the acceptable blows, even when they come from {{different blows}}. Never the average.</p></div>' +
      CVS.fig('pft-accept', 'Blows that fail acceptability: variable effort, early end, cough, glottic closure, tongue in the mouthpiece, leak.', 'pft', 8) + '</div></div>' },
  { t: 'q', id: 'P5', src: 'PFT p.7–9', core: true,
    q: 'According to the 2019 ATS/ERS spirometry guidelines, which statement regarding acceptability and adult repeatability criteria is correct?',
    o: ['Back-extrapolated volume (BEV) must be <= 5% of FVC or 0.100 L (whichever is greater), end-expiratory plateau <= 0.025 L in the last 1 s (or expiratory time >= 15 s), and the two largest FVC and FEV1 values within <= 0.150 L', 'Maximal inspiration to TLC should be held for 4–6 s at TLC to maximize PEF and FEV1, with 10–12 trials performed routinely', 'BEV must be <= 10% of FVC or 0.250 L, and the two largest FVC values must be within <= 0.300 L', 'A cough during the first second of expiration is acceptable for FEV1 as long as expiratory time exceeds 6 s', 'If FIVC after the maneuver exceeds FVC by 0.400 L, the trial is acceptable because inspiration after EOFE is normally larger'], a: 0,
    ex: 'ATS/ERS 2019 requires rapid inspiration to TLC in <= 2 s (holding 4–6 s lowers PEF and FEV1), BEV <= 5% of FVC or 0.100 L (whichever is greater), 1 of 3 EOFE indicators (plateau <= 0.025 L in the last 1 s, expiratory time >= 15 s, or repeatable FVC), no artifacts, FIVC - FVC <= 0.100 L or 5% of FVC, 3–8 trials, and adult repeatability within <= 0.150 L for the top two FVC and top two FEV1 values.' },
  { t: 'q', id: 'P6', src: 'PFT lecture quiz 1', core: true, wide: true, keep: true,
    q: 'Four acceptable blows give these values. Which FEV₁ and FVC go on the report?',
    fig: CVS.fig('pft-case1', 'PFT lecture quiz, best test selection.', 'pft', 14),
    o: ['FEV₁ 4.00 L and FVC 4.43 L', 'FEV₁ 3.93 L and FVC 4.39 L (the first blow)', 'FEV₁ 3.92 L and FVC 4.21 L (the averages)', 'FEV₁ 3.84 L and FVC 3.97 L (the blow with the highest FEV₁/FVC)', 'FEV₁ 4.00 L and FVC 4.04 L'], a: 0,
    ex: 'Report the largest FEV₁ (4.00, trial 2) and the largest FVC (4.43, trial 2); they may come from different blows, and you never average. Repeatability passes: FEV₁ 4.00 vs 3.93 and FVC 4.43 vs 4.39 each differ by under 0.150 L. Trials 3 and 4 have a ratio of 96–97% with a smaller FVC, the sign of a blow that stopped early.' },
  { t: 'c', id: 'P-C4', title: 'Reading a spirometry report in five steps', src: 'PFT p.10–11, lecture quiz p.14–15',
    html: '<p>Read the report as a checklist. Each step asks one question and uses one number from one column. The lecture cases below walk through it.</p>' +
      '<div class="tblwrap"><table class="tbl"><thead><tr><th>Step</th><th>Question</th><th>Which number</th><th>Rule from the lecture</th></tr></thead><tbody>' +
      '<tr><td class="num">1</td><td>Is the airflow <b>obstructed</b>?</td><td>FEV₁/FVC: the {{actual ratio}} in the Pre column</td><td>Below {{70–75}} (below the lower limit of normal) → obstruction</td></tr>' +
      '<tr><td class="num">2</td><td>Is the lung <b>small</b> (restriction)?</td><td>FVC %(Pre/Pred)</td><td>Below {{80%}} → restriction, to be confirmed by {{TLC}}. If step 1 found obstruction, first correct it: corrected %FVC = %pred FVC + [70 − FEV₁/FVC]. Above 80% → pure obstruction; 80% or less → {{combined}} obstructive and restrictive defect.</td></tr>' +
      '<tr><td class="num">3</td><td>How <b>severe</b>?</td><td>Obstruction: {{FEV₁ %pred}} · Restriction: {{FVC %pred}}</td><td>Mild ≥ 70 · Moderate {{50–69}} · Severe {{35–49}} · Very severe &lt; 35</td></tr>' +
      '<tr><td class="num">4</td><td>Does it <b>reverse</b> with a bronchodilator?</td><td>FEV₁ or FVC, Pre against Post</td><td>Rise of ≥ {{12% and ≥ 200 mL}} → bronchodilator response (reversible obstruction). % change = (post − pre) ÷ pre × 100</td></tr>' +
      '<tr><td class="num">5</td><td>Ratio and FVC normal: are the <b>small airways</b> involved?</td><td>FEF₂₅–₇₅% %(Pre/Pred)</td><td>Below {{65%}} → small airway disease; otherwise normal spirometry</td></tr></tbody></table></div>' +
      '<p class="trap">The FEV₁/FVC row also has a %(Pre/Pred) column (68 in case 4). That is the ratio as a percent of the <i>predicted ratio</i>. Step 1 uses the ratio itself (53.29 in case 4), not that column.</p>' +
      '<p class="note">The flowchart adds the ERS/ATS 2021 option: a change of more than 10% of the <i>predicted</i> value in FEV₁ or FVC also counts as a response. The worked cases use the percent-and-millilitre rule in step 4.</p>' +
      CVS.fig('pft-algo', 'The lecture’s interpretation flowchart.', 'pft', 10) },
  { t: 'q', id: 'P7', src: 'PFT lecture quiz 2', core: true, wide: true, keep: true,
    q: 'Thai male, 29 years, height 162 cm, weight 80 kg. Interpret this spirometry report.',
    fig: CVS.fig('pft-case2', 'PFT lecture quiz, case 2.', 'pft', 14),
    o: ['Normal spirometry', 'Small airway disease', 'Moderate restriction', 'Moderate obstruction with bronchodilator response', 'Severe obstruction without bronchodilator response'], a: 0,
    ex: 'Step 1: FEV₁/FVC 80.53 (above 75): no obstruction. Step 2: FVC 93% predicted (above 80%): no restriction. Step 5: FEF₂₅–₇₅% 70% predicted (above 65%): no small airway disease. Normal spirometry. (After the bronchodilator FEV₁ rises 2.90 → 3.01 L, +4%, so there is no response either.)' },
  { t: 'q', id: 'P8', src: 'PFT lecture quiz 3', core: true, wide: true, keep: true,
    q: 'Thai male, 71 years, height 162 cm, weight 41.4 kg. Interpret this spirometry report.',
    fig: CVS.fig('pft-case3', 'PFT lecture quiz, case 3.', 'pft', 14),
    o: ['Normal spirometry', 'Small airway disease', 'Moderate restriction', 'Moderate obstruction with bronchodilator response', 'Severe obstruction without bronchodilator response'], a: 4,
    ex: 'Step 1: FEV₁/FVC 41.96: obstruction. Step 2: FVC 81% predicted (above 80%, no correction needed): pure obstruction. Step 3: FEV₁ 43% predicted: severe (35–49). Step 4: FEV₁ 1.01 → 1.09 L (+8%, +80 mL) and FVC 2.40 → 2.43 L (+1%): below 12% and 200 mL, so no bronchodilator response (irreversible obstruction).' },
  { t: 'q', id: 'P9', src: 'PFT lecture quiz 4', core: true, wide: true, keep: true,
    q: 'Thai male, 76 years, height 169 cm, weight 62 kg. Interpret this spirometry report.',
    fig: CVS.fig('pft-case4', 'PFT lecture quiz, case 4.', 'pft', 14),
    o: ['Normal spirometry', 'Small airway disease', 'Moderate restriction', 'Moderate obstruction with bronchodilator response', 'Severe obstruction without bronchodilator response'], a: 3,
    ex: 'Step 1: FEV₁/FVC 53.29 (not the 68 in its %Pred column): obstruction. Step 2: FVC 100% predicted: pure obstruction. Step 3: FEV₁ 69% predicted: moderate (50–69). Step 4: FEV₁ 1.69 → 1.90 L = +0.21 L and (1.90 − 1.69)/1.69 = +12.4% (the report rounds to 13): both ≥ 200 mL and ≥ 12%, so a bronchodilator response (reversible obstruction).' },
  { t: 'q', id: 'P10', src: 'PFT lecture quiz 5', core: true, wide: true, keep: true,
    q: 'Thai male, 70 years, height 172 cm, weight 65 kg. Interpret this spirometry report.',
    fig: CVS.fig('pft-case5', 'PFT lecture quiz, case 5.', 'pft', 15),
    o: ['Normal spirometry', 'Small airway disease', 'Moderate restriction', 'Moderate obstruction with bronchodilator response', 'Severe obstruction without bronchodilator response'], a: 2,
    ex: 'Step 1: FEV₁/FVC 82.81: no obstruction. Step 2: FVC 62% predicted (below 80%): restriction pattern, to be confirmed by TLC. Step 3: restriction is graded on FVC % predicted: 62% is moderate (50–69).' },
  { t: 'q', id: 'P11', src: 'PFT lecture quiz 6', wide: true, keep: true,
    q: 'Thai female, 70 years, height 156 cm, weight 55.8 kg. Interpret this spirometry report.',
    fig: CVS.fig('pft-case6', 'PFT lecture quiz, case 6.', 'pft', 15),
    o: ['Normal spirometry', 'Small airway disease', 'Moderate restriction', 'Moderate obstruction with bronchodilator response', 'Severe obstruction without bronchodilator response'], a: 2,
    ex: 'Step 1: FEV₁/FVC 83.11: no obstruction. Step 2: FVC 60% predicted (below 80%): restriction pattern. Step 3: FVC 60% predicted: moderate (50–69).' },
  { t: 'q', id: 'P12', src: 'AC80', core: true, keep: true,
    q: 'A 55-year-old man with a 30 pack-year smoking history presents with progressive dyspnea. Spirometry shows FVC = 3.72 L and FEV₁ = 2.54 L. Which is the most likely diagnosis?',
    o: ['Small airway disease', 'Chronic obstructive pulmonary disease', 'Parenchymal lung disease', 'Pulmonary fibrosis'], a: 1,
    ex: 'FEV₁/FVC = 2.54/3.72 = 68%, below 70–75: obstruction. With a heavy smoking history, COPD is the likely cause.' },
  { t: 'q', id: 'P13', src: 'AC81', core: true, keep: true,
    q: 'Spirometry:<div class="tblwrap"><table class="tbl compact"><thead><tr><th></th><th>Before bronchodilator</th><th>After bronchodilator</th></tr></thead><tbody><tr><td>FVC</td><td>3.0 L (75% predicted)</td><td>3.1 L (78% predicted)</td></tr><tr><td>FEV₁</td><td>0.60 L (18% predicted)</td><td>0.85 L (27% predicted)</td></tr><tr><td>FEF₂₅–₇₅%</td><td>0.40 L/s (11% predicted)</td><td>0.45 L/s (13% predicted)</td></tr></tbody></table></div>Which is the condition of the patient?',
    o: ['Moderate obstructive PD with bronchodilator response', 'Severe obstructive PD with bronchodilator response', 'Very severe obstructive PD with bronchodilator response', 'Very severe obstructive PD without bronchodilator response'], a: 2,
