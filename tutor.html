    ex: 'Step 1: FEV₁/FVC = 0.60/3.0 = 20%: obstruction. Step 2: FVC is 75%, so correct it: 75 + (70 − 20) = 125% (above 80%): pure obstruction. Step 3: FEV₁ 18% predicted: very severe (below 35). Step 4: FEV₁ 0.60 → 0.85 L = +250 mL and +42%: a bronchodilator response by the ≥ 12% and ≥ 200 mL rule.',
    flag: 'The raw AC81 key marks D (without response). That only fits the ERS/ATS 2021 rule (change &gt; 10% of predicted: 27 − 18 = 9%). By the rule the lecture applies in its worked cases (≥ 12% and ≥ 200 mL, as in case 4, which counts a 9-point change as a response), the answer is C. The PS81 recall also notes these numbers were rebuilt by the recall team.' },
  { t: 'q', id: 'P14', src: 'AC81', keep: true,
    q: 'What is the most plausible disease the patient in the previous question might have?',
    o: ['Myasthenia gravis', 'Asthma', 'Pulmonary fibrosis', 'Chronic obstructive pulmonary disorder'], a: 3,
    ex: 'Even after the bronchodilator FEV₁/FVC is 0.85/3.1 ≈ 27%: the obstruction stays severe and largely fixed, which points to COPD. Asthma usually reverses toward normal; fibrosis and myasthenia give restriction, not obstruction.' },
  { t: 'q', id: 'P15', src: 'AC79', core: true, keep: true,
    q: 'A 26-year-old woman is admitted to the hospital due to difficulty breathing which has been aggravating for the past 2 months. She also complains about persistent cough and wheezing. The results of her pulmonary function test are as shown below:<div class="tblwrap"><table class="tbl compact"><thead><tr><th>Parameter</th><th>Predicted</th><th>Measured</th><th>% Predicted</th><th>Measured (post-BD)</th></tr></thead><tbody><tr><td>FVC</td><td>3.99 L</td><td>3.87 L</td><td>97%</td><td>3.95 L</td></tr><tr><td>FEV₁</td><td>3.42 L</td><td>2.09 L</td><td>61%</td><td>2.75 L</td></tr><tr><td>FEV₁/FVC</td><td></td><td>54%</td><td></td><td>70%</td></tr></tbody></table></div>What is the most likely diagnosis for this patient?',
    o: ['Mixed obstructive and restrictive disease', 'Moderate obstructive disease with bronchodilator effect', 'Moderate obstructive disease without bronchodilator effect', 'Severe obstructive disease with bronchodilator effect', 'Severe obstructive disease without bronchodilator effect'], a: 1,
    ex: 'Ratio 54%: obstruction. FVC 97%: pure. FEV₁ 61% predicted: moderate. FEV₁ 2.09 → 2.75 L = +660 mL and +32%: a bronchodilator response (fits asthma).' },
  { t: 'q', id: 'P16', src: 'AC79', keep: true,
    q: 'A 40-year-old male comes to the doctor with progressive dyspnea upon exertion for 4 months. The pulmonary function test parameters are as follows:<div class="tblwrap"><table class="tbl compact"><thead><tr><th>Parameter</th><th>Pre-bronchodilator</th><th>% Predicted</th></tr></thead><tbody><tr><td>FVC</td><td>2.5 L</td><td>80%</td></tr><tr><td>FEV₁</td><td>2.2 L</td><td>75%</td></tr><tr><td>FEF₂₅–₇₅%</td><td>1.6 L</td><td>50%</td></tr></tbody></table></div>Which is the most possible etiology?',
    o: ['Functional dyspnea', 'Pulmonary vascular disease', 'Neuromuscular disease', 'Small airway obstruction', 'Upper airway obstruction'], a: 3,
    ex: 'FEV₁/FVC = 2.2/2.5 = 88%: no obstruction. FVC 80%: not restricted. FEF₂₅–₇₅% 50% predicted is below 65%: small airway disease, the earliest sign of airway disease.' },
  { t: 'q', id: 'P17', src: 'AC79 (clinical correlation)', core: true, keep: true,
    q: 'A patient comes to the doctor due to worsening dyspnea. The pulmonary function test results are as follows:<div class="tblwrap"><table class="tbl compact"><thead><tr><th>Parameter</th><th>Predicted</th><th>Measured</th><th>% Predicted</th><th>Measured (post-BD)</th></tr></thead><tbody><tr><td>FVC</td><td>3.17 L</td><td>2.03 L</td><td>64%</td><td>2.11 L</td></tr><tr><td>FEV₁</td><td>2.69 L</td><td>1.55 L</td><td>58%</td><td>1.83 L</td></tr><tr><td>FEV₁/FVC</td><td></td><td>76%</td><td></td><td>87%</td></tr></tbody></table></div>What is the condition found in this patient?',
    o: ['Restrictive disease', 'Small airway obstruction', 'Intra-thoracic airway obstruction', 'Moderate obstruction with bronchodilator response', 'Moderate obstruction without bronchodilator response'], a: 0,
    ex: 'Ratio 76% (not below 75): no obstruction, so the low FEV₁ just follows the small lung. FVC 64% predicted: restriction (moderate), to be confirmed by TLC.' },
  { t: 'c', id: 'P-C5', title: 'Flow-volume loops: obstructive, restrictive, and central airway obstruction', src: 'PFT p.11–13',
    html: '<div class="stack">' + CVS.fig('pft-loops', 'Flow-volume loops in obstructive disease, bronchodilator responsiveness, restrictive subtypes, and the three patterns of central airway obstruction.', 'pft', 12) +
      '<div class="tblwrap"><table class="tbl"><thead><tr><th>Condition</th><th>Expiratory limb (top)</th><th>Inspiratory limb (bottom)</th><th>Key mechanism / clinical clue</th></tr></thead><tbody>' +
      '<tr><td><b>Obstructive disease</b></td><td>Reduced PEF with {{scooped-out (concave)}} downslope</td><td>Normal (shifted left if hyperinflated)</td><td>Dynamic compression of small intrathoracic airways; improves post-BD if reversible</td></tr>' +
      '<tr><td><b>Restrictive disease</b></td><td>Narrow volume width; {{steep witch-hat}} slope in parenchymal fibrosis</td><td>Narrowed in volume</td><td><b>(a) Parenchymal</b>: high recoil gives steep slope; <b>(b) Chest wall</b>: parallel slope; <b>(c) Neuromuscular</b>: {{PEF not sharp}}</td></tr>' +
      '<tr><td><b>Variable extrathoracic obstruction</b></td><td>Normal</td><td>{{Flat inspiratory curve}}</td><td>During inspiration, negative airway pressure (&minus;) below atmospheric pressure (+) pulls extrathoracic trachea inward &rarr; {{inspiratory stridor}}</td></tr>' +
      '<tr><td><b>Variable intrathoracic obstruction</b></td><td>{{Flat expiratory curve}}</td><td>Normal</td><td>During expiration, high positive pleural pressure (+) exceeds airway pressure (&minus;) and compresses intrathoracic airway &rarr; {{expiratory wheezes}}</td></tr>' +
      '<tr><td><b>Fixed upper airway obstruction</b></td><td>Flattened</td><td>Flattened ({{box-like loop}})</td><td>Rigid stenosis at any level resists diameter change during both inspiration and expiration</td></tr></tbody></table></div></div>' },
  { t: 'q', id: 'P18', src: 'PFT p.12–13', core: true,
    q: 'A patient with vocal cord paralysis presents with inspiratory stridor. Which flow-volume loop pattern is expected, and what transmural pressure mechanism explains it?',
    o: ['Flat inspiratory curve with a normal expiratory curve — negative intraluminal airway pressure during inspiration pulls the compliant extrathoracic airway inward against higher atmospheric pressure', 'Flat expiratory curve with a normal inspiratory curve — positive pleural pressure during forced expiration compresses the extrathoracic trachea', 'Flattening of both inspiratory and expiratory curves — vocal cord paralysis acts as a rigid intrathoracic ring', 'Scooped-out concave expiratory curve with normal PEF — small airway dynamic compression', 'Narrow "witch\'s hat" loop shifted to the right — increased lung elastic recoil'], a: 0,
    ex: 'Vocal cord paralysis is a variable extrathoracic upper airway obstruction (pattern a). During inspiration, intraluminal tracheal pressure becomes subatmospheric (-), while surrounding neck pressure is atmospheric (+), sucking the mobile vocal cords inward and flattening the inspiratory limb (producing stridor). During expiration, positive intraluminal pressure pushes them open.' },
  { t: 'q', id: 'P19', src: 'AC81', core: true, keep: true,
    q: 'A patient comes with combined obstructive and restrictive pulmonary defect. Which flow-volume loop is most likely? The graph labelled “Reference” is a normal loop.',
    fig: '<div class="scanrow">' + CVS.fig('ac81-fvref', 'Reference: a normal loop.', 'ac81', 13) + CVS.fig('ac81-fva', 'A', 'ac81', 13) + CVS.fig('ac81-fvb', 'B', 'ac81', 13) + CVS.fig('ac81-fvc', 'C', 'ac81', 13) + CVS.fig('ac81-fvd', 'D', 'ac81', 13) + '</div>',
    o: ['A', 'B', 'C', 'D'], a: 0,
    ex: 'Combined disease needs both features: a small loop (low volume, about 1.6 L, from restriction) and a scooped, low expiratory limb (obstruction). A shows both.',
    flag: 'From the AC81 recall: the real exam gave numbers; the recall team redrew it with loops.' },
  { t: 'q', id: 'P20', src: 'AC80', core: true, keep: true,
    q: 'What should be the abnormality of this patient?',
    fig: CVS.fig('ac80-fvfixed', 'AC80: flow-volume loop.', 'ac80', 8),
    o: ['Fixed upper airway obstruction', 'Variable extrathoracic obstruction', 'Variable intrathoracic obstruction', 'Chest wall restriction'], a: 0,
    ex: 'Both the expiratory and inspiratory limbs are flattened into a box: the narrowing limits flow in both directions, so it is a fixed upper (central) airway obstruction, such as tracheal stenosis.' },
  { t: 'q', id: 'P21', src: 'AC79', core: true, keep: true,
    q: 'A 35-year-old man comes to a pulmonologist due to worsening dyspnea. The doctor decides to perform a spirometry test, and then do it again after letting the patient take a bronchodilator. The results of both tests, shown as the flow-volume loop curves, are as follows. What is the most likely condition found in this patient?',
    fig: CVS.fig('ac79-fvbd', 'AC79: flow-volume loops at baseline and after salbutamol, with the reference curve.', 'ac79', 13),
    o: ['Restrictive pattern', 'Obstructive pattern without bronchodilator response', 'Obstructive pattern with bronchodilator response', 'Fixed upper airway obstruction', 'Variable extrathoracic obstruction'], a: 2,
    ex: 'The baseline expiratory limb is scooped (obstruction). After salbutamol the loop grows toward the reference curve: a bronchodilator response.' },
  { t: 'q', id: 'P22', src: 'AC79', keep: true,
    q: 'A 67-year-old woman with a history of persistent tuberculosis comes to her pulmonologist to check her respiratory health status using the spirometry test. The results, shown as the flow-volume curve, are as follows. What is the most likely condition found in this patient?',
    fig: CVS.fig('ac79-fvtb', 'AC79: flow-volume loop.', 'ac79', 13),
    o: ['Fixed airway obstruction', 'Variable intrathoracic obstruction', 'Variable extrathoracic obstruction', 'Poor inspiratory effort', 'Restrictive pattern'], a: 0,
    ex: 'Both limbs are flattened. Old tuberculosis can scar the trachea or a main bronchus into a fixed stenosis.',
    flag: 'PS81 edit keys A.' }
]});

/* Section R: Neural & Chemical Control of Respiration (681114-3 Respiratory control handout, 54 pp.). */
CVS.add({ id: 'R', short: 'Resp control', title: 'Neural & Chemical Control of Respiration', kind: 'Lecture',
  blurb: 'Medullary and pontine respiratory centers, central vs peripheral chemoreceptors and glomus cell transduction, lung mechanoreceptors and C-fibers, integrated responses to CO2, O2, pH and exercise, CO2 narcosis, and abnormal breathing patterns.',
  items: [
  { t: 'c', id: 'R-C1', title: 'Central controller: brainstem centers, cortex, and effectors', src: 'Resp control p.4–16',
    html: '<div class="stack"><div class="two"><div class="stack"><div class="tblwrap"><table class="tbl"><thead><tr><th>Center / Group</th><th>Location &amp; Major Nucleus</th><th>Dominant Role</th></tr></thead><tbody>' +
      '<tr><td><b>Dorsal respiratory group (DRG)</b></td><td>Dorsal medulla: {{nucleus tractus solitarii (NTS)}}</td><td>{{Drives quiet inspiration}}; receives CN IX &amp; X afferents, projects to contralateral diaphragm via {{phrenic nerve (C3–C5)}}</td></tr>' +
      '<tr><td><b>Rostral VRG</b></td><td>Ventral medulla: {{Botzinger complex}} (nucleus retrofacialis)</td><td>Expiratory</td></tr>' +
      '<tr><td><b>Intermediate VRG</b></td><td>{{Pre-Botzinger complex}} + nucleus ambiguus (NA) &amp; para-ambigualis (NPA)</td><td>Inspiratory; pre-BotC is the {{pacemaker rhythm generator}}</td></tr>' +
      '<tr><td><b>Caudal VRG</b></td><td>{{Nucleus retroambigualis (NRA)}}</td><td>Expiratory (active expiration via internal intercostals &amp; abdominal muscles)</td></tr>' +
      '<tr><td><b>Apneustic center</b></td><td>{{Lower pons}}</td><td>{{Excitatory}} to DRG (prolongs inspiration)</td></tr>' +
      '<tr><td><b>Pneumotaxic center</b></td><td>{{Upper pons}}</td><td>{{Inhibits inspiration}} to regulate tidal volume and respiratory rate</td></tr></tbody></table></div>' +
      '<ul class="pts"><li><b>Cerebral cortex</b> mediates {{voluntary control}} (voluntary hyperventilation or breath-holding within limits); the <b>limbic system and hypothalamus</b> modify breathing during emotional states (fear, excitement).</li>' +
      '<li><b>Effectors</b>: diaphragm (most important inspiratory muscle), external intercostals &amp; accessory muscles (scalene, sternocleidomastoid), upper-airway dilators (nasopharyngeal/laryngeal muscles prevent collapse), and expiratory muscles (abdominal + internal intercostals; quiet expiration is passive).</li></ul></div>' +
      CVS.fig('ctrl-brainstem', 'Brainstem respiratory control network showing sensors, pontine and medullary centers, and motor output to the diaphragm.', 'ctrl', 11) + '</div></div>' },
  { t: 'q', id: 'R1', src: 'Resp control p.9–10', core: true,
    q: 'Which structure serves as the primary pacemaker (central pattern generator) for the basic respiratory rhythm, and where is it located?',
    o: ['Pre-Botzinger complex in the intermediate ventral respiratory group (VRG)', 'Nucleus tractus solitarii (NTS) in the dorsal respiratory group (DRG)', 'Botzinger complex (nucleus retrofacialis) in the rostral VRG', 'Nucleus retroambigualis (NRA) in the caudal VRG', 'Pneumotaxic center in the upper pons'], a: 0,
    ex: 'The pre-Botzinger complex (preBotC), located in the intermediate subdivision of the ventral respiratory group (VRG) in the medulla, contains pacemaker neurons that generate the basic respiratory rhythm.' },
  { t: 'q', id: 'R2', src: 'Resp control p.10–11, 16', core: true,
    q: 'Which statement accurately describes the medullary dorsal respiratory group (DRG) and the two pontine respiratory centers?',
    o: ['The DRG (nucleus tractus solitarii) drives inspiration via the phrenic nerve (C3–C5); the lower-pontine apneustic center excites the DRG; the upper-pontine pneumotaxic center inhibits inspiration to regulate volume and rate', 'The DRG drives forced expiration via abdominal muscles; the apneustic center inhibits inspiration; the pneumotaxic center prolongs inspiration', 'The DRG is located in the upper pons and receives only somatic limb afferents; the apneustic center is in the dorsal medulla', 'The apneustic center in the upper pons switches off inspiration, whereas the pneumotaxic center in the lower pons excites the diaphragm directly', 'The DRG consists of the nucleus retroambigualis and is active only during heavy exercise'], a: 0,
    ex: 'The DRG is composed of the nucleus tractus solitarii (NTS) in the dorsal medulla, receives visceral sensory input from CN IX and CN X, and sends inspiratory output via the phrenic nerves (C3–C5) to the diaphragm. The lower pons (apneustic center) has an excitatory function on the DRG, whereas the upper pons (pneumotaxic center) inhibits inspiration to regulate tidal volume and respiratory rate.' },
  { t: 'c', id: 'R-C2', title: 'Central vs. peripheral chemoreceptors and glomus cell transduction', src: 'Resp control p.20–26',
    html: '<div class="stack"><div class="two">' + CVS.fig('ctrl-central', 'Central chemoreceptor mechanism on the ventral medullary surface.', 'ctrl', 21) + CVS.fig('ctrl-glomus', 'Carotid body histology and hypoxic signal transduction in Type I glomus cells.', 'ctrl', 24) + '</div>' +
      '<ul class="pts"><li><b>Central chemoreceptors</b> (ventral medulla near 9th &amp; 10th cranial nerve exit; provide <b>{{70% of hypercapnic drive}}</b>): arterial CO<sub>2</sub> readily crosses the {{blood-brain barrier}}, whereas arterial H<sup>+</sup> cannot. In the CSF (normal pH {{7.32}}), CO<sub>2</sub> hydrates to release H<sup>+</sup>, which directly excites the receptor &rarr; DRG &rarr; hyperventilation.</li>' +
      '<li><b>CSF buffering</b>: CSF has {{very low protein concentration}}, giving it poor buffering capacity so small P<sub>CO2</sub> rises drop pH sharply; CSF HCO<sub>3</sub><sup>&minus;</sup> is regulated by the {{choroid plexus}}.</li>' +
      '<li><b>Peripheral chemoreceptors</b>: <b>carotid bodies</b> at the common carotid bifurcation (afferent via {{glossopharyngeal nerve / CN IX}}) and <b>aortic bodies</b> around the aortic arch (afferent via {{vagus nerve / CN X}}). They have high blood flow and respond faster than central receptors (~30% of CO<sub>2</sub> drive).</li>' +
      '<li><b>Stimuli to peripheral receptors</b>: low arterial P<sub>O2</sub> (nonlinear; rises steeply below 60 mmHg, maximal response {{below 50 mmHg}}), high P<sub>aCO2</sub>, and decreased arterial pH / elevated H<sup>+</sup> (sensed by {{carotid bodies only}}, causing {{Kussmaul breathing}} in metabolic acidosis). Bilateral carotid body resection abolishes the hypoxic ventilatory drive.</li>' +
      '<li><b>Type I (glomus) cell mechanism</b> (Type II = sustentacular): low P<sub>O2</sub> inhibits {{O2-sensitive K+ channels}} &rarr; membrane depolarization (&Delta;V<sub>m</sub>) &rarr; opens {{voltage-gated Ca2+ channels}} &rarr; Ca<sup>2+</sup> influx &rarr; release of ATP &amp; acetylcholine onto afferent fibers.</li></ul></div>' },
  { t: 'q', id: 'R3', src: 'AC80', core: true, keep: true,
    q: 'A patient with DM has hyperventilation. His blood test shows elevated levels of lactic acid. Where is the receptor responsible for this phenomenon located?',
    o: ['Medulla', 'Carotid body', 'Internal thoracic artery', 'Vagus nerve', 'Aortic arch'], a: 1,
    ex: 'Blood H⁺ cannot cross the blood–brain barrier, so a metabolic acidosis drives breathing through the peripheral chemoreceptors, mainly the carotid bodies (via CN IX). Central chemoreceptors respond to CSF H⁺ from CO₂.' },
  { t: 'q', id: 'R4', src: 'AC79', keep: true,
    q: 'A 70-year-old woman with severe pulmonary fibrosis comes to a pulmonologist due to worsening dyspnea. The arterial blood gas results are as follows: pH = 7.5, PaO₂ = 50 mmHg, PaCO₂ = 28 mmHg. Which is the correct physiological response in the cerebrospinal fluid?',
    o: ['Stimulation of breathing via central chemoreceptor due to increased pH', 'Inhibition of breathing via central chemoreceptor due to increased pH', 'Stimulation of breathing via peripheral chemoreceptor due to increased pCO₂', 'Inhibition of breathing via central chemoreceptor due to increased pO₂', 'Inhibition of breathing via peripheral chemoreceptor due to increased pO₂'], a: 1,
    ex: 'Hypoxemia drives the peripheral chemoreceptors and she blows off CO₂. The low CO₂ raises CSF pH, which brakes breathing through the central chemoreceptors. Central receptors do not sense O₂.' },
  { t: 'c', id: 'R-C3', title: 'Lung mechanoreceptors, C-fibers, and other sensory inputs', src: 'Resp control p.27–35',
    html: '<div class="stack"><div class="tblwrap"><table class="tbl"><thead><tr><th>Receptor</th><th>Location &amp; Vagal Fiber</th><th>Stimulus</th><th>Reflex Response &amp; Clinical Role</th></tr></thead><tbody>' +
      '<tr><td><b>Pulmonary stretch receptors</b> (slowly adapting)</td><td>{{Airway smooth muscle}}; myelinated CN X</td><td>Sustained {{lung inflation / distension}}</td><td><b>{{Hering-Breuer inflation reflex}}</b>: slows respiratory frequency by {{prolonging expiratory time}} (weak in awake adult humans; important in newborns)</td></tr>' +
      '<tr><td><b>Irritant receptors</b> (rapidly adapting)</td><td>{{Airway epithelial cells}}; myelinated CN X</td><td>Noxious gases, smoke, dust, cold air, {{histamine}}</td><td>Reflex bronchoconstriction, coughing, and hyperpnea (contributes to {{asthma attacks}})</td></tr>' +
      '<tr><td><b>J (juxtacapillary) receptors</b></td><td>{{Alveolar walls}} near capillaries (pulmonary circulation); {{nonmyelinated C-fibers}}</td><td>Pulmonary capillary engorgement, {{interstitial edema}} (left heart failure, ILD), chemicals</td><td>{{Rapid, shallow breathing}}, bronchoconstriction, mucus secretion (intense stimulus causes apnea)</td></tr>' +
      '<tr><td><b>Bronchial C-fibers</b></td><td>Airways (supplied by bronchial circulation); nonmyelinated CN X</td><td>Chemicals in bronchial arterial blood</td><td>Rapid shallow breathing, bronchoconstriction, mucus secretion</td></tr></tbody></table></div>' +
      '<ul class="pts"><li><b>Bilateral vagotomy</b> in animals abolishes the Hering-Breuer reflex, producing <b>slow, deep breathing</b>; transient bilateral vagal block in awake humans does not alter quiet breathing rate or volume.</li>' +
      '<li><b>Other receptors</b> (p.35): <b>nose/upper airway</b> (sneezing, coughing, laryngeal spasm); <b>joint &amp; muscle receptors</b> (drive early exercise hyperpnea); <b>gamma system / muscle spindles</b> in diaphragm &amp; intercostals (sense elongation); <b>arterial baroreceptors</b> (increased BP &rarr; {{reflex hypoventilation}}); <b>pain</b> (brief apnea followed by hyperventilation) and <b>skin heating</b> (hyperventilation).</li></ul></div>' },
  { t: 'q', id: 'R5', src: 'AC79 · AC80 · AC81', core: true, keep: true,
    q: '70-year-old man with congestive heart failure from left ventricular heart failure. EP: rapid shallow breathing with O₂ sat 92%. Lung: fine crepitations in both lungs. Which mechanism is responsible for this?',
    o: ['Peripheral chemoreceptor', 'Central chemoreceptor', 'Muscle and joint receptor', 'Juxtacapillary receptor', 'Both peripheral and central chemoreceptor'], a: 3,
    ex: 'Left heart failure raises pulmonary capillary pressure and fluid builds up in the interstitium. That stimulates J (juxtacapillary) receptors in the alveolar walls, which signal by the vagus to give rapid, shallow breathing.',
    flag: 'Asked in all three years (AC79 wording: “juxta-pulmonary capillary receptors”).' },
  { t: 'c', id: 'R-C4', title: 'Integrated responses to CO2, O2, pH, exercise, altitude, and CO2 narcosis', src: 'Resp control p.38–51',
    html: '<div class="two"><div class="stack"><ul class="pts"><li><b>Response to CO<sub>2</sub></b>: arterial P<sub>aCO2</sub> is the {{most important stimulus}} to ventilation under normal conditions. Ventilation rises linearly with alveolar P<sub>CO2</sub>; concomitant <b>hypoxemia</b> (low P<sub>O2</sub>) {{increases the slope}} (magnifies the response), whereas <b>sleep, aging, and chronic CO<sub>2</sub> retention</b> reduce it.</li>' +
      '<li><b>Response to O<sub>2</sub></b>: driven {{only by peripheral chemoreceptors}}. At normal P<sub>CO2</sub> (~36 mmHg), ventilation hardly increases until P<sub>aO2</sub> falls below {{~60 mmHg}}; crucial at high altitude and in chronic lung disease.</li>' +
      '<li><b>CO<sub>2</sub> narcosis (p.45)</b>: giving excessive O<sub>2</sub> to a patient with chronic CO<sub>2</sub> retention causes <b>acute-on-chronic respiratory acidosis</b> via two mechanisms: (1) reduced {{hypoxic ventilatory response}} &rarr; <b>hypoventilation</b>, and (2) reduced {{hypoxic pulmonary vasoconstriction}} &rarr; <b>worsened V/Q mismatch</b> &rarr; rising P<sub>aCO2</sub>.</li>' +
      '<li><b>Response to pH</b>: in metabolic acidosis (low pH, low P<sub>aCO2</sub>), H<sup>+</sup> stimulates {{carotid body chemoreceptors}} (not aortic bodies) &rarr; hyperventilation (Kussmaul breathing).</li>' +
      '<li><b>Exercise &amp; High altitude</b>: in moderate exercise, ventilation rises via cortex, limb proprioceptors, and temperature while {{PaO2, PaCO2, and pH remain normal}} (pH drops only in heavy exercise from {{lactic acidosis}}). At high altitude, hypoxemia drives hyperventilation &rarr; {{respiratory alkalosis}}, increased 2,3-DPG, pulmonary arterial constriction (RV hypertrophy), and renal EPO release.</li></ul></div>' +
      CVS.fig('ctrl-co2-po2', 'Linear ventilatory response to alveolar PCO2 showing a steeper slope and leftward shift when alveolar PO2 is lowered from 110 to 47 mmHg.', 'ctrl', 40) + '</div>' },
  { t: 'q', id: 'R6', src: 'AC80 · AC81', core: true, keep: true,
    q: 'An elderly man comes to the clinic with COPD. He was given O₂ through nasal cannula. His SpO₂ increases from 85 to 99%. After one hour, he is noted with drowsiness. His PaCO₂ increased from 45 to 70 mmHg. Why?',
    o: ['Increased alveolar dead space', 'Right shift of O₂ dissociation curve', 'Hypoxic vasoconstriction', 'Increased metabolic rate due to improved tissue oxygenation', 'Decreased peripheral chemoreceptor stimulation of ventilation'], a: 4,
    ex: 'With chronic CO₂ retention the central drive is blunted, and breathing leans on hypoxic stimulation of the peripheral chemoreceptors. Correcting the hypoxia removes that drive, ventilation falls and CO₂ rises (CO₂ narcosis). Loss of hypoxic vasoconstriction worsens V/Q matching too.',
    flag: 'AC80 asked it in Thai with only two options and keyed “decreased sensitivity of chemoreceptor to CO₂” (the blunted central drive that makes him rely on the hypoxic drive).' },
  { t: 'q', id: 'R7', src: 'AC81', keep: true,
    q: 'Which of the following choices happens during exercise?',
    o: ['Oxygen consumption can not increase more than tenfold compared to rest.', 'Ventilation is increased in proportion higher than cardiac output', 'Intense exercise causes blood lactic to decrease', 'Change on ventilation is entirely caused by lowered pH'], a: 1,
    ex: 'Ventilation can rise 15–20-fold but cardiac output only about 5-fold, so V/Q rises. O₂ consumption can exceed 10× rest in athletes; lactate rises in intense exercise; and the ventilatory rise is mostly neural, not pH-driven.' },
  { t: 'q', id: 'R8', src: 'AC81', keep: true,
    q: 'Which of the following choices is the hyperventilation effect on PO₂ and PCO₂?',
    o: ['Normal PCO₂, normal PO₂', 'Increased PCO₂, increased PO₂', 'Increased PCO₂, decreased PO₂', 'Decreased PCO₂, increased PO₂', 'Decreased PCO₂, decreased PO₂'], a: 3,
    ex: 'Hyperventilation means alveolar ventilation above what CO₂ production needs: PACO₂ falls and, by the alveolar gas equation, PAO₂ rises.',
    flag: 'The raw student key marks C (increased PCO₂, decreased PO₂), which is the effect of <i>hypo</i>ventilation; the recall probably mixed the two. Physiologically the answer is D.' },
  { t: 'c', id: 'R-C5', title: 'Normal and abnormal respiratory patterns', src: 'Resp control p.52–53',
    html: '<div class="stack">' + CVS.fig('ctrl-patterns', 'Normal and abnormal respiratory patterns traced as tidal volume over time.', 'ctrl', 53) +
      '<div class="tblwrap"><table class="tbl"><thead><tr><th>Breathing Pattern</th><th>Waveform Characteristics</th><th>Underlying Mechanism / Lesion</th></tr></thead><tbody>' +
      '<tr><td><b>Eupnea &amp; Sigh</b></td><td>Rhythmic quiet tidal breaths; a <b>sigh</b> is an interspersed {{deep inspiration}} followed by a brief pause</td><td>Normal brainstem pattern generator; sighs reopen collapsed alveoli</td></tr>' +
      '<tr><td><b>Cheyne-Stokes respiration</b></td><td>Regular {{crescendo-decrescendo}} cycles of tidal depth separated by periods of {{apnea}}</td><td>Delayed circulatory feedback (heart failure) or increased chemoreceptor gain (brain damage, altitude)</td></tr>' +
      '<tr><td><b>Apneusis</b></td><td>{{Prolonged inspiratory plateaus}} (cramps) interrupted by brief expirations</td><td>Lesion of the {{pneumotaxic center (upper pons)}} + vagotomy, leaving the apneustic center unopposed</td></tr>' +
      '<tr><td><b>Cluster (Biot) breathing</b></td><td>{{Groups of breaths}} separated by regular or irregular apneic pauses (without waxing-waning)</td><td>Pontine or medullary damage, meningitis, or increased intracranial pressure</td></tr>' +
      '<tr><td><b>Ataxic breathing</b></td><td>Completely {{irregular rate and depth}} of breathing</td><td>Damage to the {{medullary respiratory centers}}</td></tr>' +
      '<tr><td><b>Gasping &amp; Vagal breathing</b></td><td><b>Gasping</b>: isolated {{abrupt inspiratory spikes}} with long pauses; <b>Vagal</b>: slow, deep breaths</td><td>Gasping = severe brainstem hypoxia/agonal; Vagal = bilateral vagotomy (loss of Hering-Breuer reflex)</td></tr></tbody></table></div></div>' },
  { t: 'q', id: 'R9', src: 'Resp control p.8, 11, 53', core: true,
    q: 'Which abnormal respiratory pattern consists of sustained inspiratory plateaus ("inspiratory cramps") interrupted by brief, insufficient expirations, and what brainstem lesion produces it?',
    o: ['Apneusis — rostral pontine lesion damaging the pneumotaxic center (especially with vagal denervation), leaving the lower-pontine apneustic center uninhibited', 'Cheyne-Stokes respiration — lesion of the pre-Botzinger complex causing chaotic irregular breaths', 'Ataxic breathing — isolated lesion of the cerebral cortex with intact pons and medulla', 'Cluster breathing — bilateral carotid body resection abolishing the Hering-Breuer reflex', 'Vagal breathing — overstimulation of the upper-pontine pneumotaxic center'], a: 0,
    ex: 'Apneusis is characterized by prolonged inspiratory plateaus with brief expirations. Because the lower-pontine apneustic center excites inspiration while the upper-pontine pneumotaxic center and vagal stretch afferents switch inspiration off, damaging the upper pons (pneumotaxic center) and vagi produces apneusis.' }
]});

/* Section A: Acid-Base Regulation (681117-2 Acid base regulation Med 2025 student.pdf, 88 slides). */
CVS.add({ id: 'A', short: 'Acid-base', title: 'Acid-Base Regulation', kind: 'Lecture',
  blurb: 'Normal arterial pH, volatile vs fixed acids, the Henderson–Hasselbalch equation, extracellular and intracellular buffers, renal HCO₃⁻ reclamation and new HCO₃⁻ generation, the four primary acid-base disorders with compensation formulas, and the 6-step ABG & anion gap approach.',
  items: [
  { t: 'c', id: 'A-C1', title: 'Arterial pH, acid loads, and the Henderson–Hasselbalch equation', src: 'Acid-base p.4–19',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li>Normal arterial blood pH is {{7.35–7.45}} (mean 7.40, equivalent to [H⁺] = {{40 nEq/L}}); life-compatible pH spans {{6.80–7.80}}.</li>' +
      '<li><b>{{Volatile acid}}</b> (CO₂ from aerobic metabolism, {{13,000}} mmol/day) is eliminated by the lungs; <b>non-volatile ({{fixed}}) acids</b> ({{50–100}} mEq/day from protein/phospholipid catabolism: sulfuric, phosphoric, uric, lactic, and ketoacids) are excreted by the kidneys.</li>' +
      '<li><b>Henderson–Hasselbalch equation</b>: pH = {{6.1}} + log([HCO₃⁻] / ({{0.03}} × PaCO₂)); at [HCO₃⁻] = 24 mmol/L and PaCO₂ = 40 mmHg, the base-to-acid ratio is {{20:1}} (log 20 = 1.3 → pH 7.40).</li>' +
      '<li>Three lines of defense: <b>chemical buffers</b> act within {{seconds}}, <b>respiratory regulation</b> within {{minutes}}, and <b>renal regulation</b> over hours to days.</li></ul></div>' +
      CVS.fig('acid-buffers', 'Extracellular, intracellular, and renal tubular buffer systems with their pKa values.', 'acid', 16) + '</div>' + '<p class="note"><b>From the past papers</b> · Buffers: bicarbonate is the main buffer of extracellular fluid; plasma proteins such as albumin add to it; phosphate plays little role in ECF but matters in cells and urine; proteins such as hemoglobin (38 histidines, the most important buffer after bicarbonate) buffer inside cells (Acid-base p.14, 24; AC79–AC81).</p>' },
  { t: 'q', id: 'A1', src: 'AC79', keep: true,
    q: 'Which one is the most important metabolic acid load in the body?',
    o: ['Lactic acid', 'Sulfuric acid', 'Carbonic acid', 'Acetic acid', 'Phosphoric acid'], a: 2,
    ex: 'Metabolism makes about 13,000 mmol of CO₂ a day, which forms carbonic acid (the volatile acid) and is cleared by the lungs. Fixed (non-volatile) acids are only about 1 mmol/kg/day.' },
  { t: 'q', id: 'A2', src: 'AC80', core: true, keep: true,
    q: 'A 30-year-old man presents with fatigue after running a marathon. His arterial blood gases show a pH of 7.32, a partial pressure of carbon dioxide of 35 mmHg, and a bicarbonate (HCO₃⁻) concentration 20 mEq/L. Which of the following buffers is the most important in preventing a large change in pH in the patient’s blood?',
    o: ['Hemoglobin', 'Albumin', 'Bicarbonate', 'Phosphate', 'Ammonium'], a: 2,
    ex: 'Lactic acid enters the extracellular fluid, where bicarbonate is the main buffer: it is plentiful and its CO₂ end is removed by the lungs (an open system).' },
  { t: 'q', id: 'A3', src: 'AC81', keep: true,
    q: 'What is the most important buffer in an intracellular environment?',
    o: ['Phosphate', 'Hemoglobin', 'Bicarbonate', 'Albumin', 'Ammonia'], a: 0,
    ex: 'The lecture lists phosphate as playing an important role in cells and urine, and proteins (such as hemoglobin) as abundant intracellular buffers.',
    flag: 'Raw student key: A. The lecture names both phosphate (“important role in cells and urine”) and protein (“abundant in cells, e.g. hemoglobin”) as intracellular buffers, so B is arguable.' },
  { t: 'q', id: 'A4', src: 'AC80', keep: true,
    q: 'What is the dominant form of phosphate at pH 7.4?',
    o: ['H₃PO₄', 'H₂PO₄⁻', 'HPO₄²⁻', 'PO₄³⁻', 'Pyrophosphate'], a: 2,
    ex: 'The relevant pKa (H₂PO₄⁻ ⇌ HPO₄²⁻) is 6.8. At pH 7.4, above the pKa, the base form HPO₄²⁻ dominates (about 4:1).' },
  { t: 'q', id: 'A5', src: 'AC79', keep: true,
    q: 'Which of the following properties makes hemoglobin an important acid-base buffer?',
    o: ['It is a form of titratable acid that is easy to secrete.', 'The pKa is similar to blood pH.', 'Hemoglobin has a lot of histidine residues.', 'It is a type of extracellular buffer that is commonly found in the body.', 'Hemoglobin can bind to carbon dioxide.'], a: 2,
    ex: 'Hemoglobin’s many histidine residues have imidazole groups with a pKa near physiological pH, so they take up and release H⁺. It is an intracellular (red cell) buffer.' },
  { t: 'c', id: 'A-C2', title: 'Renal HCO₃⁻ reclamation vs new HCO₃⁻ generation', src: 'Acid-base p.31–44',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li>Filtered HCO₃⁻ load is ~{{4,320}} mEq/day (180 L/day × 24 mEq/L); <b>{{85%}}</b> is reabsorbed in the proximal convoluted segment, {{10%}} in the thick ascending limb, and {{4.9%}} in the distal/collecting segments (&gt;99.9% conserved).</li>' +
      '<li>Proximal reclamation uses apical {{NHE3}} (Na⁺–H⁺ exchanger) and brush-border {{CA IV}} (plus cytosolic CA II); it conserves filtered HCO₃⁻ without net H⁺ excretion.</li>' +
      '<li><b>New HCO₃⁻ generation</b> requires excreting H⁺ with urinary buffers: (1) <b>{{titratable acid}}</b> (mainly HPO₄²⁻ → H₂PO₄⁻, pKa {{6.8}}, 10–40 mEq/day; minimum urine pH {{4.4–4.5}}) and (2) <b>NH₄⁺ excretion</b> from proximal {{glutamine}} metabolism (20–50 mEq/day baseline, inducible up to {{500}} mEq/day in chronic acidosis).</li>' +
      '<li>In the collecting duct, <b>type A intercalated cells</b> secrete H⁺ (via H⁺-ATPase and H⁺/K⁺-ATPase) during acidosis, whereas <b>type B intercalated cells</b> secrete HCO₃⁻ via apical {{pendrin}} during alkalosis.</li></ul></div>' +
      '<div class="stack">' +
      CVS.fig('acid-hco3-reabs', 'Segmental reabsorption of filtered HCO₃⁻ along the nephron and proximal mechanism.', 'acid', 35) +
      CVS.fig('acid-titratable', 'Formation of urinary phosphate buffer and generation of new HCO₃⁻ in α-intercalated cells.', 'acid', 39) +
      CVS.fig('acid-nh4', 'Synthesis of NH₄⁺ in the early nephron, countercurrent trapping in TAL, and collecting duct secretion.', 'acid', 41) +
      '</div></div>' },
  { t: 'q', id: 'A6', src: 'AC79', core: true, keep: true,
    q: 'Which of the following is the correct compensatory response to metabolic acidosis?',
    o: ['Decreased HCO₃⁻ regeneration', 'Decreased alveolar ventilation rate', 'Increased glutamate trapping by liver', 'Decreased renal tubular Na⁺-H⁺ exchange', 'Increased glutamine degradation in renal tubular cell'], a: 4,
    ex: 'In acidosis the proximal tubule breaks down more glutamine into NH₄⁺ (excreted) and new HCO₃⁻ (returned to blood). Ventilation rises, Na⁺–H⁺ exchange increases and HCO₃⁻ generation increases.',
    flag: 'PS81 edit keys E.' },
  { t: 'q', id: 'A7', src: 'AC79', keep: true,
    q: 'Which buffer system plays the least role in excreting acid from the body?',
    o: ['Protein', 'Phosphate', 'Bicarbonate', 'Ammonium', 'Sulfate'], a: 4,
    ex: 'Urinary acid leaves as titratable acid (mainly phosphate) and ammonium. Sulfate is an anion of a fixed acid, not a buffer that carries H⁺ out.' },
  { t: 'c', id: 'A-C3', title: 'The four primary acid-base disorders and expected compensation', src: 'Acid-base p.46–61',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Respiratory acidosis</b> (↑PaCO₂ &gt; {{45 mmHg}}): <b>acute</b> ↑[HCO₃⁻] by {{1}} mmol/L per 10 mmHg ↑PaCO₂; <b>chronic</b> (&gt;3–5 days) ↑[HCO₃⁻] by {{3.5 mmol/L}} (or 3–4) per 10 mmHg ↑PaCO₂.</li>' +
      '<li><b>Respiratory alkalosis</b> (↓PaCO₂ &lt; {{35 mmHg}}): <b>acute</b> ↓[HCO₃⁻] by {{2 mmol/L}} per 10 mmHg ↓PaCO₂; <b>chronic</b> ↓[HCO₃⁻] by {{4–5 mmol/L}} per 10 mmHg ↓PaCO₂.</li>' +
      '<li><b>Metabolic acidosis</b> (↓[HCO₃⁻] &lt; {{22 mmol/L}}): respiratory compensation via {{Kussmaul}} hyperventilation lowers PaCO₂ by {{1.25 mmHg}} per 1 mmol/L ↓[HCO₃⁻] (or 5 mmHg per 4 mmol/L ↓[HCO₃⁻]; <b>{{Winter’s}} formula</b>: PaCO₂ = 1.5×[HCO₃⁻] + 8 ± 2).</li>' +
      '<li><b>Metabolic alkalosis</b> (↑[HCO₃⁻] &gt; {{26 mmol/L}}): hypoventilation raises PaCO₂ by {{0.75 mmHg}} per 1 mmol/L ↑[HCO₃⁻] (or 3 mmHg per 4 mmol/L ↑[HCO₃⁻]).</li></ul>' +
      '<p class="trap">Slide 55, 56 &amp; 60 prose contain direction typos ("increase" instead of "decrease"); always follow the minus sign in the equations and the summary table on slide 61: compensation always moves the secondary variable in the <b>same direction</b> as the primary change.</p></div>' +
      CVS.fig('acid-comp-table', 'Summary table of the four primary acid-base disorders and their compensation ratios.', 'acid', 61) + '</div>' + '<p class="note"><b>From the past papers</b> · Causes: respiratory alkalosis from hyperventilation (fever, high altitude, anxiety, acute aspirin poisoning); metabolic alkalosis from loss of gastric acid (vomiting), alkaline drugs, aldosterone excess or steroids (Acid-base p.53, 58; AC80, AC81).</p>' },
  { t: 'q', id: 'A8', src: 'AC81', core: true, keep: true,
    q: 'A 45-year-old male patient ABG result is as follows, pH = 7.25, HCO₃⁻ 12 mEq/L. The main abnormality is metabolic acidosis. What is the expected respiratory compensation?',
    o: ['Hypoventilation to retain CO₂', 'Hyperventilation to reduce pCO₂', 'No compensation needed', 'Increased renal H⁺ excretion', 'Increase minute ventilation without increasing RR'], a: 1,
    ex: 'Metabolic acidosis is compensated by hyperventilation (Kussmaul breathing), lowering PCO₂ toward 1.5 × 12 + 8 ± 2 = 24–28 mmHg. Renal H⁺ excretion is metabolic, not respiratory, compensation.' },
  { t: 'q', id: 'A9', src: 'AC81', core: true, keep: true,
    q: 'pH 7.28 / HCO₃⁻ 16 / PCO₂ 40. What is the expected PCO₂ and the primary cause?',
    o: ['30–34 / metabolic acidosis', '30–34 / respiratory acidosis', '38–42 / normal acid-base', '46–50 / metabolic acidosis', '46–50 / respiratory acidosis'], a: 0,
    ex: 'Low pH with low HCO₃⁻: primary metabolic acidosis. Winter: 1.5 × 16 + 8 ± 2 = 30–34 mmHg. The actual PCO₂ of 40 is above that, so there is also a respiratory acidosis.' },
  { t: 'q', id: 'A10', src: 'AC80', core: true, keep: true,
    q: 'A patient presents to the emergency room with an asthma attack. The arterial blood gas analysis shows the following: pH 7.30, partial pressure of carbon dioxide 55 mmHg, bicarbonate concentration 25 mEq/L. What is the diagnosis for this patient?',
    o: ['Acute respiratory acidosis', 'Chronic respiratory acidosis', 'Metabolic acidosis', 'Metabolic alkalosis', 'Compensated respiratory acidosis'], a: 0,
    ex: 'Acidemia with high PCO₂ is respiratory acidosis. Acutely HCO₃⁻ rises only 1 per 10 mmHg (expected about 25.5); chronically it would be about 29. HCO₃⁻ 25 fits acute.' },
  { t: 'q', id: 'A11', src: 'AC79', keep: true,
    q: 'A 37-year-old woman has arterial blood gas results as follows: pH 7.3, PaCO₂ = 60 mmHg, [HCO₃⁻] = 26 mEq. What is the most likely condition found in this patient?',
    o: ['Metabolic acidosis with respiratory compensation', 'Chronic respiratory acidosis with metabolic compensation', 'Acute respiratory acidosis with some metabolic compensation', 'Mixed metabolic and respiratory acidosis', 'Mixed metabolic acidosis with respiratory alkalosis'], a: 2,
    ex: 'PCO₂ up 20: acute compensation predicts HCO₃⁻ ≈ 26, chronic ≈ 31. HCO₃⁻ 26 matches the acute rule.' },
  { t: 'q', id: 'A12', src: 'AC81', core: true, keep: true,
    q: 'A patient comes with COPD. What should be the expected ABG result?',
    o: ['pH 7.50, PaCO₂ 28 mmHg, HCO₃⁻ 22 mEq/L', 'pH 7.25, PaCO₂ 60 mmHg, HCO₃⁻ 24 mEq/L', 'pH 7.37, PaCO₂ 55 mmHg, HCO₃⁻ 31 mEq/L', 'pH 7.28, PaCO₂ 30 mmHg, HCO₃⁻ 14 mEq/L', 'pH 7.45, PaCO₂ 40 mmHg, HCO₃⁻ 28 mEq/L'], a: 2,
    ex: 'Stable COPD retains CO₂ chronically, and the kidney has had days to raise HCO₃⁻ (about 3.5 per 10 mmHg: 24 + 5 ≈ 29–31), so pH is near normal. B is acute respiratory acidosis.' },
  { t: 'q', id: 'A13', src: 'AC79', keep: true,
    q: 'Which of the following formulas is the correct one for calculating blood bicarbonate concentration in the condition of chronic respiratory acidosis?',
    o: ['[HCO₃⁻] = [(PCO₂ − 40)/10] + 24', '[HCO₃⁻] = [(PCO₂ − 40)/3] + 24', '[HCO₃⁻] = 24 − [(40 − PCO₂)/5]', '[HCO₃⁻] = 24 − [(40 − PCO₂)/2]', '[HCO₃⁻] = [(PCO₂ − 40)/5] + 24'], a: 1,
    ex: 'Chronic respiratory acidosis raises HCO₃⁻ about 3–4 per 10 mmHg of PCO₂, i.e. (ΔPCO₂)/3. A is acute acidosis (1 per 10); D is acute alkalosis (2 per 10); C is chronic alkalosis (4–5 per 10).' },
  { t: 'q', id: 'A14', src: 'AC80', keep: true,
    q: 'ขึ้นที่สูงเป็นระยะเวลานาน เมื่อตรวจวัดค่าต่างๆในเลือด ข้อใดน่าจะใกล้เคียงที่สุดกับการปรับตัวนี้ <span class="muted">After a long stay at high altitude, which blood values best fit the adaptation?</span>',
    o: ['pH 7.48, pCO₂ 30, HCO₃⁻ 23', 'pH 7.40, pCO₂ 19, HCO₃⁻ 20', 'pH 7.43, pCO₂ 30, HCO₃⁻ 18'], a: 2,
    ex: 'Altitude causes a respiratory alkalosis. After days the kidney excretes HCO₃⁻ (4–5 per 10 mmHg fall in PCO₂), bringing pH back near normal: pH 7.43, PCO₂ 30, HCO₃⁻ 18. Option 1 (HCO₃⁻ down only 1–2) is the acute picture; option 2 is internally inconsistent.',
    flag: 'The AC80 student key marks option 1, which is the <i>acute</i> picture. The stem says “for a long time”, and the lecture’s chronic rule (HCO₃⁻ falls 4–5 per 10 mmHg) gives option 3.' },
  { t: 'q', id: 'A15', src: 'AC80', keep: true,
    q: 'Which of the following conditions is a potential cause of respiratory alkalosis?',
    o: ['Aspirin poisoning', 'Neuromuscular disorder', 'Methanol', 'Vomiting', 'Obstructive pulmonary disease'], a: 0,
    ex: 'Salicylate directly stimulates the respiratory center, causing hyperventilation and respiratory alkalosis (later a metabolic acidosis too). Neuromuscular disease and COPD cause respiratory acidosis; methanol a metabolic acidosis; vomiting a metabolic alkalosis.' },
  { t: 'q', id: 'A16', src: 'AC79', keep: true,
    q: 'A 15-year-old female has been rescued from a suicide attempt via rope hanging. After the rescue, she seems to be breathing normally again after a few minutes. What is the most likely arterial blood gas results right after she is rescued compared to the normal values?',
    o: ['Increased [HCO₃⁻]', 'Decreased [CO₂] of exhaled air', 'Increased PaCO₂', 'Increased PaO₂', 'Normal PaO₂'], a: 2,
    ex: 'Hanging obstructs the airway: she could not breathe, so CO₂ built up (acute respiratory acidosis) and PaO₂ fell. HCO₃⁻ barely changes acutely.' },
  { t: 'q', id: 'A17', src: 'AC81', keep: true,
    q: 'A woman had treatment for hypertension. pH 7.48, pCO₂ 48, HCO₃⁻ 33. What is the cause of the ABG result?',
    o: ['Renal loss of H⁺ from diuretic', 'Diarrhea', 'Decreased ventilation from drug overdose', 'CO₂ retention', 'Lactate accumulation'], a: 0,
    ex: 'Alkalemia with high HCO₃⁻ and compensating PCO₂: metabolic alkalosis. Thiazide and loop diuretics cause it through volume contraction and renal H⁺ (and K⁺) loss.' },
  { t: 'c', id: 'A-C4', title: 'Plasma anion gap: HAGMA vs NAGMA and urine anion gap', src: 'Acid-base p.64–70',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Plasma Anion Gap (AG)</b> = [Na⁺] − ([Cl⁻] + [HCO₃⁻]); normal range in the handout is {{12 ± 4}} mEq/L ({{8–16}} mEq/L, where unmeasured anions exceed unmeasured cations, largely plasma {{albumin}}).</li>' +
      '<li><b>High anion gap metabolic acidosis (HAGMA)</b> (normochloremic; acid HA adds unmeasured A⁻ that replaces HCO₃⁻): <b>{{KUSMALE}}</b> — {{Ketoacidosis}} (DKA, starvation, alcoholic), {{Uremia}}, {{Salicylate}}, {{Methanol}}, Aldehyde/alcohol, {{Lactic acidosis}}, and Ethylene glycol.</li>' +
      '<li><b>Normal anion gap metabolic acidosis (NAGMA)</b> (hyperchloremic; lost HCO₃⁻ is replaced 1:1 by Cl⁻): severe {{diarrhea}}, renal tubular acidosis (RTA), or {{acetazolamide}} (carbonic anhydrase inhibition).</li>' +
      '<li><b>Urine Anion Gap (UAG)</b> = ([Na⁺]ᵤ + [K⁺]ᵤ) − [Cl⁻]ᵤ estimates urinary NH₄⁺: a <b>{{negative}}</b> UAG (&lt; −20 mEq/L) shows intact renal NH₄⁺ excretion (GI HCO₃⁻ loss), whereas a <b>positive</b> UAG (&gt; +20 mEq/L) indicates impaired distal acid excretion (RTA).</li></ul></div>' +
      CVS.fig('acid-ag', 'Electrolyte Gamblegrams comparing Normal, High Anion Gap (normochloremic), and Normal Anion Gap (hyperchloremic) metabolic acidosis.', 'acid', 66) + '</div>' },
  { t: 'q', id: 'A18', src: 'AC81', core: true, keep: true,
    q: 'Why do we need to account for albumin when calculating anion gap?',
    o: ['It is a major buffer protein', 'It has an effect on HCO₃⁻', 'It increases Cl⁻', 'It is a major unmeasured anion', 'It altered measured Na⁺'], a: 3,
    ex: 'The anion gap is made mostly of unmeasured anions, and albumin is the biggest of them. Low albumin lowers the gap and can hide a high-anion-gap acidosis, so the gap is corrected for albumin.',
    flag: 'The raw student key marks A (“major buffer protein”). The lecture lists albumin among the unmeasured anions that make up the gap (Acid-base p.65), which is why it must be accounted for: D.' },
  { t: 'q', id: 'A19', src: 'AC79', keep: true,
    q: 'Which of the following conditions has acid-base indices in the same direction as diabetic ketoacidosis?',
    o: ['Shortness of breath', 'Vomiting', 'Hyperventilation', 'Anti-acid ingestion', 'Diarrhea'], a: 4,
    ex: 'DKA is a metabolic acidosis: pH, HCO₃⁻ and (compensating) PCO₂ all fall. Diarrhea loses HCO₃⁻ and gives the same direction (though with a normal anion gap). Vomiting and antacids cause alkalosis.',
    flag: 'PS81 edit keys E.' },
  { t: 'c', id: 'A-C5', title: 'The 6-step ABG interpretation algorithm and clinical cases', src: 'Acid-base p.71–87',
    html: '<div class="stack"><ul class="pts">' +
      '<li><b>Step 1 — Check internal consistency</b>: [H⁺] ≈ 24 × PaCO₂ / [HCO₃⁻]. <b>Step 2 — Acidemia vs alkalemia</b>: pH &lt; {{7.35}} is acidemia; pH &gt; {{7.45}} is alkalemia.</li>' +
      '<li><b>Step 3 — Identify primary process</b>: if PaCO₂ and pH move in {{opposite}} directions, it is respiratory; if [HCO₃⁻] and pH move in the {{same}} direction, it is metabolic.</li>' +
      '<li><b>Step 4 — Calculate expected compensation</b>: if actual PaCO₂ or [HCO₃⁻] falls outside the expected compensation range, a concurrent disorder is present.</li>' +
      '<li><b>Step 5 — Calculate AG</b> ([Na⁺] − ([Cl⁻] + [HCO₃⁻]), normal {{12 ± 4}} mEq/L). <b>Step 6 — If AG is elevated, check {{delta}} ratio (ΔAG / Δ[HCO₃⁻])</b>: compare (AG − 12) against (24 − [HCO₃⁻]) to detect a hidden concurrent alkalemic process (if [HCO₃⁻] is higher than expected) or concurrent NAGMA (if [HCO₃⁻] is lower than expected).</li></ul>' +
      '<div class="tblwrap"><table class="tbl"><thead><tr><th>Handout case (p.78–87)</th><th>ABG &amp; electrolytes</th><th>Complete diagnosis</th></tr></thead><tbody>' +
      '<tr><td>Case 1 (p.78) · Vomiting 1 wk</td><td>pH 7.50, PaCO₂ 48, HCO₃⁻ 37, Na⁺ 135, Cl⁻ 86 (AG 12)</td><td>{{Metabolic alkalosis}} with respiratory compensation (expected PaCO₂ ≈ 49.75 mmHg)</td></tr>' +
      '<tr><td>Case 2 (p.80) · Pneumonia &amp; sepsis</td><td>pH 7.12, PaCO₂ 40, HCO₃⁻ 12, Na⁺ 140, Cl⁻ 103 (AG {{25 mEq/L}})</td><td>HAGMA + {{respiratory acidosis}} (expected PaCO₂ ≈ 25 mmHg, actual is 40)</td></tr>' +
      '<tr><td>Case 3 (p.82) · Chronic renal disease + vomiting</td><td>pH 7.40, PaCO₂ 40, HCO₃⁻ 24, Na⁺ 145, Cl⁻ 100 (AG {{21 mEq/L}})</td><td>{{Mixed}} HAGMA + vomiting-induced alkalosis (normal pH/HCO₃⁻ hides elevated AG)</td></tr>' +
      '<tr><td>Case 4 (p.84) · Acute bronchitis on COPD</td><td>pH 7.26, PaCO₂ 70, HCO₃⁻ 31, Na⁺ 137, Cl⁻ 95 (AG 11)</td><td>{{Acute-on-chronic}} hypercapnic acidosis (HCO₃⁻ 31 lies between acute 27 and chronic 34.5)</td></tr>' +
      '<tr><td>Case 5 (p.86) · Diarrhea 5 d</td><td>pH 7.25, PaCO₂ 28, HCO₃⁻ 12, Na⁺ 140, Cl⁻ 116 (AG 12)</td><td>{{Hyperchloremic}} (normal AG) metabolic acidosis with respiratory compensation</td></tr></tbody></table></div></div>' },
  { t: 'q', id: 'A20', src: 'AC81', core: true, keep: true,
    q: 'A patient comes with Diabetes type 1. ABG: pH 7.18, pCO₂ 18, HCO₃⁻ 8. Serum: Na⁺ 140, Cl⁻ 102, HCO₃⁻ 8. What is his condition?',
    o: ['Pure respiratory acidosis', 'Pure high anion gap metabolic acidosis', 'Mixed high anion gap metabolic acidosis with metabolic alkalosis', 'Mixed high anion gap metabolic acidosis with normal anion gap metabolic acidosis', 'Normal acid-base condition'], a: 1,
    ex: 'Low pH, low HCO₃⁻: metabolic acidosis. Winter: 1.5 × 8 + 8 = 20 ± 2, and PCO₂ 18 is in range. AG = 140 − 102 − 8 = 30 (high). Δ-ratio = (30 − 12)/(24 − 8) = 18/16 ≈ 1.1: pure HAGMA (DKA).' },
  { t: 'q', id: 'A21', src: 'AC80 · AC81', core: true, keep: true,
    q: 'A 25-year-old woman with a history of vomiting for the past 3 days presents with the following arterial blood gas (ABG) results: pH 7.52, partial pressure of carbon dioxide 48 mmHg, bicarbonate concentration 38 mEq/L. Which of the following best describes her acid-base status?',
    o: ['Acute metabolic acidosis', 'Chronic respiratory alkalosis with compensation', 'Metabolic alkalosis with respiratory compensation', 'Acute respiratory acidosis', 'Mixed metabolic and respiratory alkalosis'], a: 2,
    ex: 'Alkalemia with high HCO₃⁻: metabolic alkalosis (loss of gastric HCl). Expected PCO₂ = 40 + 0.7 × (38 − 24) ≈ 50 ± 2; 48 fits, so the raised PCO₂ is appropriate compensation.',
    flag: 'AC81 asked the same case (pH 7.52, PCO₂ 48, HCO₃⁻ 37) with simpler options.' },
  { t: 'q', id: 'A22', src: 'AC80', keep: true,
    q: 'A 30-year-old woman presents with the following arterial blood gas results: pH 7.22, partial pressure of carbon dioxide 28 mmHg, bicarbonate concentration 13 mEq/L. Which of the following best describes her acid-base status?',
    o: ['Respiratory acidosis with metabolic compensation', 'Respiratory acidosis with no compensation', 'Metabolic alkalosis with respiratory acidosis', 'Metabolic acidosis with respiratory acidosis', 'Metabolic acidosis with respiratory alkalosis'], a: 4,
    ex: 'Metabolic acidosis. Winter: 1.5 × 13 + 8 = 27.5 ± 2 (25.5–29.5); PCO₂ 28 is appropriate compensation. Of the options, E is closest: here “respiratory alkalosis” means the compensatory fall in PCO₂, not a second disorder.',
    flag: 'AC80 key: E. Strictly this is metabolic acidosis with appropriate respiratory compensation; a true added respiratory alkalosis would need PCO₂ below 25.5.' },
  { t: 'q', id: 'A23', src: 'AC79', keep: true,
    q: 'Which of these cases would have metabolic acidosis with the delta ratio lower than 0.4?',
    o: ['Deep vomiting through GI tract', 'Organic acidemia with vomiting', 'High dose salicylic acid poisoning', 'Lactic acidosis with diarrhea', 'NH₄Cl ingestion'], a: 4,
    ex: 'A delta ratio below 0.4 means the fall in HCO₃⁻ is not matched by a rise in the gap: a pure normal-anion-gap (hyperchloremic) acidosis. Ingested NH₄Cl adds HCl.' }
]});

/* Section S: RS Under Stress (681119-1 RS_under stress_NS2025_handout.pdf, 16 slides). */
CVS.add({ id: 'S', short: 'RS under stress', title: 'Respiratory System Under Stress', kind: 'Lecture',
  blurb: 'Cardiopulmonary adaptations to exercise, high altitude hypoxia and acclimatization, hyperbaric diving and decompression sickness, NREM vs REM sleep physiology, and the fetal-to-neonatal respiratory transition at birth.',
  items: [
  { t: 'c', id: 'S-C1', title: 'Exercise: energy systems, ventilatory threshold, and blood gases', src: 'Stress p.2–5',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li>Three muscle ATP sources: <b>{{phosphagen}}</b> system (ATP + phosphocreatine, {{8–10 seconds}} burst), <b>{{glycogen–lactic acid}}</b> system (oxygen-independent glycolysis, {{1.3–1.6 minutes}}), and <b>{{oxidative}}</b> system (mitochondrial phosphorylation, unlimited duration while fuel lasts).</li>' +
      '<li>During <b>moderate steady-state exercise</b>, alveolar ventilation increases linearly with O₂ consumption and CO₂ production, so arterial <b>PaO₂, PaCO₂, and pH remain {{normal}}</b> (while venous PO₂ falls and muscle O₂ extraction rises with a {{rightward}} ODC shift from ↑H⁺, ↑CO₂, ↑temperature, and ↑2,3-BPG).</li>' +
      '<li>Above the <b>{{anaerobic}} (ventilatory) threshold</b> (~60% Wmax), lactic acid buffered by HCO₃⁻ generates extra non-metabolic CO₂; H⁺ stimulates {{carotid bodies}}, causing disproportionate hyperventilation that <b>lowers {{PaCO2}}</b> while arterial pH still drops.</li>' +
      '<li>Cardiac output recruits apical capillaries (making V/Q more {{uniform}} and raising diffusing capacity ~3-fold), and endurance training increases <b>VO₂max</b> primarily by increasing {{stroke volume}} and maximal cardiac output rather than lung volumes.</li></ul></div>' +
      CVS.fig('stress-exercise', 'Time course and cardiovascular/ventilatory responses across moderate and heavy exercise workloads.', 'stress', 3) + '</div>' + '<p class="note"><b>From the past papers</b> · The jump in ventilation in the first seconds of exercise is neural: impulses from moving limbs (joint and muscle receptors) and the motor cortex (Resp control p.35; AC81).</p>' },
  { t: 'q', id: 'S1', src: 'AC80', core: true, keep: true,
    q: 'What increase the most percentage during exercise?',
    o: ['Cardiac output', 'Ventilation', 'Heart rate', 'Vascular resistance', 'Tidal volume'], a: 1,
    ex: 'Minute ventilation can rise more than 15-fold because both rate and depth increase. Cardiac output rises about 5-fold, and vascular resistance falls.' },
  { t: 'q', id: 'S2', src: 'AC81', core: true, keep: true,
    q: 'A healthy 25-year-old man does moderate exercise on a treadmill. What is the cause of hyperventilation within the first minute of exercise?',
    o: ['Increased CO₂ stimulates the central chemoreceptor', 'A sudden partial oxygen drop in PaO₂ stimulates the peripheral center', 'Accumulation of lactate', 'Proprioceptor response from moving limbs', 'Increased temperature stimulates the hypothalamus'], a: 3,
    ex: 'The abrupt rise in ventilation at the start of exercise comes before any change in blood gases: it is neural, from the motor cortex and from proprioceptors in moving joints and muscles.' },
  { t: 'c', id: 'S-C2', title: 'High altitude: acute hypoxia, acclimatization, and altitude illness', src: 'Stress p.7–10',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li>At high altitude, fractional O₂ remains {{21%}}, but lower <b>{{barometric pressure}}</b> reduces inspired PO₂ and alveolar PAO₂ (e.g. Mt. Everest summit P_B ≈ {{253 mmHg}}).</li>' +
      '<li><b>Acute response</b>: arterial hypoxia (PaO₂ &lt; 60 mmHg) stimulates {{peripheral chemoreceptors}} (carotid bodies) → hyperventilation → ↓PaCO₂ and <b>{{respiratory alkalosis}}</b>, which initially brakes central respiratory drive.</li>' +
      '<li><b>Acclimatization (days to weeks)</b>: kidneys excrete {{HCO3-}} (accelerated by {{acetazolamide}}, a carbonic anhydrase inhibitor) to normalize CSF/blood pH and restore ventilatory drive; RBC {{2,3-BPG}} rises (shifting ODC right at moderate altitude, whereas extreme hypocapnic alkalemia shifts ODC left to aid pulmonary O₂ loading); <b>{{HIF}} (hypoxia-inducible factor)</b> stimulates {{erythropoietin}} (polycythemia) and VEGF (tissue capillarity).</li>' +
      '<li>Global <b>hypoxic pulmonary vasoconstriction (HPV)</b> raises pulmonary artery pressure, risking right ventricular hypertrophy and <b>{{HAPE}}</b> (high-altitude pulmonary edema, non-cardiogenic patchy edema treated with descent, O₂, and {{nifedipine}}), alongside <b>AMS</b> and <b>HACE</b> (treated with descent, O₂, and dexamethasone).</li></ul></div>' +
      CVS.fig('stress-altitude', 'Physiological cascade and multi-organ acclimatization to hypobaric hypoxia at high altitude.', 'stress', 10) + '</div>' },
  { t: 'q', id: 'S3', src: 'AC81', core: true, keep: true,
    q: 'A woman ascends from sea level to a 4000 m mountain, resulting in hyperventilation. What is the immediate effect in this case?',
    o: ['Respiratory acidosis', 'Respiratory alkalosis', 'Metabolic acidosis', 'No pH change from renal compensation'], a: 1,
    ex: 'Hypoxia drives the peripheral chemoreceptors, she blows off CO₂, and pH rises: acute respiratory alkalosis. Renal compensation (HCO₃⁻ excretion) takes days.' },
  { t: 'q', id: 'S4', src: 'AC79', keep: true,
    q: 'Jane is climbing up Mt. Fuji, a mountain 3776 meters tall. What are the physiological changes expected in Jane compared to when Jane is at sea level?',
    o: ['Hypoventilation', 'Respiratory acidosis', 'The oxygen dissociation curve shifts to the right', 'Decreased 2,3-DPG', 'Pulmonary vasodilation'], a: 2,
    ex: 'Hypoxia raises 2,3-BPG, shifting the curve right to help unload O₂. She hyperventilates (respiratory alkalosis), and hypoxia constricts the pulmonary vessels.' },
  { t: 'q', id: 'S5', src: 'AC80 (clinical correlation)', core: true, keep: true,
    q: '(high altitude) 30-year-old man ขึ้นเขา Mont Blanc แล้ว acclimatization 1 วัน เกิดอะไรขึ้น <span class="muted">A 30-year-old man climbs Mont Blanc and acclimatizes for 1 day. What happens?</span>',
    o: ['Changes oxidative enzymes in muscle cell', 'Polycythemia rapidly increases within a day', 'กราฟ Hb-O₂ shift left <span class="muted">(Hb–O₂ curve shifts left)</span>', 'Hyperventilation'], a: 3,
    ex: 'Within minutes to a day, hypoxia drives hyperventilation through the peripheral chemoreceptors. Polycythemia and changes in muscle enzymes take weeks, and the curve shifts right (more 2,3-BPG), not left.' },
  { t: 'c', id: 'S-C3', title: 'Diving & hyperbaric stress: gas laws, barotrauma, and the bends', src: 'Stress p.11–12',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li>Ambient pressure increases by <b>{{1 ATM}} for every {{10 meters}} (33 ft)</b> of seawater descent (at 20 m depth = 3 ATM; at 30 m = 4 ATM).</li>' +
      '<li><b>{{Boyle’s}} law</b> (P₁V₁ = P₂V₂): during breath-hold descent, lung gas volume compresses ("lung squeeze" below residual volume); during SCUBA <b>ascent</b>, compressed gas expands—failing to exhale causes alveolar rupture, <b>{{pneumothorax}}</b>, mediastinal emphysema, and <b>{{arterial gas embolism}}</b>.</li>' +
      '<li><b>{{Henry’s}} law</b> (dissolved gas ∝ partial pressure): breathing compressed air at depth forces high partial pressures of {{N2}} and O₂ into blood and lipid tissues.</li>' +
      '<li>High-pressure gas hazards at depth: <b>{{nitrogen narcosis}}</b> ("rapture of the deep", euphoria/impairment at &gt;30 m / 4 ATM from inert gas dissolving in neuronal membranes) and acute <b>{{O2 toxicity}}</b> (free-radical CNS seizures and pulmonary damage when PO₂ &gt; 2 ATM).</li>' +
      '<li><b>{{Decompression sickness}} (DCS, "the bends")</b>: rapid ascent causes dissolved inert gas to come out of solution as intravascular and tissue {{bubbles}} (joint pain, spinal/CNS ischemia, "the chokes"); prevented by slow staged ascent or breathing {{Heliox}} (helium–O₂) on deep dives, and treated in a <b>{{hyperbaric}} recompression chamber</b>.</li></ul></div>' +
      CVS.fig('stress-diving', 'Volume compression with depth and dissolved gas bubble formation during rapid ascent.', 'stress', 11) + '</div>' },
  { t: 'q', id: 'S6', src: 'AC81', core: true, keep: true,
    q: 'A 50 m scuba dive with an FiO₂ 21% oxygen tank. What is the PIO₂ in this person (in atm unit)?',
    o: ['1.05', '0.21', '0.55', '1.26'], a: 3,
    ex: 'Every 10 m of seawater adds 1 atm, so at 50 m the total pressure is 1 + 5 = 6 atm. PIO₂ = 0.21 × 6 = 1.26 atm (Dalton’s law).' },
  { t: 'c', id: 'S-C4', title: 'Sleep physiology: non-REM vs REM breathing and sleep apnea', src: 'Stress p.13–14',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li>Transition from wakefulness to <b>{{NREM}} sleep</b> removes the cortical "wakefulness drive": minute ventilation falls by {{10–15%}}, breathing is slow and {{regular}}, PaCO₂ rises by {{3–5 mmHg}}, PaO₂ falls slightly, and upper airway resistance increases due to reduced {{pharyngeal dilator}} muscle tone (genioglossus).</li>' +
      '<li>During <b>{{rapid eye movement}} sleep</b>, breathing becomes {{irregular}} with brief apneas, chemosensitivity to hypercapnia and hypoxia is {{depressed}}, and generalized skeletal muscle {{atonia}} inhibits intercostal and upper airway muscles while sparing the <b>{{diaphragm}}</b>.</li>' +
      '<li><b>{{Obstructive}} sleep apnea (OSA)</b>: recurrent pharyngeal collapse during sleep despite preserved respiratory effort (paradoxical chest/abdominal motion, snoring, daytime somnolence, systemic/pulmonary hypertension; treated with {{CPAP}}).</li>' +
      '<li><b>Central sleep apnea (CSA)</b>: transient cessation of brainstem respiratory motor output with absence of both airflow and thoracoabdominal effort.</li></ul></div>' +
      CVS.fig('stress-sleep', 'Ventilatory control, upper airway tone, and blood gas changes across wakefulness and sleep stages.', 'stress', 14) + '</div>' },
  { t: 'q', id: 'S7', src: 'AC81', keep: true,
    q: 'Which of the following is normal physiology during sleep?',
    o: ['Decreased airway resistance', 'Decreased FRC', 'Increased hypercapnic & hypoxic ventilation drive', 'Decreased respiratory rate', 'Increased body temperature'], a: 1,
    ex: 'In sleep lung volume (FRC) falls with lying down and lower muscle tone, upper airway resistance rises, the hypercapnic and hypoxic drives fall, and body temperature falls. Respiratory rate does not fall consistently; it varies with sleep stage.' },
  { t: 'c', id: 'S-C5', title: 'Fetal gas exchange and the cardiopulmonary transition at birth', src: 'Stress p.15–16',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li>In utero, gas exchange occurs in the <b>{{placenta}}</b>; umbilical vein blood has a low PO₂ (~{{30 mmHg}}, ~80% saturated), yet adequate O₂ delivery is maintained by high fetal hemoglobin concentration, <b>{{HbF}} (α₂γ₂)</b> (which binds {{2,3-BPG}} weakly, shifting the ODC {{leftward}} with P₅₀ ≈ {{19 mmHg}}), and the <b>{{double Bohr}} effect</b>.</li>' +
      '<li>Fetal lungs are fluid-filled and hypoxic, causing intense <b>hypoxic pulmonary vasoconstriction</b> (very high {{PVR}}); ~90% of right ventricular output bypasses the lungs via two right-to-left cardiac shunts—the <b>{{foramen ovale}}</b> (RA → LA) and <b>{{ductus arteriosus}}</b> (PA → aorta)—plus the hepatic <b>ductus venosus</b>.</li>' +
      '<li>At birth, the <b>first breath</b> generates strongly negative intrapleural pressure (−40 to −60 cmH₂O) as {{surfactant}} stabilizes expanding alveoli; alveolar oxygenation and expansion cause a dramatic <b>fall in {{pulmonary vascular resistance}}</b> and an 8–10× surge in pulmonary blood flow.</li>' +
      '<li>Clamping the umbilical cord removes the low-resistance placental bed (↑SVR and ↑LA pressure &gt; RA pressure), closing the interatrial flap, while rising PaO₂ and falling {{prostaglandin E2}} constrict the arterial shunt.</li></ul></div>' +
      CVS.fig('stress-fetal', 'Fetal circulation shunts, dissociation curves, and cardiopulmonary changes at the first breath.', 'stress', 15) + '</div>' },
  { t: 'q', id: 'S8', src: 'AC81', core: true, keep: true,
    q: 'Which of the following immediately happens after the infant’s birth?',
    o: ['An increase in pulmonary resistance', 'Closure of the foramen ovale', 'Blood flow through the ductus arteriosus', 'A weak respiratory'], a: 1,
    ex: 'With the first breaths PVR falls and pulmonary blood flow returning to the left atrium raises its pressure above the right, pushing the flap of the foramen ovale shut. The ductus closes over hours to days.' },
  { t: 'q', id: 'S9', src: 'AC80', keep: true,
    q: 'Placenta → pulmonary circulation. What happen when placenta circulation gives way to pulmonary circulation?',
    o: ['Ductus arteriosus closed', 'Decreased PO₂', 'Increase blood flow through foramen ovale', 'Decreased force of respiration', 'Increased pulmonary vascular resistance'], a: 0,
    ex: 'When the lungs take over, PO₂ rises and PVR falls; the shunts close: the ductus arteriosus (becoming the ligamentum arteriosum) and the foramen ovale (becoming the fossa ovalis).' }
]});

    "<b>กลไกผ่านแนวกั้นเลือดและสมอง (Blood-brain barrier)</b> แนวกั้นเลือดและสมองยอมให้ก๊าซ <b>CO<sub>2</sub> แพร่ผ่านได้อย่างอิสระ</b> แต่ไม่ยอมให้ H<sup>+</sup> จากเลือดผ่านได้ง่าย เมื่อ PaCO<sub>2</sub> ในเลือดสูงขึ้น CO<sub>2</sub> จะแพร่เข้าสู่ CSF (ซึ่งมีค่า <b>pH ปกติเท่ากับ 7.32</b>) แล้วทำปฏิกิริยากับน้ำได้กรดคาร์บอนิกและแตกตัวให้ H<sup>+</sup> เนื่องจาก <b>CSF มีความเข้มข้นของโปรตีนต่ำมาก จึงแทบไม่มีตัวบัฟเฟอร์</b> ค่า pH ใน CSF จึงลดลงอย่างรวดเร็วและไปกระตุ้น central chemoreceptors ให้สั่ง DRG เกิด hyperventilation (ส่วนระดับไบคาร์บอเนต HCO<sub>3</sub><sup>&minus;</sup> ใน CSF ถูกควบคุมและปรับเปลี่ยนได้โดย <b>choroid plexus</b>)",
    "<b>Peripheral chemoreceptors (ตัวรับสารเคมีส่วนปลาย)</b> มี 2 ตำแหน่ง คือ <b>Carotid bodies</b> ที่ง่ามแยกของหลอดเลือดแดง common carotid (ส่งสัญญาณผ่าน <b>CN IX / glossopharyngeal nerve</b>) และ <b>Aortic bodies</b> รอบโค้งหลอดเลือดแดงใหญ่ aortic arch (ส่งสัญญาณผ่าน <b>CN X / vagus nerve</b>) เนื้อเยื่อเหล่านี้มีเลือดมาเลี้ยงสูงมากและตอบสนองได้<b>เร็วกว่า</b>ตัวรับส่วนกลาง (รับผิดชอบอีกประมาณ 30% ของแรงขับจาก CO<sub>2</sub>)",
    "<b>สิ่งกระตุ้น Peripheral chemoreceptors และบทบาทในคลินิก</b> ตัวรับที่ carotid body ไวต่อทั้ง <b>PaO<sub>2</sub> ที่ลดลง, PaCO<sub>2</sub> ที่เพิ่มขึ้น และ pH ในเลือดที่ลดลง (H<sup>+</sup> สูงขึ้น)</b> โดยการตอบสนองต่อ PaO<sub>2</sub> เป็นกราฟไม่เชิงเส้น (nonlinear) คือแทบไม่ตอบสนองในภาวะออกซิเจนปกติ แต่จะพุ่งสูงขึ้นเมื่อ PaO<sub>2</sub> ต่ำกว่า 60 mmHg และ<b>ตอบสนองสูงสุดเมื่อ PaO<sub>2</sub> ต่ำกว่า 50 mmHg</b> หากผู้ป่วยได้รับการผ่าตัดเอา carotid body ออกทั้งสองข้าง (bilateral carotid body resection) จะ<b>สูญเสียการตอบสนองต่อภาวะพร่องออกซิเจน (hypoxic ventilatory drive) ไปอย่างสมบูรณ์</b> ส่วนในภาวะกรดเมตาบอลิก (metabolic acidosis) ที่ H<sup>+</sup> ในเลือดสูงโดยไม่ขึ้นกับ PaCO<sub>2</sub> จะกระตุ้น <b>carotid body โดยตรง (ไม่ผ่าน aortic body)</b> ทำให้หายใจหอบลึกที่เรียกว่า <b>Kussmaul breathing</b>",
    "<b>กลไกระดับเซลล์ของ Glomus cell (Type I cell)</b> ใน carotid body มีเซลล์รับความรู้สึกคือ Type I (glomus) cell และเซลล์ค้ำจุนคือ Type II (sustentacular) cell บนเยื่อหุ้มเซลล์ของ glomus cell มีช่อง <b>O<sub>2</sub>-sensitive K<sup>+</sup> channels</b> เมื่อค่า PO<sub>2</sub> ในเลือดแดงลดลง ช่อง K<sup>+</sup> นี้จะถูกยับยั้ง (ปิด) ทำให้ K<sup>+</sup> ไหลออกจากเซลล์ลดลง เกิด <b>membrane depolarization (&Delta;V<sub>m</sub>)</b> ไปเปิดช่อง <b>voltage-gated Ca<sup>2+</sup> channels</b> ให้ Ca<sup>2+</sup> ไหลเข้าสู่เซลล์ แล้วกระตุ้นการหลั่งสารสื่อประสาท (เช่น <b>ATP และ acetylcholine</b>) ไปกระตุ้นใยประสาทรับความรู้สึกของ CN IX"
  ],
  "R-C3": [
    "<b>1. Pulmonary stretch receptors (Slowly adapting)</b> อยู่ในชั้น<b>กล้ามเนื้อเรียบของหลอดลม (airway smooth muscle)</b> ส่งสัญญาณขึ้นไปตามเส้นประสาทเวกัส (CN X) ชนิด<b>มีไมอีลิน (myelinated fibers)</b> ตอบสนองต่อการยืดขยายของปอดอย่างต่อเนื่อง ทำให้เกิด <b>Hering-Breuer inflation reflex</b> ซึ่งยับยั้งการหายใจเข้าและทำให้<b>ความถี่ของการหายใจช้าลงโดยการยืดเวลาหายใจออกให้ยาวขึ้น</b> หากตัดเส้นประสาทเวกัสทั้งสองข้าง (bilateral vagotomy) ในสัตว์ทดลองจะทำให้หายใจช้าและลึก แต่ในผู้ใหญ่ที่ตื่นอยู่ การบล็อกเส้นประสาทเวกัสชั่วคราวไม่เปลี่ยนอัตราหรือปริมาตรการหายใจปกติ (รีเฟล็กซ์นี้มีความสำคัญใน<b>ทารกแรกเกิด</b>)",
    "<b>2. Irritant receptors (Rapidly adapting pulmonary stretch receptors)</b> แทรกอยู่ระหว่าง<b>เซลล์เยื่อบุทางเดินหายใจ (airway epithelial cells)</b> ส่งสัญญาณผ่านเส้นใย<b>มีไมอีลิน</b>ของ CN X เช่นกัน ถูกกระตุ้นโดยก๊าซพิษ ควันบุหรี่ ฝุ่นละออง ลมเย็น และสาร <b>histamine</b> ที่หลั่งออกมา ผลของรีเฟล็กซ์คือทำให้เกิด<b>หลอดลมตีบ (bronchoconstriction), อาการไอ และหายใจแรงขึ้น (hyperpnea)</b> ซึ่งมีบทบาทสำคัญในการเกิดหลอดลมตีบในผู้ป่วย<b>โรคหืด (asthma attacks)</b>",
    "<b>3. J receptors (Juxtacapillary receptors)</b> เป็นปลายประสาทของเส้นใยเวกัสชนิด<b>ไม่มีไมอีลิน (nonmyelinated C-fibers)</b> ที่นำสัญญาณช้า อยู่ใน<b>ผนังถุงลม (alveolar walls)</b> ชิดกับหลอดเลือดฝอยปอด และได้รับเลือดเลี้ยงจาก<b>ระบบไหลเวียนเลือดปอด (pulmonary circulation)</b> ถูกกระตุ้นอย่างรวดเร็วเมื่อมีสารเคมีในหลอดเลือดปอด หรือเมื่อหลอดเลือดฝอยปอดคั่งและมีของเหลวเพิ่มขึ้นในเนื้อเยื่อเกี่ยวพันของผนังถุงลม เช่น ในผู้ป่วย<b>ภาวะหัวใจซ้ายวาย (left-sided heart failure)</b> หรือโรคเนื้อเยื่อปอดอักเสบ (interstitial lung disease) ทำให้เกิดการ<b>หายใจเร็วและตื้น (rapid, shallow breathing)</b> หลอดลมตีบ และหลั่งมูก (หากถูกกระตุ้นรุนแรงจะทำให้หยุดหายใจ apnea)",
    "<b>4. Bronchial C-fibers</b> เป็นเส้นใยประสาทชนิดไม่มีไมอีลินในผนังหลอดลมที่ได้รับเลือดเลี้ยงจาก<b>หลอดเลือดแดงหลอดลม (bronchial circulation)</b> ตอบสนองอย่างรวดเร็วต่อสารเคมีที่ฉีดเข้าสู่ระบบไหลเวียนหลอดลม ให้ผลรีเฟล็กซ์คล้าย J receptors คือ หายใจเร็วตื้น หลอดลมตีบ และเพิ่มการหลั่งมูก",
    "<b>5. ตัวรับความรู้สึกอื่นๆ นอกปอด (Other receptors)</b> ได้แก่ (1) <b>ตัวรับในจมูกและทางเดินหายใจส่วนต้น</b> ทำให้เกิดการจาม ไอ หลอดลมตีบ และกล่องเสียงหดเกร็ง (laryngeal spasm); (2) <b>Joint and muscle receptors</b> จากแขนขาที่เคลื่อนไหว ช่วยกระตุ้นการหายใจในช่วงเริ่มต้นของการออกกำลังกาย; (3) <b>Gamma system (muscle spindles)</b> ในกล้ามเนื้อระหว่างซี่โครงและกะบังลม รับรู้การยืดยาวของกล้ามเนื้อ; (4) <b>Arterial baroreceptors</b> เมื่อความดันโลหิตแดงสูงขึ้นจะเกิด<b>รีเฟล็กซ์กดการหายใจ (reflex hypoventilation)</b>; และ (5) <b>ความปวดและอุณหภูมิ</b> ความปวดมักทำให้หยุดหายใจชั่วครู่ตามด้วยหายใจเร็วขึ้น ส่วนการเพิ่มอุณหภูมิผิวหนังทำให้เกิด hyperventilation"
  ],
  "R-C4": [
    "<b>การตอบสนองต่อคาร์บอนไดออกไซด์ (Ventilatory response to CO<sub>2</sub>)</b> ในสภาวะปกติ <b>PaCO<sub>2</sub> ในเลือดแดงเป็นตัวกระตุ้นการหายใจที่สำคัญที่สุด</b>และถูกควบคุมไว้อย่างเข้มงวด (ส่วนใหญ่ ~70% มาจาก central chemoreceptors และอีก ~30% มาจาก peripheral chemoreceptors ซึ่งตอบสนองเร็วกว่า) กราฟความสัมพันธ์ระหว่างอัตราระบายอากาศกับ PCO<sub>2</sub> เป็นเส้นตรง โดยหากมีภาวะ<b>พร่องออกซิเจน (PaO<sub>2</sub> ต่ำลง เช่น 47 mmHg) ร่วมด้วย การตอบสนองต่อ CO<sub>2</sub> จะถูกขยายให้แรงขึ้น (ความชันเพิ่มขึ้นและเลื่อนไปทางซ้าย)</b> ในทางตรงข้าม การนอนหลับและอายุที่มากขึ้นจะลดการตอบสนองลง",
    "<b>การตอบสนองต่อออกซิเจน (Ventilatory response to PO<sub>2</sub>)</b> เกิดจากทำงานของ <b>peripheral chemoreceptors เท่านั้น</b> เมื่อระดับ PCO<sub>2</sub> ปกติ (ประมาณ 36 mmHg) การลดลงของ PO<sub>2</sub> จะแทบไม่กระตุ้นการหายใจเพิ่มขึ้นเลย จนกว่า <b>PaO<sub>2</sub> จะลดลงมาอยู่ที่ประมาณ 60 mmHg หรือต่ำกว่า</b> กราฟจึงจะพุ่งสูงขึ้นอย่างรวดเร็ว กลไกนี้จึงมีความสำคัญมากในที่สูง (high altitude) และในผู้ป่วยโรคปอดเรื้อรังที่มีภาวะพร่องออกซิเจนเรื้อรัง",
    "<b>ภาวะ CO<sub>2</sub> คั่งเรื้อรัง และกลไกการเกิด CO<sub>2</sub> narcosis (หน้า 44–45)</b> ในผู้ป่วยโรคปอดเรื้อรังที่มี CO<sub>2</sub> คั่งเรื้อรัง สมองจะปรับเพิ่ม HCO<sub>3</sub><sup>&minus;</sup> ใน CSF จน pH ใน CSF กลับมาใกล้เคียงปกติ ทำให้ central chemoreceptors ไม่ค่อยตอบสนองต่อ CO<sub>2</sub> และผู้ป่วยต้องพึ่งพา <b>hypoxic drive จาก peripheral chemoreceptors</b> เป็นหลัก หากให้ออกซิเจนมากเกินไปจะเกิดภาวะ <b>CO<sub>2</sub> narcosis (acute on top respiratory acidosis)</b> จาก 2 กลไกหลักตามสไลด์หน้า 45 คือ: (1) <b>ลด hypoxic ventilatory response</b> ทำให้ผู้ป่วยหายใจแผ่วลง (<b>hypoventilation</b>) และ (2) <b>ลด hypoxic pulmonary vasoconstriction (HPV)</b> ทำให้เลือดไหลไปเลี้ยงถุงลมที่ระบายอากาศไม่ดีมากขึ้น เกิด <b>V/Q mismatch เพิ่มขึ้น</b> ส่งผลให้ CO<sub>2</sub> คั่งในเลือดสูงขึ้นอย่างรวดเร็ว",
    "<b>การตอบสนองต่อค่า pH (Ventilatory response to pH)</b> ในภาวะกรดเมตาบอลิก (metabolic acidosis) ซึ่งมีค่า pH ต่ำและ PCO<sub>2</sub> ต่ำ จะเกิดการกระตุ้นการหายใจผ่าน <b>peripheral chemoreceptors ที่ carotid bodies เท่านั้น (ไม่ผ่าน aortic bodies)</b> และหากภาวะกรดรุนแรงมากจึงอาจกระตุ้น central chemoreceptors ร่วมด้วย",
    "<b>การตอบสนองต่อการออกกำลังกาย (Exercise) และที่สูง (High altitude)</b> ขณะออกกำลังกายระดับปานกลาง อัตราการหายใจและประสิทธิภาพการแลกเปลี่ยนก๊าซเพิ่มขึ้นอย่างมากจากคำสั่งของ cortex, สัญญาณจากแขนขา (joint/muscle receptors) และอุณหภูมิร่างกายที่สูงขึ้น ทำให้ค่า <b>PaO<sub>2</sub>, PaCO<sub>2</sub> และ pH ในเลือดแดงยังคงปกติ</b> (ยกเว้นเมื่อออกกำลังกายหนักมากจนเกิด <b>lactic acidosis</b> จึงทำให้ pH ลดลง) ส่วนการขึ้นที่สูง ความดันบรรยากาศต่ำทำให้ PaO<sub>2</sub> ลดลง กระตุ้น peripheral chemoreceptors ให้เกิด hyperventilation &rarr; <b>respiratory alkalosis</b>, ร่างกายสร้าง 2,3-DPG เพิ่มขึ้น (กราฟ O<sub>2</sub>-Hb เลื่อนขวา), หลอดเลือดปอดหดตัวจาก hypoxia (ทำให้ความดันหลอดเลือดปอดสูงและหัวใจห้องขวาล่างโต) และไตสร้างฮอร์โมน <b>erythropoietin (EPO)</b> เพิ่มการสร้างเม็ดเลือดแดง"
  ],
  "R-C5": [
    "<b>Eupnea และ Sigh</b> <b>Eupnea</b> คือการหายใจเข้าออกปกติที่มีจังหวะและความลึกสม่ำเสมอ ส่วน <b>Sigh (การถอนหายใจ)</b> คือการสูดหายใจเข้าลึกกว่าปกติแทรกเป็นระยะตามด้วยช่วงหยุดสั้นๆ ซึ่งช่วยเปิดถุงลมที่แฟบให้ขยายตัวออก",
    "<b>Cheyne-Stokes respiration</b> มีลักษณะเป็นวงจรที่ความลึกของการหายใจ<b>ค่อยๆ เพิ่มขึ้นแล้วค่อยๆ ลดลง (crescendo–decrescendo / waxing and waning) สลับกับช่วงหยุดหายใจ (apnea)</b> อย่างเป็นจังหวะ พบในภาวะที่การไหลเวียนเลือดจากปอดไปสมองล่าช้า (เช่น หัวใจล้มเหลวเรื้อรัง) หรือมีความไวของศูนย์ควบคุมต่อ CO<sub>2</sub> สูงผิดปกติ (เช่น สมองบาดเจ็บ หรือนอนหลับบนที่สูง)",

    "<b>Cluster breathing (Biot's breathing) และ Ataxic breathing</b> <b>Cluster breathing</b> คือการหายใจเป็นกลุ่มๆ (กลุ่มละหลายครั้ง) คั่นด้วยช่วงหยุดหายใจ โดยไม่มีลักษณะค่อยๆ แรงขึ้นและเบาลงเหมือน Cheyne-Stokes พบรอยโรคที่พอนส์หรือเมดัลลา ส่วน <b>Ataxic breathing</b> คือการหายใจที่<b>ไร้ระเบียบอย่างสิ้นเชิง ทั้งความลึกและจังหวะไม่สม่ำเสมอ</b> เกิดจากความเสียหายต่อศูนย์ควบคุมการหายใจใน <b>medulla</b> โดยตรง",

    if (!zoom.hidden) { if (k === 'Escape' || k === ' ' || k === 'Enter') { e.preventDefault(); closeZoom(); } return; }
    if (view !== 'present') { if (k === 'b' || k === 'B') setView('present'); return; }
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter') { go(1); e.preventDefault(); return; }
    if (k === 'ArrowLeft' || k === 'PageUp') { go(-1); e.preventDefault(); return; }
    if (k === 'b' || k === 'B') { setView('browse'); return; }
  });
  var tx = null;
  document.addEventListener('touchstart', function (e) {
    if (view !== 'present' || e.touches.length !== 1) { tx = null; return; }
    var t = e.target; if (t && t.closest && t.closest('.tblwrap, .tabs')) { tx = null; return; }
    tx = [e.touches[0].clientX, e.touches[0].clientY];
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (!tx) return;
    var dx = e.changedTouches[0].clientX - tx[0], dy = e.changedTouches[0].clientY - tx[1];
    if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy)) go(dx < 0 ? 1 : -1);
    tx = null;
  }, { passive: true });
  window.addEventListener('hashchange', function () { jumpTo(location.hash.slice(1)); });

  /* ---------- follow the student deck (same browser, another tab or window) ---------- */
  var follow = LS.get('follow', true);
  function readDeckPos() { try { var v = localStorage.getItem('rsdeck:pos'); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function followTo(id) {
    if (!follow || !id || (view === 'present' && seq[idx] && seq[idx].id === id)) return;
    if (view === 'browse') { var el = document.querySelector('#blist [data-id="' + id + '"]'); if (el) { el.scrollIntoView({ block: 'start' }); return; } }
    if (jumpTo(id)) { try { window.scrollTo(0, 0); } catch (e) { } }
  }
  window.addEventListener('storage', function (e) { if (e.key === 'rsdeck:pos' && e.newValue) { try { followTo(JSON.parse(e.newValue)); } catch (err) { } } });
  try { var bc = new BroadcastChannel('rs-peer-82'); bc.onmessage = function (e) { if (e.data && e.data.pos) followTo(e.data.pos); }; } catch (e) { }
  $('follow').checked = follow;
  $('follow').addEventListener('change', function () { follow = this.checked; LS.set('follow', follow); if (follow) followTo(readDeckPos()); });

  /* ---------- start ---------- */
  $('tabs').innerHTML = S.map(function (s, si) { return '<button type="button" class="tab" data-sec="' + si + '"><span class="k">' + s.id + '</span>' + s.short + '</button>'; }).join('');
  var th = LS.get('theme', null); if (th === 'dark' || th === 'light') document.documentElement.setAttribute('data-theme', th);

  function start(data) {
    data = data || {};
    if (data.state) state = data.state;
    coreOnly = typeof data.coreOnly === 'boolean' ? data.coreOnly : !!LS.get('core', false);
    $('coreOnly').checked = coreOnly;
    buildSeq();
    var want = location.hash ? location.hash.slice(1) : (data.pos || (follow && readDeckPos()) || LS.get('pos', 'start'));
    var k = find(want); idx = k >= 0 ? k : 0;
    setView(data.view || LS.get('view', 'present'));
  }
  var hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') {
    try { hot.snapshot(function () { return { state: state, view: view, coreOnly: coreOnly, pos: seq[idx] && seq[idx].id }; }); } catch (e) { }
  }
  if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();
