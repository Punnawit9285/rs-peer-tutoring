<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RS I Anatomy, Histology &amp; Physiology &#183; Peer support 82 (Tutor)</title>
<meta name="description" content="Question-first peer-tutoring deck: anatomy, histology and physiology of the respiratory system (RS I).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root {
  /* Layout: a lab-bench stage. One large card at a time on chart-recorder paper, a strip of eight lab stations above, a sticky pager below. Browse = one scrolling worksheet. */
  --paper: #f3f5f8;      /* page ground, cool grey */
  --sheet: #ffffff;      /* card */
  --sheet2: #edf0f5;     /* inset panels */
  --ink: #19202e;        /* text */
  --ink2: #4f5a6e;       /* secondary text */
  --rule: #d4dae4;       /* hairlines */
  --grid: #e9edf3;       /* chart-paper grid */
  --art: #ae1530;        /* arterial red: brand, tracings */
  --art-soft: #fbe5e9;
  --ven: #1f4f97;        /* venous blue: controls, second tracing */
  --ven-soft: #e2ebf8;
  --ok: #13744a; --ok-soft: #dff2e7;
  --bad: #b02f19; --bad-soft: #fbe6df;
  --warn: #775100; --warn-soft: #fbefd2;
  --scanbg: #ffffff;     /* paper behind real figures */
  --f-display: "Bai Jamjuree", "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1117; --sheet: #161a22; --sheet2: #1e232e; --ink: #e5e8ef; --ink2: #a3abbc; --rule: #2b3240; --grid: #1f2530;
    --art: #ff6f84; --art-soft: #3a1b23; --ven: #8db3f2; --ven-soft: #1a2840;
    --ok: #4fc98b; --ok-soft: #13301f; --bad: #ff8b74; --bad-soft: #391e17; --warn: #efc04e; --warn-soft: #32280e; --scanbg: #e6e3dc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1117; --sheet: #161a22; --sheet2: #1e232e; --ink: #e5e8ef; --ink2: #a3abbc; --rule: #2b3240; --grid: #1f2530;
  --art: #ff6f84; --art-soft: #3a1b23; --ven: #8db3f2; --ven-soft: #1a2840;
  --ok: #4fc98b; --ok-soft: #13301f; --bad: #ff8b74; --bad-soft: #391e17; --warn: #efc04e; --warn-soft: #32280e; --scanbg: #e6e3dc;
  color-scheme: dark;
}
html { -webkit-text-size-adjust: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ven); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- cards ---------- */
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: clamp(16px, 2.6vw, 34px); min-width: 0; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; font-family: var(--f-mono); font-size: .8em; color: var(--ink2); }
.eyebrow .id { font-weight: 600; color: var(--art); font-size: 1.12em; letter-spacing: .02em; }
.chip { border-radius: 999px; padding: 2px 9px; background: var(--sheet2); color: var(--ink2); white-space: nowrap; }
.chip.core { background: var(--art-soft); color: var(--art); }
.chip.kind { background: var(--ven-soft); color: var(--ven); }
.chip.grp { background: transparent; border: 1px dashed var(--rule); }
.concept h2, .secard h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.6em; line-height: 1.2; margin: 0 0 14px; text-wrap: balance; letter-spacing: .005em; }
.cbody { display: grid; gap: 16px; }
.cbody > * { min-width: 0; }
.muted { color: var(--ink2); font-weight: 400; }

/* ---------- question cards ---------- */
.stem { font-size: 1.26em; font-weight: 500; line-height: 1.45; margin: 2px 0 16px; text-wrap: pretty; }
.stem b { color: var(--art); font-weight: 600; }
.stem .muted { font-size: .82em; display: block; margin-top: 4px; }
.qfig { margin: 0 0 16px; }
.opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.opt { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; text-align: left; background: var(--sheet); color: var(--ink); border: 1.5px solid var(--rule); border-radius: 10px; padding: .6em .85em; cursor: pointer; transition: border-color .15s, background-color .15s, opacity .15s; line-height: 1.4; }
.opt:hover { border-color: var(--ven); }
.opt .L { font: 600 .88em var(--f-mono); width: 2em; height: 2em; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--rule); color: var(--ink2); }
.opt .mk { font-weight: 700; min-width: 1em; }
.opt.sel { border-color: var(--ven); background: var(--ven-soft); }
.opt.sel .L { border-color: var(--ven); color: var(--ven); }
.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tfrow .opt { padding: .9em 1em; font-size: 1.08em; font-weight: 500; }
.rev .opt { cursor: default; }
.rev .opt.isans, .showall .opt.isans { border-color: var(--ok); background: var(--ok-soft); }
.rev .opt.isans .L, .showall .opt.isans .L { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.rev .opt.isans .mk::after, .showall .opt.isans .mk::after { content: "\2713"; color: var(--ok); }
.rev .opt.sel:not(.isans) { border-color: var(--bad); background: var(--bad-soft); }
.rev .opt.sel:not(.isans) .L { border-color: var(--bad); color: var(--bad); }
.rev .opt.sel:not(.isans) .mk::after { content: "\2717"; color: var(--bad); }
.rev .opt:not(.isans):not(.sel) { opacity: .55; }
.think { margin: 0; color: var(--ink2); font-style: italic; }
.explain { margin-top: 16px; background: var(--ok-soft); border-radius: 12px; padding: 14px 18px; }
.qcard:not(.rev) .explain { display: none; }
.showall .qcard .explain { display: block; }
.explain .ans { font: 600 1.02em var(--f-display); color: var(--ok); margin-bottom: 4px; }
.explain p { margin: 0; }
.flag { margin-top: 10px; background: var(--warn-soft); border-radius: 10px; padding: 8px 12px; font-size: .9em; }
.flag b { color: var(--warn); }

/* ---------- concept building blocks ---------- */
.two { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.figpair { grid-template-columns: minmax(0, .75fr) minmax(0, 1.25fr); align-items: center; }
@media (max-width: 760px) { .two, .cols2, .cols3, .figpair { grid-template-columns: 1fr; } }
.mini { background: var(--sheet2); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.mini h4 { margin: 0 0 6px; font: 600 1em var(--f-display); letter-spacing: .01em; }
.mini.art h4 { color: var(--art); }
.mini.ven h4 { color: var(--ven); }
.mini p { margin: 0; }
.mini ul { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }
.pts { margin: 0; padding-left: 1.2em; display: grid; gap: 7px; }
.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 7px; }
.steps.tight { gap: 3px; }
.note { margin: 0; background: var(--ven-soft); border-radius: 10px; padding: 10px 14px; }
.trap { margin: 0; background: var(--warn-soft); border-radius: 10px; padding: 10px 14px; }
.trap::before { content: "Exam trap \00B7  "; font-weight: 600; color: var(--warn); }
.eqn { font: 600 1.65em var(--f-display); text-align: center; letter-spacing: .02em; padding: 6px 0; }
.eqn span { color: var(--art); }
.speeds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .speeds { grid-template-columns: 1fr; } }
.speed { border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; background: var(--sheet); }
.sp-h { display: grid; gap: 2px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed var(--rule); }
.sp-h .mono { font-family: var(--f-mono); font-size: .8em; color: var(--ink2); }
.s1 .sp-h b { color: var(--art); }
.s2 .sp-h b { color: var(--warn); }
.s3 .sp-h b { color: var(--ven); }
.speed ul { margin: 0; padding-left: 1.1em; display: grid; gap: 3px; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.flow.col { flex-direction: column; align-items: stretch; }
.fbox { border: 1px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 8px 12px; flex: 1 1 140px; min-width: 0; }
.fbox.start { background: var(--sheet2); }
.fbox.end { background: var(--ok-soft); border-color: var(--ok); }
.fbox.art { background: var(--art-soft); border-color: var(--art); }
.fbox.ven { background: var(--ven-soft); border-color: var(--ven); }
.farrow { color: var(--ink2); font-weight: 600; flex: none; text-align: center; }
.flow.col .farrow { font-size: .9em; }
.fstack { display: grid; gap: 8px; flex: 2 1 260px; min-width: 0; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 600px) { .fgrid { grid-template-columns: 1fr; } }
.cycle { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.cycle .ph { flex: 1 1 130px; background: var(--sheet2); border-radius: 8px; padding: 8px 10px; font-weight: 600; font-size: .92em; display: grid; gap: 2px; align-content: start; }
.cycle .ph span { font-weight: 400; color: var(--ink2); font-size: .88em; }
.cycle .sd { flex: none; align-self: center; font: 700 .9em var(--f-mono); color: var(--sheet); background: var(--ink); border-radius: 999px; padding: 4px 10px; }

/* ---------- tables ---------- */
.tblwrap { overflow-x: auto; min-width: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: .92em; }
.tbl caption { text-align: left; font: 600 .95em var(--f-display); padding-bottom: 6px; }
.tbl th, .tbl td { border-bottom: 1px solid var(--rule); padding: 7px 10px; text-align: left; vertical-align: top; }
.tbl thead th { font-family: var(--f-mono); font-size: .76em; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); background: var(--sheet2); }
.tbl td.num { font-variant-numeric: tabular-nums; font-family: var(--f-mono); white-space: nowrap; }
.tbl .up { color: var(--art); font-weight: 600; }
.tbl .dn { color: var(--ven); font-weight: 600; }
.tbl thead th.up { color: var(--art); }
.tbl thead th.dn { color: var(--ven); }
.tbl.compact th, .tbl.compact td { padding: 4px 8px; }
.dogtbl td:nth-child(2), .dogtbl td:nth-child(3), .dogtbl td:nth-child(4) { text-align: center; white-space: nowrap; }

/* ---------- real figures cropped from the course material ---------- */
.stack { display: grid; gap: 12px; align-content: start; min-width: 0; }
.scan { margin: 0; min-width: 0; display: grid; gap: 6px; align-content: start; }
.paperimg { background: var(--scanbg); border: 1px solid var(--rule); border-radius: 10px; padding: 8px; isolation: isolate; }
.scan img { display: block; width: auto; max-width: 100%; height: auto; max-height: min(440px, 62vh); margin: 0 auto; mix-blend-mode: multiply; cursor: zoom-in; border-radius: 4px; }
.scan.tall img { max-height: min(480px, 66vh); }
.scanrow .scan img { max-height: 360px; }
.scan figcaption { font-size: .84em; line-height: 1.4; color: var(--ink2); text-wrap: pretty; }
.scan figcaption .src { font-family: var(--f-mono); font-size: .88em; white-space: nowrap; opacity: .9; }
.scan figcaption .src::before { content: "\00B7  "; }
.scan figcaption.srconly .src::before { content: none; }
.scanrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; align-items: start; min-width: 0; }
.qfig .scan { max-width: 760px; }
.qfig .scan.tall { max-width: 560px; }

/* ---------- cloze blanks: {{key detail}} in concept cards ---------- */
.cz { border-radius: 4px; padding: 0 .22em; background: var(--sheet2); color: transparent; box-shadow: inset 0 -2px 0 var(--art); cursor: pointer; -webkit-box-decoration-break: clone; box-decoration-break: clone; transition: color .18s, background-color .18s; }
.cz * { color: transparent !important; }
.cz:hover { background: var(--art-soft); }
.cz.on, .czopen .cz, .showall .cz { color: inherit; background: var(--art-soft); }
.cz.on *, .czopen .cz *, .showall .cz * { color: inherit !important; }
.cz.last { animation: czpop .5s ease-out; }
@keyframes czpop { 0% { box-shadow: inset 0 -2px 0 var(--art), 0 0 0 4px var(--art-soft); } 100% { box-shadow: inset 0 -2px 0 var(--art), 0 0 0 0 transparent; } }
@media print { .cz { color: inherit; background: none; } .cz * { color: inherit !important; } }

/* ---------- figure zoom ---------- */
.zoom { position: fixed; inset: 0; z-index: 60; background: rgba(6, 8, 12, .88); display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
.zoom[hidden] { display: none; }
.zoom .zbox { display: grid; gap: 10px; justify-items: center; max-width: 100%; }
.zoom .zpaper { background: #fff; border-radius: 10px; padding: 10px; max-width: min(1700px, 100%); }
.zoom img { display: block; max-width: 100%; max-height: calc(100vh - 120px); width: auto; height: auto; }
.zoom .zcap { color: #e5e8ef; font-size: .92em; text-align: center; max-width: 900px; margin: 0; }

/* Thai explanation under each concept card (student deck: collapsible; tutor deck: open) */
.thx { margin-top: 16px; border: 1px solid var(--rule); border-left: 3px solid var(--ok); border-radius: 10px; background: var(--sheet); padding: 0 14px; }
.thx summary { cursor: pointer; padding: 10px 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.thx summary::marker, .thx summary::-webkit-details-marker { color: var(--ok); }
.thx-h { font: 600 1.02em var(--f-display); color: var(--ok); }
.thx-s { font: .74em var(--f-mono); color: var(--ink2); }
.thx[open] summary { border-bottom: 1px dashed var(--rule); margin-bottom: 10px; }
.thx-body { display: grid; gap: 9px; padding-bottom: 14px; line-height: 1.7; font-family: "IBM Plex Sans Thai", var(--f-body); }
.thx-body p { margin: 0; }
.thx-body b { font-weight: 600; color: var(--ink); }

/* cover: counts + QR to the live deck (student deck start card and PDF cover) */
.coverline { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px 32px; margin: 4px 0 22px; padding: 14px 0 16px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.counts { display: flex; gap: 44px; }
.counts > div { display: grid; }
.counts b { font: 600 3.2em/1 var(--f-display); letter-spacing: -.01em; }
.counts span { font: .8em var(--f-mono); color: var(--ink2); letter-spacing: .04em; margin-top: 5px; }
.qrlink { display: grid; justify-items: end; gap: 6px; color: var(--ink2); text-decoration: none; }
.qrlink .qrcap { font: 500 .78em var(--f-body); color: var(--ink2); }
.qrlink img { width: 112px; height: 112px; display: block; }
.qrlink span { font: .72em var(--f-mono); }
.qrlink:hover span { color: var(--ven); text-decoration: underline; }
.legend { margin: 14px 0 0; font: .8em var(--f-mono); color: var(--ink2); }
.legend .chip { margin-right: 6px; }
@media (max-width: 560px) { .qrlink .qrcap, .qrlink img { display: none; } .qrlink { justify-items: start; } .counts b { font-size: 2.6em; } }

/* figure that would give away a card's blanks: collapsed behind a summary (closed in the PDF) */
.figans { border: 1px dashed var(--rule); border-radius: 10px; padding: 8px 12px; }
.figans summary { cursor: pointer; font: 500 .85em var(--f-mono); color: var(--ink2); }
.figans[open] summary { margin-bottom: 8px; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--sheet); border-bottom: 1px solid var(--rule); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px 18px; align-items: center; }
@media (max-width: 1020px) { .bar { grid-template-columns: minmax(0, 1fr) auto; } .tabs { grid-column: 1 / -1; order: 3; } }
.brand { display: flex; gap: 10px; align-items: center; min-width: 0; }
.brand svg { flex: none; width: 38px; height: 22px; }
.brand b { display: block; font: 600 1.05rem var(--f-display); letter-spacing: .01em; white-space: nowrap; }
.brand small { display: block; color: var(--ink2); font: .72rem var(--f-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; gap: 6px; overflow-x: auto; min-width: 0; padding-block: 2px; scrollbar-width: thin; }
.tab { flex: none; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink2); border-radius: 999px; padding: 5px 12px; font-size: .84rem; font-weight: 500; cursor: pointer; white-space: nowrap; }
.tab:hover { border-color: var(--ven); color: var(--ink); }
.tab .k { font-family: var(--f-mono); color: var(--art); margin-right: 6px; font-weight: 600; }
.tab[aria-current="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.tab[aria-current="true"] .k { color: var(--art-soft); }
.ctrls { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.decklink { border: 1px solid var(--art); background: var(--art-soft); color: var(--art); border-radius: 8px; padding: 5px 10px; font-size: .82rem; font-weight: 600; text-decoration: none; white-space: nowrap; }
.decklink:hover { background: var(--art); color: var(--sheet); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink2); padding: 6px 11px; font-size: .85rem; font-weight: 500; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ven); color: var(--sheet); }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: .85rem; color: var(--ink2); cursor: pointer; user-select: none; white-space: nowrap; }
.chk input { accent-color: var(--art); width: 16px; height: 16px; margin: 0; }
.icon { display: inline-grid; place-items: center; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 8px; height: 32px; width: 34px; padding: 0; cursor: pointer; }
.icon svg { width: 16px; height: 16px; }
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 0; }
#present { max-width: 1180px; margin: 0 auto; }
#present .card { font-size: clamp(15px, .5vw + 11.5px, 20px); }
.stage { min-height: 55vh; }
.eyebrow .sp { flex: 1; }
.pager { position: sticky; bottom: 0; z-index: 5; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 10px; align-items: center; background: var(--paper); padding-block: 12px calc(10px + env(safe-area-inset-bottom, 0px)); margin-top: 14px; border-top: 1px solid var(--rule); }
.pos { font-family: var(--f-mono); font-size: .82rem; color: var(--ink2); text-align: center; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pos span { color: var(--art); font-weight: 600; }
.btn { border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 10px; padding: 9px 14px; font-size: .95rem; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--ven); }
.btn.primary { background: var(--art); color: var(--sheet); border-color: var(--art); min-width: 7em; }
.btn.small { padding: 5px 11px; font-size: .85rem; }
.btn:disabled { opacity: .4; cursor: default; }
.prog { grid-column: 1 / -1; height: 3px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--art); width: 0; transition: width .2s; }
.keys { grid-column: 1 / -1; font: .72rem var(--f-mono); color: var(--ink2); text-align: center; }
@media (max-width: 560px) { .keys { display: none; } }

/* intro and section cards */
.secard .lede { font-size: 1.05em; color: var(--ink2); margin: 0 0 14px; max-width: 70ch; line-height: 1.55; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 26px; font-family: var(--f-mono); font-size: .82em; color: var(--ink2); margin-bottom: 16px; }
.stats b { font: 600 1.7em var(--f-display); color: var(--ink); display: block; line-height: 1.1; }
.minih { font: 600 .8em var(--f-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--ink2); margin: 14px 0 8px; }
.toc { margin: 0; padding-left: 0; list-style: none; columns: 2 280px; column-gap: 28px; }
.toc li { break-inside: avoid; margin-bottom: 5px; }
.toc .tid { font-family: var(--f-mono); color: var(--art); font-size: .85em; margin-right: 8px; }
.stations { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin: 4px 0 16px; }
.station { text-align: left; border: 1px solid var(--rule); background: var(--sheet2); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: grid; gap: 2px; }
.station:hover { border-color: var(--ven); }
.station .k { font: 600 .78rem var(--f-mono); color: var(--art); }
.station b { font: 600 1.05rem var(--f-display); }
.station span:last-child { color: var(--ink2); font-size: .86rem; }

/* tutor bullet explanations & concept key points */
.ex-list { margin: 6px 0 0; padding-left: 1.25em; display: grid; gap: 5px; line-height: 1.55; }
.ex-list li::marker { color: var(--ok); }
.tpoints { margin-bottom: 14px; background: var(--ven-soft); border-left: 3px solid var(--ven); border-radius: 10px; padding: 10px 14px; }
.tpoints .tp-head { font: 600 .75em var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ven); margin-bottom: 4px; }
.tpoints ul { margin: 0; padding-left: 1.25em; display: grid; gap: 4px; line-height: 1.5; }
.traps-box { margin: 12px 0; background: var(--warn-soft); border-left: 3px solid var(--warn); border-radius: 10px; padding: 10px 14px; }
.traps-box .tp-head { font: 600 .75em var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--warn); margin-bottom: 4px; }
.traps-box ul { margin: 0; padding-left: 1.25em; display: grid; gap: 4px; line-height: 1.5; }

/* browse */
#browse { max-width: 1000px; margin: 0 auto; padding-bottom: 48px; }
.btools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding-block: 4px 6px; }
.btools input[type="search"] { flex: 1 1 260px; min-width: 0; border: 1px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 9px 12px; }
.bcount { font: .8rem var(--f-mono); color: var(--ink2); }
.bsec { display: grid; gap: 14px; margin-top: 28px; }
.bsec > header { scroll-margin-top: 130px; }
.bsec > header h2 { font: 600 1.5rem var(--f-display); margin: 0; text-wrap: balance; }
.bsec > header p { margin: 4px 0 0; color: var(--ink2); }
.bsec > header .eyebrow { margin-bottom: 6px; }
#blist .card { font-size: 15px; scroll-margin-top: 130px; }
#blist .stem { font-size: 1.1em; }

/* recording script: SAY lines, 80% summary, video plan */
.saybox { margin: 12px 0 0; background: var(--sheet2); border-left: 3px solid var(--art); border-radius: 10px; padding: 10px 14px; }
.concept .saybox, .secard .saybox { margin: 0 0 14px; }
.saybox .tp-head { font: 600 .75em var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--art); margin-bottom: 4px; }
.saybox p { margin: 0; line-height: 1.55; }
.u80 { margin: 12px 0; border: 1px solid var(--rule); border-radius: 10px; padding: 0 14px; background: var(--sheet); }
.u80 summary { cursor: pointer; padding: 10px 0; font: 600 .95em var(--f-display); }
.u80 summary span { font: 400 .78em var(--f-mono); color: var(--ink2); margin-left: 8px; }
.u80[open] summary { border-bottom: 1px dashed var(--rule); margin-bottom: 10px; }
.u80 ol { margin: 0 0 12px; padding-left: 1.3em; display: grid; gap: 7px; line-height: 1.5; }
.plan td:nth-child(4) { min-width: 15em; }
.plan td:first-child { white-space: nowrap; font-weight: 600; }
/* phone: controls get their own row so the header never widens the page */
@media (max-width: 640px) { .bar { grid-template-columns: minmax(0, 1fr); position: relative; } .ctrls { justify-content: flex-start; } }
.brand > div { min-width: 0; }
.brand b { overflow: hidden; text-overflow: ellipsis; }

/* tutor-only teaching notes: knowledge beyond the slide (src/tutor-notes.js) */
.tnotes { margin: 12px 0; background: var(--art-soft); border-left: 3px solid var(--art); border-radius: 10px; padding: 10px 14px; }
.tn-head { font: 600 .75em var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--art); margin-bottom: 4px; }
.tnotes ul { margin: 0; padding-left: 1.2em; display: grid; gap: 3px; line-height: 1.45; }
.tdiag { margin: 8px 0 0; padding: 8px 10px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; font: .8em/1.45 var(--f-mono); white-space: pre; overflow-x: auto; color: var(--ink); }

   Concept-card HTML may mark key details as {{blanks}}: they render as click-to-reveal cloze spans.
   CVS.fig(name, caption, pdf, page[, cls]) builds a click-to-zoom course figure from img/<name>.jpg
   (sizes from data/figs.js). */
window.CVS = {
  sections: [],
  dims: {},
  SRC: {
    urt: 'Upper respiratory tract handout',

  cloze: function (h) { return String(h).replace(/\{\{([\s\S]*?)\}\}/g, '<span class="cz">$1</span>'); },
  fig: function (name, cap, pdf, page, cls) {
    var d = this.dims[name];
    if (!d) throw new Error('no image ' + name);
    var alt = String(cap).replace(/<[^>]+>/g, '').replace(/"/g, '&quot;');
    return '<figure class="scan' + (cls ? ' ' + cls : '') + '"><div class="paperimg"><img src="img/' + name + '.jpg" width="' + d[0] + '" height="' + d[1] + '" alt="' + alt + '" loading="lazy" decoding="async"></div><figcaption>' + cap + ' <span class="src">' + (this.SRC[pdf] || pdf) + ', p.' + page + '</span></figcaption></figure>';
  },
  /* Options are written with the answer first; shuffle them once, the same way everywhere (seeded by the item ID).
     Options such as "None ..." or "All ..." stay last. Set keep: true to leave an item's order alone. */
  shuffle: function (it) {
    if (it.t !== 'q' || it.keep) return;
    var h = 2166136261, i;
    for (i = 0; i < it.id.length; i++) { h ^= it.id.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    var rnd = function () { h = (h + 0x6D2B79F5) >>> 0; var t = h; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    var idx = it.o.map(function (o, k) { return k; });
    var free = idx.filter(function (k) { return !/^(None|All |Both |Neither )/.test(it.o[k]); });
    var tail = idx.filter(function (k) { return free.indexOf(k) < 0; });
    for (i = free.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)), t = free[i]; free[i] = free[j]; free[j] = t; }
    var order = free.concat(tail), A = [].concat(it.a);
    it.o = order.map(function (k) { return it.o[k]; });
    var na = A.map(function (a) { return order.indexOf(a); });
    it.a = Array.isArray(it.a) ? na : na[0];
  },
  add: function (sec) {
    sec.items.forEach(function (it) { if (it.html) it.html = window.CVS.cloze(it.html); window.CVS.shuffle(it); });
    this.sections.push(sec);
  }
};

  items: [
  { t: 'c', id: 'U-C1', title: 'Nasal cavity boundaries, septum and lateral conchae', src: 'URT p.4–10',

      '<ul class="pts"><li><b>{{Kiesselbach area}} (Little area)</b> on the anteroinferior septum is the most common site of epistaxis, fed by 5 arteries: anterior &amp; posterior ethmoidal (from ophthalmic), sphenopalatine &amp; greater palatine (from internal maxillary), and septal branch of {{superior labial}} (from facial).</li>' +
      '<li><b>Clinical</b>: pituitary surgery passes through the sphenoid (transsphenoidal hypophysectomy); HSV-1 or VZV can spread to the brain via olfactory or trigeminal nerves.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('urt-meatus', 'Openings of paranasal sinuses and tear drainage on the lateral wall.', 'urt', 13) + CVS.fig('urt-epistaxis', 'Arterial anastomoses on the anterior septum in nosebleed.', 'urt', 16) + '</div></div>' },
  { t: 'q', id: 'U5', src: 'AC81', core: true, keep: true,
    q: 'The patient has been diagnosed with pus in the sphenoethmoidal recess. Which paranasal sinus is most likely to be infected?',

    ex: 'The sphenoethmoidal recess, above the superior concha, receives the sphenoid sinus. Posterior ethmoidal cells open into the superior meatus; frontal, maxillary and anterior ethmoid into the middle meatus.' },

  { t: 'q', id: 'U9', src: 'AC81 spot', keep: true,

    flag: 'Key from the AC81 spot short answer key. The maxillary ostium lies further back along the same hiatus.' },
  { t: 'c', id: 'U-C3', title: 'Pharynx subdivisions, Waldeyer ring and pharyngeal recesses', src: 'URT p.18–24',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Nasopharynx</b> (air only): roof/posterior wall holds the {{pharyngeal tonsil}} (adenoid); lateral wall features the {{auditory tube}} (Eustachian) opening, {{torus tubarius}} (cartilage elevation with tubal tonsil), salpingopharyngeal fold, and {{fossa of Rosenmuller}} (pharyngeal recess).</li>' +
      '<li><b>Oropharynx</b> (air &amp; food): bounded anteriorly by the oropharyngeal isthmus and {{lingual tonsil}} at the tongue root; lateral wall holds the {{palatine tonsil}} between the palatoglossal and palatopharyngeal arches.</li>' +
      '<li><b>Laryngopharynx</b> (C4–C6): lies behind the larynx; on either side of the laryngeal inlet is the {{piriform recess}} (fossa), a classic trap for swallowed {{foreign bodies}} (along with tongue base and tonsillar crypts).</li>' +
      '<li><b>Muscles &amp; lymphoid ring</b>: outer circular constrictors and inner longitudinal muscles supplied by {{CN IX and CN X}}; lymphoid tissue forms {{Waldeyer ring}}.</li></ul>' +
      '<p class="trap"><b>Clinical</b>: Nasopharyngeal carcinoma (NPC) most commonly arises in the pharyngeal recess and is strongly associated with {{Epstein-Barr virus}} (EBV) infection.</p></div>' +
      CVS.fig('urt-pharynx', 'Landmarks of the nasopharynx, oropharynx, and laryngopharynx.', 'urt', 19) + '</div>' + '<p class="note"><b>From the past papers</b> · The salpingopharyngeal fold covers the salpingopharyngeus muscle, which arises from the cartilage of the tube itself (AC81 spot).</p>' },
  { t: 'q', id: 'U10', src: 'AC79', core: true, keep: true,
    q: 'A patient has a small mass in the oropharynx. Which structure is <b>LEAST</b> likely the cause of this mass?',
    o: ['Uvula', 'Epiglottis', 'Palatine tonsil', 'Lingual tonsil', 'Pharyngeal tonsil'], a: 4,
    ex: 'The pharyngeal tonsil (adenoid) sits on the roof and posterior wall of the nasopharynx. The uvula, palatine tonsils, lingual tonsil and the tip of the epiglottis are all seen in the oropharynx.' },
  { t: 'q', id: 'U11', src: 'AC79 · AC81', core: true, keep: true,
    q: 'What structure is abnormal in this patient?',
    fig: CVS.fig('ac81-tonsil', 'AC81: view through the open mouth.', 'ac81', 3),
    o: ['Palatine tonsil', 'Lingual tonsil', 'Pharyngeal tonsil', 'Tubal tonsil', 'No abnormality in this patient'], a: 0,
    ex: 'The swollen masses on each side of the oropharynx, between the palatoglossal and palatopharyngeal arches, are enlarged palatine tonsils (tonsillitis).',
    flag: 'AC79 asked the same with a tonsillitis photo (“What is the tonsil in this picture?”), also keyed palatine tonsil.' },
  { t: 'q', id: 'U12', src: 'AC80', keep: true,
    q: 'Where is the adenoid tonsil located?',
    fig: CVS.fig('ac80-adenoid', 'AC80: labels A–D on a sagittal drawing.', 'ac80', 1),
    o: ['A', 'B', 'C', 'D'], a: 0,
    ex: 'A marks the roof and posterior wall of the nasopharynx: the pharyngeal (adenoid) tonsil. B is the tubal tonsil, C the palatine tonsil, D the lingual tonsil (AC80 key).' },
  { t: 'q', id: 'U13', src: 'AC80', core: true, keep: true,
    q: 'Dysfunction of the auditory (Eustachian) tube is associated with which region?',
    o: ['Larynx', 'Esophagus', 'Nasopharynx', 'Oropharynx', 'Laryngopharynx'], a: 2,
    ex: 'The pharyngeal opening of the auditory tube is on the lateral wall of the nasopharynx, behind the inferior concha and in front of the torus tubarius.' },
  { t: 'q', id: 'U14', src: 'AC81', keep: true,
    q: 'A patient presents with a fish bone stuck in the tonsillar crypts. Which structure do the tonsillar crypts reside in?',
    o: ['Oropharynx', 'Nasopharynx', 'Larynx'], a: 0,
    ex: 'Tonsillar crypts are the pits of the palatine tonsil, which lies in the oropharynx (tonsillar fossa). A fish bone also commonly lodges there.',
    flag: 'Only three options were recalled. It sat in the AC81 thoracic wall chapter, but it is upper-tract anatomy.' },
  { t: 'q', id: 'U15', src: 'AC79 spot', core: true, keep: true,

  { t: 'q', id: 'U16', src: 'AC79 spot', keep: true,

    flag: 'The option was recalled as “pharyngeal sinus”; the structure is the pharyngeal recess (fossa of Rosenmüller).' },
  { t: 'q', id: 'U17', src: 'AC81 spot', keep: true,

  { t: 'q', id: 'U18', src: 'AC81 spot', keep: true,
    q: 'Identify muscle in area B.',
    fig: CVS.fig('ac81s-st2', 'AC81 spot test, station 2.', 'ac81s', 3), figRef: 'U17',
    o: ['Palatoglossus', 'Stylopharyngeus', 'Palatopharyngeus', 'Salpingopharyngeus'], a: 3,
    ex: 'The fold running down from the torus tubarius covers the salpingopharyngeus (salpinx = tube), which arises from the cartilage of the auditory tube.' },
  { t: 'c', id: 'U-C4', title: 'Laryngeal cartilages, fibro-elastic membranes and cavity', src: 'URT p.25–35',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>9 cartilages (C3–C6)</b>: 3 unpaired ({{thyroid cartilage}}, {{cricoid cartilage}}, {{epiglottis}}) and 3 paired ({{arytenoid}}, corniculate, cuneiform). The first two unpaired plus most of the ladle-shaped pair are {{hyaline cartilage}}; the rest are {{elastic cartilage}}.</li>' +
      '<li><b>Membranes</b>: the {{quadrangular membrane}} runs from the lateral border of the epiglottic leaf to the ladle-shaped cartilage, its lower free edge forming the {{vestibular ligament}} (false cord). The {{conus elasticus}} forms the {{median cricothyroid ligament}} anteriorly and the {{vocal ligament}} (true cord) superiorly.</li>' +
      '<li><b>Interior</b>: laryngeal ventricle separates false folds (rima vestibuli) from true folds (rima glottidis). True cords are lined by {{stratified squamous}} epithelium, and the glottic region has no lymphatic drainage.</li>' +
      '<li><b>Emergency airway</b>: emergency cricothyroidotomy pierces the cricothyroid membrane into the subglottis.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('urt-larynx-cart', 'Laryngeal skeleton, fibro-elastic membranes, and ligaments.', 'urt', 28) + CVS.fig('urt-larynx-cor', 'Coronal section showing laryngeal vestibule, ventricle, and cords.', 'urt', 31) + '</div></div>' + '<p class="note"><b>From the past papers</b> · In the opened larynx the vestibular (false) fold lies above the ventricle and the vocal (true) fold below it; the trachea continues below the cricoid ring (AC79 and AC81 spot).</p>' },
  { t: 'q', id: 'U19', src: 'AC79 spot', keep: true,
    q: 'Identify this structure A.',
    fig: CVS.fig('ac79s-st4', 'AC79 spot test, station 4.', 'ac79s', 6),
    o: ['Thyroid cartilage', 'Cricoid cartilage', 'Arytenoid cartilage', 'Hyoid bone'], a: 0,
    ex: 'A is the large shield-shaped lamina on the side of the larynx: the thyroid cartilage.' },
  { t: 'q', id: 'U20', src: 'AC80 spot', keep: true,
    q: 'Identify this structure.',
    fig: CVS.fig('ac80s-cricoid', 'AC80 spot test (recalled image).', 'ac80s', 7),
    o: ['Cricoid cartilage', 'Thyroid cartilage', 'Arytenoid cartilage', 'Corniculate cartilage'], a: 0,
    ex: 'A marks the complete ring at the lower end of the larynx, just above the trachea: the cricoid cartilage.' },
  { t: 'q', id: 'U21', src: 'AC79 spot', core: true, keep: true,
    q: 'Identify this structure A.',
    fig: CVS.fig('ac79s-st6', 'AC79 spot test, station 6.', 'ac79s', 8),
    o: ['Piriform sinus', 'Vestibular fold of larynx', 'Laryngeal ventricle', 'Vocal fold of larynx'], a: 3,

  { t: 'q', id: 'U22', src: 'AC79 spot', keep: true,
    q: 'Identify this structure B.',
    fig: CVS.fig('ac79s-st6', 'AC79 spot test, station 6.', 'ac79s', 8), figRef: 'U21',
    o: ['Trachea', 'Esophagus', 'Cricoid cartilage', 'Thyroid gland'], a: 0,
    ex: 'B is the cartilage-ringed tube continuing below the cricoid: the trachea.' },
  { t: 'q', id: 'U23', src: 'AC81 spot', keep: true,
    q: 'Identify structure B.',
    fig: CVS.fig('ac81s-st3', 'AC81 spot test, station 3.', 'ac81s', 4),
    o: ['Vocal fold', 'Vestibular fold', 'Ary-epiglottic fold'], a: 0,
    ex: 'In the coronal section B points to the lower fold, under the ventricle: the vocal fold.',
    flag: 'The recalled stem repeated “Which paranasal sinus opening lies on B?”; the options show the real question was to identify B.' },
  { t: 'c', id: 'U-C5', title: 'Intrinsic laryngeal muscles, nerves and trachea', src: 'URT p.36–44',
    html: '<div class="two"><div class="stack"><div class="tblwrap"><table class="tbl"><thead><tr><th>Intrinsic muscle</th><th>Main action on cords / rima glottidis</th><th>Motor nerve</th></tr></thead><tbody>' +
      '<tr><td><b>{{Posterior cricoarytenoid}}</b></td><td><b>Sole abductor</b> — {{opens rima glottidis}}</td><td>Inferior (recurrent) laryngeal n.</td></tr>' +
      '<tr><td><b>Lateral cricoarytenoid</b> &amp; <b>transverse/oblique arytenoids</b></td><td>Adductors — {{close rima glottidis}}</td><td>Inferior (recurrent) laryngeal n.</td></tr>' +
      '<tr><td><b>{{Cricothyroid}}</b></td><td>{{Tenses}} (lengthens) vocal folds</td><td>{{External laryngeal}} n.</td></tr>' +
      '<tr><td><b>{{Thyroarytenoid}}</b> &amp; <b>{{vocalis}}</b></td><td>{{Relaxes}} (shortens) vocal folds</td><td>Inferior (recurrent) laryngeal n.</td></tr></tbody></table></div>' +
      '<ul class="pts"><li><b>Sensory innervation</b>: {{internal laryngeal}} nerve above the vocal folds; inferior (recurrent) laryngeal nerve below the vocal folds.</li>' +
      '<li><b>Trachea (C6 to T4/T5 sternal angle)</b>: 16–20 C-shaped hyaline rings (length 10 cm in URT p.41 vs 12 cm in Lung p.23) bridged posteriorly by smooth {{trachealis}} muscle abutting the esophagus; bifurcates at the {{carina}}.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('urt-larynx-musc', 'Actions of intrinsic laryngeal muscles on the laryngeal inlet and vocal ligaments.', 'urt', 37) + CVS.fig('urt-larynx-nerve', 'Superior and recurrent laryngeal nerve branches and arterial supply.', 'urt', 39) + '</div></div>' },
  { t: 'q', id: 'U24', src: 'AC81 spot', keep: true,
    q: 'Identify structure A.',
    fig: CVS.fig('ac81s-st3', 'AC81 spot test, station 3.', 'ac81s', 4),
    o: ['Cricothyroid m.', 'Thyroarytenoid m.', 'Lateral cricoarytenoid m.', 'Posterior cricoarytenoid m.'], a: 3,
    ex: 'From behind, A is the muscle on the back of the cricoid lamina: the posterior cricoarytenoid.' },
  { t: 'q', id: 'U25', src: 'AC79 spot', keep: true,
    q: 'Identify this structure B.',
    fig: CVS.fig('ac79s-st4', 'AC79 spot test, station 4.', 'ac79s', 6),
    o: ['Posterior cricoarytenoid muscle', 'Thyroepiglottic muscle', 'Thyroarytenoid muscle', 'Cricothyroid muscle'], a: 3,
    ex: 'On the front of the larynx, B is the muscle running from the cricoid arch up to the thyroid cartilage: the cricothyroid, the only intrinsic muscle on the outside.' },
  { t: 'q', id: 'U26', src: 'AC79 spot', core: true, keep: true,
    q: 'Identify this structure A.',
    fig: CVS.fig('ac79s-st5', 'AC79 spot test, station 5.', 'ac79s', 7),
    o: ['Cricothyroid muscle', 'Aryepiglottic muscle', 'Posterior cricoarytenoid muscle', 'Arytenoid muscle'], a: 2,
    ex: 'Viewed from behind, A lies on the posterior surface of the cricoid lamina: the posterior cricoarytenoid.' },
  { t: 'q', id: 'U27', src: 'AC79 spot', core: true, keep: true,
    q: 'What is the function of structure A?',
    fig: CVS.fig('ac79s-st5', 'AC79 spot test, station 5.', 'ac79s', 7), figRef: 'U26',
    o: ['Tense vocal cords', 'Relax vocal cords', 'Opens rima glottidis', 'Closes rima glottidis'], a: 2,
    ex: 'The posterior cricoarytenoid rotates the arytenoids outward and is the only abductor: it opens the rima glottidis.' },
  { t: 'q', id: 'U28', src: 'AC79 · AC81', core: true, keep: true,
    q: 'In a thyroidectomy operation, the surgeon accidentally caused a ligation of the superior thyroid artery. Which muscle is most likely to be affected?',
    o: ['Cricothyroid', 'Thyroarytenoid', 'Lateral cricoarytenoid', 'Posterior cricoarytenoid', 'Vocalis'], a: 0,
    ex: 'The external branch of the superior laryngeal nerve runs with the superior thyroid artery and supplies only the cricothyroid. Tying the artery can catch the nerve.' },
  { t: 'q', id: 'U29', src: 'AC80', keep: true,
    q: 'During the procedure of thyroidectomy, a lesion of a nerve beside the superior thyroid artery. What would be the cause of this?',
    o: ['Decrease tension in vocal cord', 'Paralysis of vocalis muscle', 'Unable to abduct rima glottidis'], a: 0,
    ex: 'The nerve beside the superior thyroid artery is the external laryngeal nerve. Losing the cricothyroid means the vocal cords cannot be tensed: a weak, low-pitched voice.',
    flag: 'A fourth option was not recalled. AC80 also asked the same idea as “Cutting the superior laryngeal artery … decrease tension of the vocal cords”.' },
  { t: 'q', id: 'U30', src: 'AC79 · AC81', core: true, keep: true,
    q: 'The patient presents with a hoarse voice, difficult breathing, and an inability to abduct the vocal fold. Which nerve defect could cause this symptom?',
    o: ['External laryngeal nerve', 'Internal laryngeal nerve', 'Superior laryngeal nerve', 'Recurrent laryngeal nerve', 'Vagus nerve'], a: 3,
    ex: 'The recurrent laryngeal nerve supplies every intrinsic muscle except the cricothyroid, including the only abductor (posterior cricoarytenoid). It is at risk in neck and thyroid surgery.' }

/* Section W: Thoracic Wall & Diaphragm (681027 Thoracic wall & diaphragm.pdf, 30 pages). */
CVS.add({ id: 'W', short: 'Thoracic wall', title: 'Thoracic Wall, Intercostal Space, Pleura & Diaphragm', kind: 'Lecture',
  blurb: 'Sternum and rib articulations, intercostal muscle layers, accessory muscles of respiration, the intercostal VAN bundle and nerve block, thoracocentesis vs thoracostomy, flail chest, and diaphragm.',
  items: [
  { t: 'c', id: 'W-C1', title: 'Thoracic cage: sternum, rib classes and vertebral joints', src: 'Thoracic wall p.2–6',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Sternum</b>: {{manubrium}} (articulates with clavicle and 1st rib), {{sternal angle}} of Louis (junction with sternal body at the {{2nd rib}}), sternal body, and {{xiphoid process}}.</li>' +
      '<li><b>12 pairs of ribs</b>: {{true ribs}} (ribs 1–7, attach directly to sternum via costal cartilages), {{false ribs}} (ribs 8–12), including {{floating ribs}} (ribs 11–12, free anterior ends).</li>' +
      '<li><b>Typical ribs ({{ribs 3–9}})</b>: head with two articular facets separated by a crest, neck, tubercle, and shaft with an inferior {{costal groove}}.</li>' +
      '<li><b>Posterior articulations</b>: rib head articulates with {{vertebral bodies}} (demifacets); rib tubercle articulates with the {{transverse process}} of the corresponding thoracic vertebra.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('wall-sternum', 'Divisions of the sternum and the sternal junction at the second costal cartilage.', 'wall', 3) + CVS.fig('wall-rib', 'Costovertebral and costotransverse articulations of a typical rib.', 'wall', 6) + '</div></div>' },
  { t: 'q', id: 'W1', src: 'AC80', core: true, keep: true,
    q: 'Which structure has 2nd rib attached to?',
    o: ['Manubrium sterni', 'Sternal angle of Louis', 'Body of sternum', 'Xiphisternal junction', 'Xiphoid process'], a: 1,
    ex: 'The 2nd costal cartilage joins the sternum at the sternal angle (manubriosternal joint). The 1st rib attaches to the manubrium; ribs 3–6 to the body; the 7th at the xiphisternal junction; nothing to the xiphoid.' },
  { t: 'q', id: 'W2', src: 'AC79 spot', keep: true,
    q: 'Identify this structure B.',
    fig: CVS.fig('ac79s-st8', 'AC79 spot test, station 8.', 'ac79s', 10),
    o: ['Manubrium sterni', 'Sternal angle', 'Body of sternum', 'Xiphoid process'], a: 2,
    ex: 'B points to the long middle part of the sternum, below the sternal angle: the body of the sternum.' },
  { t: 'q', id: 'W3', src: 'AC79 spot', keep: true,
    q: 'Identify this structure A.',
    fig: CVS.fig('ac79s-st10', 'AC79 spot test, station 10.', 'ac79s', 12),
    o: ['Manubrium sterni', 'Sternal angle', 'Body of sternum', 'Xiphoid process'], a: 1,
    ex: 'A points to the transverse ridge where the manubrium meets the body: the sternal angle.' },
  { t: 'q', id: 'W4', src: 'AC81 spot', core: true, keep: true,
    q: 'Identify structure A.',
    fig: CVS.fig('ac81s-st6', 'AC81 spot test, station 6.', 'ac81s', 7),
    o: ['Manubrium sterni', 'Sternal angle', 'Body of sternum', 'Xiphoid process'], a: 1,
    ex: 'A marks the junction of manubrium and body, level with the 2nd costal cartilages: the sternal angle.' },
  { t: 'q', id: 'W5', src: 'AC81 spot', keep: true,
    q: 'Identify structure B.',
    fig: CVS.fig('ac81s-st6', 'AC81 spot test, station 6.', 'ac81s', 7), figRef: 'W4',
    o: ['2nd rib', '3rd rib', '4th rib', '5th rib'], a: 1,
    ex: 'Count down from the sternal angle: the cartilage at A is the 2nd, so the next one down, at B, is the 3rd.',
    flag: 'Key from the AC81 spot short answer key; count from the sternal angle on the photo to check.' },
  { t: 'c', id: 'W-C2', title: 'Intercostal muscle layers and transversus thoracis', src: 'Thoracic wall p.7–11',
    html: '<div class="two"><div class="stack"><div class="tblwrap"><table class="tbl"><thead><tr><th>Layer</th><th>Fiber direction &amp; extent</th><th>Respiratory action</th></tr></thead><tbody>' +
      '<tr><td><b>{{External intercostal}}</b> (outermost)</td><td>{{Inferiorly and anteriorly}} ("hands in pockets"); vertebral column to costochondral junction, then {{external intercostal membrane}}</td><td>{{Elevates ribs}} during inspiration</td></tr>' +
      '<tr><td><b>{{Internal intercostal}}</b> (middle)</td><td>{{Superiorly and anteriorly}}; sternum to costal angle, then {{internal intercostal membrane}}</td><td>{{Depresses ribs}} during forced expiration</td></tr>' +
      '<tr><td><b>{{Innermost intercostal}}</b> (deepest)</td><td>Same fiber orientation as middle layer; occupies lateral and back spaces</td><td>Assists rib depression</td></tr></tbody></table></div>' +
      '<ul class="pts"><li><b>{{Transversus thoracis}}</b>: deep anterior sheet arising from lower sternal body and xiphoid to insert on {{ribs 2–6}}; innervated by intercostal nerves 3–6 to pull ribs down in forced expiration.</li></ul></div>' +
      CVS.fig('wall-intercostal', 'Three layers of intercostal muscles and their membranes in cross-section.', 'wall', 10) + '</div>' },
  { t: 'q', id: 'W6', src: 'AC79 spot', core: true, keep: true,
    q: 'Identify this structure A.',
    fig: CVS.fig('ac79s-st7', 'AC79 spot test, station 7.', 'ac79s', 9),
    o: ['External intercostal muscle', 'Internal intercostal muscle', 'Innermost intercostal muscle', 'Transversus thoracis muscle'], a: 1,
    ex: 'Near the sternum the external intercostal is replaced by a membrane, so the muscle seen there (fibres running down and back) is the internal intercostal.' },
  { t: 'q', id: 'W7', src: 'AC79 spot', keep: true,
    q: 'Identify this structure B.',
    fig: CVS.fig('ac79s-st7', 'AC79 spot test, station 7.', 'ac79s', 9), figRef: 'W6',
    o: ['External intercostal muscle', 'Internal intercostal muscle', 'Innermost intercostal muscle', 'Transversus thoracis muscle'], a: 0,
    ex: 'Further out, B is the superficial layer with fibres running down and forward: the external intercostal.' },
  { t: 'q', id: 'W8', src: 'AC81 spot', keep: true,
    q: 'Identify structure A.',
    fig: CVS.fig('ac81s-st7', 'AC81 spot test, station 7.', 'ac81s', 8),
    o: ['External intercostal m.', 'Internal intercostal m.', 'Innermost intercostal m.', 'Transversus thoracis m.'], a: 0,
    ex: 'On the outer surface of the chest wall, A is the outermost muscle layer with fibres running down and forward: the external intercostal.' },
  { t: 'q', id: 'W9', src: 'AC81 spot', core: true, keep: true,
    q: 'Identify structure A.',

  { t: 'c', id: 'W-C3', title: 'Mechanics of quiet vs forceful breathing and accessory muscles', src: 'Thoracic wall p.12–14',
    html: '<div class="stack"><ul class="pts">' +
      '<li><b>Quiet (normal) inspiration</b>: driven primarily by contraction of the {{diaphragm}} together with the external intercostal muscles.</li>' +
      '<li><b>Quiet (normal) expiration</b>: passive process driven by {{elastic recoil}} of the lungs and relaxation of the inspiratory muscles.</li>' +
      '<li><b>Accessory muscles of {{forceful inspiration}}</b> (exercise or respiratory distress): {{sternocleidomastoid}} (SCM), {{scalene muscles}}, {{pectoralis minor}}, {{serratus anterior}} &amp; posterior, and {{levator costarum}}.</li>' +
      '<li><b>Muscles of {{forceful expiration}}</b>: internal and innermost intercostals, transversus thoracis, and {{abdominal muscles}} (rectus abdominis, external oblique, internal oblique).</li></ul></div>' },
  { t: 'q', id: 'W11', src: 'AC79 · AC81', core: true, keep: true,

    ex: 'The external intercostals raise the ribs in inspiration (bucket and pump handle). The internal, innermost and transversus thoracis depress the ribs in forced expiration; the diaphragm does not lift the ribs.' },
  { t: 'c', id: 'W-C4', title: 'Intercostal neurovascular bundle (VAN), vessels and nerve block', src: 'Thoracic wall p.15–20',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Plane &amp; order</b>: the main neurovascular bundle runs in the costal groove along the inferior border of the rib, between the {{internal and innermost}} intercostal layers, arranged superior-to-inferior as {{VAN}} (Vein, Artery, Nerve).</li>' +
      '<li><b>Arteries</b>: {{anterior intercostal}} arteries branch from the {{internal thoracic artery}}; {{posterior intercostal}} arteries arise from the thoracic {{aorta}}.</li>' +
      '<li><b>Veins</b>: anterior veins drain to the internal thoracic vein; posterior veins drain to the {{azygos}} vein on the right and {{hemiazygos and accessory hemiazygos}} veins on the left.</li>' +
      '<li><b>Clinical needle placement</b>: an {{intercostal nerve block}} (or herpes zoster dermatomal pain) targets the {{lower border}} of the rib, whereas pleural procedures pass along the {{upper border}} of the rib below to avoid the bundle.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('wall-van', 'Arrangement of Vein, Artery, and Nerve in the costal groove.', 'wall', 18) + CVS.fig('wall-block', 'Infiltration at the inferior costal margin for an intercostal block.', 'wall', 20) + '</div></div>' },

  { t: 'c', id: 'W-C5', title: 'Pleural procedures, flail chest and the diaphragm', src: 'Thoracic wall p.21–30',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>{{Thoracocentesis}} (pleural tap)</b>: needle aspiration of pleural effusion at the {{7th or 8th}} intercostal space along the {{posterior axillary}} or mid-scapular line (note: Lung p.10 teaches 8th–10th ICS at the midaxillary line).</li>' +
      '<li><b>{{Tube thoracostomy}} (chest drain)</b>: evacuates air ({{pneumothorax}}) or blood ({{hemothorax}}) via the {{4th or 5th}} intercostal space at the {{anterior or mid-axillary}} line, hugging the upper rib border.</li>' +
      '<li><b>{{Flail chest}}</b>: multiple rib fractures with isolated segment causing {{paradoxical movement}} (drawn inward on inspiration, pushed outward on expiration).</li>' +
      '<li><b>Diaphragm</b>: dome with central tendon, right &amp; left crura (L2–L4), and 3 major openings (IVC in central tendon, esophageal hiatus in right crus, aortic hiatus behind crura); motor &amp; central sensory via {{phrenic nerve}} (C3–C5), peripheral sensory via lower 6 intercostal nerves.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('wall-flail', 'Isolated rib segment moving inward during inspiration and outward during expiration.', 'wall', 28) + CVS.fig('wall-diaphragm', 'Inferior view of the diaphragm showing crura, central tendon, and major openings.', 'wall', 29) + '</div></div>' + '<p class="note"><b>From the past papers</b> · A chest tube or tap crosses skin, the three intercostal layers, endothoracic fascia and the parietal (costal) pleura, never the visceral pleura (AC79–AC81). The right dome sits on the liver. Openings: IVC at T8 through the central tendon, esophagus with the vagal trunks at T10, aorta with the thoracic duct at T12 (AC79 spot).</p>' },
  { t: 'q', id: 'W14', src: 'AC79 · AC80 · AC81', core: true, keep: true,

    ex: 'The tube goes through skin, the three intercostal muscles, endothoracic fascia and parietal pleura into the pleural cavity. The visceral pleura covers the lung and must not be punctured.' },
  { t: 'q', id: 'W15', src: 'AC81', core: true, keep: true,

  { t: 'q', id: 'W21', src: 'AC81 spot', keep: true,

      '<div class="stack">' + CVS.fig('lung-recess', 'Inferior surface markings of lung and parietal pleura across three vertical lines.', 'lung', 6) + CVS.fig('lung-tap', 'Needle path into the pleural recess above the upper costal margin.', 'lung', 10) + '</div></div>' },
  { t: 'q', id: 'B1', src: 'AC79 · AC81', core: true, keep: true,

  { t: 'c', id: 'B-C2', title: 'Lung surfaces, fissures and mediastinal impressions', src: 'Lung & bronchi p.11–20',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Lobes &amp; fissures</b>: right lung has 3 lobes divided by oblique and {{horizontal}} fissures; left lung has 2 lobes divided by an oblique fissure, with an anterior {{cardiac notch}} and {{lingula}} on the superior lobe.</li>' +
      '<li><b>Root (hilum) &amp; sleeve</b>: transmits bronchi, pulmonary &amp; bronchial vessels, lymphatics, and plexuses; inferiorly the parietal-to-visceral reflection hangs down as the {{pulmonary ligament}}.</li>' +
      '<li><b>Right mediastinal impressions</b>: {{arch of azygos vein}} arching over the root, {{superior vena cava}} (SVC), {{brachiocephalic vein}}, and {{esophagus}} behind the hilum.</li>' +

  { t: 'c', id: 'B-C3', title: 'Tracheobronchial tree, sternal angle and hilar relations', src: 'Lung & bronchi p.21–30',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Conducting vs respiratory zones</b>: conducting part runs from trachea → main → lobar → segmental bronchi → {{terminal bronchioles}}; respiratory part begins at {{respiratory bronchioles}} → alveolar ducts → alveolar sacs → alveoli.</li>' +
      '<li><b>Sternal angle (of Louis, {{DT4}})</b>: marks the manubriosternal joint, 2nd rib, beginning/end of aortic arch, inferior border of superior mediastinum, and tracheal bifurcation ({{carina}}; trachea length given as {{12 cm}} here vs 10 cm in URT p.41).</li>' +
      '<li><b>Main bronchi &amp; segments</b>: right main bronchus is {{wider, shorter, and more vertical}} (foreign body predisposition) and supplies {{10 segments}} (3+2+5); left lung has {{8 segments}} (4+4).</li>' +
      '<li><b>Hilar relationship to pulmonary artery</b>: the right superior lobar bronchus arises above the right pulmonary artery and is called the {{eparterial bronchus}}; all other lobar bronchi pass below the pulmonary artery ({{hyparterial bronchi}}).</li></ul></div>' +
      CVS.fig('lung-hilum', 'Comparison of right and left hilar structures and lobar bronchial positions.', 'lung', 28) + '</div>' + '<p class="note"><b>From the past papers</b> · The left main bronchus is longer and more horizontal. In the lung root the pulmonary veins lie lowest and most anterior. The trachea starts at C6, at the cricoid (Lung p.23; AC79 and AC81 spot).</p>' },

  { t: 'c', id: 'B-C4', title: 'Bronchial vessels and the azygos venous system', src: 'Lung & bronchi p.31–37',

  { t: 'c', id: 'B-C5', title: 'Thoracic lymphatics, pulmonary plexuses and splanchnic nerves', src: 'Lung & bronchi p.38–48',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Thoracic lymph nodes</b>: <b>parietal</b> ({{parasternal}}, intercostal, phrenic) vs <b>visceral</b> (anterior mediastinal/brachiocephalic, posterior mediastinal, {{tracheobronchial}}).</li>' +

      '<li><b>Pulmonary plexuses</b>: parasympathetic ({{vagus nerve}}) produces {{bronchoconstriction}} and vasodilation; sympathetic produces {{bronchodilation}} and vasoconstriction.</li>' +
      '<li><b>Thoracic splanchnic nerves</b>: {{greater splanchnic}} (T5–T9) and {{lesser splanchnic}} (T10–T11) supply abdominal viscera below the diaphragm.</li></ul></div>' +
      CVS.fig('lung-lymph', 'Major lymphatic trunks and main collecting ducts at the venous angles.', 'lung', 40) + '</div>' + '<p class="note"><b>From the past papers</b> · Lung lymph drains to the bronchopulmonary (hilar) nodes, then the nodes around the tracheal bifurcation (AC80). The stellate (cervicothoracic) ganglion sits at the top of the sympathetic trunk, on the neck of the first rib (AC79 spot).</p>' },

  blurb: 'Epithelial transitions from nasal vestibule to alveoli, cartilage and smooth muscle along the bronchial tree, Club (Clara) cells, Type I and II pneumocytes, pores of Kohn, the five-layer air-blood barrier, and pleural mesothelium.',
  items: [
  { t: 'c', id: 'H-C1', title: 'Conducting vs respiratory portions and upper-tract epithelia', src: 'Histology p.2–15',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Air-conducting portion</b>: nose → {{terminal bronchioles}}. <b>Respiratory portion</b>: {{respiratory bronchioles}} → alveoli.</li>' +

      '<li><b>Oropharynx</b> (with {{Waldeyer ring}} MALT), oral side of epiglottis, and {{true vocal cords}}: {{non-keratinized stratified squamous}} epithelium; laryngeal side of epiglottis has respiratory epithelium over an elastic cartilage core.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('histo-resp', 'Respiratory mucosa: ciliated pseudostratified columnar epithelium.', 'histo', 7) +

  { t: 'c', id: 'H-C2', title: 'Trachea, intrapulmonary bronchi and regular bronchioles', src: 'Histology p.16–23',
    html: '<div class="tblwrap"><table class="tbl"><thead><tr><th>Feature</th><th>Trachea &amp; primary bronchi</th><th>Intrapulmonary bronchus</th><th>Regular bronchiole</th></tr></thead><tbody>' +

  { t: 'c', id: 'H-C3', title: 'Terminal and respiratory bronchioles: Club (Clara) cells', src: 'Histology p.24–29',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Terminal bronchioles</b> (end of conducting portion): lined by {{simple columnar}} to {{simple cuboidal}} ciliated epithelium containing non-ciliated {{Clara cells}} ({{Club cells}}).</li>' +
      '<li><b>Morphology</b>: {{dome-shaped}} apical projection with short blunt {{microvilli}} (no cilia).</li>' +
      '<li><b>Four functions</b>: (1) secrete {{lipoprotein}} that helps surfactant prevent luminal adhesion, (2) act as {{stem-cell-like}} progenitors, (3) {{detoxify}} inhaled xenobiotics, and (4) secrete biomarker {{CC16}} (secretory protein).</li>' +
      '<li><b>Respiratory bronchioles</b> (start of gas exchange): cuboidal wall interrupted by outpocketing alveoli. Clinical airway disorders include bronchitis, COPD, and asthma.</li></ul></div>' +
      CVS.fig('histo-clara', 'Terminal bronchiole epithelium showing non-ciliated apical projections among ciliated cells.', 'histo', 24) + '</div>' },
  { t: 'q', id: 'H15', src: 'AC81', core: true, keep: true,

    o: ['Absence of Clara cells', 'Diameter 1-2 mm', 'Simple cuboidal', 'The smallest airway that has hyaline cartilage'], a: 2,
    ex: 'Respiratory bronchioles are lined by simple cuboidal epithelium (with club/Clara cells) interrupted by alveoli. Cartilage ends at the bronchi; bronchioles are under about 1 mm.' },
  { t: 'q', id: 'H16', src: 'AC79 spot', keep: true,

  { t: 'q', id: 'H17', src: 'AC80 spot', keep: true,

    fig: CVS.fig('ac80s-lungsec', 'AC80 spot test (recalled image): lung section with labels A–D.', 'ac80s', 25),
    o: ['Terminal bronchiole', 'Respiratory bronchiole', 'Intrapulmonary bronchi', 'Alveolar duct'], a: 1,
    ex: 'B is a small airway whose wall is already broken by alveoli: a respiratory bronchiole.' },
  { t: 'c', id: 'H-C4', title: 'Alveolar ducts, alveoli, pneumocytes, dust cells and pores of Kohn', src: 'Histology p.30–40',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Alveolar ducts &amp; sacs</b>: lined by {{simple squamous}} epithelium with smooth muscle knobs at alveolar openings.</li>' +
      '<li><b>Pneumocyte Type I</b>: flattened squamous cells making up {{40%}} of alveolar cells but covering {{90–95%}} of the surface area for gas exchange.</li>' +
      '<li><b>Pneumocyte Type II</b> (septal cell): {{simple cuboidal}} cells with lamellar bodies making up {{60%}} of cells but only {{5–10%}} of surface area; synthesize {{pulmonary surfactant}} (lowering surface tension by Laplace law) and divide as progenitors for Type I and II cells.</li>' +
      '<li><b>Dust cells</b>: {{alveolar macrophages}} in the septa and airspaces.</li>' +
      '<li><b>Pores of Kohn</b>: inter-alveolar openings providing {{collateral circulation}} to equalize pressure and prevent {{atelectasis}} (lung collapse).</li>' +
      '<li><b>Alveolar pathology</b>: infant {{RDS}} (surfactant deficiency), emphysema, pulmonary edema, lobar pneumonia, and pneumoconioses (anthracosis, silicosis, asbestosis).</li></ul></div>' +
      CVS.fig('histo-alveoli', 'Type II pneumocyte secreting lamellar bodies, with Laplace law and alveolar stability.', 'histo', 35) + '</div>' },
  { t: 'q', id: 'H18', src: 'AC79 spot', keep: true,

  { t: 'q', id: 'H19', src: 'AC80 spot', keep: true,

  { t: 'q', id: 'H20', src: 'AC79 · AC80 · AC81', core: true, keep: true,
    q: 'Premature newborn develops respiratory distress syndrome. What is the main cause of this syndrome?',
    o: ['Underdeveloped pneumocyte type 2', 'Underdeveloped dust cell', 'Underdeveloped clara', 'Underdeveloped pneumocyte type 1'], a: 0,
    ex: 'Neonatal RDS is surfactant deficiency: type II pneumocytes are not yet mature enough to make enough surfactant (dipalmitoylphosphatidylcholine), so alveoli collapse.',

  { t: 'q', id: 'H21', src: 'AC79 spot', core: true, keep: true,

  { t: 'q', id: 'H23', src: 'AC80 spot', keep: true,

    ex: 'The arrows point to cells sitting free in the alveolar wall and lumen: alveolar macrophages (dust cells).' },
  { t: 'q', id: 'H24', src: 'AC80 spot', keep: true,
    q: 'What is the function?',
    fig: CVS.fig('ac80s-dustcell', 'AC80 spot test (recalled image): arrows on cells in the alveolar wall.', 'ac80s', 27), figRef: 'H23',
    o: ['Surfactant', 'Protein cc16', 'Vitamin B1', 'Macrophage-like'], a: 3,
    ex: 'Dust cells are macrophages: they phagocytose inhaled particles and microbes. CC16 is the club cell protein; surfactant comes from type II cells.' },
  { t: 'c', id: 'H-C5', title: 'The air-blood barrier and the lung pleurae', src: 'Histology p.41–45',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Five layers of the air-blood barrier</b> (from alveolar lumen to erythrocyte, p.42):' +
      '<ol><li>{{Alveolar fluid}} + {{surfactant}} layer</li>' +
      '<li>{{Alveolar epithelium}} (Type I pneumocyte cytoplasm)</li>' +
      '<li>Fused {{basal lamina x 2}} (of epithelial and endothelial layers)</li>' +
      '<li>Capillary {{endothelium}}</li>' +
      '<li>{{Plasma membrane}} of the {{red blood cell}} (RBC)</li></ol></li>' +
      '<li><b>Lung pleurae</b> (visceral and parietal): serous membranes lined by {{mesothelium}} (simple squamous) over connective tissue that produces {{lubricant fluid}}.</li>' +
      '<li><b>Pleural pathology</b>: pneumothorax, hydrothorax, hemothorax, and asbestos-related {{mesothelioma}}.</li></ul></div>' +

/* Section G: Gas phase, partial pressures & gas-liquid equilibrium (Gas phase handout, slides 1–30). */
CVS.add({ id: 'G', short: 'Gas phase', title: 'Gas Phase, Partial Pressures & Gas-Liquid Equilibrium', kind: 'Lecture',
  blurb: 'STP/STPD/BTPS conventions, ideal and real gas laws, respiratory humidification, Dalton law, the alveolar gas equation, Graham and Henry laws, and clinical oxygen cylinders and delivery devices.',
  items: [
  { t: 'c', id: 'G-C1', title: 'Standard conditions (STP, STPD, BTPS) and the gas laws', src: 'Gas phase p.3–13',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>STP</b>: {{273.25 K}} (0 °C) and absolute pressure {{101.3 kPa}} (1 bar = 1 atm = {{760 mmHg}} = 14.9 psi). <b>STPD</b>: 0 °C (273 K), 1 atm, and {{dry}} (no water vapor).</li>' +
      '<li><b>BTPS</b>: body temperature ({{37 °C}} = 310 K), ambient pressure, and gas {{saturated with water vapor}} (P<sub>H2O</sub> = 47 mmHg).</li>' +
      '<li><b>Boyle law</b> (constant T): {{P1V1 = P2V2}}. <b>Charles law</b> (constant P): {{V1/T1 = V2/T2}} (extrapolates to zero volume at -273 °C). <b>Gay-Lussac law</b> (constant V): P<sub>1</sub>/T<sub>1</sub> = P<sub>2</sub>/T<sub>2</sub>.</li>' +
      '<li><b>Avogadro law</b>: 1 mole (6.02 &times; 10<sup>23</sup> molecules) occupies {{22.4 L}} at STP.</li>' +
      '<li><b>Ideal gas law</b>: {{PV = nRT}}, with R = {{0.082}} L&middot;atm/(K&middot;mol) = {{8.314}} J/(K&middot;mol).</li>' +
      '<li><b>Real gases &amp; CO<sub>2</sub> cylinders</b>: real gases deviate from PV/RT = 1 at high pressure; a liquid CO<sub>2</sub> cylinder at 20 °C has a vapor pressure of {{830 psi}} (56.5 atm) below its critical temperature (31 °C).</li></ul></div>' +
      CVS.fig('gas-compress', 'Compressibility factor (PV/RT) of five real gases at 0 °C compared with an ideal gas.', 'gas', 11) + '</div>' },
  { t: 'q', id: 'G1', src: 'AC79', core: true, keep: true,
    q: 'Which statement is true regarding the Boyle’s law?',
    o: ['Pressure increases when the temperature increases.', 'Pressure increases when the volume increases', 'Pressure increases when the volume decreases.', 'Pressure is always equal to volume.', 'Total pressure is calculated from the summation of partial pressures.'], a: 2,
    ex: 'Boyle: at constant temperature, P₁V₁ = P₂V₂, so pressure rises as volume falls. A is Gay-Lussac, E is Dalton.' },
  { t: 'q', id: 'G2', src: 'AC80 · AC81', core: true, keep: true,
    q: 'Air flows from high to low pressure during inspiration-expiration, which law indicates this?',
    o: ['Boyle', 'Charle', 'Gay-Lussac', 'Dalton', 'Henry'], a: 0,
    ex: 'Breathing works by Boyle’s law: expanding the thorax lowers alveolar pressure below atmospheric so air flows in; shrinking it raises alveolar pressure so air flows out.',
    flag: 'AC80 asked “The mechanism of pulmonary inspiration and expiration is best explained by which gas law?” (Boyle).' },
  { t: 'c', id: 'G-C2', title: 'Dalton law, airway humidification and the O2/CO2 cascade', src: 'Gas phase p.15–20',
    html: '<div class="tblwrap"><table class="tbl"><thead><tr><th>Gas</th><th>Dry atmospheric air (mmHg)</th><th>Moist bronchial air (mmHg)</th><th>Alveolar air (mmHg)</th></tr></thead><tbody>' +
      '<tr><td><b>O<sub>2</sub> (20.93% dry)</b></td><td>{{159.1}}</td><td>{{149.2}}</td><td>{{101.2}}</td></tr>' +
      '<tr><td><b>CO<sub>2</sub> (0.03–0.04% dry)</b></td><td>0.3</td><td>0.3</td><td>{{40.0}}</td></tr>' +
      '<tr><td><b>H<sub>2</sub>O vapor</b></td><td>0.0</td><td>{{47.0}}</td><td>{{47.0}}</td></tr>' +
      '<tr><td><b>N<sub>2</sub> (79.03% dry)</b></td><td>600.6</td><td>{{563.5}}</td><td>571.8</td></tr>' +
      '<tr><td><b>Total</b></td><td>760.0</td><td>760.0</td><td>760.0</td></tr></tbody></table></div>' +
      '<ul class="pts"><li><b>Isothermic saturation boundary</b> (just below the carina): inspired air reaches {{37 °C}}, {{100%}} relative humidity, and {{44 mg/L}} water content, exerting P<sub>H2O</sub> = 47 mmHg.</li>' +
      '<li><b>Humidified tracheal P<sub>O2</sub></b>: F<sub>iO2</sub> &times; (P<sub>B</sub> &minus; P<sub>H2O</sub>) = 0.2093 &times; (760 &minus; 47) = 0.2093 &times; {{713}} mmHg.</li></ul>' +
      '<div class="two">' + CVS.fig('gas-humid', 'Airway warming and humidification from the nose to the isothermic saturation boundary below the carina.', 'gas', 16) +
      CVS.fig('gas-cascade', 'Partial pressures of O2, CO2, H2O, and N2 from dry air through moist bronchial air to alveolar gas and blood.', 'gas', 20) + '</div>' },
  { t: 'q', id: 'G3', src: 'Gas phase p.16–17', core: true,
    q: 'When dry atmospheric air at sea level (PB = 760 mmHg, FiO2 = 0.2093) is warmed to 37 °C and fully humidified in the conducting airways, what is the moist bronchial PO2?',
    o: ['149.2 mmHg', '159.1 mmHg', '101.2 mmHg', '112.1 mmHg', '99.2 mmHg'], a: 0,
    ex: 'Water vapor at 37 °C (100% RH, 44 mg/L) exerts 47 mmHg, leaving 760 − 47 = 713 mmHg for dry gases: PO2(humidified) = 0.2093 × 713 = 149.2 mmHg.' },
  { t: 'tf', id: 'G4', src: 'Gas phase p.17–19',
    q: 'Humidification of inspired air in the upper respiratory tract lowers the partial pressure of oxygen before any alveolar gas exchange occurs.', a: true,
    ex: 'True: adding 47 mmHg of water vapor dilutes the total dry gas pressure from 760 to 713 mmHg, dropping PO2 from 159.1 mmHg to 149.2 mmHg in the conducting airways.' },
  { t: 'c', id: 'G-C3', title: 'The alveolar gas equation and Graham law of diffusion', src: 'Gas phase p.21–26',
    html: '<div class="stack"><ul class="pts">' +
      '<li><b>Full alveolar gas equation</b>: P<sub>AO2</sub> = F<sub>iO2</sub>(P<sub>B</sub> &minus; P<sub>H2O</sub>) &minus; P<sub>aCO2</sub>/{{R}} + {{F}}, where P<sub>ACO2</sub> &approx; {{PaCO2}} (40 mmHg).</li>' +
      '<li><b>Respiratory exchange ratio (R)</b>: V&#775;<sub>CO2</sub> / V&#775;<sub>O2</sub> = {{183}} / {{230}} = 0.797 &approx; {{0.8}}.</li>' +
      '<li><b>Correction factor (F)</b>: accounts for N<sub>2</sub> concentration difference when R &ne; 1; normally about {{2}} mmHg (&lt;3 mmHg). Including F: P<sub>AO2</sub> = 149.2 &minus; 40/0.8 + 2 = 101.2 mmHg; ignoring F gives {{99.2 mmHg}}.</li>' +
      '<li><b>Clinical Beachey formulas</b>: when F<sub>iO2</sub> &le; {{0.6}}, P<sub>AO2</sub> = F<sub>iO2</sub>(P<sub>B</sub> &minus; 47) &minus; P<sub>aCO2</sub> &times; {{1.2}} (= 101.2 mmHg on room air); when F<sub>iO2</sub> &gt; 0.6, F drops out and P<sub>AO2</sub> = F<sub>iO2</sub>(P<sub>B</sub> &minus; 47) &minus; P<sub>aCO2</sub>.</li>' +
      '<li><b>Graham law of diffusion</b>: at constant T and P, the diffusion rate of a gas is inversely proportional to the {{square root}} of its molecular weight (R<sub>1</sub>/R<sub>2</sub> = &radic;(M<sub>2</sub>/M<sub>1</sub>)).</li></ul></div>' },
  { t: 'q', id: 'G5', src: 'AC80', core: true, keep: true,
    q: 'If the fraction of inspired oxygen is 20% and the alveolar partial pressure exerted by carbon dioxide is 40 mmHg, and the respiratory exchange ratio is 0.8. What is the alveolar partial pressure of oxygen gas? <span class="muted">(P.S. the partial pressure of H₂O is not given.)</span>',
    o: ['92', '95', '98', '102', '10'], a: 1,
    ex: 'Use the clinical form of the alveolar gas equation with P<sub>H2O</sub> = 47 mmHg: PAO₂ = 0.20 × (760 − 47) − 40 × 1.2 = 142.6 − 48 ≈ 95 mmHg. The shortcut without the correction (− PACO₂/R = − 50) gives 92.6.',
    flag: 'AC80 key: 95. The ×1.2 (Beachey) form includes the correction factor; the simple form PIO₂ − PACO₂/R gives about 93.' },
  { t: 'q', id: 'G6', src: 'AC81', keep: true,
    q: 'A patient is receiving oxygen via a nasal cannula at 30% FiO₂. The arterial blood gas shows PaCO₂ = 44 mmHg, and the respiratory Exchange Ratio (R) is 0.8. Calculate the alveolar oxygen tension (PAO₂).',
    o: ['150', '155', '160', '165', '170'], a: 2,
    ex: 'PIO₂ = 0.30 × (760 − 47) = 213.9 mmHg. PAO₂ = 213.9 − 44/0.8 = 158.9 (or 213.9 − 44 × 1.2 = 161) ≈ 160 mmHg.' },
  { t: 'c', id: 'G-C4', title: 'Henry law, gas solubility in blood, and oxygen cylinders & delivery', src: 'Gas phase p.27–30',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Henry law</b>: {{C = &alpha;P}} (dissolved gas concentration equals solubility coefficient &alpha; times partial pressure P).</li>' +
      '<li><b>Oxygen solubility in blood</b> (38 °C): &alpha;<sub>O2</sub> = {{0.00302}} mL O<sub>2</sub> / dL blood / mmHg (or {{0.023}} mL O<sub>2</sub> / mL blood at 760 mmHg).</li>' +
      '<li><b>Plasma solubilities</b> (38 °C, 1 atm, mL gas/mL): CO<sub>2</sub> = {{0.490}} vs O<sub>2</sub> = {{0.021}} (&sim;23&times; more soluble); N<sub>2</sub> = {{0.0127}}.</li>' +
      '<li><b>Total blood gas content</b>: [gas]<sub>total</sub> = [gas]<sub>dissolved</sub> + [gas]<sub>bound</sub> + [gas]<sub>chemically modified</sub>.</li>' +
      '<li><b>Oxygen tank conversion factors</b>: D = {{0.16 L/psi}} (2000 psi &rarr; {{320 L}}), E = {{0.28 L/psi}}, G = {{2.41 L/psi}}.</li>' +
      '<li><b>Delivery devices</b>: nasal cannula at {{2–6 L/min}} gives F<sub>iO2</sub> {{0.28–0.44}} (&gt;6 L/min irritates nasal mucosa); simple face mask at 3–8 L/min gives F<sub>iO2</sub> 0.30–0.80.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('gas-henry', 'Henry law and solubility coefficients of O2, CO2, N2, and CO in water, plasma, red cells, and whole blood.', 'gas', 28) +
      CVS.fig('gas-o2tank', 'Medical oxygen cylinders (G, M, D, E) with tank factors and flow/FiO2 ranges for nasal cannula and face mask.', 'gas', 30) + '</div></div>' },
  { t: 'q', id: 'G7', src: 'AC80 · AC81', core: true, keep: true,
    q: 'Which gas law explains the relation between the partial pressure of a gas and the concentration of the gas dissolved in a solution?',
    o: ['Boyle’s law', 'Charles’s law', 'Dalton’s law', 'Henry’s law', 'Graham’s law'], a: 3,
    ex: 'Henry’s law: the amount of gas dissolved is proportional to its partial pressure (C = α × P).' }
]});

/* Section M: Mechanics of breathing (Mechanics handout, slides 1–44). */
CVS.add({ id: 'M', short: 'Mechanics', title: 'Mechanics of Breathing: Pressures, Compliance, Resistance & Work', kind: 'Lecture',
  blurb: 'Inspiratory and expiratory muscles, pleural and alveolar pressures in spontaneous vs positive-pressure ventilation, surfactant and the lung-thorax relaxation curve, compliance, Poiseuille law and dynamic compression, breath sounds, and work of breathing.',
  items: [
  { t: 'c', id: 'M-C1', title: 'Respiratory muscles and pressures in spontaneous vs positive-pressure breathing', src: 'Mechanics p.1–12',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Architecture</b>: {{23}} airway generations ending in {{300 million}} alveoli with {{50 to 100 m2}} diffusing surface area.</li>' +
      '<li><b>Quiet inspiration</b>: {{diaphragm}} and {{external intercostals}} contract. <b>Maximal inspiration</b> adds {{sternocleidomastoid}}, {{serratus anterior}}, and {{scalenes}}.</li>' +
      '<li><b>Quiet expiration</b>: passive muscle relaxation. <b>Maximal expiration</b>: {{internal intercostals}} and abdominal muscles (rectus abdominis, external &amp; internal obliques) contract.</li>' +
      '<li><b>At rest (FRC = EELV)</b>: P<sub>A</sub> = {{0 cmH2O}}, P<sub>pl</sub> = {{-5 cmH2O}} (&minus;3.5 mmHg), transpulmonary pressure P<sub>L</sub> = P<sub>A</sub> &minus; P<sub>pl</sub> = {{+5 cmH2O}}.</li>' +
      '<li><b>Quiet inspiration</b> (Boyle law): P<sub>pl</sub> falls to &minus;8 to &minus;10 cmH<sub>2</sub>O, P<sub>A</sub> drops to {{-1 cmH2O}}, 500 mL flows in; during expiration P<sub>A</sub> rises to +1 cmH<sub>2</sub>O.</li>' +
      '<li><b>Positive-pressure ventilation (PPV)</b>: ventilator raises P<sub>ao</sub> above atmospheric (e.g. +30 cmH<sub>2</sub>O) so P<sub>pl</sub> rises (+5 cmH<sub>2</sub>O passive); if the patient also inspires actively (P<sub>pl</sub> = &minus;20), P<sub>L</sub> = 30 &minus; (&minus;20) = 50 cmH<sub>2</sub>O.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('mech-muscles', 'Muscles of inspiration (left) and muscles of expiration (right).', 'mech', 2) +
      CVS.fig('mech-cycle', 'Volume, intrapleural pressure, and alveolar pressure changes during a normal spontaneous breath.', 'mech', 9) + '</div></div>' +
      CVS.fig('mech-ppv', 'Pressures during passive positive-pressure ventilation compared with spontaneous breathing.', 'mech', 11) + '<p class="note"><b>From the past papers</b> · Pleural pressure is negative at rest because the elastic recoil of the lung pulls inward while the chest wall springs outward (AC81).</p>' },
  { t: 'q', id: 'M1', src: 'AC79', core: true, keep: true,
    q: 'Which of the following statements is correct?',
    o: ['Intrapleural pressure is always sub-atmospheric.', 'Transpulmonary pressure increases during expiration.', 'Intrapulmonary pressure is almost equivalent to intra-esophageal pressure', 'Lung volume that is left after quiet expiration is FRC.', 'Lung volume is the highest when the alveolar pressure at that moment is the most negative.'], a: 3,
    ex: 'D is the definition of FRC. A fails in forced expiration (intrapleural pressure turns positive). B: transpulmonary pressure falls in expiration. C: esophageal pressure tracks intrapleural, not alveolar, pressure. E: volume is highest at end-inspiration, when alveolar pressure is back to zero.' },
  { t: 'q', id: 'M2', src: 'AC81', keep: true,
    q: 'Which statement is true about quiet respiration in an adult?',
    o: ['Alveolar pressure is always sub-atmospheric.', 'Intrapleural pressure is higher than intraesophageal pressure.', 'Transpulmonary pressure is sub-atmospheric', 'Volume left in the lungs after quiet expiration is called functional residual capacity.'], a: 3,
    ex: 'Alveolar pressure is negative only during inspiration and positive during expiration; esophageal pressure is used as a stand-in for intrapleural pressure; transpulmonary pressure (PA − Ppl) stays positive.' },
  { t: 'q', id: 'M3', src: 'AC79 · AC80', keep: true,
    q: 'What is the amount of gas left in the lungs after normal expiration called?',
    o: ['ERV', 'RV', 'TV', 'FRC', 'IRV'], a: 3,
    ex: 'After a normal (quiet) expiration, with the muscles relaxed and alveolar pressure equal to atmospheric, the volume left is the FRC = ERV + RV. RV is what remains after a maximal expiration.',
    flag: 'AC80 asked it in Thai: “If all breathing muscles are relaxed and alveolar pressure equals atmospheric pressure, what volume is left in the lung?”' },
  { t: 'q', id: 'M4', src: 'AC81', core: true, keep: true,
