:root {
  /* Layout: a lab-bench stage. One large card at a time on chart-recorder paper, a strip of eight lab stations above, a sticky pager below. Browse = one scrolling worksheet. */
  --paper: #f3f5f8;      /* page ground, cool grey */
  --sheet: #ffffff;      /* card */
  --sheet2: #edf0f5;     /* inset panels */
  --ink: #19202e;        /* text */
  --ink2: #4f5a6e;       /* secondary text */
  --rule: #d4dae4;       /* hairlines */
  --grid: #e9edf3;       /* chart-paper grid */
  --art: #ae1530;        /* arterial red: brand, tracings */
  --art-soft: #fbe5e9;
  --ven: #1f4f97;        /* venous blue: controls, second tracing */
  --ven-soft: #e2ebf8;
  --ok: #13744a; --ok-soft: #dff2e7;
  --bad: #b02f19; --bad-soft: #fbe6df;
  --warn: #775100; --warn-soft: #fbefd2;
  --scanbg: #ffffff;     /* paper behind real figures */
  --f-display: "Bai Jamjuree", "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1117; --sheet: #161a22; --sheet2: #1e232e; --ink: #e5e8ef; --ink2: #a3abbc; --rule: #2b3240; --grid: #1f2530;
    --art: #ff6f84; --art-soft: #3a1b23; --ven: #8db3f2; --ven-soft: #1a2840;
    --ok: #4fc98b; --ok-soft: #13301f; --bad: #ff8b74; --bad-soft: #391e17; --warn: #efc04e; --warn-soft: #32280e; --scanbg: #e6e3dc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1117; --sheet: #161a22; --sheet2: #1e232e; --ink: #e5e8ef; --ink2: #a3abbc; --rule: #2b3240; --grid: #1f2530;
  --art: #ff6f84; --art-soft: #3a1b23; --ven: #8db3f2; --ven-soft: #1a2840;
  --ok: #4fc98b; --ok-soft: #13301f; --bad: #ff8b74; --bad-soft: #391e17; --warn: #efc04e; --warn-soft: #32280e; --scanbg: #e6e3dc;
  color-scheme: dark;
}
html { -webkit-text-size-adjust: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ven); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- cards ---------- */
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: clamp(16px, 2.6vw, 34px); min-width: 0; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; font-family: var(--f-mono); font-size: .8em; color: var(--ink2); }
.eyebrow .id { font-weight: 600; color: var(--art); font-size: 1.12em; letter-spacing: .02em; }
.chip { border-radius: 999px; padding: 2px 9px; background: var(--sheet2); color: var(--ink2); white-space: nowrap; }
.chip.core { background: var(--art-soft); color: var(--art); }
.chip.kind { background: var(--ven-soft); color: var(--ven); }
.chip.grp { background: transparent; border: 1px dashed var(--rule); }
.concept h2, .secard h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.6em; line-height: 1.2; margin: 0 0 14px; text-wrap: balance; letter-spacing: .005em; }
.cbody { display: grid; gap: 16px; }
.cbody > * { min-width: 0; }
.muted { color: var(--ink2); font-weight: 400; }

/* ---------- question cards ---------- */
.stem { font-size: 1.26em; font-weight: 500; line-height: 1.45; margin: 2px 0 16px; text-wrap: pretty; }
.stem b { color: var(--art); font-weight: 600; }
.stem .muted { font-size: .82em; display: block; margin-top: 4px; }
.qfig { margin: 0 0 16px; }
.opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.opt { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; text-align: left; background: var(--sheet); color: var(--ink); border: 1.5px solid var(--rule); border-radius: 10px; padding: .6em .85em; cursor: pointer; transition: border-color .15s, background-color .15s, opacity .15s; line-height: 1.4; }
.opt:hover { border-color: var(--ven); }
.opt .L { font: 600 .88em var(--f-mono); width: 2em; height: 2em; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--rule); color: var(--ink2); }
.opt .mk { font-weight: 700; min-width: 1em; }
.opt.sel { border-color: var(--ven); background: var(--ven-soft); }
.opt.sel .L { border-color: var(--ven); color: var(--ven); }
.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tfrow .opt { padding: .9em 1em; font-size: 1.08em; font-weight: 500; }
.rev .opt { cursor: default; }
.rev .opt.isans, .showall .opt.isans { border-color: var(--ok); background: var(--ok-soft); }
.rev .opt.isans .L, .showall .opt.isans .L { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.rev .opt.isans .mk::after, .showall .opt.isans .mk::after { content: "\2713"; color: var(--ok); }
.rev .opt.sel:not(.isans) { border-color: var(--bad); background: var(--bad-soft); }
.rev .opt.sel:not(.isans) .L { border-color: var(--bad); color: var(--bad); }
.rev .opt.sel:not(.isans) .mk::after { content: "\2717"; color: var(--bad); }
.rev .opt:not(.isans):not(.sel) { opacity: .55; }
.think { margin: 0; color: var(--ink2); font-style: italic; }
.explain { margin-top: 16px; background: var(--ok-soft); border-radius: 12px; padding: 14px 18px; }
.qcard:not(.rev) .explain { display: none; }
.showall .qcard .explain { display: block; }
.explain .ans { font: 600 1.02em var(--f-display); color: var(--ok); margin-bottom: 4px; }
.explain p { margin: 0; }
.flag { margin-top: 10px; background: var(--warn-soft); border-radius: 10px; padding: 8px 12px; font-size: .9em; }
.flag b { color: var(--warn); }

/* ---------- concept building blocks ---------- */
.two { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.figpair { grid-template-columns: minmax(0, .75fr) minmax(0, 1.25fr); align-items: center; }
@media (max-width: 760px) { .two, .cols2, .cols3, .figpair { grid-template-columns: 1fr; } }
.mini { background: var(--sheet2); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.mini h4 { margin: 0 0 6px; font: 600 1em var(--f-display); letter-spacing: .01em; }
.mini.art h4 { color: var(--art); }
.mini.ven h4 { color: var(--ven); }
.mini p { margin: 0; }
.mini ul { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }
.pts { margin: 0; padding-left: 1.2em; display: grid; gap: 7px; }
.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 7px; }
.steps.tight { gap: 3px; }
.note { margin: 0; background: var(--ven-soft); border-radius: 10px; padding: 10px 14px; }
.trap { margin: 0; background: var(--warn-soft); border-radius: 10px; padding: 10px 14px; }
.trap::before { content: "Exam trap \00B7  "; font-weight: 600; color: var(--warn); }
.eqn { font: 600 1.65em var(--f-display); text-align: center; letter-spacing: .02em; padding: 6px 0; }
.eqn span { color: var(--art); }
.speeds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .speeds { grid-template-columns: 1fr; } }
.speed { border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; background: var(--sheet); }
.sp-h { display: grid; gap: 2px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed var(--rule); }
.sp-h .mono { font-family: var(--f-mono); font-size: .8em; color: var(--ink2); }
.s1 .sp-h b { color: var(--art); }
.s2 .sp-h b { color: var(--warn); }
.s3 .sp-h b { color: var(--ven); }
.speed ul { margin: 0; padding-left: 1.1em; display: grid; gap: 3px; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.flow.col { flex-direction: column; align-items: stretch; }
.fbox { border: 1px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 8px 12px; flex: 1 1 140px; min-width: 0; }
.fbox.start { background: var(--sheet2); }
.fbox.end { background: var(--ok-soft); border-color: var(--ok); }
.fbox.art { background: var(--art-soft); border-color: var(--art); }
.fbox.ven { background: var(--ven-soft); border-color: var(--ven); }
.farrow { color: var(--ink2); font-weight: 600; flex: none; text-align: center; }
.flow.col .farrow { font-size: .9em; }
.fstack { display: grid; gap: 8px; flex: 2 1 260px; min-width: 0; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 600px) { .fgrid { grid-template-columns: 1fr; } }
.cycle { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.cycle .ph { flex: 1 1 130px; background: var(--sheet2); border-radius: 8px; padding: 8px 10px; font-weight: 600; font-size: .92em; display: grid; gap: 2px; align-content: start; }
.cycle .ph span { font-weight: 400; color: var(--ink2); font-size: .88em; }
.cycle .sd { flex: none; align-self: center; font: 700 .9em var(--f-mono); color: var(--sheet); background: var(--ink); border-radius: 999px; padding: 4px 10px; }

/* ---------- tables ---------- */
.tblwrap { overflow-x: auto; min-width: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: .92em; }
.tbl caption { text-align: left; font: 600 .95em var(--f-display); padding-bottom: 6px; }
.tbl th, .tbl td { border-bottom: 1px solid var(--rule); padding: 7px 10px; text-align: left; vertical-align: top; }
.tbl thead th { font-family: var(--f-mono); font-size: .76em; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); background: var(--sheet2); }
.tbl td.num { font-variant-numeric: tabular-nums; font-family: var(--f-mono); white-space: nowrap; }
.tbl .up { color: var(--art); font-weight: 600; }
.tbl .dn { color: var(--ven); font-weight: 600; }
.tbl thead th.up { color: var(--art); }
.tbl thead th.dn { color: var(--ven); }
.tbl.compact th, .tbl.compact td { padding: 4px 8px; }
.dogtbl td:nth-child(2), .dogtbl td:nth-child(3), .dogtbl td:nth-child(4) { text-align: center; white-space: nowrap; }
.dogtbl.txt4 td:nth-child(4) { text-align: left; white-space: normal; }  /* 4th column is a "Why" sentence, not a number */

/* ---------- real figures cropped from the course material ---------- */
.stack { display: grid; gap: 12px; align-content: start; min-width: 0; }
.scan { margin: 0; min-width: 0; display: grid; gap: 6px; align-content: start; }
.paperimg { background: var(--scanbg); border: 1px solid var(--rule); border-radius: 10px; padding: 8px; isolation: isolate; }
.scan img { display: block; width: auto; max-width: 100%; height: auto; max-height: min(440px, 62vh); margin: 0 auto; mix-blend-mode: multiply; cursor: zoom-in; border-radius: 4px; }
.scan.tall img { max-height: min(480px, 66vh); }
.scanrow .scan img { max-height: 360px; }
.scan figcaption { font-size: .84em; line-height: 1.4; color: var(--ink2); text-wrap: pretty; }
.scan figcaption .src { font-family: var(--f-mono); font-size: .88em; white-space: nowrap; opacity: .9; }
.scan figcaption .src::before { content: "\00B7  "; }
.scan figcaption.srconly .src::before { content: none; }
.scanrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; align-items: start; min-width: 0; }
.qfig .scan { max-width: 760px; }
.qfig .scan.tall { max-width: 560px; }

/* ---------- cloze blanks: {{key detail}} in concept cards ---------- */
.cz { border-radius: 4px; padding: 0 .22em; background: var(--sheet2); color: transparent; box-shadow: inset 0 -2px 0 var(--art); cursor: pointer; -webkit-box-decoration-break: clone; box-decoration-break: clone; transition: color .18s, background-color .18s; }
.cz * { color: transparent !important; }
.cz:hover { background: var(--art-soft); }
.cz.on, .czopen .cz, .showall .cz { color: inherit; background: var(--art-soft); }
.cz.on *, .czopen .cz *, .showall .cz * { color: inherit !important; }
.cz.last { animation: czpop .5s ease-out; }
@keyframes czpop { 0% { box-shadow: inset 0 -2px 0 var(--art), 0 0 0 4px var(--art-soft); } 100% { box-shadow: inset 0 -2px 0 var(--art), 0 0 0 0 transparent; } }
@media print { .cz { color: inherit; background: none; } .cz * { color: inherit !important; } }

/* ---------- figure zoom ---------- */
.zoom { position: fixed; inset: 0; z-index: 60; background: rgba(6, 8, 12, .88); display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
.zoom[hidden] { display: none; }
.zoom .zbox { display: grid; gap: 10px; justify-items: center; max-width: 100%; }
.zoom .zpaper { background: #fff; border-radius: 10px; padding: 10px; max-width: min(1700px, 100%); }
.zoom img { display: block; max-width: 100%; max-height: calc(100vh - 120px); width: auto; height: auto; }
.zoom .zcap { color: #e5e8ef; font-size: .92em; text-align: center; max-width: 900px; margin: 0; }

/* Thai explanation under each concept card (student deck: collapsible; tutor deck: open) */
.thx { margin-top: 16px; border: 1px solid var(--rule); border-left: 3px solid var(--ok); border-radius: 10px; background: var(--sheet); padding: 0 14px; }
.thx summary { cursor: pointer; padding: 10px 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.thx summary::marker, .thx summary::-webkit-details-marker { color: var(--ok); }
.thx-h { font: 600 1.02em var(--f-display); color: var(--ok); }
.thx-s { font: .74em var(--f-mono); color: var(--ink2); }
.thx[open] summary { border-bottom: 1px dashed var(--rule); margin-bottom: 10px; }
.thx-body { display: grid; gap: 9px; padding-bottom: 14px; line-height: 1.7; font-family: "IBM Plex Sans Thai", var(--f-body); }
.thx-body p { margin: 0; }
ul.thx-body { margin: 0; padding: 0 0 14px 1.2em; gap: 6px; }
ul.thx-body li::marker { color: var(--ok); }
.thx-body b { font-weight: 600; color: var(--ink); }

/* cover: counts + QR to the live deck (student deck start card and PDF cover) */
.coverline { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px 32px; margin: 4px 0 22px; padding: 14px 0 16px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.counts { display: flex; gap: 44px; }
.counts > div { display: grid; }
.counts b { font: 600 3.2em/1 var(--f-display); letter-spacing: -.01em; }
.counts span { font: .8em var(--f-mono); color: var(--ink2); letter-spacing: .04em; margin-top: 5px; }
.qrlink { display: grid; justify-items: end; gap: 6px; color: var(--ink2); text-decoration: none; }
.qrlink img { width: 112px; height: 112px; display: block; }
.qrlink span { font: .72em var(--f-mono); }
.qrlink .qrcap { font: 600 .78em var(--f-display); color: var(--ink); letter-spacing: .01em; }
.qrlink:hover span { color: var(--ven); text-decoration: underline; }
.legend { margin: 14px 0 0; font: .8em var(--f-mono); color: var(--ink2); }
.legend .chip { margin-right: 6px; }
@media (max-width: 560px) { .qrlink img, .qrlink .qrcap { display: none; } .qrlink { justify-items: start; } .counts b { font-size: 2.6em; } }
/* short concept cards (data/lite.js): arrow chains and brief bullets */
.lt { display: grid; gap: 10px; align-content: start; }
.lt-two { align-items: start; }
.lt-figs { display: grid; gap: 12px; }
.lt-chain { margin: 0; padding: 8px 12px; background: var(--sheet2); border-radius: 8px; line-height: 1.65; font-weight: 500; }
.lt-ar { color: var(--art); font-weight: 700; padding: 0 .12em; }
.lt-pts { margin: 0; padding-left: 1.15em; display: grid; gap: 4px; line-height: 1.5; }
.lt-h { margin: 4px 0 -4px; font: 600 .78em var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); }
.lt-trap { margin: 0; background: var(--warn-soft); border-left: 3px solid var(--warn); border-radius: 8px; padding: 6px 10px; font-size: .95em; }
.lt-p { margin: 0; }
.lt-tbl { width: 100%; border-collapse: collapse; font-size: .95em; }
.lt-tbl th { text-align: left; font: 600 .78em var(--f-mono); text-transform: uppercase; letter-spacing: .04em; color: var(--ink2); border-bottom: 1.5px solid var(--rule); padding: 4px 8px; }
.lt-tbl td { border-bottom: 1px solid var(--rule); padding: 5px 8px; vertical-align: top; }
.lt .eqn { font-size: 1.15em; padding: 2px 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--sheet); border-bottom: 1px solid var(--rule); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px 18px; align-items: center; }
@media (max-width: 1020px) { .bar { grid-template-columns: minmax(0, 1fr) auto; } .tabs { grid-column: 1 / -1; order: 3; } }
.brand { display: flex; gap: 10px; align-items: center; min-width: 0; }
.brand svg { flex: none; width: 38px; height: 22px; }
.brand b { display: block; font: 600 1.05rem var(--f-display); letter-spacing: .01em; white-space: nowrap; }
.brand small { display: block; color: var(--ink2); font: .72rem var(--f-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; gap: 6px; overflow-x: auto; min-width: 0; padding-block: 2px; scrollbar-width: thin; }
.tab { flex: none; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink2); border-radius: 999px; padding: 5px 12px; font-size: .84rem; font-weight: 500; cursor: pointer; white-space: nowrap; }
.tab:hover { border-color: var(--ven); color: var(--ink); }
.tab .k { font-family: var(--f-mono); color: var(--art); margin-right: 6px; font-weight: 600; }
.tab[aria-current="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.tab[aria-current="true"] .k { color: var(--art-soft); }
.ctrls { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink2); padding: 6px 11px; font-size: .85rem; font-weight: 500; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ven); color: var(--sheet); }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: .85rem; color: var(--ink2); cursor: pointer; user-select: none; white-space: nowrap; }
.chk input { accent-color: var(--art); width: 16px; height: 16px; margin: 0; }
.icon { display: inline-grid; place-items: center; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 8px; height: 32px; width: 34px; padding: 0; cursor: pointer; }
.icon svg { width: 16px; height: 16px; }
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 0; }
#present { max-width: 1180px; margin: 0 auto; }
#present .card { font-size: clamp(15px, .5vw + 11.5px, 20px); }
.stage { min-height: 55vh; }
.eyebrow .sp { flex: 1; }
.pager { position: sticky; bottom: 0; z-index: 5; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 8px 10px; align-items: center; background: var(--paper); padding-block: 12px calc(10px + env(safe-area-inset-bottom, 0px)); margin-top: 14px; border-top: 1px solid var(--rule); }
.pos { font-family: var(--f-mono); font-size: .82rem; color: var(--ink2); text-align: center; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pos span { color: var(--art); font-weight: 600; }
.btn { border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 10px; padding: 9px 14px; font-size: .95rem; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--ven); }
.btn.primary { background: var(--art); color: var(--sheet); border-color: var(--art); min-width: 8.5em; }
.btn.small { padding: 5px 11px; font-size: .85rem; }
.btn:disabled { opacity: .4; cursor: default; }
.prog { grid-column: 1 / -1; height: 3px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--art); width: 0; transition: width .2s; }
.keys { grid-column: 1 / -1; font: .72rem var(--f-mono); color: var(--ink2); text-align: center; }
@media (max-width: 560px) { .pager { grid-template-columns: auto minmax(0, 1fr) auto; } #reveal { grid-column: 1 / -1; order: 5; } .keys { display: none; } }

/* intro and section cards */
.secard .lede { font-size: 1.1em; color: var(--ink2); margin: 0 0 16px; max-width: 65ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 26px; font-family: var(--f-mono); font-size: .82em; color: var(--ink2); margin-bottom: 16px; }
.stats b { font: 600 1.7em var(--f-display); color: var(--ink); display: block; line-height: 1.1; }
.minih { font: 600 .8em var(--f-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--ink2); margin: 0 0 8px; }
.toc { margin: 0; padding-left: 0; list-style: none; columns: 2 280px; column-gap: 28px; }
.toc li { break-inside: avoid; margin-bottom: 5px; }
.toc .tid { font-family: var(--f-mono); color: var(--art); font-size: .85em; margin-right: 8px; }
.stations { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin: 4px 0 16px; }
.station { text-align: left; border: 1px solid var(--rule); background: var(--sheet2); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: grid; gap: 2px; }
.station:hover { border-color: var(--ven); }
.station .k { font: 600 .78rem var(--f-mono); color: var(--art); }
.station b { font: 600 1.05rem var(--f-display); }
.station span:last-child { color: var(--ink2); font-size: .86rem; }
.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-bottom: 14px; }
.howto div { background: var(--sheet2); border-radius: 10px; padding: 10px 12px; font-size: .92em; }
.howto b { display: block; font-family: var(--f-display); margin-bottom: 2px; }
kbd { font: .82em var(--f-mono); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--sheet); }

/* browse */
#browse { max-width: 1000px; margin: 0 auto; padding-bottom: 48px; }
.btools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding-block: 4px 6px; }
.btools input[type="search"] { flex: 1 1 260px; min-width: 0; border: 1px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 9px 12px; }
.bcount { font: .8rem var(--f-mono); color: var(--ink2); }
.bsec { display: grid; gap: 14px; margin-top: 28px; }
.bsec > header { scroll-margin-top: 130px; }
.bsec > header h2 { font: 600 1.5rem var(--f-display); margin: 0; text-wrap: balance; }
.bsec > header p { margin: 4px 0 0; color: var(--ink2); }
.bsec > header .eyebrow { margin-bottom: 6px; }
#blist .card { font-size: 15px; scroll-margin-top: 130px; }
#blist .stem { font-size: 1.1em; }
.qfoot { margin-top: 12px; display: flex; justify-content: flex-end; }

/* Thai bullet explanations & concept key points */
.ex-list { margin: 6px 0 0; padding-left: 1.25em; display: grid; gap: 5px; line-height: 1.55; }
.ex-list li::marker { color: var(--ok); }
.tpoints { margin-bottom: 14px; background: var(--ven-soft); border-left: 3px solid var(--ven); border-radius: 10px; padding: 10px 14px; }
.tpoints .tp-head { font: 600 .75em var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ven); margin-bottom: 4px; }
.tpoints ul { margin: 0; padding-left: 1.25em; display: grid; gap: 4px; line-height: 1.5; }
.traps-box { margin: 12px 0; background: var(--warn-soft); border-left: 3px solid var(--warn); border-radius: 10px; padding: 10px 14px; }
.traps-box .tp-head { font: 600 .75em var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--warn); margin-bottom: 4px; }
.traps-box ul { margin: 0; padding-left: 1.25em; display: grid; gap: 4px; line-height: 1.5; }
.brand > div { min-width: 0; }
.brand b { overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 640px) { .bar { grid-template-columns: minmax(0, 1fr); position: relative; } .ctrls { justify-content: flex-start; } }
.saybox { margin: 12px 0 0; background: var(--sheet2); border-left: 3px solid var(--art); border-radius: 10px; padding: 10px 14px; }
.concept .saybox, .secard .saybox { margin: 0 0 14px; }
.saybox .tp-head { font: 600 .75em var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--art); margin-bottom: 4px; }
.saybox p { margin: 0; line-height: 1.55; }
.tn-head { font: 600 .75em var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--art); margin-bottom: 4px; }
.tnotes ul { margin: 0; padding-left: 1.2em; display: grid; gap: 3px; line-height: 1.45; }
.tdiag { margin: 8px 0 0; padding: 8px 10px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; font: .8em/1.45 var(--f-mono); white-space: pre; overflow-x: auto; color: var(--ink); }
/* ===== NS I & RS I Anatomy 101: components added on top of the CVS deck styles ===== */
:root { --bone: #8a6d3b; --bone-soft: #f6eedd; --nerve: #a07a00; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bone: #e2c27f; --bone-soft: #2f2715; } }
:root[data-theme="dark"] { --bone: #e2c27f; --bone-soft: #2f2715; }

.chip.cad { background: var(--bone-soft); color: var(--bone); }
.chip.spot { background: var(--ok-soft); color: var(--ok); }
.chip.vid { background: var(--warn-soft); color: var(--warn); }
.chip.src { background: transparent; border: 1px solid var(--rule); }
.tab .n { font-family: var(--f-mono); font-size: .76em; opacity: .7; margin-left: 6px; }
.filt { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.filt button { border: 0; background: transparent; color: var(--ink2); padding: 6px 9px; font-size: .8rem; cursor: pointer; }
.filt button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }

/* concept layout: text left, lecture figure right */
.cgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 22px; align-items: start; }
.cgrid.nofig { grid-template-columns: 1fr; }
@media (max-width: 860px) { .cgrid { grid-template-columns: 1fr; } }
.figs { display: grid; gap: 10px; min-width: 0; }
.figs.multi { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.fig { margin: 0; display: grid; gap: 4px; min-width: 0; }
.fig img { width: 100%; height: auto; max-height: 62vh; object-fit: contain; border-radius: 8px; border: 1px solid var(--rule); background: #fff; cursor: zoom-in; display: block; }
.fig figcaption { font: .74em var(--f-mono); color: var(--ink2); }

/* cadaver step (vhdissector style) */
.instr { margin: 0 0 14px; background: var(--bone-soft); border-left: 3px solid var(--bone); border-radius: 10px; padding: 10px 14px; font-weight: 500; }
.instr::before { content: "Dissector \00B7  "; font: 600 .78em var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--bone); }
.viewtabs { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
.viewtabs button { border: 0; background: transparent; padding: 5px 11px; font-size: .82rem; color: var(--ink2); cursor: pointer; }
.viewtabs button[aria-pressed="true"] { background: var(--bone); color: var(--sheet); }
.sgrid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .75fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .sgrid { grid-template-columns: 1fr; } }
.views { display: grid; gap: 10px; min-width: 0; }
.views.side { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
.views.side .fig img { max-height: 56vh; }
.views[data-v="cad"] .vw-cmp, .views[data-v="cmp"] .vw-cad { display: none; }
.views .fig.cadimg img { background: #111; }
.labels { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; }
.labels li { display: grid; grid-template-columns: 2.4em 1fr; gap: 8px; align-items: baseline; }
.labels .no { font: 600 .9em var(--f-mono); color: var(--sheet); background: var(--bone); border-radius: 6px; text-align: center; padding: 1px 0; }
.labels .nm { border-radius: 4px; padding: 0 .3em; cursor: pointer; background: var(--sheet2); color: transparent; box-shadow: inset 0 -2px 0 var(--bone); min-height: 1.3em; }
.labels .nm.on, .showall .labels .nm, .tutor .labels .nm { color: inherit; background: var(--bone-soft); }
.lbltools { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 10px; }
.rel { margin-top: 12px; }
.rel h4, .side-h { margin: 0 0 6px; font: 600 .78em var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); }
.rel ul { margin: 0; padding-left: 1.15em; display: grid; gap: 4px; line-height: 1.5; }
.refs { margin-top: 12px; font: .78em var(--f-mono); color: var(--ink2); }
.refs a { color: var(--ven); }

/* past spot test station */
.spotimg { margin: 0 0 14px; }
.spotimg img { width: 100%; max-height: 64vh; object-fit: contain; background: #fff; border: 1px solid var(--rule); border-radius: 10px; cursor: zoom-in; display: block; }
.sq { border-top: 1px dashed var(--rule); padding-top: 12px; margin-top: 12px; }
.sq:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.sq .qn { font: 600 .82em var(--f-mono); color: var(--art); margin-right: 6px; }
.sq .qt { font-weight: 500; font-size: 1.08em; }
.sq .opts { margin-top: 10px; }
.sa-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.sa-row input { flex: 1 1 240px; min-width: 0; border: 1px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 8px 12px; }
.sa-key { display: none; margin-top: 10px; background: var(--ok-soft); border-radius: 10px; padding: 10px 14px; }
.sa-key .ans { font: 600 1.02em var(--f-display); color: var(--ok); }
.sa-key p { margin: 4px 0 0; }
.sq.rev .sa-key, .showall .sa-key, .tutor .sa-key { display: block; }
.sq .explain { display: none; }
.sq.rev .explain, .showall .sq .explain, .tutor .sq .explain { display: block; }
.sq.rev .opt { cursor: default; }
.sq.rev .opt.isans, .tutor .sq .opt.isans { border-color: var(--ok); background: var(--ok-soft); }
.sq.rev .opt.isans .L, .tutor .sq .opt.isans .L { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.sq.rev .opt.sel:not(.isans) { border-color: var(--bad); background: var(--bad-soft); }
.sq.rev .opt:not(.isans):not(.sel) { opacity: .55; }
.tutor .sq .opt:not(.isans) { opacity: .6; }
.yours { font-size: .88em; color: var(--ink2); margin-top: 4px; }

/* lab video clip card */
.frames { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 14px; }
.frames figure { margin: 0; position: relative; }
.frames img { width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: 8px; border: 1px solid var(--rule); cursor: zoom-in; display: block; }
.frames .ts { position: absolute; left: 6px; bottom: 6px; font: 600 .72em var(--f-mono); background: rgba(0,0,0,.7); color: #fff; border-radius: 4px; padding: 1px 5px; }
.kp { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; }
.kp li { display: grid; grid-template-columns: 4.2em 1fr; gap: 10px; align-items: baseline; }
.kp .ts { font: 600 .82em var(--f-mono); color: var(--warn); }
.myth { margin-top: 14px; border: 1px solid var(--rule); border-left: 3px solid var(--warn); border-radius: 10px; padding: 10px 14px; }
.myth .mh { font: 600 .76em var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--warn); }
.myth .heard { margin: 4px 0 8px; font-style: italic; }
.myth .tf { display: flex; gap: 8px; }
.myth .fixtxt { display: none; margin-top: 8px; background: var(--ok-soft); border-radius: 8px; padding: 8px 12px; }
.myth.rev .fixtxt, .tutor .myth .fixtxt, .showall .myth .fixtxt { display: block; }
.myth.rev .tf button.bad { border-color: var(--bad); background: var(--bad-soft); }
.myth.rev .tf button.good { border-color: var(--ok); background: var(--ok-soft); }
.vlink { font: .8em var(--f-mono); color: var(--warn); }
.thumbrow { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
.thumbrow img { width: 120px; aspect-ratio: 16/10; object-fit: cover; border-radius: 6px; border: 1px solid var(--rule); cursor: zoom-in; }

/* section intro */
.objs { margin: 0 0 16px; padding-left: 1.2em; display: grid; gap: 4px; }
.meta { font: .82em var(--f-mono); color: var(--ink2); margin: -4px 0 14px; }
.tutor-only { display: none; }
.tutor .tutor-only { display: block; }
.disc { font-size: .78em; color: var(--ink2); margin-top: 16px; }
@media print { .pager, .bar { display: none !important; } }

/* lecture figures: first one large, the rest as thumbnails that swap in */
.figs .fig.main img { max-height: 46vh; }
.thumbs { display: flex; flex-wrap: wrap; gap: 6px; }
.thumbs img { width: 92px; height: 60px; object-fit: cover; border-radius: 6px; border: 1.5px solid var(--rule); cursor: pointer; background: #fff; }
.thumbs img.cur { border-color: var(--art); }
.views .figs .fig img { max-height: 58vh; }
.views.side .vw-cad .fig + .fig, .views.side .vw-cmp .fig + .fig { margin-top: 4px; }
/* ---------- connection flowcharts ---------- */
:root {
  --fk-a: #c0392b; --fk-a-bg: #fdecea;  --fk-v: #2f6db5; --fk-v-bg: #e8f0fb;
  --fk-n: #b58900; --fk-n-bg: #fff6d1;  --fk-g: #b58900; --fk-g-bg: #ffe79a;
  --fk-l: #2e8b57; --fk-l-bg: #e4f4ea;  --fk-s: #5b4bb7; --fk-s-bg: #ece9fb;
  --fk-t: #7a8190; --fk-t-bg: #f4f5f7;  --fk-o: #8a6a2f; --fk-o-bg: #fbf5e8;
  --fk-c: #4f6d8c; --fk-c-bg: #eaf0f6;  --fk-r: #0e8a7e; --fk-r-bg: #e0f5f2;
  --fk-ink: #1d2330; --fk-note: #5b6475;
}
:root[data-theme="dark"] {
  --fk-a: #ef6f61; --fk-a-bg: #3a1916;  --fk-v: #6aa3ef; --fk-v-bg: #142640;
  --fk-n: #e3b93a; --fk-n-bg: #332a0c;  --fk-g: #e3b93a; --fk-g-bg: #4a3b0a;
  --fk-l: #5cc48a; --fk-l-bg: #12301f;  --fk-s: #a597f0; --fk-s-bg: #241f45;
  --fk-t: #9aa2b1; --fk-t-bg: #1e232e;  --fk-o: #d0a764; --fk-o-bg: #2c2414;
  --fk-c: #8fb0d1; --fk-c-bg: #18222e;  --fk-r: #4fd1c1; --fk-r-bg: #0f2d2a;
  --fk-ink: #e5e8ef; --fk-note: #a3abbc;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {

<script>
window.MODE="tutor";window.ANAT={"meta": {"title": "RS I Anatomy 101", "deck": "rs", "badge": "Peer tutoring", "sub": "Nose, pharynx, larynx, thoracic wall & lungs · cadaver ↔ lecture", "lede": "The three gross-anatomy lectures of RS I as concept cards, cadaver steps (real specimen beside the lecture diagram), the RS I tidbits board, and every usable past RS spot test (AC76-AC81) with keys.", "disc": "Cadaver photographs: Rohen, Yokochi & Lütjen-Drecoll, Anatomy: A Photographic Atlas 8e (© Schattauer / Wolters Kluwer). Past spot tests and MCQ recalls: MDCU peer-support teams (AC79 spot II and the MCQ items as edited in the ns- and rs-peer-tutoring decks). RS I tidbits board: class summary. Lecture figures: 2026 NS I / RS I handouts, Faculty of Medicine, Chulalongkorn University. For use inside the class only."}, "sections": [{"id": "U", "course": "RS I", "short": "Nose & sinuses", "title": "External nose, nasal cavity & paranasal sinuses", "lect": "Asst. Prof. Thanasil Huanmanop, M.D., M.Sc.", "date": "26 Oct 2026", "handout": "rs1_urt_slide", "hname": "691026 Upper respiratory tract", "blurb": "Walls of the nasal cavity, the three conchae and meatuses, where every sinus and the nasolacrimal duct opens, the arteries behind a nosebleed and the nerves of the nose.", "obj": ["Describe the bony and cartilaginous parts of the external nose", "Name the bones that form the roof, floor, medial and lateral walls of the nasal cavity", "State the opening of each paranasal sinus and the nasolacrimal duct", "Name the arteries of Kiesselbach area and the nerves of the nasal cavity", "Relate fractures, sinusitis, epistaxis and transsphenoidal surgery to the anatomy"], "items": [{"t": "c", "id": "U-C1", "title": "External nose and walls of the nasal cavity", "core": true, "figs": [{"src": "img/h/rs1_urt_slide_007.jpg", "cap": "Handout p.7 · 691026 Upper respiratory tract"}, {"src": "img/h/rs1_urt_slide_004.jpg", "cap": "Handout p.4 · 691026 Upper respiratory tract"}, {"src": "img/h/rs1_urt_slide_008.jpg", "cap": "Handout p.8 · 691026 Upper respiratory tract"}, {"src": "img/t/p2_004.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p1_009.jpg", "cap": "RS I tidbits board (peer summary)"}], "body": "<ul class=\"lt-pts\"><li>External nose: bony part (nasal bones, frontal process of maxilla) + cartilages (lateral process of septal, major alar, septal cartilage)</li></ul><div class=\"tblwrap\"><table class=\"lt-tbl\"><thead><tr><th>Wall</th><th>Made of</th></tr></thead><tbody><tr><td>Roof</td><td>nasal, frontal, <span class=\"cz\">cribriform plate of ethmoid</span>, sphenoid - olfactory epithelium</td></tr><tr><td>Floor</td><td><span class=\"cz\">hard palate</span> (palatine process of maxilla + horizontal plate of palatine)</td></tr><tr><td>Medial (septum)</td><td><span class=\"cz\">perpendicular plate of ethmoid</span> + <span class=\"cz\">vomer</span> + septal cartilage</td></tr><tr><td>Lateral</td><td>superior + middle conchae (ethmoid), inferior concha (own bone), maxilla</td></tr></tbody></table></div><ul class=\"lt-pts\"><li>Anterior: nostrils (anterior nares) <span class=\"lt-ar\">→</span> vestibule with vibrissae; posterior: <span class=\"cz\">choanae</span> <span class=\"lt-ar\">→</span> nasopharynx</li></ul><p class=\"lt-trap\">Cribriform plate fracture <span class=\"lt-ar\">→</span> anosmia + CSF rhinorrhoea</p>", "th": "จมูกภายนอกมีส่วนกระดูก (nasal bone, frontal process ของ maxilla) และส่วนกระดูกอ่อน. โพรงจมูก: หลังคา = nasal, frontal, cribriform plate ของ ethmoid, sphenoid (มี olfactory epithelium); พื้น = hard palate (maxilla + palatine); ผนังด้านใน = nasal septum (perpendicular plate ของ ethmoid + vomer + septal cartilage); ผนังด้านข้างมี conchae 3 อัน. ด้านหน้าเปิดที่ nostril ด้านหลังเปิดที่ choana สู่ nasopharynx. cribriform plate แตก → ไม่ได้กลิ่นและ CSF ไหลออกจมูก", "tn": ["Posttest #1: medial wall ของ nasal cavity = nasal septum", "Survival guide (tidbits): URT — อาจารย์ออกตรงกับ AC ให้ทำข้อสอบเก่า"], "say": "The septum is ethmoid plus vomer plus cartilage; the roof is the cribriform plate.", "say_th": "Septum = ethmoid + vomer + กระดูกอ่อน; หลังคาคือ cribriform plate"}, {"t": "c", "id": "U-C2", "title": "Conchae, meatuses and what opens where", "core": true, "figs": [{"src": "img/h/rs1_urt_slide_013.jpg", "cap": "Handout p.13 · 691026 Upper respiratory tract"}, {"src": "img/t/p1_006.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p1_003.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p1_013.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/h/rs1_urt_slide_009.jpg", "cap": "Handout p.9 · 691026 Upper respiratory tract"}], "body": "<ul class=\"lt-pts\"><li>Superior + middle conchae belong to the <span class=\"cz\">ethmoid</span>; inferior concha is a separate bone; each meatus lies UNDER its concha</li></ul><div class=\"tblwrap\"><table class=\"lt-tbl\"><thead><tr><th>Opening</th><th>Drains</th></tr></thead><tbody><tr><td><span class=\"cz\">Spheno-ethmoidal recess</span></td><td>sphenoidal sinus</td></tr><tr><td>Superior meatus</td><td>posterior ethmoidal cells</td></tr><tr><td>Middle meatus - ethmoidal bulla</td><td>middle ethmoidal cells</td></tr><tr><td>Middle meatus - <span class=\"cz\">hiatus semilunaris</span></td><td>frontal sinus (via frontonasal duct / infundibulum), anterior ethmoidal cells, <span class=\"cz\">maxillary sinus</span></td></tr><tr><td><span class=\"cz\">Inferior meatus</span></td><td><span class=\"cz\">nasolacrimal duct</span> only</td></tr></tbody></table></div><p class=\"lt-trap\">Maxillary ostium is high on its medial wall <span class=\"lt-ar\">→</span> poor drainage <span class=\"lt-ar\">→</span> commonest site of sinusitis</p>", "th": "Superior และ middle concha เป็นส่วนของ ethmoid ส่วน inferior concha เป็นกระดูกแยก. meatus อยู่ใต้ concha ชื่อเดียวกัน: spheno-ethmoidal recess รับ sphenoid sinus; superior meatus รับ posterior ethmoidal cells; middle meatus มี ethmoidal bulla (middle ethmoidal cells) และ hiatus semilunaris (frontal sinus, anterior ethmoidal cells, maxillary sinus); inferior meatus รับ nasolacrimal duct อย่างเดียว. รูเปิด maxillary sinus อยู่สูง ระบายยาก จึงอักเสบบ่อยที่สุด", "tn": ["ข้อสอบ: AC76 #1-2, AC79 #1-2, AC80 #3-4, AC81 #1 — hiatus semilunaris, nasolacrimal duct, sphenoid sinus ออกทุกปี", "AC79 #2: ใต้ inferior concha มี sinus ใดเปิด → None of the above (มีแค่ nasolacrimal duct ซึ่งไม่ใช่ sinus)", "Posttest #2: spheno-ethmoidal recess รับ sphenoidal sinus"], "say": "Frontal, anterior ethmoid and maxillary all drain into the hiatus semilunaris; only the nasolacrimal duct uses the inferior meatus.", "say_th": "Frontal, anterior ethmoid และ maxillary เปิดที่ hiatus semilunaris; inferior meatus มีแค่ nasolacrimal duct", "flows": [{"id": "sinus-drain", "title": "Where each sinus and duct opens", "svg": "<svg class=\"flowsvg\" viewBox=\"-2 -2 558 313\" width=\"558\" height=\"313\" style=\"max-width:614px\" role=\"img\" aria-label=\"Where each sinus and duct opens\" data-flow=\"sinus-drain\"><g class=\"fedges\"><g class=\"fe k-n\" data-a=\"hs\" data-b=\"mm\"><path class=\"fl\" d=\"M377.2,60.5 H396.2 V78.0 H408.2\"/><path class=\"fa\" d=\"M414.2,78.0 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"Frontal sinus\" data-b=\"hs\"><path class=\"fl\" d=\"M167.0,19.8 H227.6 V60.5 H239.6\"/><path class=\"fa\" d=\"M245.6,60.5 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"Anterior ethmoidal cells\" data-b=\"hs\"><path class=\"fl\" d=\"M167.0,60.5 H239.6\"/><path class=\"fa\" d=\"M245.6,60.5 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"Maxillary sinus\" data-b=\"hs\"><path class=\"fl\" d=\"M167.0,101.2 H227.6 V60.5 H239.6\"/><path class=\"fa\" d=\"M245.6,60.5 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"Ethmoidal bulla\" data-b=\"mm\"><path class=\"fl\" d=\"M377.2,142.0 H396.2 V78.0 H408.2\"/><path class=\"fa\" d=\"M414.2,78.0 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"Middle ethmoidal cells\" data-b=\"Ethmoidal bull ass=\"lt-ar\">→</span> sinusitis</li></ul>", "th": "โพรงอากาศข้างจมูกอยู่ใน frontal, ethmoid, sphenoid และ maxilla บุด้วย respiratory epithelium ช่วยก้องเสียง ปรับอุณหภูมิ ลดน้ำหนักกะโหลก. Maxillary sinus ใหญ่ที่สุด หลังคาคือพื้นของ orbit. Sphenoid sinus อยู่ใต้ hypophysial fossa จึงใช้เป็นทางผ่าตัดต่อมใต้สมองผ่านจมูก (transsphenoidal)", "tn": ["ถามความสัมพันธ์: หลังคา maxillary sinus = พื้น orbit, รากฟันกรามบนใกล้พื้น sinus", "Posttest #3: roof of maxillary sinus = floor of orbit", "AC76 #3: coronal CT maxillary sinus + middle concha"], "say": "The maxillary sinus roof is the orbital floor; the sphenoid sinus is the doorway to the pituitary.", "say_th": "หลังคาของ maxillary sinus คือพื้นของ orbit; sphenoid sinus คือประตูไปต่อมใต้สมอง", "flows": [{"id": "sinus-drain", "title": "Where each sinus and duct opens", "svg": "<svg class=\"flowsvg\" viewBox=\"-2 -2 558 313\" width=\"558\" height=\"313\" style=\"max-width:614px\" role=\"img\" aria-label=\"Where each sinus and duct opens\" data-flow=\"sinus-drain\"><g class=\"fedges\"><g class=\"fe k-n\" data-a=\"hs\" data-b=\"mm\"><path class=\"fl\" d=\"M377.2,60.5 H396.2 V78.0 H408.2\"/><path class=\"fa\" d=\"M414.2,78.0 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"Frontal sinus\" data-b=\"hs\"><path class=\"fl\" d=\"M167.0,19.8 H227.6 V60.5 H239.6\"/><path class=\"fa\" d=\"M245.6,60.5 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"Anterior ethmoidal cells\" data-b=\"hs\"><path class=\"fl\" d=\"M167.0,60.5 H239.6\"/><path class=\"fa\" d=\"M245.6,60.5 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"Maxillary sinus\" data-b=\"hs\"><path class=\"fl\" d=\"M167.0,101.2 H227.6 V60.5 H239.6\"/><path class=\"fa\" d=\"M245.6,60.5 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"Ethmoidal bulla\" data-b=\"mm\"><path class=\"fl\" d=\"M377.2,142.0 H396.2 V78.0 H408.2\"/><path class=\"fa\" d=\"M414.2,78.0 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"Middle ethmoidal cells\" data-b=\"Ethmoidal bulla\"><path clas in the middle meatus, under the ethmoidal bulla (middle concha lifted away). It receives frontal sinus, anterior ethmoidal cells and maxillary sinus.", "o": ["Hiatus semicircularis", "Hiatus semilunaris", "Opening to middle ethmoidal air cells", "Opening to posterior ethmoidal air cells"], "a": 1}, {"q": "Identify this structure B.", "ex": "Air space in the body of the sphenoid, behind-above the nasal cavity and under the sella turcica; drains to the sphenoethmoidal recess.", "o": ["Ethmoidal sinus", "Maxillary sinus", "Frontal sinus", "Sphenoid sinus"], "a": 3}]}, {"t": "p", "id": "R79-02", "set": "AC79 RS I", "src": "pp_ac79_rs", "img": "img/pp/pp_ac79_rs_004.jpg", "mcq": false, "qs": [{"q": "Identify this structure A.", "ex": "Lowest and longest concha on the lateral wall (a separate bone).", "o": ["Nasal vestibule", "Ethmoidal bullae", "Middle nasal concha", "Inferior nasal concha"], "a": 3}, {"q": "Which structure opens below structure A?", "ex": "Only the nasolacrimal duct opens in the inferior meatus; no sinus does.", "o": ["Middle ethmoidal air cells", "Anterior ethmoidal air cells", "Frontal sinus", "None of the above"], "a": 3}]}, {"t": "p", "id": "R80-03", "set": "AC80 RS I", "src": "pp_ac80_rs_key", "img": "img/pp/pp_ac80_rs_key_003.jpg", "mcq": false, "qs": [{"q": "Identify structure A.", "ex": "Groove in the middle meatus (concha removed).", "o": ["Hiatus semilunaris", "Ethmoidal bulla", "Sphenoidal sinus", "Nasolacrimal duct"], "a": 0}]}, {"t": "p", "id": "R80-04", "set": "AC80 RS I", "src": "pp_ac80_rs_key", "img": "img/pp/pp_ac80_rs_key_004.jpg", "mcq": false, "qs": [{"q": "Identify structure A (red tube).", "ex": "Probe in the inferior meatus under the inferior concha: nasolacrimal duct (tears drain to the nose).", "o": ["Nasolacrimal duct", "Frontonasal duct", "Maxillary ostium", "Ethmoidal air cells"], "a": 0}]}, {"t": "p", "id": "R80-06", "set": "AC80 RS I", "src": "pp_ac80_rs_key", "img": "img/pp/pp_ac80_rs_key_006.jpg", "mcq": false, "qs": [{"q": "Identify structure A.", "ex": "Sinus in the sphenoid body below the sella; opens into the sphenoethmoidal recess.", "o": ["Sphenoid sinus", "Maxillary sinus", "Frontal sinus", "Ethmoidal sinus"], "a": 0}]}, {"t": "p", "id": "R81-01", "set": "AC81 RS I", "src": "pp_ac81_rs", "img": "img/pp/pp_ac81_rs_002.jpg", "mcq": false, "qs": [{"q": "Identify structure A.", "ex": "Curved slit in the middle meatus below the ethmoidal bulla.", "o": ["Superior nasal concha", "Inferior nasal concha", "Hiatus semilunaris", "Ethmoidal bulla"], "a": 2}, {"q": "Which paranasal sinus opens at B (upper-front end of the groove)?", "ex": "The front-upper end of the hiatus semilunaris (ethmoidal infundibulum) receives the frontonasal duct.", "o": ["Frontal sinus", "Ethmoid sinus", "Maxillary sinus", "Sphenoid sinus"], "a": 0}]}, {"t": "p", "id": "M-U3", "set": "AC80 MCQ", "src": "mcq:rs-peer-tutoring", "img": null, "mcq": true, "qs": [{"q": "The source of pus seen at the inferior nasal meatus is from which structure?", "ex": "Only the nasolacrimal duct opens into the inferior meatus. The frontal, maxillary and anterior ethmoid sinuses drain into the middle meatus; the sphenoid sinus drains into the sphenoethmoidal recess.", "o": ["Frontal sinus", "Sphenoid sinus", "Maxillary sinus", "Ethmoid sinus", "Nasolacrimal duct"], "a": 4}]}, {"t": "p", "id": "M-U5", "set": "AC81 MCQ", "src": "mcq:rs-peer-tutoring", "img": null, "mcq": true, "qs": [{"q": "The patient has been diagnosed with pus in the sphenoethmoidal recess. Which paranasal sinus is most likely to be infected?", "ex": "The sphenoethmoidal recess, above the superior concha, receives the sphenoid sinus. Posterior ethmoidal cells open into the superior meatus; frontal, maxillary and anterior ethmoid into the middle meatus.", "o": ["Frontal sinus", "Maxillary sinus", "Sphenoid sinus", "Anterior ethmoid", "Posterior ethmoid"], "a": 2}]}]}, {"id": "L", "course": "RS I", "short": "Pharynx & larynx", "title": "Pharynx, larynx & trachea", "lect": "Asst. Prof. Thanasil Huanmanop, M.D., M.Sc.", "date": "26 Oct 2026", "handout": "rs1_urt_slide", "hname": "691026 Upper respiratory tract", "blurb": "The walls of the three parts of the pharynx and Waldeyer ring, then the larynx: nine cartilages, membranes, folds, the three functional groups of intrinsic muscles and their nerves, and the trachea down to the carina.", "obj": ["Describe the walls of the naso-, oro- and laryngopharynx and the tonsillar ring", "Name the 9 laryngeal cartilages, the membranes and ligaments between them", "Describe the laryngeal cavity: vestibular and vocal folds, ventricle, rima glottidis", "Group the intrinsic laryngeal muscles by function and name their nerves", "Explain thyroidectomy nerve injuries, cricothyroidotomy, tracheostomy and foreign-body aspiration", "Describe the trachea and the carina"], "items": [{"t": "c", "id": "L-C1", "title": "Nasopharynx and Waldeyer ring", "core": true, "figs": [{"src": "img/t/p1_068.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/h/rs1_urt_slide_019.jpg", "cap": "Handout p.19 · 691026 Upper respiratory tract"}, {"src": "img/h/rs1_urt_slide_023.jpg", "cap": "Handout p.23 · 691026 Upper respiratory tract"}, {"src": "img/h/rs1_urt_slide_024.jpg", "cap": "Handout p.24 · 691026 Upper respiratory tract"}], "body": "<div class=\"tblwrap\"><table class=\"lt-tbl\"><thead><tr><th>Wall</th><th>Nasopharynx</th></tr></thead><tbody><tr><td>Anterior</td><td><span class=\"cz\">choanae</span></td></tr><tr><td>Posterior</td><td><span class=\"cz\">pharyngeal tonsil</span> (adenoid)</td></tr><tr><td>Superior</td><td>sphenoid sinus</td></tr><tr><td>Inferior</td><td>soft palate + uvula, pharyngeal isthmus</td></tr><tr><td>Lateral</td><td>opening of the <span class=\"cz\">auditory tube</span>, <span class=\"cz\">torus tubarius</span> (tubal tonsil), salpingopharyngeal fold, <span class=\"cz\">pharyngeal recess (Rosenmüller)</span></td></tr></tbody></table></div><ul class=\"lt-pts\"><li>Waldeyer ring: pharyngeal (adenoid) + tubal + palatine + lingual tonsils</li></ul><p class=\"lt-trap\">NPC (EBV) starts in the pharyngeal recess; enlarged adenoids block the auditory tube <span class=\"lt-ar\">→</span> otitis media, mouth breathing (children)</p>", "th": "Nasopharynx: ด้านหน้าคือ choana ด้านหลังมี pharyngeal tonsil (adenoid) ด้านบนคือ sphenoid sinus ด้านล่างคือ soft palate ด้านข้างมีรูเปิดของ auditory tube ล้อมด้วย torus tubarius (มี tubal tonsil) มี salpingopharyngeal fold ลงมา และหลัง torus คือ pharyngeal recess (fossa of Rosenmüller) ซึ่งเป็นจุดเกิดมะเร็งหลังโพรงจมูก (NPC, EBV). Waldeyer ring ประกอบด้วย pharyngeal, tubal, palatine และ lingual tonsils", "tn": ["AC76/AC79/AC81 spot ถาม torus tubarius และ pharyngeal recess ทุกปี", "AC76 #4, AC77 #2, AC79 #3, AC81 #2: torus tubarius, auditory tube opening, pharyngeal recess, salpingopharyngeus", "Posttest #4: adenoid = pharyngeal tonsil"], "say": "Behind the torus tubarius is the pharyngeal recess, the classic site of nasopharyngeal cancer.", "say_th": "หลัง torus tubarius คือ pharyngeal recess จุดเกิดมะเร็งหลังโพรงจมูก", "flows": [{"id": "pharynx-n", "title": "Pharyngeal plexus and the palate muscles", "svg": "<svg class=\"flowsvg\" viewBox=\"-2 -2 568 261\" width=\"568\" height=\"261\" style=\"max-width:625px\" role=\"img\" aria-label=\"Pharyngeal plexus and the palate muscles\" data-flow=\"pharynx-n\"><g class=\"fedges\"><g class=\"fe k-n\" data-a=\"Vagus n. (X)\" data-b=\"pp\"><path class=\"fl\" d=\"M89.3,73.0 H197.7\"/><path class=\"fa\" d=\"M203.7,73.0 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"pp\" data-b=\"Superior, middle, inferior constrictors\"><path class=\"fl\" d=\"M341.0,73.0 H360.0 V22.0 H387.1\"/><path class=\"fa\" d=\"M393.1,22.0 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"pp\" data-b=\"Palatopharyngeus + salpingopharyngeus\"><path class=\"fl\" d=\"M341.0,73.0 H387.1\"/><path class=\"fa\" d=\"M393.1,73.0 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"pp\" data-b=\"Levator veli palatini, uvulae, palatoglossus\"><path class=\"fl\" d=\"M341.0,73.0 H360.0 V124.0 H387.1\"/><path class=\"fa\" d=\"M393.1,124.0 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"Glossopharyngeal n. (IX)\" data-b=\"pp\"><path class=\"fl\" d=\"M166.7,179.8 H185.7 V73.0 H197.7\"/><path class=\"fa\" d=\"M203.7,73.0 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"Glossopharyngeal n. (IX)\" data-b=\"Stylopharyngeus\"><path class=\"fl\" d=\"M166.7,179.8 H197.7\"/><path class=\"fa\" d=\"M203.7,179.8 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"Mandibular n. (V3)\" data-b=\"Tensor veli palatini\"><path class=\"fl\" d=\"M127.9,233.2 H197.7\"/><path class=\"fa\" d=\"M203.7,233.2 l-7,-3.6 v7.2 z\"/></g></g><g class=\"fnodes\"><g class=\"fn k-n key root\" data-n=\"Vagus n. (X)\" data-note=\"motor\" data-name=\"Vagus n. (X)\" tabindex=\"0\"><rect x=\"0.0\" y=\"53.2\" width=\"89.3\" height=\"39.5\" rx=\"6.0\"/><text class=\"nm\" x=\"9.0\" y=\"69.8\">Vagus n. (X)</text><text class=\"nt\" x=\"9.0\" y=\"83.8\">motor</text></g><g class=\"fn k-n key\" data-n=\"pp\" data-note=\"on the middle constrictor\" data-name=\"Pharyngeal plexus\" tabindex=\"0\"><rect x=\"204.7\" y=\"53.2\" width=\"136.2\" height=\"39.5\" rx=\"6.0\"/><text class=\"nm\" x=\"213.7\" y=\"69.8\">Pharyngeal plexus</text><text class=\"nt\" x=\"213.7\" y=\"83.8\">on the middle constrictor</text></g><g class=\"fn k-t\" data-n=\"Superior, middle, inferior constrictors\" data-note=\"\" data-name=\"Superior, middle, inferior constrictors\" tabindex=\"0\"><rect x=\"394.1\" y=\"0.0\" width=\"165.8\" height=\"44.0\" rx=\"6.0\"/><text class=\"nm\" x=\"403.1\" y=\"16.5\">Superior, middle, inferior</text><text class=\"nm\" x=\"403.1\" y=\"32.5\">constrictors</text></g><g class=\"fn k-t\" data-n=\"Palatopharyngeus + salpingopharyngeus\" data-note=\"\" data-name=\"Palatopharyngeus + salpingopharyngeus\" tabindex=\"0\"><rect x=\"394.1\" y=\"51.0\" width=\"138.0\" height=\"44.0\" rx=\"6.0\"/><text class=\"nm\" x=\"40 haryngeal plexus. ข้อยกเว้นที่ออกสอบ: stylopharyngeus = IX, tensor veli palatini = V3. IX ให้ความรู้สึกของคอหอย (gag reflex ขาเข้า)"}]}, {"t": "c", "id": "L-C2", "title": "Oro- and laryngopharynx, pharyngeal muscles", "core": false, "figs": [{"src": "img/t/p1_069.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p1_070.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/h/rs1_urt_slide_022.jpg", "cap": "Handout p.22 · 691026 Upper respiratory tract"}, {"src": "img/t/p2_018.jpg", "cap": "RS I tidbits board (peer summary)"}], "body": "<ul class=\"lt-pts\"><li>Oropharynx: anterior = oropharyngeal isthmus + lingual tonsil · lateral = <span class=\"cz\">palatine tonsil</span> between palatoglossal and palatopharyngeal arches · inferior = epiglottis</li><li>Laryngopharynx: anterior = laryngeal inlet + <span class=\"cz\">piriform recess</span> on each side · inferior = oesophagus</li><li>Muscles: outer circular (superior, middle, inferior <span class=\"cz\">constrictors</span>) + inner longitudinal (stylo-, palato-, salpingopharyngeus); CN IX, X</li></ul><p class=\"lt-trap\">Foreign bodies lodge at the base of tongue, palatine tonsil crypts and the <span class=\"cz\">piriform fossa</span></p>", "th": "Oropharynx: ด้านหน้าเปิดสู่ช่องปาก มี lingual tonsil ที่โคนลิ้น ด้านข้างมี palatine tonsil อยู่ระหว่าง palatoglossal และ palatopharyngeal arch. Laryngopharynx: ด้านหน้ามีทางเข้ากล่องเสียงและ piriform recess สองข้าง ด้านล่างต่อหลอดอาหาร. กล้ามเนื้อคอหอยชั้นนอกเป็นวง (constrictors 3 มัด) ชั้นในตามยาว เลี้ยงโดย IX, X. สิ่งแปลกปลอมมักติดที่โคนลิ้น ทอนซิล และ piriform recess", "tn": ["ชี้ piriform recess แล้วถามว่าก้างปลาติดตรงไหน", "AC77 #3: piriform recess (green arrow)", "Posttest #5: outer circular layer = superior, middle, inferior constrictors"], "say": "Piriform recesses flank the laryngeal inlet; that is where fish bones stick.", "say_th": "Piriform recess อยู่สองข้างของทางเข้ากล่องเสียง — ก้างปลาติดตรงนี้", "flows": [{"id": "pharynx-n", "title": "Pharyngeal plexus and the palate muscles", "svg": "<svg class=\"flowsvg\" viewBox=\"-2 -2 568 261\" width=\"568\" height=\"261\" style=\"max-width:625px\" role=\"img\" aria-label=\"Pharyngeal plexus and the palate muscles\" data-flow=\"pharynx-n\"><g class=\"fedges\"><g class=\"fe k-n\" data-a=\"Vagus n. (X)\" data-b=\"pp\"><path class=\"fl\" d=\"M89.3,73.0 H197.7\"/><path class=\"fa\" d=\"M203.7,73.0 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"pp\" data-b=\"Superior, middle, inferior constrictors\"><path class=\"fl\" d=\"M341.0,73.0 H360.0 V22.0 H387.1\"/><path class=\"fa\" d=\"M393.1,22.0 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"pp\" data-b=\"Palatopharyngeus + salpingopharyngeus\"><path class=\"fl\" d=\"M341.0,73.0 H387.1\"/><path class=\"fa\" d=\"M393.1,73.0 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"pp\" data-b=\"Levator veli palatini, uvulae, palatoglossus\"><path class=\"fl\" d=\"M341.0,73.0 H360.0 V124.0 H387.1\"/><path class=\"fa\" d=\"M393.1,124.0 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"Glossopharyngeal n. (IX)\" data-b=\"pp\"><path class=\"fl\" d=\"M166.7,179.8 H185.7 V73.0 H197.7\"/><path class=\"fa\" d=\"M203.7,73.0 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"Glossopharyngeal n. (IX)\" data-b=\"Stylopharyngeus\"><path class=\"fl\" d=\"M166.7,179.8 H197.7\"/><path class=\"fa\" d=\"M203.7,179.8 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"Mandibular n. (V3)\" data-b=\"Tensor veli palatini\"><path class=\"fl\" d=\"M127.9,233.2 H197.7\"/><path class=\"fa\" d=\"M203.7,233.2 l-7,-3.6 v7.2 z\"/></g></g><g class=\"fnodes\"><g class=\"fn k-n key root\" data-n=\"Vagus n. (X)\" data-note=\"motor\" data-name=\"Vagus n. (X)\" tabindex=\"0\"><rect x=\"0.0\" y=\"53.2\" width=\"89.3\" height=\"39.5\" rx=\"6.0\"/><text class=\"nm\" x=\"9.0\" y=\"69.8\">Vagus n. (X)</text><text class=\"nt\" x=\"9.0\" y=\"83.8\">motor</text></g><g class=\"fn k-n key\" data-n=\"pp\" data-note=\"on the middle constrictor\" data-name=\"Pharyngeal plexus\" tabindex=\"0\"><rect x=\"204.7\" y=\"53.2\" width=\"136.2\" height=\"39.5\" rx=\"6.0\"/><text class=\"nm\" x=\"213.7\" y=\"69.8\">Pharyngeal plexus</text><text class=\"nt\" x=\"213.7\" y=\"83.8\">on the middle constrictor</text></g><g class=\"fn k-t\" data-n=\"Superior, middle, inferior constrictors\" data-note=\"\" data-name=\"Superior, middle, inferior constrictors\" tabindex=\"0\"><rect x=\"394.1\" y=\"0.0\" width=\"165.8\" height=\"44.0\" rx=\"6.0\"/><text class=\"nm\" x=\"403.1\" y=\"16.5\">Superior, middle, inferior</text><text class=\"nm\" x=\"403.1\" y=\"32.5\">constrictors</text></g><g class=\"fn k-t\" data-n=\"Palatopharyngeus + salpingopharyngeus\" data-note=\"\" data-name=\"Palatopharyngeus + salpingopharyngeus\" tabindex=\"0\"><rect x=\"394.1\" y=\"51.0\" width=\"138.0\" height=\"44.0\" rx=\"6.0\"/><text class=\"nm\" x=\"403.1\" y=\"67.5\">Palatopharyngeus +</text><text class=\"nm\" x=\"403.1\" y=\"83.5\">salpingopharyngeus</text></g><g class=\"fn k-t\" data-n=\"Levator veli palatini, uvulae, palatoglossus\" data-note=\"\" data-name=\"Levator veli palatini, uvulae, palatoglossus\" tabindex=\"0\"><rect x=\"394.1\" y=\"102.0\" width=\"146.8\" height=\"44.0\" rx=\"6.0\"/><text class=\"nm\" x=\"403.1\" y=\"118.5\">Levator veli palatini,</text><text class=\"nm\" x=\"403.1\" y=\"134.5\">uvulae, palatoglossus</text></g><g class=\"fn k-n key root\" data-n=\"Glossopharyngeal n. (IX)\" data-note=\"sensory to the pharynx\" data-name=\"Glossopharyngeal n. (IX)\" tabindex=\"0\"><rect x=\"0.0\" y=\"160.0\" width=\"166.7\" height=\"39.5\" rx=\"6.0\"/><text class=\"nm\" x=\"9.0\" y=\"176.5\">Glossopharyngeal n. (IX)</text><text class=\"nt\" x=\"9.0\" y=\"190.5\">sensory to the pharynx</text></g><g class=\"fn k-t key\" data-n=\"Stylopharyngeus\" data-note=\"the only muscle of IX\" data-name=\"Stylopharyngeus\" tabindex=\"0\"><rect x=\"204.7\" y=\"160.0\" width=\"119.5\" height=\"39.5\" rx=\"6.0\"/><text class=\"nm\" x=\"213.7\" y=\"176.5\">Stylopharyngeus</text><text class=\"nt\" x=\"213.7\" y=\"190.5\">the only muscle of IX</text></g><g class=\"fn k-n root\" data-n=\"Mandibular n. (V3)\" data-note=\"\" data-name=\"Mandibular n. (V3)\" tabindex=\"0\"><rect x=\"0.0\" y=\"219.2\" width=\"127.9\" height=\"28.0\" rx=\"6.0\"/><text class=\"nm\" x=\"9.0\" y=\"235.8\">Mandibular n. (V3)</text></g><g class=\"fn k-t key\" data-n=\"Tensor veli palatini\" data-note=\"the only palate muscle not X\" data-name=\"Tensor veli palatini\" tabindex=\"0\"><rect x=\"204.7\" y=\"213.5\" width=\"151.4\" height=\"39.5\" rx=\"6.0\"/><text class=\"nm\" x=\"213.7\" y=\"230.0\">Tensor veli palatini</text><text class=\"nt\" x=\"213.7\" y=\"244.0\">the only palate muscle not X</text></g></g></svg>", "legend": ["n", "t"], "how": "", "w": 564, "h": 257, "links": false, "th": "กล้ามเนื้อคอหอยและเพดานอ่อนเกือบทั้งหมดเลี้ยงโดย X ผ่าน pharyngeal plexus. ข้อยกเว้นที่ออกสอบ: stylopharyngeus = IX, tensor veli palatini = V3. IX ให้ความรู้สึกของคอหอย (gag reflex ขาเข้า)"}]}, {"t": "c", "id": "L-C3", "title": "Laryngeal skeleton: 9 cartilages", "core": true, "figs": [{"src": "img/h/rs1_urt_slide_026.jpg", "cap": "Handout p.26 · 691026 Upper respiratory tract"}, {"src": "img/h/rs1_urt_slide_027.jpg", "cap": "Handout p.27 · 691026 Upper respiratory tract"}, {"src": "img/h/rs1_urt_slide_028.jpg", "cap": "Handout p.28 · 691026 Upper respiratory tract"}, {"src": "img/h/rs1_urt_slide_030.jpg", "cap": "Handout p.30 · 691026 Upper respiratory tract"}, {"src": "img/t/p1_077.jpg", "cap": "RS I tidbits board (peer summary)"}], "body": "<ul class=\"lt-pts\"><li>Larynx at <span class=\"cz\">C3-C6</span>; air passage, prevents aspiration, makes sound</li><li>Single: <span class=\"cz\">epiglottis</span> · <span class=\"cz\">thyroid</span> (laminae, laryngeal prominence, superior/inferior horns) · <span class=\"cz\">cricoid</span> (complete ring: arch in front, lamina behind)</li><li>Paired: <span class=\"cz\">arytenoid</span> (vocal + muscular processes) · corniculate · cuneiform</li><li>Joints: <span class=\"cz\">cricothyroid</span> (tilts thyroid <span class=\"lt-ar\">→</span> tenses folds) · <span class=\"cz\">crico-arytenoid</span> (rotates/slides arytenoids <span class=\"lt-ar\">→</span> opens/closes rima)</li><li>Membranes: thyrohyoid membrane · quadrangular membrane (free lower edge = vestibular ligament) · <span class=\"cz\">conus elasticus</span> (free upper edge = vocal ligament; front = median cricothyroid ligament)</li></ul><p class=\"lt-trap\">Epiglottis, corniculate and cuneiform are ELASTIC cartilage; thyroid, cricoid and most of the arytenoid are HYALINE (and can ossify)</p>", "th": "กล่องเสียงอยู่ระดับ C3-C6 มีกระดูกอ่อน 9 ชิ้น: ชิ้นเดี่ยว 3 ชิ้น ได้แก่ epiglottis (ฝากล่องเสียง), thyroid (รูปโล่ มี laryngeal prominence), cricoid (วงแหวนสมบูรณ์ ด้านหน้าเป็น arch ด้านหลังเป็น lamina); ชิ้นคู่ 3 คู่ ได้แก่ arytenoid (คล้ายทัพพี มี vocal process และ muscular process), corniculate, cuneiform. Conus elasticus ขอบบนเป็น vocal ligament ด้านหน้าคือ median cricothyroid ligament; quadrangular membrane ขอบล่างเป็น vestibular ligament", "tn": ["สไลด์ handout p.26 วางลูกศร hyaline/elastic ไม่ตรงชื่อ — ที่ถูก: epiglottis = elastic", "AC79 #4 thyroid cartilage; AC80 #7 cricoid; AC76 #6 cricoid"], "say": "Thyroid in front, cricoid a full ring below it, arytenoids sit on the back of the cricoid lamina.", "say_th": "Thyroid อยู่หน้า cricoid เป็นวงเต็มอยู่ใต้ arytenoid นั่งบนขอบบนของ cricoid lamina ด้านหลัง"}, {"t": "c", "id": "L-C4", "title": "Inside the larynx: folds, ventricle, glottis", "core": true, "figs": [{"src": "img/h/rs1_urt_slide_031.jpg", "cap": "Handout p.31 · 691026 Upper respiratory tract"}, {"src": "img/t/p1_078.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/h/rs1_urt_slide_035.jpg", "cap": "Handout p.35 · 691026 Upper respiratory tract"}, {"src": "img/h/rs1_urt_slide_032.jpg", "cap": "Handout p.32 · 691026 Upper respiratory tract"}, {"src": "img/t/p1_024.jpg", "cap": "RS I tidbits board (peer summary)"}], "body": "<p class=\"lt-chain\">Laryngeal inlet <span class=\"lt-ar\">→</span> <span class=\"cz\">vestibule</span> <span class=\"lt-ar\">→</span> vestibular folds (rima vestibuli) <span class=\"lt-ar\">→</span> <span class=\"cz\">ventricle</span> <span class=\"lt-ar\">→</span> vocal folds (rima glottidis) <span class=\"lt-ar\">→</span> <span class=\"cz\">infraglottic cavity</span> <span class=\"lt-ar\">→</span> trachea</p><ul class=\"lt-pts\"><li><span class=\"cz\">Vestibular folds</span> (false cords): vestibular ligament under mucosa; prevent aspiration</li><li><span class=\"cz\">Vocal folds</span> (true cords): vocal ligament + <span class=\"cz\">vocalis</span> muscle; stratified squamous epithelium; sound</li></ul><div class=\"eqn\">Glottis = vocal folds + rima glottidis</div><ul class=\"lt-pts\"><li>Glottic region has almost no lymphatic drainage <span class=\"lt-ar\">→</span> glottic cancer spreads late; supraglottic <span class=\"lt-ar\">→</span> upper deep cervical nodes, subglottic <span class=\"lt-ar\">→</span> pre/paratracheal nodes</li></ul><p class=\"lt-trap\">Cricothyroidotomy goes through the median cricothyroid ligament into the subglottis</p>", "th": "ภายในกล่องเสียงเรียงจากบนลงล่าง: vestibule → vestibular fold (สายเสียงปลอม ช่วยกันสำลัก) → laryngeal ventricle → vocal fold (สายเสียงแท้ มี vocal ligament และ vocalis muscle บุด้วย stratified squamous epithelium) → infraglottic cavity → หลอดลม. Glottis = vocal fold + rima glottidis. บริเวณ glottis แทบไม่มีท่อน้ำเหลือง มะเร็งจึงแพร่ช้า. การเจาะ cricothyroidotomy ผ่าน median cricothyroid ligament เข้า subglottis", "tn": ["AC76 #5, #8 / AC77 #5 / AC79 #6 / AC80 #1 / AC81 #3: vocal fold, vestibular fold, ventricle, vocalis", "AC77 #4: cricothyroid membrane เจาะในภาวะฉุกเฉิน = TRUE", "Posttest #6: vocal folds"], "say": "False cords above the ventricle, true cords below it; the glottis is the true cords plus the gap between them.", "say_th": "สายเสียงปลอมอยู่เหนือ ventricle สายเสียงแท้อยู่ใต้ glottis คือสายเสียงแท้รวมช่องระหว่างมัน"}, {"t": "c", "id": "L-C5", "title": "Intrinsic laryngeal muscles by function", "core": true, "figs": [{"src": "img/h/rs1_urt_slide_037.jpg", "cap": "Handout p.37 · 691026 Upper respiratory tract"}, {"src": "img/t/p1_080.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/h/rs1_urt_slide_038.jpg", "cap": "Handout p.38 · 691026 Upper respiratory tract"}, {"src": "img/t/p1_038.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p1_039.jpg", "cap": "RS I tidbits board (peer summary)"}], "body": "<div class=\"tblwrap\"><table class=\"lt-tbl\"><thead><tr><th>Group</th><th>Muscle</th><th>Action</th></tr></thead><tbody><tr><td>Inlet</td><td>aryepiglottic + oblique arytenoid</td><td>narrow</td></tr><tr><td>Inlet</td><td>thyro-epiglottic</td><td>widen</td></tr><tr><td>Fold tension</td><td><span class=\"cz\">cricothyroid</span></td><td>tense (lengthen)</td></tr><tr><td>Fold tension</td><td>thyro-arytenoid, vocalis</td><td>relax / fine-tune</td></tr><tr><td>Rima</td><td><span class=\"cz\">posterior crico-arytenoid</span></td><td><span class=\"cz\">open</span> (abduct) - the only one</td></tr><tr><td>Rima</td><td>lateral crico-arytenoid, transverse + oblique arytenoid</td><td>close (adduct)</td></tr></tbody></table></div><ul class=\"lt-pts\"><li>Extrinsic muscles (supra- and infrahyoid) move the larynx as a whole</li></ul>", "th": "กล้ามเนื้อภายในกล่องเสียงแบ่งตามหน้าที่ 3 กลุ่ม: (1) ปรับทางเข้า: aryepiglottic/oblique arytenoid ทำให้แคบ, thyroepiglottic ทำให้กว้าง (2) ปรับความตึงสายเสียง: cricothyroid ทำให้ตึง, thyroarytenoid/vocalis ทำให้หย่อน (3) เปิด-ปิด rima glottidis: posterior cricoarytenoid เป็นมัดเดียวที่เปิด, lateral cricoarytenoid และ transverse/oblique arytenoid ปิด", "tn": ["AC76 #5, AC77 #6, AC79 #5, AC81 #3: posterior cricoarytenoid → opens rima glottidis (ออกบ่อยมาก)", "AC76 #6, AC79 #4: cricothyroid muscle ด้านหน้า", "Posttest #7: rima glottidis เปิดโดย posterior cricoarytenoid"], "say": "Only the posterior crico-arytenoid opens the airway; cricothyroid tenses the cords.", "say_th": "มีแค่ posterior cricoarytenoid ที่เปิดทางหายใจ; cricothyroid ทำให้สายเสียงตึง", "flows": [{"id": "larynx-nv", "title": "Nerves and arteries of the larynx (thyroidectomy map)", "svg": "<svg class=\"flowsvg\" viewBox=\"-2 -2 715 250\" width=\"715\" height=\"250\" style=\"max-width:787px\" role=\"img\" aria-label=\"Nerves and arteries of the larynx (thyroidectomy map)\" data-flow=\"larynx-nv\"><g class=\"fedges\"><g class=\"fe k-n\" data-a=\"Vagus n. (X)\" data-b=\"Superior laryngeal n.\"><path class=\"fl\" d=\"M89.3,73.0 H108.3 V43.0 H157.9\"/><path class=\"fa\" d=\"M163.9,43.0 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"Superior laryngeal n.\" data-b=\"iln\"><path class=\"fl\" d=\"M308.4,43.0 H327.4 V19.8 H347.5\"/><path class=\"fa\" d=\"M353.5,19.8 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"Superior laryngeal n.\" data-b=\"eln\"><path class=\"fl\" d=\"M308.4,43.0 H327.4 V66.2 H347.5\"/><path class=\"fa\" d=\"M353.5,66.2 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"Vagus n. (X)\" data-b=\"rln\"><path class=\"fl\" d=\"M89.3,73.0 H108.3 V119.5 H157.9\"/><path class=\"fa\" d=\"M163.9,119.5 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"rln\" data-b=\"Inferior laryngeal n.\"><path class=\"fl\" d=\"M316.5,119.5 H347.5\"/><path class=\"fa\" d=\"M353.5,119.5 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-a\" data-a=\"External carotid a.\" data-b=\"sta\"><path class=\"fl\" d=\"M126.9,179.8 H157.9\"/><path class=\"fa\" d=\"M163.9,179.8 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-a\" data-a=\"sta\" data-b=\"sla\"><path class=\"fl\" d=\"M295.0,179.8 H347.5\"/><path class=\"fa\" d=\"M353.5,179.8 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-a\" data-a=\"Subclavian a.\" data-b=\"Thyrocervical trunk\"><path class=\"fl\" d=\"M97.2,227.5 H157.9\"/><path class=\"fa\" d=\"M163.9,227.5 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-a\" data-a=\"Thyrocervical trunk\" data-b=\"ita\"><path class=\"fl\" d <li><span class=\"cz\">Internal laryngeal n.</span>: sensory + autonomic to mucosa ABOVE the vocal folds (pierces thyrohyoid membrane with the superior laryngeal artery)</li><li><span class=\"cz\">Inferior laryngeal n.</span> (end of recurrent laryngeal): motor to all intrinsic muscles except cricothyroid; sensory BELOW the vocal folds</li><li>Arteries: superior laryngeal (superior thyroid) · inferior laryngeal (inferior thyroid)</li></ul><p class=\"lt-trap\">External laryngeal injury <span class=\"lt-ar\">→</span> cricothyroid paralysis <span class=\"lt-ar\">→</span> monotone, no high pitch · RLN injury <span class=\"lt-ar\">→</span> hoarseness; bilateral <span class=\"lt-ar\">→</span> airway obstruction</p>", "th": "External laryngeal nerve (แขนงของ superior laryngeal ของ X) เลี้ยง cricothyroid; internal laryngeal nerve รับความรู้สึกเยื่อบุเหนือ vocal fold; inferior laryngeal nerve (ปลายของ recurrent laryngeal) สั่งการกล้ามเนื้อภายในทั้งหมดยกเว้น cricothyroid และรับความรู้สึกใต้ vocal fold. ผ่าตัดไทรอยด์บาด external laryngeal → เสียงโทนเดียว ร้องเสียงสูงไม่ได้; บาด RLN → เสียงแหบ", "tn": ["Posttest #8: cricothyroid เลี้ยงโดย external laryngeal nerve", "ทวนกับ N-C4 (vagus ในคอ)"], "say": "External laryngeal for cricothyroid, recurrent laryngeal for everything else.", "say_th": "External laryngeal เลี้ยง cricothyroid, recurrent laryngeal เลี้ยงที่เหลือทั้งหมด", "flows": [{"id": "larynx-nv", "title": "Nerves and arteries of the larynx (thyroidectomy map)", "svg": "<svg class=\"flowsvg\" viewBox=\"-2 -2 715 250\" width=\"715\" height=\"250\" style=\"max-width:787px\" role=\"img\" aria-label=\"Nerves and arteries of the larynx (thyroidectomy map)\" data-flow=\"larynx-nv\"><g class=\"fedges\"><g class=\"fe k-n\" data-a=\"Vagus n. (X)\" data-b=\"Superior laryngeal n.\"><path class=\"fl\" d=\"M89.3,73.0 H108.3 V43.0 H157.9\"/><path class=\"fa\" d=\"M163.9,43.0 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"Superior laryngeal n.\" data-b=\"iln\"><path class=\"fl\" d=\
