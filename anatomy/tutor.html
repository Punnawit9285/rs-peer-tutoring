"Inferior laryngeal a.\" data-note=\"\" data-name=\"Inferior laryngeal a.\" tabindex=\"0\"><rect x=\"571.8\" y=\"213.5\" width=\"135.5\" height=\"28.0\" rx=\"6.0\"/><text class=\"nm\" x=\"580.8\" y=\"230.0\">Inferior laryngeal a.</text></g></g></svg>", "legend": ["n", "a"], "how": "", "w": 711, "h": 246, "links": true, "th": "แผนที่ผ่าตัดไทรอยด์: external laryngeal nerve วิ่งคู่ superior thyroid artery (ผูกสูงเกิน → cricothyroid อ่อน เสียงโทนเดียว), recurrent laryngeal nerve ไขว้ inferior thyroid artery (บาด → เสียงแหบ). Internal laryngeal กับ superior laryngeal artery แทง thyrohyoid membrane ด้วยกัน"}]}, {"t": "c", "id": "L-C7", "title": "Clinical larynx: Valsalva, foreign bodies, airway access", "core": false, "figs": [{"src": "img/h/rs1_urt_slide_033.jpg", "cap": "Handout p.33 · 691026 Upper respiratory tract"}, {"src": "img/h/rs1_urt_slide_034.jpg", "cap": "Handout p.34 · 691026 Upper respiratory tract"}, {"src": "img/h/rs1_urt_slide_043.jpg", "cap": "Handout p.43 · 691026 Upper respiratory tract"}, {"src": "img/t/p2_023.jpg", "cap": "RS I tidbits board (peer summary)"}], "body": "<ul class=\"lt-pts\"><li>Valsalva: forced expiration against a closed glottis <span class=\"lt-ar\">→</span> ↑ intrathoracic + intra-abdominal pressure</li><li>Foreign body in the vestibule <span class=\"lt-ar\">→</span> laryngospasm closes the rima <span class=\"lt-ar\">→</span> asphyxia; <span class=\"cz\">Heimlich manoeuvre</span> pushes the diaphragm up to expel it</li><li>Emergency <span class=\"cz\">cricothyroidotomy</span>: needle or surgical, through the median cricothyroid ligament</li><li><span class=\"cz\">Tracheostomy</span>: skin incision of neck + anterior tracheal wall (2nd-4th rings, isthmus of thyroid retracted) for upper airway obstruction or respiratory failure</li><li>Endotracheal intubation through the rima glottidis</li></ul>", "th": "Valsalva maneuver คือการเบ่งหายใจออกขณะปิด glottis ทำให้ความดันในช่องอกและท้องสูง. สิ่งแปลกปลอมเข้า vestibule ทำให้กล้ามเนื้อเกร็งปิด rima จนขาดอากาศ ใช้ Heimlich maneuver ดันกะบังลมขึ้น. Cricothyroidotomy แทงผ่าน median cricothyroid ligament; tracheostomy เปิดหลอดลมที่วงที่ 2-4", "tn": ["Posttest #10: transverse incision ผ่านผิวหนังคอและผนังหน้าหลอดลม = tracheostomy"], "say": "Cricothyroidotomy for the emergency, tracheostomy for the long haul.", "say_th": "Cricothyroidotomy สำหรับฉุกเฉิน tracheostomy สำหรับใส่ระยะยาว"}, {"t": "c", "id": "L-C8", "title": "Trachea and carina", "core": true, "figs": [{"src": "img/h/rs1_urt_slide_041.jpg", "cap": "Handout p.41 · 691026 Upper respiratory tract"}, {"src": "img/t/p1_084.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p2_054.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p1_110.jpg", "cap": "RS I tidbits board (peer summary)"}], "body": "<ul class=\"lt-pts\"><li>From the cricoid (<span class=\"cz\">C6</span>) to the bifurcation at the <span class=\"cz\">sternal angle</span> (T4/T5 disc); about 10-12 cm</li><li>16-20 C-shaped <span class=\"cz\">hyaline</span> rings joined by annular ligaments; flat posterior wall = <span class=\"cz\">trachealis</span> muscle + fibroelastic membrane (lets the oesophagus expand)</li><li><span class=\"cz\">Carina</span>: internal ridge at the bifurcation</li><li>Right main bronchus is wider, shorter, more vertical <span class=\"lt-ar\">→</span> aspirated bodies go RIGHT</li></ul><p class=\"lt-trap\">Tracheal deviation on CXR: tension pneumothorax pushes away, collapse pulls toward; compressed by thyroid tumour or arch aneurysm</p>", "th": "หลอดลมเริ่มที่ cricoid (C6) แยกที่ระดับ sternal angle (T4/T5) ยาว 10-12 ซม. มีกระดูกอ่อน hyaline รูปตัว C 16-20 วง เชื่อมด้วย annular ligament ด้านหลังแบนมี trachealis muscle ให้หลอดอาหารขยายได้. Carina เป็นสันภายในที่จุดแยก. หลอดลมใหญ่ขวากว้าง สั้น ตั้งตรงกว่า สิ่งแปลกปลอมจึงตกขวา", "tn": ["Posttest #9: posterior gap ของ tracheal rings = trachealis (involuntary)", "AC81 #11: carina ระดับเดียวกับ sternal angle; trachea เริ่มที่ C6", "AC77 #21: right main bronchus + carina"], "say": "C6 to the sternal angle; the carina is the ridge you see at the split.", "say_th": "หลอดลมจาก C6 ถึง sternal angle; carina คือสันที่เห็นตรงจุดแยก"}, {"t": "c", "id": "L-C9", "title": "Tidbits: intrinsic muscles in 3D", "core": false, "figs": [{"src": "img/t/p1_033.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p1_037.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p1_034.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p1_035.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p1_032.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p1_031.jpg", "cap": "RS I tidbits board (peer summary)"}], "body": "<ul class=\"lt-pts\"><li>Transverse arytenoid: arytenoid to arytenoid across the back <span class=\"lt-ar\">→</span> closes the posterior rima</li><li>Lateral crico-arytenoid: superior margin of cricoid arch <span class=\"lt-ar\">→</span> muscular process <span class=\"lt-ar\">→</span> adducts</li><li>Thyro-arytenoid: inner thyroid lamina <span class=\"lt-ar\">→</span> arytenoid <span class=\"lt-ar\">→</span> shortens + adducts; <span class=\"cz\">vocalis</span> is its medial part on the vocal ligament</li><li>Thyro-epiglottic: inner thyroid <span class=\"lt-ar\">→</span> aryepiglottic fold + epiglottis <span class=\"lt-ar\">→</span> widens the inlet</li><li>All supplied by the <span class=\"cz\">recurrent (inferior) laryngeal</span> nerve</li></ul>", "th": "ภาพ 3D จาก tidbits ช่วยให้เห็นตำแหน่งกล้ามเนื้อ: transverse arytenoid พาดระหว่าง arytenoid สองข้างด้านหลัง, lateral cricoarytenoid จากขอบบน cricoid arch ไป muscular process, thyroarytenoid จากผิวใน thyroid ไป arytenoid โดยส่วนในสุดคือ vocalis, thyroepiglottic ไป aryepiglottic fold. ทั้งหมดเลี้ยงโดย recurrent laryngeal nerve", "tn": ["ภาพจากแอป 3D (tidbits board) — ใช้ประกอบการสอน ไม่ใช่ภาพ spot จริง"], "say": "Use the 3D views to see each muscle before you look for it in the cadaver.", "say_th": "ดูภาพ 3D ให้เห็นแต่ละมัดก่อน แล้วไปหาในศพ"}, {"t": "s", "id": "L-S1", "title": "Nasopharynx: tubal elevation and pharyngeal recess", "instr": "On the lateral wall of the nasopharynx, find the pharyngeal orifice of the auditory tube, the tubal elevation around it, the salpingopharyngeal fold running down from it and the pharyngeal recess behind it.", "cad": {"src": "img/r/R146_0.jpg", "cap": "Rohen, Photographic Atlas 8e p.146"}, "cad2": null, "cmp": [{"src": "img/h/rs1_urt_slide_019.jpg", "cap": "Handout p.19"}, {"src": "img/t/p1_068.jpg", "cap": "RS I tidbits board (peer summary)"}], "labels": [["4", "Tubal elevation"], ["5", "Pharyngeal tonsil"], ["6", "Pharyngeal orifice of auditory tube"], ["7", "Salpingopharyngeal fold"], ["8", "Pharyngeal recess"], ["9", "Soft palate"], ["10", "Uvula"]], "note": "", "rel": ["Pharyngeal recess (8) lies behind the tubal elevation (4)", "Salpingopharyngeal fold (7) descends from the back of the torus", "Pharyngeal tonsil (5) is on the roof/posterior wall"], "refs": "Rohen 8e p.146 · Handout p.19", "vid": null, "tn": ["ไล่จากหน้าไปหลัง: torus, รูเปิด auditory tube, salpingopharyngeal fold, pharyngeal recess", "AC76 #4: structure posterior to torus tubarius = pharyngeal recess", "AC81 #2: muscle in area B = salpingopharyngeus"], "say": "Torus, opening, fold, recess - from front to back.", "say_th": "Torus, รูเปิด, fold, recess — ไล่จากหน้าไปหลัง"}, {"t": "s", "id": "L-S2", "title": "Laryngeal cartilages and ligaments", "instr": "On the isolated laryngeal skeleton, anterior and posterior views: name every cartilage, the joints between them and the ligaments.", "cad": {"src": "img/r/R160_0.jpg", "cap": "Rohen, Photographic Atlas 8e p.160"}, "cad2": null, "cmp": [{"src": "img/h/rs1_urt_slide_027.jpg", "cap": "Handout p.27"}, {"src": "img/h/rs1_urt_slide_028.jpg", "cap": "Handout p.28"}, {"src": "img/h/rs1_urt_slide_030.jpg", "cap": "Handout p.30"}], "labels": [["1", "Epiglottis"], ["2", "Lesser cornu of hyoid bone"], ["3", "Greater cornu of hyoid bone"], ["4", "Lateral thyrohyoid ligament"], ["5", "Body of hyoid bone"], ["6", "Superior cornu of thyroid cartilage"], ["7", "Thyro-epiglottic ligament"], ["8", "Conus elasticus"], ["9", "Cricothyroid ligament"], ["10", "Thyroid cartilage"], ["11", "Cricoid cartilage"], ["12", "Trachea"], ["13", "Corniculate cartilage of arytenoid cartilage"], ["14", "Arytenoid cartilage of arytenoid cartilage"], ["15", "Posterior crico-arytenoid ligament"], ["16", "Cricothyroid joint"], ["17", "Crico-arytenoid joint"]], "note": "", "rel": ["Cricothyroid ligament (9) spans the gap between thyroid (10) and cricoid (11) in front", "Arytenoids (14) sit on the upper border of the cricoid lamina at the crico-arytenoid joints (17)", "Inferior horn of the thyroid meets the cricoid at the cricothyroid joint (16)"], "refs": "Rohen 8e p.160 · Handout p.26-30", "vid": null, "tn": ["ให้นักเรียนคลำ cricothyroid ligament บนคอตัวเอง", "AC77 #4: cricothyroid membrane"], "say": "Find the cricothyroid ligament: that is your emergency airway.", "say_th": "หา cricothyroid ligament: นั่นคือทางหายใจฉุกเฉิน"}, {"t": "s", "id": "L-S3", "title": "Laryngeal muscles from the side", "instr": "Thyroid cartilage partly removed (left) and half removed (right). Find the posterior and lateral crico-arytenoids, the transverse arytenoid, the thyro-epiglottic muscle, and on the right the vocal ligament with vocalis.", "cad": {"src": "img/r/R162_0.jpg", "cap": "Rohen, Photographic Atlas 8e p.162"}, "cad2": null, "cmp": [{"src": "img/h/rs1_urt_slide_037.jpg", "cap": "Handout p.37"}, {"src": "img/t/p1_081.jpg", "cap": "RS I tidbits board (peer summary)"}], "labels": [["1", "Hyoglossus muscle"], ["2", "Hyoid bone"], ["3", "Epiglottis"], ["4", "Thyrohyoid membrane"], ["5", "Superior cornu"], ["6", "Superior laryngeal nerve"], ["7", "Transverse arytenoid muscle"], ["8", "Posterior crico-arytenoid muscle"], ["9", "Transverse muscle of trachea (trachealis)"], ["10", "Ary-epiglottic fold"], ["11", "Thyro-epiglottic Identify structure A.", "ex": "Elevation over the cartilage of the auditory tube.", "o": null, "a": "Torus tubarius"}, {"q": "Identify space B.", "ex": "Lateral wall of the nasopharynx, level of the inferior concha.", "o": null, "a": "Opening of the auditory (Eustachian / pharyngotympanic) tube"}]}, {"t": "p", "id": "R77-03", "set": "AC77 RS I", "src": "pp_ac77_rscvs", "img": "img/pp/pp_ac77_rscvs_006.jpg", "mcq": false, "qs": [{"q": "Identify structure * (posterior view, pharynx opened).", "ex": "Top of the laryngeal inlet.", "o": null, "a": "Epiglottis"}, {"q": "Identify the pointed space (green arrow).", "ex": "Gutter beside the inlet; internal laryngeal n. runs deep to its mucosa; fish bones lodge here.", "o": null, "a": "Piriform recess (fossa/sinus)"}]}, {"t": "p", "id": "R77-04", "set": "AC77 RS I", "src": "pp_ac77_rscvs", "img": "img/pp/pp_ac77_rscvs_007.jpg", "mcq": false, "qs": [{"q": "Identify structure A.", "ex": "Gap between thyroid and cricoid cartilages in the midline.", "o": null, "a": "Cricothyroid membrane (median cricothyroid ligament)"}, {"q": "(True/False) This structure is perforated in emergencies to create an airway.", "ex": "Cricothyrotomy enters the infraglottic cavity below the vocal folds.", "o": null, "a": "True"}]}, {"t": "p", "id": "R77-05", "set": "AC77 RS I", "src": "pp_ac77_rscvs", "img": "img/pp/pp_ac77_rscvs_008.jpg", "mcq": false, "qs": [{"q": "Identify structure A.", "ex": "Upper pair of folds.", "o": null, "a": "Vestibular folds (false vocal cords)"}, {"q": "Identify structure B.", "ex": "Recess between vestibular and vocal folds.", "o": null, "a": "Laryngeal ventricle"}]}, {"t": "p", "id": "R77-06", "set": "AC77 RS I", "src": "pp_ac77_rscvs", "img": "img/pp/pp_ac77_rscvs_009.jpg", "mcq": false, "qs": [{"q": "Identify structure 8 (posterior view).", "ex": "On the back of the cricoid lamina.", "o": null, "a": "Posterior cricoarytenoid muscle"}, {"q": "Tell its function.", "ex": "Only abductor; both paralysed -> airway obstruction.", "o": null, "a": "Opens (abducts) the rima glottidis"}]}, {"t": "p", "id": "R77-21", "set": "AC77 RS I", "src": "pp_ac77_rscvs", "img": "img/pp/pp_ac77_rscvs_024.jpg", "mcq": false, "qs": [{"q": "Identify structure A.", "ex": "Wider, shorter, more vertical; foreign bodies go right.", "o": null, "a": "Right main bronchus"}, {"q": "Identify structure B.", "ex": "Internal ridge at the tracheal bifurcation.", "o": null, "a": "Carina"}]}, {"t": "p", "id": "R79-03", "set": "AC79 RS I", "src": "pp_ac79_rs", "img": "img/pp/pp_ac79_rs_005.jpg", "mcq": false, "qs": [{"q": "Identify this structure A.", "ex": "Cartilage elevation behind the opening of the auditory (pharyngotympanic) tube in the lateral nasopharyngeal wall.", "o": ["Palatine torus", "Torus tubarius", "Salpingopharyngeal fold", "Torus mandibularis"], "a": 1}, {"q": "Identify this structure B.", "ex": "Deep slit behind the torus tubarius = pharyngeal recess (fossa of Rosenmüller), the commonest site of nasopharyngeal carcinoma.", "o": ["Epiglottic vallecula", "Piriform sinus", "Pharyngeal sinus (recess)", "Opening to pharyngotympanic tube"], "a": 2}]}, {"t": "p", "id": "R79-04", "set": "AC79 RS I", "src": "pp_ac79_rs", "img": "img/pp/pp_ac79_rs_006.jpg", "mcq": false, "qs": [{"q": "Identify this structure A.", "ex": "Large shield-shaped lamina of the larynx seen from the side.", "o": ["Thyroid cartilage", "Cricoid cartilage", "Arytenoid cartilage", "Hyoid bone"], "a": 0}, {"q": "Identify this structure B.", "ex": "Only intrinsic muscle on the OUTSIDE of the larynx, between cricoid arch and thyroid cartilage; external laryngeal n.; tenses the vocal folds.", "o": ["Posterior cricoarytenoid muscle", "Thyroepiglottic muscle", "Thyroarytenoid muscle", "Cricothyroid muscle"], "a": 3}]}, {"t": "p", "id": "R79-05", "set": "AC79 RS I", "src": "pp_ac79_rs", "img": "img/pp/pp_ac79_rs_007.jpg", "mcq": false, "qs": [{"q": "Identify this structure A.", "ex": "Fan-shaped muscle on the back of the cricoid lamina (posterior view, pharynx opened).", "o": ["Cricothyroid muscle", "Aryepiglottic muscle", "Posterior cricoarytenoid muscle", "Arytenoid muscle"], "a": 2}, {"q": "What is the function of structure A?", "ex": "The ONLY abductor of the vocal folds: rotates arytenoids laterally and opens the rima glottidis.", "o": ["Tense vocal cords", "Relax vocal cords", "Opens rima glottidis", "Closes rima glottidis"], "a": 2}]}, {"t": "p", "id": "R79-06", "set": "AC79 RS I", "src": "pp_ac79_rs", "img": "img/pp/pp_ac79_rs_008.jpg", "mcq": false, "qs": [{"q": "Identify this structure A.", "ex": "Lower, sharper fold below the ventricle = vocal fold (true cord); stratified squamous epithelium.", "o": ["Piriform sinus", "Vestibular fold of larynx", "Laryngeal ventricle", "Vocal fold of larynx"], "a": 3}, {"q": "Identify this structure B.", "ex": "Tube with C-shaped cartilage rings continuing below the cricoid.", "o": ["Trachea", "Esophagus", "Cricoid cartilage", "Thyroid gland"], "a": 0}]}, {"t": "p", "id": "R80-01", "set": "AC80 RS I", "src": "pp_ac80_rs_key", "img": "img/pp/pp_ac80_rs_key_002.jpg", "mcq": false, "qs": [{"q": "Laryngoscopic view: what does the dark tube seen through the open rima glottidis lead into? [stem reworded]", "ex": "Below the vocal folds the infraglottic cavity continues into the trachea (rings visible).", "o": ["Larynx", "Trachea", "Pharynx", "Esophagus"], "a": 1}, {"q": "Identify the pale paired folds (black arrows).", "ex": "White, avascular, sharp-edged folds bounding the rima glottidis = true vocal folds.", "o": ["Ventricular (vestibular) fold", "Vocal fold", "Laryngeal ventricle", "Aryepiglottic fold"], "a": 1}]}, {"t": "p", "id": "R80-05", "set": "AC80 RS I", "src": "pp_ac80_rs_key", "img": "img/pp/pp_ac80_rs_key_005.jpg", "mcq": false, "qs": [{"q": "Identify structure A (laryngoscopic view).", "ex": "Leaf-shaped elastic cartilage at the front/top of the laryngeal inlet.", "o": ["Epiglottis", "Vocal ligament", "Vocalis muscle", "Hyoid bone"], "a": 0}]}, {"t": "p", "id": "R80-07", "set": "AC80 RS I", "src": "pp_ac80_rs_key", "img": "img/pp/pp_ac80_rs_key_007.jpg", "mcq": false, "qs": [{"q": "Identify structure A.", "ex": "Signet-ring cartilage: narrow arch in front, tall lamina behind; the only complete ring.", "o": ["Cricoid cartilage", "Thyroid cartilage", "Arytenoid cartilage", "Corniculate cartilage"], "a": 0}]}, {"t": "p", "id": "R81-02", "set": "AC81 RS I", "src": "pp_ac81_rs", "img": "img/pp/pp_ac81_rs_003.jpg", "mcq": false, "qs": [{"q": "Identify area A.", "ex": "Funnel opening in the lateral nasopharyngeal wall, in front of the torus tubarius.", "o": ["Piriform recess", "Hiatus semilunaris", "Opening of auditory tube", "Opening of nasolacrimal duct"], "a": 2}, {"q": "Identify the muscle in area B.", "ex": "The fold running down from the torus tubarius = salpingopharyngeal fold, raised by salpingopharyngeus (salpinx = tube).", "o": ["Palatoglossus", "Stylopharyngeus", "Palatopharyngeus", "Salpingopharyngeus"], "a": 3}]}, {"t": "p", "id": "R81-03", "set": "AC81 RS I", "src": "pp_ac81_rs", "img": "img/pp/pp_ac81_rs_004.jpg", "mcq": false, "qs": [{"q": "Identify structure A.", "ex": "Posterior surface of the cricoid lamina: the only abductor of the vocal folds.", "o": ["Cricothyroid m.", "Thyroarytenoid m.", "Lateral cricoarytenoid m.", "Posterior cricoarytenoid m."], "a": 3}, {"q": "Identify fold B (coronal section). [stem reworded]", "ex": "Lower of the two folds, below the laryngeal ventricle.", "o": ["Vocal fold", "Vestibular fold", "Ary-epiglottic fold"], "a": 0}]}, {"t": "p", "id": "R81-11", "set": "AC81 RS I", "src": "pp_ac81_rs", "img": "img/pp/pp_ac81_rs_012.jpg", "mcq": false, "qs": [{"q": "Which structure is at the same vertebral level as X (tracheal bifurcation)?", "ex": "Bifurcation and carina = sternal angle = T4/T5.", "o": ["C6", "T1", "Carina", "Eparterial bronchus", "Lingula"], "a": 2}, {"q": "Which is at the same vertebral level as the start of the trachea (conducting part of the bronchial tree)?", "ex": "Trachea starts at the lower border of the cricoid cartilage = C6.", "o": ["C6", "T1", "Carina", "Eparterial bronchus", "Lingula"], "a": 0}]}, {"t": "p", "id": "M-U10", "set": "AC79 MCQ", "src": "mcq:rs-peer-tutoring", "img": null, "mcq": true, "qs": [{"q": "A patient has a small mass in the oropharynx. Which structure is LEAST likely the cause of this mass?", "ex": "The pharyngeal tonsil (adenoid) sits on the roof and posterior wall of the nasopharynx. The uvula, palatine tonsils, lingual tonsil and the tip of the epiglottis are all seen in the oropharynx.", "o": ["Uvula", "Epiglottis", "Palatine tonsil", "Lingual tonsil", "Pharyngeal tonsil"], "a": 4}]}, {"t": "p", "id": "M-U11", "set": "AC79 · AC81 MCQ", "src": "mcq:rs-peer-tutoring", "img": "img/pp/x_rs_ac81-tonsil.jpg", "mcq": true, "qs": [{"q": "What structure is abnormal in this patient?", "ex": "The swollen masses on each side of the oropharynx, between the palatoglossal and palatopharyngeal arches, are enlarged palatine tonsils (tonsillitis).", "o": ["Palatine tonsil", "Lingual tonsil", "Pharyngeal tonsil", "Tubal tonsil", "No abnormality in this patient"], "a": 0}]}, {"t": "p", "id": "M-U28", "set": "AC79 · AC81 MCQ", "src": "mcq:rs-peer-tutoring", "img": null, "mcq": true, "qs": [{"q": "In a thyroidectomy operation, the surgeon accidentally caused a ligation of the superior thyroid artery. Which muscle is most likely to be affected?", "ex": "The external branch of the superior laryngeal nerve runs with the superior thyroid artery and supplies only the cricothyroid. Tying the artery can catch the nerve.", "o": ["Cricothyroid", "Thyroarytenoid", "Lateral cricoarytenoid", "Posterior cricoarytenoid", "Vocalis"], "a": 0}]}, {"t": "p", "id": "M-U30", "set": "AC79 · AC81 MCQ", "src": "mcq:rs-peer-tutoring", "img": null, "mcq": true, "qs": [{"q": "The patient presents with a hoarse voice, difficult breathing, and an inability to abduct the vocal fold. Which nerve defect could cause this symptom?", "ex": "The recurrent laryngeal nerve supplies every intrinsic muscle except the cricothyroid, including the only abductor (posterior cricoarytenoid). It is at risk in neck and thyroid surgery.", "o": ["External laryngeal nerve", "Internal laryngeal nerve", "Superior laryngeal nerve", "Recurrent laryngeal nerve", "Vagus nerve"], "a": 3}]}, {"t": "p", "id": "M-U12", "set": "AC80 MCQ", "src": "mcq:rs-peer-tutoring", "img": "img/pp/x_rs_ac80-adenoid.jpg", "mcq": true, "qs": [{"q": "Where is the adenoid tonsil located?", "ex": "A marks the roof and posterior wall of the nasopharynx: the pharyngeal (adenoid) tonsil. B is the tubal tonsil, C the palatine tonsil, D the lingual tonsil (AC80 key).", "o": ["A", "B", "C", "D"], "a": 0}]}, {"t": "p", "id": "M-U13", "set": "AC80 MCQ", "src": "mcq:rs-peer-tutoring", "img": null, "mcq": true, "qs": [{"q": "Dysfunction of the auditory (Eustachian) tube is associated with which region?", "ex": "The pharyngeal opening of the auditory tube is on the lateral wall of the nasopharynx, behind the inferior concha and in front of the torus tubarius.", "o": ["Larynx", "Esophagus", "Nasopharynx", "Oropharynx", "Laryngopharynx"], "a": 2}]}, {"t": "p", "id": "M-U29", "set": "AC80 MCQ", "src": "mcq:rs-peer-tutoring", "img": null, "mcq": true, "qs": [{"q": "During the procedure of thyroidectomy, a lesion of a nerve beside the superior thyroid artery. What would be the cause of this?", "ex": "The nerve beside the superior thyroid artery is the external laryngeal nerve. Losing the cricothyroid means the vocal cords cannot be tensed: a weak, low-pitched voice.", "o": ["Decrease tension in vocal cord", "Paralysis of vocalis muscle", "Unable to abduct rima glottidis"], "a": 0}]}, {"t": "p", "id": "M-U14", "set": "AC81 MCQ", "src": "mcq:rs-peer-tutoring", "img": null, "mcq": true, "qs": [{"q": "A patient presents with a fish bone stuck in the tonsillar crypts. Which structure do the tonsillar crypts reside in?", "ex": "Tonsillar crypts are the pits of the palatine tonsil, which lies in the oropharynx (tonsillar fossa). A fish bone also commonly lodges there.", "o": ["Oropharynx", "Nasopharynx", "Larynx"], "a": 0}]}]}, {"id": "W", "course": "RS I", "short": "Thoracic wall", "title": "Thoracic wall & diaphragm", "lect": "Sithiporn Agthong, M.D., Ph.D.", "date": "26 Oct 2026", "handout": "rs2_thorax", "hname": "691026 Thoracic wall & diaphragm", "blurb": "Sternum and ribs, three intercostal layers and transversus thoracis, the VAN bundle in the costal groove, where to put a needle or a chest drain, rib fractures, and the diaphragm with its openings and nerves.", "obj": ["Name the parts of the sternum and ribs and the joints of a rib", "Describe the three intercostal layers and transversus thoracis: fibre direction, extent, action and nerve", "Trace the intercostal arteries, veins and nerves and their order in the costal groove", "Explain the landmarks for nerve block, thoracocentesis, chest drain and flail chest", "Describe the diaphragm: parts, openings with their levels and contents, and nerve supply", "List the muscles of quiet and forced breathing"], "items": [{"t": "c", "id": "W-C1", "title": "Sternum and ribs", "core": true, "figs": [{"src": "img/h/rs2_thorax_003.jpg", "cap": "Handout p.3 · 691026 Thoracic wall & diaphragm"}, {"src": "img/h/rs2_thorax_004.jpg", "cap": "Handout p.4 · 691026 Thoracic wall & diaphragm"}, {"src": "img/h/rs2_thorax_005.jpg", "cap": "Handout p.5 · 691026 Thoracic wall & diaphragm"}, {"src": "img/h/rs2_thorax_006.jpg", "cap": "Handout p.6 · 691026 Thoracic wall & diaphragm"}, {"src": "img/t/p2_028.jpg", "cap": "RS I tidbits board (peer summary)"}], "body": "<ul class=\"lt-pts\"><li>Sternum: <span class=\"cz\">manubrium</span> (clavicle + 1st rib) · <span class=\"cz\">sternal angle</span> (manubriosternal joint, 2nd rib) · body · xiphoid process (xiphisternal joint)</li><li>12 pairs: true ribs <span class=\"cz\">1-7</span> (own costal cartilage to sternum) · false 8-12 · floating <span class=\"cz\">11-12</span></li><li>Typical rib <span class=\"cz\">3-9</span>: head (crest, 2 articular facets) · neck · tubercle · shaft with angle and <span class=\"cz\">costal groove</span> on the lower inner border</li><li>Joints: head <span class=\"lt-ar\">↔</span> vertebral bodies (demifacets, same number + one above) · <span class=\"cz\">tubercle <span class=\"lt-ar\">↔</span> transverse process</span> · costal cartilage <span class=\"lt-ar\">↔</span> sternum</li></ul><p class=\"lt-trap\">Count ribs from the sternal angle: the 2nd costal cartilage joins there</p>", "th": "กระดูกอกมี manubrium (ต่อกับ clavicle และซี่โครงที่ 1), sternal angle (ข้อต่อ manubrium กับ body ซี่โครงที่ 2 มาเกาะ), body และ xiphoid. ซี่โครง 12 คู่: true rib 1-7, false rib 8-12, floating rib 11-12. Typical rib (3-9) มี head (crest และ articular facets), neck, tubercle, shaft และ costal groove ที่ขอบล่างด้านใน. Head ต่อกับตัวกระดูกสันหลัง (demifacet) tubercle ต่อกับ transverse process", "tn": ["AC76 #12, AC79 #9-10, AC80 #17-18, AC81 #6-7: manubrium, sternal angle, body, ซี่โครงที่ 3 — ออกทุกปี", "เทคนิค: หา sternal angle → ซี่ที่ 2 → นับลงไปซี่ที่ 3"], "say": "Find the sternal angle, step onto the 2nd rib, then count down.", "say_th": "หา sternal angle ก้าวไปซี่ที่ 2 แล้วนับลง"}, {"t": "c", "id": "W-C2", "title": "Intercostal muscles and transversus thoracis", "core": true, "figs": [{"src": "img/h/rs2_thorax_008.jpg", "cap": "Handout p.8 · 691026 Thoracic wall & diaphragm"}, {"src": "img/h/rs2_thorax_011.jpg", "cap": "Handout p.11 · 691026 Thoracic wall & diaphragm"}, {"src": "img/t/p1_089.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p1_090.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p1_057.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p1_058.jpg", "cap": "RS I tidbits board (peer summary)"}], "body": "<div class=\"tblwrap\"><table class=\"lt-tbl\"><thead><tr><th>Layer</th><th>Fibres</th><th>Extent</th><th>Action</th></tr></thead><tbody><tr><td><span class=\"cz\">External</span></td><td>down + forward (\"hands in pockets\")</td><td>vertebra <span class=\"lt-ar\">→</span> costochondral junction; then external intercostal membrane</td><td>elevate ribs (inspiration)</td></tr><tr><td><span class=\"cz\">Internal</span></td><td>down + back (at right angles)</td><td>sternum <span class=\"lt-ar\">→</span> angle of rib; then internal membrane</td><td>depress ribs (forced expiration)</td></tr><tr><td>Innermost</td><td>as internal</td><td>lateral + posterior spaces</td><td>as internal</td></tr><tr><td><span class=\"cz\">Transversus thoracis</span></td><td>xiphoid + lower sternum <span class=\"lt-ar\">→</span> ribs 2-6</td><td>anterior, inner</td><td>depress ribs (forced expiration)</td></tr></tbody></table></div><ul class=\"lt-pts\"><li>Nerve: intercostal nerves; transversus thoracis = intercostal n. 3-6</li></ul>", "th": "กล้ามเนื้อระหว่างซี่โครงมี 3 ชั้น: external (ชั้นนอก ใยวิ่งลงล่างไปด้านหน้า จากกระดูกสันหลังถึง costochondral junction ยกซี่โครงตอนหายใจเข้า), internal (ชั้นกลาง ใยตั้งฉากกับชั้นนอก จาก sternum ถึง angle ดึงซี่โครงลงตอนหายใจออกแรง), innermost (ชั้นในสุด ด้านข้างและหลัง). Transversus thoracis อยู่ด้านในผนังหน้า จาก xiphoid และส่วนล่างของ sternum ไปซี่ 2-6 ช่วยหายใจออกแรง", "tn": ["AC76 #13-15, AC77 #13-15, AC79 #7-9, AC80 #13-16, AC81 #5, #7: external/internal/innermost intercostal และ transversus thoracis", "จุดแยก internal กับ external: ดูทิศใยเทียบกับซี่โครง และดูว่าอยู่ชั้นไหนเมื่อมีกล้ามเนื้อถูกตัด"], "say": "External runs like hands in front pockets; internal crosses it at right angles.", "say_th": "External วิ่งเหมือนล้วงกระเป๋ากางเกงหน้า internal วิ่งตั้งฉากกับมัน"}, {"t": "c", "id": "W-C3", "title": "Intercostal vessels and nerves (VAN)", "core": true, "figs": [{"src": "img/h/rs2_thorax_015.jpg", "cap": "Handout p.15 · 691026 Thoracic wall & diaphragm"}, {"src": "img/h/rs2_thorax_016.jpg", "cap": "Handout p.16 · 691026 Thoracic wall & diaphragm"}, {"src": "img/h/rs2_thorax_017.jpg", "cap": "Handout p.17 · 691026 Thoracic wall & diaphragm"}, {"src": "img/h/rs2_thorax_018.jpg", "cap": "Handout p.18 · 691026 Thoracic wall & diaphragm"}, {"src": "img/t/p1_095.jpg", "cap": "RS I tidbits board (peer summary)"}], "body": "<ul class=\"lt-pts\"><li>Posterior intercostal arteries from the <span class=\"cz\">aorta</span> (first two from the superior intercostal a.); anterior intercostal arteries from the <span class=\"cz\">internal thoracic a.</span> (and musculophrenic)</li><li>Anterior intercostal veins <span class=\"lt-ar\">→</span> internal thoracic v.; posterior: right <span class=\"lt-ar\">→</span> <span class=\"cz\">azygos</span>, left <span class=\"lt-ar\">→</span> hemiazygos / accessory hemiazygos (2nd-4th <span class=\"lt-ar\">→</span> left superior intercostal v.)</li><li>Intercostal nerve = ventral ramus T1-T11 (T12 = subcostal); lateral + anterior cutaneous branches <span class=\"lt-ar\">→</span> dermatomes</li></ul><div class=\"eqn\">In the costal groove from above down: <span class=\"cz\">Vein - Artery - Nerve</span>, between the internal and innermost layers</div><p class=\"lt-trap\">Herpes zoster follows one dermatome; collateral branches run along the upper border of the rib below</p>", "th": "Posterior intercostal artery มาจาก aorta, anterior intercostal artery มาจาก internal thoracic artery. หลอดเลือดดำ anterior เทเข้า internal thoracic vein; posterior ด้านขวาเข้า azygos ด้านซ้ายเข้า hemiazygos/accessory hemiazygos. Intercostal nerve คือ ventral ramus ของ T1-T11 อยู่ใน costal groove เรียงจากบนลงล่าง Vein-Artery-Nerve (VAN) ระหว่างชั้น internal กับ innermost", "tn": ["AC77 #13 B: intercostal vessels &amp; nerve; AC76 #16: posterior intercostal vessels ใน costal groove", "งูสวัดขึ้นตาม dermatome (tidbits board)"], "say": "Vein, artery, nerve from top to bottom, tucked under the lower edge of each rib.", "say_th": "Vein, artery, nerve จากบนลงล่าง ซ่อนใต้ขอบล่างของซี่โครงทุกซี่", "flows": [{"id": "icos-a", "title": "Arteries of the thoracic w \" tabindex=\"0\"><rect x=\"381.6\" y=\"279.0\" width=\"166.6\" height=\"44.0\" rx=\"6.0\"/><text class=\"nm\" x=\"390.6\" y=\"295.5\">T1 → brachial plexus ·</text><text class=\"nm\" x=\"390.6\" y=\"311.5\">T7–T11 → abdominal wall</text></g></g></svg>", "legend": ["n", "t"], "how": "", "w": 564, "h": 327, "links": false, "th": "Intercostal nerve คือ ventral ramus ของ T1-T11 วิ่งใน costal groove ใต้ artery และ vein (VAN) ระหว่าง internal กับ innermost intercostal ให้กิ่งกล้ามเนื้อ collateral branch และ lateral/anterior cutaneous branches เป็น dermatome — nerve block ฉีดที่ขอบล่างซี่โครง"}]}, {"t": "c", "id": "W-C4", "title": "Needles and tubes through the chest wall", "core": true, "figs": [{"src": "img/h/rs2_thorax_020.jpg", "cap": "Handout p.20 · 691026 Thoracic wall & diaphragm"}, {"src": "img/h/rs2_thorax_023.jpg", "cap": "Handout p.23 · 691026 Thoracic wall & diaphragm"}, {"src": "img/h/rs2_thorax_026.jpg", "cap": "Handout p.26 · 691026 Thoracic wall & diaphragm"}, {"src": "img/h/rs2_thorax_024.jpg", "cap": "Handout p.24 · 691026 Thoracic wall & diaphragm"}, {"src": "img/t/p2_049.jpg", "cap": "RS I tidbits board (peer summary)"}], "body": "<ul class=\"lt-pts\"><li><span class=\"cz\">Intercostal nerve block</span>: inject at the LOWER border of the rib (where the nerve is)</li><li><span class=\"cz\">Thoracocentesis</span>: posterior axillary or mid-scapular line, 7th-8th ICS (handout); pleural tap 8th-10th ICS midaxillary (lung lecture), just ABOVE the upper border of the rib</li><li><span class=\"cz\">Chest drain (thoracostomy)</span>: 4th or 5th ICS, anterior/mid-axillary line, over the UPPER border of the rib <span class=\"lt-ar\">→</span> haemothorax, pneumothorax</li></ul><p class=\"lt-trap\">Every needle except a nerve block goes over the top of the rib to miss the VAN bundle</p>", "th": "Intercostal nerve block ฉีดที่ขอบล่างของซี่โครง (ตำแหน่งของเส้นประสาท). Thoracocentesis/pleural tap แทงเหนือขอบบนของซี่โครงเพื่อหลบ VAN: handout ผนังอกให้ posterior axillary หรือ mid-scapular line ช่องที่ 7-8 ส่วน handout ปอดให้ midaxillary line ช่องที่ 8-10. Chest drain ใส่ที่ช่องที่ 4-5 แนว anterior/mid-axillary line เหนือขอบบนซี่โครง", "tn": ["สองคาบให้ตำแหน่ง pleural tap ไม่เหมือนกัน — สอนทั้งสอง แล้วเน้นหลัก \"เหนือขอบบนซี่โครง\"", "Anatomical lines: midclavicular, anterior/mid/posterior axillary, scapular, paravertebral"], "say": "Block the nerve under the rib; put everything else over the top of the rib.", "say_th": "Block เส้นประสาทใต้ซี่โครง ส่วนเข็มและท่ออื่นทั้งหมดใส่เหนือขอบบนซี่โครง", "flows": [{"id": "icos-n", "title": "Intercostal nerve: a typical thoracic spinal nerve", "svg": "<svg class=\"flowsvg\" viewBox=\"-2 -2 568 331\" width=\"568\" height=\"331\" style=\"max-width:625px\" role=\"img\" aria-label=\"Intercostal nerve: a typical thoracic spinal nerve\" data-flow=\"icos-n\"><g class=\"fedges\"><g class=\"fe k-n\" data-a=\"Thoracic spinal nerve T1–T11\" data-b=\"Dorsal ramus\"><path class=\"fl\" d=\"M144.7,161.5 H163.7 V19.8 H175.7\"/><path class=\"fa\" d=\"M181.7,19.8 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"Thoracic spinal nerve T1–T11\" data-b=\"Rami communicantes\"><path class=\"fl\" d=\"M144.7,161.5 H163.7 V66.2 H175.7\"/><path class=\"fa\" d=\"M181.7,66.2 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"Thoracic spinal nerve T1–T11\" data-b=\"Intercostal n. (ventral ramus)\"><path class=\"fl\" d=\"M144.7,161.5 H163.7 V208.0 H175.7\"/><path class=\"fa\" d=\"M181.7,208.0 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"Intercostal n. (ventral ramus)\" data-b=\"Muscular brs\"><path class=\"fl\" d=\"M343.6,208.0 H362.6 V112.8 H374.6\"/><path class=\"fa\" d=\"M380.6,112.8 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"Intercostal n. (ventral ramus)\" data-b=\"Collateral branch\"><path class=\"fl\" d=\"M343.6,208.0 H362.6 V159.2 H374.6\"/><path class=\"fa\" d=\"M380.6,159.2 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-n\" data-a=\"Intercostal n. (ventral ramus)\" data-b=\"Lateral cutaneous branch\"> c": "img/t/p1_060.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p1_054.jpg", "cap": "RS I tidbits board (peer summary)"}], "body": "<ul class=\"lt-pts\"><li>Sternal, costal and lumbar parts (<span class=\"cz\">right and left crura</span>, medial + lateral arcuate ligaments) <span class=\"lt-ar\">→</span> <span class=\"cz\">central tendon</span>; right dome higher (liver)</li></ul><div class=\"tblwrap\"><table class=\"lt-tbl\"><thead><tr><th>Opening</th><th>Level</th><th>Contents</th></tr></thead><tbody><tr><td><span class=\"cz\">Caval</span></td><td>T8</td><td>IVC (+ right phrenic n.)</td></tr><tr><td><span class=\"cz\">Oesophageal</span></td><td>T10</td><td>oesophagus + vagal trunks</td></tr><tr><td><span class=\"cz\">Aortic</span></td><td>T12</td><td>aorta, thoracic duct, azygos v.</td></tr></tbody></table></div><ul class=\"lt-pts\"><li><span class=\"cz\">Phrenic nerve (C3-C5)</span>: all motor + sensory to central part; lower 6-7 intercostal + subcostal nerves: sensory to the periphery</li><li>Phrenic course: on anterior scalene <span class=\"lt-ar\">→</span> between subclavian a. and v. <span class=\"lt-ar\">→</span> in FRONT of the lung root (vagus behind) <span class=\"lt-ar\">→</span> between mediastinal pleura and fibrous pericardium</li></ul><p class=\"lt-trap\">Hiatal hernia: abdominal contents through the oesophageal hiatus (air behind the heart on CXR)</p>", "th": "กะบังลมมีส่วน sternal, costal, lumbar (crus ขวาซ้าย และ arcuate ligaments) มารวมที่ central tendon โดมขวาสูงกว่าเพราะตับ. รูเปิด: caval opening (T8) ให้ IVC และ right phrenic nerve; esophageal hiatus (T10) ให้หลอดอาหารและ vagal trunks; aortic hiatus (T12) ให้ aorta, thoracic duct, azygos vein. Phrenic nerve (C3-C5) สั่งการทั้งหมดและรับความรู้สึกส่วนกลาง; ขอบรอบนอกรับความรู้สึกจาก intercostal nerve ล่าง. Phrenic วิ่งหน้า root ของปอด (vagus วิ่งหลัง)", "tn": ["AC77 #16, AC79 #11-12, AC80 #19-20: caval opening/IVC, esophageal hiatus, phrenic nerve, ตับใต้กะบังลม", "AC81 #25a:  in the costal groove between internal and innermost layers."], ["07:19", "Caval opening transmits the IVC through the central tendon."], ["09:14", "Hemiazygos and accessory hemiazygos cross to the azygos vein; posterior intercostal veins drain into them."]], "fixes": [], "frames": [{"src": "img/v/IMG_1298_t000042.jpg", "ts": "00:37"}, {"src": "img/v/IMG_1298_t000098.jpg", "ts": "01:46"}, {"src": "img/v/IMG_1298_t000300.jpg", "ts": "05:04"}, {"src": "img/v/IMG_1298_t000356.jpg", "ts": "05:56"}]}, {"t": "p", "id": "R76-12", "set": "AC76 RS I (ACAPNIA)", "src": "pp_acapnia", "img": "img/pp/pp_acapnia_015.jpg", "mcq": false, "qs": [{"q": "Identify structure A. (be specific)", "ex": "Pin between the 1st and 2nd ribs on the sternum.", "o": null, "a": "Manubrium sterni"}, {"q": "Identify structure B.", "ex": "Rib segment next to the sternum is costal cartilage.", "o": null, "a": "Costal cartilage of the 3rd rib"}]}, {"t": "p", "id": "R76-13", "set": "AC76 RS I (ACAPNIA)", "src": "pp_acapnia", "img": "img/pp/pp_acapnia_016.jpg", "mcq": false, "qs": [{"q": "Identify this muscle A.", "ex": "Official key (inner layer seen from inside the chest).", "o": null, "a": "Innermost intercostal muscle"}, {"q": "Identify these vessels B.", "ex": "Run vertically beside the sternum.", "o": null, "a": "Internal thoracic vessels"}]}, {"t": "p", "id": "R76-14", "set": "AC76 RS I (ACAPNIA)", "src": "pp_acapnia", "img": "img/pp/pp_acapnia_017.jpg", "mcq": false, "qs": [{"q": "Identify this muscle A.", "ex": "Fibres inferior-anterior, from vertebrae to costochondral junction.", "o": null, "a": "External intercostal muscle"}, {"q": "Identify this muscle B.", "ex": "Deep to A, fibres superior-anterior, sternum to the rib angle.", "o": null, "a": "Internal intercostal muscle"}]}, {"t": "p", "id": "R76-15", "set": "AC76 RS I (ACAPNIA)", "src": "pp_acapnia", "img": "img/pp/pp_acapnia_018.jpg", "mcq": false, "qs": [{"q": "Identify this muscle A (ribs opened, inside view).", "ex": "From xiphoid and lower sternum to costal cartilages 2-6.", "o": null, "a": "Transversus thoracis muscle"}, {"q": "What is its function?", "ex": "Weak expiratory muscle; intercostal nn. 3-6.", "o": null, "a": "Depresses the ribs in forced expiration"}]}, {"t": "p", "id": "R76-16", "set": "AC76 RS I (ACAPNIA)", "src": "pp_acapnia", "img": "img/pp/pp_acapnia_019.jpg", "mcq": false, "qs": [{"q": "Identify these vessels A.", "ex": "From the aorta / to the azygos system, running between internal and innermost layers.", "o": null, "a": "Posterior intercostal vessels"}, {"q": "Structure A lies in what groove?", "ex": "Lower border of the rib above: VAN (vein-artery-nerve, top to bottom).", "o": null, "a": "Costal groove"}]}, {"t": "p", "id": "R77-12", "set": "AC77 RS I", "src": "pp_ac77_rscvs", "img": "img/pp/pp_ac77_rscvs_015.jpg", "mcq": false, "qs": [{"q": "Identify structure 8.", "ex": "Manubriosternal joint, 2nd costal cartilage, T4/T5.", "o": null, "a": "Sternal angle (of Louis)"}, {"q": "Identify structure 9.", "ex": "Below the sternal angle.", "o": null, "a": "Body of sternum"}]}, {"t": "p", "id": "R77-13", "set": "AC77 RS I", "src": "pp_ac77_rscvs", "img": "img/pp/pp_ac77_rscvs_016.jpg", "mcq": false, "qs": [{"q": "Identify structure A.", "ex": "Outer layer, fibres down and forward.", "o": null, "a": "External intercostal muscle"}, {"q": "Identify structure B.", "ex": "Neurovascular bundle in the costal groove.", "o": null, "a": "Intercostal vessels and nerve"}]}, {"t": "p", "id": "R77-14", "set": "AC77 RS I", "src": "pp_ac77_rscvs", "img": "img/pp/pp_ac77_rscvs_017.jpg", "mcq": false, "qs": [{"q": "Identify this structure (white pin).", "ex": "Middle layer, fibres up and forward.", "o": null, "a": "Internal intercostal muscle"}, {"q": "Tell its function.", "ex": "Interchondral part may help inspiration.", "o": null, "a": "Depresses the ribs during forced expiration"}]}, {"t": "p", "id": "R77-15", "set": "AC77 RS I", "src": "pp_ac77_rscvs", "img": "img/pp/pp_ac77_rscvs_018.jpg", "mcq": false, "qs": [{"q": "Identify structure A.", "ex": "Inner surface of the anterior thoracic wall.", "o": null, "a": "Transversus thoracis muscle"}, {"q": "Identify this structure (probe).", "ex": "Lie on transversus thoracis, lateral to the sternum.", "o": null, "a": "Internal thoracic vessels"}]}, {"t": "p", "id": "R77-16", "set": "AC77 RS I", "src": "pp_ac77_rscvs", "img": "img/pp/pp_ac77_rscvs_019.jpg", "mcq": false, "qs": [{"q": "Identify structure A.", "ex": "In the central tendon, right of midline, T8.", "o": null, "a": "Caval opening (for the IVC)"}, {"q": "Identify structure B.", "ex": "Dome-shaped musculotendinous sheet, viewed from above.", "o": null, "a": "Diaphragm"}]}, {"t": "p", "id": "R79-07", "set": "AC79 RS I", "src": "pp_ac79_rs", "img": "img/pp/pp_ac79_rs_009.jpg", "mcq": false, "qs": [{"q": "Identify this structure A.", "ex": "Fibres run up and forward (hands-in-front-pocket reversed); anteriorly it is the visible layer once external intercostal membrane is seen.", "o": ["External intercostal muscle", "Internal intercostal muscle", "Innermost intercostal muscle", "Transversus thoracis muscle"], "a": 1}, {"q": "Identify this structure B.", "ex": "Outermost layer, fibres down and forward ('hands in pockets').", "o": ["External intercostal muscle", "Internal intercostal muscle", "Innermost intercostal muscle", "Transversus thoracis muscle"], "a": 0}]}, {"t": "p", "id": "R79-08", "set": "AC79 RS I", "src": "pp_ac79_rs", "img": "img/pp/pp_ac79_rs_010.jpg", "mcq": false, "qs": [{"q": "Identify these structures A.", "ex": "Vertical vessels ~1 cm lateral to the sternal border on the inner surface of the anterior wall, lying on transversus thoracis.", "o": ["Pericardiophrenic vessels", "Intercostal vessels", "Internal thoracic vessels", "Musculophrenic vessels"], "a": 2}, {"q": "Identify this structure B.", "ex": "Long middle part of the sternum (costal cartilages 2-7 attach).", "o": ["Manubrium sterni", "Sternal angle", "Body of sternum", "Xiphoid process"], "a": 2}]}, {"t": "p", "id": "R79-09", "set": "AC79 RS I", "src": "pp_ac79_rs", "img": "img/pp/pp_ac79_rs_011.jpg", "mcq": false, "qs": [{"q": "Identify this structure A.", "ex": "Upper broad piece of the sternum: clavicles and 1st costal cartilages.", "o": ["Manubrium sterni", "Sternal angle", "Body of sternum", "Xiphoid process"], "a": 0}, {"q": "Identify this structure B.", "ex": "Inner surface of the anterior wall: slips from lower sternum/xiphoid fanning to costal cartilages 2-6.", "o": ["External intercostal muscle", "Internal intercostal muscle", "Innermost intercostal muscle", "Transversus thoracis muscle"], "a": 3}]}, {"t": "p", "id": "R79-10", "set": "AC79 RS I", "src": "pp_ac79_rs", "img": "img/pp/pp_ac79_rs_012.jpg", "mcq": false, "qs": [{"q": "Identify this structure A.", "ex": "Manubriosternal joint = level of 2nd costal cartilage and T4/T5 disc.", "o": ["Manubrium sterni", "Sternal angle", "Body of sternum", "Xiphoid process"], "a": 1}, {"q": "Identify this structure B.", "ex": "Count from the sternal angle: 2nd costal cartilage meets the angle, the next one down is the 3rd (official key C).", "o": ["1st rib", "2nd rib", "3rd rib", "4th rib"], "a": 2}]}, {"t": "p", "id": "R79-11", "set": "AC79 RS I", "src": "pp_ac79_rs", "img": "img/pp/pp_ac79_rs_013.jpg", "mcq": false, "qs": [{"q": "Which nerve innervates this structure A?", "ex": "A = diaphragm. Motor supply is entirely from the phrenic nerve (C3-C5).", "o": ["Superior epigastric nerve", "Medial pectoral nerve", "Subcostal nerve", "Phrenic nerve"], "a": 3}, {"q": "Which structure is located right below structure A?", "ex": "Under the right dome of the diaphragm lies the liver.", "o": ["Stomach", "Liver", "Small intestine", "Pancreas"], "a": 1}]}, {"t": "p", "id": "R79-12", "set": "AC79 RS I", "src": "pp_ac79_rs", "img": "img/pp/pp_ac79_rs_014.jpg", "mcq": false, "qs": [{"q": "Structure A enters the diaphragm through which opening?", "ex": "A = esophagus with the vagal trunks: esophageal hiatus at T10 (muscular, right crus).", "o": ["Aortic hiatus", "Esophageal hiatus", "Caval opening"], "a": 1}, {"q": "Identify this structure B.", "ex": "Vessel passing through the central tendon on the right = IVC (caval opening, T8).", "o": ["Aorta", "Esophagus", "Superior vena cava", "Inferior vena cava"], "a": 3}]}, {"t": "p", "id": "R80-13", "set": "AC80 RS I", "src": "pp_ac80_rs_key", "img": "img/pp/pp_ac80_rs_key_013.jpg", "mcq": false, "qs": [{"q": "Identify structure A.", "ex": "Inner surface of the anterior wall, slips fanning up-laterally from the sternum.", "o": ["Transversus thoracis", "External intercostal m.", "Internal intercostal m.", "Innermost intercostal m."], "a": 0}]}, {"t": "p", "id": "R80-14", "set": "AC80 RS I", "src": "pp_ac80_rs_key", "img": "img/pp/pp_ac80_rs_key_014.jpg", "mcq": false, "qs": [{"q": "Identify structure A.", "ex": "Vertical vessels beside the sternum on the inner anterior wall.", "o": ["Internal thoracic vessels", "Intercostal nerve", "Thoracic duct", "Sympathetic trunk"], "a": 0}]}, {"t": "p", "id": "R80-15", "set": "AC80 RS I", "src": "pp_ac80_rs_key", "img": "img/pp/pp_ac80_rs_key_015.jpg", "mcq": false, "qs": [{"q": "Identify structure A.", "ex": "Superficial layer, fibres downward-forward.", "o": ["Transversus thoracis", "External intercostal m.", "Internal intercostal m.", "Innermost intercostal m."], "a": 1}]}, {"t": "p", "id": "R80-16", "set": "AC80 RS I", "src": "pp_ac80_rs_key", "img": "img/pp/pp_ac80_rs_key_016.jpg", "mcq": false, "qs": [{"q": "Identify structure A.", "ex": "Middle layer with fibres at right angles to the external layer (up and forward).", "o": ["Transversus thoracis", "External intercostal m.", "Internal intercostal m.", "Innermost intercostal m."], "a": 2}]}, {"t": "p", "id": "R80-17", "set": "AC80 RS I", "src": "pp_ac80_rs_key", "img": "img/pp/pp_ac80_rs_key_017.jpg", "mcq": false, "qs": [{"q": "Identify structure A.", "ex": "Junction of manubrium and body; 2nd costal cartilage attaches here.", "o": ["Manubrium sterni", "Sternal angle", "Xiphoid process", "Body of sternum"], "a": 1}]}, {"t": "p", "id": "R80-18", "set": "AC80 RS I", "src": "pp_ac80_rs_key", "img": "img/pp/pp_ac80_rs_key_018.jpg", "mcq": false, "qs": [{"q": "Identify structure A.", "ex": "Top piece of the sternum with the jugular notch.", "o": ["Manubrium sterni", "Sternal angle", "Xiphoid process", "Body of sternum"], "a": 0}]}, {"t": "p", "id": "R80-19", "set": "AC80 RS I", "src": "pp_ac80_rs_key", "img": "img/pp/pp_ac80_rs_key_019.jpg", "mcq": false, "qs": [{"q": "Identify opening A.", "ex": "Opening in the muscular right crus, left of midline, T10.", "o": ["Caval opening", "Esophageal opening (hiatus)", "Aortic hiatus", "Central tendon of diaphragm"], "a": 1}]}, {"t": "p", "id": "R80-20", "set": "AC80 RS I", "src": "pp_ac80_rs_key", "img": "img/pp/pp_ac80_rs_key_020.jpg", "mcq": false, "qs": [{"q": "Identify structure A.", "ex": "Vessel piercing the central tendon right of midline at T8.", "o": ["Aorta", "Inferior vena cava", "Superior vena cava", "Pulmonary artery"], "a": 1}]}, {"t": "p", "id": "R81-05", "set": "AC81 RS I", "src": "pp_ac81_rs", "img": "img/pp/pp_ac81_rs_006.jpg", "mcq": false, "qs": [{"q": "Identify structure A.", "ex": "Anterior wall seen from inside: slips from the lower sternum to costal cartilages 2-6.", "o": ["External intercostal m.", "Internal intercostal m.", "Innermost intercostal m.", "Transversus thoracis m."], "a": 3}, {"q": "Identify structure B.", "ex": "Paired vertical vessels just lateral to the sternum.", "o": ["Pericardiophrenic vessels", "Intercostal vessels", "Internal thoracic vessels"], "a": 2}]}, {"t": "p", "id": "R81-06", "set": "AC81 RS I", "src": "pp_ac81_rs", "img": "img/pp/pp_ac81_rs_007.jpg", "mcq": false, "qs": [{"q": "Identify structure A.", "ex": "Transverse ridge between manubrium and body.", "o": ["Manubrium sterni", "Sternal angle", "Body of sternum", "Xiphoid process"], "a": 1}, {"q": "Identify structure B.", "ex": "Official key: 3rd. Count down from the 2nd costal cartilage that meets the sternal angle.", "o": ["2nd rib", "3rd rib", "4th rib", "5th rib"], "a": 1}]}, {"t": "p", "id": "R81-07", "set": "AC81 RS I", "src": "pp_ac81_rs", "img": "img/pp/pp_ac81_rs_008.jpg", "mcq": false, "qs": [{"q": "Identify structure A.", "ex": "Outer layer, fibres downward and forward.", "o": ["External intercostal m.", "Internal intercostal m.", "Innermost intercostal m.", "Transversus thoracis m."], "a": 0}, {"q": "Identify structure B.", "ex": "Manubriosternal junction (T4/T5 level).", "o": ["Manubrium sterni", "Sternal angle", "Body of sternum", "Xiphoid process"], "a": 1}]}, {"t": "p", "id": "M-W11", "set": "AC79 · AC81 MCQ", "src": "mcq:rs-peer-tutoring", "img": null, "mcq": true, "qs": [{"q": "Which of the following muscles is used to elevate the rib?", "ex": "The external intercostals raise the ribs in inspiration (bucket and pump handle). The internal, innermost and transversus thoracis depress the ribs in forced expiration; the diaphragm does not lift the ribs.", "o": ["External intercostal muscle", "Internal intercostal muscle", "Innermost intercostal muscle", "Transversus thoracis muscle", "Diaphragm"], "a": 0}]}, {"t": "p", "id": "M-W14", "set": "AC79 · AC80 · AC81 MCQ", "src": "mcq:rs-peer-tutoring", "img": null, "mcq": true, "qs": [{"q": "Which structure does not pass through during thoracostomy in a pneumothorax patient?", "ex": "The tube goes through skin, the three intercostal muscles, endothoracic fascia and parietal pleura into the pleural cavity. The visceral pleura covers the lung and must not be punctured.", "o": ["External intercostal", "Internal intercostal", "Innermost intercostal", "Parietal pleura", "Visceral pleura"], "a": 4}]}, {"t": "p", "id": "M-W16", "set": "AC79 · AC81 MCQ", "src": "mcq:rs-peer-tutoring", "img": null, "mcq": true, "qs": [{"q": "Paralysis of the diaphragm is a result of the injury of which nerve?", "ex": "The phrenic nerve (C3–C5) is the only motor supply of the diaphragm. Lower intercostal nerves carry sensation from its periphery only.", "o": ["Accessory nerve", "Intercostal nerve", "Vagus nerve", "Phrenic nerve", "Greater splanchnic nerve"], "a": 3}]}, {"t": "p", "id": "M-W1", "set": "AC80 MCQ", "src": "mcq:rs-peer-tutoring", "img": null, "mcq": true, "qs": [{"q": "Which structure has 2nd rib attached to?", "ex": "The 2nd costal cartilage joins the sternum at the sternal angle (manubriosternal joint). The 1st rib attaches to the manubrium; ribs 3–6 to the body; the 7th at the xiphisternal junction; nothing to the xiphoid.", "o": ["Manubrium sterni", "Sternal angle of Louis", "Body of sternum", "Xiphisternal junction", "Xiphoid process"], "a": 1}]}, {"t": "p", "id": "M-W15", "set": "AC81 MCQ", "src": "mcq:rs-peer-tutoring", "img": null, "mcq": true, "qs": [{"q": "In the thoracocentesis procedure, the needle needs to be inserted through which structure?", "ex": "A chest tap goes through the lateral chest wall, so it crosses the costal part of the parietal pleura, just above the upper border of the rib below.", "o": ["Costal pleura", "Mediastinal pleura", "Diaphragmatic pleura", "Cervical pleura", "Visceral pleura"], "a": 0}]}]}, {"id": "P", "course": "RS I", "short": "Pleura & lungs", "title": "Pleura, lungs, bronchial tree & chest imaging", "lect": "Assoc. Prof. Poonlarp Cheepsunthorn, Ph.D.", "date": "27 Oct 2026", "handout": "rs3_lung", "hname": "691027 Lung and bronchial tree", "blurb": "Pleural layers, reflections and recesses, the lobes and impressions of each lung, the root and the eparterial bronchus, segments, pulmonary and bronchial vessels, azygos system, lymph, nerves and the chest X-ray anatomy the radiology lecture tests.", "obj": ["Name the parts of the parietal pleura, the pleural reflections and recesses, and the lung and pleura levels", "Compare right and left lungs: lobes, fissures, impressions, hilum", "Describe the bronchial tree, bronchopulmonary segments and the eparterial bronchus", "Trace pulmonary and bronchial vessels, the azygos system and thoracic lymph drainage", "Describe the phrenic, vagus, pulmonary plexuses and splanchnic nerves", "Read basic chest X-ray anatomy: lobes, fissures, silhouette sign, effusion and pneumothorax"], "items": [{"t": "c", "id": "P-C1", "title": "Pleura: layers, parts, recesses", "core": true, "figs": [{"src": "img/h/rs3_lung_002.jpg", "cap": "Handout p.2 · 691027 Lung and bronchial tree"}, {"src": "img/h/rs3_lung_003.jpg", "cap": "Handout p.3 · 691027 Lung and bronchial tree"}, {"src": "img/h/rs3_lung_005.jpg", "cap": "Handout p.5 · 691027 Lung and bronchial tree"}, {"src": "img/t/p1_098.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p1_104.jpg", "cap": "RS I tidbits board (peer summary)"}], "body": "<ul class=\"lt-pts\"><li>Visceral pleura: stuck to the lung, dips into the fissures · parietal pleura: lines the cavity, separated from the wall by <span class=\"cz\">endothoracic (extrapleural) fascia</span></li><li>Parietal parts: <span class=\"cz\">cervical</span> (cupola, 1 inch above the medial third of the clavicle) · <span class=\"cz\">costal</span> · mediastinal · <span class=\"cz\">diaphragmatic</span></li><li>Pleural cavity = potential space with a film of fluid; pulmonary ligament = mediastinal pleura hanging below the root</li><li>Recesses (parietal-to-parietal, lung does not fill them at rest): <span class=\"cz\">costomediastinal</span> (behind the sternum, cardiac notch) and <span class=\"cz\">costodiaphragmatic</span> (lowest, posterior)</li></ul><p class=\"lt-trap\">Fluid collects first in the costodiaphragmatic recess <span class=\"lt-ar\">→</span> blunted costophrenic angle on CXR</p>", "th": "Pleura มี 2 ชั้น: visceral pleura ติดผิวปอดและลงไปในร่อง fissure; parietal pleura บุผนังช่องอก แบ่งเป็น cervical (cupola สูงเหนือ clavicle 1 นิ้ว), costal, mediastinal, diaphragmatic. ระหว่างสองชั้นคือ pleural cavity ซึ่งเป็นช่องศักย์. Recess คือบริเวณที่ parietal pleura พับชนกันและปอดเข้าไปไม่ถึงตอนหายใจปกติ: costomediastinal และ costodiaphragmatic (ต่ำสุด เป็นที่สะสมน้ำ)", "tn": ["AC79 #13-14, AC81 #9: costodiaphragmatic recess, visceral vs parietal pleura (pin บนเยื่อระหว่าง lobe = visceral)", "AC76 #20: costodiaphragmatic recess + hilum"], "say": "Parietal lines the wall, visceral lines the lung; the costodiaphragmatic recess is where fluid pools.", "say_th": "Parietal บุผนัง visceral บุปอด; costodiaphragmatic recess คือที่น้ำไปขัง"}, {"t": "c", "id": "P-C2", "title": "Surface markings: lung vs pleura", "core": true, "figs": [{"src": "img/h/rs3_lung_006.jpg", "cap": "Handout p.6 · 691027 Lung and bronchial tree"}, {"src": "img/h/rs3_lung_004.jpg", "cap": "Handout p.4 · 691027 Lung and bronchial tree"}, {"src": "img/t/p2_047.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/h/rs3_lung_010.jpg", "cap": "Handout p.10 · 691027 Lung and bronchial tree"}], "body": "<div class=\"tblwrap\"><table class=\"lt-tbl\"><thead><tr><th>Line</th><th>Lung</th><th>Pleura</th></tr></thead><tbody><tr><td>Midclavicular</td><td><span class=\"cz\">6th</span> rib</td><td><span class=\"cz\">8th</span> rib</td></tr><tr><td>Midaxillary</td><td>8th rib</td><td>10th rib</td></tr><tr><td>Paravertebral</td><td>10th rib</td><td>12th rib</td></tr></tbody></table></div><div class=\"eqn\">Pleura is two ribs lower than the lung everywhere</div><ul class=\"lt-pts\"><li>Reflections: sternal line · costal (inferior) line · vertebral line; left sternal line swings out at the cardiac notch</li><li>Pleural tap: 8th-10th ICS mid-axillary line, above the upper border of a rib - may hit lung, liver, spleen, diaphragm or the intercostal bundle</li></ul>", "th": "ขอบล่างของปอดและ pleura: แนว midclavicular ปอดที่ซี่ 6 pleura ซี่ 8; แนว midaxillary ปอดซี่ 8 pleura ซี่ 10; แนว paravertebral ปอดซี่ 10 pleura ซี่ 12 — pleura ต่ำกว่าปอด 2 ซี่เสมอ. เจาะน้ำในช่องเยื่อหุ้มปอดที่ช่องซี่โครง 8-10 แนว midaxillary เหนือขอบบนซี่โครง", "tn": ["จำ 6-8-10 / 8-10-12"], "say": "Lung 6, 8, 10; pleura 8, 10, 12.", "say_th": "ปอด 6-8-10 เยื่อหุ้ม 8-10-12"}, {"t": "c", "id": "P-C3", "title": "Lungs: lobes, fissures, surfaces", "core": true, "figs": [{"src": "img/h/rs3_lung_013.jpg", "cap": "Handout p.13 · 691027 Lung and bronchial tree"}, {"src": "img/h/rs3_lung_011.jpg", "cap": "Handout p.11 · 691027 Lung and bronchial tree"}, {"src": "img/t/p2_050.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p1_105.jpg", "cap": "RS I tidbits board (peer summary)"}], "body": "<ul class=\"lt-pts\"><li>Apex (above the clavicle, T1) · base on the diaphragm · costal, mediastinal surfaces · anterior, posterior, inferior borders</li><li>Right: 3 lobes - <span class=\"cz\">oblique</span> + <span class=\"cz\">horizontal</span> fissures (horizontal along the 4th rib/cartilage)</li><li>Left: 2 lobes - oblique fissure only; <span class=\"cz\">cardiac notch</span> and <span class=\"cz\">lingula</span> on the upper lobe</li></ul><p class=\"lt-trap\">Horizontal fissure, middle lobe and three lobes = right only; lingula and cardiac notch = left only</p>", "th": "ปอดมี apex (เหนือ clavicle), base (บนกะบังลม), ผิว costal และ mediastinal. ปอดขวามี 3 lobe แบ่งด้วย oblique และ horizontal fissure; ปอดซ้ายมี 2 lobe มีแต่ oblique fissure มี cardiac notch และ lingula ที่ upper lobe", "tn": ["AC76/AC77/AC79/AC80: lingula, horizontal fissure, middle lobe, oblique fissure", "AC76 #18, AC77 #17, #19, AC79 #16, AC80 #9: lingula, horizontal fissure, middle lobe, oblique fissure"], "say": "Right has three lobes and two fissures; left has two lobes, a cardiac notch and a lingula.", "say_th": "ขวามี 3 lobe 2 fissure ซ้ายมี 2 lobe มี cardiac notch และ lingula"}, {"t": "c", "id": "P-C4", "title": "Root of the lung, hilum and impressions", "core": true, "figs": [{"src": "img/h/rs3_lung_014.jpg", "cap": "Handout p.14 · 691027 Lung and bronchial tree"}, {"src": "img/h/rs3_lung_015.jpg", "cap": "Handout p.15 · 691027 Lung and bronchial tree"}, {"src": "img/t/p1_107.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p1_109.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p1_111.jpg", "cap": "RS I tidbits board (peer summary)"}], "body": "<ul class=\"lt-pts\"><li>Root: main bronchus · pulmonary artery · 2 pulmonary veins · bronchial vessels · lymphatics · pulmonary plexus; pulmonary ligament below</li><li>Right hilum: <span class=\"cz\">eparterial bronchus</span> (right superior lobar) ABOVE the pulmonary artery; veins lowest and most anterior</li><li>Left hilum: pulmonary artery highest; bronchus below it (all hyparterial)</li></ul><div class=\"tblwrap\"><table class=\"lt-tbl\"><thead><tr><th>Right lung grooves</th><th>Left lung grooves</th></tr></thead><tbody><tr><td>SVC, brachiocephalic v.</td><td><span class=\"cz\">arch of aorta</span>, descending aorta</td></tr><tr><td><span class=\"cz\">azygos arch</span>, oesophagus</td><td>subclavian artery, left brachiocephalic v.</td></tr><tr><td>heart (right atrium)</td><td>heart (deep cardiac impression)</td></tr></tbody></table></div>", "th": "Root ของปอดประกอบด้วย main bronchus, pulmonary artery, pulmonary veins 2 เส้น, bronchial vessels, lymphatics และ pulmonary plexus มี pulmonary ligament ห้อยลงใต้ root. Hilum ขวามี eparterial bronchus (right superior lobar bronchus) อยู่เหนือ pulmonary artery; hilum ซ้าย pulmonary artery อยู่สูงสุด. รอยกดบนผิว mediastinal: ปอดขวามี SVC, azygos arch, esophagus; ปอดซ้ายมี aortic arch, descending aorta, subclavian artery, รอยหัวใจลึก", "tn": ["AC76 #17, #19, AC77 #20, AC79 #15-17, AC80 #8, #12, AC81 #9-10: eparterial bronchus, pulmonary ligament, azygos/aortic grooves, subclavian groove", "Pulmonary veins = ต่ำสุดและหน้าสุดในทั้งสอง hilum"], "say": "Only the right lung has a bronchus above its artery: the eparterial bronchus.", "say_th": "มีแต่ปอดขวาที่มีหลอดลมอยู่เหนือ artery: eparterial bronchus", "flows": [{"id": "pulm-circ", "title": "Pulmonary circulation (gas exchange)", "svg": "<svg class=\"flowsvg\" viewBox=\"-2 -2 380 552\" width=\"380\" height=\"552\" sty ": "img/t/p2_052.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p2_053.jpg", "cap": "RS I tidbits board (peer summary)"}], "body": "<p class=\"lt-chain\">Trachea <span class=\"lt-ar\">→</span> main (primary) <span class=\"lt-ar\">→</span> lobar (secondary) <span class=\"lt-ar\">→</span> <span class=\"cz\">segmental (tertiary)</span> <span class=\"lt-ar\">→</span> bronchioles <span class=\"lt-ar\">→</span> <span class=\"cz\">terminal bronchiole</span> (end of conducting zone)</p><p class=\"lt-chain\">Respiratory bronchiole <span class=\"lt-ar\">→</span> alveolar duct <span class=\"lt-ar\">→</span> alveolar sac <span class=\"lt-ar\">→</span> alveoli (gas exchange)</p><ul class=\"lt-pts\"><li>Right: superior lobar (eparterial) + <span class=\"cz\">bronchus intermedius</span> <span class=\"lt-ar\">→</span> middle + inferior lobar</li><li>Segments: right <span class=\"cz\">10</span> (3 upper, 2 middle, 5 lower) · left <span class=\"cz\">8</span> (apicoposterior and anteromedial basal fused)</li><li>Each bronchopulmonary segment = own segmental bronchus + artery; veins run between segments <span class=\"lt-ar\">→</span> surgically removable unit</li></ul>", "th": "ทางเดินหายใจ: trachea → main bronchus → lobar bronchus → segmental bronchus → bronchiole → terminal bronchiole (สิ้นสุดส่วนนำอากาศ) → respiratory bronchiole → alveolar duct → alveolar sac → alveoli. ปอดขวามี superior lobar bronchus กับ bronchus intermedius ที่แยกเป็น middle และ inferior lobar. Segment ปอดขวา 10 ซ้าย 8 แต่ละ segment มี bronchus และ artery ของตัวเอง หลอดเลือดดำอยู่ระหว่าง segment", "tn": ["AC77 #18, AC80 #10, AC76 #21: lobar vs segmental bronchi บน bronchial cast"], "say": "Main, lobar, segmental: primary, secondary, tertiary.", "say_th": "Main, lobar, segmental = primary, secondary, tertiary", "flows": [{"id": "bronchi", "title": "Bronchial tree: lobar and segmental bronchi", "svg": "<svg class=\"flowsvg\" viewBox=\"-2 -2 947 318\" width=\"947\" height=\"318\" style=\"max-width:1041px\" role=\"img\" aria-label=\"Bronchial tree: lobar and segmental bronchi\" data-flow=\"bronchi\"><g class=\"fedges\"><g class=\"fe k-r\" data-a=\"Trachea\" data-b=\"Right main bronchus\"><path class=\"fl\" d=\"M134.0,155.2 H153.0 V70.8 H165.0\"/><path class=\"fa\" d=\"M171.0,70.8 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-r\" data-a=\"Right main bronchus\" data-b=\"Right superior lobar (eparterial)\"><path class=\"fl\" d=\"M321.5,70.8 H340.5 V27.8 H352.5\"/><path class=\"fa\" d=\"M358.5,27.8 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-r\" data-a=\"Right superior lobar (eparterial)\" data-b=\"Apical · posterior · anterior\"><path class=\"fl\" d=\"M497.0,27.8 H541.3\"/><path class=\"fa\" d=\"M547.3,27.8 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-r\" data-a=\"Right main bronchus\" data-b=\"Bronchus intermedius\"><path class=\"fl\" d=\"M321.5,70.8 H340.5 V102.0 H352.5\"/><path class=\"fa\" d=\"M358.5,102.0 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-r\" data-a=\"Bronchus intermedius\" data-b=\"Middle lobar\"><path class=\"fl\" d=\"M510.3,102.0 H529.3 V76.5 H541.3\"/><path class=\"fa\" d=\"M547.3,76.5 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-r\" data-a=\"Middle lobar\" data-b=\"Lateral · medial\"><path class=\"fl\" d=\"M640.6,76.5 H756.9\"/><path class=\"fa\" d=\"M762.9,76.5 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-r\" data-a=\"Bronchus intermedius\" data-b=\"Right inferior lobar\"><path class=\"fl\" d=\"M510.3,102.0 H529.3 V119.5 H541.3\"/><path class=\"fa\" d=\"M547.3,119.5 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-r\" data-a=\"Right inferior lobar\" data-b=\"Superior · 4 basal (medial, anterior, lateral, posterior)\"><path class=\"fl\" d=\"M677.8,119.5 H756.9\"/><path class=\"fa\" d=\"M762.9,119.5 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-r\" data-a=\"Trachea\" data-b=\"Left main bronchus\"><path class=\"fl\" d=\"M134.0,155.2 H153.0 V229.5 H165.0\"/><path class=\"fa\" d=\"M171.0,229.5 l-7,-3.6 v7.2 z\"/></g><g class=\"fe k-r\" data-a=\"Left main bronchus\" data-b=\"Left superior lobar\">< .43 · 691027 Lung and bronchial tree"}, {"src": "img/t/p1_120.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p2_078.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p1_106.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p1_108.jpg", "cap": "RS I tidbits board (peer summary)"}], "body": "<ul class=\"lt-pts\"><li><span class=\"cz\">Phrenic (C3-C5)</span>: motor + sensory to diaphragm; sensory to pericardium and mediastinal pleura; runs IN FRONT of the lung root</li><li><span class=\"cz\">Vagus</span>: runs BEHIND the lung root <span class=\"lt-ar\">→</span> pulmonary plexus <span class=\"lt-ar\">→</span> oesophageal plexus; left vagus gives the left RLN under the arch</li><li>Pulmonary plexuses on the root: parasympathetic (vagus) = bronchoconstriction, vasodilation; sympathetic (T2-T5 ganglia) = bronchodilation</li><li>Splanchnic nerves: greater <span class=\"cz\">T5-T9</span> · lesser T10-T11 · least T12 <span class=\"lt-ar\">→</span> through the crura to coeliac/aorticorenal ganglia</li><li>Mediastinum: superior (above the sternal angle) · inferior = anterior (thymus remnant, nodes) · middle (heart, pericardium, phrenic nerves) · posterior (oesophagus, descending aorta, azygos, thoracic duct, vagus, splanchnics)</li></ul>", "th": "Phrenic nerve (C3-C5) เลี้ยงกะบังลม และรับความรู้สึกจาก pericardium และ mediastinal pleura วิ่งหน้า root ของปอด; vagus วิ่งหลัง root ไปเป็น pulmonary และ esophageal plexus. Pulmonary plexus: parasympathetic ทำให้หลอดลมหด sympathetic ทำให้หลอดลมขยาย. Splanchnic nerves: greater T5-T9, lesser T10-T11, least T12. Mediastinum แบ่ง superior และ inferior (anterior, middle, posterior)", "tn": ["AC81 #8: phrenic nerve + liver impression", "แยก phrenic กับ vagus: phrenic หน้า root, vagus หลัง root"], "say": "Phrenic in front of the root, vagus behind it.", "say_th": "Phrenic อยู่หน้า root vagus อยู่หลัง root", "flows": [{"id": "thorax-n", "title": "Nerves of the thorax: phrenic, vagus, sympathet ss=\"nm\" x=\"221.8\" y=\"227.5\">T2–T5 ganglia</text></g><g class=\"fn k-n key\" data-n=\"Greater splanchnic n.\" data-note=\"T5–T9\" data-name=\"Greater splanchnic n.\" tabindex=\"0\"><rect x=\"212.8\" y=\"246.0\" width=\"146.8\" height=\"39.5\" rx=\"6.0\"/><text class=\"nm\" x=\"221.8\" y=\"262.5\">Greater splanchnic n.</text><text class=\"nt\" x=\"221.8\" y=\"276.5\">T5–T9</text></g><g class=\"fn k-g\" data-n=\"Coeliac ganglion\" data-note=\"\" data-name=\"Coeliac ganglion\" tabindex=\"0\"><rect x=\"423.1\" y=\"251.8\" width=\"119.4\" height=\"28.0\" rx=\"14.0\"/><text class=\"nm\" x=\"434.1\" y=\"268.2\">Coeliac ganglion</text></g><g class=\"fn k-n\" data-n=\"Lesser splanchnic n.\" data-note=\"T10–T11\" data-name=\"Lesser splanchnic n.\" tabindex=\"0\"><rect x=\"212.8\" y=\"292.5\" width=\"138.4\" height=\"39.5\" rx=\"6.0\"/><text class=\"nm\" x=\"221.8\" y=\"309.0\">Lesser splanchnic n.</text><text class=\"nt\" x=\"221.8\" y=\"323.0\">T10–T11</text></g><g class=\"fn k-g\" data-n=\"Aorticorenal ganglion\" data-note=\"\" data-name=\"Aorticorenal ganglion\" tabindex=\"0\"><rect x=\"423.1\" y=\"298.2\" width=\"149.2\" height=\"28.0\" rx=\"14.0\"/><text class=\"nm\" x=\"434.1\" y=\"314.8\">Aorticorenal ganglion</text></g><g class=\"fn k-n\" data-n=\"Least splanchnic n.\" data-note=\"T12\" data-name=\"Least splanchnic n.\" tabindex=\"0\"><rect x=\"212.8\" y=\"339.0\" width=\"131.7\" height=\"39.5\" rx=\"6.0\"/><text class=\"nm\" x=\"221.8\" y=\"355.5\">Least splanchnic n.</text><text class=\"nt\" x=\"221.8\" y=\"369.5\">T12</text></g><g class=\"fn k-n key root\" data-n=\"Phrenic n. (C3–C5)\" data-note=\"passes IN FRONT of the lung root\" data-name=\"Phrenic n. (C3–C5)\" tabindex=\"0\"><rect x=\"0.0\" y=\"392.5\" width=\"174.8\" height=\"39.5\" rx=\"6.0\"/><text class=\"nm\" x=\"9.0\" y=\"409.0\">Phrenic n. (C3–C5)</text><text class=\"nt\" x=\"9.0\" y=\"423.0\">passes IN FRONT of the lung root</text></g><g class=\"fn k-t\" data-n=\"Diaphragm + pericardium\" data-note=\"\" data-name=\"Diaphragm + pericardium\" tabindex=\"0\"><rect x=\"212.8\" y=\"398.2\" width=\"169.3\" height=\"28.0\" rx=\"6.0\"/><text class=\"nm\" x=\"221.8\" y=\"414.8\">Diaphragm + pericardium</text></g></g></svg>", "legend": ["n", "t", "g"], "how": "", "w": 809, "h": 436, "links": false, "th": "แยก 3 เส้นใน mediastinum: phrenic วิ่งหน้า root ปอดไปกะบังลม; vagus วิ่งหลัง root ให้ pulmonary plexus (หลอดลมหด) และ esophageal plexus; sympathetic trunk บนหัวซี่โครงให้กิ่งไป pulmonary plexus (หลอดลมขยาย) และ splanchnic nerves (greater T5-9, lesser T10-11, least T12) ลงช่องท้อง"}]}, {"t": "c", "id": "P-C9", "title": "Chest X-ray and CT anatomy", "core": true, "figs": [{"src": "img/t/p2_064.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p2_065.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p2_066.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p2_069.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p2_070.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p2_074.jpg", "cap": "RS I tidbits board (peer summary)"}, {"src": "img/t/p2_063.jpg", "cap": "RS I tidbits board (peer summary)"}], "body": "<ul class=\"lt-pts\"><li>Densities: air (black) &lt; fat &lt; soft tissue &lt; bone &lt; metal (white); lung parenchyma is darker than fat</li><li>Lobes on CT: RUL, RML, RLL / LUL, LLL; horizontal (minor) fissure is the best-seen fissure on a PA film; major fissures on the lateral</li><li><span class=\"cz\">Silhouette sign</span>: an opacity touching a border erases it <span class=\"lt-ar\">→</span> right heart border = <span class=\"cz\">RML</span> · left heart border = <span class=\"cz\">lingula</span> · hemidiaphragms = lower lobes · aortic knob = LUL · right paratracheal stripe = RUL</li><li>Pneumothorax: visible visceral pleural line, no lung markings beyond · effusion: <span class=\"cz\">blunted costophrenic angle</span></li><li>Hilum: left hilum higher than right; diaphragm: right higher (liver); air behind the heart = hiatal hernia; pleural plaques = asbestos</li></ul>", "th": "ความทึบใน X-ray: อากาศดำสุด → ไขมัน → เนื้อเยื่อ → กระดูก → โลหะขาวสุด. Silhouette sign คือรอยโรคที่แตะขอบใดจะทำให้ขอบนั้นหายไป: ขอบหัวใจขวา = RML, ขอบหัวใจซ้าย = lingula, กะบังลม = lower lobe. Pneumothorax เห็นเส้น visceral pleura ไม่มีลายปอดด้านนอก; pleural effusion เห็นมุม costophrenic ทื่อ. Hilum ซ้ายสูงกว่าขวา กะบังลมขวาสูงกว่าซ้าย", "tn": ["Survival guide (tidbits): Radio ออก silhouette 1 ข้อ + effusion/pneumothorax 1 ข้อจาก blunting ของ costophrenic angle ที่เหลือเป็น anatomy", "Lung &amp; bronchial tree: \"ออกอะไรก็ได้ อ่านให้หมด\"; Spot: ดูคลิปผ่าอาจารย์ + อ่าน Rohen"], "say": "If the right heart border disappears, think middle lobe; if the costophrenic angle is blunt, think fluid.", "say_th": "ขอบหัวใจขวาหาย นึกถึง middle lobe; มุม costophrenic ทื่อ นึกถึงน้ำ"}, {"t": "s", "id": "P-S1", "title": "Lungs from the side", "instr": "Right and left lungs, lateral aspect. Name the lobes and fissures; notice the rib impressions.", "cad": {"src": "img/r/R257_0.jpg", "cap": "Rohen, Photographic Atlas 8e p.257"}, "cad2": null, "cmp": [{"src": "img/h/rs3_lung_013.jpg", "cap": "Handout p.13"}, {"src": "img/t/p1_043.jpg", "cap": "RS I tidbits board (peer summary)"}], "labels": [["1", "Apex of lung"], ["2", "Upper lobe of right lung"], ["3", "Horizontal fissure of right lung"], ["4", "Oblique fissure of right lung"], ["5", "Middle lobe of right lung"], ["6", "Lower lobe of right lung"], ["7", "Inferior border"], ["8", "Upper lobe of left lung"], ["9", "Impressions of ribs"], ["10", "Oblique fissure of left lung"], ["11", "Lower lobe of left lung"]], "note": "", "rel": ["Horizontal fissure (3) meets the oblique fissure (4) in the mid-axillary line on the right", "Left lung has only an oblique fissure (10) separating upper (8) and lower (11) lobes", "Middle lobe (5) is a wedge in front"], "refs": "Rohen 8e p.257 · Handout p.13", "vid": null, "tn": ["ให้นักเรียนบอกว่าเป็นปอดซ้าย
