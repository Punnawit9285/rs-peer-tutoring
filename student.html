      '<li><b>Four functions</b>: (1) secrete {{lipoprotein}} that helps surfactant prevent luminal adhesion, (2) act as {{stem-cell-like}} progenitors, (3) {{detoxify}} inhaled xenobiotics, and (4) secrete biomarker {{CC16}} (secretory protein).</li>' +
      '<li><b>Respiratory bronchioles</b> (start of gas exchange): cuboidal wall interrupted by outpocketing alveoli. Clinical airway disorders include bronchitis, COPD, and asthma.</li></ul></div>' +
      CVS.fig('histo-clara', 'Terminal bronchiole epithelium showing non-ciliated apical projections among ciliated cells.', 'histo', 24) + '</div>' },
  { t: 'q', id: 'H7', src: 'Histology p.24', core: true,
    q: 'Which statement correctly describes Club (Clara) cells in the terminal bronchioles?',
    o: ['Dome-shaped cells with short microvilli that secrete surfactant-helping lipoprotein, detoxify toxins, act as stem-like cells, and produce biomarker CC16', 'Simple squamous cells that cover 90–95% of the alveolar surface area for gas exchange', 'Mucus-secreting goblet cells that proliferate in the nasal vestibule', 'Phagocytic macrophages derived from blood monocytes that clear carbon particles', 'Ciliated pseudostratified cells that secrete serous fluid into Bowman glands'], a: 0,
    ex: 'Clara (Club) cells are dome-shaped non-ciliated cells with short microvilli in terminal and respiratory bronchioles; they secrete surfactant-helping lipoprotein, act as stem-like cells, detoxify, and release biomarker CC16.' },
  { t: 'tf', id: 'H8', src: 'Histology p.2, 24–26',
    q: 'Terminal bronchioles are the final segment of the air-conducting portion, whereas respiratory bronchioles mark the beginning of the respiratory portion.', a: true,
    ex: 'True: the conducting portion runs from the nose to the terminal bronchioles; gas exchange begins in the respiratory bronchioles where alveoli first appear in the wall.' },

  { t: 'c', id: 'H-C4', title: 'Alveolar ducts, alveoli, pneumocytes, dust cells and pores of Kohn', src: 'Histology p.30–40',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Alveolar ducts &amp; sacs</b>: lined by {{simple squamous}} epithelium with smooth muscle knobs at alveolar openings.</li>' +
      '<li><b>Pneumocyte Type I</b>: flattened squamous cells making up {{40%}} of alveolar cells but covering {{90–95%}} of the surface area for gas exchange.</li>' +
      '<li><b>Pneumocyte Type II</b> (septal cell): {{simple cuboidal}} cells with lamellar bodies making up {{60%}} of cells but only {{5–10%}} of surface area; synthesize {{pulmonary surfactant}} (lowering surface tension by Laplace law) and divide as progenitors for Type I and II cells.</li>' +
      '<li><b>Dust cells</b>: {{alveolar macrophages}} in the septa and airspaces.</li>' +
      '<li><b>Pores of Kohn</b>: inter-alveolar openings providing {{collateral circulation}} to equalize pressure and prevent {{atelectasis}} (lung collapse).</li>' +
      '<li><b>Alveolar pathology</b>: infant {{RDS}} (surfactant deficiency), emphysema, pulmonary edema, lobar pneumonia, and pneumoconioses (anthracosis, silicosis, asbestosis).</li></ul></div>' +
      CVS.fig('histo-alveoli', 'Type II pneumocyte secreting lamellar bodies, with Laplace law and alveolar stability.', 'histo', 35) + '</div>' },
  { t: 'q', id: 'H9', src: 'Histology p.33, 35', core: true,
    q: 'How do Alveolar Type I and Type II pneumocytes compare in cell number and surface coverage?',
    o: ['Type I is 40% of cells and covers 90–95% of surface area; Type II is 60% of cells and covers 5–10% of surface area', 'Type I is 90–95% of cells and covers 40% of surface area; Type II is 5–10% of cells and covers 60% of surface area', 'Type I and Type II each represent 50% of cells and 50% of surface area', 'Type I is simple cuboidal and secretes surfactant; Type II is simple squamous for gas exchange', 'Type I is 60% of cells and covers 90–95% of surface area; Type II is 40% of cells and covers 5–10% of surface area'], a: 0,
    ex: 'Classic exam trap: Type II cells are more numerous (60% of total cells vs 40% for Type I), but because Type I cells are thin simple squamous sheets, Type I covers 90–95% of the alveolar surface area while cuboidal Type II covers only 5–10%.' },
  { t: 'q', id: 'H10', src: 'Histology p.37–38', core: true,
    q: 'What is the physiological role of the pores of Kohn?',
    o: ['Connect adjacent alveoli to provide collateral ventilation and prevent atelectasis', 'Secrete pulmonary surfactant to reduce alveolar surface tension', 'Drain lymphatic fluid from the visceral pleura into the hilum', 'Allow dust cells to exit the capillary lumen directly into bronchi', 'Anchor the C-shaped cartilage rings of the trachea to the esophagus'], a: 0,
    ex: 'Pores of Kohn connect adjacent alveoli, permitting collateral air circulation that prevents obstructive atelectasis when a small bronchiole is plugged.' },
  { t: 'tf', id: 'H11', src: 'Histology p.33',
    q: 'Alveolar Type I pneumocytes outnumber Type II pneumocytes in total cell count.', a: false,
    ex: 'False: Type I pneumocytes make up 40% of alveolar epithelial cells (though they cover 90–95% of the surface), whereas Type II pneumocytes make up 60% of the cells (covering 5–10% of the surface).' },

  { t: 'c', id: 'H-C5', title: 'The air-blood barrier and the lung pleurae', src: 'Histology p.41–45',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Five layers of the air-blood barrier</b> (from alveolar lumen to erythrocyte, p.42):' +
      '<ol><li>{{Alveolar fluid}} + {{surfactant}} layer</li>' +
      '<li>{{Alveolar epithelium}} (Type I pneumocyte cytoplasm)</li>' +
      '<li>Fused {{basal lamina x 2}} (of epithelial and endothelial layers)</li>' +
      '<li>Capillary {{endothelium}}</li>' +
      '<li>{{Plasma membrane}} of the {{red blood cell}} (RBC)</li></ol></li>' +
      '<li><b>Lung pleurae</b> (visceral and parietal): serous membranes lined by {{mesothelium}} (simple squamous) over connective tissue that produces {{lubricant fluid}}.</li>' +
      '<li><b>Pleural pathology</b>: pneumothorax, hydrothorax, hemothorax, and asbestos-related {{mesothelioma}}.</li></ul></div>' +
      CVS.fig('histo-barrier', 'Structure of the alveolocapillary (air-blood) barrier between alveolar air and capillary blood.', 'histo', 41) + '</div>' },
  { t: 'q', id: 'H12', src: 'Histology p.42', core: true,
    q: 'In the lecture slide on the air-blood barrier, which five components are traversed by oxygen moving from the alveolus into the red blood cell?',
    o: ['Alveolar fluid + surfactant, alveolar epithelium, basal lamina x 2, capillary endothelium, and RBC plasma membrane', 'Goblet cell mucus, pseudostratified epithelium, thick basement membrane, smooth muscle, and adventitia', 'Clara cell lipoprotein, simple cuboidal epithelium, elastic cartilage, endothelium, and platelets', 'Visceral mesothelium, pleural fluid, parietal mesothelium, endothoracic fascia, and capillary wall', 'Alveolar macrophage, Type II pneumocyte, reticular fibers, pericyte, and WBC membrane'], a: 0,
    ex: 'Slide 42 lists the 5 components in order: (1) alveolar fluid + surfactant, (2) alveolar epithelium, (3) basal lamina x 2, (4) endothelium, and (5) plasma membrane of RBC.' },
  { t: 'open', id: 'H13', src: 'Histology p.43–45',
    q: 'What epithelium lines the visceral and parietal pleurae, what is its normal physiological function, and what malignant tumor arises from it?',
    ans: 'The visceral and parietal pleurae are serous membranes lined by mesothelium (simple squamous epithelium). It produces serous lubricant fluid so the two pleural layers glide frictionlessly during breathing; malignant transformation (classically linked to asbestos exposure) causes mesothelioma.' }
]});

/* Section G: Gas phase, partial pressures & gas-liquid equilibrium (Gas phase handout, slides 1–30). */
CVS.add({ id: 'G', short: 'Gas phase', title: 'Gas Phase, Partial Pressures & Gas-Liquid Equilibrium', kind: 'Lecture',
  blurb: 'STP/STPD/BTPS conventions, ideal and real gas laws, respiratory humidification, Dalton law, the alveolar gas equation, Graham and Henry laws, and clinical oxygen cylinders and delivery devices.',
  items: [
  { t: 'c', id: 'G-C1', title: 'Standard conditions (STP, STPD, BTPS) and the gas laws', src: 'Gas phase p.3–13',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>STP</b>: {{273.25 K}} (0 °C) and absolute pressure {{101.3 kPa}} (1 bar = 1 atm = {{760 mmHg}} = 14.9 psi). <b>STPD</b>: 0 °C (273 K), 1 atm, and {{dry}} (no water vapor).</li>' +
      '<li><b>BTPS</b>: body temperature ({{37 °C}} = 310 K), ambient pressure, and gas {{saturated with water vapor}} (P<sub>H2O</sub> = 47 mmHg).</li>' +
      '<li><b>Boyle law</b> (constant T): {{P1V1 = P2V2}}. <b>Charles law</b> (constant P): {{V1/T1 = V2/T2}} (extrapolates to zero volume at -273 °C). <b>Gay-Lussac law</b> (constant V): P<sub>1</sub>/T<sub>1</sub> = P<sub>2</sub>/T<sub>2</sub>.</li>' +
      '<li><b>Avogadro law</b>: 1 mole (6.02 &times; 10<sup>23</sup> molecules) occupies {{22.4 L}} at STP.</li>' +
      '<li><b>Ideal gas law</b>: {{PV = nRT}}, with R = {{0.082}} L&middot;atm/(K&middot;mol) = {{8.314}} J/(K&middot;mol).</li>' +
      '<li><b>Real gases &amp; CO<sub>2</sub> cylinders</b>: real gases deviate from PV/RT = 1 at high pressure; a liquid CO<sub>2</sub> cylinder at 20 °C has a vapor pressure of {{830 psi}} (56.5 atm) below its critical temperature (31 °C).</li></ul></div>' +
      CVS.fig('gas-compress', 'Compressibility factor (PV/RT) of five real gases at 0 °C compared with an ideal gas.', 'gas', 11) + '</div>' },
  { t: 'q', id: 'G1', src: 'Gas phase p.5', core: true,
    q: 'In pulmonary physiology, how is BTPS defined?',
    o: ['Body temperature (37 °C), ambient pressure, and gas saturated with water vapor (PH2O = 47 mmHg)', 'Standard temperature (0 °C), 760 mmHg, and completely dry gas', 'Room temperature (20 °C), 101.3 kPa, and 50% relative humidity', 'Body temperature (37 °C), 1 atm pressure, and zero water vapor', '273.25 K, 14.9 psi, and saturated with water vapor'], a: 0,
    ex: 'BTPS stands for Body Temperature (37 °C), ambient Pressure, and Saturated with water vapor (PH2O = 47 mmHg). STPD is 0 °C (273 K), 760 mmHg, and Dry.' },
  { t: 'q', id: 'G2', src: 'Gas phase p.9–10', core: true,
    q: 'According to Avogadro’s law and the ideal gas equation (PV = nRT), 1 mole of an ideal gas at STP occupies what volume, and what are the two values of the gas constant R given in the lecture?',
    o: ['22.4 L; R = 0.082 L·atm/(K·mol) or 8.314 J/(K·mol)', '44.8 L; R = 8.314 L·atm/(K·mol) or 0.082 J/(K·mol)', '22.4 L; R = 1.987 L·atm/(K·mol) or 760 J/(K·mol)', '10.0 L; R = 0.082 L·atm/(K·mol) or 101.3 J/(K·mol)', '24.0 L; R = 0.2093 L·atm/(K·mol) or 47 J/(K·mol)'], a: 0,
    ex: 'At STP (0 °C, 1 atm), 1 mole of any ideal gas contains 6.02 × 10^23 molecules and occupies 22.4 L; R = 0.082 L·atm/(K·mol) = 8.314 J/(K·mol).' },
  { t: 'tf', id: 'G3', src: 'Gas phase p.7',
    q: 'In Charles’s law, the volume of a fixed mass of gas at constant pressure is directly proportional to its Celsius temperature.', a: false,
    ex: 'False: volume at constant pressure is directly proportional to absolute (Kelvin) temperature (K = °C + 273), not Celsius; the V–T line crosses zero volume at −273 °C (0 K).' },

  { t: 'c', id: 'G-C2', title: 'Dalton law, airway humidification and the O2/CO2 cascade', src: 'Gas phase p.15–20',
    html: '<div class="tblwrap"><table class="tbl"><thead><tr><th>Gas</th><th>Dry atmospheric air (mmHg)</th><th>Moist bronchial air (mmHg)</th><th>Alveolar air (mmHg)</th></tr></thead><tbody>' +
      '<tr><td><b>O<sub>2</sub> (20.93% dry)</b></td><td>{{159.1}}</td><td>{{149.2}}</td><td>{{101.2}}</td></tr>' +
      '<tr><td><b>CO<sub>2</sub> (0.03–0.04% dry)</b></td><td>0.3</td><td>0.3</td><td>{{40.0}}</td></tr>' +
      '<tr><td><b>H<sub>2</sub>O vapor</b></td><td>0.0</td><td>{{47.0}}</td><td>{{47.0}}</td></tr>' +
      '<tr><td><b>N<sub>2</sub> (79.03% dry)</b></td><td>600.6</td><td>{{563.5}}</td><td>571.8</td></tr>' +
      '<tr><td><b>Total</b></td><td>760.0</td><td>760.0</td><td>760.0</td></tr></tbody></table></div>' +
      '<ul class="pts"><li><b>Isothermic saturation boundary</b> (just below the carina): inspired air reaches {{37 °C}}, {{100%}} relative humidity, and {{44 mg/L}} water content, exerting P<sub>H2O</sub> = 47 mmHg.</li>' +
      '<li><b>Humidified tracheal P<sub>O2</sub></b>: F<sub>iO2</sub> &times; (P<sub>B</sub> &minus; P<sub>H2O</sub>) = 0.2093 &times; (760 &minus; 47) = 0.2093 &times; {{713}} mmHg.</li></ul>' +
      '<div class="two">' + CVS.fig('gas-humid', 'Airway warming and humidification from the nose to the isothermic saturation boundary below the carina.', 'gas', 16) +
      CVS.fig('gas-cascade', 'Partial pressures of O2, CO2, H2O, and N2 from dry air through moist bronchial air to alveolar gas and blood.', 'gas', 20) + '</div>' },
  { t: 'q', id: 'G4', src: 'Gas phase p.16–17', core: true,
    q: 'When dry atmospheric air at sea level (PB = 760 mmHg, FiO2 = 0.2093) is warmed to 37 °C and fully humidified in the conducting airways, what is the moist bronchial PO2?',
    o: ['149.2 mmHg', '159.1 mmHg', '101.2 mmHg', '112.1 mmHg', '99.2 mmHg'], a: 0,
    ex: 'Water vapor at 37 °C (100% RH, 44 mg/L) exerts 47 mmHg, leaving 760 − 47 = 713 mmHg for dry gases: PO2(humidified) = 0.2093 × 713 = 149.2 mmHg.' },
  { t: 'q', id: 'G5', src: 'Gas phase p.16', core: true,
    q: 'At the isothermic saturation boundary just below the carina, what are the temperature, relative humidity, absolute water content, and water vapor pressure of inspired gas?',
    o: ['37 °C, 100% RH, 44 mg/L, and PH2O = 47 mmHg', '34 °C, 100% RH, 36–40 mg/L, and PH2O = 40 mmHg', '37 °C, 80% RH, 28 mg/L, and PH2O = 37 mmHg', '22 °C, 50% RH, 10 mg/L, and PH2O = 19 mmHg', '37 °C, 100% RH, 100 mg/L, and PH2O = 100 mmHg'], a: 0,
    ex: 'At the isothermic saturation boundary (just below the carina), gas is at body temperature (37 °C), 100% relative humidity, 44 mg/L water content, and PH2O = 47 mmHg.' },
  { t: 'tf', id: 'G6', src: 'Gas phase p.17–19',
    q: 'Humidification of inspired air in the upper respiratory tract lowers the partial pressure of oxygen before any alveolar gas exchange occurs.', a: true,
    ex: 'True: adding 47 mmHg of water vapor dilutes the total dry gas pressure from 760 to 713 mmHg, dropping PO2 from 159.1 mmHg to 149.2 mmHg in the conducting airways.' },

  { t: 'c', id: 'G-C3', title: 'The alveolar gas equation and Graham law of diffusion', src: 'Gas phase p.21–26',
    html: '<div class="stack"><ul class="pts">' +
      '<li><b>Full alveolar gas equation</b>: P<sub>AO2</sub> = F<sub>iO2</sub>(P<sub>B</sub> &minus; P<sub>H2O</sub>) &minus; P<sub>aCO2</sub>/{{R}} + {{F}}, where P<sub>ACO2</sub> &approx; {{PaCO2}} (40 mmHg).</li>' +
      '<li><b>Respiratory exchange ratio (R)</b>: V&#775;<sub>CO2</sub> / V&#775;<sub>O2</sub> = {{183}} / {{230}} = 0.797 &approx; {{0.8}}.</li>' +
      '<li><b>Correction factor (F)</b>: accounts for N<sub>2</sub> concentration difference when R &ne; 1; normally about {{2}} mmHg (&lt;3 mmHg). Including F: P<sub>AO2</sub> = 149.2 &minus; 40/0.8 + 2 = 101.2 mmHg; ignoring F gives {{99.2 mmHg}}.</li>' +
      '<li><b>Clinical Beachey formulas</b>: when F<sub>iO2</sub> &le; {{0.6}}, P<sub>AO2</sub> = F<sub>iO2</sub>(P<sub>B</sub> &minus; 47) &minus; P<sub>aCO2</sub> &times; {{1.2}} (= 101.2 mmHg on room air); when F<sub>iO2</sub> &gt; 0.6, F drops out and P<sub>AO2</sub> = F<sub>iO2</sub>(P<sub>B</sub> &minus; 47) &minus; P<sub>aCO2</sub>.</li>' +
      '<li><b>Graham law of diffusion</b>: at constant T and P, the diffusion rate of a gas is inversely proportional to the {{square root}} of its molecular weight (R<sub>1</sub>/R<sub>2</sub> = &radic;(M<sub>2</sub>/M<sub>1</sub>)).</li></ul></div>' },
  { t: 'q', id: 'G7', src: 'Gas phase p.21–24', core: true,
    q: 'A patient breathes room air at sea level (PB = 760 mmHg, PH2O = 47 mmHg, FiO2 = 0.2093) with PaCO2 = 40 mmHg and R = 0.8. What is PAO2 using the lecture equation with F = 2 mmHg (or the FiO2 ≤ 0.6 clinical formula), and what is PAO2 if F is omitted?',
    o: ['101.2 mmHg with F (or × 1.2 formula); 99.2 mmHg without F', '149.2 mmHg with F; 109.2 mmHg without F', '99.2 mmHg with F; 101.2 mmHg without F', '105.0 mmHg with F; 95.0 mmHg without F', '80.0 mmHg with F; 78.0 mmHg without F'], a: 0,
    ex: '0.2093 × (760 − 47) = 149.2 mmHg. Subtracting 40/0.8 = 50 gives 99.2 mmHg (simplified equation without F). Adding F = 2 mmHg (or subtracting 40 × 1.2 = 48) gives 101.2 mmHg.' },
  { t: 'q', id: 'G8', src: 'Gas phase p.22, 24', core: true,
    q: 'According to the clinical modification of the alveolar gas equation in the lecture, how does the formula change when FiO2 exceeds 0.6?',
    o: ['PAO2 = FiO2(PB − PH2O) − PaCO2 (PaCO2 is no longer multiplied by 1.2)', 'PAO2 = FiO2(PB − PH2O) − PaCO2 × 2.0', 'Water vapor pressure (47 mmHg) is omitted from the equation', 'PaCO2 is added to FiO2(PB − PH2O) instead of subtracted', 'R increases from 0.8 to 2.0'], a: 0,
    ex: 'As FiO2 rises above 0.6, the nitrogen correction factor diminishes; the lecture specifies using PAO2 = FiO2(PB − water vapor) − (PaCO2) × 1.2 for FiO2 ≤ 0.6, and PAO2 = FiO2(PB − water vapor) − PaCO2 for FiO2 > 0.6.' },
  { t: 'tf', id: 'G9', src: 'Gas phase p.26',
    q: 'According to Graham’s law, in the gas phase carbon dioxide (MW 44) diffuses faster than oxygen (MW 32) because of its larger molecular weight.', a: false,
    ex: 'False: by Graham’s law (R1/R2 = sqrt(M2/M1)), a heavier gas diffuses slightly slower in the gas phase. (CO2 diffuses ~20× faster across liquid/tissue membranes only because its Henry’s law solubility is ~23× higher.)' },

  { t: 'c', id: 'G-C4', title: 'Henry law, gas solubility in blood, and oxygen cylinders & delivery', src: 'Gas phase p.27–30',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Henry law</b>: {{C = &alpha;P}} (dissolved gas concentration equals solubility coefficient &alpha; times partial pressure P).</li>' +
      '<li><b>Oxygen solubility in blood</b> (38 °C): &alpha;<sub>O2</sub> = {{0.00302}} mL O<sub>2</sub> / dL blood / mmHg (or {{0.023}} mL O<sub>2</sub> / mL blood at 760 mmHg).</li>' +
      '<li><b>Plasma solubilities</b> (38 °C, 1 atm, mL gas/mL): CO<sub>2</sub> = {{0.490}} vs O<sub>2</sub> = {{0.021}} (&sim;23&times; more soluble); N<sub>2</sub> = {{0.0127}}.</li>' +
      '<li><b>Total blood gas content</b>: [gas]<sub>total</sub> = [gas]<sub>dissolved</sub> + [gas]<sub>bound</sub> + [gas]<sub>chemically modified</sub>.</li>' +
      '<li><b>Oxygen tank conversion factors</b>: D = {{0.16 L/psi}} (2000 psi &rarr; {{320 L}}), E = {{0.28 L/psi}}, G = {{2.41 L/psi}}.</li>' +
      '<li><b>Delivery devices</b>: nasal cannula at {{2–6 L/min}} gives F<sub>iO2</sub> {{0.28–0.44}} (&gt;6 L/min irritates nasal mucosa); simple face mask at 3–8 L/min gives F<sub>iO2</sub> 0.30–0.80.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('gas-henry', 'Henry law and solubility coefficients of O2, CO2, N2, and CO in water, plasma, red cells, and whole blood.', 'gas', 28) +
      CVS.fig('gas-o2tank', 'Medical oxygen cylinders (G, M, D, E) with tank factors and flow/FiO2 ranges for nasal cannula and face mask.', 'gas', 30) + '</div></div>' },
  { t: 'q', id: 'G10', src: 'Gas phase p.28', core: true,
    q: 'Using Henry’s law (αO2 = 0.003 mL O2 / dL blood / mmHg), how much physically dissolved oxygen is present in arterial blood with PaO2 = 100 mmHg, and how does CO2 solubility in plasma compare with O2?',
    o: ['0.3 mL O2 / dL blood; CO2 is about 23 times more soluble in plasma than O2 (0.490 vs 0.021)', '3.0 mL O2 / dL blood; O2 is about 20 times more soluble in plasma than CO2', '0.003 mL O2 / dL blood; CO2 and O2 have identical plasma solubility', '20.0 mL O2 / dL blood; N2 is more soluble in plasma than both O2 and CO2', '0.023 mL O2 / dL blood; CO is 50 times more soluble in water than CO2'], a: 0,
    ex: 'At PaO2 = 100 mmHg, dissolved O2 = 0.003 × 100 = 0.3 mL O2/dL blood. In plasma at 38 °C and 1 atm, αCO2 = 0.490 vs αO2 = 0.021 mL/mL (~23-fold higher for CO2).' },
  { t: 'tf', id: 'G11', src: 'Gas phase p.30',
    q: 'A size D oxygen cylinder compressed to 2000 psi (tank factor 0.16 L/psi) holds approximately 320 L of oxygen, and a nasal cannula is normally run at 2–6 L/min (FiO2 0.28–0.44) because flows above 6 L/min irritate the nasal mucosa.', a: true,
    ex: 'True: 2000 psi × 0.16 L/psi = 320 L. Nasal cannula flow is 2–6 L/min (FiO2 0.28–0.44); >6 L/min dries and irritates the nasal epithelium.' },
  { t: 'open', id: 'G12', src: 'Gas phase p.30',
    q: 'A patient is transported with a size D oxygen cylinder at 2000 psi (tank factor 0.16 L/psi) delivering 4 L/min via nasal cannula. How many liters of O2 are in the cylinder, approximately how many minutes will it last, and what happens if nasal cannula flow is raised above 6 L/min?',
    ans: 'Volume = 2000 psi × 0.16 L/psi = 320 L of O2. At 4 L/min, the tank lasts approximately 320 / 4 = 80 minutes (for an E tank at 0.28 L/psi, 2000 psi = 560 L → 140 minutes; a G tank factor is 2.41 L/psi). Flows above 6 L/min via standard nasal cannula irritate and dry the nasal mucosa, so a face mask (3–8 L/min, FiO2 0.30–0.80) is used instead.' }
]});

/* Section M: Mechanics of breathing (Mechanics handout, slides 1–44). */
CVS.add({ id: 'M', short: 'Mechanics', title: 'Mechanics of Breathing: Pressures, Compliance, Resistance & Work', kind: 'Lecture',
  blurb: 'Inspiratory and expiratory muscles, pleural and alveolar pressures in spontaneous vs positive-pressure ventilation, surfactant and the lung-thorax relaxation curve, compliance, Poiseuille law and dynamic compression, breath sounds, and work of breathing.',
  items: [
  { t: 'c', id: 'M-C1', title: 'Respiratory muscles and pressures in spontaneous vs positive-pressure breathing', src: 'Mechanics p.1–12',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Architecture</b>: {{23}} airway generations ending in {{300 million}} alveoli with {{50 to 100 m2}} diffusing surface area.</li>' +
      '<li><b>Quiet inspiration</b>: {{diaphragm}} and {{external intercostals}} contract. <b>Maximal inspiration</b> adds {{sternocleidomastoid}}, {{serratus anterior}}, and {{scalenes}}.</li>' +
      '<li><b>Quiet expiration</b>: passive muscle relaxation. <b>Maximal expiration</b>: {{internal intercostals}} and abdominal muscles (rectus abdominis, external &amp; internal obliques) contract.</li>' +
      '<li><b>At rest (FRC = EELV)</b>: P<sub>A</sub> = {{0 cmH2O}}, P<sub>pl</sub> = {{-5 cmH2O}} (&minus;3.5 mmHg), transpulmonary pressure P<sub>L</sub> = P<sub>A</sub> &minus; P<sub>pl</sub> = {{+5 cmH2O}}.</li>' +
      '<li><b>Quiet inspiration</b> (Boyle law): P<sub>pl</sub> falls to &minus;8 to &minus;10 cmH<sub>2</sub>O, P<sub>A</sub> drops to {{-1 cmH2O}}, 500 mL flows in; during expiration P<sub>A</sub> rises to +1 cmH<sub>2</sub>O.</li>' +
      '<li><b>Positive-pressure ventilation (PPV)</b>: ventilator raises P<sub>ao</sub> above atmospheric (e.g. +30 cmH<sub>2</sub>O) so P<sub>pl</sub> rises (+5 cmH<sub>2</sub>O passive); if the patient also inspires actively (P<sub>pl</sub> = &minus;20), P<sub>L</sub> = 30 &minus; (&minus;20) = 50 cmH<sub>2</sub>O.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('mech-muscles', 'Muscles of inspiration (left) and muscles of expiration (right).', 'mech', 2) +
      CVS.fig('mech-cycle', 'Volume, intrapleural pressure, and alveolar pressure changes during a normal spontaneous breath.', 'mech', 9) + '</div></div>' +
      CVS.fig('mech-ppv', 'Pressures during passive positive-pressure ventilation compared with spontaneous breathing.', 'mech', 11) },
  { t: 'q', id: 'M1', src: 'Mechanics p.2–5', core: true,
    q: 'Which muscles contract during quiet inspiration, maximal inspiration, and maximal (forced) expiration?',
    o: ['Quiet inspiration: diaphragm & external intercostals; maximal inspiration adds sternocleidomastoid, serratus anterior & scalenes; maximal expiration: internal intercostals & abdominal muscles', 'Quiet inspiration: diaphragm & internal intercostals; maximal inspiration adds rectus abdominis; maximal expiration: external intercostals & scalenes', 'Quiet inspiration: sternocleidomastoid & scalenes; quiet expiration: internal intercostals; maximal expiration: diaphragm', 'Quiet inspiration: diaphragm only; quiet expiration: rectus abdominis & external obliques; maximal inspiration: internal intercostals', 'Quiet inspiration: external & internal intercostals; maximal inspiration: transversus abdominis; maximal expiration: serratus anterior'], a: 0,
    ex: 'Slide 5: quiet inspiration uses the diaphragm and external intercostals; maximal inspiration recruits sternocleidomastoid, serratus anterior, and scalenes; quiet expiration is passive relaxation; maximal expiration contracts the internal intercostals and abdominal muscles (rectus abdominis, external and internal obliques).' },
  { t: 'q', id: 'M2', src: 'Mechanics p.8–10', core: true,
    q: 'At the end of a normal quiet exhalation (at FRC / EELV, before the next inspiration begins), what are alveolar pressure (PA), intrapleural pressure (Ppl), and transpulmonary pressure (PL = PA − Ppl)?',
    o: ['PA = 0 cmH2O, Ppl = −5 cmH2O, and PL = +5 cmH2O', 'PA = −1 cmH2O, Ppl = −8 cmH2O, and PL = −7 cmH2O', 'PA = +5 cmH2O, Ppl = 0 cmH2O, and PL = +5 cmH2O', 'PA = 0 cmH2O, Ppl = +5 cmH2O, and PL = −5 cmH2O', 'PA = −5 cmH2O, Ppl = −5 cmH2O, and PL = 0 cmH2O'], a: 0,
    ex: 'At rest (FRC / EELV) with no airflow, PA equals atmospheric pressure (0 cmH2O), inward lung recoil against outward chest wall recoil creates Ppl = −5 cmH2O (−3.5 mmHg), and PL = PA − Ppl = 0 − (−5) = +5 cmH2O.' },
  { t: 'tf', id: 'M3', src: 'Mechanics p.11–12',
    q: 'During passive positive-pressure mechanical ventilation without patient respiratory effort, intrapleural pressure becomes more negative during inspiration just as in spontaneous breathing.', a: false,
    ex: 'False: during passive positive-pressure ventilation, positive airway pressure pushes the lungs and chest wall outward, making intrapleural pressure positive (e.g. from −5 to +5 cmH2O). Only when the patient makes a spontaneous inspiratory effort during PPV does Ppl become strongly negative.' },

  { t: 'c', id: 'M-C2', title: 'Elastic recoil, surface tension, surfactant and the relaxation curve', src: 'Mechanics p.13–19',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Lung elastic recoil</b> comes from tissue elastin/collagen fibers and alveolar liquid {{surface tension}}.</li>' +
      '<li><b>Surfactant</b> — mainly {{dipalmitoyl phosphatidylcholine}} ({{DPPC}}) from Type II cells — inserts hydrophobic tails at the air-water interface to lower interfacial tension and reduce lung elastic recoil.</li>' +
      '<li><b>Small vs large alveoli</b> (p.16): smaller alveoli have {{more surfactant per unit area}} than larger alveoli, giving smaller alveoli a {{lower elastic recoil force}} so they expand {{more easily}} during inspiration.</li>' +
      '<li><b>Thoracic elastic recoil</b>: at rest, the chest wall pulls {{outward}}, opposing the {{inward}} pull of the lungs.</li>' +
      '<li><b>Lung-thorax relaxation curve</b>: at {{FRC}} (~40% VC), lung pull equals chest wall pull in magnitude (net relaxation pressure = 0); the chest wall alone reaches its neutral position at ~60–70% VC, while an unsealed lung collapses to {{minimal air}}.</li></ul></div>' +
      CVS.fig('mech-relax', 'Lung-thorax relaxation pressure curve showing the balance of lung and chest wall recoil at FRC.', 'mech', 18) + '</div>' },
  { t: 'q', id: 'M4', src: 'Mechanics p.14, 16', core: true,
    q: 'According to the lecture (slide 16), why do small alveoli expand more readily than large alveoli during inspiration?',
    o: ['Small alveoli have a higher amount of surfactant (DPPC) per unit surface area, resulting in a lower elastic recoil force than large alveoli', 'Small alveoli have no surfactant and therefore generate a higher collapsing pressure', 'Large alveoli have thicker smooth muscle rings that prevent expansion', 'Intrapleural pressure is positive around small alveoli and negative around large alveoli', 'Small alveoli are lined solely by Type II cuboidal cells with no surface tension'], a: 0,
    ex: 'Slide 16 emphasizes that smaller alveoli have more surfactant per surface area than larger alveoli, making their elastic recoil force smaller than that of larger alveoli so their volume increases more during inspiration.' },
  { t: 'q', id: 'M5', src: 'Mechanics p.17–19', core: true,
    q: 'At functional residual capacity (FRC) on the lung-thorax relaxation pressure curve, how are the elastic recoil forces of the lungs and thoracic wall related, and what happens if the pleural space is unsealed (pneumothorax)?',
    o: ['Inward lung recoil is equal and opposite to outward thoracic recoil; unsealing the chest lets the lung collapse inward to minimal air while the chest wall springs outward', 'Both lung and chest wall recoil pull inward; unsealing the chest causes both to collapse', 'Both lung and chest wall are at zero recoil individually; unsealing the chest causes no volume change', 'Lung recoil pulls outward and chest wall recoil pulls inward; unsealing the chest hyperinflates the lung', 'Inward lung recoil is twice outward chest wall recoil; unsealing the chest collapses the rib cage'], a: 0,
    ex: 'At FRC (point B on slide 18), inward lung recoil equals outward thoracic recoil (combined pressure = 0). If the pleural seal is broken (slide 19), the unopposed lung collapses to minimal air while the chest wall expands toward its own equilibrium (~60–70% VC).' },
  { t: 'tf', id: 'M6', src: 'Mechanics p.14',
    q: 'Absence of pulmonary surfactant (dipalmitoyl phosphatidylcholine, DPPC) increases alveolar surface tension and increases the elastic recoil force of the lung.', a: true,
    ex: 'True: without surfactant (DPPC), water molecules attract strongly at the air-liquid interface, raising surface tension and lung elastic recoil force (making the lung stiff and prone to collapse).' },

  { t: 'c', id: 'M-C3', title: 'Lung and chest wall compliance (static vs dynamic)', src: 'Mechanics p.20–25',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Definition</b>: compliance {{C = &Delta;V / &Delta;P}} (in {{L/cmH2O}}), measuring distensibility ({{inversely proportional}} to elastic recoil). On the normal curve (p.20), &Delta;V = 0.5 L for &Delta;P<sub>TP</sub> = 2.5 cmH<sub>2</sub>O gives C<sub>L</sub> = {{0.2 L/cmH2O}}.</li>' +
      '<li><b>Combined lung-thorax compliance</b>: {{1/C(lung-thorax) = 1/C(lung) + 1/C(thorax)}}, so total system compliance (~0.1 L/cmH<sub>2</sub>O) is always less than either alone.</li>' +
      '<li><b>Static compliance</b>: measured during {{no airflow}} (breath-hold), reflecting pure elastic properties.</li>' +
      '<li><b>Dynamic compliance</b>: measured during {{active breathing}} at points of zero flow; influenced by both elastic recoil and airway resistance.</li>' +
      '<li><b>Disease shifts</b>: {{emphysema}} destroys alveolar walls &rarr; &darr; elastic recoil &rarr; {{increased compliance}} (curve shifts up/left); {{pulmonary fibrosis}} stiffens the lung &rarr; &uarr; elastic recoil &rarr; {{decreased compliance}} (curve shifts down/right).</li></ul></div>' +
      CVS.fig('mech-compliance', 'Static lung compliance curves in alveolar septal destruction, normal lung, and interstitial stiffening.', 'mech', 24) + '</div>' },
  { t: 'q', id: 'M7', src: 'Mechanics p.20, 22, 24', core: true,
    q: 'If isolated lung compliance is 0.2 L/cmH2O and thoracic wall compliance is 0.2 L/cmH2O, what is the combined lung-thorax compliance, and how does static lung compliance change in emphysema vs pulmonary fibrosis?',
    o: ['Combined compliance is 0.1 L/cmH2O; static compliance increases in emphysema and decreases in pulmonary fibrosis', 'Combined compliance is 0.4 L/cmH2O; static compliance decreases in emphysema and increases in pulmonary fibrosis', 'Combined compliance is 0.2 L/cmH2O; static compliance increases in both emphysema and pulmonary fibrosis', 'Combined compliance is 0.1 L/cmH2O; static compliance decreases in emphysema and increases in pulmonary fibrosis', 'Combined compliance is 0.04 L/cmH2O; static compliance is unchanged in both diseases'], a: 0,
    ex: '1/C_total = 1/C_lung + 1/C_thorax = 1/0.2 + 1/0.2 = 10, so C_total = 0.1 L/cmH2O. Emphysema destroys elastic septa (↓ recoil → ↑ compliance), whereas pulmonary fibrosis adds collagen (↑ recoil → ↓ compliance).' },
  { t: 'tf', id: 'M8', src: 'Mechanics p.24',
    q: 'Because compliance is directly proportional to lung elastic recoil force, a patient with emphysema has lower static lung compliance than normal.', a: false,
    ex: 'False: compliance is inversely proportional to elastic recoil (C ∝ 1 / elastic recoil). Emphysema destroys alveolar walls, reducing elastic recoil and increasing static lung compliance.' },
  { t: 'q', id: 'M9', src: 'Mechanics p.23, 25', core: true,
    q: 'How is static lung compliance distinguished experimentally from dynamic lung compliance?',
    o: ['Static compliance is measured during a breath-hold with no airflow, whereas dynamic compliance is measured during rhythmic breathing', 'Static compliance includes airway resistance, whereas dynamic compliance reflects only chest wall recoil', 'Static compliance is measured only during forced expiration, whereas dynamic compliance is measured at RV', 'Dynamic compliance uses esophageal pressure, whereas static compliance uses arterial blood pressure', 'Static compliance is higher in pulmonary fibrosis than in emphysema'], a: 0,
    ex: 'Static compliance is measured when airflow is interrupted (breath-hold) so resistive pressure drops are zero; dynamic compliance is measured during ongoing breathing.' },

  { t: 'c', id: 'M-C4', title: 'Airway resistance, radial traction and dynamic compression in COPD', src: 'Mechanics p.26–37',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Poiseuille law</b>: Flow = &Delta;P / R and {{R = 8&eta;l / (&pi;r4)}} — airway radius {{r to the fourth power}} is the dominant determinant of resistance.</li>' +
      '<li><b>Sites of airway resistance</b> (p.29): nose-mouth {{50%}}, glottis {{25%}}, trachea &amp; bronchi &gt;2 mm {{15%}}, small airways &lt;2 mm only {{10%}} because vast parallel branching gives huge {{total cross-sectional area}} (e.g. 180 cm<sup>2</sup> at generation 16 vs 2.54 cm<sup>2</sup> in trachea).</li>' +
      '<li><b>Inspiration vs forced expiration</b>: during inspiration, negative P<sub>pl</sub> and alveolar {{radial traction}} (mechanical tethering) pull airways open; during forced expiration, positive P<sub>pl</sub> (+25 cmH<sub>2</sub>O) causes {{dynamic compression}} when P<sub>pl</sub> exceeds intraluminal airway pressure.</li>' +
      '<li><b>COPD &amp; autonomic tone</b>: loss of elastic recoil in COPD/emphysema causes early airway closure and {{air trapping}} (dynamic hyperinflation); {{parasympathetic}} stimulation causes bronchoconstriction (&uarr; R) while {{sympathetic}} stimulation causes bronchodilation (&darr; R).</li></ul></div>' +
      '<div class="stack">' + CVS.fig('mech-resistance', 'Airway resistance vs airway generation and velocity vs aggregate cross-sectional area.', 'mech', 28) +
      CVS.fig('mech-compress', 'Passive vs forced expiration showing positive pleural pressure and dynamic airway compression.', 'mech', 31) + '</div></div>' },
  { t: 'q', id: 'M10', src: 'Mechanics p.26–29', core: true,
    q: 'Where is the largest share of airway resistance located in a healthy respiratory tract, and why do small airways (<2 mm diameter) contribute only about 10% of total resistance?',
    o: ['Upper airways (nose-mouth ~50%, glottis ~25%, bronchi >2 mm ~15%); small airways <2 mm contribute only ~10% because thousands of parallel branches create a huge total cross-sectional area', 'Terminal bronchioles (~80% of total resistance) because each individual tube has the smallest radius', 'Alveolar ducts (~60% of total resistance) because gas flow is turbulent there', 'Trachea (~75% of total resistance) because its cross-sectional area is 180 cm2', 'Small airways <2 mm (~50%) and nose-mouth (~10%) because Poiseuille’s law does not apply to bronchioles'], a: 0,
    ex: 'By Poiseuille’s law a single small bronchiole has high resistance, but because small airways (<2 mm) are arranged in tens of thousands of parallel branches with a huge aggregate cross-sectional area, they account for only ~10% of total resistance (while nose-mouth is 50%, glottis 25%, and airways >2 mm 15%).' },
  { t: 'q', id: 'M11', src: 'Mechanics p.30–31, 37', core: true,
    q: 'Why does forced expiration worsen airway narrowing and cause air trapping in a patient with COPD / emphysema?',
    o: ['High positive intrapleural pressure compresses non-cartilaginous airways whose intraluminal pressure drops rapidly due to low alveolar elastic recoil and loss of radial traction', 'Forced expiration makes intrapleural pressure strongly negative, sucking the airway walls together', 'Sympathetic discharge during forced expiration constricts bronchial smooth muscle', 'Surfactant is squeezed out of the trachea during forced expiration, collapsing the cricoid ring', 'Alveolar pressure becomes negative during forced expiration while pleural pressure stays at zero'], a: 0,
    ex: 'During forced expiration, Ppl becomes strongly positive (e.g. +25 cmH2O). In COPD/emphysema, loss of alveolar elastic recoil reduces the driving pressure (Palv = Pel + Ppl) and loss of radial tethering allows positive Ppl to collapse small airways early, trapping air.' },
  { t: 'tf', id: 'M12', src: 'Mechanics p.32',
    q: 'Parasympathetic nervous stimulation causes bronchial smooth muscle contraction (bronchoconstriction) and increases airway resistance, whereas sympathetic stimulation causes bronchodilation and decreases airway resistance.', a: true,
    ex: 'True: vagal parasympathetic fibers constrict bronchial smooth muscle (increasing resistance), whereas sympathetic beta-2 stimulation relaxes it (decreasing resistance).' },

  { t: 'c', id: 'M-C5', title: 'Airflow patterns, normal breath sounds and work of breathing', src: 'Mechanics p.38–44',
    html: '<div class="two"><div class="stack"><div class="tblwrap"><table class="tbl"><thead><tr><th>Breath sound</th><th>Insp : Exp &amp; pitch</th><th>Normal location</th></tr></thead><tbody>' +
      '<tr><td><b>Vesicular</b></td><td>{{Insp &gt; Exp}}, soft, low (&le;200 Hz)</td><td>{{Over most of both lungs}}</td></tr>' +
      '<tr><td><b>Bronchovesicular</b></td><td>Insp = Exp, medium pitch</td><td>{{1st–2nd ICS anteriorly}} &amp; between scapulae</td></tr>' +
      '<tr><td><b>Bronchial</b></td><td>{{Exp &gt; Insp}} (with gap), loud, high (&ge;400 Hz)</td><td>Over {{manubrium}}</td></tr>' +
      '<tr><td><b>Tracheal</b></td><td>Insp = Exp, very loud, high pitch</td><td>Over {{extrathoracic trachea}} in neck</td></tr></tbody></table></div>' +
      '<ul class="pts">' +
      '<li><b>Airflow regimes</b> (p.38): {{laminar flow}} in small peripheral airways (&Delta;P &propto; viscosity), {{turbulent flow}} in trachea/large airways at high flow (&Delta;P &propto; gas density), and {{transitional flow}} at branch points.</li>' +
      '<li><b>Work of breathing at rest</b> (Work = P &times; V, p.40): {{65%}} overcomes elastic resistance, {{25%}} overcomes airway resistance, and {{10%}} overcomes tissue viscous resistance.</li>' +
      '<li><b>Disease loops</b> (p.43): restrictive disease (pulmonary fibrosis) increases {{elastic work}}; obstructive disease (COPD) increases {{airway resistance work}} and active expiratory work.</li></ul></div>' +
      CVS.fig('mech-work', 'Pressure-volume work-of-breathing loops in restrictive lung disease (a) and obstructive lung disease (b).', 'mech', 43) + '</div>' },
  { t: 'q', id: 'M13', src: 'Mechanics p.40, 43', core: true,
    q: 'During quiet breathing at rest, what are the percentages of total work of breathing spent on elastic resistance, airway resistance, and tissue viscous resistance, and which component rises predominantly in pulmonary fibrosis vs COPD?',
    o: ['65% elastic, 25% airway resistance, 10% tissue viscosity; pulmonary fibrosis increases elastic work, whereas COPD increases airway resistance work', '25% elastic, 65% airway resistance, 10% tissue viscosity; pulmonary fibrosis increases airway resistance work, whereas COPD increases elastic work', '50% elastic, 50% airway resistance, 0% tissue viscosity; both diseases increase only tissue viscous work', '80% elastic, 10% airway resistance, 10% tissue viscosity; COPD reduces total work of breathing below normal', '10% elastic, 25% airway resistance, 65% tissue viscosity; pulmonary fibrosis decreases elastic work'], a: 0,
    ex: 'Slide 40: quiet breathing uses ~65% for elastic resistance, ~25% for airway resistance, and ~10% for tissue viscosity. Slide 43: pulmonary fibrosis increases elastic work (wider negative Ppl swing), while COPD increases resistive and active expiratory work.' },
  { t: 'open', id: 'M14', src: 'Mechanics p.38–39',
    q: 'Compare laminar, transitional, and turbulent airflow in the tracheobronchial tree, and state the normal auscultation site and inspiratory-to-expiratory relationship of vesicular vs bronchial breath sounds.',
    ans: 'Laminar flow occurs in small peripheral airways at low velocity and depends on gas viscosity; turbulent flow occurs in the trachea and large airways at high velocity and depends on gas density; transitional flow occurs at airway bifurcations and depends on both viscosity and density. Vesicular sounds are soft, low-pitched (≤200 Hz) with inspiration longer than expiration (Insp > Exp) heard over most of the lung fields; bronchial sounds are loud, high-pitched (≥400 Hz) with expiration longer than inspiration (Exp > Insp) and a silent gap, heard normally over the manubrium.' }
]});

/* Section E: Alveolar Ventilation, Diffusion, Perfusion Limitation & V/Q Matching (681114-1 Gas exchange.pdf, 72 pages). */
CVS.add({ id: 'E', short: 'Gas exchange', title: 'Alveolar Ventilation, Diffusion, Perfusion Limitation & V/Q Matching', kind: 'Lecture',
  blurb: 'Dalton and Henry laws, the partial pressure cascade and alveolar gas equation, Fick diffusion and DLCO, O2 content, perfusion vs diffusion limitation, regional V/Q differences, dead space, shunt, A-a gradient, and exercise ventilation.',
  items: [
  { t: 'c', id: 'E-C1', title: 'Partial pressure cascade, alveolar gas equation & alveolar ventilation', src: 'Gas exchange p.7–12, 15',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Dalton’s law</b> (P<sub>gas</sub> = P<sub>total</sub> &times; F<sub>gas</sub>): dry inspired air at sea level has P<sub>O2</sub> = 760 &times; 0.21 = {{160 mmHg}}.</li>' +
      '<li><b>Humidified tracheal air</b>: water vapor dilutes inspired air (P<sub>H2O</sub> = {{47 mmHg}} at 37&deg;C), so P<sub>IO2</sub> = (760 &minus; 47) &times; 0.21 = {{150 mmHg}}.</li>' +
      '<li><b>Alveolar gas equation</b>: P<sub>AO2</sub> = P<sub>IO2</sub> &minus; ({{PACO2 / R}}) + F. With normal respiratory quotient R = 0.8 and P<sub>ACO2</sub> = 40 mmHg, P<sub>AO2</sub> = 150 &minus; (40 / 0.8) = <b>100 mmHg</b> (103 mmHg on the shunt diagram). Macronutrient RQ: carbohydrates {{1.0}}, proteins ~0.8, fats {{0.7}}.</li>' +
      '<li><b>Physiologic shunt</b>: normal arterial P<sub>aO2</sub> is <b>97 mmHg</b> (slightly below P<sub>AO2</sub>) because <b>2%</b> of cardiac output bypasses alveolar capillaries via the {{bronchial}} artery and coronary {{thebesian}} veins.</li>' +
      '<li><b>Henry’s law</b>: dissolved [O<sub>2</sub>] = P<sub>O2</sub> &times; {{0.003}} mL O<sub>2</sub>/100 mL blood/mmHg (= 0.3 mL/dL at P<sub>aO2</sub> 100 mmHg; only free dissolved molecules generate partial pressure).</li>' +
      '<li><b>Alveolar ventilation</b>: V&#775;<sub>A</sub> = {{(TV &minus; DS) &times; RR}} (whereas minute ventilation = TV &times; RR).</li></ul></div>' +
      CVS.fig('exch-shunt-phys', 'Oxygen cascade from dry air to arterial blood, showing the 2% anatomic/physiologic shunt.', 'exch', 8) + '</div>' },
  { t: 'q', id: 'E1', src: 'Gas exchange p.7, 13', core: true,
    q: 'According to Dalton’s law, what is the partial pressure of oxygen (in mmHg) in <b>dry inspired air</b> at sea level?',
    o: ['160', '47', '100', '150', '200'], a: 0,
    ex: 'In dry inspired air at sea level (760 mmHg), PO2 = 760 × 0.21 = 160 mmHg. Once humidified in the trachea (PH2O = 47 mmHg), PIO2 drops to (760 − 47) × 0.21 = 150 mmHg; in alveoli PAO2 is ~100 mmHg.' },
  { t: 'q', id: 'E2', src: 'Gas exchange p.8–9', core: true,
    q: 'A healthy adult breathing room air at sea level (P<sub>IO2</sub> = 150 mmHg, P<sub>ACO2</sub> = 40 mmHg) switches from a pure carbohydrate diet (R = 1.0) to a pure fat diet (R = 0.7) without changing P<sub>ACO2</sub>. How does calculated P<sub>AO2</sub> change, and why is arterial P<sub>aO2</sub> still slightly lower than P<sub>AO2</sub>?',
    o: ['PAO2 decreases from 110 mmHg to ~93 mmHg; PaO2 is slightly lower due to the 2% physiologic shunt from bronchial and thebesian veins',
        'PAO2 increases from 93 mmHg to 110 mmHg; PaO2 is lower because water vapor dilutes arterial blood by 47 mmHg',
        'PAO2 remains fixed at 100 mmHg regardless of diet; PaO2 is lower due to anatomic dead space in the conducting airways',
        'PAO2 decreases from 160 mmHg to 150 mmHg; PaO2 is lower because 20% of cardiac output bypasses the lungs',
        'PAO2 increases from 100 mmHg to 150 mmHg; PaO2 is lower because hemoglobin oxidizes Fe2+ to Fe3+'], a: 0,
    ex: 'By the alveolar gas equation PAO2 = PIO2 − (PACO2 / R): at R = 1.0 (carbohydrate), PAO2 = 150 − 40/1.0 = 110 mmHg; at R = 0.7 (fat), PAO2 = 150 − 40/0.7 ≈ 93 mmHg. Normal PaO2 (~97 mmHg) is slightly below PAO2 (~103 mmHg) because 2% of cardiac output bypasses pulmonary capillaries via bronchial arteries and coronary thebesian veins (physiologic shunt).' },
  { t: 'tf', id: 'E3', src: 'Gas exchange p.15',
    q: 'According to Henry’s law, oxygen chemically bound to hemoglobin directly contributes to the partial pressure of oxygen (P<sub>O2</sub>) in arterial plasma.', a: false,
    ex: 'False. Only free, physically dissolved gas molecules contribute to partial pressure in blood (0.003 mL O2 per 100 mL plasma per mmHg PO2); chemically modified or Hb-bound O2 does not exert partial pressure.' },

  { t: 'c', id: 'E-C2', title: 'Fick’s law of diffusion, Graham’s law & DLCO', src: 'Gas exchange p.18–24, 41',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Blood–gas barrier</b> (alveolar epithelium, fused basement membrane, capillary endothelium): thickness T is as thin as {{0.3 &mu;m}} across a surface area A of {{50–100 m&sup2;}}.</li>' +
      '<li><b>Fick’s &amp; Graham’s laws</b>: V&#775;<sub>gas</sub> = [D &times; A &times; (P<sub>1</sub> &minus; P<sub>2</sub>)] / T = D<sub>L</sub> &times; (P<sub>1</sub> &minus; P<sub>2</sub>), where D<sub>L</sub> = (D &times; A) / T and diffusion coefficient D &prop; {{Solubility / &radic;MW}}.</li>' +
      '<li><b>CO<sub>2</sub> vs O<sub>2</sub></b>: CO<sub>2</sub> solubility in water is {{24.2 times}} higher than O<sub>2</sub> (0.592 vs 0.0244) while &radic;(44/32) is only 1.17&times; heavier, so CO<sub>2</sub> diffuses {{20 times}} faster than O<sub>2</sub> (relative D: O<sub>2</sub> = 1, CO<sub>2</sub> = 20, CO = 0.81, N<sub>2</sub> = 0.53, He = 0.25).</li>' +
      '<li><b>D<sub>LCO</sub> (T<sub>LCO</sub>)</b>: normal value is about {{25 mL/min/mmHg}} (normal range 80–120% predicted in men, 76–120% in women).</li>' +
      '<li><b>Low D<sub>LCO</sub> (&lt;80%)</b>: &downarrow; area ({{emphysema}}, lung resection), &uparrow; thickness (fibrosis), or false-low from &downarrow; gradient (smoking), &downarrow; perfusion ({{Valsalva maneuver}}, pulmonary embolism, pulmonary hypertension, extrapulmonary R-to-L shunt), or &downarrow; Hb (anemia).</li>' +
      '<li><b>High D<sub>LCO</sub> (&gt;120%)</b>: &uparrow; perfusion ({{M&uuml;ller’s maneuver}} [inhaling against a closed glottis], pulmonary hemorrhage, early congestion, L-to-R shunt, exercise, fever) or &uparrow; Hb ({{polycythemia}}).</li></ul></div>' +
      CVS.fig('exch-fick', 'Fick’s law of diffusion, diffusion coefficient (D), and lung diffusing capacity (DL).', 'exch', 24) + '</div>' },
  { t: 'q', id: 'E4', src: 'Gas exchange p.19, 25', core: true,
    q: 'An increase in which of the following factors will lead to a <b>decrease</b> in gas diffusion across the alveolar–capillary membrane?',
    o: ['Membrane thickness', 'Surface area', 'Solubility of gas', 'Diffusion coefficient', 'Partial pressure gradient of gas'], a: 0,
    ex: 'By Fick’s law, Vgas = [D × A × (P1 − P2)] / T. Membrane thickness (T) is in the denominator, so an increase in barrier thickness (e.g., pulmonary fibrosis) decreases gas diffusion, whereas increasing A, solubility, D, or (P1 − P2) increases diffusion.' },
  { t: 'q', id: 'E5', src: 'Gas exchange p.20–22',
    q: 'Why does carbon dioxide (MW 44) diffuse across the alveolar–capillary membrane approximately 20 times faster than oxygen (MW 32)?',
    o: ['The solubility of CO2 in water/plasma is 24.2 times greater than that of O2, outweighing its 1.17-fold higher square root of molecular weight',
        'The molecular weight of CO2 is smaller than that of O2, increasing its Graham’s law velocity 20-fold',
        'CO2 is actively pumped across type I pneumocytes by carbonic anhydrase at 20 times the passive rate of O2',
        'The alveolar–capillary partial pressure gradient for CO2 (46 − 40 = 6 mmHg) is 20 times larger than that for O2',
        'CO2 binds to ferrous iron (Fe2+) 20 times faster than O2'], a: 0,
    ex: 'Graham’s law gives D ∝ Solubility / √MW. At 37°C, CO2 solubility (0.592) is 24.2 times higher than O2 solubility (0.0244), while √(44/32) ≈ 1.17; 24.2 / 1.17 ≈ 20.7, so CO2 diffuses ~20 times faster than O2.' },
  { t: 'q', id: 'E6', src: 'Gas exchange p.41', core: true,
    q: 'Which pair correctly matches a condition that causes a <b>high D<sub>LCO</sub> (&gt;120% predicted)</b> with a condition that causes a <b>low D<sub>LCO</sub> (&lt;80% predicted)</b>?',
    o: ['High DLCO: Müller’s maneuver or alveolar hemorrhage · Low DLCO: Valsalva maneuver or emphysema',
        'High DLCO: Valsalva maneuver or anemia · Low DLCO: Müller’s maneuver or polycythemia',
        'High DLCO: pulmonary embolism or fibrosis · Low DLCO: exercise or left-to-right shunt',
        'High DLCO: emphysema or smoking · Low DLCO: polycythemia or early pulmonary congestion',
        'High DLCO: pulmonary resection · Low DLCO: fever or exercise'], a: 0,
    ex: 'DLCO rises (>120%) when pulmonary capillary blood volume or Hb increases: Müller’s maneuver (inhaling against a closed glottis), alveolar hemorrhage, early congestion, L-to-R shunt, exercise, fever, or polycythemia. DLCO falls (<80%) with reduced area (emphysema, resection), thickened barrier (fibrosis), reduced perfusion (Valsalva maneuver, PE, pulmonary hypertension), anemia, or smoking.' },

  { t: 'c', id: 'E-C3', title: 'O2 content, capillary transit time & perfusion vs diffusion limitation', src: 'Gas exchange p.26–32, 36–40',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Total O<sub>2</sub> content</b> = (Hb &times; {{1.34}} &times; S<sub>O2</sub>) + (P<sub>O2</sub> &times; 0.003). At normal [Hb] = 15 g/dL:</li>' +
      '<li><b>Arterial blood</b> (S<sub>aO2</sub> 100%, P<sub>aO2</sub> 100 mmHg): 20.1 + 0.3 = {{20.4 mL/dL}} (~20 mL/dL). <b>Venous blood</b> (S<sub>vO2</sub> 75%, P<sub>vO2</sub> 40 mmHg): 15.07 + 0.12 = {{15.19 mL/dL}} (~15 mL/dL). Thus 100 mL blood gains 5 mL O<sub>2</sub> (5 L/min CO &rarr; <b>250 mL O<sub>2</sub>/min</b>).</li>' +
      '<li><b>Capillary transit time</b>: RBCs spend {{0.75 s}} in the pulmonary capillary at rest (HR 80 bpm). Normal O<sub>2</sub> equilibrates in {{0.25 s}} (<b>1/3</b> of transit time), leaving a 0.50 s safety margin.</li>' +
      '<li><b>{{Perfusion-limited}} exchange</b> (<b>N<sub>2</sub>O, CO<sub>2</sub>, and O<sub>2</sub> at rest</b>): gas equilibrates early along the capillary (N<sub>2</sub>O in {{0.075 s}} = 1/10 of transit time because it does not bind Hb); total transfer can only be increased by increasing pulmonary blood flow.</li>' +
      '<li><b>{{Diffusion-limited}} exchange</b> ({{Carbon monoxide (CO)}} always; <b>O<sub>2</sub> in emphysema, fibrosis, or strenuous exercise</b>): gas fails to equilibrate by the end of the capillary because CO binds tightly to Hb without raising dissolved plasma P<sub>CO</sub>, maintaining the partial pressure gradient throughout the capillary.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('exch-perf-lim', 'Early capillary equilibration of O2 and N2O (flow-dependent uptake).', 'exch', 37) + CVS.fig('exch-diff-lim', 'Uptake of CO and of O2 in lung disease across the capillary length.', 'exch', 38) + '</div></div>' },
  { t: 'q', id: 'E7', src: 'Gas exchange p.28–30', core: true,
    q: 'Given [Hb] = 15 g/dL, O<sub>2</sub> binding capacity = 1.34 mL O<sub>2</sub>/g Hb, and solubility = 0.003 mL/dL/mmHg, what are the total O<sub>2</sub> contents of normal arterial blood (P<sub>aO2</sub> = 100 mmHg, S<sub>aO2</sub> = 100%) and mixed venous blood (P<sub>vO2</sub> = 40 mmHg, S<sub>vO2</sub> = 75%), and how much O<sub>2</sub> is added to blood per minute at a cardiac output of 5 L/min?',
    o: ['Arterial 20.4 mL/dL · Venous 15.19 mL/dL · 250 mL O2/min added across the lungs',
        'Arterial 15.19 mL/dL · Venous 20.4 mL/dL · 500 mL O2/min added across the lungs',
        'Arterial 20.1 mL/dL · Venous 0.12 mL/dL · 1000 mL O2/min added across the lungs',
        'Arterial 100 mL/dL · Venous 40 mL/dL · 3000 mL O2/min added across the lungs',
        'Arterial 0.3 mL/dL · Venous 0.12 mL/dL · 9 mL O2/min added across the lungs'], a: 0,
    ex: 'Arterial O2 content = (15 × 1.34 × 1.00) + (100 × 0.003) = 20.1 + 0.3 = 20.4 mL/dL (~20 mL/dL). Venous O2 content = (15 × 1.34 × 0.75) + (40 × 0.003) = 15.07 + 0.12 = 15.19 mL/dL (~15 mL/dL). The arteriovenous difference is ~5 mL O2 per 100 mL blood, so 5000 mL/min of cardiac output picks up 50 × 5 = 250 mL O2/min.' },
  { t: 'q', id: 'E8', src: 'Gas exchange p.37–40', core: true,
    q: 'Which of the following gases is <b>always</b> diffusion-limited?',
    o: ['CO', 'CO2', 'N2O', 'O2 under normal condition', 'O2 with mild lung disease'], a: 0,
    ex: 'Carbon monoxide (CO) binds so avidly to hemoglobin that dissolved plasma PCO barely rises along the capillary; the alveolar-capillary partial pressure gradient is maintained all the way to the end of the capillary, making CO uptake always diffusion-limited (which is why DLCO measures diffusing capacity).' },
  { t: 'open', id: 'E9', src: 'Gas exchange p.31, 36–39',
    q: 'Compare the pulmonary capillary equilibration times of N<sub>2</sub>O, normal O<sub>2</sub>, and CO during the 0.75 s RBC transit time, and explain why N<sub>2</sub>O and CO behave at opposite extremes.',
    ans: 'N2O does not bind to hemoglobin, so dissolved plasma PN2O rises immediately and equilibrates with alveolar gas in 0.075 s (1/10 of the 0.75 s transit time), making N2O purely perfusion-limited. O2 binds to hemoglobin (which enters 75% saturated and takes up the remaining 25%), so plasma PO2 equilibrates in 0.25 s (1/3 of transit time) and is also perfusion-limited in healthy lungs at rest. CO binds tightly to hemoglobin with very high affinity, so almost no free CO accumulates in plasma, the partial pressure gradient is maintained for the entire 0.75 s, and CO never equilibrates (purely diffusion-limited).' },

  { t: 'c', id: 'E-C4', title: 'Regional ventilation, perfusion & V/Q ratio from apex to base', src: 'Gas exchange p.43–51',
    html: '<div class="two"><div class="stack"><div class="tblwrap"><table class="tbl"><thead><tr><th>Feature (upright lung)</th><th>Apex</th><th>Base</th></tr></thead><tbody>' +
      '<tr><td><b>Intrapleural pressure (P<sub>pl</sub>)</b></td><td>More negative ({{&minus;10 cmH2O}})</td><td>Less negative ({{&minus;2 cmH2O}})</td></tr>' +
      '<tr><td><b>Transpulmonary pressure</b></td><td>Greater (+10 cmH<sub>2</sub>O)</td><td>Lower (+2 cmH<sub>2</sub>O)</td></tr>' +
      '<tr><td><b>Resting alveolar size (at FRC)</b></td><td>{{Largest resting size}}</td><td>{{Smallest resting size}}</td></tr>' +
      '<tr><td><b>Alveolar compliance &amp; V&#775;<sub>A</sub></b></td><td>{{Less compliant}} &rarr; <b>less ventilation</b></td><td>{{More compliant}} &rarr; <b>more ventilation</b></td></tr>' +
      '<tr><td><b>Arterial pressure, PVR &amp; Q&#775;</b></td><td>Lower P<sub>a</sub>, higher PVR &rarr; <b>much less perfusion</b></td><td>Higher P<sub>a</sub>, lower PVR &rarr; <b>much more perfusion</b></td></tr>' +
      '<tr><td><b>V/Q ratio</b></td><td>{{Highest V/Q}} (&gt;1; wasted ventilation)</td><td>{{Lowest V/Q}} (&lt;0.8; relative underventilation)</td></tr></tbody></table></div>' +
      '<p class="note"><b>Overall normal V/Q</b>: with TV = 500 mL, DS = 150 mL, RR = 12/min, V&#775;<sub>A</sub> = (500 &minus; 150) &times; 12 = <b>4200 mL/min</b> and cardiac output Q&#775; = <b>5000 mL/min</b>, giving overall V/Q = 4200 / 5000 = {{0.84}} (normal range 0.8–1.0). In the supine position, blood flow becomes nearly uniform from apex to base (ventral vs dorsal).</p></div>' +
      CVS.fig('exch-vq-zones', 'Regional differences in ventilation, perfusion, and V/Q ratio from apex to base in the upright lung.', 'exch', 50) + '</div>' },
  { t: 'q', id: 'E10', src: 'Gas exchange p.43–44, 50, 52', core: true,
    q: 'Which of the following statements is correct regarding the <b>apex</b> of the upright lung compared with the base?',
    o: ['Larger baseline alveoli', 'More perfusion', 'More ventilation', 'Intrapleural pressure is less negative', 'Lower transpulmonary pressure'], a: 0,
    ex: 'At the apex of the upright lung, gravity makes intrapleural pressure more negative (−10 vs −2 cmH2O at the base), creating a larger resting transpulmonary pressure (10 vs 2 cmH2O) and larger baseline alveoli. Because these large alveoli sit on the flat upper part of the P-V curve, they are less compliant and receive less ventilation, while low hydrostatic pressure gives the apex even less perfusion (and thus the highest V/Q ratio).' },
  { t: 'q', id: 'E11', src: 'Gas exchange p.51, 53', core: true,
    q: 'What is the overall V/Q ratio of a patient with tidal volume (TV) 300 mL, dead space (DS) 100 mL, respiratory rate (RR) 10/min, and cardiac output (CO) 5 L/min?',
    o: ['0.4', '0.2', '0.6', '0.8', '1.0'], a: 0,
    ex: 'Alveolar ventilation = (TV − DS) × RR = (300 − 100) × 10 = 2000 mL/min. Pulmonary blood flow (CO) = 5000 mL/min. Therefore V/Q = 2000 / 5000 = 0.4.' },

  { t: 'c', id: 'E-C5', title: 'V/Q mismatch, dead space, shunt, A-a gradient & exercise ventilation', src: 'Gas exchange p.33, 56–68',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Dead space (V/Q = &infin;)</b>: ventilation without perfusion (Q = 0), so alveolar gas equilibrates with humidified inspired air (P<sub>AO2</sub> = {{150 mmHg}}, P<sub>ACO2</sub> = {{0 mmHg}}).</li>' +
      '<li><b>Anatomical dead space</b> (~150 mL, or 2 mL/kg) is measured by {{Fowler’s method}} (single-breath N<sub>2</sub> washout). <b>Physiological dead space</b> (anatomical + alveolar DS) is measured by <b>Bohr’s equation</b>: DS / TV = {{(PACO2 &minus; PECO2) / PACO2}}. Increased in PE, shock, emphysema, or positive-pressure ventilation.</li>' +
      '<li><b>Right-to-left shunt (V/Q = 0)</b>: perfusion without ventilation (V = 0), so end-capillary blood remains identical to mixed venous blood (P<sub>aO2</sub> = {{40 mmHg}}, P<sub>aCO2</sub> = {{46 mmHg}}). Caused by airway obstruction, fluid/pus/blood-filled alveoli, atelectasis, pulmonary AVM, hepatopulmonary syndrome, or intracardiac R-to-L shunt (Eisenmenger).</li>' +
      '<li><b>A–a gradient</b> (P<sub>AO2</sub> &minus; P<sub>aO2</sub>): normally 0–10 mmHg (~6 mmHg) or estimated by {{(Age / 4) + 4}}; increased in <b>R-to-L shunt, V/Q mismatch, and diffusion defect</b>.</li>' +
      '<li><b>Exercise ventilation</b>: abrupt onset increase driven by psychic stimuli and muscle/joint {{proprioceptors}}, brief pause, then gradual rise. In graded moderate exercise ({{isocapnic buffering}}), ventilation rises proportionally with CO<sub>2</sub> production so P<sub>aO2</sub>, P<sub>aCO2</sub>, and pH remain normal; in strenuous exercise, buffering of {{lactic acid}}, &uparrow; plasma K<sup>+</sup>, and &uparrow; temperature further stimulate ventilation.</li></ul></div>' +
      CVS.fig('exch-vq-mismatch', 'Gas tensions from pure shunt (V/Q = 0) through normal to pure dead space (V/Q = infinity).', 'exch', 61) + '</div>' },
  { t: 'q', id: 'E12', src: 'Gas exchange p.56–57', core: true,
    q: 'A patient with an acute pulmonary embolism has a tidal volume (TV) of 500 mL, alveolar P<sub>ACO2</sub> of 40 mmHg, and mixed expired P<sub>ECO2</sub> of 24 mmHg. Which method is used here, and what is the physiological dead space volume?',
    o: ['Bohr’s method · physiological dead space = 200 mL (DS/TV = 0.40)',
        'Fowler’s single-breath N2 washout · anatomical dead space = 150 mL (DS/TV = 0.30)',
        'Bohr’s method · physiological dead space = 300 mL (DS/TV = 0.60)',
        'Fick’s method · physiological dead space = 100 mL (DS/TV = 0.20)',
        'Dalton’s method · physiological dead space = 250 mL (DS/TV = 0.50)'], a: 0,
    ex: 'Bohr’s equation measures physiological dead space fraction: DS/TV = (PACO2 − PECO2) / PACO2 = (40 − 24) / 40 = 16 / 40 = 0.40. Multiplying by TV (500 mL) gives a physiological dead space of 200 mL (elevated above the normal 150 mL anatomical dead space because PE creates unperfused alveolar dead space). Fowler’s single-breath N2 washout measures anatomical dead space only.' },
  { t: 'q', id: 'E13', src: 'Gas exchange p.58–61', core: true,
    q: 'Which statement correctly contrasts an alveolar unit with <b>pure dead space (V/Q = &infin;)</b> and a unit with <b>pure right-to-left shunt (V/Q = 0)</b>, along with their effect on the A–a gradient?',
    o: ['Dead space has PAO2 = 150 mmHg and PACO2 = 0 mmHg; shunt has PaO2 = 40 mmHg and PaCO2 = 46 mmHg; shunt, V/Q mismatch, and diffusion defects widen the A–a gradient above (Age/4) + 4',
        'Dead space has PAO2 = 40 mmHg and PACO2 = 46 mmHg; shunt has PaO2 = 150 mmHg and PaCO2 = 0 mmHg; only anatomic dead space widens the A–a gradient',
        'Both pure dead space and pure shunt have PAO2 = 100 mmHg and PACO2 = 40 mmHg, with an A–a gradient of zero',
        'Dead space is caused by atelectasis or Eisenmenger syndrome; shunt is caused by pulmonary embolism or positive-pressure ventilation',
        'Pure shunt reduces the A–a gradient to 0 mmHg because venous blood bypasses the lungs'], a: 0,
    ex: 'In pure dead space (V/Q = ∞, no blood flow), alveolar gas matches humidified inspired air (PAO2 = 150 mmHg, PACO2 = 0 mmHg). In pure shunt (V/Q = 0, no ventilation), end-capillary blood matches mixed venous blood (PaO2 = 40 mmHg, PaCO2 = 46 mmHg). An elevated A–a gradient (>0–10 mmHg or > Age/4 + 4) occurs in R-to-L shunt, V/Q mismatch, and diffusion defects.' },
  { t: 'tf', id: 'E14', src: 'Gas exchange p.64–65',
    q: 'During moderate graded exercise (isocapnic buffering), arterial P<sub>aO2</sub>, P<sub>aCO2</sub>, and pH remain almost exactly normal because ventilation increases proportionally with CO<sub>2</sub> production.', a: true,
    ex: 'True. At the onset of exercise, ventilation jumps via psychic stimuli and proprioceptors in muscles, tendons, and joints, and during moderate graded exercise (isocapnic buffering) ventilation tracks CO2 production closely so PaO2, PaCO2, and arterial pH stay nearly constant.' }
]});

/* Section T: Hemoglobin, Oxygen Dissociation Curve & CO2 Transport (681114-2 Gas Transport.pdf, 43 pages). */
CVS.add({ id: 'T', short: 'Gas transport', title: 'Hemoglobin, Oxygen Dissociation Curve & CO2 Transport', kind: 'Lecture',
  blurb: 'Partial pressure vs tension, the 9-step diffusion pathway, hemoglobin structure and T-to-R oxygenation mechanics, P50 and allosteric effectors (2,3-BPG, pH, CO2, temperature), hemoglobin variants, CO poisoning, myoglobin, and CO2 transport with the Bohr and Haldane effects.',
  items: [
  { t: 'c', id: 'T-C1', title: 'Physical gas transport, 9-step diffusion path & RBC carrying capacity', src: 'Gas transport p.2–11, 14',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Gas–liquid interface</b>: {{partial pressure}} is the force driving gas molecules to dissolve into a liquid phase, whereas {{tension}} is the force causing dissolved gas molecules to escape from the liquid; at equilibrium the two forces are equal.</li>' +
      '<li><b>9-step diffusion path</b> from alveolus to Hb: (1) alveolar air &rarr; (2) {{surfactant layer}} &rarr; (3) alveolar membrane &rarr; (4) interstitial fluid &rarr; (5) capillary membrane &rarr; (6) plasma &rarr; (7) RBC membrane &rarr; (8) intracellular fluid &rarr; (9) hemoglobin.</li>' +
      '<li><b>O<sub>2</sub> diffusing capacity</b> in a young adult rises from {{20 mL/min/mmHg}} at rest to {{65 mL/min/mmHg}} during exercise because expanded capillary networks increase surface area and stretched alveoli thin the membrane.</li>' +
      '<li><b>Decreased diffusion rate</b>: diminished alveolar surface area (pneumonia, atelectasis, lung tumor, tuberculosis) vs {{alveolar-capillary block}} (pulmonary edema, interstitial pulmonary fibrosis, {{silicosis}}).</li>' +
      '<li><b>Role of RBCs</b>: RBCs bind dissolved O<sub>2</sub> temporarily and reversibly, shifting the plasma equilibrium so more gas dissolves and increasing blood O<sub>2</sub> transport capacity {{65-fold}}.</li></ul></div>' +
      CVS.fig('trans-rbc', 'RBCs bind dissolved gas reversibly, shifting the equilibrium so much more gas can dissolve and be transported.', 'trans', 11) + '</div>' },
  { t: 'q', id: 'T1', src: 'Gas transport p.4–5, 8', core: true,
    q: 'At a gas–liquid interface, what term describes the force causing dissolved gas molecules to escape from the liquid phase, and how does the O<sub>2</sub> diffusing capacity of a young adult change from rest to exercise?',
    o: ['Tension (equals partial pressure at equilibrium) · O2 diffusing capacity rises from 20 to 65 mL/min/mmHg',
        'Partial pressure · O2 diffusing capacity falls from 65 to 20 mL/min/mmHg during exercise',
        'Solubility coefficient (α) · O2 diffusing capacity stays constant at 25 mL/min/mmHg',
        'Osmotic reflection · O2 diffusing capacity rises from 5 to 20 mL/min/mmHg',
        'Graham’s tension · O2 diffusing capacity increases 65-fold from 20 to 1300 mL/min/mmHg'], a: 0,
    ex: 'Partial pressure drives gas into liquid, whereas tension drives gas out of the liquid phase (at equilibrium, partial pressure = tension). In a young adult, O2 diffusing capacity increases from 20 mL/min/mmHg at rest to 65 mL/min/mmHg during exercise due to capillary expansion (↑ area) and alveolar membrane thinning (↓ distance).' },
  { t: 'q', id: 'T2', src: 'Gas transport p.9, 11, 14',
    q: 'Which set of conditions is classified in the lecture as causing an <b>alveolar–capillary block</b> (rather than diminished alveolar surface area), and by what factor does hemoglobin in RBCs increase the O<sub>2</sub>-carrying capacity of blood?',
    o: ['Pulmonary edema, interstitial pulmonary fibrosis, and silicosis · increases O2 capacity 65-fold',
        'Pneumonia, atelectasis, lung tumor, and tuberculosis · increases O2 capacity 20-fold',
        'Bronchial asthma and pulmonary embolism · increases O2 capacity 210-fold',
        'Silicosis and atelectasis · increases O2 capacity 4-fold',
        'Interstitial pulmonary fibrosis and tuberculosis · increases O2 capacity 100-fold'], a: 0,
    ex: 'Slide 9 divides causes of decreased diffusion rate into diminished alveolar surface area (pneumonia, atelectasis, lung tumor, tuberculosis) and alveolar-capillary block (pulmonary edema, interstitial pulmonary fibrosis, silicosis). Slide 14 states that hemoglobin in RBCs increases blood O2-binding capacity 65-fold (1 Hb binds 4 O2 molecules).' },

  { t: 'c', id: 'T-C2', title: 'Hemoglobin A structure & molecular mechanism of oxygenation', src: 'Gas transport p.12–21',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Hemoglobin A (HbA)</b>: quaternary tetramer (&alpha;<sub>2</sub>&beta;<sub>2</sub>; &alpha; = 141 AA, &beta; = 146 AA), MW {{64,500 Da}} (5.5 nm), with 4 heme groups each containing ferrous iron (<b>Fe<sup>2+</sup></b>) coordinated to proximal histidine.</li>' +
      '<li><b>Reversible O<sub>2</sub> binding</b>: O<sub>2</sub> attachment to Fe<sup>2+</sup> is {{oxygenation}} (not oxidation &mdash; Fe<sup>2+</sup> valence does not change) and occurs in {{0.01 s}}.</li>' +
      '<li><b>Step 1 (first subunit)</b>: driven by the P<sub>O2</sub> gradient, the first O<sub>2</sub> binds the {{alpha chain}} first because its heme pocket is wider than that of the &beta;-subunit.</li>' +
      '<li><b>Step 2 (Fe<sup>2+</sup> movement)</b>: in deoxyHb, steric repulsion keeps Fe<sup>2+</sup> {{0.6 &Aring;}} above the porphyrin ring in a {{high-spin}} state; O<sub>2</sub> binding converts Fe<sup>2+</sup> to a {{low-spin}} state and pulls it into the flat porphyrin plane.</li>' +
      '<li><b>Step 3 (T &rarr; R transition)</b>: breaking of &alpha;&ndash;&alpha; and &alpha;&ndash;&beta; {{salt bridges}}, {{15&deg;}} rotation of &alpha;&beta; dimers, expulsion of 2,3-BPG from between the &beta;-chains, narrowing of the &beta;&ndash;&beta; gap (0.07 nm), and widening of the &beta;-subunit heme pocket.</li>' +
      '<li>This positive {{cooperativity}} (like tearing a block of 4 stamps) converts low-affinity deoxyHb (T-state) into high-affinity oxyHb (R-state) and yields a <b>sigmoidal</b> dissociation curve.</li></ul></div>' +
      CVS.fig('trans-heme', 'Iron atom movement into the flat porphyrin plane upon oxygen binding.', 'trans', 18) + '</div>' },
  { t: 'q', id: 'T3', src: 'Gas transport p.16–19', core: true,
    q: 'During the oxygenation of deoxyhemoglobin A (&alpha;<sub>2</sub>&beta;<sub>2</sub>), which sequence of molecular events occurs first and triggers the cooperative transition to oxyhemoglobin?',
    o: ['O2 binds the α-subunit first (wider heme pocket) → Fe2+ shifts from high-spin (0.6 Å above the ring) into the porphyrin plane (low-spin) → α–α and α–β salt bridges break, αβ rotates 15°, 2,3-BPG is expelled, and the β heme pocket opens',
        'O2 binds the β-subunit first (after 2,3-BPG covalently phosphorylates His146) → Fe2+ is oxidized to Fe3+ and moves 1.5 nm out of the porphyrin plane',
        '2,3-BPG binds between the α-subunits → αβ dimers rotate 45° → Fe2+ transitions from low-spin to high-spin',
        'CO2 binds to Fe2+ of the α-subunit → β–β subunits move 0.6 Å farther apart → salt bridges form to stabilize the R-state',
        'All four subunits bind O2 simultaneously without conformational change, producing a hyperbolic curve'], a: 0,
    ex: 'Because the α-subunit has a wider heme pocket than the β-subunit, O2 binds the α-subunit first. Fe2+ transitions from high-spin (0.6 Å out of plane due to steric repulsion) to low-spin in the flat porphyrin plane, pulling the histidine helix, breaking α–α and α–β salt bridges, rotating αβ dimers by 15°, expelling 2,3-BPG, bringing the β-chains 0.07 nm closer, and opening the β heme pocket.' },
  { t: 'tf', id: 'T4', src: 'Gas transport p.15',
    q: 'When oxygen binds to hemoglobin in red blood cells, the heme iron is oxidized from the ferrous state (Fe<sup>2+</sup>) to the ferric state (Fe<sup>3+</sup>) in 0.01 seconds.', a: false,
    ex: 'False. Binding of O2 to Hb is oxygenation, NOT oxidation: the iron atom must remain in the ferrous (Fe2+) oxidation state to bind O2 reversibly (oxidation to Fe3+ forms non-functional methemoglobin).' },
  { t: 'q', id: 'T5', src: 'Gas transport p.13',
    q: 'Which pairing of ligand and its specific binding site on hemoglobin is <b>correct</b>?',
    o: ['CO2 → N-terminal −NH2 group of globin chains (forming carbaminohemoglobin) · 2,3-BPG → β-globin chains of deoxyhemoglobin',
        'CO2 → Fe2+ atom of heme · CO → N-terminal −NH2 group of globin chains',
        'H+ → Fe2+ atom of heme · O2 → C-terminal −COOH group of α-globin',
        '2,3-BPG → heme porphyrin ring of oxyhemoglobin · CO → β-globin His146',
        'O2 → N-terminal −NH2 group of globin · H+ → 2,3-BPG central cavity'], a: 0,
    ex: 'O2 and CO bind to the Fe2+ atom of heme (forming oxyhemoglobin and carboxyhemoglobin); CO2 binds to the N-terminal −NH2 group of globin chains (forming carbaminohemoglobin); H+ binds to proton-acceptor amino acids of globin (stabilizing deoxyhemoglobin); and 2,3-BPG binds non-covalently to the β-globin chains of deoxyhemoglobin.' },

  { t: 'c', id: 'T-C3', title: 'P50, oxygen dissociation shifts & 2,3-BPG regulation', src: 'Gas transport p.22–33',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>P<sub>50</sub></b> is the P<sub>O2</sub> at which Hb is 50% saturated; normal P<sub>50</sub> = {{27 mmHg}}.</li>' +
      '<li><b>Right shift (P<sub>50</sub> &gt; 27, e.g. 48 mmHg)</b> = <b>decreased O<sub>2</sub> affinity</b> (enhances O<sub>2</sub> unloading to active tissues): caused by <b>&uparrow; [H<sup>+</sup>] (low pH), &uparrow; P<sub>CO2</sub>, &uparrow; temperature, and &uparrow; 2,3-BPG</b>. <b>Left shift (P<sub>50</sub> &lt; 27, e.g. 16 mmHg)</b> = increased affinity from the opposite changes.</li>' +
      '<li><b>Molecular mechanisms</b>: when protonated at low pH, {{His146}} (His HC3) on the &beta;-subunit forms a stabilizing ion pair with {{Asp94}} (Asp FG1) that locks deoxyHb in the {{T-state}}; CO<sub>2</sub> binds the {{N-terminal amino group}} of globin to form carbaminohemoglobin.</li>' +
      '<li><b>2,3-BPG</b> (from RBC {{anaerobic glycolysis}}) is a highly charged anion that binds {{non-covalently}} in a {{1:1}} ratio to the &beta;-chains of deoxyHb.</li>' +
      '<li><b>2,3-BPG regulation</b>: <b>increased</b> by hormones ({{thyroid hormone, growth hormone, and androgens}}), exercise, anemia, hypoxia, and high altitude; <b>decreased</b> by {{acidosis}}.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('trans-odc', 'Oxygen dissociation curves showing normal affinity and left vs right shifts.', 'trans', 22) + CVS.fig('trans-bpg', 'Conversion of 1,3-BPG to 2,3-BPG in red blood cells and its right-shifting effect.', 'trans', 23) + '</div></div>' },
  { t: 'q', id: 'T6', src: 'Gas transport p.22, 29–31', core: true,
    q: 'During strenuous exercise, lactic acid accumulation lowers blood pH and raises P<sub>50</sub> from 27 mmHg toward 48 mmHg. Which specific intramolecular interaction stabilizes deoxyhemoglobin in this state?',
    o: ['Protonated His146 (His HC3) of the β-subunit forms an ion pair with Asp94 (Asp FG1), stabilizing the T-state',
        'Deprotonated His146 forms a disulfide bond with Cys93 on the α-subunit, locking Hb in the R-state',
        'Lactic acid covalently esterifies Fe2+ in the heme ring, lowering P50 to 16 mmHg',
        'H+ ions displace Fe2+ from the porphyrin ring, converting sigmoidal binding into hyperbolic binding',
        'Low pH stimulates 2,3-BPG synthesis to covalently cross-link the α-subunits'], a: 0,
    ex: 'A decrease in pH (↑ [H+]) protonates His146 (His HC3) of the β-subunits, which then forms a salt bridge / ion pair with Asp94 (Asp FG1) on the same β-chain. This stabilizes deoxyhemoglobin in the low-affinity T-state, shifting the O2 dissociation curve to the right (P50 > 27 mmHg) and enhancing O2 release to exercising muscle.' },
  { t: 'q', id: 'T7', src: 'Gas transport p.23–25', core: true,
    q: 'Which statement accurately describes 2,3-bisphosphoglycerate (2,3-BPG) and the factors that alter its concentration in red blood cells?',
    o: ['It is a highly charged anion from anaerobic glycolysis that binds β-chains of deoxyHb non-covalently (1:1); it increases with thyroid hormone, growth hormone, androgens, anemia, hypoxia, and high altitude, but decreases in acidosis',
        'It is produced by the mitochondrial citric acid cycle in RBCs and binds covalently to α-chains; it increases in acidosis and decreases at high altitude',
        'It binds oxyhemoglobin in a 4:1 ratio to shift the O2 dissociation curve to the left (P50 < 27 mmHg)',
        'It is decreased by thyroid hormone, growth hormone, and androgens, and increased by respiratory acidosis',
        'It binds equally strongly to adult HbA (α2β2), fetal HbF (α2γ2), and monomeric myoglobin'], a: 0,
    ex: '2,3-BPG is synthesized from 1,3-BPG during anaerobic glycolysis in RBCs, binds non-covalently 1:1 between the β-chains of deoxyHb, lowers O2 affinity (right shift), is increased by thyroid hormone, GH, androgens, exercise, anemia, hypoxia, and high altitude, and is decreased by acidosis.' },
  { t: 'open', id: 'T8', src: 'Gas transport p.25–27',
    q: 'Trace the short-term ventilatory response and the RBC acclimatization response when a person ascends to high altitude.',
    ans: 'At high altitude, lower atmospheric PO2 decreases pressure gradients and causes hypobaric hypoxia. Peripheral chemoreceptors (carotid and aortic bodies) sense the low PaO2 and trigger hyperventilation, which blows off CO2 and causes respiratory alkalosis. During acclimatization, hypoxia and alkalosis stimulate RBCs to increase 2,3-BPG (along with increased erythropoiesis/Hb), shifting the Hb-O2 dissociation curve to the right so more O2 is unloaded to tissues despite the reduced arterial PO2.' },

  { t: 'c', id: 'T-C4', title: 'Hemoglobin variants, CO poisoning, abnormal hemoglobins & myoglobin', src: 'Gas transport p.34–39',
    html: '<div class="two"><div class="stack"><div class="tblwrap"><table class="tbl"><thead><tr><th>Protein / Variant</th><th>Subunits / Structure</th><th>Key physiological or clinical feature</th></tr></thead><tbody>' +
      '<tr><td><b>Embryonic Hb</b></td><td>{{Gower 1 (&zeta;2&epsilon;2), Gower 2 (&alpha;2&epsilon;2), Portland (&zeta;2&gamma;2)}}</td><td>Produced in the embryonic yolk sac</td></tr>' +
      '<tr><td><b>Fetal Hb (HbF)</b></td><td>{{&alpha;2&gamma;2}} (&lt;1% in adults)</td><td>Does <b>not bind (or loosely binds) 2,3-BPG</b> &rarr; <b>left shift</b> &amp; higher O<sub>2</sub> affinity than maternal HbA</td></tr>' +
      '<tr><td><b>Adult HbA / HbA<sub>2</sub> / HbA<sub>1c</sub></b></td><td>HbA &alpha;<sub>2</sub>&beta;<sub>2</sub> (~{{97%}}), HbA<sub>2</sub> {{&alpha;2&delta;2}} (2–2.5%)</td><td>HbA<sub>1c</sub> (&alpha;<sub>2</sub>&beta;<sub>2</sub> + glucose) rises up to 12% in diabetes mellitus</td></tr>' +
      '<tr><td><b>Carboxyhemoglobin</b></td><td>Hb bound to CO at Fe<sup>2+</sup></td><td>CO binds Hb with {{210 times}} higher affinity than O<sub>2</sub> &rarr; left shift &amp; severe tissue hypoxia</td></tr>' +
      '<tr><td><b>MetHb &amp; SulfHb</b></td><td>MetHb: {{Fe3+}} replaces Fe<sup>2+</sup></td><td>SulfHb: sulfur replaces ferrous atom after exposure to {{hydroxylamine sulfate}} ((NH<sub>2</sub>OH)<sub>2</sub>H<sub>2</sub>SO<sub>4</sub>)</td></tr>' +
