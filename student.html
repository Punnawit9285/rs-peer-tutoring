<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RS I Anatomy, Histology &amp; Physiology &#183; Peer support 82</title>
<meta name="description" content="Question-first peer-tutoring deck: anatomy, histology and physiology of the respiratory system (RS I).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root {
  /* Layout: a lab-bench stage. One large card at a time on chart-recorder paper, a strip of eight lab stations above, a sticky pager below. Browse = one scrolling worksheet. */
  --paper: #f3f5f8;      /* page ground, cool grey */
  --sheet: #ffffff;      /* card */
  --sheet2: #edf0f5;     /* inset panels */
  --ink: #19202e;        /* text */
  --ink2: #4f5a6e;       /* secondary text */
  --rule: #d4dae4;       /* hairlines */
  --grid: #e9edf3;       /* chart-paper grid */
  --art: #ae1530;        /* arterial red: brand, tracings */
  --art-soft: #fbe5e9;
  --ven: #1f4f97;        /* venous blue: controls, second tracing */
  --ven-soft: #e2ebf8;
  --ok: #13744a; --ok-soft: #dff2e7;
  --bad: #b02f19; --bad-soft: #fbe6df;
  --warn: #775100; --warn-soft: #fbefd2;
  --scanbg: #ffffff;     /* paper behind real figures */
  --f-display: "Bai Jamjuree", "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1117; --sheet: #161a22; --sheet2: #1e232e; --ink: #e5e8ef; --ink2: #a3abbc; --rule: #2b3240; --grid: #1f2530;
    --art: #ff6f84; --art-soft: #3a1b23; --ven: #8db3f2; --ven-soft: #1a2840;
    --ok: #4fc98b; --ok-soft: #13301f; --bad: #ff8b74; --bad-soft: #391e17; --warn: #efc04e; --warn-soft: #32280e; --scanbg: #e6e3dc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1117; --sheet: #161a22; --sheet2: #1e232e; --ink: #e5e8ef; --ink2: #a3abbc; --rule: #2b3240; --grid: #1f2530;
  --art: #ff6f84; --art-soft: #3a1b23; --ven: #8db3f2; --ven-soft: #1a2840;
  --ok: #4fc98b; --ok-soft: #13301f; --bad: #ff8b74; --bad-soft: #391e17; --warn: #efc04e; --warn-soft: #32280e; --scanbg: #e6e3dc;
  color-scheme: dark;
}
html { -webkit-text-size-adjust: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ven); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- cards ---------- */
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: clamp(16px, 2.6vw, 34px); min-width: 0; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; font-family: var(--f-mono); font-size: .8em; color: var(--ink2); }
.eyebrow .id { font-weight: 600; color: var(--art); font-size: 1.12em; letter-spacing: .02em; }
.chip { border-radius: 999px; padding: 2px 9px; background: var(--sheet2); color: var(--ink2); white-space: nowrap; }
.chip.core { background: var(--art-soft); color: var(--art); }
.chip.kind { background: var(--ven-soft); color: var(--ven); }
.chip.grp { background: transparent; border: 1px dashed var(--rule); }
.concept h2, .secard h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.6em; line-height: 1.2; margin: 0 0 14px; text-wrap: balance; letter-spacing: .005em; }
.cbody { display: grid; gap: 16px; }
.cbody > * { min-width: 0; }
.muted { color: var(--ink2); font-weight: 400; }

/* ---------- question cards ---------- */
.stem { font-size: 1.26em; font-weight: 500; line-height: 1.45; margin: 2px 0 16px; text-wrap: pretty; }
.stem b { color: var(--art); font-weight: 600; }
.stem .muted { font-size: .82em; display: block; margin-top: 4px; }
.qfig { margin: 0 0 16px; }
.opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.opt { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; text-align: left; background: var(--sheet); color: var(--ink); border: 1.5px solid var(--rule); border-radius: 10px; padding: .6em .85em; cursor: pointer; transition: border-color .15s, background-color .15s, opacity .15s; line-height: 1.4; }
.opt:hover { border-color: var(--ven); }
.opt .L { font: 600 .88em var(--f-mono); width: 2em; height: 2em; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--rule); color: var(--ink2); }
.opt .mk { font-weight: 700; min-width: 1em; }
.opt.sel { border-color: var(--ven); background: var(--ven-soft); }
.opt.sel .L { border-color: var(--ven); color: var(--ven); }
.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tfrow .opt { padding: .9em 1em; font-size: 1.08em; font-weight: 500; }
.rev .opt { cursor: default; }
.rev .opt.isans, .showall .opt.isans { border-color: var(--ok); background: var(--ok-soft); }
.rev .opt.isans .L, .showall .opt.isans .L { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.rev .opt.isans .mk::after, .showall .opt.isans .mk::after { content: "\2713"; color: var(--ok); }
.rev .opt.sel:not(.isans) { border-color: var(--bad); background: var(--bad-soft); }
.rev .opt.sel:not(.isans) .L { border-color: var(--bad); color: var(--bad); }
.rev .opt.sel:not(.isans) .mk::after { content: "\2717"; color: var(--bad); }
.rev .opt:not(.isans):not(.sel) { opacity: .55; }
.think { margin: 0; color: var(--ink2); font-style: italic; }
.explain { margin-top: 16px; background: var(--ok-soft); border-radius: 12px; padding: 14px 18px; }
.qcard:not(.rev) .explain { display: none; }
.showall .qcard .explain { display: block; }
.explain .ans { font: 600 1.02em var(--f-display); color: var(--ok); margin-bottom: 4px; }
.explain p { margin: 0; }
.flag { margin-top: 10px; background: var(--warn-soft); border-radius: 10px; padding: 8px 12px; font-size: .9em; }
.flag b { color: var(--warn); }

/* ---------- concept building blocks ---------- */
.two { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.figpair { grid-template-columns: minmax(0, .75fr) minmax(0, 1.25fr); align-items: center; }
@media (max-width: 760px) { .two, .cols2, .cols3, .figpair { grid-template-columns: 1fr; } }
.mini { background: var(--sheet2); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.mini h4 { margin: 0 0 6px; font: 600 1em var(--f-display); letter-spacing: .01em; }
.mini.art h4 { color: var(--art); }
.mini.ven h4 { color: var(--ven); }
.mini p { margin: 0; }
.mini ul { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }
.pts { margin: 0; padding-left: 1.2em; display: grid; gap: 7px; }
.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 7px; }
.steps.tight { gap: 3px; }
.note { margin: 0; background: var(--ven-soft); border-radius: 10px; padding: 10px 14px; }
.trap { margin: 0; background: var(--warn-soft); border-radius: 10px; padding: 10px 14px; }
.trap::before { content: "Exam trap \00B7  "; font-weight: 600; color: var(--warn); }
.eqn { font: 600 1.65em var(--f-display); text-align: center; letter-spacing: .02em; padding: 6px 0; }
.eqn span { color: var(--art); }
.speeds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .speeds { grid-template-columns: 1fr; } }
.speed { border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; background: var(--sheet); }
.sp-h { display: grid; gap: 2px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed var(--rule); }
.sp-h .mono { font-family: var(--f-mono); font-size: .8em; color: var(--ink2); }
.s1 .sp-h b { color: var(--art); }
.s2 .sp-h b { color: var(--warn); }
.s3 .sp-h b { color: var(--ven); }
.speed ul { margin: 0; padding-left: 1.1em; display: grid; gap: 3px; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.flow.col { flex-direction: column; align-items: stretch; }
.fbox { border: 1px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 8px 12px; flex: 1 1 140px; min-width: 0; }
.fbox.start { background: var(--sheet2); }
.fbox.end { background: var(--ok-soft); border-color: var(--ok); }
.fbox.art { background: var(--art-soft); border-color: var(--art); }
.fbox.ven { background: var(--ven-soft); border-color: var(--ven); }
.farrow { color: var(--ink2); font-weight: 600; flex: none; text-align: center; }
.flow.col .farrow { font-size: .9em; }
.fstack { display: grid; gap: 8px; flex: 2 1 260px; min-width: 0; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 600px) { .fgrid { grid-template-columns: 1fr; } }
.cycle { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.cycle .ph { flex: 1 1 130px; background: var(--sheet2); border-radius: 8px; padding: 8px 10px; font-weight: 600; font-size: .92em; display: grid; gap: 2px; align-content: start; }
.cycle .ph span { font-weight: 400; color: var(--ink2); font-size: .88em; }
.cycle .sd { flex: none; align-self: center; font: 700 .9em var(--f-mono); color: var(--sheet); background: var(--ink); border-radius: 999px; padding: 4px 10px; }

/* ---------- tables ---------- */
.tblwrap { overflow-x: auto; min-width: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: .92em; }
.tbl caption { text-align: left; font: 600 .95em var(--f-display); padding-bottom: 6px; }
.tbl th, .tbl td { border-bottom: 1px solid var(--rule); padding: 7px 10px; text-align: left; vertical-align: top; }
.tbl thead th { font-family: var(--f-mono); font-size: .76em; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); background: var(--sheet2); }
.tbl td.num { font-variant-numeric: tabular-nums; font-family: var(--f-mono); white-space: nowrap; }
.tbl .up { color: var(--art); font-weight: 600; }
.tbl .dn { color: var(--ven); font-weight: 600; }
.tbl thead th.up { color: var(--art); }
.tbl thead th.dn { color: var(--ven); }
.tbl.compact th, .tbl.compact td { padding: 4px 8px; }
.dogtbl td:nth-child(2), .dogtbl td:nth-child(3), .dogtbl td:nth-child(4) { text-align: center; white-space: nowrap; }

/* ---------- real figures cropped from the course material ---------- */
.stack { display: grid; gap: 12px; align-content: start; min-width: 0; }
.scan { margin: 0; min-width: 0; display: grid; gap: 6px; align-content: start; }
.paperimg { background: var(--scanbg); border: 1px solid var(--rule); border-radius: 10px; padding: 8px; isolation: isolate; }
.scan img { display: block; width: auto; max-width: 100%; height: auto; max-height: min(440px, 62vh); margin: 0 auto; mix-blend-mode: multiply; cursor: zoom-in; border-radius: 4px; }
.scan.tall img { max-height: min(480px, 66vh); }
.scanrow .scan img { max-height: 360px; }
.scan figcaption { font-size: .84em; line-height: 1.4; color: var(--ink2); text-wrap: pretty; }
.scan figcaption .src { font-family: var(--f-mono); font-size: .88em; white-space: nowrap; opacity: .9; }
.scan figcaption .src::before { content: "\00B7  "; }
.scan figcaption.srconly .src::before { content: none; }
.scanrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; align-items: start; min-width: 0; }
.qfig .scan { max-width: 760px; }
.qfig .scan.tall { max-width: 560px; }

/* ---------- cloze blanks: {{key detail}} in concept cards ---------- */
.cz { border-radius: 4px; padding: 0 .22em; background: var(--sheet2); color: transparent; box-shadow: inset 0 -2px 0 var(--art); cursor: pointer; -webkit-box-decoration-break: clone; box-decoration-break: clone; transition: color .18s, background-color .18s; }
.cz * { color: transparent !important; }
.cz:hover { background: var(--art-soft); }
.cz.on, .czopen .cz, .showall .cz { color: inherit; background: var(--art-soft); }
.cz.on *, .czopen .cz *, .showall .cz * { color: inherit !important; }
.cz.last { animation: czpop .5s ease-out; }
@keyframes czpop { 0% { box-shadow: inset 0 -2px 0 var(--art), 0 0 0 4px var(--art-soft); } 100% { box-shadow: inset 0 -2px 0 var(--art), 0 0 0 0 transparent; } }
@media print { .cz { color: inherit; background: none; } .cz * { color: inherit !important; } }

/* ---------- figure zoom ---------- */
.zoom { position: fixed; inset: 0; z-index: 60; background: rgba(6, 8, 12, .88); display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
.zoom[hidden] { display: none; }
.zoom .zbox { display: grid; gap: 10px; justify-items: center; max-width: 100%; }
.zoom .zpaper { background: #fff; border-radius: 10px; padding: 10px; max-width: min(1700px, 100%); }
.zoom img { display: block; max-width: 100%; max-height: calc(100vh - 120px); width: auto; height: auto; }
.zoom .zcap { color: #e5e8ef; font-size: .92em; text-align: center; max-width: 900px; margin: 0; }

/* Thai explanation under each concept card (student deck: collapsible; tutor deck: open) */
.thx { margin-top: 16px; border: 1px solid var(--rule); border-left: 3px solid var(--ok); border-radius: 10px; background: var(--sheet); padding: 0 14px; }
.thx summary { cursor: pointer; padding: 10px 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.thx summary::marker, .thx summary::-webkit-details-marker { color: var(--ok); }
.thx-h { font: 600 1.02em var(--f-display); color: var(--ok); }
.thx-s { font: .74em var(--f-mono); color: var(--ink2); }
.thx[open] summary { border-bottom: 1px dashed var(--rule); margin-bottom: 10px; }
.thx-body { display: grid; gap: 9px; padding-bottom: 14px; line-height: 1.7; font-family: "IBM Plex Sans Thai", var(--f-body); }
.thx-body p { margin: 0; }
.thx-body b { font-weight: 600; color: var(--ink); }

/* cover: counts + QR to the live deck (student deck start card and PDF cover) */
.coverline { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px 32px; margin: 4px 0 22px; padding: 14px 0 16px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.counts { display: flex; gap: 44px; }
.counts > div { display: grid; }
.counts b { font: 600 3.2em/1 var(--f-display); letter-spacing: -.01em; }
.counts span { font: .8em var(--f-mono); color: var(--ink2); letter-spacing: .04em; margin-top: 5px; }
.qrlink { display: grid; justify-items: end; gap: 6px; color: var(--ink2); text-decoration: none; }
.qrlink .qrcap { font: 500 .78em var(--f-body); color: var(--ink2); }
.qrlink img { width: 112px; height: 112px; display: block; }
.qrlink span { font: .72em var(--f-mono); }
.qrlink:hover span { color: var(--ven); text-decoration: underline; }
.legend { margin: 14px 0 0; font: .8em var(--f-mono); color: var(--ink2); }
.legend .chip { margin-right: 6px; }
@media (max-width: 560px) { .qrlink .qrcap, .qrlink img { display: none; } .qrlink { justify-items: start; } .counts b { font-size: 2.6em; } }

/* figure that would give away a card's blanks: collapsed behind a summary (closed in the PDF) */
.figans { border: 1px dashed var(--rule); border-radius: 10px; padding: 8px 12px; }
.figans summary { cursor: pointer; font: 500 .85em var(--f-mono); color: var(--ink2); }
.figans[open] summary { margin-bottom: 8px; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--sheet); border-bottom: 1px solid var(--rule); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px 18px; align-items: center; }
@media (max-width: 1020px) { .bar { grid-template-columns: minmax(0, 1fr) auto; } .tabs { grid-column: 1 / -1; order: 3; } }
.brand { display: flex; gap: 10px; align-items: center; min-width: 0; }
.brand svg { flex: none; width: 38px; height: 22px; }
.brand b { display: block; font: 600 1.05rem var(--f-display); letter-spacing: .01em; white-space: nowrap; }
.brand small { display: block; color: var(--ink2); font: .72rem var(--f-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; gap: 6px; overflow-x: auto; min-width: 0; padding-block: 2px; scrollbar-width: thin; }
.tab { flex: none; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink2); border-radius: 999px; padding: 5px 12px; font-size: .84rem; font-weight: 500; cursor: pointer; white-space: nowrap; }
.tab:hover { border-color: var(--ven); color: var(--ink); }
.tab .k { font-family: var(--f-mono); color: var(--art); margin-right: 6px; font-weight: 600; }
.tab[aria-current="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.tab[aria-current="true"] .k { color: var(--art-soft); }
.ctrls { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink2); padding: 6px 11px; font-size: .85rem; font-weight: 500; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ven); color: var(--sheet); }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: .85rem; color: var(--ink2); cursor: pointer; user-select: none; white-space: nowrap; }
.chk input { accent-color: var(--art); width: 16px; height: 16px; margin: 0; }
.icon { display: inline-grid; place-items: center; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 8px; height: 32px; width: 34px; padding: 0; cursor: pointer; }
.icon svg { width: 16px; height: 16px; }
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 0; }
#present { max-width: 1180px; margin: 0 auto; }
#present .card { font-size: clamp(15px, .5vw + 11.5px, 20px); }
.stage { min-height: 55vh; }
.eyebrow .sp { flex: 1; }
.pager { position: sticky; bottom: 0; z-index: 5; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 8px 10px; align-items: center; background: var(--paper); padding-block: 12px calc(10px + env(safe-area-inset-bottom, 0px)); margin-top: 14px; border-top: 1px solid var(--rule); }
.pos { font-family: var(--f-mono); font-size: .82rem; color: var(--ink2); text-align: center; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pos span { color: var(--art); font-weight: 600; }
.btn { border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 10px; padding: 9px 14px; font-size: .95rem; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--ven); }
.btn.primary { background: var(--art); color: var(--sheet); border-color: var(--art); min-width: 8.5em; }
.btn.small { padding: 5px 11px; font-size: .85rem; }
.btn:disabled { opacity: .4; cursor: default; }
.prog { grid-column: 1 / -1; height: 3px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--art); width: 0; transition: width .2s; }
.keys { grid-column: 1 / -1; font: .72rem var(--f-mono); color: var(--ink2); text-align: center; }
@media (max-width: 560px) { .pager { grid-template-columns: auto minmax(0, 1fr) auto; } #reveal { grid-column: 1 / -1; order: 5; } .keys { display: none; } }

/* intro and section cards */
.secard .lede { font-size: 1.1em; color: var(--ink2); margin: 0 0 16px; max-width: 65ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 26px; font-family: var(--f-mono); font-size: .82em; color: var(--ink2); margin-bottom: 16px; }
.stats b { font: 600 1.7em var(--f-display); color: var(--ink); display: block; line-height: 1.1; }
.minih { font: 600 .8em var(--f-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--ink2); margin: 0 0 8px; }
.toc { margin: 0; padding-left: 0; list-style: none; columns: 2 280px; column-gap: 28px; }
.toc li { break-inside: avoid; margin-bottom: 5px; }
.toc .tid { font-family: var(--f-mono); color: var(--art); font-size: .85em; margin-right: 8px; }
.stations { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin: 4px 0 16px; }
.station { text-align: left; border: 1px solid var(--rule); background: var(--sheet2); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: grid; gap: 2px; }

.station .k { font: 600 .78rem var(--f-mono); color: var(--art); }
.station b { font: 600 1.05rem var(--f-display); }
.station span:last-child { color: var(--ink2); font-size: .86rem; }
.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-bottom: 14px; }
.howto div { background: var(--sheet2); border-radius: 10px; padding: 10px 12px; font-size: .92em; }
.howto b { display: block; font-family: var(--f-display); margin-bottom: 2px; }
kbd { font: .82em var(--f-mono); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--sheet); }

/* browse */

.btools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding-block: 4px 6px; }
.btools input[type="search"] { flex: 1 1 260px; min-width: 0; border: 1px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 9px 12px; }
.bcount { font: .8rem var(--f-mono); color: var(--ink2); }
.bsec { display: grid; gap: 14px; margin-top: 28px; }
.bsec > header { scroll-margin-top: 130px; }
.bsec > header h2 { font: 600 1.5rem var(--f-display); margin: 0; text-wrap: balance; }
.bsec > header p { margin: 4px 0 0; color: var(--ink2); }
.bsec > header .eyebrow { margin-bottom: 6px; }
#blist .card { font-size: 15px; scroll-margin-top: 130px; }
#blist .stem { font-size: 1.1em; }
.qfoot { margin-top: 12px; display: flex; justify-content: flex-end; }

/* Thai bullet explanations & concept key points */

.tpoints ul { margin: 0; padding-left: 1.25em; display: grid; gap: 4px; line-height: 1.5; }

.traps-box .tp-head { font: 600 .75em var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--warn); margin-bottom: 4px; }

.brand > div { min-width: 0; }

@media (max-width: 640px) { .bar { grid-template-columns: minmax(0, 1fr); position: relative; } .ctrls { justify-content: flex-start; } }

   Concept-card HTML may mark key details as {{blanks}}: they render as click-to-reveal cloze spans.

window.CVS = {

  cloze: function (h) { return String(h).replace(/\{\{([\s\S]*?)\}\}/g, '<span class="cz">$1</span>'); },
  fig: function (name, cap, pdf, page, cls) {
    var d = this.dims[name];
    if (!d) throw new Error('no image ' + name);
    var alt = String(cap).replace(/<[^>]+>/g, '').replace(/"/g, '&quot;');
    return '<figure class="scan' + (cls ? ' ' + cls : '') + '"><div class="paperimg"><img src="img/' + name + '.jpg" width="' + d[0] + '" height="' + d[1] + '" alt="' + alt + '" loading="lazy" decoding="async"></div><figcaption>' + cap + ' <span class="src">' + (this.SRC[pdf] || pdf) + ', p.' + page + '</span></figcaption></figure>';
  },
  /* Options are written with the answer first; shuffle them once, the same way everywhere (seeded by the item ID).
     Options such as "None ..." or "All ..." stay last. Set keep: true to leave an item's order alone. */
  shuffle: function (it) {
    if (it.t !== 'q' || it.keep) return;
    var h = 2166136261, i;
    for (i = 0; i < it.id.length; i++) { h ^= it.id.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    var rnd = function () { h = (h + 0x6D2B79F5) >>> 0; var t = h; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    var idx = it.o.map(function (o, k) { return k; });
    var free = idx.filter(function (k) { return !/^(None|All |Both |Neither )/.test(it.o[k]); });
    var tail = idx.filter(function (k) { return free.indexOf(k) < 0; });
    for (i = free.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)), t = free[i]; free[i] = free[j]; free[j] = t; }
    var order = free.concat(tail), A = [].concat(it.a);
    it.o = order.map(function (k) { return it.o[k]; });
    var na = A.map(function (a) { return order.indexOf(a); });
    it.a = Array.isArray(it.a) ? na : na[0];
  },
  add: function (sec) {
    sec.items.forEach(function (it) { if (it.html) it.html = window.CVS.cloze(it.html); window.CVS.shuffle(it); });
    this.sections.push(sec);
  }
};

  blurb: 'Nasal septum and conchae, paranasal sinus drainage, Kiesselbach plexus, pharyngeal walls and tonsillar ring, laryngeal skeleton and membranes, intrinsic laryngeal muscles and nerves, and the trachea.',
  items: [
  { t: 'c', id: 'U-C1', title: 'Nasal cavity boundaries, septum and lateral conchae', src: 'URT p.4–10',
    html: '<div class="two"><div class="stack"><ul class="pts">' +

      '<li><b>Roof</b>: nasal, frontal, ethmoid and sphenoid bones; lined by {{olfactory}} epithelium. Fracture of the {{cribriform plate}} of the ethmoid causes {{anosmia}} and {{CSF rhinorrhea}}.</li>' +

      '<li><b>Lateral wall</b>: superior and middle conchae (parts of ethmoid) plus the independent {{inferior concha}} bone.</li></ul></div>' +
      CVS.fig('urt-septum', 'Bony and cartilaginous framework of the medial wall and coronal section.', 'urt', 8) + '</div>' },
  { t: 'q', id: 'U1', src: 'URT p.7', core: true,
    q: 'A patient with head trauma presents with clear fluid dripping from the nose and loss of smell. Fracture of which bony structure best explains both findings?',
    o: ['Cribriform plate of the ethmoid bone', 'Vomer', 'Perpendicular plate of the palatine bone', 'Inferior nasal concha', 'Body of the maxilla'], a: 0,
    ex: 'The roof of the nasal cavity is formed in part by the cribriform plate of the ethmoid bone, which transmits olfactory nerve fibers. Its fracture leads to anosmia and CSF rhinorrhea.' },
  { t: 'q', id: 'U2', src: 'URT p.8–9',
    q: 'Which set of structures forms the nasal septum?',
    o: ['Perpendicular plate of ethmoid, vomer, and septal cartilage', 'Cribriform plate of ethmoid, nasal bone, and vomer', 'Superior, middle, and inferior nasal conchae', 'Maxilla, palatine bone, and sphenoid rostrum', 'Septal cartilage, lacrimal bone, and inferior concha'], a: 0,
    ex: 'The nasal septum consists of the perpendicular plate of the ethmoid bone, the vomer, and the septal cartilage.' },

    q: 'The superior, middle, and inferior nasal conchae are all bony projections of the ethmoid bone.', a: false,

  { t: 'c', id: 'U-C2', title: 'Paranasal sinus drainage and Kiesselbach epistaxis plexus', src: 'URT p.11–17',
    html: '<div class="two"><div class="stack"><div class="tblwrap"><table class="tbl"><thead><tr><th>Site in nasal cavity</th><th>Structure(s) opening here</th></tr></thead><tbody>' +
      '<tr><td><b>{{Sphenoethmoidal recess}}</b></td><td>{{Sphenoidal sinus}}</td></tr>' +

      '<tr><td><b>Middle meatus — {{hiatus semilunaris}}</b></td><td>{{Frontal sinus}}, {{anterior ethmoidal}} air cells, {{maxillary sinus}}</td></tr>' +

      '<ul class="pts"><li><b>{{Kiesselbach area}} (Little area)</b> on the anteroinferior septum is the most common site of epistaxis, fed by 5 arteries: anterior &amp; posterior ethmoidal (from ophthalmic), sphenopalatine &amp; greater palatine (from internal maxillary), and septal branch of {{superior labial}} (from facial).</li>' +

      '<div class="stack">' + CVS.fig('urt-meatus', 'Openings of paranasal sinuses and tear drainage on the lateral wall.', 'urt', 13) + CVS.fig('urt-epistaxis', 'Arterial anastomoses on the anterior septum in nosebleed.', 'urt', 16) + '</div></div>' },
  { t: 'q', id: 'U4', src: 'URT p.13–14', core: true,

  { t: 'tf', id: 'U7', src: 'URT p.21, 24',

  { t: 'c', id: 'U-C4', title: 'Laryngeal cartilages, fibro-elastic membranes and cavity', src: 'URT p.25–35',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>9 cartilages (C3–C6)</b>: 3 unpaired ({{thyroid cartilage}}, {{cricoid cartilage}}, {{epiglottis}}) and 3 paired ({{arytenoid}}, corniculate, cuneiform). The first two unpaired plus most of the ladle-shaped pair are {{hyaline cartilage}}; the rest are {{elastic cartilage}}.</li>' +
      '<li><b>Membranes</b>: the {{quadrangular membrane}} runs from the lateral border of the epiglottic leaf to the ladle-shaped cartilage, its lower free edge forming the {{vestibular ligament}} (false cord). The {{conus elasticus}} forms the {{median cricothyroid ligament}} anteriorly and the {{vocal ligament}} (true cord) superiorly.</li>' +
      '<li><b>Interior</b>: laryngeal ventricle separates false folds (rima vestibuli) from true folds (rima glottidis). True cords are lined by {{stratified squamous}} epithelium, and the glottic region has no lymphatic drainage.</li>' +
      '<li><b>Emergency airway</b>: emergency cricothyroidotomy pierces the cricothyroid membrane into the subglottis.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('urt-larynx-cart', 'Laryngeal skeleton, fibro-elastic membranes, and ligaments.', 'urt', 28) + CVS.fig('urt-larynx-cor', 'Coronal section showing laryngeal vestibule, ventricle, and cords.', 'urt', 31) + '</div></div>' },
  { t: 'q', id: 'U8', src: 'URT p.28, 31, 34', core: true,
    q: 'The superior free margin of the conus elasticus thickens to form which structure, and what lies at its anterior midline thickening?',
    o: ['Vocal ligament superiorly; median cricothyroid ligament anteriorly (pierced in emergency cricothyroidotomy)', 'Vestibular ligament superiorly; thyrohyoid membrane anteriorly', 'Aryepiglottic ligament superiorly; cricotracheal ligament anteriorly', 'Vocal ligament superiorly; quadrangular membrane anteriorly', 'Vestibular ligament superiorly; median cricothyroid ligament anteriorly'], a: 0,
    ex: 'The conus elasticus attaches inferiorly to the cricoid cartilage; its superior free edge is the vocal ligament (true vocal cord) and its anterior thickening is the median cricothyroid ligament, pierced during an emergency cricothyroidotomy.' },
  { t: 'tf', id: 'U9', src: 'URT p.31–32', core: true,
    q: 'The true vocal folds are covered by stratified squamous epithelium, and carcinoma restricted to the glottic region has a low rate of early lymphatic metastasis because the glottis has no lymphatic drainage.', a: true,
    ex: 'True. Unlike the rest of the larynx (lined by respiratory epithelium with rich lymphatics), the true vocal cords are lined by stratified squamous epithelium and the glottic region lacks lymphatic drainage.' },

  { t: 'c', id: 'U-C5', title: 'Intrinsic laryngeal muscles, nerves and trachea', src: 'URT p.36–44',
    html: '<div class="two"><div class="stack"><div class="tblwrap"><table class="tbl"><thead><tr><th>Intrinsic muscle</th><th>Main action on cords / rima glottidis</th><th>Motor nerve</th></tr></thead><tbody>' +
      '<tr><td><b>{{Posterior cricoarytenoid}}</b></td><td><b>Sole abductor</b> — {{opens rima glottidis}}</td><td>Inferior (recurrent) laryngeal n.</td></tr>' +
      '<tr><td><b>Lateral cricoarytenoid</b> &amp; <b>transverse/oblique arytenoids</b></td><td>Adductors — {{close rima glottidis}}</td><td>Inferior (recurrent) laryngeal n.</td></tr>' +
      '<tr><td><b>{{Cricothyroid}}</b></td><td>{{Tenses}} (lengthens) vocal folds</td><td>{{External laryngeal}} n.</td></tr>' +
      '<tr><td><b>{{Thyroarytenoid}}</b> &amp; <b>{{vocalis}}</b></td><td>{{Relaxes}} (shortens) vocal folds</td><td>Inferior (recurrent) laryngeal n.</td></tr></tbody></table></div>' +
      '<ul class="pts"><li><b>Sensory innervation</b>: {{internal laryngeal}} nerve above the vocal folds; inferior (recurrent) laryngeal nerve below the vocal folds.</li>' +
      '<li><b>Trachea (C6 to T4/T5 sternal angle)</b>: 16–20 C-shaped hyaline rings (length 10 cm in URT p.41 vs 12 cm in Lung p.23) bridged posteriorly by smooth {{trachealis}} muscle abutting the esophagus; bifurcates at the {{carina}}.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('urt-larynx-musc', 'Actions of intrinsic laryngeal muscles on the laryngeal inlet and vocal ligaments.', 'urt', 37) + CVS.fig('urt-larynx-nerve', 'Superior and recurrent laryngeal nerve branches and arterial supply.', 'urt', 39) + '</div></div>' },
  { t: 'q', id: 'U10', src: 'URT p.37–38', core: true,
    q: 'Which intrinsic laryngeal muscle is the ONLY muscle that opens (abducts) the rima glottidis?',
    o: ['Posterior cricoarytenoid muscle', 'Lateral cricoarytenoid muscle', 'Cricothyroid muscle', 'Thyroarytenoid (vocalis) muscle', 'Transverse arytenoid muscle'], a: 0,
    ex: 'The posterior cricoarytenoid muscle rotates the arytenoid cartilages externally, making it the sole abductor that opens the rima glottidis.' },
  { t: 'q', id: 'U11', src: 'URT p.39–40', core: true,
    q: 'During thyroidectomy, ligation of the superior thyroid artery injures the accompanying nerve. Which muscle is paralyzed and what voice change results?',
    o: ['Cricothyroid muscle → monotone voice (inability to tense the vocal fold)', 'Posterior cricoarytenoid muscle → inability to abduct the vocal fold', 'Vocalis muscle → hoarseness with complete loss of adduction', 'Thyroepiglottic muscle → inability to widen the laryngeal inlet', 'Lateral cricoarytenoid muscle → loss of sensation above the vocal cords'], a: 0,
    ex: 'The external laryngeal nerve runs closely with the superior thyroid artery and supplies the cricothyroid muscle. Injury paralyzes the cricothyroid, causing loss of vocal fold tension and a monotone voice.' },
  { t: 'q', id: 'U12', src: 'URT p.39',
    q: 'Sensory innervation to the laryngeal mucosa ABOVE the true vocal cords is provided by the:',
    o: ['Internal laryngeal nerve (branch of superior laryngeal nerve)', 'External laryngeal nerve (branch of superior laryngeal nerve)', 'Inferior laryngeal nerve (continuation of recurrent laryngeal nerve)', 'Glossopharyngeal nerve (CN IX)', 'Ansa cervicalis'], a: 0,
    ex: 'The internal laryngeal nerve provides sensory and autonomic innervation to the laryngeal mucosa above the true vocal folds; the inferior (recurrent) laryngeal nerve supplies sensory fibers below the true vocal folds.' },
  { t: 'tf', id: 'U13', src: 'URT p.41–42',
    q: 'The tracheal rings are complete O-shaped rings of elastic cartilage that prevent airway collapse posteriorly against the esophagus.', a: false,
    ex: 'False. The 16–20 tracheal rings are incomplete C-shaped hyaline cartilages; the flat posterior wall lacks cartilage and contains the involuntary trachealis muscle and fibroelastic membrane to allow esophageal expansion during swallowing.' },
  { t: 'open', id: 'U14', src: 'URT p.44', core: true,
    q: 'Complete the 10 lecture post-test items: (1) Medial wall of nasal cavities; (2) Sinus opening into sphenoethmoidal recess; (3) Structure whose floor forms the roof of the maxillary sinus; (4) Tonsil in roof/posterior wall of nasopharynx (adenoid); (5) External circular layer of pharyngeal muscles; (6) Sharp-edged mucosal folds enclosing vocal ligaments and vocalis muscles; (7) Muscle that opens the rima glottidis; (8) Nerve supplying cricothyroid muscle; (9) Involuntary muscle spanning posterior gaps in tracheal rings; (10) Transverse neck incision into anterior tracheal wall for airway obstruction.',
    ans: '(1) Nasal septum (perpendicular plate of ethmoid, vomer, septal cartilage) · (2) Sphenoidal sinus · (3) Orbit · (4) Pharyngeal tonsil · (5) Superior, middle, and inferior pharyngeal constrictor muscles · (6) Vocal folds (true vocal cords) · (7) Posterior cricoarytenoid muscles · (8) External laryngeal nerve (branch of superior laryngeal nerve) · (9) Trachealis muscle · (10) Tracheostomy.' }
]});

/* Section W: Thoracic Wall & Diaphragm (681027 Thoracic wall & diaphragm.pdf, 30 pages). */
CVS.add({ id: 'W', short: 'Thoracic wall', title: 'Thoracic Wall, Intercostal Space, Pleura & Diaphragm', kind: 'Lecture',
  blurb: 'Sternum and rib articulations, intercostal muscle layers, accessory muscles of respiration, the intercostal VAN bundle and nerve block, thoracocentesis vs thoracostomy, flail chest, and diaphragm.',
  items: [
  { t: 'c', id: 'W-C1', title: 'Thoracic cage: sternum, rib classes and vertebral joints', src: 'Thoracic wall p.2–6',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Sternum</b>: {{manubrium}} (articulates with clavicle and 1st rib), {{sternal angle}} of Louis (junction with sternal body at the {{2nd rib}}), sternal body, and {{xiphoid process}}.</li>' +
      '<li><b>12 pairs of ribs</b>: {{true ribs}} (ribs 1–7, attach directly to sternum via costal cartilages), {{false ribs}} (ribs 8–12), including {{floating ribs}} (ribs 11–12, free anterior ends).</li>' +
      '<li><b>Typical ribs ({{ribs 3–9}})</b>: head with two articular facets separated by a crest, neck, tubercle, and shaft with an inferior {{costal groove}}.</li>' +
      '<li><b>Posterior articulations</b>: rib head articulates with {{vertebral bodies}} (demifacets); rib tubercle articulates with the {{transverse process}} of the corresponding thoracic vertebra.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('wall-sternum', 'Divisions of the sternum and the sternal junction at the second costal cartilage.', 'wall', 3) + CVS.fig('wall-rib', 'Costovertebral and costotransverse articulations of a typical rib.', 'wall', 6) + '</div></div>' },
  { t: 'q', id: 'W1', src: 'Thoracic wall p.3–4', core: true,
    q: 'The sternal angle (angle of Louis) is the palpable junction between the manubrium and body of the sternum and serves as the surface landmark for counting which rib?',
    o: ['2nd rib', '1st rib', '4th rib', '7th rib', '8th rib'], a: 0,
    ex: 'The 2nd costal cartilage articulates at the sternal angle (of Louis), making it the clinical landmark for counting ribs and intercostal spaces.' },
  { t: 'q', id: 'W2', src: 'Thoracic wall p.4–6',
    q: 'Which statement accurately describes the classification and articulations of ribs?',
    o: ['Typical ribs (3–9) articulate via their head with vertebral body demifacets and via their tubercle with the transverse process', 'True ribs are ribs 1–8 and floating ribs are ribs 9–12', 'The tubercle of a typical rib articulates with the sternal angle', 'False ribs (8–12) all lack costal cartilages anteriorly', 'The costal groove lies along the superior border of a typical rib'], a: 0,
    ex: 'True ribs are 1–7, false ribs are 8–12 (with 11–12 floating), and typical ribs are 3–9. The head articulates with vertebral demifacets and the tubercle with the transverse process.' },

  { t: 'c', id: 'W-C2', title: 'Intercostal muscle layers and transversus thoracis', src: 'Thoracic wall p.7–11',
    html: '<div class="two"><div class="stack"><div class="tblwrap"><table class="tbl"><thead><tr><th>Layer</th><th>Fiber direction &amp; extent</th><th>Respiratory action</th></tr></thead><tbody>' +
      '<tr><td><b>{{External intercostal}}</b> (outermost)</td><td>{{Inferiorly and anteriorly}} ("hands in pockets"); vertebral column to costochondral junction, then {{external intercostal membrane}}</td><td>{{Elevates ribs}} during inspiration</td></tr>' +
      '<tr><td><b>{{Internal intercostal}}</b> (middle)</td><td>{{Superiorly and anteriorly}}; sternum to costal angle, then {{internal intercostal membrane}}</td><td>{{Depresses ribs}} during forced expiration</td></tr>' +
      '<tr><td><b>{{Innermost intercostal}}</b> (deepest)</td><td>Same fiber orientation as middle layer; occupies lateral and back spaces</td><td>Assists rib depression</td></tr></tbody></table></div>' +
      '<ul class="pts"><li><b>{{Transversus thoracis}}</b>: deep anterior sheet arising from lower sternal body and xiphoid to insert on {{ribs 2–6}}; innervated by intercostal nerves 3–6 to pull ribs down in forced expiration.</li></ul></div>' +
      CVS.fig('wall-intercostal', 'Three layers of intercostal muscles and their membranes in cross-section.', 'wall', 10) + '</div>' },
  { t: 'q', id: 'W3', src: 'Thoracic wall p.8–9', core: true,
    q: 'How do the external intercostal muscles differ from the internal intercostal muscles?',
    o: ['External fibers run inferiorly and anteriorly to elevate ribs in inspiration, and are replaced anteriorly by membrane from the costochondral junction to the sternum', 'External fibers run superiorly and anteriorly to depress ribs in forced expiration', 'Internal fibers run inferiorly and anteriorly and are replaced anteriorly by membrane', 'External fibers lie deep to the intercostal neurovascular bundle', 'Internal fibers elevate the ribs during quiet inspiration'], a: 0,
    ex: 'External intercostals run inferoanteriorly, elevate ribs during inspiration, and become the external (anterior) intercostal membrane between the costochondral junction and sternum. Internal intercostals run superoanteriorly and depress ribs in forced expiration.' },
  { t: 'tf', id: 'W4', src: 'Thoracic wall p.11',
    q: 'The transversus thoracis muscle lies in the innermost plane of the anterior thoracic wall, inserts on ribs 2–6, and depresses the ribs during forced expiration.', a: true,
    ex: 'True. Transversus thoracis originates from the xiphoid process and lower sternal body, inserts on costal cartilages 2–6, and depresses the ribs during forced expiration.' },

  { t: 'c', id: 'W-C3', title: 'Mechanics of quiet vs forceful breathing and accessory muscles', src: 'Thoracic wall p.12–14',
    html: '<div class="stack"><ul class="pts">' +
      '<li><b>Quiet (normal) inspiration</b>: driven primarily by contraction of the {{diaphragm}} together with the external intercostal muscles.</li>' +
      '<li><b>Quiet (normal) expiration</b>: passive process driven by {{elastic recoil}} of the lungs and relaxation of the inspiratory muscles.</li>' +
      '<li><b>Accessory muscles of {{forceful inspiration}}</b> (exercise or respiratory distress): {{sternocleidomastoid}} (SCM), {{scalene muscles}}, {{pectoralis minor}}, {{serratus anterior}} &amp; posterior, and {{levator costarum}}.</li>' +
      '<li><b>Muscles of {{forceful expiration}}</b>: internal and innermost intercostals, transversus thoracis, and {{abdominal muscles}} (rectus abdominis, external oblique, internal oblique).</li></ul></div>' },
  { t: 'q', id: 'W5', src: 'Thoracic wall p.12–14', core: true,
    q: 'Which group consists entirely of accessory muscles used during FORCEFUL INSPIRATION?',
    o: ['Sternocleidomastoid, scalenes, pectoralis minor, serratus anterior, and levator costarum', 'Internal intercostals, transversus thoracis, and rectus abdominis', 'External oblique, internal oblique, and innermost intercostals', 'Diaphragm relaxation and lung elastic recoil only', 'Transversus thoracis, scalenes, and rectus abdominis'], a: 0,
    ex: 'Forceful inspiration recruits SCM, scalenes, pectoralis minor, serratus anterior/posterior, and levator costarum. Internal/innermost intercostals, transversus thoracis, and abdominal muscles drive forceful expiration.' },
  { t: 'tf', id: 'W6', src: 'Thoracic wall p.12, 14',
    q: 'Normal quiet expiration requires active contraction of the internal intercostal and rectus abdominis muscles.', a: false,
    ex: 'False. Normal quiet expiration is passive, resulting from relaxation of the diaphragm/thoracic wall and elastic recoil of the lungs. Internal intercostals and abdominal muscles act during forceful expiration.' },

  { t: 'c', id: 'W-C4', title: 'Intercostal neurovascular bundle (VAN), vessels and nerve block', src: 'Thoracic wall p.15–20',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Plane &amp; order</b>: the main neurovascular bundle runs in the costal groove along the inferior border of the rib, between the {{internal and innermost}} intercostal layers, arranged superior-to-inferior as {{VAN}} (Vein, Artery, Nerve).</li>' +
      '<li><b>Arteries</b>: {{anterior intercostal}} arteries branch from the {{internal thoracic artery}}; {{posterior intercostal}} arteries arise from the thoracic {{aorta}}.</li>' +
      '<li><b>Veins</b>: anterior veins drain to the internal thoracic vein; posterior veins drain to the {{azygos}} vein on the right and {{hemiazygos and accessory hemiazygos}} veins on the left.</li>' +
      '<li><b>Clinical needle placement</b>: an {{intercostal nerve block}} (or herpes zoster dermatomal pain) targets the {{lower border}} of the rib, whereas pleural procedures pass along the {{upper border}} of the rib below to avoid the bundle.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('wall-van', 'Arrangement of Vein, Artery, and Nerve in the costal groove.', 'wall', 18) + CVS.fig('wall-block', 'Infiltration at the inferior costal margin for an intercostal block.', 'wall', 20) + '</div></div>' },
  { t: 'q', id: 'W7', src: 'Thoracic wall p.17–18', core: true,
    q: 'In what muscular plane and in what superior-to-inferior order does the main intercostal neurovascular bundle travel in the costal groove?',
    o: ['Between internal and innermost intercostal muscles; Vein → Artery → Nerve (VAN)', 'Between external and internal intercostal muscles; Nerve → Artery → Vein (NAV)', 'Deep to innermost intercostal muscle on the superior rib border; Artery → Vein → Nerve', 'Between external and internal intercostal muscles; Vein → Artery → Nerve (VAN)', 'Subcutaneously superficial to external intercostal muscle; Vein → Nerve → Artery'], a: 0,
    ex: 'The intercostal vein, artery, and nerve (VAN from superior to inferior) run sheltered in the costal groove between the internal and innermost intercostal muscle layers.' },
  { t: 'q', id: 'W8', src: 'Thoracic wall p.15–16',
    q: 'Anterior intercostal arteries arise directly from which vessel, and into which venous system do the right posterior intercostal veins drain?',
    o: ['Internal thoracic artery; azygos vein', 'Thoracic aorta; internal thoracic vein', 'Subclavian artery; hemiazygos vein', 'Thoracic aorta; accessory hemiazygos vein', 'Axillary artery; brachiocephalic vein'], a: 0,
    ex: 'Anterior intercostal arteries branch from the internal thoracic artery (veins drain to the internal thoracic vein). Posterior intercostal arteries branch from the aorta, and right posterior intercostal veins drain into the azygos vein.' },
  { t: 'q', id: 'W9', src: 'Thoracic wall p.20, 26', core: true,
    q: 'Contrast the needle/tube entry site relative to the rib for an intercostal nerve block versus a tube thoracostomy:',
    o: ['Intercostal nerve block at the lower border of the rib; thoracostomy at the upper border of the rib', 'Both are performed at the lower border of the rib', 'Both are performed at the upper border of the rib', 'Intercostal nerve block at the upper border of the rib; thoracostomy at the lower border of the rib', 'Intercostal nerve block through the costal cartilage; thoracostomy through the sternal angle'], a: 0,
    ex: 'An intercostal nerve block targets the nerve in the costal groove at the lower border of the rib, whereas thoracostomy (and thoracocentesis) enters at the upper border of the lower rib to avoid injuring the VAN bundle.' },

  { t: 'c', id: 'W-C5', title: 'Pleural procedures, flail chest and the diaphragm', src: 'Thoracic wall p.21–30',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>{{Thoracocentesis}} (pleural tap)</b>: needle aspiration of pleural effusion at the {{7th or 8th}} intercostal space along the {{posterior axillary}} or mid-scapular line (note: Lung p.10 teaches 8th–10th ICS at the midaxillary line).</li>' +
      '<li><b>{{Tube thoracostomy}} (chest drain)</b>: evacuates air ({{pneumothorax}}) or blood ({{hemothorax}}) via the {{4th or 5th}} intercostal space at the {{anterior or mid-axillary}} line, hugging the upper rib border.</li>' +
      '<li><b>{{Flail chest}}</b>: multiple rib fractures with isolated segment causing {{paradoxical movement}} (drawn inward on inspiration, pushed outward on expiration).</li>' +
      '<li><b>Diaphragm</b>: dome with central tendon, right &amp; left crura (L2–L4), and 3 major openings (IVC in central tendon, esophageal hiatus in right crus, aortic hiatus behind crura); motor &amp; central sensory via {{phrenic nerve}} (C3–C5), peripheral sensory via lower 6 intercostal nerves.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('wall-flail', 'Isolated rib segment moving inward during inspiration and outward during expiration.', 'wall', 28) + CVS.fig('wall-diaphragm', 'Inferior view of the diaphragm showing crura, central tendon, and major openings.', 'wall', 29) + '</div></div>' },
  { t: 'q', id: 'W10', src: 'Thoracic wall p.23, 26', core: true,
    q: 'According to the thoracic wall lecture, what are the standard anatomical locations for (1) needle thoracocentesis for pleural effusion and (2) tube thoracostomy (chest drain) for pneumothorax/hemothorax?',
    o: ['Thoracocentesis: 7th/8th ICS at posterior axillary or mid-scapular line; Thoracostomy: 4th/5th ICS at anterior or mid-axillary line', 'Thoracocentesis: 2nd ICS at midclavicular line; Thoracostomy: 9th ICS at paravertebral line', 'Thoracocentesis: 4th/5th ICS at anterior axillary line; Thoracostomy: 7th/8th ICS at mid-scapular line', 'Both are performed at the 4th/5th ICS in the midclavicular line', 'Thoracocentesis: 11th ICS at vertebral border; Thoracostomy: 1st ICS at sternal border'], a: 0,
    ex: 'In the Thoracic Wall lecture, thoracocentesis is placed at the 7th or 8th ICS (posterior axillary or mid-scapular line), whereas tube thoracostomy is placed at the 4th or 5th ICS (anterior or mid-axillary line) at the upper border of the rib.' },
  { t: 'q', id: 'W11', src: 'Thoracic wall p.27–28', core: true,
    q: 'A patient with blunt chest trauma has fractures of multiple adjacent ribs in two places, producing an isolated chest wall segment (flail chest). How does the flail segment move during respiration?',
    o: ['Paradoxical movement: pulled inward during inspiration (negative intrathoracic pressure) and pushed outward during expiration', 'Pulled outward during inspiration and pulled inward during expiration', 'Remains completely immobile throughout inspiration and expiration', 'Moves upward only during passive expiration', 'Collapses only during forced coughing'], a: 0,
    ex: 'In flail chest, the unattached segment moves paradoxically in response to intrathoracic pressure: sucked inward during inspiration and pushed outward during expiration, severely impairing ventilation.' },
  { t: 'tf', id: 'W12', src: 'Thoracic wall p.29–30',
    q: 'In the diaphragm, the inferior vena cava passes through the central tendon, whereas the esophageal hiatus is formed by muscular fibers of the right crus.', a: true,
    ex: 'True. As shown on the diaphragm slides, the caval opening lies within the central tendon (to the right of midline), the esophageal hiatus passes through the muscular sling of the right crus, and the abdominal aorta passes posteriorly between the right and left crura.' },
  { t: 'open', id: 'W13', src: 'Thoracic wall p.20, 23, 26; Lung & bronchi p.10',
    q: 'Compare (a) needle placement relative to the rib for intercostal nerve block vs pleural tap/chest tube, and (b) the intercostal space taught for thoracocentesis in the Thoracic Wall lecture vs the Lung & Bronchial Tree lecture.',
    ans: '(a) Intercostal nerve block is injected at the LOWER border of the rib to reach the VAN bundle in the costal groove; pleural tap and chest tube are inserted at the UPPER border of the rib to avoid the neurovascular bundle. (b) Thoracic Wall p.23 gives the 7th or 8th ICS at the posterior axillary or mid-scapular line; Lung & Bronchial Tree p.10 gives the 8th, 9th, or 10th ICS at the midaxillary line into the costodiaphragmatic recess.' }
]});

/* Section B: Lung & Bronchial Tree (681028 Lung and bronchial tree.pdf, 48 pages). */
CVS.add({ id: 'B', short: 'Lung & bronchi', title: 'Lungs, Pleural Recesses, Bronchial Tree & Neurovasculature', kind: 'Lecture',
  blurb: 'Pleural reflections and 6-8-10 / 8-10-12 surface markings, mediastinal impressions on right vs left lungs, eparterial vs hyparterial bronchi, bronchial vessels and azygos system, and thoracic lymphatics and nerves.',
  items: [
  { t: 'c', id: 'B-C1', title: 'Pleurae, surface markings (6-8-10 / 8-10-12) and pleural tap', src: 'Lung & bronchi p.2–10',
    html: '<div class="two"><div class="stack"><div class="tblwrap"><table class="tbl"><thead><tr><th>Reference line</th><th>Inferior border of lung</th><th>Inferior border of pleura</th></tr></thead><tbody>' +
      '<tr><td><b>Midclavicular line (MCL)</b></td><td>Rib {{6}}</td><td>Rib {{8}}</td></tr>' +
      '<tr><td><b>Midaxillary line (MAL)</b></td><td>Rib 8</td><td>Rib {{10}}</td></tr>' +
      '<tr><td><b>Paravertebral line</b></td><td>Rib 10</td><td>Rib {{12}}</td></tr></tbody></table></div>' +
      '<ul class="pts">' +
      '<li><b>Layers &amp; dome</b>: parietal pleura (separated from the chest wall by {{extrapleural fascia}}) and visceral pleura; the cervical dome ({{cupola}}) rises {{1 inch}} above the medial third of the clavicle.</li>' +
      '<li><b>Recesses &amp; fluid</b>: {{costomediastinal}} and {{costodiaphragmatic}} recesses; excess fluid causes hydrothorax, haemothorax, pyothorax (empyema), or {{chylothorax}} (lymph).</li>' +
      '<li><b>Pleural tap (thoracentesis)</b>: needle enters the {{8th, 9th or 10th}} intercostal space at the midaxillary line above the superior rib border (vs 7th/8th ICS posterior axillary/mid-scapular in Thoracic wall p.23).</li></ul></div>' +
      '<div class="stack">' + CVS.fig('lung-recess', 'Inferior surface markings of lung and parietal pleura across three vertical lines.', 'lung', 6) + CVS.fig('lung-tap', 'Needle path into the pleural recess above the upper costal margin.', 'lung', 10) + '</div></div>' },
  { t: 'q', id: 'B1', src: 'Lung & bronchi p.3, 6', core: true,
    q: 'At the midclavicular, midaxillary, and paravertebral lines, the inferior borders of the lung and parietal pleura lie at which ribs, and where is the pleural cupola located?',
    o: ['Lung: ribs 6, 8, 10; Pleura: ribs 8, 10, 12; Cupola: 1 inch above the medial third of the clavicle', 'Lung: ribs 8, 10, 12; Pleura: ribs 6, 8, 10; Cupola: 1 inch below the lateral third of the clavicle', 'Lung: ribs 4, 6, 8; Pleura: ribs 6, 8, 10; Cupola: at the sternal angle', 'Lung: ribs 6, 8, 10; Pleura: ribs 7, 9, 11; Cupola: above the acromioclavicular joint', 'Both lung and pleura end at ribs 6, 8, 10 across all three lines'], a: 0,
    ex: 'Remember the two-rib gap (costodiaphragmatic recess): the lung ends at ribs 6, 8, 10 and the parietal pleura at ribs 8, 10, 12 along the midclavicular, midaxillary, and paravertebral lines. The cupola projects 1 inch above the medial third of the clavicle.' },
  { t: 'q', id: 'B2', src: 'Lung & bronchi p.9–10', core: true,
    q: 'In the Lung & Bronchial Tree lecture, a pleural tap (thoracentesis) into the costodiaphragmatic recess at the midaxillary line is performed at which intercostal spaces, and what structures are at risk if the needle is inserted too deep or at the wrong rib border?',
    o: ['8th, 9th, or 10th ICS above the superior border of the rib; risk to lung, liver, spleen, diaphragm, and intercostal neurovascular bundle', '4th or 5th ICS below the inferior border of the rib; risk only to the internal thoracic artery', '2nd ICS at the midclavicular line; risk to the cupola', '11th or 12th ICS below the 12th rib; risk only to the trachea', '6th ICS at the sternal border; risk to the right main bronchus'], a: 0,
    ex: 'Lung p.10 specifies the 8th, 9th, or 10th ICS at the midaxillary line above the superior margin of a rib; improper placement risks puncturing the lung, diaphragm, liver (right), spleen (left), or intercostal VAN bundle.' },
  { t: 'tf', id: 'B3', src: 'Lung & bronchi p.2, 8',
    q: 'Extrapleural fascia is a layer of loose connective tissue that separates the visceral pleura from the lung parenchyma, and accumulation of lymph in the pleural cavity is termed pyothorax.', a: false,
    ex: 'False. Extrapleural fascia separates the parietal pleura from the overlying thoracic wall (visceral pleura is firmly attached to the lung). Lymph in the pleural space is chylothorax; pus is pyothorax (empyema).' },

  { t: 'c', id: 'B-C2', title: 'Lung surfaces, fissures and mediastinal impressions', src: 'Lung & bronchi p.11–20',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Lobes &amp; fissures</b>: right lung has 3 lobes divided by oblique and {{horizontal}} fissures; left lung has 2 lobes divided by an oblique fissure, with an anterior {{cardiac notch}} and {{lingula}} on the superior lobe.</li>' +
      '<li><b>Root (hilum) &amp; sleeve</b>: transmits bronchi, pulmonary &amp; bronchial vessels, lymphatics, and plexuses; inferiorly the parietal-to-visceral reflection hangs down as the {{pulmonary ligament}}.</li>' +
      '<li><b>Right mediastinal impressions</b>: {{arch of azygos vein}} arching over the root, {{superior vena cava}} (SVC), {{brachiocephalic vein}}, and {{esophagus}} behind the hilum.</li>' +
      '<li><b>Left mediastinal impressions</b>: {{aortic arch}} above the root, {{descending aorta}} behind, {{subclavian artery}} sulcus heading to the apex, and a deep cardiac impression.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('lung-impressions', 'Mediastinal surface of the right lung showing venous and esophageal grooves.', 'lung', 18) + CVS.fig('lung-impressions-lt', 'Mediastinal surface of the left lung showing arterial grooves and tongue-like projection.', 'lung', 20) + '</div></div>' },
  { t: 'q', id: 'B4', src: 'Lung & bronchi p.17–20', core: true,
    q: 'Which pairing of mediastinal impressions on the right versus left lung is CORRECT?',
    o: ['Right lung: arch of azygos vein, SVC, and esophagus; Left lung: aortic arch, descending aorta, and subclavian artery', 'Right lung: aortic arch and descending aorta; Left lung: arch of azygos vein and SVC', 'Right lung: lingula and cardiac notch; Left lung: horizontal fissure and SVC groove', 'Right lung: thoracic duct and left subclavian artery; Left lung: inferior vena cava and azygos arch', 'Both lungs have symmetrical grooves for the aortic arch and arch of the azygos vein'], a: 0,
    ex: 'The right mediastinal surface is grooved by venous structures (arch of azygos vein over the hilum, SVC, brachiocephalic vein) and the esophagus; the left mediastinal surface is grooved by arterial structures (aortic arch, descending aorta, subclavian artery) and has a deep cardiac notch with the lingula.' },
  { t: 'tf', id: 'B5', src: 'Lung & bronchi p.14–15',
    q: 'The pulmonary ligament is a double-layered fold of pleura extending inferiorly from the root of the lung on the mediastinal surface.', a: true,
    ex: 'True. Below the root of the lung, the continuity between parietal and visceral pleura forms the sleeve-like pulmonary ligament on the mediastinal surface.' },

  { t: 'c', id: 'B-C3', title: 'Tracheobronchial tree, sternal angle and hilar relations', src: 'Lung & bronchi p.21–30',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Conducting vs respiratory zones</b>: conducting part runs from trachea → main → lobar → segmental bronchi → {{terminal bronchioles}}; respiratory part begins at {{respiratory bronchioles}} → alveolar ducts → alveolar sacs → alveoli.</li>' +
      '<li><b>Sternal angle (of Louis, {{DT4}})</b>: marks the manubriosternal joint, 2nd rib, beginning/end of aortic arch, inferior border of superior mediastinum, and tracheal bifurcation ({{carina}}; trachea length given as {{12 cm}} here vs 10 cm in URT p.41).</li>' +
      '<li><b>Main bronchi &amp; segments</b>: right main bronchus is {{wider, shorter, and more vertical}} (foreign body predisposition) and supplies {{10 segments}} (3+2+5); left lung has {{8 segments}} (4+4).</li>' +
      '<li><b>Hilar relationship to pulmonary artery</b>: the right superior lobar bronchus arises above the right pulmonary artery and is called the {{eparterial bronchus}}; all other lobar bronchi pass below the pulmonary artery ({{hyparterial bronchi}}).</li></ul></div>' +
      CVS.fig('lung-hilum', 'Comparison of right and left hilar structures and lobar bronchial positions.', 'lung', 28) + '</div>' },
  { t: 'q', id: 'B6', src: 'Lung & bronchi p.24', core: true,
    q: 'Which anatomical landmark does NOT lie at the horizontal plane of the sternal angle (angle of Louis, disc T4–T5)?',
    o: ['Origin of the trachea at the inferior border of the cricoid cartilage (C6)', 'Articulation of the 2nd costal cartilages with the sternum', 'Tracheal bifurcation at the carina', 'Beginning and ending of the aortic arch', 'Inferior border of the superior mediastinum'], a: 0,
    ex: 'The sternal angle (DT4) marks the manubriosternal junction, 2nd rib, beginning and end of the aortic arch, tracheal bifurcation (carina), and inferior border of the superior mediastinum. The trachea begins at C6 (cricoid cartilage).' },
  { t: 'q', id: 'B7', src: 'Lung & bronchi p.27–28', core: true,
    q: 'What is the "eparterial bronchus", and how many bronchopulmonary segments are present in the right and left lungs in this lecture?',
    o: ['Right superior lobar bronchus (passing superior to the right pulmonary artery); 10 right segments (3+2+5) and 8 left segments (4+4)', 'Left superior lobar bronchus (passing superior to the left pulmonary artery); 8 right segments and 10 left segments', 'Right middle lobar bronchus; 10 segments in each lung', 'Right main bronchus before the carina; 12 right segments and 8 left segments', 'Left inferior lobar bronchus; 9 right segments and 9 left segments'], a: 0,
    ex: 'The eparterial bronchus is the right superior lobar bronchus because it lies superior to the right pulmonary artery; all other lobar bronchi are hyparterial (below the pulmonary artery). The right lung has 10 segments (3 upper, 2 middle, 5 lower) and the left lung has 8 segments (4 upper, 4 lower).' },
  { t: 'q', id: 'B8', src: 'Lung & bronchi p.22, 29',
    q: 'Where does the conducting part of the tracheobronchial tree end and the respiratory (gas-exchanging) part begin?',
    o: ['Ends at terminal bronchioles; begins at respiratory bronchioles', 'Ends at segmental (tertiary) bronchi; begins at terminal bronchioles', 'Ends at lobar (secondary) bronchi; begins at alveolar ducts', 'Ends at respiratory bronchioles; begins at alveolar sacs', 'Ends at the carina; begins at main bronchi'], a: 0,
    ex: 'The conducting part ends at the terminal bronchioles; the respiratory part begins with the respiratory bronchioles, followed by alveolar ducts, alveolar sacs, and alveoli.' },

  { t: 'c', id: 'B-C4', title: 'Bronchial vessels and the azygos venous system', src: 'Lung & bronchi p.31–37',
    html: '<div class="two"><div class="stack"><div class="tblwrap"><table class="tbl"><thead><tr><th>Vessel</th><th>Right side</th><th>Left side</th></tr></thead><tbody>' +
      '<tr><td><b>Bronchial arteries</b> (supply tree, visceral pleura, pulmonary a.)</td><td><b>1 artery</b> from {{3rd right posterior intercostal}} artery</td><td><b>2 arteries</b> directly from {{thoracic aorta}} (at {{T5 or T6}})</td></tr>' +
      '<tr><td><b>Bronchial veins</b></td><td>Drain into {{azygos vein}}</td><td>Drain into {{accessory hemiazygos}} vein</td></tr></tbody></table></div>' +
      '<ul class="pts">' +
      '<li><b>Right-sided collector</b>: receives right posterior intercostal, right subcostal, and {{right ascending lumbar}} veins (plus both left-sided tributaries) and arches over the right lung root to empty into the {{SVC}}.</li>' +
      '<li><b>{{Hemiazygos vein}}</b>: drains left ascending lumbar, left subcostal, and {{left 9th–11th}} posterior intercostal veins, then crosses to the right side.</li>' +
      '<li><b>Upper left collector</b>: drains {{left 5th–8th}} posterior intercostal veins (and left bronchial veins), then crosses to the right side.</li></ul></div>' +
      CVS.fig('lung-azygos', 'Drainage of right and left bronchial veins into the posterior thoracic venous system.', 'lung', 34) + '</div>' },
  { t: 'q', id: 'B9', src: 'Lung & bronchi p.33–34', core: true,
    q: 'What are the usual arterial origins and venous drainage targets of the right and left bronchial vessels?',
    o: ['Right bronchial a. from 3rd right posterior intercostal a., vein → azygos v.; Left bronchial aa. (2) from aorta at T5/T6, vein → accessory hemiazygos v.', 'Right bronchial a. from thoracic aorta, vein → SVC; Left bronchial a. from internal thoracic a., vein → hemiazygos v.', 'Both right and left bronchial arteries arise from the pulmonary trunk and drain into the left atrium', 'Right bronchial a. from subclavian a., vein → brachiocephalic v.; Left bronchial a. from 3rd left intercostal a., vein → coronary sinus', 'Right bronchial aa. (2) from aorta, vein → accessory hemiazygos v.; Left bronchial a. (1) from 3rd right intercostal a., vein → azygos v.'], a: 0,
    ex: 'The single right bronchial artery arises from the 3rd right posterior intercostal artery, whereas the two left bronchial arteries arise directly from the thoracic aorta at T5–T6. Right bronchial veins drain into the azygos vein; left bronchial veins drain into the accessory hemiazygos vein.' },
  { t: 'q', id: 'B10', src: 'Lung & bronchi p.36–37',
    q: 'Which posterior intercostal veins drain into the accessory hemiazygos vein versus the hemiazygos vein?',
    o: ['Accessory hemiazygos: left 5th–8th intercostal veins; Hemiazygos: left 9th–11th intercostal veins (plus left subcostal and ascending lumbar)', 'Accessory hemiazygos: left 9th–11th intercostal veins; Hemiazygos: left 5th–8th intercostal veins', 'Accessory hemiazygos: right 5th–8th intercostal veins; Hemiazygos: right 9th–11th intercostal veins', 'Both drain only the right posterior intercostal veins into the IVC', 'Accessory hemiazygos: left 1st–4th intercostal veins; Hemiazygos: left 5th–12th intercostal veins'], a: 0,
    ex: 'On the left side, the 5th–8th posterior intercostal veins drain into the accessory hemiazygos vein, whereas the 9th–11th posterior intercostal veins (with left subcostal and left ascending lumbar veins) form the hemiazygos vein; both cross to join the azygos vein.' },

  { t: 'c', id: 'B-C5', title: 'Thoracic lymphatics, pulmonary plexuses and splanchnic nerves', src: 'Lung & bronchi p.38–48',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Thoracic lymph nodes</b>: <b>parietal</b> ({{parasternal}}, intercostal, phrenic) vs <b>visceral</b> (anterior mediastinal/brachiocephalic, posterior mediastinal, {{tracheobronchial}}).</li>' +
      '<li><b>Lymphatic ducts</b>: the first parietal group plus anterior mediastinal and hilar/carinal nodes unite into bilateral {{bronchomediastinal}} trunks, which join the {{right lymphatic duct}} on the right and the {{thoracic duct}} (arising from the {{cisterna chyli}} at L2) on the left.</li>' +
      '<li><b>{{Phrenic nerve}} (C3–C5)</b>: motor and sensory to the diaphragm, plus sensory to pericardium and mediastinal pleura.</li>' +
      '<li><b>Pulmonary plexuses</b>: parasympathetic ({{vagus nerve}}) produces {{bronchoconstriction}} and vasodilation; sympathetic produces {{bronchodilation}} and vasoconstriction.</li>' +
      '<li><b>Thoracic splanchnic nerves</b>: {{greater splanchnic}} (T5–T9) and {{lesser splanchnic}} (T10–T11) supply abdominal viscera below the diaphragm.</li></ul></div>' +
      CVS.fig('lung-lymph', 'Major lymphatic trunks and main collecting ducts at the venous angles.', 'lung', 40) + '</div>' },
  { t: 'q', id: 'B11', src: 'Lung & bronchi p.38–42', core: true,
    q: 'Which set of lymph nodes drains into the bronchomediastinal lymph trunks, and where does the thoracic duct originate?',
    o: ['Parasternal, anterior mediastinal, and tracheobronchial nodes; thoracic duct originates from the cisterna chyli at L2', 'Only intercostal and phrenic nodes; thoracic duct originates at the sternal angle (T4)', 'Cervical and axillary nodes only; thoracic duct originates in the right atrium', 'Posterior mediastinal nodes only; thoracic duct originates at the cricoid cartilage (C6)', 'Inguinal nodes directly; thoracic duct originates at T12'], a: 0,
    ex: 'The parasternal (parietal), anterior mediastinal, and tracheobronchial (visceral) nodes drain into the right and left bronchomediastinal lymph trunks. The thoracic duct begins at the cisterna chyli at vertebral level L2.' },
  { t: 'q', id: 'B12', src: 'Lung & bronchi p.43–47', core: true,
    q: 'In the pulmonary nerve plexuses, what are the opposing effects of parasympathetic (vagal) versus sympathetic stimulation, and which thoracic sympathetic ganglia give rise to the greater and lesser splanchnic nerves?',
    o: ['Parasympathetic: bronchoconstriction & vasodilation; Sympathetic: bronchodilation & vasoconstriction; Greater splanchnic: T5–T9, Lesser splanchnic: T10–T11', 'Parasympathetic: bronchodilation & vasoconstriction; Sympathetic: bronchoconstriction & vasodilation; Greater splanchnic: T1–T4, Lesser splanchnic: T5–T9', 'Parasympathetic: bronchodilation & vasodilation; Sympathetic: bronchoconstriction & vasoconstriction; Greater splanchnic: C3–C5, Lesser splanchnic: T12', 'Both divisions cause bronchodilation; Greater splanchnic: T10–T11, Lesser splanchnic: T5–T9', 'Parasympathetic supplies motor fibers to the diaphragm; Sympathetic supplies sensory fibers to the pericardium'], a: 0,
    ex: 'Parasympathetic (vagus) fibers cause bronchoconstriction and pulmonary vasodilation; sympathetic fibers cause bronchodilation and vasoconstriction. The greater splanchnic nerve arises from T5–T9 ganglia and the lesser splanchnic nerve from T10–T11 ganglia.' },
  { t: 'tf', id: 'B13', src: 'Lung & bronchi p.43',
    q: 'The phrenic nerve (C3–C5) supplies only motor fibers to the diaphragm and carries no sensory fibers from the thorax.', a: false,
    ex: 'False. The phrenic nerve (C3–C5) carries both motor and sensory fibers to the diaphragm as well as sensory fibers to the fibrous pericardium and mediastinal pleura.' },
  { t: 'open', id: 'B14', src: 'Lung & bronchi p.17–20, 28, 33–34',
    q: 'Contrast the right and left lungs across three exam-favorite categories: (1) major vascular/visceral impressions on the mediastinal surface, (2) relationship of the superior lobar bronchus to the pulmonary artery at the hilum, and (3) origin and venous drainage of the bronchial vessels.',
    ans: '(1) Mediastinal impressions — Right lung: arch of azygos vein, SVC, brachiocephalic vein, and esophagus; Left lung: aortic arch, descending aorta, subclavian artery, and deep cardiac impression (with cardiac notch & lingula). (2) Hilum — Right superior lobar bronchus is EPARTERIAL (above right pulmonary artery); left superior lobar bronchus (and right middle/inferior) is HYPARTERIAL (below pulmonary artery). (3) Bronchial vessels — Right: 1 artery from 3rd right posterior intercostal a., vein drains to azygos vein; Left: 2 arteries from thoracic aorta at T5–T6, vein drains to accessory hemiazygos vein.' }
]});

/* Section H: Histology of the respiratory system (Histology handout, slides 1–46). */
CVS.add({ id: 'H', short: 'Histology', title: 'Histology of the Respiratory System', kind: 'Lecture',
  blurb: 'Epithelial transitions from nasal vestibule to alveoli, cartilage and smooth muscle along the bronchial tree, Club (Clara) cells, Type I and II pneumocytes, pores of Kohn, the five-layer air-blood barrier, and pleural mesothelium.',
  items: [
  { t: 'c', id: 'H-C1', title: 'Conducting vs respiratory portions and upper-tract epithelia', src: 'Histology p.2–15',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Air-conducting portion</b>: nose → {{terminal bronchioles}}. <b>Respiratory portion</b>: {{respiratory bronchioles}} → alveoli.</li>' +
      '<li><b>Nasal vestibule</b>: {{keratinized stratified squamous}} epithelium.</li>' +
      '<li><b>Respiratory mucosa</b> (most of nasal cavity, paranasal sinuses, nasopharynx, larynx): {{pseudostratified ciliated columnar}} epithelium with {{goblet cells}} (= respiratory epithelium).</li>' +
      '<li><b>Olfactory mucosa</b> (upper part of {{superior nasal concha}}, upper nasal septum, {{sphenoethmoidal recess}}): pseudostratified columnar with {{non-motile cilia}}, numerous nuclei, {{no goblet cells}}, and {{Bowman glands}} in the lamina propria.</li>' +
      '<li><b>Oropharynx</b> (with {{Waldeyer ring}} MALT), oral side of epiglottis, and {{true vocal cords}}: {{non-keratinized stratified squamous}} epithelium; laryngeal side of epiglottis has respiratory epithelium over an elastic cartilage core.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('histo-resp', 'Respiratory mucosa: ciliated pseudostratified columnar epithelium.', 'histo', 7) +
      CVS.fig('histo-olfactory', 'Olfactory mucosa with non-motile olfactory cilia and serous glands in the lamina propria.', 'histo', 8) + '</div></div>' +
      CVS.fig('histo-epiglottis', 'Epiglottis: stratified squamous on the oral (superior) surface vs respiratory epithelium on the laryngeal (inferior) surface.', 'histo', 13) },
  { t: 'q', id: 'H1', src: 'Histology p.6, 8', core: true,
    q: 'Which feature distinguishes olfactory mucosa from typical respiratory mucosa?',
    o: ['Pseudostratified columnar epithelium with non-motile cilia, numerous nuclei, no goblet cells, and Bowman glands', 'Keratinized stratified squamous epithelium with sebaceous glands', 'Simple cuboidal epithelium with dome-shaped Club cells', 'Non-keratinized stratified squamous epithelium over hyaline cartilage', 'Abundant goblet cells with motile kinocilia at the inferior nasal concha'], a: 0,
    ex: 'Olfactory mucosa (at the upper superior nasal concha, upper nasal septum, and sphenoethmoidal recess) has non-motile cilia, numerous nuclei, no goblet cells, and serous Bowman glands.' },
  { t: 'q', id: 'H2', src: 'Histology p.10–14', core: true,
    q: 'Which set of respiratory tract surfaces is lined by non-keratinized stratified squamous epithelium?',
    o: ['Oropharynx, oral side of the epiglottis, and true vocal cords', 'Nasal vestibule, nasopharynx, and trachea', 'Laryngeal side of the epiglottis, false vocal cords, and bronchi', 'Superior nasal concha, sphenoethmoidal recess, and nasal septum', 'Terminal bronchioles, respiratory bronchioles, and alveolar ducts'], a: 0,
    ex: 'Surfaces exposed to mechanical abrasion from food or high-velocity phonation—oropharynx, oral (superior) surface of the epiglottis, and true vocal cords—are lined by non-keratinized stratified squamous epithelium. The nasal vestibule is keratinized.' },
  { t: 'tf', id: 'H3', src: 'Histology p.12–13',
    q: 'The epiglottis has an elastic cartilage core lined by non-keratinized stratified squamous epithelium on its oral side and respiratory epithelium on its laryngeal side.', a: true,
    ex: 'True: the epiglottis transitions from non-keratinized stratified squamous epithelium on its oral (superior) aspect to pseudostratified ciliated columnar (respiratory) epithelium on its laryngeal (inferior) aspect.' },

  { t: 'c', id: 'H-C2', title: 'Trachea, intrapulmonary bronchi and regular bronchioles', src: 'Histology p.16–23',
    html: '<div class="tblwrap"><table class="tbl"><thead><tr><th>Feature</th><th>Trachea &amp; primary bronchi</th><th>Intrapulmonary bronchus</th><th>Regular bronchiole</th></tr></thead><tbody>' +
      '<tr><td><b>Hyaline cartilage</b></td><td>{{C-shaped}} ring</td><td>{{Discontinuous}} plates</td><td>{{Absent}} (none)</td></tr>' +
      '<tr><td><b>Smooth muscle</b></td><td>Posterior {{trachealis}} muscle</td><td>Continuous circular layer between mucosa and cartilage</td><td>{{Prominent circular}} muscularis layer</td></tr>' +
      '<tr><td><b>Epithelium</b></td><td>Respiratory epithelium on a {{thick basement membrane}}</td><td>Respiratory epithelium</td><td>Pseudostratified ciliated columnar with {{rare or no goblet cells}}</td></tr>' +
      '<tr><td><b>Glands &amp; outer layer</b></td><td>Seromucous glands; shares {{adventitia}} with {{esophagus}}</td><td>Submucosal seromucous glands</td><td>{{No seromucous glands}}</td></tr></tbody></table></div>' +
      CVS.fig('histo-airways', 'Cross-sectional comparison of trachea, intrapulmonary bronchus, and regular bronchiole.', 'histo', 22) },
  { t: 'q', id: 'H4', src: 'Histology p.16–17', core: true,
    q: 'Which combination of histological features characterizes the trachea?',
    o: ['C-shaped hyaline cartilage, posterior trachealis smooth muscle, thick basement membrane, and shared adventitia with the esophagus', 'Discontinuous cartilage plates, complete ring of smooth muscle, and no goblet cells', 'Elastic cartilage rings, skeletal muscle wall, and simple cuboidal epithelium', 'No cartilage, abundant Club cells, and no submucosal glands', 'Non-keratinized stratified squamous epithelium over complete hyaline cartilage rings'], a: 0,
    ex: 'The trachea has C-shaped hyaline cartilage bridged posteriorly by trachealis smooth muscle, respiratory epithelium on a notably thick basement membrane, and an adventitia shared with the esophagus.' },
  { t: 'tf', id: 'H5', src: 'Histology p.20, 22',
    q: 'Regular bronchioles can be identified by discontinuous hyaline cartilage plates and abundant submucosal seromucous glands.', a: false,
    ex: 'False: discontinuous cartilage plates belong to intrapulmonary bronchi. Regular bronchioles lack hyaline cartilage and have rare or no goblet cells and rare or no seromucous glands.' },
  { t: 'q', id: 'H6', src: 'Histology p.20–22', core: true,
    q: 'Moving from an intrapulmonary bronchus into a regular bronchiole, what is the key histological change?',
    o: ['Discontinuous hyaline cartilage plates disappear completely, and goblet cells and seromucous glands become rare or absent', 'C-shaped hyaline cartilage changes into elastic cartilage plates', 'Pseudostratified ciliated columnar epithelium changes into keratinized stratified squamous epithelium', 'Smooth muscle disappears and is replaced by skeletal muscle', 'Alveoli begin to outpocket directly from the airway wall'], a: 0,
    ex: 'Bronchioles have no cartilage and rare/no glands or goblet cells, leaving a prominent smooth muscle wall (clinically important in asthma bronchospasm).' },

  { t: 'c', id: 'H-C3', title: 'Terminal and respiratory bronchioles: Club (Clara) cells', src: 'Histology p.24–29',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Terminal bronchioles</b> (end of conducting portion): lined by {{simple columnar}} to {{simple cuboidal}} ciliated epithelium containing non-ciliated {{Clara cells}} ({{Club cells}}).</li>' +
      '<li><b>Morphology</b>: {{dome-shaped}} apical projection with short blunt {{microvilli}} (no cilia).</li>' +
