<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RS I Anatomy, Histology &amp; Physiology &#183; Peer support 82</title>
<meta name="description" content="Question-first peer-tutoring deck: anatomy, histology and physiology of the respiratory system (RS I).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root {
  /* Layout: a lab-bench stage. One large card at a time on chart-recorder paper, a strip of eight lab stations above, a sticky pager below. Browse = one scrolling worksheet. */
  --paper: #f3f5f8;      /* page ground, cool grey */
  --sheet: #ffffff;      /* card */
  --sheet2: #edf0f5;     /* inset panels */
  --ink: #19202e;        /* text */
  --ink2: #4f5a6e;       /* secondary text */
  --rule: #d4dae4;       /* hairlines */
  --grid: #e9edf3;       /* chart-paper grid */
  --art: #ae1530;        /* arterial red: brand, tracings */
  --art-soft: #fbe5e9;
  --ven: #1f4f97;        /* venous blue: controls, second tracing */
  --ven-soft: #e2ebf8;
  --ok: #13744a; --ok-soft: #dff2e7;
  --bad: #b02f19; --bad-soft: #fbe6df;
  --warn: #775100; --warn-soft: #fbefd2;
  --scanbg: #ffffff;     /* paper behind real figures */
  --f-display: "Bai Jamjuree", "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1117; --sheet: #161a22; --sheet2: #1e232e; --ink: #e5e8ef; --ink2: #a3abbc; --rule: #2b3240; --grid: #1f2530;
    --art: #ff6f84; --art-soft: #3a1b23; --ven: #8db3f2; --ven-soft: #1a2840;
    --ok: #4fc98b; --ok-soft: #13301f; --bad: #ff8b74; --bad-soft: #391e17; --warn: #efc04e; --warn-soft: #32280e; --scanbg: #e6e3dc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1117; --sheet: #161a22; --sheet2: #1e232e; --ink: #e5e8ef; --ink2: #a3abbc; --rule: #2b3240; --grid: #1f2530;
  --art: #ff6f84; --art-soft: #3a1b23; --ven: #8db3f2; --ven-soft: #1a2840;
  --ok: #4fc98b; --ok-soft: #13301f; --bad: #ff8b74; --bad-soft: #391e17; --warn: #efc04e; --warn-soft: #32280e; --scanbg: #e6e3dc;
  color-scheme: dark;
}
html { -webkit-text-size-adjust: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ven); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- cards ---------- */
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: clamp(16px, 2.6vw, 34px); min-width: 0; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; font-family: var(--f-mono); font-size: .8em; color: var(--ink2); }
.eyebrow .id { font-weight: 600; color: var(--art); font-size: 1.12em; letter-spacing: .02em; }
.chip { border-radius: 999px; padding: 2px 9px; background: var(--sheet2); color: var(--ink2); white-space: nowrap; }
.chip.core { background: var(--art-soft); color: var(--art); }
.chip.kind { background: var(--ven-soft); color: var(--ven); }
.chip.grp { background: transparent; border: 1px dashed var(--rule); }
.concept h2, .secard h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.6em; line-height: 1.2; margin: 0 0 14px; text-wrap: balance; letter-spacing: .005em; }
.cbody { display: grid; gap: 16px; }
.cbody > * { min-width: 0; }
.muted { color: var(--ink2); font-weight: 400; }

/* ---------- question cards ---------- */
.stem { font-size: 1.26em; font-weight: 500; line-height: 1.45; margin: 2px 0 16px; text-wrap: pretty; }
.stem b { color: var(--art); font-weight: 600; }
.stem .muted { font-size: .82em; display: block; margin-top: 4px; }
.qfig { margin: 0 0 16px; }
.opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.opt { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; text-align: left; background: var(--sheet); color: var(--ink); border: 1.5px solid var(--rule); border-radius: 10px; padding: .6em .85em; cursor: pointer; transition: border-color .15s, background-color .15s, opacity .15s; line-height: 1.4; }
.opt:hover { border-color: var(--ven); }
.opt .L { font: 600 .88em var(--f-mono); width: 2em; height: 2em; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--rule); color: var(--ink2); }
.opt .mk { font-weight: 700; min-width: 1em; }
.opt.sel { border-color: var(--ven); background: var(--ven-soft); }
.opt.sel .L { border-color: var(--ven); color: var(--ven); }
.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tfrow .opt { padding: .9em 1em; font-size: 1.08em; font-weight: 500; }
.rev .opt { cursor: default; }
.rev .opt.isans, .showall .opt.isans { border-color: var(--ok); background: var(--ok-soft); }
.rev .opt.isans .L, .showall .opt.isans .L { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.rev .opt.isans .mk::after, .showall .opt.isans .mk::after { content: "\2713"; color: var(--ok); }
.rev .opt.sel:not(.isans) { border-color: var(--bad); background: var(--bad-soft); }
.rev .opt.sel:not(.isans) .L { border-color: var(--bad); color: var(--bad); }
.rev .opt.sel:not(.isans) .mk::after { content: "\2717"; color: var(--bad); }
.rev .opt:not(.isans):not(.sel) { opacity: .55; }
.think { margin: 0; color: var(--ink2); font-style: italic; }
.explain { margin-top: 16px; background: var(--ok-soft); border-radius: 12px; padding: 14px 18px; }
.qcard:not(.rev) .explain { display: none; }
.showall .qcard .explain { display: block; }
.explain .ans { font: 600 1.02em var(--f-display); color: var(--ok); margin-bottom: 4px; }
.explain p { margin: 0; }
.flag { margin-top: 10px; background: var(--warn-soft); border-radius: 10px; padding: 8px 12px; font-size: .9em; }
.flag b { color: var(--warn); }

/* ---------- concept building blocks ---------- */
.two { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.figpair { grid-template-columns: minmax(0, .75fr) minmax(0, 1.25fr); align-items: center; }
@media (max-width: 760px) { .two, .cols2, .cols3, .figpair { grid-template-columns: 1fr; } }
.mini { background: var(--sheet2); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.mini h4 { margin: 0 0 6px; font: 600 1em var(--f-display); letter-spacing: .01em; }
.mini.art h4 { color: var(--art); }
.mini.ven h4 { color: var(--ven); }
.mini p { margin: 0; }
.mini ul { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }
.pts { margin: 0; padding-left: 1.2em; display: grid; gap: 7px; }
.pts ul, .steps ul { margin: 4px 0 0; padding-left: 1.1em; display: grid; gap: 3px; }  /* sub-points */
.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 7px; }
.steps.tight { gap: 3px; }
.note { margin: 0; background: var(--ven-soft); border-radius: 10px; padding: 10px 14px; }
.trap { margin: 0; background: var(--warn-soft); border-radius: 10px; padding: 10px 14px; }
.trap::before { content: "Exam trap \00B7  "; font-weight: 600; color: var(--warn); }
.eqn { font: 600 1.65em var(--f-display); text-align: center; letter-spacing: .02em; padding: 6px 0; }
.eqn span { color: var(--art); }
.eqn .cz { color: transparent; }  /* a blank inside an equation stays hidden until revealed */
.eqn .cz.on, .czopen .eqn .cz, .showall .eqn .cz { color: var(--art); }
.speeds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .speeds { grid-template-columns: 1fr; } }
.speed { border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; background: var(--sheet); }
.sp-h { display: grid; gap: 2px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed var(--rule); }
.sp-h .mono { font-family: var(--f-mono); font-size: .8em; color: var(--ink2); }
.s1 .sp-h b { color: var(--art); }
.s2 .sp-h b { color: var(--warn); }
.s3 .sp-h b { color: var(--ven); }
.speed ul { margin: 0; padding-left: 1.1em; display: grid; gap: 3px; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.flow.col { flex-direction: column; align-items: stretch; }
.flow.col .fbox { flex: none; }  /* stacked flowchart: boxes keep their own height */
.fbox { border: 1px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 8px 12px; flex: 1 1 140px; min-width: 0; }
.fbox.start { background: var(--sheet2); }
.fbox.end { background: var(--ok-soft); border-color: var(--ok); }
.fbox.art { background: var(--art-soft); border-color: var(--art); }
.fbox.ven { background: var(--ven-soft); border-color: var(--ven); }
.farrow { color: var(--ink2); font-weight: 600; flex: none; text-align: center; }
.flow.col .farrow { font-size: .9em; }
.fstack { display: grid; gap: 8px; flex: 2 1 260px; min-width: 0; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 600px) { .fgrid { grid-template-columns: 1fr; } }
.cycle { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.cycle .ph { flex: 1 1 130px; background: var(--sheet2); border-radius: 8px; padding: 8px 10px; font-weight: 600; font-size: .92em; display: grid; gap: 2px; align-content: start; }
.cycle .ph span { font-weight: 400; color: var(--ink2); font-size: .88em; }
.cycle .sd { flex: none; align-self: center; font: 700 .9em var(--f-mono); color: var(--sheet); background: var(--ink); border-radius: 999px; padding: 4px 10px; }

/* ---------- tables ---------- */
.tblwrap { overflow-x: auto; min-width: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: .92em; }
.tbl caption { text-align: left; font: 600 .95em var(--f-display); padding-bottom: 6px; }
.tbl th, .tbl td { border-bottom: 1px solid var(--rule); padding: 7px 10px; text-align: left; vertical-align: top; }
.tbl thead th { font-family: var(--f-mono); font-size: .76em; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); background: var(--sheet2); }
.tbl td.num { font-variant-numeric: tabular-nums; font-family: var(--f-mono); white-space: nowrap; }
.tbl .up { color: var(--art); font-weight: 600; }
.tbl .dn { color: var(--ven); font-weight: 600; }
.tbl thead th.up { color: var(--art); }
.tbl thead th.dn { color: var(--ven); }
.tbl.compact th, .tbl.compact td { padding: 4px 8px; }
.dogtbl td:nth-child(2), .dogtbl td:nth-child(3), .dogtbl td:nth-child(4) { text-align: center; white-space: nowrap; }

/* ---------- real figures cropped from the course material ---------- */
.stack { display: grid; gap: 12px; align-content: start; min-width: 0; }
.scan { margin: 0; min-width: 0; display: grid; gap: 6px; align-content: start; }
.paperimg { background: var(--scanbg); border: 1px solid var(--rule); border-radius: 10px; padding: 8px; isolation: isolate; }
.scan img { display: block; width: auto; max-width: 100%; height: auto; max-height: min(440px, 62vh); margin: 0 auto; mix-blend-mode: multiply; cursor: zoom-in; border-radius: 4px; }
.scan.tall img { max-height: min(480px, 66vh); }
.scanrow .scan img { max-height: 360px; }
.scan figcaption { font-size: .84em; line-height: 1.4; color: var(--ink2); text-wrap: pretty; }
.scan figcaption .src { font-family: var(--f-mono); font-size: .88em; white-space: nowrap; opacity: .9; }
.scan figcaption .src::before { content: "\00B7  "; }
.scan figcaption.srconly .src::before { content: none; }
.scanrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; align-items: start; min-width: 0; }
.qfig .scan { max-width: 760px; }
.qfig .scan.tall { max-width: 560px; }

/* ---------- cloze blanks: {{key detail}} in concept cards ---------- */
.cz { border-radius: 4px; padding: 0 .22em; background: var(--sheet2); color: transparent; box-shadow: inset 0 -2px 0 var(--art); cursor: pointer; -webkit-box-decoration-break: clone; box-decoration-break: clone; transition: color .18s, background-color .18s; }
.cz * { color: transparent !important; }
.cz:hover { background: var(--art-soft); }
.cz.on, .czopen .cz, .showall .cz { color: inherit; background: var(--art-soft); }
.cz.on *, .czopen .cz *, .showall .cz * { color: inherit !important; }
.cz.last { animation: czpop .5s ease-out; }
@keyframes czpop { 0% { box-shadow: inset 0 -2px 0 var(--art), 0 0 0 4px var(--art-soft); } 100% { box-shadow: inset 0 -2px 0 var(--art), 0 0 0 0 transparent; } }
@media print { .cz { color: inherit; background: none; } .cz * { color: inherit !important; } }

/* ---------- figure zoom ---------- */
.zoom { position: fixed; inset: 0; z-index: 60; background: rgba(6, 8, 12, .88); display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
.zoom[hidden] { display: none; }
.zoom .zbox { display: grid; gap: 10px; justify-items: center; max-width: 100%; }
.zoom .zpaper { background: #fff; border-radius: 10px; padding: 10px; max-width: min(1700px, 100%); }
.zoom img { display: block; max-width: 100%; max-height: calc(100vh - 120px); width: auto; height: auto; }
.zoom .zcap { color: #e5e8ef; font-size: .92em; text-align: center; max-width: 900px; margin: 0; }

/* Thai explanation under each concept card (student deck: collapsible; tutor deck: open) */
.thx { margin-top: 16px; border: 1px solid var(--rule); border-left: 3px solid var(--ok); border-radius: 10px; background: var(--sheet); padding: 0 14px; }
.thx summary { cursor: pointer; padding: 10px 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.thx summary::marker, .thx summary::-webkit-details-marker { color: var(--ok); }
.thx-h { font: 600 1.02em var(--f-display); color: var(--ok); }
.thx-s { font: .74em var(--f-mono); color: var(--ink2); }
.thx[open] summary { border-bottom: 1px dashed var(--rule); margin-bottom: 10px; }
.thx-body { display: grid; gap: 6px; margin: 0; padding: 0 0 14px 1.2em; line-height: 1.65; font-family: "IBM Plex Sans Thai", var(--f-body); }
.thx-body li::marker { color: var(--ok); }
.thx-body b { font-weight: 600; color: var(--ink); }

/* cover: counts + QR to the live deck (student deck start card and PDF cover) */
.coverline { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px 32px; margin: 4px 0 22px; padding: 14px 0 16px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.counts { display: flex; gap: 44px; }
.counts > div { display: grid; }
.counts b { font: 600 3.2em/1 var(--f-display); letter-spacing: -.01em; }
.counts span { font: .8em var(--f-mono); color: var(--ink2); letter-spacing: .04em; margin-top: 5px; }
.qrlink { display: grid; justify-items: end; gap: 6px; color: var(--ink2); text-decoration: none; }
.qrlink .qrcap { font: 500 .78em var(--f-body); color: var(--ink2); }
.qrlink img { width: 112px; height: 112px; display: block; }
.qrlink span { font: .72em var(--f-mono); }
.qrlink:hover span { color: var(--ven); text-decoration: underline; }
.legend { margin: 14px 0 0; font: .8em var(--f-mono); color: var(--ink2); }
.legend .chip { margin-right: 6px; }
@media (max-width: 560px) { .qrlink .qrcap, .qrlink img { display: none; } .qrlink { justify-items: start; } .counts b { font-size: 2.6em; } }

/* figure that would give away a card's blanks: collapsed behind a summary (closed in the PDF) */
.figans { border: 1px dashed var(--rule); border-radius: 10px; padding: 8px 12px; }
.figans summary { cursor: pointer; font: 500 .85em var(--f-mono); color: var(--ink2); }
.figans[open] summary { margin-bottom: 8px; }

/* ---------- interactive flowcharts (src/flows.js): PFT on P-C4, acid-base on A-C5 ---------- */
.flowx { border: 1px solid var(--rule); border-radius: 12px; background: var(--sheet); padding: 14px; display: grid; gap: 12px; min-width: 0; }
.fx-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.fx-head b { font: 600 1.08em var(--f-display); color: var(--ven); }
.fx-head span { color: var(--ink2); font-size: .88em; }
.fx-cases { display: flex; flex-wrap: wrap; gap: 6px; }
.fx-btn { font: 500 .86em var(--f-body); border: 1.5px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 999px; padding: 4px 12px; cursor: pointer; line-height: 1.4; }
.fx-btn:hover { border-color: var(--ven); }
.fx-btn.on { background: var(--ven); border-color: var(--ven); color: var(--sheet); }
.fx-btn.go { background: var(--art); border-color: var(--art); color: var(--sheet); font-weight: 600; }
.fx-btn.ghost { border-style: dashed; }
.fx-btn.ghost.on { border-style: solid; }
.fx-btn:disabled { opacity: .4; cursor: default; }
.fx-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; align-items: end; background: var(--sheet2); border-radius: 10px; padding: 10px; }
.fx-form label { display: grid; gap: 2px; font-size: .8em; color: var(--ink2); }
.fx-form input { font: 500 1rem var(--f-mono); width: 100%; padding: 5px 8px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); color: var(--ink); }
.fx-case { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .86em; }
.fx-src { font-family: var(--f-mono); color: var(--ink2); margin-right: 4px; }
.fx-chip { background: var(--sheet2); border-radius: 999px; padding: 2px 10px; }
.fx-chip b { font-family: var(--f-mono); font-weight: 600; }
.fx-scroll { overflow-x: auto; min-width: 0; }
.fx-svg { display: block; width: 100%; min-width: 640px; height: auto; }
.fx-node { cursor: pointer; transition: opacity .2s; }
.fx-node > rect { fill: var(--sheet); stroke: var(--rule); stroke-width: 1.5; transition: fill .2s, stroke .2s; }
.fx-node.k-q > rect { fill: var(--ven-soft); stroke: var(--ven); }
.fx-node.k-leaf > rect { fill: var(--sheet2); stroke: var(--ink2); }
.fx-node.k-st > rect { fill: var(--sheet2); stroke: var(--ink2); }
.fx-node.k-note > rect { fill: none; stroke: var(--ink2); stroke-dasharray: 5 4; }
.fx-node.k-cause > rect { fill: none; stroke: var(--rule); stroke-dasharray: 2 3; }
.fx-node:hover > rect { stroke: var(--art); }
.fx-node:focus { outline: none; }
.fx-node:focus-visible > rect { stroke: var(--ven); stroke-width: 3; }
.fx-t { font: 600 16px var(--f-display); fill: var(--ink); }
.fx-s { font: 12.5px var(--f-body); fill: var(--ink2); }
.fx-node.k-cause .fx-t { font-size: 14px; fill: var(--ink2); }
.fx-node.on > rect { fill: var(--art-soft); stroke: var(--art); stroke-width: 2.2; }
.fx-node.cur > rect { stroke-width: 3.6; }
.fx-node.sel > rect { stroke: var(--ok); stroke-width: 3; stroke-dasharray: none; }
.fx-node.dim, .fx-edge.dim { opacity: .38; }
.fx-edge path { fill: none; stroke: var(--ink2); stroke-width: 1.6; }
.fx-edge.dash path { stroke-dasharray: 5 4; }
.fx-edge.on path { stroke: var(--art); stroke-width: 3; }
.fx-edge text { font: 600 12.5px var(--f-mono); fill: var(--ink2); }
.fx-edge.on text { fill: var(--art); }
.fx-mk path { fill: var(--ink2); }
.fx-mk-on path { fill: var(--art); }
.fx-pill rect { fill: var(--art); stroke: none; }
.fx-pill text { font: 600 11.5px var(--f-mono); fill: var(--sheet); }
.fx-node.dim .fx-pill { display: none; }
.fx-sevrow rect { fill: transparent; }
.fx-sevrow text { font: 14px var(--f-body); fill: var(--ink); }
.fx-sevrow.hit rect { fill: var(--art); }
.fx-sevrow.hit text { fill: var(--sheet); font-weight: 600; }
.fx-ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fx-pos { font: .84em var(--f-mono); color: var(--ink2); }
.fx-panel { display: grid; gap: 10px; min-width: 0; }
.fx-trail { margin: 0; padding-left: 1.5em; display: grid; gap: 4px; font-size: .93em; }
.fx-trail li { color: var(--ink2); }
.fx-trail li.now { color: var(--ink); }
.fx-trail li.now::marker { color: var(--art); font-weight: 700; }
.fx-dx { margin: 0; background: var(--ok-soft); border-radius: 10px; padding: 10px 14px; font: 600 1.05em var(--f-display); }
.fx-dx span { display: block; font: 500 .7em var(--f-mono); color: var(--ok); text-transform: uppercase; letter-spacing: .06em; }

/* Shared registry for both pages (deck + tutor notes) and print.js.
   Concept-card HTML may mark key details as {{blanks}}: they render as click-to-reveal cloze spans.
   CVS.fig(name, caption, pdf, page[, cls]) builds a click-to-zoom course figure from img/<name>.jpg
   (sizes from data/figs.js). */
window.CVS = {
  sections: [],
  dims: {},
  SRC: {
    urt: 'Upper respiratory tract handout',
    wall: 'Thoracic wall &amp; diaphragm handout',
    lung: 'Lung &amp; bronchial tree handout',
    histo: 'Respiratory histology handout',
    gas: 'Gas phase &amp; equilibrium handout',

    ac81: 'AC81 RS I MCQ raw key',
    ac79s: 'AC79 spot test',
    ac80s: 'AC80 spot test key',
    ac81s: 'AC81 spot test'
  },
  cloze: function (h) { return String(h).replace(/\{\{([\s\S]*?)\}\}/g, '<span class="cz">$1</span>'); },
  fig: function (name, cap, pdf, page, cls) {
    var d = this.dims[name];
    if (!d) throw new Error('no image ' + name);
    var alt = String(cap).replace(/<[^>]+>/g, '').replace(/"/g, '&quot;');
    return '<figure class="scan' + (cls ? ' ' + cls : '') + '"><div class="paperimg"><img src="img/' + name + '.jpg" width="' + d[0] + '" height="' + d[1] + '" alt="' + alt + '" loading="lazy" decoding="async"></div><figcaption>' + cap + ' <span class="src">' + (this.SRC[pdf] || pdf) + ', p.' + page + '</span></figcaption></figure>';
  },
  /* Options are written with the answer first; shuffle them once, the same way everywhere (seeded by the item ID).
     Options such as "None ..." or "All ..." stay last. Set keep: true to leave an item's order alone. */
  shuffle: function (it) {
    if (it.t !== 'q' || it.keep) return;
    var h = 2166136261, i;
    for (i = 0; i < it.id.length; i++) { h ^= it.id.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    var rnd = function () { h = (h + 0x6D2B79F5) >>> 0; var t = h; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    var idx = it.o.map(function (o, k) { return k; });
    var free = idx.filter(function (k) { return !/^(None|All |Both |Neither )/.test(it.o[k]); });
    var tail = idx.filter(function (k) { return free.indexOf(k) < 0; });
    for (i = free.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)), t = free[i]; free[i] = free[j]; free[j] = t; }
    var order = free.concat(tail), A = [].concat(it.a);
    it.o = order.map(function (k) { return it.o[k]; });
    var na = A.map(function (a) { return order.indexOf(a); });
    it.a = Array.isArray(it.a) ? na : na[0];
  },
  add: function (sec) {
    sec.items.forEach(function (it) { if (it.html) it.html = window.CVS.cloze(it.html); window.CVS.shuffle(it); });
    this.sections.push(sec);
  }
};

/* Section U: Upper Respiratory Tract (681027 Slide Upper Respiratory Tract.pdf, 44 pages). */
CVS.add({ id: 'U', short: 'Upper tract', title: 'Upper Respiratory Tract: Nose, Sinuses, Pharynx, Larynx & Trachea', kind: 'Lecture',
  blurb: 'Nasal septum and conchae, paranasal sinus drainage, Kiesselbach plexus, pharyngeal walls and tonsillar ring, laryngeal skeleton and membranes, intrinsic laryngeal muscles and nerves, and the trachea.',
  items: [
  { t: 'c', id: 'U-C1', title: 'Nasal cavity boundaries, septum and lateral conchae', src: 'URT p.4–10',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Air path</b>: nostrils → {{vestibule}} (hairs) → nasal cavity → {{choanae}} → nasopharynx.</li>' +
      '<li><b>Septum</b> = {{perpendicular plate}} of ethmoid (back, up) + {{vomer}} (back, down) + {{septal cartilage}} (front).</li>' +
      '<li><b>Lateral wall</b>: superior and middle conchae belong to the ethmoid; the {{inferior concha}} is a bone of its own.</li>' +
      '<li>Each meatus lies <b>under</b> the concha of the same name.</li>' +
      '<li><b>Roof</b> = {{cribriform plate}} → fracture → {{anosmia}} + {{CSF rhinorrhea}}.</li></ul></div>' +
      CVS.fig('urt-septum', 'Bony and cartilaginous framework of the medial wall and coronal section.', 'urt', 8) + '</div>' +
      '<p class="note"><b>From the past papers</b> · Inferior meatus → only the nasolacrimal duct opens there → pus there comes from the tear duct, not a sinus (AC79 spot, AC80).</p>' },
  { t: 'q', id: 'U1', src: 'AC79 spot', core: true, keep: true,
    q: 'Identify this structure A.',
    fig: CVS.fig('ac79s-st2', 'AC79 spot test, station 2.', 'ac79s', 4),
    o: ['Nasal vestibule', 'Ethmoidal bullae', 'Middle nasal concha', 'Inferior nasal concha'], a: 3,
    ex: 'A is the lowest and longest scroll on the lateral wall, just above the floor of the nose: the inferior nasal concha, a separate bone.' },
  { t: 'q', id: 'U2', src: 'AC79 spot', keep: true,
    q: 'Which structure opens below the structure A?',
    fig: CVS.fig('ac79s-st2', 'AC79 spot test, station 2.', 'ac79s', 4), figRef: 'U1',
    o: ['Middle ethmoidal air cells', 'Anterior ethmoidal air cells', 'Frontal sinus', 'None of the above'], a: 3,
    ex: 'Below the inferior concha is the inferior meatus, and the only thing that opens there is the nasolacrimal duct, which is not listed. The ethmoidal cells and the frontal sinus open higher, into the middle meatus.' },
  { t: 'q', id: 'U3', src: 'AC80', core: true, keep: true,
    q: 'The source of pus seen at the inferior nasal meatus is from which structure?',
    o: ['Frontal sinus', 'Sphenoid sinus', 'Maxillary sinus', 'Ethmoid sinus', 'Nasolacrimal duct'], a: 4,
    ex: 'Only the nasolacrimal duct opens into the inferior meatus. The frontal, maxillary and anterior ethmoid sinuses drain into the middle meatus; the sphenoid sinus drains into the sphenoethmoidal recess.' },
  { t: 'q', id: 'U4', src: 'AC80 spot', keep: true,
    q: 'Identify this structure (red tube).',
    fig: CVS.fig('ac80s-nld', 'AC80 spot test (recalled image): the red tube.', 'ac80s', 4),
    o: ['Nasolacrimal duct', 'Frontonasal duct', 'Viteline duct', 'Ethmoidal air sinus'], a: 0,
    ex: 'The probe runs down from the lacrimal sac to the inferior opening under the inferior concha: the nasolacrimal duct.',
    flag: 'Options as recalled (“viteline duct” is the vitelline duct of the embryo, not a nasal structure).' },
  { t: 'c', id: 'U-C2', title: 'Paranasal sinus drainage and Kiesselbach epistaxis plexus', src: 'URT p.11–17',
    html: '<div class="two"><div class="stack"><div class="tblwrap"><table class="tbl compact"><thead><tr><th>Opening in</th><th>What drains there</th></tr></thead><tbody>' +
      '<tr><td>Sphenoethmoidal recess</td><td>{{sphenoid sinus}}</td></tr>' +
      '<tr><td>Superior meatus</td><td>{{posterior ethmoidal}} cells</td></tr>' +
      '<tr><td>Middle meatus: {{ethmoidal bulla}}</td><td>middle ethmoidal cells</td></tr>' +
      '<tr><td>Middle meatus: {{hiatus semilunaris}}</td><td>{{frontal sinus}}, {{anterior ethmoidal}} cells, {{maxillary sinus}}</td></tr>' +
      '<tr><td>Inferior meatus</td><td>{{nasolacrimal duct}} only</td></tr></tbody></table></div>' +
      '<ul class="pts"><li><b>{{Kiesselbach area}}</b> (front of the septum): branches of several arteries meet → commonest site of nosebleed.</li>' +
      '<li>Pituitary surgery reaches the sella through the sphenoid (transsphenoidal route).</li></ul></div>' +
      '<div class="stack">' + CVS.fig('urt-meatus', 'Openings of paranasal sinuses and tear drainage on the lateral wall.', 'urt', 13) + CVS.fig('urt-epistaxis', 'Arterial anastomoses on the anterior septum in nosebleed.', 'urt', 16) + '</div></div>' },
  { t: 'q', id: 'U5', src: 'AC81', core: true, keep: true,
    q: 'The patient has been diagnosed with pus in the sphenoethmoidal recess. Which paranasal sinus is most likely to be infected?',

    ex: 'The sphenoethmoidal recess, above the superior concha, receives the sphenoid sinus. Posterior ethmoidal cells open into the superior meatus; frontal, maxillary and anterior ethmoid into the middle meatus.' },
  { t: 'q', id: 'U6', src: 'AC79 spot', core: true, keep: true,

  { t: 'q', id: 'U7', src: 'AC79 spot', keep: true,

    fig: CVS.fig('ac79s-st1', 'AC79 spot test, station 1.', 'ac79s', 3), figRef: 'U6',

  { t: 'q', id: 'U8', src: 'AC81 spot', keep: true,

  { t: 'q', id: 'U9', src: 'AC81 spot', keep: true,
    q: 'Which paranasal sinus opening lies on B?',
    fig: CVS.fig('ac81s-st1', 'AC81 spot test, station 1.', 'ac81s', 2), figRef: 'U8',
    o: ['Frontal sinus', 'Ethmoid sinus', 'Maxillary sinus', 'Sphenoid sinus'], a: 0,
    ex: 'B is the front, upper end of the hiatus semilunaris, where the frontonasal duct (ethmoidal infundibulum) brings down the frontal sinus.',
    flag: 'Key from the AC81 spot short answer key. The maxillary ostium lies further back along the same hiatus.' },
  { t: 'c', id: 'U-C3', title: 'Pharynx subdivisions, Waldeyer ring and pharyngeal recesses', src: 'URT p.18–24',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Nasopharynx</b> (air only)<ul><li>Roof: {{pharyngeal tonsil}} (adenoid).</li>' +
      '<li>Side wall, front → back: {{auditory tube}} opening → {{torus tubarius}} → {{pharyngeal recess}} (fossa of Rosenmüller).</li></ul></li>' +
      '<li><b>Oropharynx</b> (air + food)<ul><li>{{palatine tonsil}} between the two arches; {{lingual tonsil}} on the tongue root.</li></ul></li>' +
      '<li><b>Laryngopharynx</b><ul><li>{{piriform recess}} beside the laryngeal inlet → swallowed fish bones lodge there.</li></ul></li>' +
      '<li>The tonsils together form a ring: {{Waldeyer ring}}.</li></ul>' +
      '<p class="trap"><b>Clinical</b>: the recess behind the torus → commonest site of nasopharyngeal carcinoma → linked to {{EBV}}.</p></div>' +
      CVS.fig('urt-pharynx', 'Landmarks of the nasopharynx, oropharynx, and laryngopharynx.', 'urt', 19) + '</div>' +
      '<p class="note"><b>From the past papers</b> · The fold running down from the torus covers salpingopharyngeus, which starts on the tube’s cartilage (AC81 spot).</p>' },
  { t: 'q', id: 'U10', src: 'AC79', core: true, keep: true,
    q: 'A patient has a small mass in the oropharynx. Which structure is <b>LEAST</b> likely the cause of this mass?',
    o: ['Uvula', 'Epiglottis', 'Palatine tonsil', 'Lingual tonsil', 'Pharyngeal tonsil'], a: 4,
    ex: 'The pharyngeal tonsil (adenoid) sits on the roof and posterior wall of the nasopharynx. The uvula, palatine tonsils, lingual tonsil and the tip of the epiglottis are all seen in the oropharynx.' },
  { t: 'q', id: 'U11', src: 'AC79 · AC81', core: true, keep: true,
    q: 'What structure is abnormal in this patient?',
    fig: CVS.fig('ac81-tonsil', 'AC81: view through the open mouth.', 'ac81', 3),
    o: ['Palatine tonsil', 'Lingual tonsil', 'Pharyngeal tonsil', 'Tubal tonsil', 'No abnormality in this patient'], a: 0,
    ex: 'The swollen masses on each side of the oropharynx, between the palatoglossal and palatopharyngeal arches, are enlarged palatine tonsils (tonsillitis).',
    flag: 'AC79 asked the same with a tonsillitis photo (“What is the tonsil in this picture?”), also keyed palatine tonsil.' },
  { t: 'q', id: 'U12', src: 'AC80', keep: true,
    q: 'Where is the adenoid tonsil located?',

  { t: 'q', id: 'U13', src: 'AC80', core: true, keep: true,

  { t: 'q', id: 'U18', src: 'AC81 spot', keep: true,

  { t: 'c', id: 'U-C4', title: 'Laryngeal cartilages, fibro-elastic membranes and cavity', src: 'URT p.25–35',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Unpaired</b>: {{thyroid}} (the shield) · {{cricoid}} (the only complete ring) · {{epiglottis}}.</li>' +
      '<li><b>Paired</b>: {{arytenoid}} (the cords attach here), corniculate, cuneiform.</li>' +
      '<li><b>Inside, top → bottom</b>: vestibular (false) fold → ventricle → vocal (true) fold → subglottis.</li>' +
      '<li><b>Membranes</b><ul><li>{{quadrangular membrane}} → its lower edge = vestibular ligament.</li>' +
      '<li>{{conus elasticus}} → its upper edge = {{vocal ligament}}.</li></ul></li>' +
      '<li>True cords are lined by {{stratified squamous}} epithelium.</li>' +
      '<li><b>Emergency airway</b>: cut the membrane just above the complete ring (cricothyroidotomy).</li></ul></div>' +
      '<div class="stack">' + CVS.fig('urt-larynx-cart', 'Laryngeal skeleton, fibro-elastic membranes, and ligaments.', 'urt', 28) + CVS.fig('urt-larynx-cor', 'Coronal section showing laryngeal vestibule, ventricle, and cords.', 'urt', 31) + '</div></div>' +
      '<p class="note"><b>From the past papers</b> · Opened larynx: false fold above the ventricle, true fold below it, trachea below the complete ring (AC79 and AC81 spot).</p>' },
  { t: 'q', id: 'U19', src: 'AC79 spot', keep: true,
    q: 'Identify this structure A.',

  { t: 'q', id: 'U21', src: 'AC79 spot', core: true, keep: true,

  { t: 'q', id: 'U22', src: 'AC79 spot', keep: true,

    ex: 'B is the cartilage-ringed tube continuing below the cricoid: the trachea.' },
  { t: 'q', id: 'U23', src: 'AC81 spot', keep: true,
    q: 'Identify structure B.',
    fig: CVS.fig('ac81s-st3', 'AC81 spot test, station 3.', 'ac81s', 4),
    o: ['Vocal fold', 'Vestibular fold', 'Ary-epiglottic fold'], a: 0,
    ex: 'In the coronal section B points to the lower fold, under the ventricle: the vocal fold.',
    flag: 'The recalled stem repeated “Which paranasal sinus opening lies on B?”; the options show the real question was to identify B.' },
  { t: 'c', id: 'U-C5', title: 'Intrinsic laryngeal muscles, nerves and trachea', src: 'URT p.36–44',
    html: '<div class="two"><div class="stack"><div class="tblwrap"><table class="tbl compact"><thead><tr><th>Muscle</th><th>Action</th><th>Nerve</th></tr></thead><tbody>' +
      '<tr><td><b>{{Posterior cricoarytenoid}}</b></td><td>{{opens}} the rima (the only one)</td><td>recurrent</td></tr>' +
      '<tr><td>Lateral cricoarytenoid, arytenoids</td><td>close the rima</td><td>recurrent</td></tr>' +
      '<tr><td><b>{{Cricothyroid}}</b></td><td>{{tenses}} the cords</td><td>{{external laryngeal}}</td></tr>' +
      '<tr><td>Thyroarytenoid, vocalis</td><td>{{relaxes}} the cords</td><td>recurrent</td></tr></tbody></table></div>' +
      '<ul class="pts"><li><b>Recurrent laryngeal n.</b> → all intrinsic muscles except the tensor → injury → hoarse voice, cord cannot abduct.</li>' +

      '<li><b>Trachea</b>: C6 → {{carina}} at the sternal angle; C-shaped rings closed behind by {{trachealis}} muscle.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('urt-larynx-musc', 'Actions of intrinsic laryngeal muscles on the laryngeal inlet and vocal ligaments.', 'urt', 37) + CVS.fig('urt-larynx-nerve', 'Superior and recurrent laryngeal nerve branches and arterial supply.', 'urt', 39) + '</div></div>' },
  { t: 'q', id: 'U24', src: 'AC81 spot', keep: true,

  { t: 'q', id: 'U25', src: 'AC79 spot', keep: true,

    o: ['Posterior cricoarytenoid muscle', 'Thyroepiglottic muscle', 'Thyroarytenoid muscle', 'Cricothyroid muscle'], a: 3,
    ex: 'On the front of the larynx, B is the muscle running from the cricoid arch up to the thyroid cartilage: the cricothyroid, the only intrinsic muscle on the outside.' },

    ex: 'Viewed from behind, A lies on the posterior surface of the cricoid lamina: the posterior cricoarytenoid.' },
  { t: 'q', id: 'U27', src: 'AC79 spot', core: true, keep: true,

  { t: 'q', id: 'U28', src: 'AC79 · AC81', core: true, keep: true,
    q: 'In a thyroidectomy operation, the surgeon accidentally caused a ligation of the superior thyroid artery. Which muscle is most likely to be affected?',
    o: ['Cricothyroid', 'Thyroarytenoid', 'Lateral cricoarytenoid', 'Posterior cricoarytenoid', 'Vocalis'], a: 0,
    ex: 'The external branch of the superior laryngeal nerve runs with the superior thyroid artery and supplies only the cricothyroid. Tying the artery can catch the nerve.' },
  { t: 'q', id: 'U29', src: 'AC80', keep: true,

/* Section W: Thoracic Wall & Diaphragm (681027 Thoracic wall & diaphragm.pdf, 30 pages). */
CVS.add({ id: 'W', short: 'Thoracic wall', title: 'Thoracic Wall, Intercostal Space, Pleura & Diaphragm', kind: 'Lecture',
  blurb: 'Sternum and rib articulations, intercostal muscle layers, accessory muscles of respiration, the intercostal VAN bundle and nerve block, thoracocentesis vs thoracostomy, flail chest, and diaphragm.',
  items: [
  { t: 'c', id: 'W-C1', title: 'Thoracic cage: sternum, rib classes and vertebral joints', src: 'Thoracic wall p.2–6',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Sternum, top → bottom</b>: {{manubrium}} → {{sternal angle}} → body → {{xiphoid process}}.</li>' +
      '<li>The angle = level of the {{2nd rib}} → start counting ribs here.</li>' +
      '<li><b>Ribs</b><ul><li>{{true ribs}} (1–7): own cartilage to the sternum.</li>' +
      '<li>{{false ribs}} (8–12): no direct sternal joint; 11–12 are {{floating ribs}}.</li></ul></li>' +
      '<li><b>Typical rib</b>: head, neck, tubercle, shaft with a {{costal groove}} on its lower edge.</li>' +
      '<li><b>Behind</b>: head → {{vertebral bodies}}; tubercle → {{transverse process}}.</li></ul></div>' +

  { t: 'c', id: 'W-C2', title: 'Intercostal muscle layers and transversus thoracis', src: 'Thoracic wall p.7–11',

  { t: 'c', id: 'W-C5', title: 'Pleural procedures, flail chest and the diaphragm', src: 'Thoracic wall p.21–30',

  { t: 'c', id: 'H-C2', title: 'Trachea, intrapulmonary bronchi and regular bronchioles', src: 'Histology p.16–23',

  { t: 'c', id: 'H-C4', title: 'Alveolar ducts, alveoli, pneumocytes, dust cells and pores of Kohn', src: 'Histology p.30–40',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Alveolar duct</b>: wall made of alveolar openings + knobs of smooth muscle → ends in an {{alveolar sac}}.</li>' +
      '<li><b>Type I pneumocyte</b>: {{flat}} → covers {{most of the surface}} → gas exchange.</li>' +
      '<li><b>Type II pneumocyte</b>: {{cuboidal}}, lamellar bodies<ul>' +
      '<li>makes {{surfactant}} → lowers surface tension.</li><li>{{progenitor}} → replaces both types.</li></ul></li>' +
      '<li><b>Premature baby</b>: immature type II cells → not enough of that film → alveoli collapse → {{RDS}}.</li>' +
      '<li><b>Dust cells</b> = {{alveolar macrophages}} → eat inhaled particles.</li>' +
      '<li><b>Pores of Kohn</b>: holes between alveoli → collateral air flow → prevent {{atelectasis}}.</li></ul></div>' +

/* Section G: Gas phase, partial pressures & gas-liquid equilibrium (Gas phase handout, slides 1–30). */
CVS.add({ id: 'G', short: 'Gas phase', title: 'Gas Phase, Partial Pressures & Gas-Liquid Equilibrium', kind: 'Lecture',
  blurb: 'STP/STPD/BTPS conventions, ideal and real gas laws, respiratory humidification, Dalton law, the alveolar gas equation, Graham and Henry laws, and clinical oxygen cylinders and delivery devices.',
  items: [
  { t: 'c', id: 'G-C1', title: 'Standard conditions (STP, STPD, BTPS) and the gas laws', src: 'Gas phase p.3–13',

      '<li><b>STPD</b> = 0 °C, 760 mmHg, {{dry}}.</li>' +
      '<li><b>BTPS</b> = {{37 °C}}, room pressure, {{saturated}} with water vapour (47 mmHg).</li>' +

      '<li>Chest expands → alveolar pressure falls below air → air flows {{in}}.</li></ul></li>' +
      '<li><b>Charles</b> (P constant): V rises with T. <b>Gay-Lussac</b> (V constant): P rises with T.</li>' +
      '<li><b>Ideal gas</b>: {{PV = nRT}}; 1 mole fills {{22.4 L}} at STP.</li>' +

      CVS.fig('gas-compress', 'Compressibility factor (PV/RT) of five real gases at 0 °C compared with an ideal gas.', 'gas', 11) + '</div>' },
  { t: 'q', id: 'G1', src: 'AC79', core: true, keep: true,

    ex: 'Boyle: at constant temperature, P₁V₁ = P₂V₂, so pressure rises as volume falls. A is Gay-Lussac, E is Dalton.' },
  { t: 'q', id: 'G2', src: 'AC80 · AC81', core: true, keep: true,

  { t: 'c', id: 'G-C2', title: 'Dalton law, airway humidification and the O2/CO2 cascade', src: 'Gas phase p.15–20',

      '<tr><td><b>O<sub>2</sub></b></td><td>{{159}}</td><td>{{149}}</td><td>{{≈ 100}}</td></tr>' +
      '<tr><td><b>CO<sub>2</sub></b></td><td>≈ 0</td><td>≈ 0</td><td>{{40}}</td></tr>' +
      '<tr><td><b>H<sub>2</sub>O</b></td><td>0</td><td>{{47}}</td><td>47</td></tr></tbody></table></div>' +
      '<ul class="pts"><li>Nose and airway warm and wet the air → fully saturated at {{37 °C}} just below the carina.</li>' +
      '<li>Water vapour takes 47 of the 760 → dry gas gets only {{713}} → P<sub>O2</sub> = 0.21 × dry-gas pressure.</li>' +

      '<div class="two">' + CVS.fig('gas-humid', 'Airway warming and humidification from the nose to the isothermic saturation boundary below the carina.', 'gas', 16) +
      CVS.fig('gas-cascade', 'Partial pressures of O2, CO2, H2O, and N2 from dry air through moist bronchial air to alveolar gas and blood.', 'gas', 20) + '</div>' },
  { t: 'q', id: 'G3', src: 'Gas phase p.16–17', core: true,
    q: 'When dry atmospheric air at sea level (PB = 760 mmHg, FiO2 = 0.2093) is warmed to 37 °C and fully humidified in the conducting airways, what is the moist bronchial PO2?',
    o: ['149.2 mmHg', '159.1 mmHg', '101.2 mmHg', '112.1 mmHg', '99.2 mmHg'], a: 0,
    ex: 'Water vapor at 37 °C (100% RH, 44 mg/L) exerts 47 mmHg, leaving 760 − 47 = 713 mmHg for dry gases: PO2(humidified) = 0.2093 × 713 = 149.2 mmHg.' },
  { t: 'tf', id: 'G4', src: 'Gas phase p.17–19',
    q: 'Humidification of inspired air in the upper respiratory tract lowers the partial pressure of oxygen before any alveolar gas exchange occurs.', a: true,
    ex: 'True: adding 47 mmHg of water vapor dilutes the total dry gas pressure from 760 to 713 mmHg, dropping PO2 from 159.1 mmHg to 149.2 mmHg in the conducting airways.' },
  { t: 'c', id: 'G-C3', title: 'The alveolar gas equation and Graham law of diffusion', src: 'Gas phase p.21–26',
    html: '<p class="eqn"><span>P<sub>AO2</sub> = F<sub>iO2</sub>(P<sub>B</sub> − 47) − P<sub>aCO2</sub>/R</span></p>' +
      '<ul class="pts"><li><b>R</b> = CO<sub>2</sub> made ÷ O<sub>2</sub> used ≈ {{0.8}}.</li>' +
      '<li><b>Room air</b>: 149 − 40/R ≈ {{100}} mmHg.</li>' +
      '<li><b>Exam form</b> (F<sub>iO2</sub> ≤ 0.6): replace “÷ R” with “× {{1.2}}”. Above 0.6, just subtract P<sub>aCO2</sub>.</li>' +
      '<li><b>Logic</b><ul><li>↑ P<sub>aCO2</sub> → CO<sub>2</sub> takes up room in the alveolus → P<sub>AO2</sub> {{falls}}.</li>' +
      '<li>↑ F<sub>iO2</sub> → P<sub>AO2</sub> {{rises}}.</li></ul></li>' +
      '<li><b>Graham</b>: heavier gas → slower diffusion; rate ∝ 1/√{{molecular weight}}.</li></ul>' +
      '<p class="note">Worked (AC80): F<sub>iO2</sub> 0.20 and P<sub>aCO2</sub> 40 → about 95 mmHg.</p>' },
  { t: 'q', id: 'G5', src: 'AC80', core: true, keep: true,
    q: 'If the fraction of inspired oxygen is 20% and the alveolar partial pressure exerted by carbon dioxide is 40 mmHg, and the respiratory exchange ratio is 0.8. What is the alveolar partial pressure of oxygen gas? <span class="muted">(P.S. the partial pressure of H₂O is not given.)</span>',
    o: ['92', '95', '98', '102', '10'], a: 1,
    ex: 'Use the clinical form of the alveolar gas equation with P<sub>H2O</sub> = 47 mmHg: PAO₂ = 0.20 × (760 − 47) − 40 × 1.2 = 142.6 − 48 ≈ 95 mmHg. The shortcut without the correction (− PACO₂/R = − 50) gives 92.6.',
    flag: 'AC80 key: 95. The ×1.2 (Beachey) form includes the correction factor; the simple form PIO₂ − PACO₂/R gives about 93.' },
  { t: 'q', id: 'G6', src: 'AC81', keep: true,
    q: 'A patient is receiving oxygen via a nasal cannula at 30% FiO₂. The arterial blood gas shows PaCO₂ = 44 mmHg, and the respiratory Exchange Ratio (R) is 0.8. Calculate the alveolar oxygen tension (PAO₂).',
    o: ['150', '155', '160', '165', '170'], a: 2,
    ex: 'PIO₂ = 0.30 × (760 − 47) = 213.9 mmHg. PAO₂ = 213.9 − 44/0.8 = 158.9 (or 213.9 − 44 × 1.2 = 161) ≈ 160 mmHg.' },
  { t: 'c', id: 'G-C4', title: 'Henry law, gas solubility in blood, and oxygen cylinders & delivery', src: 'Gas phase p.27–30',

      '<li><b>Henry</b>: {{C = αP}} → dissolved gas rises with its {{partial pressure}}.</li>' +
      '<li><b>O<sub>2</sub> dissolves poorly</b>: {{0.003}} mL/dL per mmHg → at P<sub>aO2</sub> 100 only {{0.3}} mL/dL → most O<sub>2</sub> must ride on {{hemoglobin}}.</li>' +

      '<li><b>Total gas in blood</b> = dissolved + {{bound}} + chemically changed (CO<sub>2</sub> → HCO<sub>3</sub><sup>−</sup>).</li>' +
      '<li><b>Giving O<sub>2</sub></b>: nasal cannula → F<sub>iO2</sub> rises with flow but stays {{low}}; a face mask reaches higher.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('gas-henry', 'Henry law and solubility coefficients of O2, CO2, N2, and CO in water, plasma, red cells, and whole blood.', 'gas', 28) +
      CVS.fig('gas-o2tank', 'Medical oxygen cylinders (G, M, D, E) with tank factors and flow/FiO2 ranges for nasal cannula and face mask.', 'gas', 30) + '</div></div>' },
  { t: 'q', id: 'G7', src: 'AC80 · AC81', core: true, keep: true,
    q: 'Which gas law explains the relation between the partial pressure of a gas and the concentration of the gas dissolved in a solution?',
    o: ['Boyle’s law', 'Charles’s law', 'Dalton’s law', 'Henry’s law', 'Graham’s law'], a: 3,

]});

/* Section M: Mechanics of breathing (Mechanics handout, slides 1–44). */
CVS.add({ id: 'M', short: 'Mechanics', title: 'Mechanics of Breathing: Pressures, Compliance, Resistance & Work', kind: 'Lecture',
  blurb: 'Inspiratory and expiratory muscles, pleural and alveolar pressures in spontaneous vs positive-pressure ventilation, surfactant and the lung-thorax relaxation curve, compliance, Poiseuille law and dynamic compression, breath sounds, and work of breathing.',
  items: [
  { t: 'c', id: 'M-C1', title: 'Respiratory muscles and pressures in spontaneous vs positive-pressure breathing', src: 'Mechanics p.1–12',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Muscles</b><ul><li>Quiet in: {{diaphragm}} + external intercostals. Quiet out: passive recoil.</li>' +
      '<li>Forced out: {{abdominal muscles}} (rectus, obliques) push the dome up.</li></ul></li>' +
      '<li><b>At rest (FRC)</b><ul><li>Lung pulls in, chest wall springs out → pleural pressure {{negative}} (about −5 cmH<sub>2</sub>O).</li>' +
      '<li>Alveolar pressure = {{0}} → no flow.</li></ul></li>' +
      '<li><b>Breathing in</b>: chest expands → pleural pressure falls further → alveolar pressure {{below 0}} → air flows in (Boyle).</li>' +
      '<li>Flow is fastest in {{mid-inspiration}}; it stops at end-inspiration (alveolar pressure back to 0).</li>' +
      '<li><b>Transpulmonary pressure</b> = alveolar − pleural → end-inspiration: 0 − (−8) = {{+8}}.</li>' +
      '<li><b>Ventilator (PPV)</b>: blows air in → pleural pressure {{rises}} instead of falling.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('mech-muscles', 'Muscles of inspiration (left) and muscles of expiration (right).', 'mech', 2) +
      CVS.fig('mech-cycle', 'Volume, intrapleural pressure, and alveolar pressure changes during a normal spontaneous breath.', 'mech', 9) + '</div></div>' +
      CVS.fig('mech-ppv', 'Pressures during passive positive-pressure ventilation compared with spontaneous breathing.', 'mech', 11) +
      '<p class="note">Volume left after a quiet breath out, with the muscles relaxed = <b>FRC</b>. Esophageal pressure is used as a stand-in for pleural pressure.</p>' },
  { t: 'q', id: 'M1', src: 'AC79', core: true, keep: true,
    q: 'Which of the following statements is correct?',
    o: ['Intrapleural pressure is always sub-atmospheric.', 'Transpulmonary pressure increases during expiration.', 'Intrapulmonary pressure is almost equivalent to intra-esophageal pressure', 'Lung volume that is left after quiet expiration is FRC.', 'Lung volume is the highest when the alveolar pressure at that moment is the most negative.'], a: 3,
    ex: 'D is the definition of FRC. A fails in forced expiration (intrapleural pressure turns positive). B: transpulmonary pressure falls in expiration. C: esophageal pressure tracks intrapleural, not alveolar, pressure. E: volume is highest at end-inspiration, when alveolar pressure is back to zero.' },
  { t: 'q', id: 'M2', src: 'AC81', keep: true,
    q: 'Which statement is true about quiet respiration in an adult?',
    o: ['Alveolar pressure is always sub-atmospheric.', 'Intrapleural pressure is higher than intraesophageal pressure.', 'Transpulmonary pressure is sub-atmospheric', 'Volume left in the lungs after quiet expiration is called functional residual capacity.'], a: 3,
    ex: 'Alveolar pressure is negative only during inspiration and positive during expiration; esophageal pressure is used as a stand-in for intrapleural pressure; transpulmonary pressure (PA − Ppl) stays positive.' },
  { t: 'q', id: 'M3', src: 'AC79 · AC80', keep: true,
    q: 'What is the amount of gas left in the lungs after normal expiration called?',
    o: ['ERV', 'RV', 'TV', 'FRC', 'IRV'], a: 3,
    ex: 'After a normal (quiet) expiration, with the muscles relaxed and alveolar pressure equal to atmospheric, the volume left is the FRC = ERV + RV. RV is what remains after a maximal expiration.',
    flag: 'AC80 asked it in Thai: “If all breathing muscles are relaxed and alveolar pressure equals atmospheric pressure, what volume is left in the lung?”' },
  { t: 'q', id: 'M4', src: 'AC81', core: true, keep: true,
    q: 'What causes the intrapleural pressure to be subatmospheric during rest?<br>i = lung and chest wall pull outward<br>ii = lung and chest wall pull inward<br>iii = lung elastic recoil tends to pull the lung inward and away from the chest wall<br>iv = thoracic wall elastic recoil tends to pull the chest wall outward and away from the lung',
    o: ['i', 'ii', 'iii', 'iv', 'iii and iv'], a: 4,
    ex: 'At FRC the lung recoils inward and the chest wall springs outward. Pulling the two pleural layers apart in opposite directions makes the pressure between them negative (about −5 cmH₂O).' },
  { t: 'q', id: 'M5', src: 'AC79', keep: true,
    q: 'Consider the graph shown below regarding the changes of intrapleural pressure in each breathing cycle. The inspiratory airflow is the maximum at which point of the graph?',
    fig: CVS.fig('ac79-pleuralgraph', 'AC79: intrapleural pressure through one breath, points A–E.', 'ac79', 7),
    o: ['A', 'B', 'C', 'D', 'E'], a: 1,
    ex: 'Inspiration runs from A down to C. Flow is fastest in mid-inspiration, where intrapleural (and alveolar) pressure is falling most steeply: B. At C inspiration ends and flow is zero.',
    flag: 'PS81 edit keys B; an older AC79 key gave C. C is end-inspiration, where flow stops.' },
  { t: 'q', id: 'M6', src: 'AC80', core: true, keep: true,
    q: 'จากภาพ transpulmonary pressure ขณะหายใจเข้าจนสุดเป็นเท่าไร (mm H₂O) <span class="muted">From the figure, what is the transpulmonary pressure at the end of a full inspiration? (the graph is in cmH₂O)</span>',
    fig: CVS.fig('ac80-ppl', 'AC80: intrapleural pressure during one breath (−5 to −8 cmH₂O).', 'ac80', 4),
    o: ['5', '6', '7', '8', '9'], a: 3,
    ex: 'Transpulmonary pressure = alveolar − intrapleural. At end-inspiration alveolar pressure is back to 0 and intrapleural pressure is at its lowest, −8: 0 − (−8) = 8.',
    flag: 'The recall wrote mm H₂O; the graph is in cmH₂O.' },
  { t: 'q', id: 'M7', src: 'AC79 · AC81', keep: true,
    q: 'A girl is blowing a balloon as much as she can that it makes the balloon volume close to the total lung capacity. Which of the following muscles can create the most expiratory effort?',
    o: ['Diaphragm + rectus abdominis', 'Diaphragm + sternocleidomastoid', 'Internal intercostal + rectus abdominis', 'Internal abdominal oblique + rectus abdominis', 'Diaphragm + external intercostal'], a: 3,
    ex: 'Maximal expiration comes from the abdominal muscles (rectus, obliques, transversus), which push the diaphragm up. The internal intercostals help, but the abdominal wall is far stronger. The diaphragm, SCM and external intercostals are inspiratory.',
    flag: 'AC81 asked the same (“rectus abdominis + internal oblique muscle”).' },
  { t: 'c', id: 'M-C2', title: 'Elastic recoil, surface tension, surfactant and the relaxation curve', src: 'Mechanics p.13–19',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Lung recoil</b> = elastic fibres + {{surface tension}} of the alveolar fluid.</li>' +
      '<li><b>Surfactant</b> ({{DPPC}}, from type II cells) → lowers that tension → {{less recoil}} → lung easier to inflate.</li>' +
      '<li>Small alveoli carry {{more surfactant}} per area → they don’t collapse into big ones.</li>' +
      '<li><b>Chest wall</b> springs {{outward}}; lung pulls {{inward}}.</li>' +
      '<li><b>At {{FRC}}</b> the two pulls are equal and opposite → relaxed resting point of the whole system.</li></ul></div>' +
      CVS.fig('mech-relax', 'Lung-thorax relaxation pressure curve showing the balance of lung and chest wall recoil at FRC.', 'mech', 18) + '</div>' },
  { t: 'q', id: 'M8', src: 'AC81', keep: true,
    q: 'What is the role of surfactant?',
    o: ['Decrease alveolar recoil', 'Increase alveolar elastic work force'], a: 0,
    ex: 'Surfactant lowers surface tension, which reduces the recoil of the alveoli, raises compliance and cuts the elastic work of breathing.',
    flag: 'Only two options were recalled.' },
  { t: 'c', id: 'M-C3', title: 'Lung and chest wall compliance (static vs dynamic)', src: 'Mechanics p.20–25',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Compliance</b> = {{ΔV / ΔP}} = the {{slope}} of the pressure-volume curve → steeper = easier to stretch.</li>' +
      '<li>Compliance is the opposite of {{elastic recoil}}.</li>' +
      '<li>Lung + chest wall in series → total compliance is {{lower}} than either alone.</li>' +
      '<li><b>Static</b> = measured with {{no airflow}}. <b>Dynamic</b> = during breathing → airway resistance also counts.</li>' +
      '<li><b>Disease</b><ul><li>{{Emphysema}}: walls destroyed → less recoil → compliance {{↑}}.</li>' +
      '<li>{{Fibrosis}}: stiff lung → more recoil → compliance {{↓}}.</li></ul></li></ul></div>' +
      CVS.fig('mech-compliance', 'Static lung compliance curves in alveolar septal destruction, normal lung, and interstitial stiffening.', 'mech', 24) + '</div>' },
  { t: 'q', id: 'M9', src: 'AC81', core: true, keep: true,
    q: 'Compare the lung compliance.',
    fig: CVS.fig('ac81-compliance', 'AC81: pressure–volume curves of three lungs, S, T and U.', 'ac81', 8),
    o: ['S>T>U', 'S<T<U', 'S=T=U', 'S<T>U', 'S>T<U'], a: 0,
    ex: 'Compliance = ΔV/ΔP, the slope of the curve. S rises most steeply, then T, then U.' },
  { t: 'q', id: 'M10', src: 'AC79 (made up partly by the recall team)', core: true, keep: true,
    q: 'A 49-year-old man comes to the doctor from worsening dyspnea upon exertion for the past 2 months. Chest examination reveals decreased chest wall movement and wheezing noise when breathing. The pulmonary function test and arterial blood gas results are as follows:<div class="tblwrap"><table class="tbl compact"><thead><tr><th>Parameter</th><th>Predicted</th><th>Measured</th><th>% Predicted</th><th>Post-BD</th></tr></thead><tbody><tr><td>FVC</td><td>4.99 L</td><td>4.12 L</td><td>83%</td><td>3.95 L</td></tr><tr><td>FEV₁</td><td>3.97 L</td><td>2.12 L</td><td>53%</td><td>2.75 L</td></tr><tr><td>FEV₁/FVC</td><td></td><td>51%</td><td></td><td>70%</td></tr></tbody></table></div>ABG: pH 7.37, pCO₂ 50 mmHg, [HCO₃⁻] 28 mEq/L. Which of the following is <b>incorrect</b> regarding the pathophysiology underlying this patient’s symptoms and test results?',
    o: ['Increased alveolar dead space', 'Dynamic compression of airways', 'Decreased Hb-O₂ affinity', 'Decreased compliance of lungs', 'Increased FRC'], a: 3,
    ex: 'This is obstructive disease with CO₂ retention (COPD pattern). Emphysema destroys elastic tissue, so lung compliance goes up, not down. Dead space, dynamic compression, a right-shifted curve from high CO₂, and air trapping (raised FRC) all fit.' },
  { t: 'c', id: 'M-C4', title: 'Airway resistance, radial traction and dynamic compression in COPD', src: 'Mechanics p.26–37',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Poiseuille</b>: R ∝ 1 / r<sup>4</sup> → halve the radius → resistance ×{{16}}.</li>' +
      '<li><b>Most resistance</b> is in the {{nose, mouth and large airways}}.</li>' +
      '<li>Small airways add little → so many in {{parallel}} → huge total cross-section.</li>' +
      '<li><b>Breathing in</b>: negative pleural pressure + {{radial traction}} from alveoli → airways held open.</li>' +
      '<li><b>Forced breath out</b>: pleural pressure turns positive → squeezes the airway → {{dynamic compression}} → more effort gives no more flow.</li>' +
      '<li><b>COPD</b>: less recoil → airways close early → {{air trapping}}.</li>' +
      '<li><b>Nerves</b>: parasympathetic → {{constrict}} (R ↑); sympathetic → dilate (R ↓).</li></ul></div>' +
      '<div class="stack">' + CVS.fig('mech-resistance', 'Airway resistance vs airway generation and velocity vs aggregate cross-sectional area.', 'mech', 28) +
      CVS.fig('mech-compress', 'Passive vs forced expiration showing positive pleural pressure and dynamic airway compression.', 'mech', 31) + '</div></div>' },
  { t: 'q', id: 'M11', src: 'AC80 · AC81', core: true, keep: true,
    q: 'What is the most important factor limiting forced expiration from total lung capacity to residual volume?',
    o: ['Action of diaphragm', 'Dynamic compression of the airway', 'Elasticity of the airway', 'Rate of contraction of expiratory muscles', 'Increases sympathetic stimulation of smooth muscles of the airway'], a: 1,
    ex: 'In forced expiration intrapleural pressure turns positive and squeezes the airways at the equal-pressure point. Beyond that point more effort only compresses the airway further, so flow is effort-independent.' },
  { t: 'c', id: 'M-C5', title: 'Airflow patterns, normal breath sounds and work of breathing', src: 'Mechanics p.38–44',
    html: '<div class="two"><div class="stack"><div class="tblwrap"><table class="tbl compact"><thead><tr><th>Sound</th><th>Character</th><th>Where</th></tr></thead><tbody>' +
      '<tr><td><b>Vesicular</b></td><td>{{soft, low}}; in &gt; out</td><td>{{most of the lung}}</td></tr>' +
      '<tr><td><b>Bronchovesicular</b></td><td>in = out</td><td>1st–2nd space front, between the scapulae</td></tr>' +
      '<tr><td><b>Bronchial</b></td><td>{{loud, high}}; out &gt; in</td><td>over the {{manubrium}}</td></tr></tbody></table></div>' +
      '<ul class="pts"><li><b>Flow</b>: {{laminar}} in small airways; {{turbulent}} in the trachea at high flow.</li>' +
      '<li><b>Work of breathing</b><ul><li>Most of it goes into stretching the lung ({{elastic}} work).</li>' +
      '<li>Bronchoconstriction → R ↑ → {{resistive}} work ↑.</li></ul></li>' +
      '<li><b>Disease</b>: fibrosis → stretching work ↑; COPD → airway work ↑.</li></ul></div>' +
      CVS.fig('mech-work', 'Pressure-volume work-of-breathing loops in restrictive lung disease (a) and obstructive lung disease (b).', 'mech', 43) + '</div>' },
  { t: 'q', id: 'M12', src: 'AC80', keep: true,
    q: 'Which of the following will increase as a result from contraction of bronchial smooth muscle?',
    o: ['Lung compliance', 'Airway diameter', 'Elastic work of breathing', 'Resistive work of breathing', 'Anatomic dead space'], a: 3,
    ex: 'Bronchoconstriction narrows the airways, and resistance rises steeply (R ∝ 1/r⁴), so the resistive (non-elastic) work of breathing goes up. Compliance and elastic work are properties of the stretchy tissue; the anatomic dead space falls slightly.' },
  { t: 'q', id: 'M13', src: 'AC81', keep: true,
    q: 'What is the characteristic of vesicular breath sounds?',
    o: ['Soft, low pitch', 'High pitch', 'Expiratory time longer than inspiratory time'], a: 0,
    ex: 'Vesicular sounds, heard over most of the lung, are soft and low-pitched, with inspiration longer than expiration. Bronchial sounds are loud and high-pitched with a long expiratory phase.' }
]});

/* Section E: Alveolar Ventilation, Diffusion, Perfusion Limitation & V/Q Matching (681114-1 Gas exchange.pdf, 72 pages). */
CVS.add({ id: 'E', short: 'Gas exchange', title: 'Alveolar Ventilation, Diffusion, Perfusion Limitation & V/Q Matching', kind: 'Lecture',
  blurb: 'Dalton and Henry laws, the partial pressure cascade and alveolar gas equation, Fick diffusion and DLCO, O2 content, perfusion vs diffusion limitation, regional V/Q differences, dead space, shunt, A-a gradient, and exercise ventilation.',
  items: [
  { t: 'c', id: 'E-C1', title: 'Partial pressure cascade, alveolar gas equation & alveolar ventilation', src: 'Gas exchange p.7–12, 15',
    html: '<div class="two"><div class="stack"><p><b>O<sub>2</sub> cascade (mmHg)</b>: dry air {{160}} → humidified airway 150 → alveolus {{100}} → artery {{97}}.</p>' +
      '<ul class="pts"><li>Air → airway: water vapour ({{47}}) dilutes the air.</li>' +
      '<li>Airway → alveolus: CO<sub>2</sub> comes in and takes up room (P<sub>ACO2</sub>/R).</li>' +
      '<li>Alveolus → artery: about 2% of blood bypasses the alveoli ({{bronchial}} veins, Thebesian veins) → small normal shunt.</li>' +
      '<li><b>R</b> depends on food: carbohydrate {{1.0}}, fat 0.7.</li>' +
      '<li><b>Alveolar ventilation</b> = {{(TV − dead space) × RR}}; minute ventilation = TV × RR.</li>' +
      '<li><b>Hyperventilate</b> (CO<sub>2</sub> production unchanged) → CO<sub>2</sub> washed out → P<sub>ACO2</sub> and end-tidal CO<sub>2</sub> {{fall}}; P<sub>AO2</sub> rises.</li></ul></div>' +
      CVS.fig('exch-shunt-phys', 'Oxygen cascade from dry air to arterial blood, showing the 2% anatomic/physiologic shunt.', 'exch', 8) + '</div>' +
      '<p class="note">Worked (AC79): dead space 150 mL, RR 10, cardiac output 5 L/min → needs a tidal volume of about 550 mL.</p>' },
  { t: 'q', id: 'E1', src: 'AC81', core: true, keep: true,
    q: 'A 75-kg man has a dead space of 150 mL. What tidal volume (TV) and respiratory rate (RR) are required to maintain normal alveolar ventilation if his cardiac output is 5 L/min?',
    o: ['TV 250, RR 10', 'TV 450, RR 10', 'TV 350, RR 10', 'TV 550, RR 10', 'TV 750, RR 10'], a: 3,
    ex: 'Normal V/Q is about 0.8, so with a cardiac output of 5 L/min alveolar ventilation should be about 4 L/min. V̇A = (TV − dead space) × RR = (550 − 150) × 10 = 4,000 mL/min.' },
  { t: 'q', id: 'E2', src: 'AC79', core: true, keep: true,
    q: 'A medical student waiting to do the first patient interview becomes anxious and his respiratory rate is increased. If the rate of carbon dioxide production is constant, which of the following parameters is decreased?',
    o: ['P<sub>alveolar</sub>O₂', 'Work of breathing', 'Pulmonary blood flow', 'The level of carbon dioxide at the end of an exhaled breath (ETCO₂)', 'V/Q ratio'], a: 3,
    ex: 'More alveolar ventilation with the same CO₂ production washes CO₂ out, so PACO₂ and end-tidal CO₂ fall, while PAO₂, work of breathing and V/Q go up.',
    flag: 'PS81 edit keys ETCO₂; an older AC79 key gave PAO₂, which actually rises when you hyperventilate.' },
  { t: 'c', id: 'E-C2', title: 'Fick’s law of diffusion, Graham’s law & DLCO', src: 'Gas exchange p.18–24, 41',
    html: '<div class="two"><div class="stack"><p class="eqn"><span>V̇<sub>gas</sub> ∝ A × D × (P<sub>1</sub> − P<sub>2</sub>) / T</span></p>' +
      '<ul class="pts"><li>More {{area}}, bigger gradient, better solubility → faster.</li>' +
      '<li>{{Thicker}} barrier (fibrosis, edema) → slower.</li>' +
      '<li><b>D</b> ∝ solubility / √MW.</li>' +
      '<li><b>CO<sub>2</sub> vs O<sub>2</sub></b>: CO<sub>2</sub> is heavier (slightly slower) but about 24× more {{soluble}} → net ≈ {{20×}} faster.</li>' +
      '<li><b>D<sub>LCO</sub></b> measures how well gas crosses the barrier into blood.<ul>' +
      '<li>{{Low}}: less surface ({{emphysema}}), thick wall (fibrosis), less blood (embolism), anemia.</li>' +
      '<li>{{High}}: more blood in the capillaries → exercise, {{fever}}, polycythemia, pulmonary hemorrhage, L-to-R shunt.</li></ul></li></ul></div>' +
      CVS.fig('exch-fick', 'Fick’s law of diffusion, diffusion coefficient (D), and lung diffusing capacity (DL).', 'exch', 24) + '</div>' },
  { t: 'q', id: 'E3', src: 'AC80', core: true, keep: true,
    q: 'Which of the following will <i>decrease</i> the diffusion of gases from the alveoli to the pulmonary capillaries?',
    o: ['Increased alveolar–capillary partial pressure gradient of O₂', 'Increased alveolar surface area', 'Increased thickness of the respiratory membrane', 'Increased pulmonary capillary blood flow', 'Increased solubility of the gas'], a: 2,
    ex: 'Fick’s law: diffusion ∝ area × gradient × solubility / (thickness × √MW). A thicker membrane (fibrosis, edema) slows diffusion.',
    flag: 'AC80 asked it twice (the second version had three options).' },
  { t: 'q', id: 'E4', src: 'AC80', core: true, keep: true,
    q: 'In the human respiratory system, both oxygen (O₂) and carbon dioxide (CO₂) gases can diffuse across the alveolar–capillary membrane. According to Graham’s law of diffusion, and considering the higher solubility of carbon dioxide, approximately how many times faster does carbon dioxide diffuse through the alveolar membrane compared to oxygen?',
    o: ['0.85', '2', '20', '24', '200'], a: 2,
    ex: 'Graham: rate ∝ 1/√MW, so CO₂ (44) is about 0.85 × as fast as O₂ (32). But CO₂ is about 24 × more soluble. 0.85 × 24 ≈ 20 times faster.',
    flag: 'AC80 asked it twice.' },
  { t: 'q', id: 'E5', src: 'AC81', keep: true,
    q: 'Which of the following can cause a significant increase in DLCO?',
    o: ['Fever', 'Pulmonary embolism', 'Emphysema', 'Pulmonary fibrosis', 'Severe anemia'], a: 0,
    ex: 'The lecture lists fever with exercise, polycythemia, pulmonary hemorrhage and left-to-right shunt as causes of a high DLCO (more capillary blood). Embolism, emphysema, fibrosis and anemia lower it.' },
  { t: 'c', id: 'E-C3', title: 'O2 content, capillary transit time & perfusion vs diffusion limitation', src: 'Gas exchange p.26–32, 36–40',
    html: '<div class="two"><div class="stack"><p class="eqn"><span>O<sub>2</sub> content = Hb × {{1.34}} × S<sub>O2</sub> + P<sub>O2</sub> × 0.003</span></p>' +
      '<ul class="pts"><li>Artery ≈ {{20}} mL/dL; vein ≈ 15 → each 100 mL of blood drops off 5 mL.</li>' +
      '<li><b>Transit time</b>: blood stays {{0.75 s}} in the capillary; O<sub>2</sub> equilibrates in 0.25 s → plenty of spare time.</li>' +
      '<li><b>{{Perfusion-limited}}</b> (O<sub>2</sub> at rest, CO<sub>2</sub>, N<sub>2</sub>O)<ul>' +
      '<li>gas equilibrates early → only more blood flow takes up more.</li></ul></li>' +
      '<li><b>{{Diffusion-limited}}</b> ({{CO}} always)<ul>' +
      '<li>It binds Hb so tightly that plasma P<sub>CO</sub> never rises → gradient never closes.</li>' +
      '<li>O<sub>2</sub> joins this group in thick-wall disease, hard exercise, or {{altitude}}.</li></ul></li>' +
      '<li><b>Exercise up a mountain</b>: faster blood → {{shorter transit time}} + small gradient → no time to equilibrate → P<sub>aO2</sub> falls.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('exch-perf-lim', 'Early capillary equilibration of O2 and N2O (flow-dependent uptake).', 'exch', 37) + CVS.fig('exch-diff-lim', 'Uptake of CO and of O2 in lung disease across the capillary length.', 'exch', 38) + '</div></div>' },
  { t: 'q', id: 'E6', src: 'AC80', keep: true,
    q: 'ออกกำลังกายที่สูง 5000 เมตร ให้ตาราง PaO₂ ก่อนออกกำลังกายเทียบหลังออก<div class="tblwrap"><table class="tbl compact"><thead><tr><th></th><th>PaO₂ ก่อน (rest)</th><th>PaO₂ หลัง (exercise)</th></tr></thead><tbody><tr><td>ระดับน้ำทะเล (sea level)</td><td class="num">92</td><td class="num">92</td></tr><tr><td>ที่สูง 5000 m</td><td class="num">50</td><td class="num">40</td></tr></tbody></table></div>ถามว่าอะไรคือกลไกที่ทำให้ PO₂ ลดลงเมื่อออกกำลังกายในที่สูงเมื่อเทียบกับภาวะพักในที่สูง <span class="muted">Exercise at 5,000 m: what lowers PaO₂ during exercise at altitude compared with rest at altitude?</span>',
    o: ['Increase shunt fraction', 'Increase dead space fraction', 'Decrease blood transit time', 'Hyperventilation'], a: 2,
    ex: 'Exercise speeds blood through the capillary (transit time can fall below 0.25 s). At sea level that is still enough time, but at altitude the small alveolar–capillary gradient makes O₂ uptake slow, so it becomes diffusion-limited and PaO₂ falls.' },
  { t: 'c', id: 'E-C4', title: 'Regional ventilation, perfusion & V/Q ratio from apex to base', src: 'Gas exchange p.43–51',
    html: '<div class="two"><div class="stack"><div class="tblwrap"><table class="tbl compact"><thead><tr><th>Upright lung</th><th>Apex</th><th>Base</th></tr></thead><tbody>' +
      '<tr><td>Pleural pressure</td><td>{{more negative}}</td><td>less negative</td></tr>' +
      '<tr><td>Alveoli at rest</td><td>{{larger}}</td><td>smaller</td></tr>' +
      '<tr><td>Compliance → ventilation</td><td>{{lower}}</td><td>higher</td></tr>' +
      '<tr><td>Perfusion (gravity)</td><td>much less</td><td>{{much higher}}</td></tr>' +
      '<tr><td>V/Q</td><td>{{highest}}</td><td>{{lowest}}</td></tr></tbody></table></div>' +
      '<ul class="pts"><li>Apex: alveoli already stretched → expand less on each breath.</li>' +
      '<li>Ventilation and perfusion both fall toward the apex, but perfusion falls {{more}} → V/Q rises.</li>' +
      '<li>Whole lung: about 4.2 L air / 5 L blood → V/Q ≈ {{0.8}}.</li>' +
      '<li>Lying flat → blood flow nearly even from apex to base.</li></ul></div>' +
      CVS.fig('exch-vq-zones', 'Regional differences in ventilation, perfusion, and V/Q ratio from apex to base in the upright lung.', 'exch', 50) + '</div>' },
  { t: 'q', id: 'E7', src: 'AC79', core: true, keep: true,
    q: 'Which of the following parameters is greater in the apex of the lung than the base of the lung in upright position?',
    o: ['Perfusion', 'Ventilation', 'V/Q ratio', 'Intrapleural pressure', 'Compliance'], a: 2,
    ex: 'Both ventilation and perfusion are lower at the apex, but perfusion falls much more, so V/Q is highest at the apex (about 3). Apical alveoli are already stretched, so their compliance is lower; intrapleural pressure is more negative there.' },
  { t: 'q', id: 'E8', src: 'AC81', keep: true,
    q: 'What is true regarding the lung apex compared to the lung base in an upright position?',
    o: ['Higher ventilation', 'The upper alveoli are larger than the lower ones', 'Higher blood flow'], a: 1,
    ex: 'Intrapleural pressure is more negative at the apex, so apical alveoli are more distended (largest alveoli at the apex, Gas exchange p.43). Ventilation and blood flow are both higher at the base.',
    flag: 'The recall wrote “the upper alveoli are <i>smaller</i> than the lower ones” and keyed it. The lecture says the largest alveoli are at the apex (Gas exchange p.43), so the option must have read “larger”; it is shown corrected here.' },
  { t: 'c', id: 'E-C5', title: 'V/Q mismatch, dead space, shunt, A-a gradient & exercise ventilation', src: 'Gas exchange p.33, 56–68',
    html: '<div class="two"><div class="stack"><div class="cols2">' +
      '<div class="mini art"><h4>Dead space · V/Q = ∞</h4><ul><li>Air, no blood.</li><li>Alveolus looks like inspired air: P<sub>O2</sub> {{high}}, P<sub>CO2</sub> ≈ 0.</li><li>Pulmonary embolism, shock.</li></ul></div>' +
      '<div class="mini ven"><h4>Shunt · V/Q = 0</h4><ul><li>Blood, no air.</li><li>Blood leaves like venous blood: P<sub>O2</sub> {{40}}.</li><li>Pus, fluid or collapse in the alveoli.</li></ul></div></div>' +
      '<ul class="pts"><li>V/Q above normal → {{wasted ventilation}}; below normal → wasted perfusion.</li>' +
      '<li><b>Anatomic dead space</b> ≈ 150 mL ≈ {{30%}} of a 500 mL breath; measured by {{Fowler}} (N<sub>2</sub> washout).</li>' +
      '<li><b>Physiologic dead space fraction</b> (V<sub>D</sub>/V<sub>T</sub>) → {{Bohr}} equation.</li>' +
      '<li>Pus or edema in alveoli (no vasoconstriction) → {{physiological shunt}}.</li>' +
      '<li><b>A–a gradient</b> normal ≈ age/4 + 4; widened by shunt, V/Q mismatch, {{diffusion defect}}.</li>' +
      '<li><b>Exercise</b>: sudden rise ({{proprioceptors}}, mind) → then ventilation matches CO<sub>2</sub> → blood gases stay normal.</li></ul></div>' +
      CVS.fig('exch-vq-mismatch', 'Gas tensions from pure shunt (V/Q = 0) through normal to pure dead space (V/Q = infinity).', 'exch', 61) + '</div>' },
  { t: 'q', id: 'E9', src: 'AC80', core: true, keep: true,
    q: 'Concerning alveolar ventilation, what is the Bohr’s equation used to calculate?',
    o: ['Alveolar ventilation rate (V̇A)', 'Oxygen diffusion capacity', 'Dead space fraction (VD/VT)', 'Ventilation-perfusion (V/Q) ratio', 'Respiratory exchange ratio (RER)'], a: 2,
    ex: 'Bohr’s method measures the physiological dead space fraction: VD/VT = (PaCO₂ − PECO₂)/PaCO₂. Fowler’s single-breath nitrogen washout measures the anatomical dead space.' },
  { t: 'q', id: 'E10', src: 'AC80', keep: true,
    q: 'Which of the following is the approximate percentage of the tidal volume remaining in the airway?',
    o: ['5%', '10%', '15%', '30%', '45%'], a: 3,
    ex: 'About 150 of a 500 mL breath stays in the conducting airways (anatomic dead space), so VD/VT is about 0.3 (30%).',
    flag: 'Recalled in the AC80 mechanics chapter; it is a dead space question.' },
  { t: 'q', id: 'E11', src: 'AC81', core: true, keep: true,
    q: 'The V/Q in alveolar A = 1, B = 0.5, C = 2. Which of the following statements is true?',
    o: ['A wasted ventilation', 'B wasted ventilation', 'PO₂ in C is higher than normal', 'PO₂ in C is lower than normal'], a: 2,
    ex: 'Normal V/Q is about 0.8. A high V/Q (C = 2) behaves like dead space: high PO₂, low PCO₂. A low V/Q (B = 0.5) behaves like shunt: low PO₂, high PCO₂.' },
  { t: 'q', id: 'E12', src: 'AC80', keep: true,
    q: 'V/Q: alveolar A = 1, alveolar B = 0.5, alveolar C = 2. Which statement is true?',
    o: ['PO₂ in B is higher than normal', 'PO₂ in C is lower than normal', 'PCO₂ in A is higher than normal', 'B wasted ventilation', 'C wasted ventilation'], a: 4,
    ex: 'C has ventilation far in excess of blood flow: much of its ventilation is wasted (dead-space-like). B is perfusion in excess of ventilation (wasted perfusion, shunt-like).' },
  { t: 'q', id: 'E13', src: 'AC81', keep: true,
    q: 'Which of the following choices is caused by pulmonary edema not considering the constriction effect?',
    o: ['Physiological shunt', 'Physiological dead space', 'Anatomical shunt', 'Anatomical dead space'], a: 0,
    ex: 'Fluid-filled alveoli are perfused but not ventilated (V/Q → 0): blood passes without picking up O₂. That is a physiological (intrapulmonary) shunt. Hypoxic vasoconstriction would reduce it, which the question tells you to ignore.' },
  { t: 'q', id: 'E14', src: 'AC81 (clinical correlation)', core: true, keep: true,
    q: 'The patient has been diagnosed with an infection in the lower lobe of the left lung. The imaging result shows pus filling the lung tissue, obstructing gas exchange. There is no sign of hypoxic vasoconstriction in the area. Which statement is correct?',
    o: ['An increase in physiological shunt', 'An increase in anatomical shunt', 'An increase in anatomical dead space', 'An increase in physiological dead space', 'An increase in anatomical and physiological dead space'], a: 0,
    ex: 'Consolidated alveoli still receive blood but no air, and without hypoxic vasoconstriction that blood keeps flowing: a physiological shunt. An anatomical shunt bypasses the alveoli entirely (bronchial and Thebesian veins).' },
  { t: 'q', id: 'E15', src: 'AC81 (clinical correlation)', keep: true,
    q: 'A patient falls off a motorcycle and hits a tree, resulting in a chest injury. A chest X-ray reveals a left-sided pneumothorax. What is the physiological mechanism responsible for the resulting decrease in arterial PO₂?',
    o: ['Restrict lung expansion and V/Q mismatch', 'Rapid interstitial edema', 'Increase venous return'], a: 0,
    ex: 'The collapsed lung cannot expand, so its alveoli get little air while blood still flows through them: low V/Q units and shunt lower the PaO₂.',
    flag: 'AC81 also showed a CXR asking the same (keyed “restrict lung and V/Q mismatch”).' }
]});

/* Section T: Hemoglobin, Oxygen Dissociation Curve & CO2 Transport (681114-2 Gas Transport.pdf, 43 pages). */
CVS.add({ id: 'T', short: 'Gas transport', title: 'Hemoglobin, Oxygen Dissociation Curve & CO2 Transport', kind: 'Lecture',
  blurb: 'Partial pressure vs tension, the 9-step diffusion pathway, hemoglobin structure and T-to-R oxygenation mechanics, P50 and allosteric effectors (2,3-BPG, pH, CO2, temperature), hemoglobin variants, CO poisoning, myoglobin, and CO2 transport with the Bohr and Haldane effects.',
  items: [
  { t: 'c', id: 'T-C1', title: 'Physical gas transport, 9-step diffusion path & RBC carrying capacity', src: 'Gas transport p.2–11, 14',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Gas ↔ liquid</b>: {{partial pressure}} pushes gas into the liquid; {{tension}} pushes it back out → equal at equilibrium.</li>' +
      '<li><b>Path, alveolus → Hb</b>: alveolar air → {{surfactant}} → alveolar wall → interstitium → capillary wall → plasma → RBC membrane → inside the RBC → Hb.</li>' +
      '<li><b>Exercise</b> → more capillaries open + thinner stretched walls → diffusing capacity {{rises}} about 3×.</li>' +
      '<li><b>Diffusion falls</b> with<ul><li>less area (pneumonia, atelectasis, tumour)</li>' +
      '<li>a thick wall = {{alveolar-capillary block}} (edema, fibrosis, silicosis).</li></ul></li>' +
      '<li><b>RBCs</b> soak up dissolved O<sub>2</sub> → more can dissolve → blood carries about {{65×}} more O<sub>2</sub>.</li>' +
      '<li><b>Anemia</b> → less Hb → O<sub>2</sub> {{content}} and delivery fall, but P<sub>aO2</sub> (set by the lung) stays {{normal}}.</li></ul></div>' +
      CVS.fig('trans-rbc', 'RBCs bind dissolved gas reversibly, shifting the equilibrium so much more gas can dissolve and be transported.', 'trans', 11) + '</div>' },
  { t: 'q', id: 'T1', src: 'AC81', core: true, keep: true,
    q: 'A woman comes with anemia. Blood test reveals she has iron deficiency. Which one is not affected?',
    o: ['Total content of oxygen in blood', 'Oxygen saturation', 'Hemoglobin production', 'Oxygen delivering to tissue', 'Arterial pO₂'], a: 4,
    ex: 'PaO₂ depends on the lungs (alveolar PO₂ and diffusion), not on how much hemoglobin there is. Anemia lowers hemoglobin, O₂ content and O₂ delivery; the key keeps saturation among the affected ones.',
    flag: 'Raw student key: E. In uncomplicated anemia SaO₂ is usually normal too; arterial PO₂ is the safest “not affected” answer.' },
  { t: 'c', id: 'T-C2', title: 'Hemoglobin A structure & molecular mechanism of oxygenation', src: 'Gas transport p.12–21',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>HbA</b> = {{α2β2}}: 4 globins, 4 hemes, each with <b>Fe<sup>2+</sup></b>.</li>' +
