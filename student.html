      '<li><b>{{Volatile acid}}</b> (CO₂ from aerobic metabolism, {{15,000–20,000}} mmol/day) is eliminated by the lungs; <b>non-volatile ({{fixed}}) acids</b> ({{50–100}} mEq/day from protein/phospholipid catabolism: sulfuric, phosphoric, uric, lactic, and ketoacids) are excreted by the kidneys.</li>' +
      '<li><b>Henderson–Hasselbalch equation</b>: pH = {{6.1}} + log([HCO₃⁻] / ({{0.03}} × PaCO₂)); at [HCO₃⁻] = 24 mmol/L and PaCO₂ = 40 mmHg, the base-to-acid ratio is {{20:1}} (log 20 = 1.3 → pH 7.40).</li>' +
      '<li>Three lines of defense: <b>chemical buffers</b> act within {{seconds}}, <b>respiratory regulation</b> within {{minutes}}, and <b>renal regulation</b> over hours to days.</li></ul></div>' +
      CVS.fig('acid-buffers', 'Extracellular, intracellular, and renal tubular buffer systems with their pKa values.', 'acid', 16) + '</div>' },
  { t: 'q', id: 'A1', src: 'Acid-base p.11–13', core: true,
    q: 'In the Henderson–Hasselbalch equation for the bicarbonate buffer system at normal arterial blood values ([HCO₃⁻] = 24 mmol/L, PaCO₂ = 40 mmHg), what is the ratio of <b>[HCO₃⁻] to dissolved CO₂ (0.03 × PaCO₂)</b>?',
    o: ['20 : 1', '10 : 1', '1 : 20', '24 : 40', '40 : 1'], a: 0,
    ex: 'Dissolved CO₂ = 0.03 × 40 = 1.2 mmol/L. Therefore [HCO₃⁻] / (0.03 × PaCO₂) = 24 / 1.2 = 20 : 1, and log(20) = 1.30, giving pH = 6.1 + 1.30 = 7.40.' },
  { t: 'q', id: 'A2', src: 'Acid-base p.16–19',
    q: 'Why is the <b>HCO₃⁻ / CO₂ buffer system</b> the most important physiological buffer in extracellular fluid despite having a pKa of 6.1 (far from 7.4)?',
    o: ['It is abundant in ECF and works as an open system whose components are independently regulated by the lungs (PaCO₂) and kidneys ([HCO₃⁻])', 'Its pKa of 6.1 is closer to normal blood pH than the pKa of inorganic phosphate (6.8)', 'Bicarbonate cannot cross out of red blood cells into plasma', 'It buffers only fixed acids and never interacts with other buffer pairs', 'Carbonic anhydrase is absent in both red blood cells and renal tubular epithelium'], a: 0,
    ex: 'Although a pKa of 6.1 gives lower intrinsic chemical buffering power at pH 7.4 than phosphate (pKa 6.8), HCO₃⁻/CO₂ is the premier ECF buffer because it is present in high concentration (24 mmol/L) and is an open regulated system (lungs control CO₂, kidneys control HCO₃⁻).' },
  { t: 'tf', id: 'A3', src: 'Acid-base p.8, 19',
    q: 'Daily metabolic production of volatile acid (CO₂, ~15,000–20,000 mmol/day) is far greater than daily production of fixed non-volatile acids (~50–100 mEq/day).', a: true,
    ex: 'True. Tissue metabolism generates 15,000–20,000 mmol/day of CO₂ (eliminated by ventilation) compared with 50–100 mEq/day of fixed acid (handled by renal excretion).' },

  { t: 'c', id: 'A-C2', title: 'Renal HCO₃⁻ reclamation vs new HCO₃⁻ generation', src: 'Acid-base p.31–44',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li>Filtered HCO₃⁻ load is ~{{4,320}} mEq/day (180 L/day × 24 mEq/L); <b>{{85%}}</b> is reabsorbed in the proximal convoluted segment, {{10%}} in the thick ascending limb, and {{4.9%}} in the distal/collecting segments (&gt;99.9% conserved).</li>' +
      '<li>Proximal reclamation uses apical {{NHE3}} (Na⁺–H⁺ exchanger) and brush-border {{CA IV}} (plus cytosolic CA II); it conserves filtered HCO₃⁻ without net H⁺ excretion.</li>' +
      '<li><b>New HCO₃⁻ generation</b> requires excreting H⁺ with urinary buffers: (1) <b>{{titratable acid}}</b> (mainly HPO₄²⁻ → H₂PO₄⁻, pKa {{6.8}}, 10–40 mEq/day; minimum urine pH {{4.4–4.5}}) and (2) <b>NH₄⁺ excretion</b> from proximal {{glutamine}} metabolism (20–50 mEq/day baseline, inducible up to {{500}} mEq/day in chronic acidosis).</li>' +
      '<li>In the collecting duct, <b>type A intercalated cells</b> secrete H⁺ (via H⁺-ATPase and H⁺/K⁺-ATPase) during acidosis, whereas <b>type B intercalated cells</b> secrete HCO₃⁻ via apical {{pendrin}} during alkalosis.</li></ul></div>' +
      '<div class="stack">' +
      CVS.fig('acid-hco3-reabs', 'Segmental reabsorption of filtered HCO₃⁻ along the nephron and proximal mechanism.', 'acid', 35) +
      CVS.fig('acid-titratable', 'Formation of urinary phosphate buffer and generation of new HCO₃⁻ in α-intercalated cells.', 'acid', 39) +
      CVS.fig('acid-nh4', 'Synthesis of NH₄⁺ in the early nephron, countercurrent trapping in TAL, and collecting duct secretion.', 'acid', 41) +
      '</div></div>' },
  { t: 'q', id: 'A4', src: 'Acid-base p.34–42', core: true,
    q: 'During severe <b>chronic metabolic acidosis</b>, which renal mechanism provides the <b>greatest quantitative increase</b> in net acid excretion and new HCO₃⁻ generation?',
    o: ['Increased glutamine metabolism and urinary NH₄⁺ excretion (up to ~500 mEq/day)', 'Unrestricted reduction of urine pH below 2.0', 'Doubling proximal tubular HCO₃⁻ reclamation without excreting urinary buffers', 'Increased HCO₃⁻ secretion by type B intercalated cells via pendrin', 'Washout of filtered phosphate to 500 mEq/day'], a: 0,
    ex: 'Titratable acid is limited by filtered phosphate supply (10–40 mEq/day), and urine pH cannot fall below 4.4–4.5. In chronic acidosis, renal glutamine metabolism and NH₄⁺ excretion can increase from 20–50 mEq/day up to ~500 mEq/day.' },
  { t: 'q', id: 'A5', src: 'Acid-base p.35–37',
    q: 'Reabsorption of 85% of filtered HCO₃⁻ in the <b>proximal convoluted tubule</b> depends directly on apical H⁺ secretion via:',
    o: ['Na⁺–H⁺ exchanger (NHE3) coupled to brush-border carbonic anhydrase IV', 'Apical pendrin Cl⁻/HCO₃⁻ exchanger', 'Basolateral H⁺/K⁺-ATPase', 'NKCC2 cotransporter in the macula densa', 'ENaC channels in principal cells'], a: 0,
    ex: 'In the proximal tubule, H⁺ is secreted into the lumen primarily by NHE3 (with a smaller H⁺-ATPase contribution), combines with filtered HCO₃⁻ via brush-border CA IV to form CO₂ + H₂O, and returns to blood as HCO₃⁻ via basolateral NBCe1.' },
  { t: 'tf', id: 'A6', src: 'Acid-base p.35, 39',
    q: 'Reabsorption of filtered HCO₃⁻ in the proximal tubule results in net excretion of fixed H⁺ in the urine and adds newly synthesized HCO₃⁻ to the body.', a: false,
    ex: 'False. Proximal HCO₃⁻ reabsorption merely reclaims filtered HCO₃⁻ (1 H⁺ secreted neutralizes 1 filtered HCO₃⁻). Net H⁺ excretion and new HCO₃⁻ generation occur only when secreted H⁺ is excreted in urine as titratable acid (H₂PO₄⁻) or NH₄⁺.' },

  { t: 'c', id: 'A-C3', title: 'The four primary acid-base disorders and expected compensation', src: 'Acid-base p.46–61',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Respiratory acidosis</b> (↑PaCO₂ &gt; {{45 mmHg}}): <b>acute</b> ↑[HCO₃⁻] by {{1}} mmol/L per 10 mmHg ↑PaCO₂; <b>chronic</b> (&gt;3–5 days) ↑[HCO₃⁻] by {{3.5 mmol/L}} (or 3–4) per 10 mmHg ↑PaCO₂.</li>' +
      '<li><b>Respiratory alkalosis</b> (↓PaCO₂ &lt; {{35 mmHg}}): <b>acute</b> ↓[HCO₃⁻] by {{2 mmol/L}} per 10 mmHg ↓PaCO₂; <b>chronic</b> ↓[HCO₃⁻] by {{4–5 mmol/L}} per 10 mmHg ↓PaCO₂.</li>' +
      '<li><b>Metabolic acidosis</b> (↓[HCO₃⁻] &lt; {{22 mmol/L}}): respiratory compensation via {{Kussmaul}} hyperventilation lowers PaCO₂ by {{1.25 mmHg}} per 1 mmol/L ↓[HCO₃⁻] (or 5 mmHg per 4 mmol/L ↓[HCO₃⁻]; <b>{{Winter’s}} formula</b>: PaCO₂ = 1.5×[HCO₃⁻] + 8 ± 2).</li>' +
      '<li><b>Metabolic alkalosis</b> (↑[HCO₃⁻] &gt; {{26 mmol/L}}): hypoventilation raises PaCO₂ by {{0.75 mmHg}} per 1 mmol/L ↑[HCO₃⁻] (or 3 mmHg per 4 mmol/L ↑[HCO₃⁻]).</li></ul>' +
      '<p class="trap">Slide 55, 56 &amp; 60 prose contain direction typos ("increase" instead of "decrease"); always follow the minus sign in the equations and the summary table on slide 61: compensation always moves the secondary variable in the <b>same direction</b> as the primary change.</p></div>' +
      CVS.fig('acid-comp-table', 'Summary table of the four primary acid-base disorders and their compensation ratios.', 'acid', 61) + '</div>' },
  { t: 'q', id: 'A7', src: 'Acid-base p.51–53, 61', core: true,
    q: 'A patient with severe COPD has a chronic PaCO₂ of <b>70 mmHg</b> (30 mmHg above normal). Assuming pure <b>chronic respiratory acidosis</b>, what is the expected plasma [HCO₃⁻]?',
    o: ['~34.5 mmol/L (24 + 3.5 × 3)', '~27.0 mmol/L (24 + 1 × 3)', '~18.0 mmol/L (24 − 2 × 3)', '~9.0 mmol/L (24 − 5 × 3)', '~24.0 mmol/L (unchanged)'], a: 0,
    ex: 'In chronic respiratory acidosis, [HCO₃⁻] rises by 3.5 mmol/L (3–4 mmol/L) for every 10 mmHg rise in PaCO₂: 24 + 3.5 × ((70 − 40)/10) = 24 + 10.5 = 34.5 mmol/L. In acute respiratory acidosis it would rise by only 1 × 3 = 3 mmol/L to 27 mmol/L.' },
  { t: 'q', id: 'A8', src: 'Acid-base p.60–61', core: true,
    q: 'A patient with diabetic ketoacidosis has a plasma [HCO₃⁻] of <b>12 mmol/L</b> (a decrease of 12 mmol/L from 24 mmol/L). What is the expected compensated <b>PaCO₂</b>?',
    o: ['~25–26 mmHg', '~40 mmHg', '~49 mmHg', '~12 mmHg', '~55 mmHg'], a: 0,
    ex: 'Using the lecture ratio (↓PaCO₂ = 1.25 × Δ[HCO₃⁻] = 1.25 × 12 = 15 mmHg → 40 − 15 = 25 mmHg) or Winter’s formula (PaCO₂ = 1.5 × 12 + 8 ± 2 = 26 ± 2 mmHg), expected PaCO₂ is ~25–26 mmHg.' },
  { t: 'tf', id: 'A9', src: 'Acid-base p.47, 61',
    q: 'In uncomplicated acid-base disorders, physiologic compensation normally overcorrects arterial pH past 7.40 in the opposite direction.', a: false,
    ex: 'False. Compensation brings pH back toward normal (7.35–7.45) but does not overcorrect it.' },

  { t: 'c', id: 'A-C4', title: 'Plasma anion gap: HAGMA vs NAGMA and urine anion gap', src: 'Acid-base p.64–70',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Plasma Anion Gap (AG)</b> = [Na⁺] − ([Cl⁻] + [HCO₃⁻]); normal range in the handout is {{12 ± 4}} mEq/L ({{8–16}} mEq/L, where unmeasured anions exceed unmeasured cations, largely plasma {{albumin}}).</li>' +
      '<li><b>High anion gap metabolic acidosis (HAGMA)</b> (normochloremic; acid HA adds unmeasured A⁻ that replaces HCO₃⁻): <b>{{KUSMALE}}</b> — {{Ketoacidosis}} (DKA, starvation, alcoholic), {{Uremia}}, {{Salicylate}}, {{Methanol}}, Aldehyde/alcohol, {{Lactic acidosis}}, and Ethylene glycol.</li>' +
      '<li><b>Normal anion gap metabolic acidosis (NAGMA)</b> (hyperchloremic; lost HCO₃⁻ is replaced 1:1 by Cl⁻): severe {{diarrhea}}, renal tubular acidosis (RTA), or {{acetazolamide}} (carbonic anhydrase inhibition).</li>' +
      '<li><b>Urine Anion Gap (UAG)</b> = ([Na⁺]ᵤ + [K⁺]ᵤ) − [Cl⁻]ᵤ estimates urinary NH₄⁺: a <b>{{negative}}</b> UAG (&lt; −20 mEq/L) shows intact renal NH₄⁺ excretion (GI HCO₃⁻ loss), whereas a <b>positive</b> UAG (&gt; +20 mEq/L) indicates impaired distal acid excretion (RTA).</li></ul></div>' +
      CVS.fig('acid-ag', 'Electrolyte Gamblegrams comparing Normal, High Anion Gap (normochloremic), and Normal Anion Gap (hyperchloremic) metabolic acidosis.', 'acid', 66) + '</div>' },
  { t: 'q', id: 'A10', src: 'Acid-base p.66–68', core: true,
    q: 'Which condition causes a <b>normal anion gap (hyperchloremic) metabolic acidosis</b> rather than a high anion gap metabolic acidosis?',
    o: ['Severe secretory diarrhea or renal tubular acidosis (RTA)', 'Diabetic ketoacidosis (DKA)', 'Lactic acidosis from circulatory shock', 'Methanol or ethylene glycol poisoning', 'Advanced uremia (renal failure)'], a: 0,
    ex: 'Diarrhea and RTA lose HCO₃⁻ directly and replace it with Cl⁻ (hyperchloremic normal anion gap metabolic acidosis). DKA, lactic acidosis, methanol/ethylene glycol poisoning, salicylate toxicity, and uremia accumulate unmeasured organic/inorganic anions (HAGMA, KUSMALE).' },
  { t: 'q', id: 'A11', src: 'Acid-base p.69',
    q: 'A patient has a normal anion gap metabolic acidosis. Urine electrolytes show [Na⁺]ᵤ = 30, [K⁺]ᵤ = 20, and [Cl⁻]ᵤ = 85 mEq/L (<b>UAG = −35 mEq/L</b>). What is the most likely cause?',
    o: ['Gastrointestinal HCO₃⁻ loss from diarrhea (with intact renal NH₄⁺ excretion)', 'Distal renal tubular acidosis (type 1 RTA)', 'Hypoaldosteronism (type 4 RTA)', 'Diabetic ketoacidosis', 'Lactic acidosis'], a: 0,
    ex: 'A strongly negative UAG means urinary Cl⁻ far exceeds (Na⁺ + K⁺) because abundant unmeasured NH₄⁺ is being excreted with Cl⁻—proving the kidneys are responding appropriately to extrarenal HCO₃⁻ loss (diarrhea).' },

  { t: 'c', id: 'A-C5', title: 'The 6-step ABG interpretation algorithm and clinical cases', src: 'Acid-base p.71–87',
    html: '<div class="stack"><ul class="pts">' +
      '<li><b>Step 1 — Check internal consistency</b>: [H⁺] ≈ 24 × PaCO₂ / [HCO₃⁻]. <b>Step 2 — Acidemia vs alkalemia</b>: pH &lt; {{7.35}} is acidemia; pH &gt; {{7.45}} is alkalemia.</li>' +
      '<li><b>Step 3 — Identify primary process</b>: if PaCO₂ and pH move in {{opposite}} directions, it is respiratory; if [HCO₃⁻] and pH move in the {{same}} direction, it is metabolic.</li>' +
      '<li><b>Step 4 — Calculate expected compensation</b>: if actual PaCO₂ or [HCO₃⁻] falls outside the expected compensation range, a concurrent disorder is present.</li>' +
      '<li><b>Step 5 — Calculate AG</b> ([Na⁺] − ([Cl⁻] + [HCO₃⁻]), normal {{12 ± 4}} mEq/L). <b>Step 6 — If AG is elevated, check {{delta}} ratio (ΔAG / Δ[HCO₃⁻])</b>: compare (AG − 12) against (24 − [HCO₃⁻]) to detect a hidden concurrent alkalemic process (if [HCO₃⁻] is higher than expected) or concurrent NAGMA (if [HCO₃⁻] is lower than expected).</li></ul>' +
      '<div class="tblwrap"><table class="tbl"><thead><tr><th>Handout case (p.78–87)</th><th>ABG &amp; electrolytes</th><th>Complete diagnosis</th></tr></thead><tbody>' +
      '<tr><td>Case 1 (p.78) · Vomiting 1 wk</td><td>pH 7.50, PaCO₂ 48, HCO₃⁻ 37, Na⁺ 135, Cl⁻ 86 (AG 12)</td><td>{{Metabolic alkalosis}} with respiratory compensation (expected PaCO₂ ≈ 49.75 mmHg)</td></tr>' +
      '<tr><td>Case 2 (p.80) · Pneumonia &amp; sepsis</td><td>pH 7.12, PaCO₂ 40, HCO₃⁻ 12, Na⁺ 140, Cl⁻ 103 (AG {{25 mEq/L}})</td><td>HAGMA + {{respiratory acidosis}} (expected PaCO₂ ≈ 25 mmHg, actual is 40)</td></tr>' +
      '<tr><td>Case 3 (p.82) · Chronic renal disease + vomiting</td><td>pH 7.40, PaCO₂ 40, HCO₃⁻ 24, Na⁺ 145, Cl⁻ 100 (AG {{21 mEq/L}})</td><td>{{Mixed}} HAGMA + vomiting-induced alkalosis (normal pH/HCO₃⁻ hides elevated AG)</td></tr>' +
      '<tr><td>Case 4 (p.84) · Acute bronchitis on COPD</td><td>pH 7.26, PaCO₂ 70, HCO₃⁻ 31, Na⁺ 137, Cl⁻ 95 (AG 11)</td><td>{{Acute-on-chronic}} hypercapnic acidosis (HCO₃⁻ 31 lies between acute 27 and chronic 34.5)</td></tr>' +
      '<tr><td>Case 5 (p.86) · Diarrhea 5 d</td><td>pH 7.25, PaCO₂ 28, HCO₃⁻ 12, Na⁺ 140, Cl⁻ 116 (AG 12)</td><td>{{Hyperchloremic}} (normal AG) metabolic acidosis with respiratory compensation</td></tr></tbody></table></div></div>' },
  { t: 'q', id: 'A12', src: 'Acid-base p.80–81', core: true,
    q: 'A septic patient with pneumonia has: <b>pH 7.12, PaCO₂ 40 mmHg, [HCO₃⁻] 12 mmol/L, Na⁺ 140 mmol/L, Cl⁻ 103 mmol/L</b>. What is the complete acid-base diagnosis?',
    o: ['Mixed high anion gap metabolic acidosis and respiratory acidosis', 'Simple high anion gap metabolic acidosis with full respiratory compensation', 'Simple normal anion gap metabolic acidosis (PaCO₂ is normal at 40 mmHg)', 'Mixed metabolic alkalosis and respiratory alkalosis', 'Acute respiratory acidosis with renal compensation'], a: 0,
    ex: 'pH 7.12 and [HCO₃⁻] 12 mmol/L show metabolic acidosis with AG = 140 − (103 + 12) = 25 mEq/L (HAGMA). Expected compensated PaCO₂ is ~25 mmHg (40 − 1.25 × 12). Because actual PaCO₂ is 40 mmHg (too high for [HCO₃⁻] = 12), the patient also has superimposed respiratory acidosis from ventilatory failure.' },
  { t: 'q', id: 'A13', src: 'Acid-base p.82–83', core: true,
    q: 'A patient with chronic kidney disease and 4 days of vomiting has: <b>pH 7.40, PaCO₂ 40 mmHg, [HCO₃⁻] 24 mmol/L, Na⁺ 145 mmol/L, Cl⁻ 100 mmol/L</b>. Why is this ABG abnormal despite a normal pH, PaCO₂, and [HCO₃⁻]?',
    o: ['The anion gap is 21 mEq/L (ΔAG = +9), revealing a mixed high anion gap metabolic acidosis and metabolic alkalosis', 'The patient has pure chronic respiratory alkalosis', 'The anion gap is 5 mEq/L, indicating severe hypoalbuminemia only', 'Normal pH, PaCO₂, and [HCO₃⁻] rule out all acid-base disorders', 'The patient has pure hyperchloremic normal anion gap metabolic acidosis'], a: 0,
    ex: 'Always calculate the anion gap even when pH, PaCO₂, and [HCO₃⁻] look normal! Here AG = 145 − (100 + 24) = 21 mEq/L (elevated by 9 mEq/L above 12). Without a concurrent disorder, [HCO₃⁻] should have fallen to ~15 mmol/L; the fact that [HCO₃⁻] is 24 mmol/L proves a concurrent metabolic alkalosis from vomiting.' },
  { t: 'q', id: 'A14', src: 'Acid-base p.84–85',
    q: 'A COPD patient admitted with acute bronchitis has <b>pH 7.26, PaCO₂ 70 mmHg, [HCO₃⁻] 31 mmol/L, Na⁺ 137, Cl⁻ 95 (AG 11)</b>. Why is this classified as <b>acute-on-chronic respiratory acidosis</b>?',
    o: ['For PaCO₂ = 70 mmHg, [HCO₃⁻] = 31 mmol/L lies between the acute expected value (27 mmol/L) and the chronic expected value (34.5 mmol/L)', 'The anion gap of 11 mEq/L proves concurrent lactic acidosis', 'pH is above 7.40 due to renal overcompensation', '[HCO₃⁻] is lower than 24 mmol/L', 'PaCO₂ decreases during acute bronchitis'], a: 0,
    ex: 'For a 30 mmHg rise in PaCO₂ (from 40 to 70), pure acute respiratory acidosis raises [HCO₃⁻] to 24 + 3 = 27 mmol/L, while pure chronic respiratory acidosis raises [HCO₃⁻] to 24 + 10.5 = 34.5 mmol/L. An intermediate [HCO₃⁻] of 31 mmol/L with acidemia (pH 7.26) indicates acute CO₂ retention superimposed on chronic CO₂ retention.' }
]});

/* Section S: RS Under Stress (681119-1 RS_under stress_NS2025_handout.pdf, 16 slides). */
CVS.add({ id: 'S', short: 'RS under stress', title: 'Respiratory System Under Stress', kind: 'Lecture',
  blurb: 'Cardiopulmonary adaptations to exercise, high altitude hypoxia and acclimatization, hyperbaric diving and decompression sickness, NREM vs REM sleep physiology, and the fetal-to-neonatal respiratory transition at birth.',
  items: [
  { t: 'c', id: 'S-C1', title: 'Exercise: energy systems, ventilatory threshold, and blood gases', src: 'Stress p.2–5',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li>Three muscle ATP sources: <b>{{phosphagen}}</b> system (ATP + phosphocreatine, {{8–10 seconds}} burst), <b>{{glycogen–lactic acid}}</b> system (oxygen-independent glycolysis, {{1.3–1.6 minutes}}), and <b>{{oxidative}}</b> system (mitochondrial phosphorylation, unlimited duration while fuel lasts).</li>' +
      '<li>During <b>moderate steady-state exercise</b>, alveolar ventilation increases linearly with O₂ consumption and CO₂ production, so arterial <b>PaO₂, PaCO₂, and pH remain {{normal}}</b> (while venous PO₂ falls and muscle O₂ extraction rises with a {{rightward}} ODC shift from ↑H⁺, ↑CO₂, ↑temperature, and ↑2,3-BPG).</li>' +
      '<li>Above the <b>{{anaerobic}} (ventilatory) threshold</b> (~60% Wmax), lactic acid buffered by HCO₃⁻ generates extra non-metabolic CO₂; H⁺ stimulates {{carotid bodies}}, causing disproportionate hyperventilation that <b>lowers {{PaCO2}}</b> while arterial pH still drops.</li>' +
      '<li>Cardiac output recruits apical capillaries (making V/Q more {{uniform}} and raising diffusing capacity ~3-fold), and endurance training increases <b>VO₂max</b> primarily by increasing {{stroke volume}} and maximal cardiac output rather than lung volumes.</li></ul></div>' +
      CVS.fig('stress-exercise', 'Time course and cardiovascular/ventilatory responses across moderate and heavy exercise workloads.', 'stress', 3) + '</div>' },
  { t: 'q', id: 'S1', src: 'Stress p.3–4', core: true,
    q: 'During <b>moderate steady-state aerobic exercise</b> (below the anaerobic threshold) in a healthy adult, how do arterial <b>PaO₂, PaCO₂, and pH</b> change compared with rest?',
    o: ['PaO₂, PaCO₂, and arterial pH all remain essentially unchanged near normal resting values', 'PaO₂ falls below 60 mmHg while PaCO₂ rises above 55 mmHg', 'PaCO₂ rises markedly while arterial pH becomes severely alkalotic', 'PaO₂ doubles to 200 mmHg while PaCO₂ falls to 15 mmHg', 'Mixed venous PO₂ rises while arterial PaO₂ falls'], a: 0,
    ex: 'Below the anaerobic threshold, alveolar ventilation rises in exact proportion to O₂ uptake and CO₂ production, keeping arterial PaO₂ (~95–100 mmHg), PaCO₂ (~40 mmHg), and pH (~7.40) virtually constant. Above the anaerobic threshold, lactic acidosis triggers hyperventilation that lowers PaCO₂.' },
  { t: 'q', id: 'S2', src: 'Stress p.2–3',
    q: 'Which energy system provides the dominant ATP supply for an all-out <b>100-meter sprint lasting ~8–10 seconds</b>?',
    o: ['Phosphagen system (preformed ATP and phosphocreatine)', 'Aerobic β-oxidation of free fatty acids', 'Glycogen–lactic acid system (peaking at 1.3–1.6 minutes)', 'Hepatic gluconeogenesis from alanine', 'Renal glutamine oxidation'], a: 0,
    ex: 'The phosphagen system (cellular ATP + phosphocreatine) supplies maximal power for 8–10 seconds (e.g., 100-m dash); the glycogen–lactic acid system sustains 1.3–1.6 minutes (e.g., 400–800 m run); the aerobic system sustains prolonged endurance events.' },
  { t: 'tf', id: 'S3', src: 'Stress p.4–5',
    q: 'Above the anaerobic (ventilatory) threshold, buffering of lactic acid by plasma HCO₃⁻ generates extra CO₂ and H⁺, driving a disproportionate increase in minute ventilation and a fall in arterial PaCO₂.', a: true,
    ex: 'True. Lactic acid + HCO₃⁻ → lactate⁻ + H₂CO₃ → H₂O + CO₂; both the extra CO₂ and arterial H⁺ (via peripheral chemoreceptors) drive hyperventilation, so VE/VO₂ rises steeply and PaCO₂ falls below 40 mmHg.' },

  { t: 'c', id: 'S-C2', title: 'High altitude: acute hypoxia, acclimatization, and altitude illness', src: 'Stress p.7–10',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li>At high altitude, fractional O₂ remains {{21%}}, but lower <b>{{barometric pressure}}</b> reduces inspired PO₂ and alveolar PAO₂ (e.g. Mt. Everest summit P_B ≈ {{253 mmHg}}).</li>' +
      '<li><b>Acute response</b>: arterial hypoxia (PaO₂ &lt; 60 mmHg) stimulates {{peripheral chemoreceptors}} (carotid bodies) → hyperventilation → ↓PaCO₂ and <b>{{respiratory alkalosis}}</b>, which initially brakes central respiratory drive.</li>' +
      '<li><b>Acclimatization (days to weeks)</b>: kidneys excrete {{HCO3-}} (accelerated by {{acetazolamide}}, a carbonic anhydrase inhibitor) to normalize CSF/blood pH and restore ventilatory drive; RBC {{2,3-BPG}} rises (shifting ODC right at moderate altitude, whereas extreme hypocapnic alkalemia shifts ODC left to aid pulmonary O₂ loading); <b>{{HIF}} (hypoxia-inducible factor)</b> stimulates {{erythropoietin}} (polycythemia) and VEGF (tissue capillarity).</li>' +
      '<li>Global <b>hypoxic pulmonary vasoconstriction (HPV)</b> raises pulmonary artery pressure, risking right ventricular hypertrophy and <b>{{HAPE}}</b> (high-altitude pulmonary edema, non-cardiogenic patchy edema treated with descent, O₂, and {{nifedipine}}), alongside <b>AMS</b> and <b>HACE</b> (treated with descent, O₂, and dexamethasone).</li></ul></div>' +
      CVS.fig('stress-altitude', 'Physiological cascade and multi-organ acclimatization to hypobaric hypoxia at high altitude.', 'stress', 10) + '</div>' },
  { t: 'q', id: 'S4', src: 'Stress p.8–10', core: true,
    q: 'When an unacclimatized lowlander ascends rapidly to 4,000 m, what initially <b>blunts (brakes)</b> the hypoxic increase in minute ventilation during the first few hours?',
    o: ['Hypocapnia and respiratory alkalosis inhibiting central chemoreceptors', 'Increased renal HCO₃⁻ excretion causing metabolic alkalosis', 'Immediate polycythemia suppressing carotid body glomus cells', 'Global pulmonary vasodilation lowering pulmonary artery pressure', 'Elevated 2,3-BPG directly inhibiting the phrenic nerve'], a: 0,
    ex: 'Peripheral chemoreceptors responds to low PaO₂ by driving hyperventilation, which blows off CO₂. The resulting fall in PaCO₂ and rise in CSF pH inhibit central chemoreceptors until renal HCO₃⁻ excretion (and CSF HCO₃⁻ transport) corrects the alkalosis over 2–5 days.' },
  { t: 'q', id: 'S5', src: 'Stress p.9–10', core: true,
    q: 'What is the primary pathophysiological mechanism of <b>High-Altitude Pulmonary Edema (HAPE)</b>?',
    o: ['Uneven, exaggerated hypoxic pulmonary vasoconstriction causing high capillary hydrostatic pressure and stress failure in overperfused regions', 'Left ventricular myocardial infarction with elevated pulmonary capillary wedge pressure', 'Severe hypercapnic acidosis causing systemic vasodilation', 'Decreased plasma oncotic pressure from acute hepatic failure', 'Bacterial infection of the lower respiratory tract'], a: 0,
    ex: 'Global alveolar hypoxia causes patchy, heterogeneous hypoxic pulmonary vasoconstriction (HPV). Regions with less constriction receive excessive blood flow under high pulmonary artery pressure, causing high capillary hydrostatic pressure and non-cardiogenic pulmonary edema.' },
  { t: 'tf', id: 'S6', src: 'Stress p.8–9',
    q: 'Prophylactic acetazolamide speeds up high-altitude acclimatization by inhibiting renal carbonic anhydrase, promoting urinary HCO₃⁻ excretion and counteracting respiratory alkalosis.', a: true,

  "R-C2": [
    "<b>Central chemoreceptors (ตัวรับสารเคมีส่วนกลาง)</b> อยู่บริเวณผิวด้านหน้าส่วนล่าง (ventral surface) ของ medulla ใกล้จุดออกของเส้นประสาทสมองคู่ที่ 9 และ 10 เป็นตัวรับที่<b>สำคัญที่สุดในการควบคุมการหายใจ</b> (รับผิดชอบประมาณ <b>70%</b> ของการตอบสนองต่อภาวะ CO<sub>2</sub> สูง) โดยตอบสนองต่อการเปลี่ยนแปลงของค่า <b>pH (ความเข้มข้นของ H<sup>+</sup>) ในน้ำไขสันหลัง (CSF) และของเหลวนอกเซลล์สมอง (ECF)</b>",
    "<b>กลไกผ่านแนวกั้นเลือดและสมอง (Blood-brain barrier)</b> แนวกั้นเลือดและสมองยอมให้ก๊าซ <b>CO<sub>2</sub> แพร่ผ่านได้อย่างอิสระ</b> แต่ไม่ยอมให้ H<sup>+</sup> จากเลือดผ่านได้ง่าย เมื่อ PaCO<sub>2</sub> ในเลือดสูงขึ้น CO<sub>2</sub> จะแพร่เข้าสู่ CSF (ซึ่งมีค่า <b>pH ปกติเท่ากับ 7.32</b>) แล้วทำปฏิกิริยากับน้ำได้กรดคาร์บอนิกและแตกตัวให้ H<sup>+</sup> เนื่องจาก <b>CSF มีความเข้มข้นของโปรตีนต่ำมาก จึงแทบไม่มีตัวบัฟเฟอร์</b> ค่า pH ใน CSF จึงลดลงอย่างรวดเร็วและไปกระตุ้น central chemoreceptors ให้สั่ง DRG เกิด hyperventilation (ส่วนระดับไบคาร์บอเนต HCO<sub>3</sub><sup>&minus;</sup> ใน CSF ถูกควบคุมและปรับเปลี่ยนได้โดย <b>choroid plexus</b>)",
    "<b>Peripheral chemoreceptors (ตัวรับสารเคมีส่วนปลาย)</b> มี 2 ตำแหน่ง คือ <b>Carotid bodies</b> ที่ง่ามแยกของหลอดเลือดแดง common carotid (ส่งสัญญาณผ่าน <b>CN IX / glossopharyngeal nerve</b>) และ <b>Aortic bodies</b> รอบโค้งหลอดเลือดแดงใหญ่ aortic arch (ส่งสัญญาณผ่าน <b>CN X / vagus nerve</b>) เนื้อเยื่อเหล่านี้มีเลือดมาเลี้ยงสูงมากและตอบสนองได้<b>เร็วกว่า</b>ตัวรับส่วนกลาง (รับผิดชอบอีกประมาณ 30% ของแรงขับจาก CO<sub>2</sub>)",
    "<b>สิ่งกระตุ้น Peripheral chemoreceptors และบทบาทในคลินิก</b> ตัวรับที่ carotid body ไวต่อทั้ง <b>PaO<sub>2</sub> ที่ลดลง, PaCO<sub>2</sub> ที่เพิ่มขึ้น และ pH ในเลือดที่ลดลง (H<sup>+</sup> สูงขึ้น)</b> โดยการตอบสนองต่อ PaO<sub>2</sub> เป็นกราฟไม่เชิงเส้น (nonlinear) คือแทบไม่ตอบสนองในภาวะออกซิเจนปกติ แต่จะพุ่งสูงขึ้นเมื่อ PaO<sub>2</sub> ต่ำกว่า 60 mmHg และ<b>ตอบสนองสูงสุดเมื่อ PaO<sub>2</sub> ต่ำกว่า 50 mmHg</b> หากผู้ป่วยได้รับการผ่าตัดเอา carotid body ออกทั้งสองข้าง (bilateral carotid body resection) จะ<b>สูญเสียการตอบสนองต่อภาวะพร่องออกซิเจน (hypoxic ventilatory drive) ไปอย่างสมบูรณ์</b> ส่วนในภาวะกรดเมตาบอลิก (metabolic acidosis) ที่ H<sup>+</sup> ในเลือดสูงโดยไม่ขึ้นกับ PaCO<sub>2</sub> จะกระตุ้น <b>carotid body โดยตรง (ไม่ผ่าน aortic body)</b> ทำให้หายใจหอบลึกที่เรียกว่า <b>Kussmaul breathing</b>",
    "<b>กลไกระดับเซลล์ของ Glomus cell (Type I cell)</b> ใน carotid body มีเซลล์รับความรู้สึกคือ Type I (glomus) cell และเซลล์ค้ำจุนคือ Type II (sustentacular) cell บนเยื่อหุ้มเซลล์ของ glomus cell มีช่อง <b>O<sub>2</sub>-sensitive K<sup>+</sup> channels</b> เมื่อค่า PO<sub>2</sub> ในเลือดแดงลดลง ช่อง K<sup>+</sup> นี้จะถูกยับยั้ง (ปิด) ทำให้ K<sup>+</sup> ไหลออกจากเซลล์ลดลง เกิด <b>membrane depolarization (&Delta;V<sub>m</sub>)</b> ไปเปิดช่อง <b>voltage-gated Ca<sup>2+</sup> channels</b> ให้ Ca<sup>2+</sup> ไหลเข้าสู่เซลล์ แล้วกระตุ้นการหลั่งสารสื่อประสาท (เช่น <b>ATP และ acetylcholine</b>) ไปกระตุ้นใยประสาทรับความรู้สึกของ CN IX"
  ],
  "R-C3": [
    "<b>1. Pulmonary stretch receptors (Slowly adapting)</b> อยู่ในชั้น<b>กล้ามเนื้อเรียบของหลอดลม (airway smooth muscle)</b> ส่งสัญญาณขึ้นไปตามเส้นประสาทเวกัส (CN X) ชนิด<b>มีไมอีลิน (myelinated fibers)</b> ตอบสนองต่อการยืดขยายของปอดอย่างต่อเนื่อง ทำให้เกิด <b>Hering-Breuer inflation reflex</b> ซึ่งยับยั้งการหายใจเข้าและทำให้<b>ความถี่ของการหายใจช้าลงโดยการยืดเวลาหายใจออกให้ยาวขึ้น</b> หากตัดเส้นประสาทเวกัสทั้งสองข้าง (bilateral vagotomy) ในสัตว์ทดลองจะทำให้หายใจช้าและลึก แต่ในผู้ใหญ่ที่ตื่นอยู่ การบล็อกเส้นประสาทเวกัสชั่วคราวไม่เปลี่ยนอัตราหรือปริมาตรการหายใจปกติ (รีเฟล็กซ์นี้มีความสำคัญใน<b>ทารกแรกเกิด</b>)",
    "<b>2. Irritant receptors (Rapidly adapting pulmonary stretch receptors)</b> แทรกอยู่ระหว่าง<b>เซลล์เยื่อบุทางเดินหายใจ (airway epithelial cells)</b> ส่งสัญญาณผ่านเส้นใย<b>มีไมอีลิน</b>ของ CN X เช่นกัน ถูกกระตุ้นโดยก๊าซพิษ ควันบุหรี่ ฝุ่นละออง ลมเย็น และสาร <b>histamine</b> ที่หลั่งออกมา ผลของรีเฟล็กซ์คือทำให้เกิด<b>หลอดลมตีบ (bronchoconstriction), อาการไอ และหายใจแรงขึ้น (hyperpnea)</b> ซึ่งมีบทบาทสำคัญในการเกิดหลอดลมตีบในผู้ป่วย<b>โรคหืด (asthma attacks)</b>",
    "<b>3. J receptors (Juxtacapillary receptors)</b> เป็นปลายประสาทของเส้นใยเวกัสชนิด<b>ไม่มีไมอีลิน (nonmyelinated C-fibers)</b> ที่นำสัญญาณช้า อยู่ใน<b>ผนังถุงลม (alveolar walls)</b> ชิดกับหลอดเลือดฝอยปอด และได้รับเลือดเลี้ยงจาก<b>ระบบไหลเวียนเลือดปอด (pulmonary circulation)</b> ถูกกระตุ้นอย่างรวดเร็วเมื่อมีสารเคมีในหลอดเลือดปอด หรือเมื่อหลอดเลือดฝอยปอดคั่งและมีของเหลวเพิ่มขึ้นในเนื้อเยื่อเกี่ยวพันของผนังถุงลม เช่น ในผู้ป่วย<b>ภาวะหัวใจซ้ายวาย (left-sided heart failure)</b> หรือโรคเนื้อเยื่อปอดอักเสบ (interstitial lung disease) ทำให้เกิดการ<b>หายใจเร็วและตื้น (rapid, shallow breathing)</b> หลอดลมตีบ และหลั่งมูก (หากถูกกระตุ้นรุนแรงจะทำให้หยุดหายใจ apnea)",
    "<b>4. Bronchial C-fibers</b> เป็นเส้นใยประสาทชนิดไม่มีไมอีลินในผนังหลอดลมที่ได้รับเลือดเลี้ยงจาก<b>หลอดเลือดแดงหลอดลม (bronchial circulation)</b> ตอบสนองอย่างรวดเร็วต่อสารเคมีที่ฉีดเข้าสู่ระบบไหลเวียนหลอดลม ให้ผลรีเฟล็กซ์คล้าย J receptors คือ หายใจเร็วตื้น หลอดลมตีบ และเพิ่มการหลั่งมูก",
    "<b>5. ตัวรับความรู้สึกอื่นๆ นอกปอด (Other receptors)</b> ได้แก่ (1) <b>ตัวรับในจมูกและทางเดินหายใจส่วนต้น</b> ทำให้เกิดการจาม ไอ หลอดลมตีบ และกล่องเสียงหดเกร็ง (laryngeal spasm); (2) <b>Joint and muscle receptors</b> จากแขนขาที่เคลื่อนไหว ช่วยกระตุ้นการหายใจในช่วงเริ่มต้นของการออกกำลังกาย; (3) <b>Gamma system (muscle spindles)</b> ในกล้ามเนื้อระหว่างซี่โครงและกะบังลม รับรู้การยืดยาวของกล้ามเนื้อ; (4) <b>Arterial baroreceptors</b> เมื่อความดันโลหิตแดงสูงขึ้นจะเกิด<b>รีเฟล็กซ์กดการหายใจ (reflex hypoventilation)</b>; และ (5) <b>ความปวดและอุณหภูมิ</b> ความปวดมักทำให้หยุดหายใจชั่วครู่ตามด้วยหายใจเร็วขึ้น ส่วนการเพิ่มอุณหภูมิผิวหนังทำให้เกิด hyperventilation"
  ],
  "R-C4": [
    "<b>การตอบสนองต่อคาร์บอนไดออกไซด์ (Ventilatory response to CO<sub>2</sub>)</b> ในสภาวะปกติ <b>PaCO<sub>2</sub> ในเลือดแดงเป็นตัวกระตุ้นการหายใจที่สำคัญที่สุด</b>และถูกควบคุมไว้อย่างเข้มงวด (ส่วนใหญ่ ~70% มาจาก central chemoreceptors และอีก ~30% มาจาก peripheral chemoreceptors ซึ่งตอบสนองเร็วกว่า) กราฟความสัมพันธ์ระหว่างอัตราระบายอากาศกับ PCO<sub>2</sub> เป็นเส้นตรง โดยหากมีภาวะ<b>พร่องออกซิเจน (PaO<sub>2</sub> ต่ำลง เช่น 47 mmHg) ร่วมด้วย การตอบสนองต่อ CO<sub>2</sub> จะถูกขยายให้แรงขึ้น (ความชันเพิ่มขึ้นและเลื่อนไปทางซ้าย)</b> ในทางตรงข้าม การนอนหลับและอายุที่มากขึ้นจะลดการตอบสนองลง",
    "<b>การตอบสนองต่อออกซิเจน (Ventilatory response to PO<sub>2</sub>)</b> เกิดจากทำงานของ <b>peripheral chemoreceptors เท่านั้น</b> เมื่อระดับ PCO<sub>2</sub> ปกติ (ประมาณ 36 mmHg) การลดลงของ PO<sub>2</sub> จะแทบไม่กระตุ้นการหายใจเพิ่มขึ้นเลย จนกว่า <b>PaO<sub>2</sub> จะลดลงมาอยู่ที่ประมาณ 60 mmHg หรือต่ำกว่า</b> กราฟจึงจะพุ่งสูงขึ้นอย่างรวดเร็ว กลไกนี้จึงมีความสำคัญมากในที่สูง (high altitude) และในผู้ป่วยโรคปอดเรื้อรังที่มีภาวะพร่องออกซิเจนเรื้อรัง",
    "<b>ภาวะ CO<sub>2</sub> คั่งเรื้อรัง และกลไกการเกิด CO<sub>2</sub> narcosis (หน้า 44–45)</b> ในผู้ป่วยโรคปอดเรื้อรังที่มี CO<sub>2</sub> คั่งเรื้อรัง สมองจะปรับเพิ่ม HCO<sub>3</sub><sup>&minus;</sup> ใน CSF จน pH ใน CSF กลับมาใกล้เคียงปกติ ทำให้ central chemoreceptors ไม่ค่อยตอบสนองต่อ CO<sub>2</sub> และผู้ป่วยต้องพึ่งพา <b>hypoxic drive จาก peripheral chemoreceptors</b> เป็นหลัก หากให้ออกซิเจนมากเกินไปจะเกิดภาวะ <b>CO<sub>2</sub> narcosis (acute on top respiratory acidosis)</b> จาก 2 กลไกหลักตามสไลด์หน้า 45 คือ: (1) <b>ลด hypoxic ventilatory response</b> ทำให้ผู้ป่วยหายใจแผ่วลง (<b>hypoventilation</b>) และ (2) <b>ลด hypoxic pulmonary vasoconstriction (HPV)</b> ทำให้เลือดไหลไปเลี้ยงถุงลมที่ระบายอากาศไม่ดีมากขึ้น เกิด <b>V/Q mismatch เพิ่มขึ้น</b> ส่งผลให้ CO<sub>2</sub> คั่งในเลือดสูงขึ้นอย่างรวดเร็ว",
    "<b>การตอบสนองต่อค่า pH (Ventilatory response to pH)</b> ในภาวะกรดเมตาบอลิก (metabolic acidosis) ซึ่งมีค่า pH ต่ำและ PCO<sub>2</sub> ต่ำ จะเกิดการกระตุ้นการหายใจผ่าน <b>peripheral chemoreceptors ที่ carotid bodies เท่านั้น (ไม่ผ่าน aortic bodies)</b> และหากภาวะกรดรุนแรงมากจึงอาจกระตุ้น central chemoreceptors ร่วมด้วย",
    "<b>การตอบสนองต่อการออกกำลังกาย (Exercise) และที่สูง (High altitude)</b> ขณะออกกำลังกายระดับปานกลาง อัตราการหายใจและประสิทธิภาพการแลกเปลี่ยนก๊าซเพิ่มขึ้นอย่างมากจากคำสั่งของ cortex, สัญญาณจากแขนขา (joint/muscle receptors) และอุณหภูมิร่างกายที่สูงขึ้น ทำให้ค่า <b>PaO<sub>2</sub>, PaCO<sub>2</sub> และ pH ในเลือดแดงยังคงปกติ</b> (ยกเว้นเมื่อออกกำลังกายหนักมากจนเกิด <b>lactic acidosis</b> จึงทำให้ pH ลดลง) ส่วนการขึ้นที่สูง ความดันบรรยากาศต่ำทำให้ PaO<sub>2</sub> ลดลง กระตุ้น peripheral chemoreceptors ให้เกิด hyperventilation &rarr; <b>respiratory alkalosis</b>, ร่างกายสร้าง 2,3-DPG เพิ่มขึ้น (กราฟ O<sub>2</sub>-Hb เลื่อนขวา), หลอดเลือดปอดหดตัวจาก hypoxia (ทำให้ความดันหลอดเลือดปอดสูงและหัวใจห้องขวาล่างโต) และไตสร้างฮอร์โมน <b>erythropoietin (EPO)</b> เพิ่มการสร้างเม็ดเลือดแดง"
  ],
  "R-C5": [
    "<b>Eupnea และ Sigh</b> <b>Eupnea</b> คือการหายใจเข้าออกปกติที่มีจังหวะและความลึกสม่ำเสมอ ส่วน <b>Sigh (การถอนหายใจ)</b> คือการสูดหายใจเข้าลึกกว่าปกติแทรกเป็นระยะตามด้วยช่วงหยุดสั้นๆ ซึ่งช่วยเปิดถุงลมที่แฟบให้ขยายตัวออก",
    "<b>Cheyne-Stokes respiration</b> มีลักษณะเป็นวงจรที่ความลึกของการหายใจ<b>ค่อยๆ เพิ่มขึ้นแล้วค่อยๆ ลดลง (crescendo–decrescendo / waxing and waning) สลับกับช่วงหยุดหายใจ (apnea)</b> อย่างเป็นจังหวะ พบในภาวะที่การไหลเวียนเลือดจากปอดไปสมองล่าช้า (เช่น หัวใจล้มเหลวเรื้อรัง) หรือมีความไวของศูนย์ควบคุมต่อ CO<sub>2</sub> สูงผิดปกติ (เช่น สมองบาดเจ็บ หรือนอนหลับบนที่สูง)",
    "<b>Apneusis</b> มีลักษณะเป็น<b>การหายใจเข้าลึกและค้างไว้เป็นเวลานาน (prolonged inspiratory plateau / cramp)</b> แล้วตามด้วยการหายใจออกสั้นๆ ที่ไม่สมบูรณ์ เกิดจากรอยโรคที่ทำลาย <b>pneumotaxic center ในพอนส์ส่วนบน</b> ร่วมกับการขาดสัญญาณยับยั้งจากเส้นประสาทเวกัส ทำให้ apneustic center ในพอนส์ส่วนล่างส่งสัญญาณกระตุ้นการหายใจเข้าอย่างต่อเนื่องโดยไม่มีตัวตัดจบ",

  function ensureVisible(el) {
    try {
      var r = el.getBoundingClientRect(), pg = document.querySelector('.pager'), bottom = window.innerHeight - (pg ? pg.offsetHeight : 0) - 24;
      if (r.bottom > bottom) window.scrollBy({ top: r.bottom - bottom, behavior: 'smooth' });
      else if (r.top < 80) window.scrollBy({ top: r.top - 80, behavior: 'smooth' });
    } catch (e) { }
  }
  function czNext(card, id) {
    var cz = czOf(card);
    for (var i = 0; i < cz.length; i++) {
      if (!cz[i].classList.contains('on')) { cz[i].classList.add('on'); flash(cz[i]); ensureVisible(cz[i]); czSave(card, id); return true; }
    }
    return false;
  }
  function czAll(card, id, on) { var cz = czOf(card); for (var i = 0; i < cz.length; i++) cz[i].classList.toggle('on', on); czSave(card, id); }

  /* ---------- figure zoom ---------- */
  var zoom = document.createElement('div');
  zoom.className = 'zoom'; zoom.hidden = true;
  zoom.setAttribute('role', 'dialog'); zoom.setAttribute('aria-label', 'Enlarged figure (click or press Esc to close)');
  zoom.innerHTML = '<div class="zbox"><div class="zpaper"><img alt=""></div><p class="zcap"></p></div>';
  document.body.appendChild(zoom);
  function openZoom(im) {
    var fig = im.closest('figure'), cap = fig ? fig.querySelector('figcaption') : null, zi = zoom.querySelector('img');
    zi.src = im.currentSrc || im.src; zi.alt = im.alt || '';
    zoom.querySelector('.zcap').innerHTML = cap ? cap.innerHTML : '';
    zoom.hidden = false;
  }
  function closeZoom() { zoom.hidden = true; }
  zoom.addEventListener('click', closeZoom);

  /* ---------- present mode ---------- */
  function setTabs(si) {
    var tabs = $('tabs').children;
    for (var i = 0; i < tabs.length; i++) tabs[i].setAttribute('aria-current', i === si ? 'true' : 'false');
  }
  function setHash(id) { try { if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id); } catch (e) { } }
  function updateReveal() {
    var it = seq[idx], rv = $('reveal'), q = isQ(it);
    if (it.t === 'c') {
      var cc = $('stage').querySelector('.concept'), n = czOf(cc).length, left = czLeft(cc);
      rv.disabled = !n;
      rv.textContent = !n ? 'Reveal' : left ? 'Reveal next \u00B7 ' + left + ' left' : 'Hide blanks';
      return;
    }
    rv.disabled = !q;
    rv.textContent = q && (state[it.id] || {}).rev ? 'Hide answer' : 'Reveal';
  }
  function renderStage() {
    var it = seq[idx];
    $('stage').innerHTML = it.t === 'intro' ? renderIntro() : it.t === 'sec' ? renderSec(it.si) : it.t === 'c' ? renderC(it) : renderQ(it, false);
    if (it.t === 'c') czApply($('stage').querySelector('.concept'), it.id);
    var si = secIndex(it);
    setTabs(si);
    if (si < 0) { $('pos').innerHTML = 'Start'; }
    else {
      var n = 0, k = 0;
      for (var i = 0; i < seq.length; i++) { if (secIndex(seq[i]) === si && seq[i].t !== 'sec') { n++; if (seq[i] === it) k = n; } }
      $('pos').innerHTML = S[si].short + ' &#183; ' + (it.t === 'sec' ? 'intro' : k + ' / ' + n) + (it.t === 'sec' ? '' : ' &#183; <span>' + it.id + '</span>');
    }
    $('progBar').style.width = (100 * idx / (seq.length - 1)) + '%';
    $('prev').disabled = idx === 0;
    $('next').disabled = idx === seq.length - 1;
    updateReveal();
    setHash(it.id);
    LS.set('pos', it.id);
    try { if (bc) bc.postMessage({ pos: it.id }); } catch (e) { }
  }
  function go(d) {
    var n = Math.max(0, Math.min(seq.length - 1, idx + d));
    if (n === idx) return;
    idx = n; renderStage();
    try { window.scrollTo(0, 0); } catch (e) { }
  }
  function gotoSec(si) {
    if (view === 'present') { var k = find('sec-' + S[si].id); if (k >= 0) { idx = k; renderStage(); try { window.scrollTo(0, 0); } catch (e) { } } }
    else { var h = document.querySelector('#b-' + S[si].id + ' > header'); if (h) h.scrollIntoView({ block: 'start' }); setTabs(si); }
  }
  function toggleReveal(id, card) {
    var st = state[id] = state[id] || {};
    st.rev = !st.rev;
    if (card) {
      card.classList.toggle('rev', st.rev);
      var b = card.querySelector('.bshow'); if (b) b.textContent = st.rev ? 'Hide answer' : 'Show answer';
    }
    if (view === 'present') updateReveal();
  }
  function resetItem(id) {
    state[id] = {};
    if (view === 'present') renderStage();
  }
  function selectOpt(it, v, card) {
    var st = state[it.id] = state[it.id] || {};
    if (st.rev) return;
    st.sel = v;
    var opts = card.querySelectorAll('.opt');
    for (var i = 0; i < opts.length; i++) {
      var ov = opts[i].getAttribute('data-v');
      var match = it.t === 'tf' ? (ov === 'true') === v : parseInt(ov, 10) === v;
      opts[i].classList.toggle('sel', match);
    }
  }
  function jumpTo(id) {
    if (!id) return false;
    var k = find(id);
    if (k < 0 && byId[id]) { coreOnly = false; $('coreOnly').checked = false; LS.set('core', false); buildSeq(); k = find(id); }
    if (k < 0) return false;
    idx = k;
    if (view !== 'present') setView('present'); else renderStage();
    return true;
  }

  /* ---------- browse mode ---------- */
  function renderBrowse() {
    var h = '';
    S.forEach(function (s, si) {
      h += '<section class="bsec" id="b-' + s.id + '"><header><div class="eyebrow"><span class="chip kind">' + s.kind + '</span><span class="id">Section ' + s.id + '</span></div><h2>' + s.title + '</h2><p>' + s.blurb + '</p></header>';
      s.items.forEach(function (it) { if (coreOnly && isQ(it) && !it.core) return; h += it.t === 'c' ? renderC(it) : renderQ(it, true); });
      h += '</section>';
    });
    $('blist').innerHTML = h;
    var cs = $('blist').querySelectorAll('.concept');
    for (var i = 0; i < cs.length; i++) czApply(cs[i], cs[i].getAttribute('data-id'));
    applySearch();
  }
  function applySearch() {
    var q = ($('q').value || '').trim().toLowerCase(), n = 0, tot = 0;
    var cards = $('blist').querySelectorAll('.card');
    for (var i = 0; i < cards.length; i++) {
      tot++;
      var show = !q || cards[i].textContent.toLowerCase().indexOf(q) >= 0;
      cards[i].hidden = !show;
      if (show) n++;
    }
    $('bcount').textContent = q ? n + ' of ' + tot + ' cards match' : tot + ' cards';
  }
  function setView(v) {
    view = v; LS.set('view', v);
    $('present').hidden = v !== 'present';
    $('browse').hidden = v !== 'browse';
    $('vPresent').setAttribute('aria-pressed', v === 'present' ? 'true' : 'false');
    $('vBrowse').setAttribute('aria-pressed', v === 'browse' ? 'true' : 'false');
    if (v === 'browse') {
      renderBrowse();
      var it = seq[idx], si = secIndex(it), el = null;
      if (it.t === 'c' || isQ(it)) el = document.querySelector('#blist [data-id="' + it.id + '"]');
      if (!el && si >= 0) el = document.querySelector('#b-' + S[si].id + ' > header');
      if (el) el.scrollIntoView({ block: 'start' });
      setTabs(Math.max(si, 0));
    } else {
      renderStage();
    }
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target : null;
    var z = t ? t.closest('.cz') : null;
    if (z) {
      var zc = z.closest('.concept');
      if (zc) { z.classList.toggle('on'); if (z.classList.contains('on')) flash(z); czSave(zc, zc.getAttribute('data-id')); }
      return;
    }
    var im = t ? t.closest('.scan img') : null;
    if (im) { openZoom(im); return; }
    var b = t ? t.closest('button') : null;
    if (!b) return;
    if (b.classList.contains('opt')) {
      var card = b.closest('.qcard'); if (!card) return;
      var it = byId[card.getAttribute('data-id')];
      var raw = b.getAttribute('data-v');
      selectOpt(it, it.t === 'tf' ? raw === 'true' : parseInt(raw, 10), card);
      if (!(state[it.id] || {}).rev) toggleReveal(it.id, card);
      return;
    }
    if (b.classList.contains('bshow')) { var c2 = b.closest('.qcard'); toggleReveal(c2.getAttribute('data-id'), c2); return; }
    if (b.classList.contains('station') || b.classList.contains('tab')) { gotoSec(parseInt(b.getAttribute('data-sec'), 10)); return; }
  });
  $('prev').addEventListener('click', function () { go(-1); });
  $('next').addEventListener('click', function () { go(1); });
  $('reveal').addEventListener('click', function () {
    var it = seq[idx];
    if (it.t === 'c') { var cc = $('stage').querySelector('.concept'); if (!czNext(cc, it.id)) czAll(cc, it.id, false); return; }
    if (isQ(it)) toggleReveal(it.id, $('stage').querySelector('.qcard'));
  });
  $('vPresent').addEventListener('click', function () { setView('present'); });
  $('vBrowse').addEventListener('click', function () { setView('browse'); });
  $('coreOnly').addEventListener('change', function () {
    var cur = seq[idx];
    coreOnly = this.checked; LS.set('core', coreOnly); buildSeq();
    var k = find(cur.id);
    if (k < 0) { var si = secIndex(cur); k = find('sec-' + S[Math.max(si, 0)].id); }
    idx = Math.max(0, k);
    if (view === 'present') renderStage(); else renderBrowse();
  });
  $('q').addEventListener('input', applySearch);
  $('showAll').addEventListener('change', function () { $('blist').classList.toggle('showall', this.checked); });
  $('themeBtn').addEventListener('click', function () {
    var root = document.documentElement, t = root.getAttribute('data-theme');
    var dark = t ? t === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var next = dark ? 'light' : 'dark';
    root.setAttribute('data-theme', next); LS.set('theme', next);
  });
  $('fsBtn').addEventListener('click', function () {
    try {
      if (document.fullscreenElement) { document.exitFullscreen(); }
      else if (document.documentElement.requestFullscreen) { var p = document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(function () { }); }
    } catch (err) { }
  });
  document.addEventListener('keydown', function (e) {
    var tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (!zoom.hidden) { if (k === 'Escape' || k === ' ' || k === 'Enter') { e.preventDefault(); closeZoom(); } return; }
    if (view !== 'present') { if (k === 'b' || k === 'B') setView('present'); return; }
    var it = seq[idx];
    if (k === 'ArrowRight' || k === 'PageDown') { go(1); e.preventDefault(); return; }
    if (k === 'ArrowLeft' || k === 'PageUp') { go(-1); e.preventDefault(); return; }
    if (k === ' ' || k === 'Enter') {
      e.preventDefault();
      if (it.t === 'c') {
        var cc = $('stage').querySelector('.concept');
        if (czLeft(cc)) { if (k === ' ') czNext(cc, it.id); else czAll(cc, it.id, true); } else go(1);
        return;
      }
      if (isQ(it) && !(state[it.id] || {}).rev) toggleReveal(it.id, $('stage').querySelector('.qcard')); else go(1);
      return;
    }
    if (k === 'b' || k === 'B') { setView('browse'); return; }
    if ((k === 'l' || k === 'L') && it.t === 'c') { var tx = $('stage').querySelector('.thx'); if (tx) { tx.open = !tx.open; if (tx.open) ensureVisible(tx); } return; }
    if (k === 'r' || k === 'R') { if (isQ(it)) resetItem(it.id); else if (it.t === 'c') czAll($('stage').querySelector('.concept'), it.id, false); return; }
    var card = $('stage').querySelector('.qcard'); if (!card) return;
    var up = k.toUpperCase();
    if (it.t === 'tf') { if (up === 'T') selectOpt(it, true, card); else if (up === 'F') selectOpt(it, false, card); return; }
    if (it.t === 'q') {
      var i = LET.indexOf(up);
      if (i < 0 && /^[1-8]$/.test(k)) i = parseInt(k, 10) - 1;
      if (i >= 0 && i < it.o.length) selectOpt(it, i, card);
    }
  });
  var tx = null;
  document.addEventListener('touchstart', function (e) {
    if (view !== 'present' || e.touches.length !== 1) { tx = null; return; }
    var t = e.target; if (t && t.closest && t.closest('.tblwrap, .tabs')) { tx = null; return; }
    tx = [e.touches[0].clientX, e.touches[0].clientY];
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (!tx) return;
    var dx = e.changedTouches[0].clientX - tx[0], dy = e.changedTouches[0].clientY - tx[1];
    if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy)) go(dx < 0 ? 1 : -1);
    tx = null;
  }, { passive: true });
  document.addEventListener('toggle', function (e) {
    var d = e.target;
    if (d && d.classList && d.classList.contains('thx') && view === 'present') { thxOpen = d.open; LS.set('thx', thxOpen); }
  }, true);
  window.addEventListener('hashchange', function () { jumpTo(location.hash.slice(1)); });

  /* ---------- start ---------- */
  $('tabs').innerHTML = S.map(function (s, si) { return '<button type="button" class="tab" data-sec="' + si + '"><span class="k">' + s.id + '</span>' + s.short + '</button>'; }).join('');
  var th = LS.get('theme', null); if (th === 'dark' || th === 'light') document.documentElement.setAttribute('data-theme', th);

  function start(data) {
    data = data || {};
    if (data.state) state = data.state;
    coreOnly = typeof data.coreOnly === 'boolean' ? data.coreOnly : !!LS.get('core', false);
    $('coreOnly').checked = coreOnly;
    buildSeq();
    var want = location.hash ? location.hash.slice(1) : (data.pos || LS.get('pos', 'start'));
    var k = find(want); idx = k >= 0 ? k : 0;
    setView(data.view || LS.get('view', 'present'));
  }
  var hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') {
    try { hot.snapshot(function () { return { state: state, view: view, coreOnly: coreOnly, pos: seq[idx] && seq[idx].id }; }); } catch (e) { }
  }
  if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();

</script>
</body>
</html>
