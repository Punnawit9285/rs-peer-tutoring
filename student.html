      '<li>O<sub>2</sub> on Fe<sup>2+</sup> = {{oxygenation}}, not oxidation (iron stays Fe<sup>2+</sup>).</li>' +
      '<li><b>Binding sites</b>: O<sub>2</sub> and CO → heme iron · CO<sub>2</sub> → {{N-terminal amino group}} of globin · 2,3-BPG → between the {{β chains}} of deoxyHb.</li></ul>' +
      '<p><b>Why the first O<sub>2</sub> makes the rest easier</b>:</p>' +
      '<ol class="steps tight"><li>First O<sub>2</sub> binds the {{α}} subunit (wider heme pocket).</li>' +
      '<li>Fe<sup>2+</sup> goes {{high-spin}} → low-spin → drops into the flat porphyrin ring.</li>' +
      '<li>Pulls the histidine → {{salt bridges}} break → dimers rotate → 2,3-BPG pushed out.</li>' +
      '<li>T state (low affinity) → {{R state}} (high affinity) → next O<sub>2</sub> binds more easily.</li></ol>' +
      '<p>That is {{cooperativity}} → the curve is {{sigmoid}}.</p></div>' +
      CVS.fig('trans-heme', 'Iron atom movement into the flat porphyrin plane upon oxygen binding.', 'trans', 18) + '</div>' },
  { t: 'q', id: 'T2', src: 'Gas transport p.16–19', core: true,
    q: 'During the oxygenation of deoxyhemoglobin A (&alpha;<sub>2</sub>&beta;<sub>2</sub>), which sequence of molecular events occurs first and triggers the cooperative transition to oxyhemoglobin?',
    o: ['O2 binds the α-subunit first (wider heme pocket) → Fe2+ shifts from high-spin (0.6 Å above the ring) into the porphyrin plane (low-spin) → α–α and α–β salt bridges break, αβ rotates 15°, 2,3-BPG is expelled, and the β heme pocket opens',
        'O2 binds the β-subunit first (after 2,3-BPG covalently phosphorylates His146) → Fe2+ is oxidized to Fe3+ and moves 1.5 nm out of the porphyrin plane',
        '2,3-BPG binds between the α-subunits → αβ dimers rotate 45° → Fe2+ transitions from low-spin to high-spin',
        'CO2 binds to Fe2+ of the α-subunit → β–β subunits move 0.6 Å farther apart → salt bridges form to stabilize the R-state',
        'All four subunits bind O2 simultaneously without conformational change, producing a hyperbolic curve'], a: 0,
    ex: 'Because the α-subunit has a wider heme pocket than the β-subunit, O2 binds the α-subunit first. Fe2+ transitions from high-spin (0.6 Å out of plane due to steric repulsion) to low-spin in the flat porphyrin plane, pulling the histidine helix, breaking α–α and α–β salt bridges, rotating αβ dimers by 15°, expelling 2,3-BPG, bringing the β-chains 0.07 nm closer, and opening the β heme pocket.' },
  { t: 'q', id: 'T3', src: 'Gas transport p.13',
    q: 'Which pairing of ligand and its specific binding site on hemoglobin is <b>correct</b>?',
    o: ['CO2 → N-terminal −NH2 group of globin chains (forming carbaminohemoglobin) · 2,3-BPG → β-globin chains of deoxyhemoglobin',
        'CO2 → Fe2+ atom of heme · CO → N-terminal −NH2 group of globin chains',
        'H+ → Fe2+ atom of heme · O2 → C-terminal −COOH group of α-globin',
        '2,3-BPG → heme porphyrin ring of oxyhemoglobin · CO → β-globin His146',
        'O2 → N-terminal −NH2 group of globin · H+ → 2,3-BPG central cavity'], a: 0,
    ex: 'O2 and CO bind to the Fe2+ atom of heme (forming oxyhemoglobin and carboxyhemoglobin); CO2 binds to the N-terminal −NH2 group of globin chains (forming carbaminohemoglobin); H+ binds to proton-acceptor amino acids of globin (stabilizing deoxyhemoglobin); and 2,3-BPG binds non-covalently to the β-globin chains of deoxyhemoglobin.' },
  { t: 'c', id: 'T-C3', title: 'P50, oxygen dissociation shifts & 2,3-BPG regulation', src: 'Gas transport p.22–33',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>P<sub>50</sub></b> = P<sub>O2</sub> at 50% saturation; normal ≈ {{27}} mmHg.</li>' +
      '<li><b>Right shift</b>: P<sub>50</sub> ↑ → affinity {{↓}} → more O<sub>2</sub> unloaded to tissue.<ul>' +
      '<li>Caused by ↑ {{H<sup>+</sup>}}, ↑ CO<sub>2</sub>, ↑ {{temperature}}, ↑ 2,3-BPG (“an exercising muscle”).</li></ul></li>' +
      '<li><b>Left shift</b>: P<sub>50</sub> ↓ → affinity {{↑}} → Hb holds on.</li>' +
      '<li><b>Low pH</b> → protonated His146 forms an ion pair → locks Hb in the {{T state}}.</li>' +
      '<li><b>2,3-BPG</b><ul><li>made by {{glycolysis}} in the RBC; binds deoxyHb.</li>' +
      '<li>↑ in anemia, hypoxia, high altitude, exercise; ↓ in {{acidosis}}.</li></ul></li></ul></div>' +
      '<div class="stack">' + CVS.fig('trans-odc', 'Oxygen dissociation curves showing normal affinity and left vs right shifts.', 'trans', 22) + CVS.fig('trans-bpg', 'Conversion of 1,3-BPG to 2,3-BPG in red blood cells and its right-shifting effect.', 'trans', 23) + '</div></div>' },
  { t: 'q', id: 'T4', src: 'AC81', core: true, keep: true,
    q: 'The oxygen dissociation curve shifts significantly to the left. Which of the following changes is most associated with the changes?',
    o: ['P50 increased, affinity of Hb-O₂ decreased', 'P50 decreased, affinity of Hb-O₂ increased', 'P50 increased, affinity of Hb-O₂ increased', 'P50 decreased, affinity of Hb-O₂ decreased', 'P50 unchange, affinity of Hb-O₂ unchange'], a: 1,
    ex: 'A left shift means Hb is 50% saturated at a lower PO₂ (lower P50): higher affinity, holding O₂ more tightly.' },
  { t: 'q', id: 'T5', src: 'AC80', core: true, keep: true,
    q: 'What is the primary effect of 2,3-BPG on binding oxygen to hemoglobin?',
    o: ['Increase oxygen unloading to tissue', 'Decrease oxygen unloading to tissue', 'Increase oxygen affinity'], a: 0,
    ex: '2,3-BPG binds deoxyhemoglobin, stabilizing the T state: affinity falls, the curve shifts right, and more O₂ is released to tissues.' },
  { t: 'c', id: 'T-C4', title: 'Hemoglobin variants, CO poisoning, abnormal hemoglobins & myoglobin', src: 'Gas transport p.34–39',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Fetal Hb</b> = {{α2γ2}} → binds 2,3-BPG poorly → affinity ↑ → curve shifts {{left}} (still sigmoid) → fetus takes O<sub>2</sub> from the mother.</li>' +
      '<li><b>Adult</b>: HbA α2β2 (most), HbA<sub>2</sub> {{α2δ2}}; HbA<sub>1c</sub> = glycated HbA → ↑ in diabetes.</li>' +
      '<li><b>CO</b> (indoor stove, smoke) → binds Hb about {{200×}} more tightly than O<sub>2</sub> →<ul>' +
      '<li>less O<sub>2</sub> carried</li><li>curve shifts the same way as fetal Hb → what is carried is not released → tissue hypoxia.</li></ul></li>' +
      '<li><b>MetHb</b> = iron oxidised to {{Fe3+}} → cannot carry O<sub>2</sub>.</li>' +
      '<li><b>Myoglobin</b> (muscle): one chain, one heme → {{no cooperativity}} → {{hyperbolic}} curve, higher affinity than HbA.</li></ul></div>' +
      CVS.fig('trans-myoglobin', 'Myoglobin monomer structure and its oxygen dissociation curve compared with HbA.', 'trans', 38) + '</div>' },
  { t: 'q', id: 'T6', src: 'AC80', core: true, keep: true,
    q: 'Which of the following is true regarding fetal hemoglobin (HbF) compared to adult hemoglobin (HbA)?',
    o: ['HbF has a lower affinity for oxygen', 'HbF is unable to bind carbon dioxide', 'HbF is more efficient at unloading oxygen in tissues', 'HbF binds 2,3-bisphosphoglycerate more effectively', 'HbF causes a leftward shift in the oxygen-hemoglobin curve'], a: 4,
    ex: 'HbF (α₂γ₂) binds 2,3-BPG poorly, so its O₂ affinity is higher and its curve lies to the left of HbA, which lets the fetus take O₂ from maternal blood.' },
  { t: 'q', id: 'T7', src: 'AC79', keep: true,
    q: 'What does the oxygen dissociation curve graph of hemoglobin F look like compared to the graph for hemoglobin A?',
    o: ['Sigmoidal shape with a left shift', 'Sigmoidal shape with a right shift', 'Rectangular hyperbola', 'Sigmoidal shape with no shift', 'Linear'], a: 0,
    ex: 'HbF is still a cooperative tetramer, so its curve stays sigmoid, but it lies to the left. A rectangular hyperbola is myoglobin.' },
  { t: 'q', id: 'T8', src: 'AC81', core: true, keep: true,
    q: 'How does higher arterial CO affect hemoglobin dissociation curve?',
    o: ['Right shift of O₂ dissociation curve + higher O₂ affinity', 'Left shift of O₂ dissociation curve + higher O₂ affinity', 'Left shift of O₂ dissociation curve + lower O₂ affinity', 'Right shift of O₂ dissociation curve + lower O₂ affinity'], a: 1,
    ex: 'CO occupies heme sites (about 200–250 × the affinity of O₂) and makes the remaining sites hold O₂ more tightly: the curve shifts left and O₂ unloading falls.' },
  { t: 'q', id: 'T9', src: 'AC80 (clinical correlation)', keep: true,
    q: 'A 30 year old man uses kerosene as a fuel in his house. After a while, he walks out of his house without wearing a shirt on his upper body. There is black smoke floating out of his house. What happened?',
    o: ['CO have more affinity with Hb than O₂, so there is a defect in O₂ transportation', 'Hb-O₂ graph shift to the right'], a: 0,
    ex: 'Burning kerosene indoors produces carbon monoxide. CO binds Hb 200–250 times more tightly than O₂, lowering O₂-carrying capacity, and it shifts the curve left, not right.',
    flag: 'Only two options were recalled.' },
  { t: 'c', id: 'T-C5', title: 'CO2 transport in blood, Bohr effect & Haldane effect', src: 'Gas transport p.40–43',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>CO<sub>2</sub> travels as</b>: {{bicarbonate}} (most, ~70%) · carbamino-Hb · dissolved.</li>' +
      '<li><b>In the RBC</b>: CO<sub>2</sub> + H<sub>2</sub>O → ({{carbonic anhydrase}}) → H<sup>+</sup> + HCO<sub>3</sub><sup>−</sup><ul>' +
      '<li>H<sup>+</sup> → buffered by deoxyHb.</li><li>HCO<sub>3</sub><sup>−</sup> → leaves the cell, {{Cl−}} comes in (chloride shift).</li></ul></li>' +
      '<li><b>{{Bohr}} effect</b> (tissues): ↑ CO<sub>2</sub>, ↑ H<sup>+</sup> → O<sub>2</sub> affinity ↓ → O<sub>2</sub> {{released}}.</li>' +
      '<li><b>{{Haldane}} effect</b> (lungs): Hb picks up O<sub>2</sub> → holds less CO<sub>2</sub> and H<sup>+</sup> → CO<sub>2</sub> {{unloaded}} to be breathed out.</li></ul>' +
      '<p class="note">Memory hook: the tissue effect = CO<sub>2</sub> changes O<sub>2</sub> binding; the lung effect = O<sub>2</sub> changes CO<sub>2</sub> binding.</p></div>' +
      '<div class="stack">' + CVS.fig('trans-co2', 'Three mechanisms of carbon dioxide transport in red blood cells and plasma.', 'trans', 41) + CVS.fig('trans-bohr-haldane', 'Coupling of oxygen and carbon dioxide transport between lungs and tissues.', 'trans', 43) + '</div></div>' },
  { t: 'q', id: 'T10', src: 'AC80', core: true, keep: true,
    q: 'CO₂ ลำเลียงมากที่สุดในรูปไหน <span class="muted">In which form is most CO₂ transported?</span>',
    o: ['HCO₃⁻', 'H₂CO₃', 'ละลายกับ plasma <span class="muted">(dissolved in plasma)</span>', 'จับกับ Hb <span class="muted">(bound to Hb)</span>'], a: 0,
    ex: 'About 70% of CO₂ travels as bicarbonate (made by carbonic anhydrase in red cells and moved out by the chloride shift), about 23% as carbamino-Hb and about 7% dissolved.' },
  { t: 'q', id: 'T11', src: 'AC81', core: true, keep: true,
    q: 'Which of the following choices best describe the Haldane effect?',
    o: ['Oxygenation of hemoglobin promote CO₂ loading in tissue', 'Oxygenation of hemoglobin promote CO₂ unloading in lung', 'Decreased partial pressure of CO₂ promotes oxygenation of hemoglobin', 'Increased partial pressure of CO₂ promotes deoxygenation of hemoglobin'], a: 1,
    ex: 'Haldane: oxygenated Hb holds less CO₂ (and H⁺), so O₂ loading in the lung pushes CO₂ off. C and D describe the Bohr effect (CO₂ changing O₂ binding).' },
  { t: 'q', id: 'T12', src: 'AC79', keep: true,
    q: 'Which of the following statements is correct regarding the Bohr shift?',
    o: ['High oxygenation of Hb causes lowering of CO₂ affinity', 'High oxygenation of Hb causes a rise in CO₂ affinity', 'Low pH causes lowering of CO₂ affinity', 'Low pH causes lowering of O₂ affinity', 'Low pH causes a rise in O₂ affinity'], a: 3,
    ex: 'Bohr effect: H⁺ and CO₂ lower Hb’s O₂ affinity (right shift), helping unload O₂ in active tissue. A is the Haldane effect.' }
]});

/* Section C: Pulmonary Circulation, Vascular Resistance & Pulmonary Edema (681117-3 Pulmonary circulation.pdf, 27 pages). */
CVS.add({ id: 'C', short: 'Pulm circulation', title: 'Pulmonary Circulation, Vascular Resistance & Pulmonary Edema', kind: 'Lecture',
  blurb: 'Pulmonary vs bronchial and systemic circulation, recruitment and distension, alveolar vs extra-alveolar vessels and lung volume (FRC), vasoactive mediators and hypoxic pulmonary vasoconstriction, West zones, Starling law, and interstitial vs alveolar pulmonary edema.',
  items: [
  { t: 'c', id: 'C-C1', title: 'Pulmonary vs systemic & bronchial circulation', src: 'Pulm circulation p.4–7',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Pulmonary circulation</b>: thin walls, {{little smooth muscle}}.</li>' +
      '<li>Compared with systemic: {{low pressure}}, {{low resistance}}, {{same flow}} (RV and LV pump the same output).</li>' +
      '<li>Why that is enough: it only has to lift blood to the top of the lung, not to the brain.</li>' +
      '<li><b>Bronchial circulation</b>: from the {{aorta}} (systemic pressure) → feeds the airways down to the terminal bronchioles.</li>' +
      '<li>Some bronchial venous blood → {{pulmonary veins}} → left atrium → part of the normal small shunt.</li></ul></div>' +
      CVS.fig('circ-pressures', 'Comparison of pressures in the pulmonary vs systemic circulation.', 'circ', 5) + '</div>' },
  { t: 'q', id: 'C1', src: 'AC81', core: true, keep: true,
    q: 'What is true about pulmonary circulation and systemic circulation?',
    o: ['High pressure, high resistance, and high flow', 'High pressure, high resistance, and low flow', 'Low pressure, low resistance, and low flow', 'Low pressure, low resistance, and same flow'], a: 3,
    ex: 'The right heart pumps the same cardiac output as the left, but the pulmonary circuit runs at about one-sixth of the pressure because its resistance is about one-tenth.' },
  { t: 'c', id: 'C-C2', title: 'Pulmonary vascular resistance (PVR): recruitment, distension & lung volume', src: 'Pulm circulation p.10–13, 16',
    html: '<div class="two"><div class="stack"><p><b>More pressure or flow (exercise) → PVR falls</b>, passively:</p>' +
      '<ul class="pts"><li>{{Recruitment}} (main): closed capillaries open.</li>' +
      '<li>{{Distension}}: open capillaries widen.</li></ul>' +
      '<p><b>Lung volume pulls two vessel types opposite ways</b>:</p>' +
      '<ul class="pts"><li>{{Alveolar vessels}} (capillaries): big lung → squashed by alveoli → PVR {{↑}}.</li>' +
      '<li>{{Extra-alveolar vessels}}: big lung → pulled open by {{radial traction}} → PVR ↓; small lung → narrow → PVR ↑.</li>' +
      '<li>Sum = U-shaped curve → PVR lowest at {{FRC}}.</li>' +
      '<li>↑ alveolar pressure (ventilator, very high volume) → squashes capillaries → PVR ↑.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('circ-recruit', 'Opening of closed capillaries and widening of open capillaries as pulmonary pressure rises.', 'circ', 10) + CVS.fig('circ-pvr-vol', 'Opposing effects of lung volume on the two vessel types, producing a U-shaped total resistance curve.', 'circ', 13) + '</div></div>' },
  { t: 'q', id: 'C2', src: 'AC81', core: true, keep: true,
    q: 'What causes an increase in pulmonary artery resistance?',
    o: ['Increase alveolar pressure', 'Increase arterial pressure', 'Increase venous pressure', 'Distention of the pulmonary artery'], a: 0,
    ex: 'Raised alveolar pressure (e.g. positive-pressure ventilation, very high lung volume) squashes the alveolar capillaries and raises PVR. Higher arterial or venous pressure recruits and distends vessels, which lowers resistance.' },
  { t: 'q', id: 'C3', src: 'AC80', core: true, keep: true,
    q: 'Which diagram best illustrates the pulmonary vasculature when the cardiac output has increased to a maximum extent?',
    fig: CVS.fig('ac80-vessels', 'AC80: five drawings of the pulmonary capillary bed, A–E.', 'ac80', 9),
    o: ['A', 'B', 'C', 'D', 'E'], a: 0,
    ex: 'When cardiac output rises, closed capillaries open (recruitment) and open ones widen (distension), so PVR falls. A shows all channels open and wide.' },
  { t: 'c', id: 'C-C3', title: 'Vasoactive mediators, hypoxic pulmonary vasoconstriction (HPV) & gravity zones', src: 'Pulm circulation p.14–19',
    html: '<div class="two"><div class="stack"><div class="tblwrap"><table class="tbl compact"><thead><tr><th>Raise PVR</th><th>Lower PVR</th></tr></thead><tbody>' +
      '<tr><td>{{endothelin}}, {{thromboxane A2}}, serotonin, histamine, alveolar hypoxia</td><td>{{nitric oxide}}, {{prostacyclin}}, PDE inhibitors, calcium channel blockers</td></tr></tbody></table></div>' +
      '<ul class="pts"><li><b>Hypoxic vasoconstriction</b> (opposite of the body): alveolar P<sub>O2</sub> low → local arteries {{constrict}} → blood goes to well-aired alveoli → less shunt.</li>' +
      '<li><b>Birth</b>: fetus = whole lung hypoxic → PVR very high → {{first breath}} → O<sub>2</sub> in → PVR falls → lung flow rises.</li>' +
      '<li><b>Gravity zones (upright)</b><ul><li>Zone 1 (apex): P<sub>A</sub> &gt; Pa &gt; Pv → no flow.</li>' +
      '<li>Zone 2: Pa &gt; P<sub>A</sub> &gt; Pv.</li>' +
      '<li>Zone 3 (base): {{Pa &gt; Pv &gt; P<sub>A</sub>}} → most flow.</li></ul></li></ul></div>' +
      '<div class="stack">' + CVS.fig('circ-vaso', 'Signaling pathways of pulmonary vasoconstrictors and vasodilators in vascular smooth muscle.', 'circ', 14) + CVS.fig('circ-zones', 'Effect of gravity on pulmonary perfusion and West zones in the upright lung.', 'circ', 19) + '</div></div>' },
  { t: 'q', id: 'C4', src: 'AC79', core: true, keep: true,
    q: 'Arrange the pressure in the correct order from the greatest to the least in the zone 3 of the lung. (Pa = pulmonary arterial pressure, P<sub>A</sub> = pulmonary alveolar pressure, Pv = pulmonary venous pressure)',
    o: ['Pa > Pv > P<sub>A</sub>', 'P<sub>A</sub> > Pa > Pv', 'Pv > P<sub>A</sub> > Pa', 'Pa > P<sub>A</sub> > Pv', 'P<sub>A</sub> > Pv > Pa'], a: 0,
    ex: 'Zone 1: P<sub>A</sub> > Pa > Pv (no flow). Zone 2: Pa > P<sub>A</sub> > Pv (flow set by Pa − P<sub>A</sub>). Zone 3, the base: Pa > Pv > P<sub>A</sub>, so flow is set by Pa − Pv.',
    flag: 'AC81 asked a zone-order question too, but the recall did not define i, ii and iii, so only this version is used.' },
  { t: 'c', id: 'C-C4', title: 'Starling’s equation, lung water balance & pulmonary edema', src: 'Pulm circulation p.21–24',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Starling</b>: fluid out = K × [(P<sub>c</sub> − P<sub>i</sub>) − σ × (oncotic difference)]; σ = {{reflection coefficient}}.</li>' +
      '<li><b>Normal</b>: net force slightly {{outward}} → cleared by lymph (about 20 mL/h).</li></ul>' +
      '<div class="flow col"><div class="fbox start"><b>Too much filtration</b></div><div class="farrow">↓</div>' +
      '<div class="fbox art"><b>1 · {{Interstitial edema}}</b> (early): fluid around vessels and bronchi → CXR {{peribronchial cuffing}} → lymph carries it to the hilar nodes</div><div class="farrow">↓ lymph overwhelmed</div>' +
      '<div class="fbox ven"><b>2 · {{Alveolar edema}}</b> (late): alveoli flood one by one → no ventilation → {{shunt}} → pumped out by epithelial {{Na⁺/K⁺-ATPase}}</div></div>' +
      '<ul class="pts"><li><b>Cardiac</b>: P<sub>c</sub> ↑ (LV failure, {{mitral stenosis}}, fluid overload).</li>' +
      '<li><b>Non-cardiac</b>: low plasma protein, leaky capillaries ({{sepsis}}, lung injury), blocked lymph.</li></ul></div>' +
      CVS.fig('circ-starling', 'Starling forces across the pulmonary capillary endothelium and lymphatic drainage.', 'circ', 21) + '</div>' },
  { t: 'q', id: 'C5', src: 'Pulm circulation p.22–23', core: true,
    q: 'What distinguishes <b>early (interstitial)</b> pulmonary edema from <b>late (alveolar)</b> pulmonary edema in terms of fluid location, radiographic sign, gas-exchange impact, and compensatory clearance mechanism?',
    o: ['Early: fluid in perivascular/peribronchial interstitium (peribronchial cuffing), drained by perivascular lymphatics to hilar lymph nodes · Late: fluid floods alveoli one by one causing severe shunt, actively pumped out by epithelial Na+/K+-ATPase',
        'Early: fluid floods alveolar spaces first and is cleared by surfactant · Late: fluid enters hilar lymph nodes and improves V/Q matching',
        'Early: caused only by sepsis · Late: caused only by mitral stenosis and cleared by endothelial Ca2+-ATPase',
        'Early: causes pure anatomic dead space (V/Q = ∞) · Late: causes increased DLCO (>120%)',
        'Early: actively pumped out by alveolar macrophages · Late: passively drained by bronchial veins'], a: 0,
    ex: 'Initially, capillary filtrate enters the perivascular and peribronchial interstitial spaces (interstitial edema, producing peribronchial cuffing) and is compensated by perivascular lymphatics transporting fluid to hilar lymph nodes. Once maximal interstitial drainage is exceeded, fluid crosses into alveolar spaces (alveolar edema), filling alveoli one by one, creating unventilated units (V/Q mismatch and severe shunt), and is compensated by epithelial Na+/K+-ATPase pumps.' },
  { t: 'tf', id: 'C6', src: 'Pulm circulation p.21',
    q: 'Under normal physiological conditions in humans, the net Starling force across pulmonary capillaries is outward, producing a baseline lymph flow of approximately 20 mL/h.', a: true,
    ex: 'True. Slide 21 states that the net pressure of the Starling equation is outward under normal conditions, resulting in a small continuous pulmonary lymph flow of about 20 mL/h.' }
]});

/* Section P: Pulmonary Function Tests & Spirometry Interpretation (681117-1 PFT handout, 15 pp.). */
CVS.add({ id: 'P', short: 'PFTs', title: 'Pulmonary Function Tests & Spirometry Interpretation', kind: 'Lecture',
  blurb: 'What spirometry measures, how a good test is done, how to read a report in five steps (with the lecture’s six worked cases), and flow-volume loops.',
  items: [
  { t: 'c', id: 'P-C1', title: 'Standard lung volumes, capacities, and what spirometry measures', src: 'PFT p.2–4',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>4 volumes</b>: TV (normal breath) · IRV (extra in) · ERV (extra out) · {{RV}} (what never leaves).</li>' +
      '<li><b>Capacities</b> = {{two or more volumes}} added together:<ul>' +
      '<li>IC = {{TV + IRV}}</li><li>FRC = {{ERV + RV}}</li><li>VC = {{IRV + TV + ERV}}</li><li>TLC = {{VC + RV}}</li></ul></li>' +
      '<li><b>Spirometer</b> measures only air moving through the mouth → anything containing RV (RV, FRC, TLC) {{cannot be measured}} → needs {{body plethysmography}} or gas dilution.</li>' +
      '<li><b>Forced blow gives</b>: FEV<sub>1</sub>, FVC, FEV<sub>1</sub>/FVC, PEF, and {{FEF25–75%}} (the small airways).</li></ul></div>' +
      CVS.fig('pft-volumes', 'Workings of a simple water-bell spirometer and standard lung volumes and capacities on a spirogram.', 'pft', 4) + '</div>' },
  { t: 'q', id: 'P1', src: 'PFT p.4', core: true,
    q: 'Which set of lung volumes and capacities CANNOT be measured by simple spirometry?',
    o: ['Residual volume (RV), functional residual capacity (FRC), and total lung capacity (TLC)', 'Inspiratory reserve volume (IRV), inspiratory capacity (IC), and vital capacity (VC)', 'Expiratory reserve volume (ERV), tidal volume (TV), and forced vital capacity (FVC)', 'Inspiratory capacity (IC), functional residual capacity (FRC), and vital capacity (VC)', 'Tidal volume (TV), residual volume (RV), and expiratory reserve volume (ERV)'], a: 0,
    ex: 'Simple spirometry only tracks air entering and leaving the mouth. Because the lungs cannot be completely emptied below RV, neither RV nor any capacity containing RV (FRC = ERV + RV and TLC = VC + RV) can be measured by simple spirometry; they require body plethysmography or gas dilution.' },
  { t: 'q', id: 'P2', src: 'PFT p.3–4',
    q: 'A healthy adult has TV = 0.5 L, IRV = 2.5 L, ERV = 1.2 L, and RV = 1.6 L. What are the inspiratory capacity (IC), functional residual capacity (FRC), and vital capacity (VC)?',
    o: ['IC = 3.0 L, FRC = 2.8 L, VC = 4.2 L', 'IC = 2.5 L, FRC = 2.8 L, VC = 5.8 L', 'IC = 3.0 L, FRC = 1.7 L, VC = 4.2 L', 'IC = 3.7 L, FRC = 2.8 L, VC = 5.8 L', 'IC = 3.0 L, FRC = 4.1 L, VC = 3.7 L'], a: 0,
    ex: 'IC = TV + IRV = 0.5 + 2.5 = 3.0 L; FRC = ERV + RV = 1.2 + 1.6 = 2.8 L; VC = IRV + TV + ERV = 2.5 + 0.5 + 1.2 = 4.2 L (and TLC = VC + RV = 5.8 L).' },
  { t: 'c', id: 'P-C2', title: 'Before the test: who should not blow, what to stop, what to avoid', src: 'PFT p.5–6',
    html: '<div class="two"><div class="stack">' +
      '<div class="mini"><h4>Who should not blow yet</h4><p>Forced blow → pressure ↑ in chest, skull and eyes → wait if:</p><ul>' +
      '<li>{{heart attack}} in the last month</li><li>untreated {{pneumothorax}} or pulmonary embolism</li>' +
      '<li>{{cerebral aneurysm}}</li><li>recent brain, chest or eye surgery</li><li>late pregnancy</li><li>possible active TB</li></ul></div>' +
      '<div class="mini"><h4>Before the test</h4><ul><li>No smoking or hard exercise for {{1 hour}}.</li>' +
      '<li>Diagnostic test → stop {{bronchodilators}} first (short-acting for hours, long-acting for a day or more; see the table).</li>' +
      '<li>{{Inhaled steroids}} can be continued.</li></ul></div>' +
      '<p class="note">Predicted values come from {{age, sex, height and ethnicity}} (GLI 2012). Weight does not count.</p></div>' +
      CVS.fig('pft-withhold', 'Bronchodilator withholding times before diagnostic spirometry.', 'pft', 6) + '</div>' },
  { t: 'q', id: 'P3', src: 'PFT p.6',
    q: 'Which patient characteristic does NOT determine the predicted spirometry reference values (GLI2012)?',
    o: ['Body weight', 'Standing height', 'Biological sex', 'Age', 'Ethnicity'], a: 0,
    ex: 'Predicted reference values in GLI2012 are determined by age, sex, standing height, and ethnicity. Body weight is measured during preparation but is not part of the reference equations for normal lung volumes.' },
  { t: 'tf', id: 'P4', src: 'PFT p.6',
    q: 'Acute myocardial infarction 2 weeks ago, thoracic surgery 3 weeks ago, or cataract surgery 3 weeks ago are relative contraindications to performing spirometry.', a: true,
    ex: 'True. Acute MI within 1 month, cerebral or thoracic surgery within 4 weeks, and eye surgery within 4–8 weeks are all listed as relative contraindications because forced expiration abruptly increases intrathoracic, intracranial, and intraocular pressures.' },
  { t: 'c', id: 'P-C3', title: 'One good blow, three times over: acceptability, repeatability and the best values', src: 'PFT p.7–9, 14',
    html: '<div class="two"><div class="stack"><ol class="steps"><li><b>Fill up</b> fast to {{total lung capacity}} (no long pause: it lowers PEF and FEV₁).</li>' +
      '<li><b>Blast</b> out as hard and fast as possible.</li>' +
      '<li><b>Keep going</b> until nothing more comes out, then breathe in fully.</li></ol>' +
      '<div class="tblwrap"><table class="tbl compact"><thead><tr><th>Acceptable blow</th><th>Check</th></tr></thead><tbody>' +
      '<tr><td>Good start</td><td>back-extrapolated volume ≤ {{5% of FVC or 0.100 L}}</td></tr>' +
      '<tr><td>Good end</td><td>plateau (≤ 0.025 L in the last second) or blow ≥ {{15 s}}</td></tr>' +
      '<tr><td>No artifacts</td><td>no {{cough in the first second}}, leak or glottic closure</td></tr></tbody></table></div></div>' +
      '<div class="stack"><div class="mini art"><h4>How many blows</h4><ul><li>{{3}} to 8 acceptable blows.</li>' +
      '<li>Repeatable: top two FVC and top two FEV₁ each within {{0.150 L}}.</li></ul></div>' +
      '<div class="mini ven"><h4>What goes on the report</h4><ul><li>The {{largest FEV₁}} and the {{largest FVC}}.</li>' +
      '<li>They may come from {{different blows}}. Never average.</li></ul></div>' +
      CVS.fig('pft-accept', 'Blows that fail acceptability: variable effort, early end, cough, glottic closure, tongue in the mouthpiece, leak.', 'pft', 8) + '</div></div>' },
  { t: 'q', id: 'P5', src: 'PFT p.7–9', core: true,
    q: 'According to the 2019 ATS/ERS spirometry guidelines, which statement regarding acceptability and adult repeatability criteria is correct?',
    o: ['Back-extrapolated volume (BEV) must be <= 5% of FVC or 0.100 L (whichever is greater), end-expiratory plateau <= 0.025 L in the last 1 s (or expiratory time >= 15 s), and the two largest FVC and FEV1 values within <= 0.150 L', 'Maximal inspiration to TLC should be held for 4–6 s at TLC to maximize PEF and FEV1, with 10–12 trials performed routinely', 'BEV must be <= 10% of FVC or 0.250 L, and the two largest FVC values must be within <= 0.300 L', 'A cough during the first second of expiration is acceptable for FEV1 as long as expiratory time exceeds 6 s', 'If FIVC after the maneuver exceeds FVC by 0.400 L, the trial is acceptable because inspiration after EOFE is normally larger'], a: 0,
    ex: 'ATS/ERS 2019 requires rapid inspiration to TLC in <= 2 s (holding 4–6 s lowers PEF and FEV1), BEV <= 5% of FVC or 0.100 L (whichever is greater), 1 of 3 EOFE indicators (plateau <= 0.025 L in the last 1 s, expiratory time >= 15 s, or repeatable FVC), no artifacts, FIVC - FVC <= 0.100 L or 5% of FVC, 3–8 trials, and adult repeatability within <= 0.150 L for the top two FVC and top two FEV1 values.' },
  { t: 'q', id: 'P6', src: 'PFT lecture quiz 1', core: true, wide: true, keep: true,
    q: 'Four acceptable blows give these values. Which FEV₁ and FVC go on the report?',
    fig: CVS.fig('pft-case1', 'PFT lecture quiz, best test selection.', 'pft', 14),
    o: ['FEV₁ 4.00 L and FVC 4.43 L', 'FEV₁ 3.93 L and FVC 4.39 L (the first blow)', 'FEV₁ 3.92 L and FVC 4.21 L (the averages)', 'FEV₁ 3.84 L and FVC 3.97 L (the blow with the highest FEV₁/FVC)', 'FEV₁ 4.00 L and FVC 4.04 L'], a: 0,
    ex: 'Report the largest FEV₁ (4.00, trial 2) and the largest FVC (4.43, trial 2); they may come from different blows, and you never average. Repeatability passes: FEV₁ 4.00 vs 3.93 and FVC 4.43 vs 4.39 each differ by under 0.150 L. Trials 3 and 4 have a ratio of 96–97% with a smaller FVC, the sign of a blow that stopped early.' },
  { t: 'c', id: 'P-C4', title: 'Reading a spirometry report in five steps', src: 'PFT p.10–11, lecture quiz p.14–15',
    html: '<div class="cols2"><div class="mini art"><h4>Read it in order</h4><ol class="steps tight">' +
      '<li><b>Slow?</b> FEV₁/FVC &lt; {{70}} → obstruction</li>' +
      '<li><b>Small?</b> FVC &lt; {{80%}} → restriction → confirm with {{TLC}}</li>' +
      '<li><b>How bad?</b> obstruction → {{FEV₁ %pred}} · restriction → FVC %pred</li>' +
      '<li><b>Reversible?</b> FEV₁ ↑ ≥ {{12%}} <i>and</i> ≥ {{200 mL}}</li>' +
      '<li><b>All normal?</b> FEF₂₅–₇₅ &lt; {{65%}} → small airways</li></ol></div>' +
      '<div class="mini ven"><h4>Two traps</h4><ul>' +
      '<li>Step 1 uses the {{actual ratio}} (e.g. 53), not its %Pred column (e.g. 68).</li>' +
      '<li>Obstruction + low FVC → trapped air can fake a small lung → corrected %FVC = %FVC + (70 − ratio) → still &lt; 80 → {{mixed}} defect.</li></ul></div></div>' +
      '<div class="flowx" data-flow="pft"></div>' +
      '<details class="figmore"><summary>The lecture’s own flowchart (PFT slide 10)</summary>' + CVS.fig('pft-algo', 'The lecture’s interpretation flowchart.', 'pft', 10) + '</details>' },
  { t: 'q', id: 'P7', src: 'PFT lecture quiz 2', core: true, wide: true, keep: true,
    q: 'Thai male, 29 years, height 162 cm, weight 80 kg. Interpret this spirometry report.',
    fig: CVS.fig('pft-case2', 'PFT lecture quiz, case 2.', 'pft', 14),
    o: ['Normal spirometry', 'Small airway disease', 'Moderate restriction', 'Moderate obstruction with bronchodilator response', 'Severe obstruction without bronchodilator response'], a: 0,
    ex: 'Step 1: FEV₁/FVC 80.53 (above 75): no obstruction. Step 2: FVC 93% predicted (above 80%): no restriction. Step 5: FEF₂₅–₇₅% 70% predicted (above 65%): no small airway disease. Normal spirometry. (After the bronchodilator FEV₁ rises 2.90 → 3.01 L, +4%, so there is no response either.)' },
  { t: 'q', id: 'P8', src: 'PFT lecture quiz 3', core: true, wide: true, keep: true,
    q: 'Thai male, 71 years, height 162 cm, weight 41.4 kg. Interpret this spirometry report.',
    fig: CVS.fig('pft-case3', 'PFT lecture quiz, case 3.', 'pft', 14),
    o: ['Normal spirometry', 'Small airway disease', 'Moderate restriction', 'Moderate obstruction with bronchodilator response', 'Severe obstruction without bronchodilator response'], a: 4,
    ex: 'Step 1: FEV₁/FVC 41.96: obstruction. Step 2: FVC 81% predicted (above 80%, no correction needed): pure obstruction. Step 3: FEV₁ 43% predicted: severe (35–49). Step 4: FEV₁ 1.01 → 1.09 L (+8%, +80 mL) and FVC 2.40 → 2.43 L (+1%): below 12% and 200 mL, so no bronchodilator response (irreversible obstruction).' },
  { t: 'q', id: 'P9', src: 'PFT lecture quiz 4', core: true, wide: true, keep: true,
    q: 'Thai male, 76 years, height 169 cm, weight 62 kg. Interpret this spirometry report.',
    fig: CVS.fig('pft-case4', 'PFT lecture quiz, case 4.', 'pft', 14),
    o: ['Normal spirometry', 'Small airway disease', 'Moderate restriction', 'Moderate obstruction with bronchodilator response', 'Severe obstruction without bronchodilator response'], a: 3,
    ex: 'Step 1: FEV₁/FVC 53.29 (not the 68 in its %Pred column): obstruction. Step 2: FVC 100% predicted: pure obstruction. Step 3: FEV₁ 69% predicted: moderate (50–69). Step 4: FEV₁ 1.69 → 1.90 L = +0.21 L and (1.90 − 1.69)/1.69 = +12.4% (the report rounds to 13): both ≥ 200 mL and ≥ 12%, so a bronchodilator response (reversible obstruction).' },
  { t: 'q', id: 'P10', src: 'PFT lecture quiz 5', core: true, wide: true, keep: true,
    q: 'Thai male, 70 years, height 172 cm, weight 65 kg. Interpret this spirometry report.',
    fig: CVS.fig('pft-case5', 'PFT lecture quiz, case 5.', 'pft', 15),
    o: ['Normal spirometry', 'Small airway disease', 'Moderate restriction', 'Moderate obstruction with bronchodilator response', 'Severe obstruction without bronchodilator response'], a: 2,
    ex: 'Step 1: FEV₁/FVC 82.81: no obstruction. Step 2: FVC 62% predicted (below 80%): restriction pattern, to be confirmed by TLC. Step 3: restriction is graded on FVC % predicted: 62% is moderate (50–69).' },
  { t: 'q', id: 'P11', src: 'PFT lecture quiz 6', wide: true, keep: true,
    q: 'Thai female, 70 years, height 156 cm, weight 55.8 kg. Interpret this spirometry report.',
    fig: CVS.fig('pft-case6', 'PFT lecture quiz, case 6.', 'pft', 15),
    o: ['Normal spirometry', 'Small airway disease', 'Moderate restriction', 'Moderate obstruction with bronchodilator response', 'Severe obstruction without bronchodilator response'], a: 2,
    ex: 'Step 1: FEV₁/FVC 83.11: no obstruction. Step 2: FVC 60% predicted (below 80%): restriction pattern. Step 3: FVC 60% predicted: moderate (50–69).' },
  { t: 'q', id: 'P12', src: 'AC80', core: true, keep: true,
    q: 'A 55-year-old man with a 30 pack-year smoking history presents with progressive dyspnea. Spirometry shows FVC = 3.72 L and FEV₁ = 2.54 L. Which is the most likely diagnosis?',
    o: ['Small airway disease', 'Chronic obstructive pulmonary disease', 'Parenchymal lung disease', 'Pulmonary fibrosis'], a: 1,
    ex: 'FEV₁/FVC = 2.54/3.72 = 68%, below 70–75: obstruction. With a heavy smoking history, COPD is the likely cause.' },
  { t: 'q', id: 'P13', src: 'AC81', core: true, keep: true,
    q: 'Spirometry:<div class="tblwrap"><table class="tbl compact"><thead><tr><th></th><th>Before bronchodilator</th><th>After bronchodilator</th></tr></thead><tbody><tr><td>FVC</td><td>3.0 L (75% predicted)</td><td>3.1 L (78% predicted)</td></tr><tr><td>FEV₁</td><td>0.60 L (18% predicted)</td><td>0.85 L (27% predicted)</td></tr><tr><td>FEF₂₅–₇₅%</td><td>0.40 L/s (11% predicted)</td><td>0.45 L/s (13% predicted)</td></tr></tbody></table></div>Which is the condition of the patient?',
    o: ['Moderate obstructive PD with bronchodilator response', 'Severe obstructive PD with bronchodilator response', 'Very severe obstructive PD with bronchodilator response', 'Very severe obstructive PD without bronchodilator response'], a: 2,
    ex: 'Step 1: FEV₁/FVC = 0.60/3.0 = 20%: obstruction. Step 2: FVC is 75%, so correct it: 75 + (70 − 20) = 125% (above 80%): pure obstruction. Step 3: FEV₁ 18% predicted: very severe (below 35). Step 4: FEV₁ 0.60 → 0.85 L = +250 mL and +42%: a bronchodilator response by the ≥ 12% and ≥ 200 mL rule.',
    flag: 'The raw AC81 key marks D (without response). That only fits the ERS/ATS 2021 rule (change &gt; 10% of predicted: 27 − 18 = 9%). By the rule the lecture applies in its worked cases (≥ 12% and ≥ 200 mL, as in case 4, which counts a 9-point change as a response), the answer is C. The PS81 recall also notes these numbers were rebuilt by the recall team.' },
  { t: 'q', id: 'P14', src: 'AC81', keep: true,
    q: 'What is the most plausible disease the patient in the previous question might have?',
    o: ['Myasthenia gravis', 'Asthma', 'Pulmonary fibrosis', 'Chronic obstructive pulmonary disorder'], a: 3,
    ex: 'Even after the bronchodilator FEV₁/FVC is 0.85/3.1 ≈ 27%: the obstruction stays severe and largely fixed, which points to COPD. Asthma usually reverses toward normal; fibrosis and myasthenia give restriction, not obstruction.' },
  { t: 'q', id: 'P15', src: 'AC79', core: true, keep: true,
    q: 'A 26-year-old woman is admitted to the hospital due to difficulty breathing which has been aggravating for the past 2 months. She also complains about persistent cough and wheezing. The results of her pulmonary function test are as shown below:<div class="tblwrap"><table class="tbl compact"><thead><tr><th>Parameter</th><th>Predicted</th><th>Measured</th><th>% Predicted</th><th>Measured (post-BD)</th></tr></thead><tbody><tr><td>FVC</td><td>3.99 L</td><td>3.87 L</td><td>97%</td><td>3.95 L</td></tr><tr><td>FEV₁</td><td>3.42 L</td><td>2.09 L</td><td>61%</td><td>2.75 L</td></tr><tr><td>FEV₁/FVC</td><td></td><td>54%</td><td></td><td>70%</td></tr></tbody></table></div>What is the most likely diagnosis for this patient?',
    o: ['Mixed obstructive and restrictive disease', 'Moderate obstructive disease with bronchodilator effect', 'Moderate obstructive disease without bronchodilator effect', 'Severe obstructive disease with bronchodilator effect', 'Severe obstructive disease without bronchodilator effect'], a: 1,
    ex: 'Ratio 54%: obstruction. FVC 97%: pure. FEV₁ 61% predicted: moderate. FEV₁ 2.09 → 2.75 L = +660 mL and +32%: a bronchodilator response (fits asthma).' },
  { t: 'q', id: 'P16', src: 'AC79', keep: true,
    q: 'A 40-year-old male comes to the doctor with progressive dyspnea upon exertion for 4 months. The pulmonary function test parameters are as follows:<div class="tblwrap"><table class="tbl compact"><thead><tr><th>Parameter</th><th>Pre-bronchodilator</th><th>% Predicted</th></tr></thead><tbody><tr><td>FVC</td><td>2.5 L</td><td>80%</td></tr><tr><td>FEV₁</td><td>2.2 L</td><td>75%</td></tr><tr><td>FEF₂₅–₇₅%</td><td>1.6 L</td><td>50%</td></tr></tbody></table></div>Which is the most possible etiology?',
    o: ['Functional dyspnea', 'Pulmonary vascular disease', 'Neuromuscular disease', 'Small airway obstruction', 'Upper airway obstruction'], a: 3,
    ex: 'FEV₁/FVC = 2.2/2.5 = 88%: no obstruction. FVC 80%: not restricted. FEF₂₅–₇₅% 50% predicted is below 65%: small airway disease, the earliest sign of airway disease.' },
  { t: 'q', id: 'P17', src: 'AC79 (clinical correlation)', core: true, keep: true,
    q: 'A patient comes to the doctor due to worsening dyspnea. The pulmonary function test results are as follows:<div class="tblwrap"><table class="tbl compact"><thead><tr><th>Parameter</th><th>Predicted</th><th>Measured</th><th>% Predicted</th><th>Measured (post-BD)</th></tr></thead><tbody><tr><td>FVC</td><td>3.17 L</td><td>2.03 L</td><td>64%</td><td>2.11 L</td></tr><tr><td>FEV₁</td><td>2.69 L</td><td>1.55 L</td><td>58%</td><td>1.83 L</td></tr><tr><td>FEV₁/FVC</td><td></td><td>76%</td><td></td><td>87%</td></tr></tbody></table></div>What is the condition found in this patient?',
    o: ['Restrictive disease', 'Small airway obstruction', 'Intra-thoracic airway obstruction', 'Moderate obstruction with bronchodilator response', 'Moderate obstruction without bronchodilator response'], a: 0,
    ex: 'Ratio 76% (not below 75): no obstruction, so the low FEV₁ just follows the small lung. FVC 64% predicted: restriction (moderate), to be confirmed by TLC.' },
  { t: 'c', id: 'P-C5', title: 'Flow-volume loops: obstructive, restrictive, and central airway obstruction', src: 'PFT p.11–13',
    html: '<div class="stack">' + CVS.fig('pft-loops', 'Flow-volume loops in obstructive disease, bronchodilator responsiveness, restrictive subtypes, and the three patterns of central airway obstruction.', 'pft', 12) +
      '<div class="tblwrap"><table class="tbl compact"><thead><tr><th>Pattern</th><th>Breath out (top)</th><th>Breath in (bottom)</th><th>Why</th></tr></thead><tbody>' +
      '<tr><td><b>Obstructive</b></td><td>{{scooped-out}}</td><td>normal</td><td>small airways squeezed when blowing</td></tr>' +
      '<tr><td><b>Restrictive</b></td><td>narrow; {{witch’s hat}} in fibrosis</td><td>narrow</td><td>small lung; stiff lung → steep slope</td></tr>' +
      '<tr><td><b>Variable extrathoracic</b> (vocal cord palsy)</td><td>normal</td><td>{{flat}}</td><td>breath in → airway pressure below air → neck airway sucked in → {{stridor}}</td></tr>' +
      '<tr><td><b>Variable intrathoracic</b></td><td>{{flat}}</td><td>normal</td><td>breath out → pleural pressure squeezes the airway</td></tr>' +
      '<tr><td><b>Fixed</b> (stenosis, old TB scar)</td><td>flattened</td><td>flattened</td><td>rigid narrowing → {{box-shaped}} loop</td></tr></tbody></table></div>' +
      '<p class="note">Combined defect = small loop + scooped breath-out limb. A bronchodilator response = the loop grows back toward normal.</p></div>' },
  { t: 'q', id: 'P18', src: 'PFT p.12–13', core: true,
    q: 'A patient with vocal cord paralysis presents with inspiratory stridor. Which flow-volume loop pattern is expected, and what transmural pressure mechanism explains it?',
    o: ['Flat inspiratory curve with a normal expiratory curve — negative intraluminal airway pressure during inspiration pulls the compliant extrathoracic airway inward against higher atmospheric pressure', 'Flat expiratory curve with a normal inspiratory curve — positive pleural pressure during forced expiration compresses the extrathoracic trachea', 'Flattening of both inspiratory and expiratory curves — vocal cord paralysis acts as a rigid intrathoracic ring', 'Scooped-out concave expiratory curve with normal PEF — small airway dynamic compression', 'Narrow "witch\'s hat" loop shifted to the right — increased lung elastic recoil'], a: 0,
    ex: 'Vocal cord paralysis is a variable extrathoracic upper airway obstruction (pattern a). During inspiration, intraluminal tracheal pressure becomes subatmospheric (-), while surrounding neck pressure is atmospheric (+), sucking the mobile vocal cords inward and flattening the inspiratory limb (producing stridor). During expiration, positive intraluminal pressure pushes them open.' },
  { t: 'q', id: 'P19', src: 'AC81', core: true, keep: true,
    q: 'A patient comes with combined obstructive and restrictive pulmonary defect. Which flow-volume loop is most likely? The graph labelled “Reference” is a normal loop.',
    fig: '<div class="scanrow">' + CVS.fig('ac81-fvref', 'Reference: a normal loop.', 'ac81', 13) + CVS.fig('ac81-fva', 'A', 'ac81', 13) + CVS.fig('ac81-fvb', 'B', 'ac81', 13) + CVS.fig('ac81-fvc', 'C', 'ac81', 13) + CVS.fig('ac81-fvd', 'D', 'ac81', 13) + '</div>',
    o: ['A', 'B', 'C', 'D'], a: 0,
    ex: 'Combined disease needs both features: a small loop (low volume, about 1.6 L, from restriction) and a scooped, low expiratory limb (obstruction). A shows both.',
    flag: 'From the AC81 recall: the real exam gave numbers; the recall team redrew it with loops.' },
  { t: 'q', id: 'P20', src: 'AC80', core: true, keep: true,
    q: 'What should be the abnormality of this patient?',
    fig: CVS.fig('ac80-fvfixed', 'AC80: flow-volume loop.', 'ac80', 8),
    o: ['Fixed upper airway obstruction', 'Variable extrathoracic obstruction', 'Variable intrathoracic obstruction', 'Chest wall restriction'], a: 0,
    ex: 'Both the expiratory and inspiratory limbs are flattened into a box: the narrowing limits flow in both directions, so it is a fixed upper (central) airway obstruction, such as tracheal stenosis.' },
  { t: 'q', id: 'P21', src: 'AC79', core: true, keep: true,
    q: 'A 35-year-old man comes to a pulmonologist due to worsening dyspnea. The doctor decides to perform a spirometry test, and then do it again after letting the patient take a bronchodilator. The results of both tests, shown as the flow-volume loop curves, are as follows. What is the most likely condition found in this patient?',
    fig: CVS.fig('ac79-fvbd', 'AC79: flow-volume loops at baseline and after salbutamol, with the reference curve.', 'ac79', 13),
    o: ['Restrictive pattern', 'Obstructive pattern without bronchodilator response', 'Obstructive pattern with bronchodilator response', 'Fixed upper airway obstruction', 'Variable extrathoracic obstruction'], a: 2,
    ex: 'The baseline expiratory limb is scooped (obstruction). After salbutamol the loop grows toward the reference curve: a bronchodilator response.' },
  { t: 'q', id: 'P22', src: 'AC79', keep: true,
    q: 'A 67-year-old woman with a history of persistent tuberculosis comes to her pulmonologist to check her respiratory health status using the spirometry test. The results, shown as the flow-volume curve, are as follows. What is the most likely condition found in this patient?',
    fig: CVS.fig('ac79-fvtb', 'AC79: flow-volume loop.', 'ac79', 13),
    o: ['Fixed airway obstruction', 'Variable intrathoracic obstruction', 'Variable extrathoracic obstruction', 'Poor inspiratory effort', 'Restrictive pattern'], a: 0,
    ex: 'Both limbs are flattened. Old tuberculosis can scar the trachea or a main bronchus into a fixed stenosis.',
    flag: 'PS81 edit keys A.' }
]});

/* Section R: Neural & Chemical Control of Respiration (681114-3 Respiratory control handout, 54 pp.). */
CVS.add({ id: 'R', short: 'Resp control', title: 'Neural & Chemical Control of Respiration', kind: 'Lecture',
  blurb: 'Medullary and pontine respiratory centers, central vs peripheral chemoreceptors and glomus cell transduction, lung mechanoreceptors and C-fibers, integrated responses to CO2, O2, pH and exercise, CO2 narcosis, and abnormal breathing patterns.',
  items: [
  { t: 'c', id: 'R-C1', title: 'Central controller: brainstem centers, cortex, and effectors', src: 'Resp control p.4–16',
    html: '<div class="two"><div class="stack"><div class="tblwrap"><table class="tbl compact"><thead><tr><th>Center</th><th>Where</th><th>Job</th></tr></thead><tbody>' +
      '<tr><td><b>DRG</b></td><td>medulla: {{nucleus tractus solitarii}}</td><td>quiet {{breathing in}} → phrenic n. → diaphragm</td></tr>' +
      '<tr><td><b>VRG, middle part</b></td><td>{{pre-Bötzinger complex}}</td><td>the {{pacemaker}} that sets the rhythm</td></tr>' +
      '<tr><td><b>VRG, front and back parts</b></td><td>Bötzinger complex, NRA</td><td>{{expiration}} (active breathing out)</td></tr>' +
      '<tr><td><b>Apneustic</b></td><td>{{lower pons}}</td><td>excites the DRG → longer inspiration</td></tr>' +
      '<tr><td><b>Pneumotaxic</b></td><td>{{upper pons}}</td><td>{{switches inspiration off}} → sets rate and depth</td></tr></tbody></table></div>' +
      '<ul class="pts"><li><b>Cortex</b> → {{voluntary}} control (breath-hold, hyperventilate, within limits).</li>' +
      '<li><b>Limbic system, hypothalamus</b> → breathing changes with emotion.</li></ul></div>' +
      CVS.fig('ctrl-brainstem', 'Brainstem respiratory control network showing sensors, pontine and medullary centers, and motor output to the diaphragm.', 'ctrl', 11) + '</div>' },
  { t: 'q', id: 'R1', src: 'Resp control p.9–10', core: true,
    q: 'Which structure serves as the primary pacemaker (central pattern generator) for the basic respiratory rhythm, and where is it located?',
    o: ['Pre-Botzinger complex in the intermediate ventral respiratory group (VRG)', 'Nucleus tractus solitarii (NTS) in the dorsal respiratory group (DRG)', 'Botzinger complex (nucleus retrofacialis) in the rostral VRG', 'Nucleus retroambigualis (NRA) in the caudal VRG', 'Pneumotaxic center in the upper pons'], a: 0,
    ex: 'The pre-Botzinger complex (preBotC), located in the intermediate subdivision of the ventral respiratory group (VRG) in the medulla, contains pacemaker neurons that generate the basic respiratory rhythm.' },
  { t: 'q', id: 'R2', src: 'Resp control p.10–11, 16', core: true,
    q: 'Which statement accurately describes the medullary dorsal respiratory group (DRG) and the two pontine respiratory centers?',
    o: ['The DRG (nucleus tractus solitarii) drives inspiration via the phrenic nerve (C3–C5); the lower-pontine apneustic center excites the DRG; the upper-pontine pneumotaxic center inhibits inspiration to regulate volume and rate', 'The DRG drives forced expiration via abdominal muscles; the apneustic center inhibits inspiration; the pneumotaxic center prolongs inspiration', 'The DRG is located in the upper pons and receives only somatic limb afferents; the apneustic center is in the dorsal medulla', 'The apneustic center in the upper pons switches off inspiration, whereas the pneumotaxic center in the lower pons excites the diaphragm directly', 'The DRG consists of the nucleus retroambigualis and is active only during heavy exercise'], a: 0,
    ex: 'The DRG is composed of the nucleus tractus solitarii (NTS) in the dorsal medulla, receives visceral sensory input from CN IX and CN X, and sends inspiratory output via the phrenic nerves (C3–C5) to the diaphragm. The lower pons (apneustic center) has an excitatory function on the DRG, whereas the upper pons (pneumotaxic center) inhibits inspiration to regulate tidal volume and respiratory rate.' },
  { t: 'c', id: 'R-C2', title: 'Central vs. peripheral chemoreceptors and glomus cell transduction', src: 'Resp control p.20–26',
    html: '<div class="two">' + CVS.fig('ctrl-central', 'Central chemoreceptor mechanism on the ventral medullary surface.', 'ctrl', 21) + CVS.fig('ctrl-glomus', 'Carotid body histology and hypoxic signal transduction in Type I glomus cells.', 'ctrl', 24) + '</div>' +
      '<div class="cols2"><div class="mini art"><h4>Central (ventral medulla)</h4><ul>' +
      '<li>Blood CO<sub>2</sub> crosses the {{blood-brain barrier}}; blood H<sup>+</sup> cannot.</li>' +
      '<li>CO<sub>2</sub> in CSF → H<sup>+</sup> → receptor fires → ventilation ↑.</li>' +
      '<li>CSF has little protein → {{weak buffer}} → small CO<sub>2</sub> change, big pH change.</li>' +
      '<li>Gives {{about 70%}} of the CO<sub>2</sub> drive. Does not sense O<sub>2</sub>.</li></ul></div>' +
      '<div class="mini ven"><h4>Peripheral (carotid, aortic bodies)</h4><ul>' +
      '<li>Carotid body → {{CN IX}}; aortic body → CN X.</li>' +
      '<li>Sense low P<sub>aO2</sub> (strongly below about {{60}} mmHg), high CO<sub>2</sub>, and blood H<sup>+</sup>.</li>' +
      '<li>Blood acid (lactic acid, ketoacidosis) → mainly the carotid body → {{Kussmaul}} breathing.</li></ul></div></div>' +
      '<p><b>Glomus (type I) cell</b>: low O<sub>2</sub> → {{K⁺ channels}} close → depolarise → {{Ca²⁺}} enters → transmitter release → nerve fires.</p>' },
  { t: 'q', id: 'R3', src: 'AC80', core: true, keep: true,
    q: 'A patient with DM has hyperventilation. His blood test shows elevated levels of lactic acid. Where is the receptor responsible for this phenomenon located?',
    o: ['Medulla', 'Carotid body', 'Internal thoracic artery', 'Vagus nerve', 'Aortic arch'], a: 1,
    ex: 'Blood H⁺ cannot cross the blood–brain barrier, so a metabolic acidosis drives breathing through the peripheral chemoreceptors, mainly the carotid bodies (via CN IX). Central chemoreceptors respond to CSF H⁺ from CO₂.' },
  { t: 'q', id: 'R4', src: 'AC79', keep: true,
    q: 'A 70-year-old woman with severe pulmonary fibrosis comes to a pulmonologist due to worsening dyspnea. The arterial blood gas results are as follows: pH = 7.5, PaO₂ = 50 mmHg, PaCO₂ = 28 mmHg. Which is the correct physiological response in the cerebrospinal fluid?',
    o: ['Stimulation of breathing via central chemoreceptor due to increased pH', 'Inhibition of breathing via central chemoreceptor due to increased pH', 'Stimulation of breathing via peripheral chemoreceptor due to increased pCO₂', 'Inhibition of breathing via central chemoreceptor due to increased pO₂', 'Inhibition of breathing via peripheral chemoreceptor due to increased pO₂'], a: 1,
    ex: 'Hypoxemia drives the peripheral chemoreceptors and she blows off CO₂. The low CO₂ raises CSF pH, which brakes breathing through the central chemoreceptors. Central receptors do not sense O₂.' },
  { t: 'c', id: 'R-C3', title: 'Lung mechanoreceptors, C-fibers, and other sensory inputs', src: 'Resp control p.27–35',
    html: '<div class="tblwrap"><table class="tbl compact"><thead><tr><th>Receptor (vagus)</th><th>Triggered by</th><th>Response</th></tr></thead><tbody>' +
      '<tr><td><b>Stretch</b> (airway smooth muscle)</td><td>lung {{inflation}}</td><td>{{Hering-Breuer reflex}} → longer expiration → slower rate (strong in newborns)</td></tr>' +
      '<tr><td><b>Irritant</b> (airway epithelium)</td><td>smoke, dust, cold air, {{histamine}}</td><td>cough, bronchoconstriction → part of {{asthma}} attacks</td></tr>' +
      '<tr><td><b>J receptors</b> (alveolar wall, C-fibres)</td><td>{{interstitial edema}} (e.g. left heart failure)</td><td>{{rapid, shallow breathing}}</td></tr></tbody></table></div>' +
      '<ul class="pts">' +
      '<li>Cut both vagi (animal) → no stretch reflex → {{slow, deep}} breathing.</li>' +
      '<li><b>Others</b>: joint and muscle receptors → early exercise breathing; ↑ blood pressure (baroreceptors) → {{less}} breathing; pain → brief apnea then hyperventilation.</li></ul>' },
  { t: 'q', id: 'R5', src: 'AC79 · AC80 · AC81', core: true, keep: true,
    q: '70-year-old man with congestive heart failure from left ventricular heart failure. EP: rapid shallow breathing with O₂ sat 92%. Lung: fine crepitations in both lungs. Which mechanism is responsible for this?',
    o: ['Peripheral chemoreceptor', 'Central chemoreceptor', 'Muscle and joint receptor', 'Juxtacapillary receptor', 'Both peripheral and central chemoreceptor'], a: 3,
    ex: 'Left heart failure raises pulmonary capillary pressure and fluid builds up in the interstitium. That stimulates J (juxtacapillary) receptors in the alveolar walls, which signal by the vagus to give rapid, shallow breathing.',
    flag: 'Asked in all three years (AC79 wording: “juxta-pulmonary capillary receptors”).' },
  { t: 'c', id: 'R-C4', title: 'Integrated responses to CO2, O2, pH, exercise, altitude, and CO2 narcosis', src: 'Resp control p.38–51',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>CO<sub>2</sub></b> = the {{strongest}} everyday stimulus; ventilation rises in a straight line with P<sub>CO2</sub>.<ul>' +
      '<li>Low O<sub>2</sub> at the same time → steeper line.</li><li>Sleep, age, chronic CO<sub>2</sub> retention → flatter line.</li></ul></li>' +
      '<li><b>Low O<sub>2</sub></b> → sensed {{only by peripheral}} receptors → little effect until P<sub>aO2</sub> &lt; about 60.</li>' +
      '<li><b>Hyperventilation</b> → P<sub>CO2</sub> {{↓}}, P<sub>O2</sub> {{↑}}.</li>' +
      '<li><b>Exercise</b> (moderate): ventilation ↑ more than cardiac output; blood gases and pH stay {{normal}}. Heavy exercise → lactic acid → pH ↓.</li>' +
      '<li><b>Altitude</b>: low O<sub>2</sub> → hyperventilation → {{respiratory alkalosis}}; ↑ 2,3-BPG, ↑ EPO.</li></ul>' +
      '<div class="flow col"><div class="fbox start"><b>CO<sub>2</sub> narcosis</b>: COPD retainer gets too much O<sub>2</sub></div><div class="farrow">↓</div>' +
      '<div class="fbox">hypoxic drive removed → {{hypoventilation}} + hypoxic vasoconstriction lost → V/Q worse</div><div class="farrow">↓</div>' +
      '<div class="fbox end">P<sub>aCO2</sub> ↑ → drowsy (acute-on-chronic {{respiratory acidosis}})</div></div></div>' +
      CVS.fig('ctrl-co2-po2', 'Linear ventilatory response to alveolar PCO2 showing a steeper slope and leftward shift when alveolar PO2 is lowered from 110 to 47 mmHg.', 'ctrl', 40) + '</div>' },
  { t: 'q', id: 'R6', src: 'AC80 · AC81', core: true, keep: true,
    q: 'An elderly man comes to the clinic with COPD. He was given O₂ through nasal cannula. His SpO₂ increases from 85 to 99%. After one hour, he is noted with drowsiness. His PaCO₂ increased from 45 to 70 mmHg. Why?',
    o: ['Increased alveolar dead space', 'Right shift of O₂ dissociation curve', 'Hypoxic vasoconstriction', 'Increased metabolic rate due to improved tissue oxygenation', 'Decreased peripheral chemoreceptor stimulation of ventilation'], a: 4,
    ex: 'With chronic CO₂ retention the central drive is blunted, and breathing leans on hypoxic stimulation of the peripheral chemoreceptors. Correcting the hypoxia removes that drive, ventilation falls and CO₂ rises (CO₂ narcosis). Loss of hypoxic vasoconstriction worsens V/Q matching too.',
    flag: 'AC80 asked it in Thai with only two options and keyed “decreased sensitivity of chemoreceptor to CO₂” (the blunted central drive that makes him rely on the hypoxic drive).' },
  { t: 'q', id: 'R7', src: 'AC81', keep: true,
    q: 'Which of the following choices happens during exercise?',
    o: ['Oxygen consumption can not increase more than tenfold compared to rest.', 'Ventilation is increased in proportion higher than cardiac output', 'Intense exercise causes blood lactic to decrease', 'Change on ventilation is entirely caused by lowered pH'], a: 1,
    ex: 'Ventilation can rise 15–20-fold but cardiac output only about 5-fold, so V/Q rises. O₂ consumption can exceed 10× rest in athletes; lactate rises in intense exercise; and the ventilatory rise is mostly neural, not pH-driven.' },
  { t: 'q', id: 'R8', src: 'AC81', keep: true,
    q: 'Which of the following choices is the hyperventilation effect on PO₂ and PCO₂?',
    o: ['Normal PCO₂, normal PO₂', 'Increased PCO₂, increased PO₂', 'Increased PCO₂, decreased PO₂', 'Decreased PCO₂, increased PO₂', 'Decreased PCO₂, decreased PO₂'], a: 3,
    ex: 'Hyperventilation means alveolar ventilation above what CO₂ production needs: PACO₂ falls and, by the alveolar gas equation, PAO₂ rises.',
    flag: 'The raw student key marks C (increased PCO₂, decreased PO₂), which is the effect of <i>hypo</i>ventilation; the recall probably mixed the two. Physiologically the answer is D.' },
  { t: 'c', id: 'R-C5', title: 'Normal and abnormal respiratory patterns', src: 'Resp control p.52–53',
    html: '<div class="stack">' + CVS.fig('ctrl-patterns', 'Normal and abnormal respiratory patterns traced as tidal volume over time.', 'ctrl', 53) +
      '<div class="tblwrap"><table class="tbl compact"><thead><tr><th>Pattern</th><th>Looks like</th><th>Cause</th></tr></thead><tbody>' +

      '<tr><td><b>Cheyne-Stokes</b></td><td>{{crescendo-decrescendo}} → apnea → repeat</td><td>heart failure (slow feedback), brain damage, altitude</td></tr>' +

      '<tr><td><b>Gasping</b></td><td>single sharp gasps, long pauses</td><td>dying brainstem</td></tr></tbody></table></div></div>' },
  { t: 'q', id: 'R9', src: 'Resp control p.8, 11, 53', core: true,
    q: 'Which abnormal respiratory pattern consists of sustained inspiratory plateaus ("inspiratory cramps") interrupted by brief, insufficient expirations, and what brainstem lesion produces it?',
    o: ['Apneusis — rostral pontine lesion damaging the pneumotaxic center (especially with vagal denervation), leaving the lower-pontine apneustic center uninhibited', 'Cheyne-Stokes respiration — lesion of the pre-Botzinger complex causing chaotic irregular breaths', 'Ataxic breathing — isolated lesion of the cerebral cortex with intact pons and medulla', 'Cluster breathing — bilateral carotid body resection abolishing the Hering-Breuer reflex', 'Vagal breathing — overstimulation of the upper-pontine pneumotaxic center'], a: 0,
    ex: 'Apneusis is characterized by prolonged inspiratory plateaus with brief expirations. Because the lower-pontine apneustic center excites inspiration while the upper-pontine pneumotaxic center and vagal stretch afferents switch inspiration off, damaging the upper pons (pneumotaxic center) and vagi produces apneusis.' }
]});

/* Section A: Acid-Base Regulation (681117-2 Acid base regulation Med 2025 student.pdf, 88 slides). */
CVS.add({ id: 'A', short: 'Acid-base', title: 'Acid-Base Regulation', kind: 'Lecture',
  blurb: 'Normal arterial pH, volatile vs fixed acids, the Henderson–Hasselbalch equation, extracellular and intracellular buffers, renal HCO₃⁻ reclamation and new HCO₃⁻ generation, the four primary acid-base disorders with compensation formulas, and the handout’s ABG flowchart with anion gap and delta ratio (interactive).',
  items: [
  { t: 'c', id: 'A-C1', title: 'Arterial pH, acid loads, and the Henderson–Hasselbalch equation', src: 'Acid-base p.4–19',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Normal pH</b> {{7.35–7.45}}.</li>' +
      '<li><b>Two kinds of acid</b><ul><li>{{Volatile}}: CO<sub>2</sub> (as carbonic acid) → by far the biggest load → cleared by the {{lungs}}.</li>' +
      '<li>{{Fixed}}: sulfuric, phosphoric, lactic, keto acids → small load → cleared by the {{kidneys}}.</li></ul></li>' +
      '<li><b>Henderson–Hasselbalch</b>: pH = 6.1 + log(HCO₃⁻ / 0.03 × PaCO₂) → normal ratio {{20 : 1}} → pH 7.40.</li>' +
      '<li><b>Defence by speed</b>: buffers {{seconds}} → breathing minutes → renal hours to days.</li>' +
      '<li><b>Buffers</b><ul><li>Outside cells: {{bicarbonate}} (main; breathing removes its CO<sub>2</sub>).</li>' +
      '<li>Inside cells: phosphate and proteins, e.g. Hb (many {{histidines}}).</li>' +
      '<li>At pH 7.4 phosphate is mostly {{HPO₄²⁻}} (pKa 6.8).</li></ul></li></ul></div>' +
      CVS.fig('acid-buffers', 'Extracellular, intracellular, and renal tubular buffer systems with their pKa values.', 'acid', 16) + '</div>' },
  { t: 'q', id: 'A1', src: 'AC79', keep: true,
    q: 'Which one is the most important metabolic acid load in the body?',
    o: ['Lactic acid', 'Sulfuric acid', 'Carbonic acid', 'Acetic acid', 'Phosphoric acid'], a: 2,
    ex: 'Metabolism makes about 13,000 mmol of CO₂ a day, which forms carbonic acid (the volatile acid) and is cleared by the lungs. Fixed (non-volatile) acids are only about 1 mmol/kg/day.' },
  { t: 'q', id: 'A2', src: 'AC80', core: true, keep: true,
    q: 'A 30-year-old man presents with fatigue after running a marathon. His arterial blood gases show a pH of 7.32, a partial pressure of carbon dioxide of 35 mmHg, and a bicarbonate (HCO₃⁻) concentration 20 mEq/L. Which of the following buffers is the most important in preventing a large change in pH in the patient’s blood?',
    o: ['Hemoglobin', 'Albumin', 'Bicarbonate', 'Phosphate', 'Ammonium'], a: 2,
    ex: 'Lactic acid enters the extracellular fluid, where bicarbonate is the main buffer: it is plentiful and its CO₂ end is removed by the lungs (an open system).' },
  { t: 'q', id: 'A3', src: 'AC81', keep: true,
    q: 'What is the most important buffer in an intracellular environment?',
    o: ['Phosphate', 'Hemoglobin', 'Bicarbonate', 'Albumin', 'Ammonia'], a: 0,
    ex: 'The lecture lists phosphate as playing an important role in cells and urine, and proteins (such as hemoglobin) as abundant intracellular buffers.',
    flag: 'Raw student key: A. The lecture names both phosphate (“important role in cells and urine”) and protein (“abundant in cells, e.g. hemoglobin”) as intracellular buffers, so B is arguable.' },
  { t: 'q', id: 'A4', src: 'AC80', keep: true,
    q: 'What is the dominant form of phosphate at pH 7.4?',
    o: ['H₃PO₄', 'H₂PO₄⁻', 'HPO₄²⁻', 'PO₄³⁻', 'Pyrophosphate'], a: 2,
    ex: 'The relevant pKa (H₂PO₄⁻ ⇌ HPO₄²⁻) is 6.8. At pH 7.4, above the pKa, the base form HPO₄²⁻ dominates (about 4:1).' },
  { t: 'q', id: 'A5', src: 'AC79', keep: true,
    q: 'Which of the following properties makes hemoglobin an important acid-base buffer?',
    o: ['It is a form of titratable acid that is easy to secrete.', 'The pKa is similar to blood pH.', 'Hemoglobin has a lot of histidine residues.', 'It is a type of extracellular buffer that is commonly found in the body.', 'Hemoglobin can bind to carbon dioxide.'], a: 2,
    ex: 'Hemoglobin’s many histidine residues have imidazole groups with a pKa near physiological pH, so they take up and release H⁺. It is an intracellular (red cell) buffer.' },
  { t: 'c', id: 'A-C2', title: 'Renal HCO₃⁻ reclamation vs new HCO₃⁻ generation', src: 'Acid-base p.31–44',
    html: '<div class="two"><div class="stack"><p>The kidney has two jobs:</p>' +
      '<div class="cols2"><div class="mini art"><h4>1 · Reclaim filtered HCO₃⁻</h4><ul>' +
      '<li>Mostly in the {{proximal tubule}} (about 85%).</li>' +
      '<li>Via {{NHE3}} (Na⁺–H⁺ exchanger) + carbonic anhydrase.</li><li>No net acid leaves the body.</li></ul></div>' +
      '<div class="mini ven"><h4>2 · Make new HCO₃⁻</h4><ul>' +
      '<li>Each H⁺ excreted → one new HCO₃⁻ to the blood.</li>' +
      '<li>H⁺ leaves as {{titratable acid}} (phosphate) or ammonium (NH₄⁺).</li>' +
      '<li>Ammonium comes from {{glutamine}} → ↑ a lot in chronic acidosis.</li></ul></div></div>' +
      '<ul class="pts"><li><b>Collecting duct</b>: type A cells secrete {{H⁺}} (acidosis); type B cells secrete HCO₃⁻ via {{pendrin}} (alkalosis).</li>' +
      '<li>Sulfate is not a urine buffer → carries no H⁺ out.</li></ul></div>' +
      '<div class="stack">' +
      CVS.fig('acid-hco3-reabs', 'Segmental reabsorption of filtered HCO₃⁻ along the nephron and proximal mechanism.', 'acid', 35) +
      CVS.fig('acid-titratable', 'Formation of urinary phosphate buffer and generation of new HCO₃⁻ in α-intercalated cells.', 'acid', 39) +
      CVS.fig('acid-nh4', 'Synthesis of NH₄⁺ in the early nephron, countercurrent trapping in TAL, and collecting duct secretion.', 'acid', 41) +
      '</div></div>' },
  { t: 'q', id: 'A6', src: 'AC79', core: true, keep: true,
    q: 'Which of the following is the correct compensatory response to metabolic acidosis?',
    o: ['Decreased HCO₃⁻ regeneration', 'Decreased alveolar ventilation rate', 'Increased glutamate trapping by liver', 'Decreased renal tubular Na⁺-H⁺ exchange', 'Increased glutamine degradation in renal tubular cell'], a: 4,
    ex: 'In acidosis the proximal tubule breaks down more glutamine into NH₄⁺ (excreted) and new HCO₃⁻ (returned to blood). Ventilation rises, Na⁺–H⁺ exchange increases and HCO₃⁻ generation increases.',
    flag: 'PS81 edit keys E.' },
  { t: 'q', id: 'A7', src: 'AC79', keep: true,
    q: 'Which buffer system plays the least role in excreting acid from the body?',
    o: ['Protein', 'Phosphate', 'Bicarbonate', 'Ammonium', 'Sulfate'], a: 4,
    ex: 'Urinary acid leaves as titratable acid (mainly phosphate) and ammonium. Sulfate is an anion of a fixed acid, not a buffer that carries H⁺ out.' },
  { t: 'c', id: 'A-C3', title: 'The four primary acid-base disorders and expected compensation', src: 'Acid-base p.46–61',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>pH follows the ratio</b> HCO₃⁻ ÷ PCO₂ → compensation moves the other value the {{same direction}} → ratio back toward 20 : 1 (never overshoots).</li>' +
      '<li><b>Respiratory acidosis</b>: hypoventilation → PCO₂ ↑ → kidney adds HCO₃⁻<ul><li>per 10 mmHg PCO₂ ↑ → HCO₃⁻ ↑ {{1}} (acute) · ↑ {{3.3–4}} (chronic)</li></ul></li>' +
      '<li><b>Respiratory alkalosis</b>: hyperventilation → PCO₂ ↓ → kidney excretes HCO₃⁻<ul><li>per 10 mmHg PCO₂ ↓ → HCO₃⁻ ↓ {{2}} (acute) · ↓ {{4–5}} (chronic)</li></ul></li>' +
      '<li><b>Metabolic acidosis</b>: HCO₃⁻ ↓ → {{Kussmaul}} breathing → PCO₂ ↓<ul><li>{{Winter}}: expected PCO₂ = 1.5 × HCO₃⁻ + 8 ± 2</li></ul></li>' +
      '<li><b>Metabolic alkalosis</b>: HCO₃⁻ ↑ → hypoventilation → PCO₂ ↑<ul><li>per 10 HCO₃⁻ ↑ → PCO₂ ↑ about {{6}}</li></ul></li>' +
      '<li>Actual value outside the expected one → a {{second disorder}}.</li></ul></div>' +
      CVS.fig('acid-comp-table', 'Summary table of the four primary acid-base disorders and their compensation ratios.', 'acid', 61) + '</div>' +
      '<p class="note"><b>From the past papers</b> · Causes → resp. alkalosis: anxiety, fever, altitude, acute {{aspirin}} poisoning · met. alkalosis: {{vomiting}}, antacids, aldosterone/steroids, diuretics · resp. acidosis: blocked airway (hanging), COPD, CNS-depressant drugs (Acid-base p.49–58, 76; AC79–AC81).</p>' +
      '<p class="trap">Some slide sentences (p.55, 56, 60) say “increase” where the formula has a minus sign → trust the formulas and the table (p.61).</p>' },
  { t: 'q', id: 'A8', src: 'AC81', core: true, keep: true,
    q: 'A 45-year-old male patient ABG result is as follows, pH = 7.25, HCO₃⁻ 12 mEq/L. The main abnormality is metabolic acidosis. What is the expected respiratory compensation?',
    o: ['Hypoventilation to retain CO₂', 'Hyperventilation to reduce pCO₂', 'No compensation needed', 'Increased renal H⁺ excretion', 'Increase minute ventilation without increasing RR'], a: 1,
    ex: 'Metabolic acidosis is compensated by hyperventilation (Kussmaul breathing), lowering PCO₂ toward 1.5 × 12 + 8 ± 2 = 24–28 mmHg. Renal H⁺ excretion is metabolic, not respiratory, compensation.' },
  { t: 'q', id: 'A9', src: 'AC81', core: true, keep: true,
    q: 'pH 7.28 / HCO₃⁻ 16 / PCO₂ 40. What is the expected PCO₂ and the primary cause?',
    o: ['30–34 / metabolic acidosis', '30–34 / respiratory acidosis', '38–42 / normal acid-base', '46–50 / metabolic acidosis', '46–50 / respiratory acidosis'], a: 0,
    ex: 'Low pH with low HCO₃⁻: primary metabolic acidosis. Winter: 1.5 × 16 + 8 ± 2 = 30–34 mmHg. The actual PCO₂ of 40 is above that, so there is also a respiratory acidosis.' },
  { t: 'q', id: 'A10', src: 'AC80', core: true, keep: true,
    q: 'A patient presents to the emergency room with an asthma attack. The arterial blood gas analysis shows the following: pH 7.30, partial pressure of carbon dioxide 55 mmHg, bicarbonate concentration 25 mEq/L. What is the diagnosis for this patient?',
    o: ['Acute respiratory acidosis', 'Chronic respiratory acidosis', 'Metabolic acidosis', 'Metabolic alkalosis', 'Compensated respiratory acidosis'], a: 0,
    ex: 'Acidemia with high PCO₂ is respiratory acidosis. Acutely HCO₃⁻ rises only 1 per 10 mmHg (expected about 25.5); chronically it would be about 29. HCO₃⁻ 25 fits acute.' },
  { t: 'q', id: 'A11', src: 'AC79', keep: true,
    q: 'A 37-year-old woman has arterial blood gas results as follows: pH 7.3, PaCO₂ = 60 mmHg, [HCO₃⁻] = 26 mEq. What is the most likely condition found in this patient?',
    o: ['Metabolic acidosis with respiratory compensation', 'Chronic respiratory acidosis with metabolic compensation', 'Acute respiratory acidosis with some metabolic compensation', 'Mixed metabolic and respiratory acidosis', 'Mixed metabolic acidosis with respiratory alkalosis'], a: 2,
    ex: 'PCO₂ up 20: acute compensation predicts HCO₃⁻ ≈ 26, chronic ≈ 31. HCO₃⁻ 26 matches the acute rule.' },
  { t: 'q', id: 'A12', src: 'AC81', core: true, keep: true,
    q: 'A patient comes with COPD. What should be the expected ABG result?',
    o: ['pH 7.50, PaCO₂ 28 mmHg, HCO₃⁻ 22 mEq/L', 'pH 7.25, PaCO₂ 60 mmHg, HCO₃⁻ 24 mEq/L', 'pH 7.37, PaCO₂ 55 mmHg, HCO₃⁻ 31 mEq/L', 'pH 7.28, PaCO₂ 30 mmHg, HCO₃⁻ 14 mEq/L', 'pH 7.45, PaCO₂ 40 mmHg, HCO₃⁻ 28 mEq/L'], a: 2,
    ex: 'Stable COPD retains CO₂ chronically, and the kidney has had days to raise HCO₃⁻ (about 3.5 per 10 mmHg: 24 + 5 ≈ 29–31), so pH is near normal. B is acute respiratory acidosis.' },
  { t: 'q', id: 'A13', src: 'AC79', keep: true,
    q: 'Which of the following formulas is the correct one for calculating blood bicarbonate concentration in the condition of chronic respiratory acidosis?',
    o: ['[HCO₃⁻] = [(PCO₂ − 40)/10] + 24', '[HCO₃⁻] = [(PCO₂ − 40)/3] + 24', '[HCO₃⁻] = 24 − [(40 − PCO₂)/5]', '[HCO₃⁻] = 24 − [(40 − PCO₂)/2]', '[HCO₃⁻] = [(PCO₂ − 40)/5] + 24'], a: 1,
    ex: 'Chronic respiratory acidosis raises HCO₃⁻ about 3–4 per 10 mmHg of PCO₂, i.e. (ΔPCO₂)/3. A is acute acidosis (1 per 10); D is acute alkalosis (2 per 10); C is chronic alkalosis (4–5 per 10).' },
  { t: 'q', id: 'A14', src: 'AC80', keep: true,
    q: 'ขึ้นที่สูงเป็นระยะเวลานาน เมื่อตรวจวัดค่าต่างๆในเลือด ข้อใดน่าจะใกล้เคียงที่สุดกับการปรับตัวนี้ <span class="muted">After a long stay at high altitude, which blood values best fit the adaptation?</span>',
    o: ['pH 7.48, pCO₂ 30, HCO₃⁻ 23', 'pH 7.40, pCO₂ 19, HCO₃⁻ 20', 'pH 7.43, pCO₂ 30, HCO₃⁻ 18'], a: 2,
    ex: 'Altitude causes a respiratory alkalosis. After days the kidney excretes HCO₃⁻ (4–5 per 10 mmHg fall in PCO₂), bringing pH back near normal: pH 7.43, PCO₂ 30, HCO₃⁻ 18. Option 1 (HCO₃⁻ down only 1–2) is the acute picture; option 2 is internally inconsistent.',
    flag: 'The AC80 student key marks option 1, which is the <i>acute</i> picture. The stem says “for a long time”, and the lecture’s chronic rule (HCO₃⁻ falls 4–5 per 10 mmHg) gives option 3.' },
  { t: 'q', id: 'A15', src: 'AC80', keep: true,
    q: 'Which of the following conditions is a potential cause of respiratory alkalosis?',
    o: ['Aspirin poisoning', 'Neuromuscular disorder', 'Methanol', 'Vomiting', 'Obstructive pulmonary disease'], a: 0,
    ex: 'Salicylate directly stimulates the respiratory center, causing hyperventilation and respiratory alkalosis (later a metabolic acidosis too). Neuromuscular disease and COPD cause respiratory acidosis; methanol a metabolic acidosis; vomiting a metabolic alkalosis.' },
  { t: 'q', id: 'A16', src: 'AC79', keep: true,
    q: 'A 15-year-old female has been rescued from a suicide attempt via rope hanging. After the rescue, she seems to be breathing normally again after a few minutes. What is the most likely arterial blood gas results right after she is rescued compared to the normal values?',
    o: ['Increased [HCO₃⁻]', 'Decreased [CO₂] of exhaled air', 'Increased PaCO₂', 'Increased PaO₂', 'Normal PaO₂'], a: 2,
    ex: 'Hanging obstructs the airway: she could not breathe, so CO₂ built up (acute respiratory acidosis) and PaO₂ fell. HCO₃⁻ barely changes acutely.' },
  { t: 'q', id: 'A17', src: 'AC81', keep: true,
    q: 'A woman had treatment for hypertension. pH 7.48, pCO₂ 48, HCO₃⁻ 33. What is the cause of the ABG result?',
    o: ['Renal loss of H⁺ from diuretic', 'Diarrhea', 'Decreased ventilation from drug overdose', 'CO₂ retention', 'Lactate accumulation'], a: 0,
    ex: 'Alkalemia with high HCO₃⁻ and compensating PCO₂: metabolic alkalosis. Thiazide and loop diuretics cause it through volume contraction and renal H⁺ (and K⁺) loss.' },
  { t: 'c', id: 'A-C4', title: 'Plasma anion gap, HAGMA vs NAGMA, and the delta ratio', src: 'Acid-base p.64–75',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Electroneutrality</b>: cations = anions → AG = Na⁺ − (Cl⁻ + HCO₃⁻) = the {{unmeasured anions}} → normal ≈ {{12}}.</li>' +
      '<li><b>Acid that brings its own anion</b> (lactate, ketoacid) → the anion replaces HCO₃⁻ → Cl⁻ unchanged → <b>AG ↑</b> (HAGMA)<ul><li>{{MUDPILES}}: methanol/metformin, uremia, {{diabetic ketoacidosis}}, paracetamol, isoniazid, lactate, ethanol/ethylene glycol, salicylate</li></ul></li>' +
      '<li><b>HCO₃⁻ lost</b> → {{Cl⁻}} replaces it → AG normal (hyperchloremic, NAGMA)<ul><li>{{diarrhea}}, renal tubular acidosis type 1, NH₄Cl ingestion, saline with excess Cl⁻</li></ul></li>' +
      '<li><b>Albumin</b> = the main unmeasured anion → albumin ↓ → AG ↓ → a HAGMA can hide → corrected AG = AG + {{2.5}} × (4 − albumin).</li>' +
      '<li><b>Delta ratio</b> = (AG − 12) ÷ (24 − HCO₃⁻) → &lt; {{0.4}} pure NAGMA · 0.4–0.8 both · 1–2 pure HAGMA · &gt; 2 + metabolic alkalosis.</li></ul></div>' +
      CVS.fig('acid-ag', 'Electrolyte Gamblegrams comparing Normal, High Anion Gap (normochloremic), and Normal Anion Gap (hyperchloremic) metabolic acidosis.', 'acid', 66) + '</div>' },
  { t: 'q', id: 'A18', src: 'AC81', core: true, keep: true,
    q: 'Why do we need to account for albumin when calculating anion gap?',
    o: ['It is a major buffer protein', 'It has an effect on HCO₃⁻', 'It increases Cl⁻', 'It is a major unmeasured anion', 'It altered measured Na⁺'], a: 3,
    ex: 'The anion gap is made mostly of unmeasured anions, and albumin is the biggest of them. Low albumin lowers the gap and can hide a high-anion-gap acidosis, so the gap is corrected for albumin.',
    flag: 'The raw student key marks A (“major buffer protein”). The lecture lists albumin among the unmeasured anions that make up the gap (Acid-base p.65), which is why it must be accounted for: D.' },
  { t: 'q', id: 'A19', src: 'AC79', keep: true,
    q: 'Which of the following conditions has acid-base indices in the same direction as diabetic ketoacidosis?',
    o: ['Shortness of breath', 'Vomiting', 'Hyperventilation', 'Anti-acid ingestion', 'Diarrhea'], a: 4,

  function respComp(v, acid) {
    var H = v.hco3, d = Math.abs(v.pco2 - 40), sg = acid ? 1 : -1;
    var ac = 24 + sg * (acid ? .1 : .2) * d, c1 = 24 + sg * (acid ? .33 : .4) * d, c2 = 24 + sg * (acid ? .4 : .5) * d;
    var lo = Math.min(c1, c2), hi = Math.max(c1, c2), res, add = null;
    var away = acid ? H - ac : ac - H;   /* > 0 when HCO3 moved in the compensating direction beyond acute */
    var farC = acid ? H - hi : lo - H;   /* > 0 when beyond chronic */
    if (away < -1) { res = 'too little'; add = acid ? 'metabolic acidosis' : 'metabolic alkalosis'; }
    else if (away <= 1) res = (acid ? H >= lo - 1 : H <= hi + 1) ? 'acute or chronic (too small to tell)' : 'acute';
    else if (acid ? H < lo - 1 : H > hi + 1) res = 'partly compensated (acute on chronic)';
    else if (farC <= 1) res = 'chronic';
    else { res = 'too much'; add = acid ? 'metabolic alkalosis' : 'metabolic acidosis'; }
    var txt = 'ΔPCO₂ = ' + d + ' → expected HCO₃⁻: acute ≈ <b>' + r1(ac) + '</b>, chronic ≈ <b>' + r1(lo) + (r1(lo) !== r1(hi) ? '–' + r1(hi) : '') + '</b>. Actual <b>' + H + '</b> → ';

    else txt += '<b>' + res + '</b>.';
