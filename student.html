      '<tr><td><b>Myoglobin</b> (heart &amp; skeletal muscle)</td><td>Monomer: {{153 amino acids}}, MW {{16,700 Da}}, 1 heme</td><td><b>Rectangular {{hyperbolic}}</b> curve (higher affinity than HbA, tight binding at low &amp; high P<sub>O2</sub>), <b>no cooperativity</b>, does <b>not</b> bind H<sup>+</sup> or CO<sub>2</sub></td></tr></tbody></table></div></div>' +
      CVS.fig('trans-myoglobin', 'Myoglobin monomer structure and its oxygen dissociation curve compared with HbA.', 'trans', 38) + '</div>' },
  { t: 'q', id: 'T9', src: 'Gas transport p.35–36', core: true,
    q: 'Why does fetal hemoglobin (HbF) have a higher affinity for oxygen (left-shifted dissociation curve) than maternal adult hemoglobin (HbA), and what is its subunit composition?',
    o: ['HbF is α2γ2 and does not bind (or only loosely binds) 2,3-BPG, keeping it in a higher-affinity state to extract O2 across the placenta',
        'HbF is ζ2ε2 (Gower 1) and binds two molecules of 2,3-BPG covalently per tetramer',
        'HbF is α2δ2 and contains ferric iron (Fe3+) which binds O2 210 times tighter than Fe2+',
        'HbF is a monomeric protein of 153 amino acids with a rectangular hyperbolic curve',
        'HbF has a lower affinity for O2 (P50 = 48 mmHg) because γ-chains form stronger salt bridges with Asp94'], a: 0,
    ex: 'Fetal hemoglobin (HbF, α2γ2) replaces the β-chains of HbA (α2β2) with γ-chains that lack the positively charged residues needed to bind 2,3-BPG tightly. Because HbF does not bind (or loosely binds) 2,3-BPG, its O2-Hb dissociation curve is shifted to the left (higher O2 affinity than HbA), enabling O2 transfer from mother to fetus.' },
  { t: 'q', id: 'T10', src: 'Gas transport p.34, 36–37', core: true,
    q: 'Which statement correctly matches an abnormal hemoglobin derivative with its mechanism and chemical cause?',
    o: ['Carboxyhemoglobin: CO binds heme Fe2+ with 210× the affinity of O2 (left shift) · Methemoglobin: Fe3+ replaces Fe2+ · Sulfhemoglobin: sulfur atom replaces ferrous iron after exposure to hydroxylamine sulfate',
        'Carboxyhemoglobin: CO2 binds N-terminal globin with 210× the affinity of O2 (right shift) · Methemoglobin: sulfur replaces Fe2+',
        'Methemoglobin: Fe2+ is reduced to Fe+ · Sulfhemoglobin: caused by nitric oxide inhalation',
        'Carboxyhemoglobin: shifts the O2 dissociation curve strongly to the right (P50 = 48 mmHg) to increase tissue O2 delivery',
        'Sulfhemoglobin: glucose binds α2β2 up to 12% in patients exposed to hydroxylamine sulfate'], a: 0,
    ex: 'CO binds to heme Fe2+ with 210 times the affinity of O2 to form carboxyhemoglobin, shifting the O2 dissociation curve to the left and causing tissue hypoxia. Methemoglobin has ferric (Fe3+) in place of ferrous (Fe2+) iron. Sulfhemoglobin has a sulfur atom replacing the ferrous atom after exposure to sulfur-containing corrosive agents such as hydroxylamine sulfate ((NH2OH)2H2SO4).' },
  { t: 'q', id: 'T11', src: 'Gas transport p.38–39', core: true,
    q: 'How does <b>myoglobin</b> differ structurally and functionally from <b>hemoglobin A</b>?',
    o: ['Myoglobin is a 153-amino-acid monomer (MW 16,700 Da) in heart and skeletal muscle with a rectangular hyperbolic O2 curve (higher affinity than HbA), no cooperativity, and no binding to H+ or CO2',
        'Myoglobin is a 4-subunit tetramer (MW 64,500 Da) in RBCs with a sigmoidal curve and a strong Bohr effect',
        'Myoglobin has lower O2 affinity than HbA at low PO2, allowing it to unload O2 into arterial plasma',
        'Myoglobin binds 2,3-BPG in a 1:1 ratio to shift its hyperbolic curve into a sigmoidal curve during exercise',
        'Myoglobin contains 4 heme groups on a single 141-amino-acid polypeptide chain'], a: 0,
    ex: 'Myoglobin is a single-chain monomeric globular protein (153 AA, MW 16,700 Da, 1 heme) located in heart and skeletal muscle cells. Unlike tetrameric HbA (α2β2, MW 64,500 Da, sigmoidal curve), myoglobin has a rectangular hyperbolic O2 dissociation curve (tight binding at both low and high PO2, higher O2 affinity than HbA), exhibits no allosteric cooperativity, and does not bind H+ or CO2.' },

  { t: 'c', id: 'T-C5', title: 'CO2 transport in blood, Bohr effect & Haldane effect', src: 'Gas transport p.40–43',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Three forms of CO<sub>2</sub> in blood</b> (Gas transport p.41): (1) {{7%}} physically dissolved in plasma; (2) {{23%}} bound to globin N-terminal &minus;NH<sub>2</sub> as <b>carbaminohemoglobin</b>; (3) {{70%}} converted to <b>bicarbonate (HCO<sub>3</sub><sup>&minus;</sup>)</b> in RBCs (<i>note: Gas exchange p.33 lists 5% dissolved, 3% carbaminoHb, and &gt;90% HCO<sub>3</sub><sup>&minus;</sup>; in both lectures HCO<sub>3</sub><sup>&minus;</sup> is the major form</i>).</li>' +
      '<li><b>RBC bicarbonate pathway &amp; chloride shift</b>: RBC {{carbonic anhydrase}} catalyzes CO<sub>2</sub> + H<sub>2</sub>O &rightleftharpoons; H<sub>2</sub>CO<sub>3</sub> &rightleftharpoons; H<sup>+</sup> + HCO<sub>3</sub><sup>&minus;</sup>; H<sup>+</sup> is buffered by deoxyHb (HHb) while HCO<sub>3</sub><sup>&minus;</sup> exits the RBC in exchange for {{Cl&minus;}} entering.</li>' +
      '<li><b>{{Bohr effect}}</b> (occurs in {{systemic capillaries}}): adding metabolically produced <b>H<sup>+</sup> and CO<sub>2</sub> decreases O<sub>2</sub>–Hb affinity</b> (right shift), promoting O<sub>2</sub> release to tissues.</li>' +
      '<li><b>{{Haldane effect}}</b> (occurs in <b>alveolar capillaries</b>): <b>oxygenation of Hb decreases its affinity for CO<sub>2</sub> and H<sup>+</sup></b>, releasing H<sup>+</sup> to combine with HCO<sub>3</sub><sup>&minus;</sup> &rarr; H<sub>2</sub>CO<sub>3</sub> &rarr; CO<sub>2</sub> + H<sub>2</sub>O for exhalation.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('trans-co2', 'Three mechanisms of carbon dioxide transport in red blood cells and plasma.', 'trans', 41) + CVS.fig('trans-bohr-haldane', 'Coupling of oxygen and carbon dioxide transport between lungs and tissues.', 'trans', 43) + '</div></div>' },
  { t: 'q', id: 'T12', src: 'Gas transport p.40–41; Gas exchange p.33', core: true,
    flag: 'Slide conflict: Gas Transport p.41 gives 7% dissolved, 23% carbaminohemoglobin, and 70% HCO3−, whereas Gas Exchange p.33 gives 5% dissolved, 3% carbaminohemoglobin, and 90+% HCO3−. Both agree that HCO3− is the major form.',
    q: 'What is the <b>major form</b> in which CO<sub>2</sub> is transported in blood, and which enzyme and ion-exchange process inside red blood cells generate it?',
    o: ['Bicarbonate ion (HCO3−, 70% in Gas Transport / 90+% in Gas Exchange), formed via RBC carbonic anhydrase with HCO3− exported in exchange for Cl− (chloride shift)',
        'Carbaminohemoglobin (70%), formed by carbonic anhydrase attaching CO2 to heme Fe2+ in exchange for Na+',
        'Dissolved CO2 gas in plasma (70%), driven by the Haldane pump across capillary endothelium',
        'Carbonic acid bound to plasma albumin (90%), exchanged for K+ across the RBC membrane',
        'Carboxyhemoglobin (23%), catalyzed by 2,3-BPG mutase in plasma'], a: 0,
    ex: 'Most CO2 in blood is transported as bicarbonate (HCO3−: 70% on Gas Transport p.41 [with 23% carbaminoHb and 7% dissolved], or 90+% on Gas Exchange p.33 [with 3% carbaminoHb and 5% dissolved]). Inside RBCs, carbonic anhydrase converts CO2 + H2O → H2CO3 → H+ + HCO3−; HCO3− diffuses out into plasma in exchange for Cl− (the chloride shift), while deoxyHb buffers H+.' },
  { t: 'q', id: 'T13', src: 'Gas transport p.43', core: true,
    q: 'Which statement correctly distinguishes the <b>Bohr effect</b> from the <b>Haldane effect</b>?',
    o: ['Bohr effect (systemic capillaries): adding H+ and CO2 lowers O2–Hb affinity to unload O2 · Haldane effect (alveolar capillaries): oxygenation of Hb lowers CO2–Hb and HHb affinity to unload CO2',
        'Bohr effect (alveolar capillaries): oxygenation of Hb increases CO2 binding · Haldane effect (systemic capillaries): high CO2 increases O2–Hb affinity',
        'Bohr effect occurs only in myoglobin · Haldane effect occurs only in fetal hemoglobin (HbF)',
        'Bohr effect is the exchange of Cl− for HCO3− across the RBC membrane · Haldane effect is the binding of 2,3-BPG to β-chains',
        'Both effects describe the leftward shift of the O2 dissociation curve during exercise'], a: 0,
    ex: 'On slide 43, the Bohr effect operates in systemic capillaries: adding H+ and CO2 from tissue metabolism decreases O2–Hb affinity, promoting O2 release to tissues. The Haldane effect operates in alveolar capillaries: oxygenation of Hb (forming HbO2) decreases the affinity of Hb for CO2 and H+, promoting conversion of HCO3− + H+ → H2CO3 → CO2 + H2O and unloading of CO2 into the alveoli.' }
]});

/* Section C: Pulmonary Circulation, Vascular Resistance & Pulmonary Edema (681117-3 Pulmonary circulation.pdf, 27 pages). */
CVS.add({ id: 'C', short: 'Pulm circulation', title: 'Pulmonary Circulation, Vascular Resistance & Pulmonary Edema', kind: 'Lecture',
  blurb: 'Pulmonary vs bronchial and systemic circulation, recruitment and distension, alveolar vs extra-alveolar vessels and lung volume (FRC), vasoactive mediators and hypoxic pulmonary vasoconstriction, West zones, Starling law, and interstitial vs alveolar pulmonary edema.',
  items: [
  { t: 'c', id: 'C-C1', title: 'Pulmonary vs systemic & bronchial circulation', src: 'Pulm circulation p.4–7',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Pulmonary circulation</b>: walls of the pulmonary artery and its branches are remarkably thin and contain {{little smooth muscle}}, operating at <b>{{low pressure}}</b> (PA ~25/8 mmHg, mean {{15 mmHg}} vs systemic 120/80, mean 100 mmHg) and <b>{{low resistance}}</b> while carrying the <b>{{same flow}}</b> (equal cardiac output from RV and LV, since Flow = Pressure / Resistance).</li>' +
      '<li><b>Function</b>: systemic circulation regulates blood supply to organs far above the heart (brain), whereas the pulmonary circulation only needs to lift blood to the top of the lung.</li>' +
      '<li><b>Bronchial circulation</b>: branches from the {{aorta and intercostal arteries}} at <b>high systemic pressure</b> to supply the conducting airways down to about the {{terminal bronchioles}}.</li>' +
      '<li><b>Bronchial venous drainage</b>: carried away from the lung partly via the {{pulmonary veins}} (entering the left atrium as part of the 2% physiologic R-to-L shunt) and partly via the systemic venous circulation.</li></ul></div>' +
      CVS.fig('circ-pressures', 'Comparison of pressures in the pulmonary vs systemic circulation.', 'circ', 5) + '</div>' },
  { t: 'q', id: 'C1', src: 'Pulm circulation p.5, 7', core: true,
    q: 'Which of the following statements is correct regarding the <b>pulmonary circulation</b> compared with the systemic circulation?',
    o: ['Both lower pressure and lower resistance (with the same flow)',
        'Lower blood flow (about 1/6 of left ventricular cardiac output)',
        'Higher vascular resistance due to thick pulmonary arterial smooth muscle',
        'Same arterial pressure and resistance as the bronchial circulation',
        'Higher mean arterial pressure (100 mmHg vs 15 mmHg)'], a: 0,
    ex: 'On slide 5 and the in-slide MCQ on slide 7, the pulmonary circulation has thin-walled vessels with little smooth muscle, giving it much lower pressure and much lower resistance than the systemic circulation while carrying the same total flow (equal cardiac output from RV and LV).' },
  { t: 'q', id: 'C2', src: 'Pulm circulation p.6', core: true,
    q: 'Which statement accurately describes the <b>bronchial circulation</b>?',
    o: ['It branches from the aorta and intercostal arteries at high systemic pressure, supplies conducting airways down to the terminal bronchioles, and drains partly via pulmonary veins and partly via systemic veins',
        'It branches from the main pulmonary artery at low pressure (mean 15 mmHg) to perfuse the respiratory bronchioles and alveoli',
        'It carries 50% of right ventricular cardiac output and drains exclusively into the superior vena cava',
        'It has lower pressure and lower resistance than the pulmonary circulation',
        'It supplies only the visceral pleura and has no connection to the pulmonary veins'], a: 0,
    ex: 'The bronchial circulation arises from the aorta and intercostal arteries (high pressure like the systemic circulation), supplies the conducting airways down to about the terminal bronchioles, and drains away from the lung via both the pulmonary veins (creating a small anatomic R-to-L shunt) and the systemic circulation.' },
  { t: 'tf', id: 'C3', src: 'Pulm circulation p.5',
    q: 'Because pulmonary arterial pressure is much lower than systemic arterial pressure, total blood flow (cardiac output) through the pulmonary circulation is much lower than through the systemic circulation.', a: false,
    ex: 'False. Flow = Pressure / Resistance. Because pulmonary vascular resistance is proportionally lower than systemic vascular resistance, the pulmonary circulation carries the exact same flow (cardiac output) as the systemic circulation at a much lower pressure.' },

  { t: 'c', id: 'C-C2', title: 'Pulmonary vascular resistance (PVR): recruitment, distension & lung volume', src: 'Pulm circulation p.10–13, 16',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Rising pulmonary pressure or blood flow lowers PVR</b> via two passive mechanisms that occur together (e.g., during {{exercise}}):</li>' +
      '<li><b>1. {{Recruitment}} (main mechanism)</b>: at rest, some capillaries are closed or open with no flow; as pressure rises, these closed vessels begin conducting blood, lowering overall PVR.</li>' +
      '<li><b>2. {{Distension}}</b>: high-compliance capillaries change shape from near-flattened to more circular (widening caliber).</li>' +
      '<li><b>{{Alveolar vessels}}</b> (capillaries and corner vessels exposed to alveolar pressure): at <b>high lung volume</b> they are <b>more squashed (&uparrow; PVR)</b>; at low lung volume they are less squashed (&downarrow; PVR).</li>' +
      '<li><b>{{Extra-alveolar vessels}}</b> (arteries and veins running through lung parenchyma): at <b>high lung volume</b> they have <b>lower PVR</b> due to {{radial traction}} of elastic parenchyma and more negative intrapleural pressure; at <b>low lung volume</b> their smooth muscle and elastic tissue resist expansion and narrow caliber (<b>&uparrow; PVR</b>).</li>' +
      '<li><b>Combined U-shaped curve</b>: total PVR is <b>lowest at {{FRC}}</b> and increases when lung volume moves away toward {{TLC or RV}}.</li></ul></div>' +
      '<div class="stack">' + CVS.fig('circ-recruit', 'Opening of closed capillaries and widening of open capillaries as pulmonary pressure rises.', 'circ', 10) + CVS.fig('circ-pvr-vol', 'Opposing effects of lung volume on the two vessel types, producing a U-shaped total resistance curve.', 'circ', 13) + '</div></div>' },
  { t: 'q', id: 'C4', src: 'Pulm circulation p.10–11', core: true,
    q: 'When cardiac output and pulmonary blood flow increase during exercise, what happens to pulmonary vascular resistance (PVR), and what is the <b>main mechanism</b> responsible at initial pressure rises?',
    o: ['PVR decreases · capillary recruitment (opening of previously closed or non-flowing vessels) is the main mechanism, accompanied by capillary distension',
        'PVR increases · sympathetic α1-mediated vasoconstriction of alveolar capillaries',
        'PVR decreases · active nitric oxide synthesis triggered by alveolar hypocapnia is the sole mechanism',
        'PVR remains unchanged · rigid pulmonary capillaries cannot change caliber or number',
        'PVR increases · compression of extra-alveolar vessels by radial traction'], a: 0,
    ex: 'As pulmonary arterial pressure or blood flow rises (such as during exercise), PVR falls because of capillary recruitment (the main mechanism, where closed or non-perfused capillaries open to conduct blood) together with capillary distension (flattening capillaries become more circular).' },
  { t: 'q', id: 'C5', src: 'Pulm circulation p.12–13, 16', core: true,
    q: 'Why does total pulmonary vascular resistance (PVR) follow a U-shaped curve that is <b>lowest at functional residual capacity (FRC)</b> and higher at both total lung capacity (TLC) and residual volume (RV)?',
    o: ['At high lung volume (toward TLC) alveolar vessels are squashed; at low lung volume (toward RV) extra-alveolar vessels narrow due to loss of radial traction and less negative intrapleural pressure',
        'At high lung volume extra-alveolar vessels are squashed; at low lung volume alveolar capillaries are stretched shut by radial traction',
        'Both alveolar and extra-alveolar vessels have their highest resistance at FRC and lowest resistance at RV',
        'Hypoxic pulmonary vasoconstriction occurs only at TLC and RV',
        'Capillary recruitment only occurs at FRC and ceases completely above or below FRC'], a: 0,
    ex: 'Alveolar vessels (capillaries in alveolar walls) are compressed when alveoli expand toward TLC (↑ PVR at high volume), whereas extra-alveolar vessels (arteries/veins in parenchyma) are pulled open by radial traction and negative Ppl at high volume but narrow due to their smooth muscle and elastic recoil toward RV (↑ PVR at low volume). Consequently, total PVR is lowest at FRC.' },

  { t: 'c', id: 'C-C3', title: 'Vasoactive mediators, hypoxic pulmonary vasoconstriction (HPV) & gravity zones', src: 'Pulm circulation p.14–19',
    html: '<div class="two"><div class="stack"><div class="tblwrap"><table class="tbl"><thead><tr><th>Effect on PVR</th><th>Mediators &amp; Conditions</th></tr></thead><tbody>' +
      '<tr><td><b>Pulmonary vasoconstrictors (&uparrow; PVR)</b></td><td>{{Endothelin}}, serotonin, histamine, norepinephrine, {{thromboxane A2}}, and <b>alveolar hypoxia</b></td></tr>' +
      '<tr><td><b>Pulmonary vasodilators (&downarrow; PVR)</b></td><td>{{Nitric oxide}}, {{phosphodiesterase inhibitors}}, {{prostacyclin (PGI2)}}, calcium channel blockers, and acetylcholine</td></tr></tbody></table></div>' +
      '<ul class="pts">' +
      '<li><b>Hypoxic pulmonary vasoconstriction (HPV)</b>: opposite to systemic organs! When alveolar P<sub>AO2</sub> falls below {{70 mmHg}}, vascular smooth muscle contracts locally to redirect blood <b>away from poorly ventilated (hypoxic) regions</b> toward well-ventilated alveoli, {{reducing shunt}}.</li>' +
      '<li><b>Fetal &rarr; neonatal transition</b>: generalized HPV keeps fetal PVR very high; with the {{first breath}}, alveolar oxygenation markedly decreases PVR and increases pulmonary blood flow.</li>' +
      '<li><b>Gravity &amp; West zones (upright)</b>: the <b>apex</b> has lower intravascular pressure, less recruitment/distension, higher resistance, and less perfusion; the <b>base ({{Zone 3}})</b> has higher intravascular pressure, more recruitment/distension, lower resistance, and the most perfusion (normal V/Q = 0.8–1).</li></ul></div>' +
      '<div class="stack">' + CVS.fig('circ-vaso', 'Signaling pathways of pulmonary vasoconstrictors and vasodilators in vascular smooth muscle.', 'circ', 14) + CVS.fig('circ-zones', 'Effect of gravity on pulmonary perfusion and West zones in the upright lung.', 'circ', 19) + '</div></div>' },
  { t: 'q', id: 'C6', src: 'Pulm circulation p.14–17', core: true,
    q: 'Which of the following <b>increases</b> pulmonary vascular resistance (PVR)?',
    o: ['Hypoxia', 'Nitric oxide', 'Lung volume at FRC', 'Endothelin antagonist', 'Distension of pulmonary capillary'], a: 0,
    ex: 'Alveolar hypoxia (PAO2 < 70 mmHg) triggers hypoxic pulmonary vasoconstriction, which increases PVR. Nitric oxide, lung volume at FRC, endothelin receptor antagonists, and capillary distension all decrease PVR.' },
  { t: 'q', id: 'C7', src: 'Pulm circulation p.14–16', core: true,
    q: 'What is the physiological threshold and purpose of <b>hypoxic pulmonary vasoconstriction (HPV)</b> in adults, and how does it behave in the fetus?',
    o: ['When PAO2 < 70 mmHg, local vasoconstriction diverts blood away from poorly ventilated alveoli toward well-ventilated alveoli to decrease shunt; in the fetus, generalized HPV keeps PVR high until the first oxygenated breath markedly lowers PVR',
        'When PaO2 < 100 mmHg, pulmonary vasodilation increases blood flow to hypoxic alveoli to maximize O2 uptake; fetal PVR is near zero in utero',
        'When PACO2 < 40 mmHg, vasoconstriction shunts blood from the base (Zone 3) to the apex (Zone 1)',
        'HPV is mediated by prostacyclin (PGI2) and nitric oxide and increases right-to-left intrapulmonary shunt',
        'HPV occurs only in systemic arteries (such as the brain and heart) while pulmonary vessels dilate during hypoxia'], a: 0,
    ex: 'Unlike systemic beds (which dilate in hypoxia), pulmonary vascular smooth muscle constricts when PAO2 < 70 mmHg. Localized HPV redirects blood away from hypoxic, poorly ventilated alveoli toward well-ventilated regions, reducing V/Q mismatch and shunt. In the fetus, generalized HPV keeps PVR very high until the first breath oxygenates the alveoli and drops PVR.' },
  { t: 'tf', id: 'C8', src: 'Pulm circulation p.19',
    q: 'In an upright adult, the base of the lung (Zone 3) has lower intravascular pressure, less capillary recruitment and distension, and higher vascular resistance than the apex.', a: false,
    ex: 'False. Due to gravity, the base of the upright lung (Zone 3) has higher intravascular pressure, which causes more recruitment and distension, lower vascular resistance, and greater perfusion than the apex.' },

  { t: 'c', id: 'C-C4', title: 'Starling’s equation, lung water balance & pulmonary edema', src: 'Pulm circulation p.21–24',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li><b>Starling’s equation</b> across the 0.3 &mu;m capillary barrier (as printed on slides 21 &amp; 24): Net fluid out = K[(P<sub>c</sub> &minus; P<sub>i</sub>) &minus; &sigma;(&pi;<sub>i</sub> &minus; &pi;<sub>c</sub>)] (<i>note: standard physiology writes &sigma;(&pi;<sub>c</sub> &minus; &pi;<sub>i</sub>) since capillary oncotic pressure &pi;<sub>c</sub> opposes outward filtration</i>), where &sigma; is the {{reflection coefficient}} (protein impermeability).</li>' +
      '<li><b>Normal baseline</b>: net Starling pressure is slightly outward, balanced by a continuous perivascular lymph flow of ~{{20 mL/h}}.</li>' +
      '<li><b>Stage 1 — {{Interstitial edema}} (early)</b>: fluid engorges perivascular and peribronchial spaces (seen on CXR as {{peribronchial cuffing}}); compensated by perivascular lymphatics draining fluid to the {{hilar lymph nodes}}.</li>' +
      '<li><b>Stage 2 — {{Alveolar edema}} (late, severe)</b>: when maximal interstitial drainage is exceeded, fluid crosses the alveolar wall and floods alveoli one by one (&rarr; unventilated alveoli, V/Q mismatch, and severe <b>shunt</b>); compensated by active fluid pumping via epithelial {{Na+/K+-ATPase}}.</li>' +
      '<li><b>Causes</b>: <b>Cardiac (&uparrow; P<sub>c</sub>)</b> from &uparrow; afterload (LV failure, {{mitral stenosis}}) or &uparrow; preload (fluid overload) vs <b>Non-cardiac</b> from &downarrow; &pi;<sub>c</sub> (protein starvation, renal/GI loss, hemodilution), &uparrow; {{Filtration coefficient (K)}} / permeability (acute lung injury, sepsis, O<sub>2</sub> toxicity), or &downarrow; lymphatic drainage.</li></ul></div>' +
      CVS.fig('circ-starling', 'Starling forces across the pulmonary capillary endothelium and lymphatic drainage.', 'circ', 21) + '</div>' },
  { t: 'q', id: 'C9', src: 'Pulm circulation p.21, 24', core: true,
    flag: 'Slide formula note: Slides 21 and 24 print Net fluid out = K[(Pc − Pi) − σ(πi − πc)], whereas standard physiology writes K[(Pc − Pi) − σ(πc − πi)] because capillary oncotic pressure (πc) opposes outward hydrostatic filtration (as confirmed by slide 24’s table showing ↓ πc causes edema).',
    q: 'According to the lecture’s classification of pulmonary edema mechanisms, which clinical condition causes <b>cardiogenic</b> pulmonary edema via increased capillary hydrostatic pressure (P<sub>c</sub>), and which causes <b>non-cardiogenic</b> edema via an increased filtration coefficient (K)?',
    o: ['Cardiogenic (↑ Pc): left ventricular failure, mitral stenosis, or fluid overload · Non-cardiogenic (↑ K / permeability): acute lung injury, sepsis, or oxygen toxicity',
        'Cardiogenic (↑ Pc): protein starvation or nephrotic syndrome · Non-cardiogenic (↑ K): mitral stenosis',
        'Cardiogenic (↓ πc): hemodilution · Non-cardiogenic (↓ Pc): lymphatic obstruction',
        'Cardiogenic (↑ σ): oxygen toxicity · Non-cardiogenic (↓ K): left ventricular failure',
        'Cardiogenic (↑ lymph flow): sepsis · Non-cardiogenic (↑ πc): renal protein loss'], a: 0,
    ex: 'Slide 24 classifies ↑ Pc as cardiac (increased afterload from LV failure or mitral stenosis; increased preload from fluid overload), whereas non-cardiac edema results from ↓ πc (protein starvation, renal/GI protein loss, hemodilution), ↑ filtration coefficient K / capillary permeability (acute lung injury, sepsis, O2 toxicity), or ↓ lymphatic drainage (obstruction/injury).' },
  { t: 'q', id: 'C10', src: 'Pulm circulation p.22–23', core: true,
    q: 'What distinguishes <b>early (interstitial)</b> pulmonary edema from <b>late (alveolar)</b> pulmonary edema in terms of fluid location, radiographic sign, gas-exchange impact, and compensatory clearance mechanism?',
    o: ['Early: fluid in perivascular/peribronchial interstitium (peribronchial cuffing), drained by perivascular lymphatics to hilar lymph nodes · Late: fluid floods alveoli one by one causing severe shunt, actively pumped out by epithelial Na+/K+-ATPase',
        'Early: fluid floods alveolar spaces first and is cleared by surfactant · Late: fluid enters hilar lymph nodes and improves V/Q matching',
        'Early: caused only by sepsis · Late: caused only by mitral stenosis and cleared by endothelial Ca2+-ATPase',
        'Early: causes pure anatomic dead space (V/Q = ∞) · Late: causes increased DLCO (>120%)',
        'Early: actively pumped out by alveolar macrophages · Late: passively drained by bronchial veins'], a: 0,
    ex: 'Initially, capillary filtrate enters the perivascular and peribronchial interstitial spaces (interstitial edema, producing peribronchial cuffing) and is compensated by perivascular lymphatics transporting fluid to hilar lymph nodes. Once maximal interstitial drainage is exceeded, fluid crosses into alveolar spaces (alveolar edema), filling alveoli one by one, creating unventilated units (V/Q mismatch and severe shunt), and is compensated by epithelial Na+/K+-ATPase pumps.' },
  { t: 'tf', id: 'C11', src: 'Pulm circulation p.21',
    q: 'Under normal physiological conditions in humans, the net Starling force across pulmonary capillaries is outward, producing a baseline lymph flow of approximately 20 mL/h.', a: true,
    ex: 'True. Slide 21 states that the net pressure of the Starling equation is outward under normal conditions, resulting in a small continuous pulmonary lymph flow of about 20 mL/h.' },
  { t: 'open', id: 'C12', src: 'Pulm circulation p.22–24',
    q: 'Contrast the primary Starling abnormality in pulmonary edema caused by (1) mitral stenosis, (2) nephrotic syndrome (renal protein loss), and (3) sepsis, and state why alveolar edema is much more dangerous than interstitial edema.',
    ans: '(1) Mitral stenosis increases pulmonary capillary hydrostatic pressure (↑ Pc, cardiogenic edema due to increased left-sided afterload). (2) Nephrotic syndrome decreases capillary oncotic pressure (↓ πc, non-cardiogenic edema due to renal protein loss). (3) Sepsis damages the alveolar-capillary barrier and increases the filtration coefficient / capillary permeability (↑ K, non-cardiogenic edema). Alveolar edema is much more serious than interstitial edema because fluid floods the alveoli one by one, rendering them unventilated and causing severe V/Q mismatch and right-to-left shunt that directly impair gas exchange.' }
]});

/* Section P: Pulmonary Function Tests & Spirometry Interpretation (681117-1 PFT handout, 15 pp.). */
CVS.add({ id: 'P', short: 'PFTs', title: 'Pulmonary Function Tests & Spirometry Interpretation', kind: 'Lecture',
  blurb: 'Standard lung volumes and capacities, spirometry indications and withholding times, ATS/ERS 2019 acceptability and repeatability criteria, bronchodilator responsiveness, the interpretation flowchart, and flow-volume loops.',
  items: [
  { t: 'c', id: 'P-C1', title: 'Standard lung volumes, capacities, and what spirometry measures', src: 'PFT p.2–4',
    html: '<div class="two"><div class="stack"><div class="tblwrap"><table class="tbl"><thead><tr><th>Parameter</th><th>Definition &amp; formula</th><th>Typical range</th></tr></thead><tbody>' +
      '<tr><td><b>Tidal volume (TV)</b></td><td>Air entering and leaving the lungs with each normal breath</td><td class="num">0.4–0.5 L</td></tr>' +
      '<tr><td><b>Inspiratory reserve volume (IRV)</b></td><td>Extra air inspired above TV during maximal inspiration</td><td class="num">1.9–2.5 L</td></tr>' +
      '<tr><td><b>Expiratory reserve volume (ERV)</b></td><td>Extra air expired below TV during maximal expiration</td><td class="num">1.1–1.5 L</td></tr>' +
      '<tr><td><b>Residual volume (RV)</b></td><td>Gas remaining in the lungs after a maximal expiration ({{cannot be measured by spirometry}})</td><td class="num">1.5–1.9 L</td></tr>' +
      '<tr><td><b>Inspiratory capacity (IC)</b></td><td>Maximal volume inspired from resting end-expiration = {{TV + IRV}}</td><td class="num">2.3–3.0 L</td></tr>' +
      '<tr><td><b>Functional residual capacity (FRC)</b></td><td>Gas remaining after a normal tidal expiration = {{ERV + RV}} (requires plethysmography)</td><td class="num">2.6–3.4 L</td></tr>' +
      '<tr><td><b>Vital capacity (VC / FVC)</b></td><td>Maximal volume expired after maximal inspiration = {{IRV + TV + ERV}} (or IC + ERV)</td><td class="num">3.4–4.5 L</td></tr>' +
      '<tr><td><b>Total lung capacity (TLC)</b></td><td>Volume in the lungs after maximal inspiration = {{VC + RV}} (or IC + FRC)</td><td class="num">4.9–6.4 L</td></tr></tbody></table></div>' +
      '<ul class="pts"><li>A <b>lung capacity</b> is always the sum of {{two or more physiologic volumes}}.</li>' +
      '<li>Because a spirometer only measures air moving past the lips, it cannot determine <b>RV, FRC, or TLC</b>; measuring those requires {{body plethysmography}}, helium dilution, or nitrogen washout.</li>' +
      '<li>Dynamic forced parameters: <b>FEV<sub>1</sub></b> (volume expelled in the first second), <b>FEV<sub>1</sub>/FVC</b>, <b>PEF</b> (peak expiratory flow), and <b>{{FEF25–75%}}</b> (mean flow over the middle half of FVC, sensitive to {{small airways &lt; 2 mm}}).</li></ul></div>' +
      CVS.fig('pft-volumes', 'Workings of a simple water-bell spirometer and standard lung volumes and capacities on a spirogram.', 'pft', 4) + '</div>' },
  { t: 'q', id: 'P1', src: 'PFT p.4', core: true,
    q: 'Which set of lung volumes and capacities CANNOT be measured by simple spirometry?',
    o: ['Residual volume (RV), functional residual capacity (FRC), and total lung capacity (TLC)', 'Inspiratory reserve volume (IRV), inspiratory capacity (IC), and vital capacity (VC)', 'Expiratory reserve volume (ERV), tidal volume (TV), and forced vital capacity (FVC)', 'Inspiratory capacity (IC), functional residual capacity (FRC), and vital capacity (VC)', 'Tidal volume (TV), residual volume (RV), and expiratory reserve volume (ERV)'], a: 0,
    ex: 'Simple spirometry only tracks air entering and leaving the mouth. Because the lungs cannot be completely emptied below RV, neither RV nor any capacity containing RV (FRC = ERV + RV and TLC = VC + RV) can be measured by simple spirometry; they require body plethysmography or gas dilution.' },
  { t: 'q', id: 'P2', src: 'PFT p.3–4',
    q: 'A healthy adult has TV = 0.5 L, IRV = 2.5 L, ERV = 1.2 L, and RV = 1.6 L. What are the inspiratory capacity (IC), functional residual capacity (FRC), and vital capacity (VC)?',
    o: ['IC = 3.0 L, FRC = 2.8 L, VC = 4.2 L', 'IC = 2.5 L, FRC = 2.8 L, VC = 5.8 L', 'IC = 3.0 L, FRC = 1.7 L, VC = 4.2 L', 'IC = 3.7 L, FRC = 2.8 L, VC = 5.8 L', 'IC = 3.0 L, FRC = 4.1 L, VC = 3.7 L'], a: 0,
    ex: 'IC = TV + IRV = 0.5 + 2.5 = 3.0 L; FRC = ERV + RV = 1.2 + 1.6 = 2.8 L; VC = IRV + TV + ERV = 2.5 + 0.5 + 1.2 = 4.2 L (and TLC = VC + RV = 5.8 L).' },

  { t: 'c', id: 'P-C2', title: 'Indications, contraindications, withholding times, and reference values', src: 'PFT p.5–6',
    html: '<div class="two"><div class="stack"><ul class="pts"><li><b>Indications</b>: diagnosis of respiratory symptoms/abnormal tests, monitoring therapy or disease progression, disability/impairment assessment, and public health surveys.</li>' +
      '<li><b>Relative contraindications</b> (forced maneuver raises intrathoracic, intracranial, and intraocular pressure): {{acute myocardial infarction within 1 month}}, unstable arrhythmia/severe hypertension, symptomatic heart failure/acute cor pulmonale, {{pulmonary embolism}}, {{pneumothorax}}, {{cerebral aneurysm}}, brain or thoracic surgery within {{4 weeks}}, eye surgery within {{4–8 weeks}}, sinus/middle-ear surgery or infection within 1 week, pregnancy {{&gt; 28 weeks}}, and active respiratory infection (e.g., untreated TB or hemoptysis).</li>' +
      '<li><b>Pre-test avoidance</b>: no smoking/vaping or vigorous exercise within {{1 hour}}; no intoxicants within {{8 hours}}; avoid tight clothing restricting chest expansion.</li>' +
      '<li><b>Bronchodilator withholding times</b>: SABA {{4–6 h}}, SAMA 12 h, LABA 24 h, ultra-LABA 36 h, LAMA {{36–48 h}}, theophylline 12 h (slow-release 24 h); <b>inhaled steroids and anti-leukotrienes</b> do not need to be withheld.</li>' +
      '<li><b>Reference values (GLI2012)</b> depend on {{age, sex, height, and ethnicity}} — NOT body weight (though weight is recorded at intake).</li></ul></div>' +
      CVS.fig('pft-withhold', 'Bronchodilator medication withholding times before diagnostic spirometry.', 'pft', 6) + '</div>' },
  { t: 'q', id: 'P3', src: 'PFT p.6', core: true,
    q: 'Before performing baseline diagnostic spirometry, what are the correct withholding times for inhaled medications?',
    o: ['SABA 4–6 h, SAMA 12 h, LABA 24 h, Ultra-LABA 36 h, LAMA 36–48 h; inhaled corticosteroids need not be withheld', 'SABA 12 h, SAMA 6 h, LABA 36 h, LAMA 24 h; withhold inhaled corticosteroids for 24 h', 'SABA 1 h, SAMA 4–6 h, LABA 12 h, LAMA 24 h; withhold anti-leukotrienes for 12 h', 'All bronchodilators and inhaled corticosteroids must be withheld for 24 h', 'SABA 4–6 h, SAMA 24 h, LABA 12 h, Ultra-LABA 24 h, LAMA 48 h; withhold anti-leukotrienes for 24 h'], a: 0,
    ex: 'ATS/ERS 2019 withholding times before diagnostic testing: SABA (salbutamol) 4–6 h, SAMA (ipratropium) 12 h, LABA (formoterol/salmeterol) 24 h, ultra-LABA (indacaterol/vilanterol/olodaterol) 36 h, LAMA (tiotropium/umeclidinium/aclidinium/glycopyrronium) 36–48 h, theophylline >= 12 h (slow-release >= 24 h). Inhaled steroids and anti-leukotrienes do not need to be stopped.' },
  { t: 'q', id: 'P4', src: 'PFT p.6',
    q: 'Which patient characteristic does NOT determine the predicted spirometry reference values (GLI2012)?',
    o: ['Body weight', 'Standing height', 'Biological sex', 'Age', 'Ethnicity'], a: 0,
    ex: 'Predicted reference values in GLI2012 are determined by age, sex, standing height, and ethnicity. Body weight is measured during preparation but is not part of the reference equations for normal lung volumes.' },
  { t: 'tf', id: 'P5', src: 'PFT p.6',
    q: 'Acute myocardial infarction 2 weeks ago, thoracic surgery 3 weeks ago, or cataract surgery 3 weeks ago are relative contraindications to performing spirometry.', a: true,
    ex: 'True. Acute MI within 1 month, cerebral or thoracic surgery within 4 weeks, and eye surgery within 4–8 weeks are all listed as relative contraindications because forced expiration abruptly increases intrathoracic, intracranial, and intraocular pressures.' },

  { t: 'c', id: 'P-C3', title: 'Spirometry maneuver, acceptability, repeatability, and best-test selection', src: 'PFT p.7–9, 14',
    html: '<div class="stack"><div class="tblwrap"><table class="tbl"><thead><tr><th>Step / Criterion</th><th>2019 ATS/ERS Requirement</th><th>Why it matters / Common error</th></tr></thead><tbody>' +
      '<tr><td><b>Maximal inspiration</b></td><td>Rapidly inhale to TLC within {{&le; 2 s}}</td><td>Prolonged pause (4–6 s) lowers {{PEF and FEV1}} via stress relaxation</td></tr>' +
      '<tr><td><b>1. Good start</b></td><td>No hesitation; back-extrapolated volume (BEV) {{&le; 5% of FVC or 0.100 L}}, whichever is greater</td><td>Excessive BEV indicates a slow, hesitant start of forced expiration</td></tr>' +
      '<tr><td><b>2. Good end (EOFE)</b></td><td>Meet &ge; 1 of 3: expiratory plateau ({{&le; 0.025 L in the last 1 s}}), expiratory time {{&ge; 15 s}}, or FVC within repeatability tolerance of largest prior FVC</td><td>Early termination underestimates FVC and falsely raises FEV<sub>1</sub>/FVC</td></tr>' +
      '<tr><td><b>3. No artifacts</b></td><td>No {{cough in the first second}}, glottis closure, early termination, variable effort, {{obstructed mouthpiece}}, or leak</td><td>A first-second cough spoils FEV<sub>1</sub>, though FVC may still be usable</td></tr>' +
      '<tr><td><b>4. FIVC vs FVC</b></td><td>If FIVC &gt; FVC, then FIVC &minus; FVC must be {{&le; 0.100 L or 5% of FVC}}, whichever is greater</td><td>Larger FIVC proves the initial inspiration before the blast was submaximal</td></tr>' +
      '<tr><td><b>Repeatability &amp; trials</b></td><td>Perform {{3 to 8 trials}}; top two FVC and top two FEV<sub>1</sub> values must each differ by {{&le; 0.150 L}} (adults)</td><td><b>Best test</b>: report the {{largest FEV1 and largest FVC}} from acceptable trials</td></tr></tbody></table></div>' +
      CVS.fig('pft-accept', 'Common spirometry artifacts (variable effort, early termination, coughing, glottis closure, tongue obstruction, and air leak) that violate acceptability criteria.', 'pft', 8) + '</div>' },
  { t: 'q', id: 'P6', src: 'PFT p.7–9', core: true,
    q: 'According to the 2019 ATS/ERS spirometry guidelines, which statement regarding acceptability and adult repeatability criteria is correct?',
    o: ['Back-extrapolated volume (BEV) must be <= 5% of FVC or 0.100 L (whichever is greater), end-expiratory plateau <= 0.025 L in the last 1 s (or expiratory time >= 15 s), and the two largest FVC and FEV1 values within <= 0.150 L', 'Maximal inspiration to TLC should be held for 4–6 s at TLC to maximize PEF and FEV1, with 10–12 trials performed routinely', 'BEV must be <= 10% of FVC or 0.250 L, and the two largest FVC values must be within <= 0.300 L', 'A cough during the first second of expiration is acceptable for FEV1 as long as expiratory time exceeds 6 s', 'If FIVC after the maneuver exceeds FVC by 0.400 L, the trial is acceptable because inspiration after EOFE is normally larger'], a: 0,
    ex: 'ATS/ERS 2019 requires rapid inspiration to TLC in <= 2 s (holding 4–6 s lowers PEF and FEV1), BEV <= 5% of FVC or 0.100 L (whichever is greater), 1 of 3 EOFE indicators (plateau <= 0.025 L in the last 1 s, expiratory time >= 15 s, or repeatable FVC), no artifacts, FIVC - FVC <= 0.100 L or 5% of FVC, 3–8 trials, and adult repeatability within <= 0.150 L for the top two FVC and top two FEV1 values.' },
  { t: 'q', id: 'P7', src: 'PFT p.9, 14', core: true,
    q: '<b>Quiz 1 (Best test selection, p.14)</b>: Four acceptable spirometry trials in an adult show:<br>Trial 1: FEV<sub>1</sub> = 3.93 L, FVC = 4.39 L, FEV<sub>1</sub>/FVC = 90%, PEF = 6.27 L/s<br>Trial 2: FEV<sub>1</sub> = 4.00 L, FVC = 4.43 L, FEV<sub>1</sub>/FVC = 90%, PEF = 7.05 L/s<br>Trial 3: FEV<sub>1</sub> = 3.84 L, FVC = 3.97 L, FEV<sub>1</sub>/FVC = 97%, PEF = 4.75 L/s<br>Trial 4: FEV<sub>1</sub> = 3.89 L, FVC = 4.04 L, FEV<sub>1</sub>/FVC = 96%, PEF = 6.67 L/s<br>Are repeatability criteria met, and which values are selected as the best test?',
    o: ['Repeatability is met (top two FEV1 differ by 0.07 L and top two FVC differ by 0.04 L, both <= 0.150 L); select FEV1 = 4.00 L and FVC = 4.43 L (Trial 2)', 'Repeatability fails because Trial 2 and Trial 3 FVC differ by 0.46 L (> 0.150 L); repeat up to 12 trials', 'Select Trial 3 (FEV1 = 3.84 L, FVC = 3.97 L) because it has the highest FEV1/FVC ratio (97%)', 'Average all four trials to report FEV1 = 3.92 L and FVC = 4.21 L', 'Select FEV1 = 3.93 L and FVC = 4.39 L from Trial 1 because Trial 2 PEF is an outlier'], a: 0,
    ex: 'Repeatability checks the difference between the TWO LARGEST acceptable values, not the highest and lowest: top two FEV1 are 4.00 and 3.93 L (diff = 0.07 L <= 0.150 L) and top two FVC are 4.43 and 4.39 L (diff = 0.04 L <= 0.150 L). The best test takes the largest FEV1 (4.00 L) and largest FVC (4.43 L), both found in Trial 2.' },

  { t: 'c', id: 'P-C4', title: 'Bronchodilator responsiveness, severity grading, and the interpretation algorithm', src: 'PFT p.10–11, 13–15',
    html: '<div class="stack"><div class="two">' + CVS.fig('pft-patterns', 'Normal, obstructive, and restrictive volume-time spirograms.', 'pft', 10) + CVS.fig('pft-algo', 'Stepwise spirometry interpretation algorithm and bronchodilator reversibility criteria.', 'pft', 10) + '</div>' +
      '<ul class="pts"><li><b>Bronchodilator protocol</b>: give inhaled {{salbutamol 400 &mu;g}} (100 &mu;g &times; 4 puffs via spacer to TLC, hold 5–10 s, &ge; 30 s apart) and retest after {{15 minutes}}, or ipratropium 160 &mu;g (40 &mu;g &times; 4) and retest after {{30 minutes}}.</li>' +
      '<li><b>Positive bronchodilator response</b>: classical ATS/ERS 2019 criterion is an increase in FEV<sub>1</sub> or FVC of {{&ge; 12% and &ge; 200 mL}} from baseline; 2021 ERS/ATS standard is a change {{&gt; 10% of the predicted value}}.</li>' +
      '<li><b>Flowchart step 1 (FEV<sub>1</sub>/FVC)</b>: if FEV<sub>1</sub>/FVC &ge; 70% and FVC &ge; 80% predicted, check FEF<sub>25–75%</sub> (&lt; 65% predicted = {{small airway disease}}, &ge; 65% = normal). If FEV<sub>1</sub>/FVC &ge; 70% and FVC &lt; 80% predicted, suspect {{restriction (confirm by TLC)}}.</li>' +
      '<li><b>Flowchart step 2 (FEV<sub>1</sub>/FVC &lt; 70% = obstruction)</b>: compute <code>Corrected %FVC = %predicted FVC + [70 &minus; FEV1/FVC]</code> (or check whether <code>%predicted FVC &minus; %predicted FEV1 &ge; 12</code> when FVC &lt; 80%). If corrected %FVC &gt; 80% (or difference &ge; 12), classify as {{pure obstruction}} (low FVC is pseudorestriction from air trapping); otherwise classify as {{combined obstructive and restrictive defect}}.</li>' +
      '<li><b>Severity grading</b> (FEV<sub>1</sub> %pred for obstruction, FVC %pred for restriction): Mild {{&ge; 70%}}, Moderate {{50–69%}}, Severe {{35–49%}}, Very severe &lt; 35%. By 2021 <b>z-score</b>: Mild &minus;1.65 to &minus;2.5, Moderate &minus;2.51 to &minus;4.0, Severe &lt; &minus;4.1.</li></ul></div>' },
  { t: 'q', id: 'P8', src: 'PFT p.10–11, 14', core: true,
    q: '<b>Quiz 3 &amp; 4 (p.14)</b>: Compare two elderly men:<br>&bull; <b>Case 3 (71 yr)</b>: Pre-BD FVC = 2.40 L (81% pred), FEV<sub>1</sub> = 1.01 L (43% pred), FEV<sub>1</sub>/FVC = 41.96%; Post-BD FVC = 2.43 L (+1%), FEV<sub>1</sub> = 1.09 L (46% pred, +8% / +80 mL).<br>&bull; <b>Case 4 (76 yr)</b>: Pre-BD FVC = 3.17 L (100% pred), FEV<sub>1</sub> = 1.70 L (69% pred), FEV<sub>1</sub>/FVC = 53.39%; Post-BD FVC = 3.32 L (+5%), FEV<sub>1</sub> = 1.90 L (77% pred, +12% / +200 mL).<br>What is the correct interpretation for each case?',
    o: ['Case 3: severe irreversible pure obstruction; Case 4: moderate reversible pure obstruction (positive bronchodilator response)', 'Case 3: very severe reversible obstruction; Case 4: mild irreversible obstruction', 'Case 3: combined obstructive-restrictive defect; Case 4: normal spirometry', 'Case 3: moderate irreversible obstruction; Case 4: mild restrictive defect', 'Both cases show severe reversible pure obstruction'], a: 0,
    ex: 'Both have FEV1/FVC < 70% and FVC >= 80% predicted, so both have pure obstruction. Case 3 has pre-BD FEV1 = 43% predicted (35–49% = severe) and improves by only +8% (+80 mL), failing the >= 12% and >= 200 mL reversibility threshold (irreversible). Case 4 has pre-BD FEV1 = 69% predicted (50–69% = moderate) and improves from 1.70 L to 1.90 L (+200 mL and +12% from baseline), meeting the positive bronchodilator response criteria.' },
  { t: 'q', id: 'P9', src: 'PFT p.10–11, 15', core: true,
    q: '<b>Quiz 5 &amp; 6 (p.15)</b>: Compare two 70-year-old patients:<br>&bull; <b>Case 5 (male)</b>: Pre-BD FVC = 2.38 L (69% pred), FEV<sub>1</sub> = 1.79 L (66% pred), FEV<sub>1</sub>/FVC = 82.91%, FEF<sub>25–75%</sub> = 1.86 L/s (82% pred).<br>&bull; <b>Case 6 (female)</b>: Pre-BD FVC = 2.13 L (97% pred), FEV<sub>1</sub> = 1.60 L (90% pred), FEV<sub>1</sub>/FVC = 83.11%, FEF<sub>25–75%</sub> = 0.85 L/s (51% pred).<br>How should Case 5 and Case 6 be interpreted according to the lecture algorithm?',
    o: ['Case 5: suspected moderate restriction (confirm with TLC); Case 6: small airway disease', 'Case 5: moderate pure obstruction; Case 6: normal spirometry', 'Case 5: combined obstructive and restrictive defect; Case 6: mild restriction', 'Case 5: small airway disease; Case 6: suspected mild restriction', 'Both cases represent normal spirometry because FEV1/FVC exceeds 80%'], a: 0,
    ex: 'In Case 5, FEV1/FVC is 82.91% (>= 70%) but FVC is reduced to 69% predicted (< 80%, in the 50–69% moderate range), indicating a suspected moderate restrictive defect that requires TLC measurement for confirmation. In Case 6, both FEV1/FVC (83.11%) and FVC (97% pred) are normal, but FEF25–75% is 51% predicted (< 65%), which the algorithm classifies as small airway disease.' },
  { t: 'q', id: 'P10', src: 'PFT p.10, 14',
    q: '<b>Quiz 2 (p.14) &amp; Algorithm rule</b>: In Case 2 (29-year-old male), pre-BD FVC = 95% pred, FEV<sub>1</sub> = 86% pred, FEV<sub>1</sub>/FVC = 80.53%, and FEF<sub>25–75%</sub> = 70% pred (normal spirometry). Suppose another patient presents with FEV<sub>1</sub>/FVC = 55%, FVC = 74% predicted, and FEV<sub>1</sub> = 52% predicted. Using the lecture flowchart, how do you distinguish pure obstruction with air trapping from a combined defect in this second patient?',
    o: ['Because %predicted FVC minus %predicted FEV1 is 22 (>= 12) and Corrected %FVC = 74 + (70 - 55) = 89% (> 80%), it is classified as pure obstruction (pseudorestriction from air trapping)', 'Any patient with FEV1/FVC < 70% and FVC < 80% predicted automatically has a combined obstructive and restrictive defect', 'Because FVC is 74% predicted (>= 70%), it is classified as mild pure restriction', 'Check whether PEF is < 65% predicted to diagnose small airway disease', 'Repeat spirometry after ipratropium in 5 minutes; if FVC stays < 80% it proves parenchymal fibrosis'], a: 0,
    ex: 'When FEV1/FVC < 70% and FVC < 80% predicted, the lecture algorithm checks Corrected %FVC = %predicted FVC + (70 - FEV1/FVC) = 74 + 15 = 89% (> 80%), or equivalently whether %predicted FVC - %predicted FEV1 >= 12 (74 - 52 = 22 >= 12). Because this threshold is met, the reduced FVC is explained by air trapping (elevated RV) in pure obstruction rather than a true combined defect.' },

  { t: 'c', id: 'P-C5', title: 'Flow-volume loops: obstructive, restrictive, and central airway obstruction', src: 'PFT p.11–13',
    html: '<div class="stack">' + CVS.fig('pft-loops', 'Flow-volume loops in obstructive disease, bronchodilator responsiveness, restrictive subtypes, and the three patterns of central airway obstruction.', 'pft', 12) +
      '<div class="tblwrap"><table class="tbl"><thead><tr><th>Condition</th><th>Expiratory limb (top)</th><th>Inspiratory limb (bottom)</th><th>Key mechanism / clinical clue</th></tr></thead><tbody>' +
      '<tr><td><b>Obstructive disease</b></td><td>Reduced PEF with {{scooped-out (concave)}} downslope</td><td>Normal (shifted left if hyperinflated)</td><td>Dynamic compression of small intrathoracic airways; improves post-BD if reversible</td></tr>' +
      '<tr><td><b>Restrictive disease</b></td><td>Narrow volume width; {{steep witch-hat}} slope in parenchymal fibrosis</td><td>Narrowed in volume</td><td><b>(a) Parenchymal</b>: high recoil gives steep slope; <b>(b) Chest wall</b>: parallel slope; <b>(c) Neuromuscular</b>: {{PEF not sharp}}</td></tr>' +
      '<tr><td><b>Variable extrathoracic obstruction</b></td><td>Normal</td><td>{{Flat inspiratory curve}}</td><td>During inspiration, negative airway pressure (&minus;) below atmospheric pressure (+) pulls extrathoracic trachea inward &rarr; {{inspiratory stridor}}</td></tr>' +
      '<tr><td><b>Variable intrathoracic obstruction</b></td><td>{{Flat expiratory curve}}</td><td>Normal</td><td>During expiration, high positive pleural pressure (+) exceeds airway pressure (&minus;) and compresses intrathoracic airway &rarr; {{expiratory wheezes}}</td></tr>' +
      '<tr><td><b>Fixed upper airway obstruction</b></td><td>Flattened</td><td>Flattened ({{box-like loop}})</td><td>Rigid stenosis at any level resists diameter change during both inspiration and expiration</td></tr></tbody></table></div></div>' },
  { t: 'q', id: 'P11', src: 'PFT p.12–13', core: true,
    q: 'A patient with vocal cord paralysis presents with inspiratory stridor. Which flow-volume loop pattern is expected, and what transmural pressure mechanism explains it?',
    o: ['Flat inspiratory curve with a normal expiratory curve — negative intraluminal airway pressure during inspiration pulls the compliant extrathoracic airway inward against higher atmospheric pressure', 'Flat expiratory curve with a normal inspiratory curve — positive pleural pressure during forced expiration compresses the extrathoracic trachea', 'Flattening of both inspiratory and expiratory curves — vocal cord paralysis acts as a rigid intrathoracic ring', 'Scooped-out concave expiratory curve with normal PEF — small airway dynamic compression', 'Narrow "witch\'s hat" loop shifted to the right — increased lung elastic recoil'], a: 0,
    ex: 'Vocal cord paralysis is a variable extrathoracic upper airway obstruction (pattern a). During inspiration, intraluminal tracheal pressure becomes subatmospheric (-), while surrounding neck pressure is atmospheric (+), sucking the mobile vocal cords inward and flattening the inspiratory limb (producing stridor). During expiration, positive intraluminal pressure pushes them open.' },
  { t: 'q', id: 'P12', src: 'PFT p.12–13',
    q: 'Which flow-volume loop pattern is correctly matched with its clinical disorder from the lecture?',
    o: ['Flat expiratory limb with normal inspiratory limb — variable intrathoracic central airway obstruction (producing wheezes)', 'Both inspiratory and expiratory limbs flattened — parenchymal interstitial lung disease', 'Steep "witch\'s hat" expiratory limb with narrow volume — neuromuscular respiratory weakness', 'Concave scooped expiratory limb with reduced FVC — variable extrathoracic obstruction', 'Rounded, blunted peak expiratory flow with low inspiratory and expiratory flows — mild reversible asthma'], a: 0,
    ex: 'Variable intrathoracic obstruction (e.g., intrathoracic tracheomalacia or tracheal tumor) flattens the expiratory limb because high positive pleural pressure during forced expiration compresses the airway, while negative pleural pressure during inspiration holds it open. Both limbs are flat in fixed central obstruction; "witch\'s hat" is parenchymal restriction; blunted non-sharp PEF is typical of neuromuscular disorder or poor inspiratory effort.' },
  { t: 'open', id: 'P13', src: 'PFT p.10, 12–13',
    q: 'Compare how the flow-volume loop distinguishes (1) diffuse small-airway obstructive lung disease, (2) parenchymal restrictive lung disease, and (3) fixed central airway obstruction.',
    ans: '<b>1. Diffuse obstructive disease (COPD/asthma)</b>: reduced PEF and a <b>scooped-out (concave) expiratory limb</b> with prolonged expiration and reduced FEV<sub>1</sub>/FVC (&lt; 70%).<br><b>2. Parenchymal restrictive disease (pulmonary fibrosis)</b>: reduced horizontal width (low FVC and TLC) with a preserved or high PEF and a <b>steep linear expiratory downslope ("witch\'s hat" appearance)</b>, giving a normal or elevated FEV<sub>1</sub>/FVC (&ge; 70%).<br><b>3. Fixed central airway obstruction (circumferential tracheal stenosis)</b>: constant cross-sectional narrowing limits peak airflow equally in both phases, producing <b>flattening (truncation) of both the expiratory and inspiratory limbs ("box-like" loop)</b>.' }
]});

/* Section R: Neural & Chemical Control of Respiration (681114-3 Respiratory control handout, 54 pp.). */
CVS.add({ id: 'R', short: 'Resp control', title: 'Neural & Chemical Control of Respiration', kind: 'Lecture',
  blurb: 'Medullary and pontine respiratory centers, central vs peripheral chemoreceptors and glomus cell transduction, lung mechanoreceptors and C-fibers, integrated responses to CO2, O2, pH and exercise, CO2 narcosis, and abnormal breathing patterns.',
  items: [
  { t: 'c', id: 'R-C1', title: 'Central controller: brainstem centers, cortex, and effectors', src: 'Resp control p.4–16',
    html: '<div class="stack"><div class="two"><div class="stack"><div class="tblwrap"><table class="tbl"><thead><tr><th>Center / Group</th><th>Location &amp; Major Nucleus</th><th>Dominant Role</th></tr></thead><tbody>' +
      '<tr><td><b>Dorsal respiratory group (DRG)</b></td><td>Dorsal medulla: {{nucleus tractus solitarii (NTS)}}</td><td>{{Drives quiet inspiration}}; receives CN IX &amp; X afferents, projects to contralateral diaphragm via {{phrenic nerve (C3–C5)}}</td></tr>' +
      '<tr><td><b>Rostral VRG</b></td><td>Ventral medulla: {{Botzinger complex}} (nucleus retrofacialis)</td><td>Expiratory</td></tr>' +
      '<tr><td><b>Intermediate VRG</b></td><td>{{Pre-Botzinger complex}} + nucleus ambiguus (NA) &amp; para-ambigualis (NPA)</td><td>Inspiratory; pre-BotC is the {{pacemaker rhythm generator}}</td></tr>' +
      '<tr><td><b>Caudal VRG</b></td><td>{{Nucleus retroambigualis (NRA)}}</td><td>Expiratory (active expiration via internal intercostals &amp; abdominal muscles)</td></tr>' +
      '<tr><td><b>Apneustic center</b></td><td>{{Lower pons}}</td><td>{{Excitatory}} to DRG (prolongs inspiration)</td></tr>' +
      '<tr><td><b>Pneumotaxic center</b></td><td>{{Upper pons}}</td><td>{{Inhibits inspiration}} to regulate tidal volume and respiratory rate</td></tr></tbody></table></div>' +
      '<ul class="pts"><li><b>Cerebral cortex</b> mediates {{voluntary control}} (voluntary hyperventilation or breath-holding within limits); the <b>limbic system and hypothalamus</b> modify breathing during emotional states (fear, excitement).</li>' +
      '<li><b>Effectors</b>: diaphragm (most important inspiratory muscle), external intercostals &amp; accessory muscles (scalene, sternocleidomastoid), upper-airway dilators (nasopharyngeal/laryngeal muscles prevent collapse), and expiratory muscles (abdominal + internal intercostals; quiet expiration is passive).</li></ul></div>' +
      CVS.fig('ctrl-brainstem', 'Brainstem respiratory control network showing sensors, pontine and medullary centers, and motor output to the diaphragm.', 'ctrl', 11) + '</div></div>' },
  { t: 'q', id: 'R1', src: 'Resp control p.9–10', core: true,
    q: 'Which structure serves as the primary pacemaker (central pattern generator) for the basic respiratory rhythm, and where is it located?',
    o: ['Pre-Botzinger complex in the intermediate ventral respiratory group (VRG)', 'Nucleus tractus solitarii (NTS) in the dorsal respiratory group (DRG)', 'Botzinger complex (nucleus retrofacialis) in the rostral VRG', 'Nucleus retroambigualis (NRA) in the caudal VRG', 'Pneumotaxic center in the upper pons'], a: 0,
    ex: 'The pre-Botzinger complex (preBotC), located in the intermediate subdivision of the ventral respiratory group (VRG) in the medulla, contains pacemaker neurons that generate the basic respiratory rhythm.' },
  { t: 'q', id: 'R2', src: 'Resp control p.10–11, 16', core: true,
    q: 'Which statement accurately describes the medullary dorsal respiratory group (DRG) and the two pontine respiratory centers?',
    o: ['The DRG (nucleus tractus solitarii) drives inspiration via the phrenic nerve (C3–C5); the lower-pontine apneustic center excites the DRG; the upper-pontine pneumotaxic center inhibits inspiration to regulate volume and rate', 'The DRG drives forced expiration via abdominal muscles; the apneustic center inhibits inspiration; the pneumotaxic center prolongs inspiration', 'The DRG is located in the upper pons and receives only somatic limb afferents; the apneustic center is in the dorsal medulla', 'The apneustic center in the upper pons switches off inspiration, whereas the pneumotaxic center in the lower pons excites the diaphragm directly', 'The DRG consists of the nucleus retroambigualis and is active only during heavy exercise'], a: 0,
    ex: 'The DRG is composed of the nucleus tractus solitarii (NTS) in the dorsal medulla, receives visceral sensory input from CN IX and CN X, and sends inspiratory output via the phrenic nerves (C3–C5) to the diaphragm. The lower pons (apneustic center) has an excitatory function on the DRG, whereas the upper pons (pneumotaxic center) inhibits inspiration to regulate tidal volume and respiratory rate.' },
  { t: 'q', id: 'R3', src: 'Resp control p.10',
    q: 'According to the lecture table of VRG properties (p.10), which subdivision of the ventral respiratory group (VRG) is paired with its correct major component and dominant activity?',
    o: ['Rostral VRG: nucleus retrofacialis / Botzinger complex — Expiratory; Caudal VRG: nucleus retroambigualis — Expiratory', 'Rostral VRG: pre-Botzinger complex — Inspiratory; Caudal VRG: nucleus tractus solitarii — Inspiratory', 'Intermediate VRG: nucleus retroambigualis — Expiratory; Caudal VRG: nucleus ambiguus — Inspiratory', 'Rostral VRG: nucleus ambiguus — Inspiratory; Intermediate VRG: Botzinger complex — Expiratory', 'All three VRG subdivisions (rostral, intermediate, caudal) are exclusively expiratory'], a: 0,
    ex: 'In the VRG table (p.10): Rostral VRG = nucleus retrofacialis (NRF) or Botzinger complex (Expiratory); Intermediate VRG = pre-Botzinger complex, nucleus ambiguus (NA), and nucleus para-ambigualis (NPA) (Inspiratory); Caudal VRG = nucleus retroambigualis (NRA) (Expiratory).' },

  { t: 'c', id: 'R-C2', title: 'Central vs. peripheral chemoreceptors and glomus cell transduction', src: 'Resp control p.20–26',
    html: '<div class="stack"><div class="two">' + CVS.fig('ctrl-central', 'Central chemoreceptor mechanism on the ventral medullary surface.', 'ctrl', 21) + CVS.fig('ctrl-glomus', 'Carotid body histology and hypoxic signal transduction in Type I glomus cells.', 'ctrl', 24) + '</div>' +
      '<ul class="pts"><li><b>Central chemoreceptors</b> (ventral medulla near 9th &amp; 10th cranial nerve exit; provide <b>{{70% of hypercapnic drive}}</b>): arterial CO<sub>2</sub> readily crosses the {{blood-brain barrier}}, whereas arterial H<sup>+</sup> cannot. In the CSF (normal pH {{7.32}}), CO<sub>2</sub> hydrates to release H<sup>+</sup>, which directly excites the receptor &rarr; DRG &rarr; hyperventilation.</li>' +
      '<li><b>CSF buffering</b>: CSF has {{very low protein concentration}}, giving it poor buffering capacity so small P<sub>CO2</sub> rises drop pH sharply; CSF HCO<sub>3</sub><sup>&minus;</sup> is regulated by the {{choroid plexus}}.</li>' +
      '<li><b>Peripheral chemoreceptors</b>: <b>carotid bodies</b> at the common carotid bifurcation (afferent via {{glossopharyngeal nerve / CN IX}}) and <b>aortic bodies</b> around the aortic arch (afferent via {{vagus nerve / CN X}}). They have high blood flow and respond faster than central receptors (~30% of CO<sub>2</sub> drive).</li>' +
      '<li><b>Stimuli to peripheral receptors</b>: low arterial P<sub>O2</sub> (nonlinear; rises steeply below 60 mmHg, maximal response {{below 50 mmHg}}), high P<sub>aCO2</sub>, and decreased arterial pH / elevated H<sup>+</sup> (sensed by {{carotid bodies only}}, causing {{Kussmaul breathing}} in metabolic acidosis). Bilateral carotid body resection abolishes the hypoxic ventilatory drive.</li>' +
      '<li><b>Type I (glomus) cell mechanism</b> (Type II = sustentacular): low P<sub>O2</sub> inhibits {{O2-sensitive K+ channels}} &rarr; membrane depolarization (&Delta;V<sub>m</sub>) &rarr; opens {{voltage-gated Ca2+ channels}} &rarr; Ca<sup>2+</sup> influx &rarr; release of ATP &amp; acetylcholine onto afferent fibers.</li></ul></div>' },
  { t: 'q', id: 'R4', src: 'Resp control p.21, 41', core: true,
    q: 'Why do central chemoreceptors generate a strong, rapid ventilatory response to acute arterial hypercapnia (increased PaCO2) than to acute metabolic acidosis (increased arterial H+)?',
    o: ['CO2 freely diffuses across the blood-brain barrier into low-protein CSF (normal pH 7.32) to form H+, whereas arterial H+ crosses the blood-brain barrier very poorly', 'Central chemoreceptors lack H+ sensitivity and bind molecular CO2 directly without hydration', 'CSF contains a higher protein concentration than plasma, amplifying H+ transport across the choroid plexus', 'Central chemoreceptors are supplied by the carotid sinus nerve, which blocks H+ ions', 'Arterial H+ inhibits the dorsal respiratory group directly while CO2 excites the pneumotaxic center'], a: 0,
    ex: 'The blood-brain barrier is freely permeable to dissolved CO2 but relatively impermeable to H+. Once CO2 diffuses into the brain ECF and CSF (which has a normal pH of 7.32 and very little buffering because of its low protein concentration), it hydrates to H+ + HCO3-, lowering CSF pH and directly stimulating central chemoreceptors.' },
  { t: 'q', id: 'R5', src: 'Resp control p.23–24', core: true,
    q: 'What is the correct sequence of cellular events in carotid body Type I (glomus) cells during hypoxemia?',
    o: ['Decreased PaO2 inhibits O2-sensitive K+ channels -> membrane depolarization -> opening of voltage-gated Ca2+ channels -> Ca2+ influx -> exocytosis of ATP and acetylcholine onto CN IX afferents', 'Decreased PaO2 opens O2-sensitive K+ channels -> membrane hyperpolarization -> intracellular Ca2+ release -> dopamine release onto CN X afferents', 'Decreased PaO2 activates Type II sustentacular Na+/K+ pumps -> Cl- efflux -> depolarization of phrenic motor neurons', 'Decreased PaO2 directly opens ligand-gated Ca2+ channels -> K+ influx -> repolarization -> glutamate release onto CN IX afferents', 'Decreased PaO2 closes voltage-gated Ca2+ channels -> decreased intracellular Ca2+ -> disinhibition of CN X afferents'], a: 0,
    ex: 'Type I (glomus) cells possess O2-sensitive K+ channels. A fall in arterial PO2 closes/inhibits these K+ channels, reducing K+ efflux and causing membrane depolarization (delta Vm). Depolarization opens voltage-gated Ca2+ channels, increasing cytosolic [Ca2+] and triggering neurotransmitter release (ATP, acetylcholine) onto glossopharyngeal (CN IX) afferent nerve endings.' },
  { t: 'tf', id: 'R6', src: 'Resp control p.23, 25, 47',
    q: 'Both the carotid bodies and the aortic bodies respond directly to changes in arterial pH (H+ concentration), so patients with bilateral carotid body resection retain a normal hypoxic ventilatory drive via their aortic bodies.', a: false,
    ex: 'False on both counts: according to the lecture (p.23 & p.47), the ventilatory response to arterial pH (metabolic acidosis) is mediated by carotid chemoreceptors only (not aortic bodies), and complete loss of the hypoxic ventilatory drive occurs in patients after bilateral carotid body resection.' },

  { t: 'c', id: 'R-C3', title: 'Lung mechanoreceptors, C-fibers, and other sensory inputs', src: 'Resp control p.27–35',
    html: '<div class="stack"><div class="tblwrap"><table class="tbl"><thead><tr><th>Receptor</th><th>Location &amp; Vagal Fiber</th><th>Stimulus</th><th>Reflex Response &amp; Clinical Role</th></tr></thead><tbody>' +
      '<tr><td><b>Pulmonary stretch receptors</b> (slowly adapting)</td><td>{{Airway smooth muscle}}; myelinated CN X</td><td>Sustained {{lung inflation / distension}}</td><td><b>{{Hering-Breuer inflation reflex}}</b>: slows respiratory frequency by {{prolonging expiratory time}} (weak in awake adult humans; important in newborns)</td></tr>' +
      '<tr><td><b>Irritant receptors</b> (rapidly adapting)</td><td>{{Airway epithelial cells}}; myelinated CN X</td><td>Noxious gases, smoke, dust, cold air, {{histamine}}</td><td>Reflex bronchoconstriction, coughing, and hyperpnea (contributes to {{asthma attacks}})</td></tr>' +
      '<tr><td><b>J (juxtacapillary) receptors</b></td><td>{{Alveolar walls}} near capillaries (pulmonary circulation); {{nonmyelinated C-fibers}}</td><td>Pulmonary capillary engorgement, {{interstitial edema}} (left heart failure, ILD), chemicals</td><td>{{Rapid, shallow breathing}}, bronchoconstriction, mucus secretion (intense stimulus causes apnea)</td></tr>' +
      '<tr><td><b>Bronchial C-fibers</b></td><td>Airways (supplied by bronchial circulation); nonmyelinated CN X</td><td>Chemicals in bronchial arterial blood</td><td>Rapid shallow breathing, bronchoconstriction, mucus secretion</td></tr></tbody></table></div>' +
      '<ul class="pts"><li><b>Bilateral vagotomy</b> in animals abolishes the Hering-Breuer reflex, producing <b>slow, deep breathing</b>; transient bilateral vagal block in awake humans does not alter quiet breathing rate or volume.</li>' +
      '<li><b>Other receptors</b> (p.35): <b>nose/upper airway</b> (sneezing, coughing, laryngeal spasm); <b>joint &amp; muscle receptors</b> (drive early exercise hyperpnea); <b>gamma system / muscle spindles</b> in diaphragm &amp; intercostals (sense elongation); <b>arterial baroreceptors</b> (increased BP &rarr; {{reflex hypoventilation}}); <b>pain</b> (brief apnea followed by hyperventilation) and <b>skin heating</b> (hyperventilation).</li></ul></div>' },
  { t: 'q', id: 'R7', src: 'Resp control p.31–33', core: true,
    q: 'A patient with acute decompensated left-sided heart failure develops pulmonary capillary engorgement, interstitial edema, and rapid, shallow breathing. Which lung receptor and afferent pathway mediate this breathing pattern?',
    o: ['J (juxtacapillary) receptors in the alveolar walls transmitting via slowly conducting nonmyelinated vagal C-fibers', 'Pulmonary stretch receptors in airway smooth muscle transmitting via fast myelinated vagal fibers', 'Irritant receptors in airway epithelium transmitting via myelinated glossopharyngeal (CN IX) fibers', 'Bronchial C-fibers supplied exclusively by the systemic intercostal arteries via sympathetic afferents', 'Muscle spindles (gamma system) in the diaphragm transmitting via the phrenic nerve'], a: 0,
    ex: 'J (juxtacapillary) receptors lie in the alveolar walls close to the pulmonary capillaries (supplied by the pulmonary circulation) and are the endings of slowly conducting nonmyelinated vagal C-fibers. Pulmonary capillary engorgement and interstitial fluid accumulation in left-sided heart failure or interstitial lung disease stimulate J receptors, causing rapid, shallow breathing (and apnea if intense).' },
  { t: 'q', id: 'R8', src: 'Resp control p.28–30, 35',
    q: 'Which sensory receptor is correctly matched with its location, stimulus, and reflex respiratory effect?',
    o: ['Pulmonary stretch receptors in airway smooth muscle — sustained lung inflation — Hering-Breuer reflex that slows breathing frequency by increasing expiratory time', 'Irritant receptors in alveolar walls — pulmonary edema — slow, deep breathing and bronchodilation', 'Arterial baroreceptors — acute rise in arterial blood pressure — reflex hyperventilation and tachycardia', 'Pulmonary stretch receptors — transient bilateral vagal block in awake adult humans — immediate doubling of tidal volume and apnea', 'Joint and muscle proprioceptors — limb movement during early exercise — reflex apnea followed by hypoventilation'], a: 0,
    ex: 'Pulmonary stretch receptors lie within airway smooth muscle, travel in myelinated vagal fibers, and respond to sustained lung inflation via the Hering-Breuer inflation reflex, which slows respiratory frequency by prolonging expiratory time. High BP at arterial baroreceptors causes reflex hypoventilation; irritant receptors lie in airway epithelium and cause bronchoconstriction/cough/hyperpnea; joint/muscle receptors stimulate ventilation during early exercise.' },

  { t: 'c', id: 'R-C4', title: 'Integrated responses to CO2, O2, pH, exercise, altitude, and CO2 narcosis', src: 'Resp control p.38–51',
    html: '<div class="two"><div class="stack"><ul class="pts"><li><b>Response to CO<sub>2</sub></b>: arterial P<sub>aCO2</sub> is the {{most important stimulus}} to ventilation under normal conditions. Ventilation rises linearly with alveolar P<sub>CO2</sub>; concomitant <b>hypoxemia</b> (low P<sub>O2</sub>) {{increases the slope}} (magnifies the response), whereas <b>sleep, aging, and chronic CO<sub>2</sub> retention</b> reduce it.</li>' +
      '<li><b>Response to O<sub>2</sub></b>: driven {{only by peripheral chemoreceptors}}. At normal P<sub>CO2</sub> (~36 mmHg), ventilation hardly increases until P<sub>aO2</sub> falls below {{~60 mmHg}}; crucial at high altitude and in chronic lung disease.</li>' +
      '<li><b>CO<sub>2</sub> narcosis (p.45)</b>: giving excessive O<sub>2</sub> to a patient with chronic CO<sub>2</sub> retention causes <b>acute-on-chronic respiratory acidosis</b> via two mechanisms: (1) reduced {{hypoxic ventilatory response}} &rarr; <b>hypoventilation</b>, and (2) reduced {{hypoxic pulmonary vasoconstriction}} &rarr; <b>worsened V/Q mismatch</b> &rarr; rising P<sub>aCO2</sub>.</li>' +
      '<li><b>Response to pH</b>: in metabolic acidosis (low pH, low P<sub>aCO2</sub>), H<sup>+</sup> stimulates {{carotid body chemoreceptors}} (not aortic bodies) &rarr; hyperventilation (Kussmaul breathing).</li>' +
      '<li><b>Exercise &amp; High altitude</b>: in moderate exercise, ventilation rises via cortex, limb proprioceptors, and temperature while {{PaO2, PaCO2, and pH remain normal}} (pH drops only in heavy exercise from {{lactic acidosis}}). At high altitude, hypoxemia drives hyperventilation &rarr; {{respiratory alkalosis}}, increased 2,3-DPG, pulmonary arterial constriction (RV hypertrophy), and renal EPO release.</li></ul></div>' +
      CVS.fig('ctrl-co2-po2', 'Linear ventilatory response to alveolar PCO2 showing a steeper slope and leftward shift when alveolar PO2 is lowered from 110 to 47 mmHg.', 'ctrl', 40) + '</div>' },
  { t: 'q', id: 'R9', src: 'Resp control p.44–45', core: true,
    q: 'According to the lecture (p.45), administering excessive supplemental O2 to a patient with chronic CO2 retention precipitates CO2 narcosis (acute-on-chronic respiratory acidosis) through which two primary mechanisms?',
    o: ['Reduction of the hypoxic ventilatory response (causing hypoventilation) and reduction of hypoxic pulmonary vasoconstriction (increasing V/Q mismatch)', 'Direct O2 toxicity to the pre-Botzinger complex and bronchoconstriction via airway irritant receptors', 'Stimulation of arterial baroreceptors (causing reflex apnea) and increased CSF protein buffering', 'Activation of pulmonary stretch receptors (prolonging expiration) and inhibition of renal bicarbonate reabsorption', 'Opening of carotid body O2-sensitive K+ channels and stimulation of J receptors by alveolar collapse'], a: 0,
    ex: 'Slide 45 explicitly highlights two mechanisms of O2-induced CO2 narcosis in chronic CO2 retainers: (1) reduction of the hypoxic ventilatory response -> hypoventilation, and (2) reduction of hypoxic pulmonary vasoconstriction (HPV) -> increased V/Q mismatch -> further rise in PaCO2 and acute-on-top-of-chronic respiratory acidosis.' },
  { t: 'q', id: 'R10', src: 'Resp control p.40, 43', core: true,
    q: 'How does lowering alveolar PO2 (from 110 to 47 mmHg) alter the ventilatory response curve to PaCO2, and below what arterial PO2 threshold does hypoxemia strongly stimulate ventilation when PaCO2 is normal (36 mmHg)?',
    o: ['Hypoxemia increases the slope (magnifies and shifts left) of the linear CO2 response curve; at normal PaCO2, ventilation shows almost no increase until PaO2 falls below about 60 mmHg', 'Hypoxemia decreases the slope of the CO2 response curve; ventilation increases linearly as soon as PaO2 drops below 95 mmHg', 'Hypoxemia shifts the CO2 response curve to the right without changing its slope; ventilation rises only when PaO2 falls below 25 mmHg', 'Hypoxemia converts the linear CO2 response into a flat line; central chemoreceptors trigger hyperventilation at PaO2 < 80 mmHg', 'Hypoxemia has no effect on the CO2 response slope because O2 and CO2 act on completely separate brainstem nuclei'], a: 0,
    ex: 'On p.40, lowering alveolar PO2 from 110 to 47 mmHg magnifies the ventilatory response to CO2 (steeper slope and leftward shift). On p.43, when PCO2 is normal (36 mmHg), almost no increase in ventilation occurs until arterial PO2 is reduced to about 60 mmHg (mediated solely by peripheral chemoreceptors).' },
  { t: 'q', id: 'R11', src: 'Resp control p.48–49',
    q: 'During moderate steady-state exercise, what changes occur in arterial blood gases (PaO2, PaCO2) and arterial pH?',
    o: ['PaO2, PaCO2, and arterial pH all remain normal because ventilation and gas-exchange efficiency increase in proportion to metabolic demand (pH falls only in heavy exercise due to lactic acidosis)', 'PaCO2 rises above 50 mmHg and PaO2 falls below 60 mmHg, stimulating central and peripheral chemoreceptors', 'PaCO2 falls to 20 mmHg and pH rises to 7.60 throughout light and moderate exercise', 'PaO2 doubles while PaCO2 rises and pH drops immediately at exercise onset', 'Arterial pH rises due to lactic alkalosis while PaO2 falls below 50 mmHg'], a: 0,
    ex: 'During moderate exercise (p.48–49), arterial PaO2, PaCO2, and pH remain remarkably normal (no change in PaO2, PaCO2, or pH on the Costanzo chart) because ventilation increases proportionally via motor cortex commands, limb joint/muscle proprioceptors, and body temperature, while V/Q matching improves and physiologic dead space decreases. Arterial pH drops only during heavy exercise from lactic acidosis.' },

  { t: 'c', id: 'R-C5', title: 'Normal and abnormal respiratory patterns', src: 'Resp control p.52–53',
    html: '<div class="stack">' + CVS.fig('ctrl-patterns', 'Normal and abnormal respiratory patterns traced as tidal volume over time.', 'ctrl', 53) +
      '<div class="tblwrap"><table class="tbl"><thead><tr><th>Breathing Pattern</th><th>Waveform Characteristics</th><th>Underlying Mechanism / Lesion</th></tr></thead><tbody>' +
      '<tr><td><b>Eupnea &amp; Sigh</b></td><td>Rhythmic quiet tidal breaths; a <b>sigh</b> is an interspersed {{deep inspiration}} followed by a brief pause</td><td>Normal brainstem pattern generator; sighs reopen collapsed alveoli</td></tr>' +
      '<tr><td><b>Cheyne-Stokes respiration</b></td><td>Regular {{crescendo-decrescendo}} cycles of tidal depth separated by periods of {{apnea}}</td><td>Delayed circulatory feedback (heart failure) or increased chemoreceptor gain (brain damage, altitude)</td></tr>' +
      '<tr><td><b>Apneusis</b></td><td>{{Prolonged inspiratory plateaus}} (cramps) interrupted by brief expirations</td><td>Lesion of the {{pneumotaxic center (upper pons)}} + vagotomy, leaving the apneustic center unopposed</td></tr>' +
      '<tr><td><b>Cluster (Biot) breathing</b></td><td>{{Groups of breaths}} separated by regular or irregular apneic pauses (without waxing-waning)</td><td>Pontine or medullary damage, meningitis, or increased intracranial pressure</td></tr>' +
      '<tr><td><b>Ataxic breathing</b></td><td>Completely {{irregular rate and depth}} of breathing</td><td>Damage to the {{medullary respiratory centers}}</td></tr>' +
      '<tr><td><b>Gasping &amp; Vagal breathing</b></td><td><b>Gasping</b>: isolated {{abrupt inspiratory spikes}} with long pauses; <b>Vagal</b>: slow, deep breaths</td><td>Gasping = severe brainstem hypoxia/agonal; Vagal = bilateral vagotomy (loss of Hering-Breuer reflex)</td></tr></tbody></table></div></div>' },
  { t: 'q', id: 'R12', src: 'Resp control p.8, 11, 53', core: true,
    q: 'Which abnormal respiratory pattern consists of sustained inspiratory plateaus ("inspiratory cramps") interrupted by brief, insufficient expirations, and what brainstem lesion produces it?',
    o: ['Apneusis — rostral pontine lesion damaging the pneumotaxic center (especially with vagal denervation), leaving the lower-pontine apneustic center uninhibited', 'Cheyne-Stokes respiration — lesion of the pre-Botzinger complex causing chaotic irregular breaths', 'Ataxic breathing — isolated lesion of the cerebral cortex with intact pons and medulla', 'Cluster breathing — bilateral carotid body resection abolishing the Hering-Breuer reflex', 'Vagal breathing — overstimulation of the upper-pontine pneumotaxic center'], a: 0,
    ex: 'Apneusis is characterized by prolonged inspiratory plateaus with brief expirations. Because the lower-pontine apneustic center excites inspiration while the upper-pontine pneumotaxic center and vagal stretch afferents switch inspiration off, damaging the upper pons (pneumotaxic center) and vagi produces apneusis.' },
  { t: 'open', id: 'R13', src: 'Resp control p.21–25, 45, 53',
    q: 'Distinguish (1) Cheyne-Stokes respiration, (2) Kussmaul breathing, and (3) ataxic breathing by their breathing waveform and pathophysiologic mechanism.',
    ans: '<b>1. Cheyne-Stokes respiration</b>: smooth <b>crescendo–decrescendo (waxing and waning) tidal volume</b> cycles alternating with <b>apnea</b>; caused by slow circulatory delay between lungs and brain (congestive heart failure) or heightened chemoreceptor controller gain (brain injury, high altitude).<br><b>2. Kussmaul breathing</b>: persistent <b>deep, rapid hyperventilation</b> without apneic pauses; caused by <b>metabolic acidosis</b> (e.g., diabetic ketoacidosis), where elevated arterial H<sup>+</sup> directly stimulates <b>carotid body peripheral chemoreceptors</b> to drive the DRG.<br><b>3. Ataxic breathing</b>: completely <b>irregular, chaotic rate and depth</b> of breaths with unpredictable pauses; caused by direct damage to the <b>medullary respiratory centers</b>.' }
]});

/* Section A: Acid-Base Regulation (681117-2 Acid base regulation Med 2025 student.pdf, 88 slides). */
CVS.add({ id: 'A', short: 'Acid-base', title: 'Acid-Base Regulation', kind: 'Lecture',
  blurb: 'Normal arterial pH, volatile vs fixed acids, the Henderson–Hasselbalch equation, extracellular and intracellular buffers, renal HCO₃⁻ reclamation and new HCO₃⁻ generation, the four primary acid-base disorders with compensation formulas, and the 6-step ABG & anion gap approach.',
  items: [
  { t: 'c', id: 'A-C1', title: 'Arterial pH, acid loads, and the Henderson–Hasselbalch equation', src: 'Acid-base p.4–19',
    html: '<div class="two"><div class="stack"><ul class="pts">' +
      '<li>Normal arterial blood pH is {{7.35–7.45}} (mean 7.40, equivalent to [H⁺] = {{40 nEq/L}}); life-compatible pH spans {{6.80–7.80}}.</li>' +
